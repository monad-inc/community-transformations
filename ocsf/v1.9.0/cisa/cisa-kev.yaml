name: "CISA Known Exploited Vulnerabilities to OCSF v1.9.0"
description: "Transforms CISA Known Exploited Vulnerabilities (KEV) catalog entries into the OCSF v1.9.0 Vulnerability Finding class."
author: "Monad"
contributors:
  - "https://github.com/behobu"
inputs:
  - "cisa-kev"
tags:
  - "v1.9.0"
  - "ocsf"
  - "cisa"
  - "vulnerability"
  - "findings"
config:
  operations:
    - operation: "jq"
      arguments:
        key: ""
        query: |
          # ---------------------------------------------------------------
          # OCSF Vulnerability Finding (class_uid=2002) — v1.9.0
          # Input: one CISA KEV catalog "vulnerabilities[]" entry per record.
          #
          # CISA KEV carries no host/asset/cloud context and no CVSS score —
          # it is a public catalog of actively-exploited CVEs. v1.9.0 marks
          # `osint` and `cloud` as base-required on this class, so both are
          # emitted with minimal, honest values (osint = the CVE indicator;
          # cloud.provider = "Not Applicable", since KEV has no cloud origin).
          # Every KEV entry is, by definition, actively exploited, so
          # is_exploit_available is always true.
          # ---------------------------------------------------------------

          # KEV dates are date-only ("YYYY-MM-DD"); normalize to an ISO
          # instant before parsing to epoch seconds.

          def to_epoch_ms($ts):
            def _n: if . == null then null else tonumber end;
            def _num_ms($n):
              if   $n >= 1e17 then ($n / 1000000 | floor)
              elif $n >= 1e14 then ($n / 1000 | floor)
              elif $n >= 1e11 then ($n | floor)
              else ($n * 1000 + 0.001 | floor) end;
            def _digits_ms($d):
              ($d | ltrimstr("-") | length) as $l
              | if   $l >= 18 then ($d[0:-6] | tonumber)
                elif $l >= 15 then ($d[0:-3] | tonumber)
                elif $l >= 12 then ($d | tonumber)
                else ($d | tonumber) * 1000 end;
            def _frac_ms($f): if $f == null then 0 else (($f + "000")[0:3] | tonumber) end;
            def _mon($m):
              if $m == null then null
              else {"JAN":1,"FEB":2,"MAR":3,"APR":4,"MAY":5,"JUN":6,
                    "JUL":7,"AUG":8,"SEP":9,"OCT":10,"NOV":11,"DEC":12}[$m[0:3]] end;
            def _zone($z):
              if $z == null or $z == "" then 0
              else
                ($z | if test("^(UTC|GMT|UT)[+-]") then sub("^(UTC|GMT|UT)"; "") else . end) as $z
                | if ($z | test("^[+-][0-9]{1,2}(:?[0-9]{2})?$")) then
                    ($z | capture("^(?<sg>[+-])(?<h>[0-9]{1,2}):?(?<m>[0-9]{2})?$")) as $o
                    | (if $o.sg == "-" then -1 else 1 end)
                      * (($o.h | tonumber) * 3600 + (($o.m // "0") | tonumber) * 60)
                  else
                    {"Z":0,"UTC":0,"GMT":0,"UT":0,"EST":-18000,"EDT":-14400,"CST":-21600,
                     "CDT":-18000,"MST":-25200,"MDT":-21600,"PST":-28800,"PDT":-25200}[$z]
                  end
              end;
            def _ms($c):
              ($c.y | tonumber | if . < 100 then (if . < 70 then . + 2000 else . + 1900 end) else . end) as $y
              | ($c.mo | _n) as $mo
              | ($c.d | tonumber) as $d
              | (($c.h // "0") | tonumber) as $h
              | (($c.mi // "0") | tonumber) as $mi
              | (($c.s // "0") | tonumber) as $s
              | _zone($c.z) as $off
              | if $mo == null or $off == null or $mo < 1 or $mo > 12 or $d < 1 or $d > 31
                   or $h > 23 or $mi > 59 or $s > 60 then null
                else
                  ($y - (if $mo <= 2 then 1 else 0 end)) as $yy
                  | ($yy / 400 | floor) as $era
                  | ($yy - $era * 400) as $yoe
                  | (((153 * ($mo + (if $mo > 2 then -3 else 9 end)) + 2) / 5 | floor) + $d - 1) as $doy
                  | ($yoe * 365 + ($yoe / 4 | floor) - ($yoe / 100 | floor) + $doy) as $doe
                  | ($era * 146097 + $doe - 719468) as $days
                  | ($days * 86400 + $h * 3600 + $mi * 60 + $s - $off) * 1000 + _frac_ms($c.f)
                end;
            def _str($raw):
              ($raw | ascii_upcase | sub("\\s*\\([^)]*\\)\\s*$"; "") | sub("^\\s+"; "") | sub("\\s+$"; "")) as $s
              | "(?<z>Z|(?:UTC|GMT|UT)?[+-][0-9]{1,2}(?::?[0-9]{2})?|[A-Z]{1,5})" as $Z
              | "(?<h>[0-9]{1,2}):(?<mi>[0-9]{2})(?::(?<s>[0-9]{2}))?(?:[.,](?<f>[0-9]+))?" as $T
              | if $s == "" then null
                elif ($s | test("^-?[0-9]+$")) then _digits_ms($s)
                elif ($s | test("^[0-9]+\\.[0-9]+$")) then
                  ($s | split(".")) as $p
                  | if ($p[0] | length) <= 11 then _digits_ms($p[0]) + _frac_ms($p[1])
                    else _digits_ms($p[0]) end
                elif ($s | test("^/DATE\\(-?[0-9]+([+-][0-9]{4})?\\)/$")) then
                  ($s | capture("(?<ms>-?[0-9]+)").ms | tonumber)
                else
                  first(
                    ($s | capture("^(?<y>[0-9]{4})[-/](?<mo>[0-9]{1,2})[-/](?<d>[0-9]{1,2})(?:[T ]+" + $T + ")?\\s*" + $Z + "?(?:\\s+[A-Z]{2,5})?$") | _ms(.)),
                    ($s | capture("^(?<y>[0-9]{4})(?<mo>[0-9]{2})(?<d>[0-9]{2})T(?<h>[0-9]{2})(?<mi>[0-9]{2})(?<s>[0-9]{2})(?:[.,](?<f>[0-9]+))?" + $Z + "?$") | _ms(.)),
                    ($s | capture("^(?:[A-Z]+,?\\s+)?(?<d>[0-9]{1,2})[ -](?<mon>[A-Z]{3,9})[ -](?<y>[0-9]{2,4})\\s+" + $T + "\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?:[A-Z]+,?\\s+)?(?<mon>[A-Z]{3,9})\\.?\\s+(?<d>[0-9]{1,2}),?\\s+(?<y>[0-9]{4})(?:,?\\s+" + $T + ")?\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?:[A-Z]+\\s+)?(?<mon>[A-Z]{3,9})\\s+(?<d>[0-9]{1,2})\\s+" + $T + "\\s+(?:" + $Z + "\\s+)?(?<y>[0-9]{4})$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?<d>[0-9]{1,2})/(?<mon>[A-Z]{3})/(?<y>[0-9]{4}):" + $T + "\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.))
                  ) // null
                end;
            if $ts == null then null
            elif ($ts | type) == "number" then _num_ms($ts)
            elif ($ts | type) == "string" then _str($ts)
            elif ($ts | type) == "object" then
              if   $ts["$date"] != null then to_epoch_ms($ts["$date"])
              elif $ts["$numberLong"] != null then to_epoch_ms($ts["$numberLong"])
              elif $ts.seconds != null then
                ($ts.seconds | tostring | tonumber) * 1000
                + ((($ts.nanos // 0) | tostring | tonumber) / 1000000 | floor)
              else null end
            else null end;

          def trim: if . == null then null else (. | gsub("^\\s+|\\s+$"; "")) end;

          . as $r |
          # `notes` is a free-text field that usually holds one or more
          # reference URLs separated by " ; ". Split into a clean list.
          ( (($r.notes // "") | split(";") | map(trim) | map(select(. != "" and (startswith("http")))) )) as $refs |
          ($r.cveID) as $cve |

          # KEV has no CVSS; ransomware-linked KEV entries are treated as the
          # most urgent (Critical), the rest as High — all KEV are exploited.
          (if (($r.knownRansomwareCampaignUse // "") | ascii_downcase) == "known"
             then 5 else 4 end) as $sev_id |
          ({"5":"Critical","4":"High"}[$sev_id|tostring]) as $sev_label |

          {
            # --- Classification (REQUIRED) ---
            "category_uid": 2,
            "class_uid": 2002,
            "type_uid": 200201,
            "activity_id": 1,

            # --- Severity (REQUIRED) ---
            "severity_id": $sev_id,
            "severity": $sev_label,

            # --- Time (REQUIRED): the date CISA added the CVE to the catalog ---
            "time": to_epoch_ms($r.dateAdded),

            # --- Metadata (REQUIRED) ---
            "metadata": {
                "profiles": ["cloud", "osint"],
              "version": "1.9.0",
              "product": {
                "vendor_name": "CISA",
                "name": "CISA Known Exploited Vulnerabilities Catalog"
              }
            },

            # --- Vulnerabilities (REQUIRED). One CVE per KEV entry; the
            #     `vulnerability` object carries a just_one:[advisory,cve,cwe]
            #     constraint, so only `cve` is populated here. CWEs are
            #     preserved in raw_data. ---
            "vulnerabilities": [
              {
                "title": $r.vulnerabilityName,
                "desc": $r.shortDescription,
                "severity": $sev_label,
                "references": $refs,
                "is_exploit_available": true,
                "vendor_name": $r.vendorProject,
                "first_seen_time": to_epoch_ms($r.dateAdded),
                "remediation": {
                  "desc": ($r.requiredAction // "Apply updates per vendor instructions.")
                },
                "cve": {
                  "uid": $cve,
                  "references": $refs,
                  "created_time": to_epoch_ms($r.dateAdded)
                }
              }
            ],

            # --- OSINT (REQUIRED in v1.9.0): the CVE as an indicator. ---
            "osint": [
              {
                "value": $cve,
                "type_id": 99,
                "type": "CVE"
              }
            ],

            # --- Cloud (REQUIRED in v1.9.0): KEV has no cloud origin. ---
            "cloud": {
              "provider": "Not Applicable"
            },

            # --- Finding Info (REQUIRED) ---
            "finding_info": {
              "uid": $cve,
              "title": $r.vulnerabilityName,
              "desc": $r.shortDescription,
              "created_time": to_epoch_ms($r.dateAdded),
              "src_url": ($refs | first),
              "types": ["Vulnerability"]
            },

            # --- Recommended: message + status (KEV entries are open/known) ---
            "message": $r.vulnerabilityName,
            "status": "New",
            "status_id": 1,

            # --- Recommended: observables (natural pivots) ---
            "observables": [
              { "name": "vulnerabilities.cve.uid", "type": "CVE Object: uid", "type_id": 18, "value": $cve }
            ],

            # --- Original record for audit / debugging (retains cwes, dueDate,
            #     product, knownRansomwareCampaignUse) ---
            "raw_data": ($r | tostring)
          }
          # Drop keys that resolved to null (OCSF rejects null-typed values).
          | del(.. | nulls)
