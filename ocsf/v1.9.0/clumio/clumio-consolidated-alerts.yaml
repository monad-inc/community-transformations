name: "Clumio Consolidated Alerts to OCSF v1.9.0"
description: "Transforms Clumio consolidated alert records into the OCSF v1.9.0 Detection Finding class (class_uid 2004)."
author: "Monad"
contributors:
  - "https://github.com/behobu"
inputs:
  - "clumio-consolidated-alerts"
tags:
  - "v1.9.0"
  - "ocsf"
  - "clumio"
  - "findings"
config:
  operations:
    - operation: "jq"
      arguments:
        key: ""
        query: |
          # ---------------------------------------------------------------
          # OCSF Detection Finding (class_uid=2004) — v1.9.0
          # Input: one Clumio consolidated alert record per invocation.
          # ---------------------------------------------------------------
          def to_epoch_ms($ts):
            def _num_ms($n):
              if   $n >= 1e17 then ($n / 1000000 | floor)
              elif $n >= 1e14 then ($n / 1000 | floor)
              elif $n >= 1e11 then ($n | floor)
              else ($n * 1000 | floor) end;
            if $ts == null or $ts == "" then null
            elif ($ts | type) == "number" then _num_ms($ts)
            elif ($ts | type) == "object" then
              (if ($ts.seconds // null) == null then null
               else ($ts.seconds * 1000 + ((($ts.nanos // 0) / 1000000) | floor)) end)
            elif ($ts | type) == "string" then
              if ($ts | test("^-?[0-9]+(\\.[0-9]+)?$")) then _num_ms($ts | tonumber)
              else
                ([$ts | ascii_upcase | capture("^(?<d>[0-9]{4}-[0-9]{2}-[0-9]{2})(?:[T ](?<t>[0-9]{2}:[0-9]{2}(?::[0-9]{2})?)(?:[.,](?<f>[0-9]+))?)? ?(?<z>Z|UTC|[+-][0-9]{2}(?::?[0-9]{2})?)?$")] | first) as $m
                | if $m == null then null
                  else
                    (($m.t // "00:00:00") | if length == 5 then . + ":00" else . end) as $t
                    | (($m.z // "Z") | if . == "Z" or . == "UTC" then 0
                        else (.[1:] | gsub(":"; "")) as $o
                          | ((if (.[0:1]) == "-" then -1 else 1 end)
                             * (($o[0:2] | tonumber) * 3600 + ((if ($o | length) >= 4 then $o[2:4] else "00" end) | tonumber) * 60))
                        end) as $off
                    | ((($m.d + "T" + $t + "Z") | fromdateiso8601) - $off) * 1000
                      + (((($m.f // "") + "000")[0:3]) | tonumber)
                  end
              end
            else null end;

          . as $r
          | ($r.parent_entity // {}) as $pe
          | ($r.details // {}) as $d
          |           # severity: Clumio "error" -> High(4), "warning" -> Medium(3)
          ( { "error": 4, "warning": 3 }[($r.severity // "" | ascii_downcase)] // 0 ) as $sev
          # status: "active" -> New(1); "cleared" -> Resolved(4)
          | ( { "active": 1, "cleared": 4 }[($r.status // "" | ascii_downcase)] // 0 ) as $stat
          # activity: cleared alert -> Close(3); otherwise Update(2) if updated after raised, else Create(1)
          | ( if ($r.status // "" | ascii_downcase) == "cleared" then 3
              elif ($r.updated_timestamp // "") != "" and ($r.updated_timestamp != $r.raised_timestamp) then 2
              else 1 end ) as $act
          | {
              "category_uid": 2,
              "class_uid": 2004,
              "activity_id": $act,
              "type_uid": (2004 * 100 + $act),
              "severity_id": $sev,
              "status_id": $stat,
              "status_detail": ($r.status // null),
              "time": to_epoch_ms($r.updated_timestamp // $r.raised_timestamp),
              "message": ($d.cause // $r.cause // $r.type // null),
              "is_alert": true,
              "count": (($r.active_entity_count // 0) + ($r.cleared_entity_count // 0)),
              "start_time": to_epoch_ms($r.raised_timestamp),
              "end_time": to_epoch_ms($r.cleared_timestamp),
              "metadata": {
                "version": "1.9.0",
                "product": {
                  "vendor_name": "Clumio",
                  "name": "Clumio"
                },
                "uid": ($r.id // null),
                "log_provider": "Clumio",
                "profiles": [ "cloud", "osint" ]
              },
              "cloud": {
                "provider": "AWS"
              },
              "finding_info": {
                "uid": ($r.id // "unknown"),
                "title": (($r.type // "alert") + ": " + ($r.cause // "unknown")),
                "desc": ($d.cause // $r.cause // null),
                "types": ([ $r.type ] | map(select(. != null and . != ""))),
                "first_seen_time": to_epoch_ms($r.raised_timestamp),
                "last_seen_time": to_epoch_ms($r.updated_timestamp // $r.raised_timestamp)
              },
              "osint": [
                {
                  "type_id": 99,
                  "value": ($pe.value // $pe.id // $r.id // "unknown")
                }
              ],
              "resources": ([
                {
                  "uid": ($pe.id // null),
                  "name": ($pe.value // null),
                  "type": ($pe.type // null)
                } | with_entries(select(.value != null))
              ] | map(select(. != {}))),
              "unmapped": {
                "cause": ($r.cause // null),
                "details_type": ($d.type // null),
                "active_entity_count": ($r.active_entity_count // null),
                "cleared_entity_count": ($r.cleared_entity_count // null),
                "notes": ($r.notes // null),
                "etag": ($r._etag // null)
              },
              "raw_data": ($r | tostring)
            }
          | walk( if type == "object" then with_entries(select(.value != null and .value != "" and .value != [] and .value != {})) else . end )
