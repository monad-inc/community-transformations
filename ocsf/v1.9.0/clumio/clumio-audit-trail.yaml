name: "Clumio Audit Trail to OCSF v1.9.0"
description: "Transforms Clumio Audit Trail records into the OCSF v1.9.0 API Activity (class_uid 6003) class, mapping the acting user, the performed action, the affected Clumio/cloud entity, and success/failure status."
author: "Monad"
contributors:
  - "https://github.com/behobu"
inputs:
  - "clumio-audit-trail"
tags:
  - "v1.9.0"
  - "ocsf"
  - "clumio"
  - "application"
  - "audit"
config:
  operations:
    - operation: "jq"
      arguments:
        key: ""
        query: |
          # ---------------------------------------------------------------
          # OCSF API Activity (class_uid=6003, category_uid=6) — v1.9.0
          # Input: ONE Clumio Audit Trail record per invocation, as returned
          # by GET /audit-trails (the clumio-audit-trail input connector).
          #
          # Clumio audit records are administrative CRUD actions issued
          # through the Clumio UI or REST API (create/update/delete of
          # policies, users, SSO/MFA settings, org units; login/logout;
          # apply/remove protection). That maps cleanly to OCSF API Activity.
          #
          # Field mappings:
          #   .action                 -> activity_id + api.operation
          #   .status                 -> status_id / severity_id / outcome
          #   .timestamp (RFC-3339)   -> time
          #   .user_email             -> actor.user (name / email_addr)
          #   .ip_address             -> src_endpoint.ip
          #   .category               -> api.service.name
          #   .primary_entity         -> resources[0] + cloud.provider
          #   .id                     -> metadata.uid / api.request.uid
          # ---------------------------------------------------------------


          def to_epoch_ms($ts):
            def _n: if . == null then null else tonumber end;
            def _num_ms($n):
              if   $n >= 1e17 then ($n / 1000000 | floor)
              elif $n >= 1e14 then ($n / 1000 | floor)
              elif $n >= 1e11 then ($n | floor)
              else ($n * 1000 + 0.001 | floor) end;
            def _digits_ms($d):
              ($d | ltrimstr("-") | length) as $l
              | if   $l >= 18 then ($d[0:-6] | tonumber)
                elif $l >= 15 then ($d[0:-3] | tonumber)
                elif $l >= 12 then ($d | tonumber)
                else ($d | tonumber) * 1000 end;
            def _frac_ms($f): if $f == null then 0 else (($f + "000")[0:3] | tonumber) end;
            def _mon($m):
              if $m == null then null
              else {"JAN":1,"FEB":2,"MAR":3,"APR":4,"MAY":5,"JUN":6,
                    "JUL":7,"AUG":8,"SEP":9,"OCT":10,"NOV":11,"DEC":12}[$m[0:3]] end;
            def _zone($z):
              if $z == null or $z == "" then 0
              else
                ($z | if test("^(UTC|GMT|UT)[+-]") then sub("^(UTC|GMT|UT)"; "") else . end) as $z
                | if ($z | test("^[+-][0-9]{1,2}(:?[0-9]{2})?$")) then
                    ($z | capture("^(?<sg>[+-])(?<h>[0-9]{1,2}):?(?<m>[0-9]{2})?$")) as $o
                    | (if $o.sg == "-" then -1 else 1 end)
                      * (($o.h | tonumber) * 3600 + (($o.m // "0") | tonumber) * 60)
                  else
                    {"Z":0,"UTC":0,"GMT":0,"UT":0,"EST":-18000,"EDT":-14400,"CST":-21600,
                     "CDT":-18000,"MST":-25200,"MDT":-21600,"PST":-28800,"PDT":-25200}[$z]
                  end
              end;
            def _ms($c):
              ($c.y | tonumber | if . < 100 then (if . < 70 then . + 2000 else . + 1900 end) else . end) as $y
              | ($c.mo | _n) as $mo
              | ($c.d | tonumber) as $d
              | (($c.h // "0") | tonumber) as $h
              | (($c.mi // "0") | tonumber) as $mi
              | (($c.s // "0") | tonumber) as $s
              | _zone($c.z) as $off
              | if $mo == null or $off == null or $mo < 1 or $mo > 12 or $d < 1 or $d > 31
                   or $h > 23 or $mi > 59 or $s > 60 then null
                else
                  ($y - (if $mo <= 2 then 1 else 0 end)) as $yy
                  | ($yy / 400 | floor) as $era
                  | ($yy - $era * 400) as $yoe
                  | (((153 * ($mo + (if $mo > 2 then -3 else 9 end)) + 2) / 5 | floor) + $d - 1) as $doy
                  | ($yoe * 365 + ($yoe / 4 | floor) - ($yoe / 100 | floor) + $doy) as $doe
                  | ($era * 146097 + $doe - 719468) as $days
                  | ($days * 86400 + $h * 3600 + $mi * 60 + $s - $off) * 1000 + _frac_ms($c.f)
                end;
            def _str($raw):
              ($raw | ascii_upcase | sub("\\s*\\([^)]*\\)\\s*$"; "") | sub("^\\s+"; "") | sub("\\s+$"; "")) as $s
              | "(?<z>Z|(?:UTC|GMT|UT)?[+-][0-9]{1,2}(?::?[0-9]{2})?|[A-Z]{1,5})" as $Z
              | "(?<h>[0-9]{1,2}):(?<mi>[0-9]{2})(?::(?<s>[0-9]{2}))?(?:[.,](?<f>[0-9]+))?" as $T
              | if $s == "" then null
                elif ($s | test("^-?[0-9]+$")) then _digits_ms($s)
                elif ($s | test("^[0-9]+\\.[0-9]+$")) then
                  ($s | split(".")) as $p
                  | if ($p[0] | length) <= 11 then _digits_ms($p[0]) + _frac_ms($p[1])
                    else _digits_ms($p[0]) end
                elif ($s | test("^/DATE\\(-?[0-9]+([+-][0-9]{4})?\\)/$")) then
                  ($s | capture("(?<ms>-?[0-9]+)").ms | tonumber)
                else
                  first(
                    ($s | capture("^(?<y>[0-9]{4})[-/](?<mo>[0-9]{1,2})[-/](?<d>[0-9]{1,2})(?:[T ]+" + $T + ")?\\s*" + $Z + "?(?:\\s+[A-Z]{2,5})?$") | _ms(.)),
                    ($s | capture("^(?<y>[0-9]{4})(?<mo>[0-9]{2})(?<d>[0-9]{2})T(?<h>[0-9]{2})(?<mi>[0-9]{2})(?<s>[0-9]{2})(?:[.,](?<f>[0-9]+))?" + $Z + "?$") | _ms(.)),
                    ($s | capture("^(?:[A-Z]+,?\\s+)?(?<d>[0-9]{1,2})[ -](?<mon>[A-Z]{3,9})[ -](?<y>[0-9]{2,4})\\s+" + $T + "\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?:[A-Z]+,?\\s+)?(?<mon>[A-Z]{3,9})\\.?\\s+(?<d>[0-9]{1,2}),?\\s+(?<y>[0-9]{4})(?:,?\\s+" + $T + ")?\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?:[A-Z]+\\s+)?(?<mon>[A-Z]{3,9})\\s+(?<d>[0-9]{1,2})\\s+" + $T + "\\s+(?:" + $Z + "\\s+)?(?<y>[0-9]{4})$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?<d>[0-9]{1,2})/(?<mon>[A-Z]{3})/(?<y>[0-9]{4}):" + $T + "\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.))
                  ) // null
                end;
            if $ts == null then null
            elif ($ts | type) == "number" then _num_ms($ts)
            elif ($ts | type) == "string" then _str($ts)
            elif ($ts | type) == "object" then
              if   $ts["$date"] != null then to_epoch_ms($ts["$date"])
              elif $ts["$numberLong"] != null then to_epoch_ms($ts["$numberLong"])
              elif $ts.seconds != null then
                ($ts.seconds | tostring | tonumber) * 1000
                + ((($ts.nanos // 0) | tostring | tonumber) / 1000000 | floor)
              else null end
            else null end;

          . as $r
          | ($r.action // "" | ascii_downcase) as $act
          | ($r.status // "" | ascii_downcase) as $st
          | ($r.primary_entity // {}) as $pe
          | ($r.parent_entity // {}) as $par
          | (($pe.type // "") | ascii_downcase) as $petype

          # ---- activity_id (CRUD) from the Clumio action ------------------
          | ( if ($act | test("^(create|register)$")) then 1        # Create
              elif ($act | test("^(browse|search)$")) then 2        # Read
              elif ($act | test("^(update|enable|disable|apply|remove)$")) then 3  # Update
              elif ($act | test("^(delete|unregister)$")) then 4    # Delete
              else 99 end ) as $activity_id                          # Other (login/logout/etc.)

          # ---- status -> status_id / severity -----------------------------
          | ( if $st == "success" then 1
              elif $st == "failure" then 2
              elif $st == "partial_success" then 99
              else 0 end ) as $status_id
          | ( if $st == "failure" then 3          # Medium
              elif $st == "partial_success" then 2 # Low
              else 1 end ) as $severity_id         # Informational

          # ---- cloud provider inferred from the affected asset type -------
          | ( if ($petype | startswith("aws")) then "AWS"
              elif ($petype | startswith("azure")) then "Azure"
              elif ($petype | startswith("gcp")) then "GCP"
              elif ($petype | test("^(microsoft365|m365|mssql|dynamo)")) then "Microsoft"
              else "Clumio" end ) as $provider

          | {
              "category_uid": 6,
              "category_name": "Application Activity",
              "class_uid": 6003,
              "class_name": "API Activity",
              "type_uid": (6003 * 100 + $activity_id),
              "activity_id": $activity_id,
              "activity_name": ( { "1":"Create","2":"Read","3":"Update","4":"Delete","99":"Other" }[$activity_id|tostring] // "Other" ),
              "severity_id": $severity_id,

              "time": to_epoch_ms($r.timestamp),

              "status_id": $status_id,
              "status": ( { "1":"Success","2":"Failure","99":"Other" }[$status_id|tostring] // "Unknown" ),
              "status_detail": ($r.status // null),

              "metadata": {
                "profiles": ["cloud", "osint"],
                "version": "1.9.0",
                "uid": ($r.id // null),
                "product": {
                  "vendor_name": "Clumio",
                  "name": "Clumio Audit Trail"
                }
              },

              # OCSF requires osint on API Activity; Clumio audit records
              # carry no threat-intel indicators, so emit an empty array.
              "osint": [],

              "cloud": { "provider": $provider },

              "actor": {
                "user": {
                  "name": ($r.user_email // null),
                  "email_addr": ($r.user_email // null),
                  "type_id": 1
                }
              },

              "api": {
                "operation": ($r.action // "unknown"),
                "service": { "name": ($r.category // null) },
                "request": { "uid": ($r.id // null) }
              },

              "src_endpoint": { "ip": ($r.ip_address // null) },

              "resources": [
                {
                  "uid": ($pe.id // null),
                  "type": ($pe.type // null),
                  "name": ($pe.value // null),
                  "owner": ( if ($par.value // null) != null
                             then { "name": $par.value } else null end )
                }
              ],

              "message": ( "\($r.user_email // "unknown") \($r.action // "acted") \($r.category // "") \($pe.value // "" | tostring)" ),

              "unmapped": {
                "interface": ($r.interface // null),
                "parent_entity": ($par | if . == {} then null else . end),
                "details_json": ($r.details_json // null)
              },

              "raw_data": ($r | tostring)
            }
          # Drop null/empty leaves while preserving required objects.
          | walk(
              if type == "object" then with_entries(select(.value != null and .value != {} and .value != ""))
              elif type == "array" then map(select(. != null))
              else . end
            )
