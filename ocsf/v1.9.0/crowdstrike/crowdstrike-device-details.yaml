name: "Crowdstrike Device Details to OCSF v1.9.0"
description: "Transforms CrowdStrike Falcon device details records into the OCSF v1.9.0 Device Inventory Info (5001) class."
author: "Monad"
contributors:
  - "https://github.com/behobu"
  - "https://github.com/Credgate"
inputs:
  - "crowdstrike-device-details"
tags:
  - "v1.9.0"
  - "ocsf"
  - "crowdstrike"
  - "device"
  - "inventory"
config:
  operations:
    - operation: "jq"
      arguments:
        key: ""
        query: |
          # =================================================================
          # CrowdStrike Falcon device details -> OCSF v1.9.0
          #   Device Inventory Info (class_uid 5001, category_uid 5 Discovery)
          #
          # One device record per invocation, as emitted by the Monad
          # `crowdstrike-device-details` input connector (Falcon Hosts API
          # /devices/entities/devices/v2). This is a collected inventory
          # snapshot, so activity_id = 2 (Collect), type_uid = 500102.
          # =================================================================

          # CrowdStrike stamps ISO-8601 timestamps with a trailing Z and, on
          # some fields, fractional seconds. OCSF `time`/`*_time` are integer
          # epoch SECONDS, so strip the fraction + Z before strptime.

          def to_epoch_ms($ts):
            def _n: if . == null then null else tonumber end;
            def _num_ms($n):
              if   $n >= 1e17 then ($n / 1000000 | floor)
              elif $n >= 1e14 then ($n / 1000 | floor)
              elif $n >= 1e11 then ($n | floor)
              else ($n * 1000 + 0.001 | floor) end;
            def _digits_ms($d):
              ($d | ltrimstr("-") | length) as $l
              | if   $l >= 18 then ($d[0:-6] | tonumber)
                elif $l >= 15 then ($d[0:-3] | tonumber)
                elif $l >= 12 then ($d | tonumber)
                else ($d | tonumber) * 1000 end;
            def _frac_ms($f): if $f == null then 0 else (($f + "000")[0:3] | tonumber) end;
            def _mon($m):
              if $m == null then null
              else {"JAN":1,"FEB":2,"MAR":3,"APR":4,"MAY":5,"JUN":6,
                    "JUL":7,"AUG":8,"SEP":9,"OCT":10,"NOV":11,"DEC":12}[$m[0:3]] end;
            def _zone($z):
              if $z == null or $z == "" then 0
              else
                ($z | if test("^(UTC|GMT|UT)[+-]") then sub("^(UTC|GMT|UT)"; "") else . end) as $z
                | if ($z | test("^[+-][0-9]{1,2}(:?[0-9]{2})?$")) then
                    ($z | capture("^(?<sg>[+-])(?<h>[0-9]{1,2}):?(?<m>[0-9]{2})?$")) as $o
                    | (if $o.sg == "-" then -1 else 1 end)
                      * (($o.h | tonumber) * 3600 + (($o.m // "0") | tonumber) * 60)
                  else
                    {"Z":0,"UTC":0,"GMT":0,"UT":0,"EST":-18000,"EDT":-14400,"CST":-21600,
                     "CDT":-18000,"MST":-25200,"MDT":-21600,"PST":-28800,"PDT":-25200}[$z]
                  end
              end;
            def _ms($c):
              ($c.y | tonumber | if . < 100 then (if . < 70 then . + 2000 else . + 1900 end) else . end) as $y
              | ($c.mo | _n) as $mo
              | ($c.d | tonumber) as $d
              | (($c.h // "0") | tonumber) as $h
              | (($c.mi // "0") | tonumber) as $mi
              | (($c.s // "0") | tonumber) as $s
              | _zone($c.z) as $off
              | if $mo == null or $off == null or $mo < 1 or $mo > 12 or $d < 1 or $d > 31
                   or $h > 23 or $mi > 59 or $s > 60 then null
                else
                  ($y - (if $mo <= 2 then 1 else 0 end)) as $yy
                  | ($yy / 400 | floor) as $era
                  | ($yy - $era * 400) as $yoe
                  | (((153 * ($mo + (if $mo > 2 then -3 else 9 end)) + 2) / 5 | floor) + $d - 1) as $doy
                  | ($yoe * 365 + ($yoe / 4 | floor) - ($yoe / 100 | floor) + $doy) as $doe
                  | ($era * 146097 + $doe - 719468) as $days
                  | ($days * 86400 + $h * 3600 + $mi * 60 + $s - $off) * 1000 + _frac_ms($c.f)
                end;
            def _str($raw):
              ($raw | ascii_upcase | sub("\\s*\\([^)]*\\)\\s*$"; "") | sub("^\\s+"; "") | sub("\\s+$"; "")) as $s
              | "(?<z>Z|(?:UTC|GMT|UT)?[+-][0-9]{1,2}(?::?[0-9]{2})?|[A-Z]{1,5})" as $Z
              | "(?<h>[0-9]{1,2}):(?<mi>[0-9]{2})(?::(?<s>[0-9]{2}))?(?:[.,](?<f>[0-9]+))?" as $T
              | if $s == "" then null
                elif ($s | test("^-?[0-9]+$")) then _digits_ms($s)
                elif ($s | test("^[0-9]+\\.[0-9]+$")) then
                  ($s | split(".")) as $p
                  | if ($p[0] | length) <= 11 then _digits_ms($p[0]) + _frac_ms($p[1])
                    else _digits_ms($p[0]) end
                elif ($s | test("^/DATE\\(-?[0-9]+([+-][0-9]{4})?\\)/$")) then
                  ($s | capture("(?<ms>-?[0-9]+)").ms | tonumber)
                else
                  first(
                    ($s | capture("^(?<y>[0-9]{4})[-/](?<mo>[0-9]{1,2})[-/](?<d>[0-9]{1,2})(?:[T ]+" + $T + ")?\\s*" + $Z + "?(?:\\s+[A-Z]{2,5})?$") | _ms(.)),
                    ($s | capture("^(?<y>[0-9]{4})(?<mo>[0-9]{2})(?<d>[0-9]{2})T(?<h>[0-9]{2})(?<mi>[0-9]{2})(?<s>[0-9]{2})(?:[.,](?<f>[0-9]+))?" + $Z + "?$") | _ms(.)),
                    ($s | capture("^(?:[A-Z]+,?\\s+)?(?<d>[0-9]{1,2})[ -](?<mon>[A-Z]{3,9})[ -](?<y>[0-9]{2,4})\\s+" + $T + "\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?:[A-Z]+,?\\s+)?(?<mon>[A-Z]{3,9})\\.?\\s+(?<d>[0-9]{1,2}),?\\s+(?<y>[0-9]{4})(?:,?\\s+" + $T + ")?\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?:[A-Z]+\\s+)?(?<mon>[A-Z]{3,9})\\s+(?<d>[0-9]{1,2})\\s+" + $T + "\\s+(?:" + $Z + "\\s+)?(?<y>[0-9]{4})$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?<d>[0-9]{1,2})/(?<mon>[A-Z]{3})/(?<y>[0-9]{4}):" + $T + "\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.))
                  ) // null
                end;
            if $ts == null then null
            elif ($ts | type) == "number" then _num_ms($ts)
            elif ($ts | type) == "string" then _str($ts)
            elif ($ts | type) == "object" then
              if   $ts["$date"] != null then to_epoch_ms($ts["$date"])
              elif $ts["$numberLong"] != null then to_epoch_ms($ts["$numberLong"])
              elif $ts.seconds != null then
                ($ts.seconds | tostring | tonumber) * 1000
                + ((($ts.nanos // 0) | tostring | tonumber) / 1000000 | floor)
              else null end
            else null end;

          . as $r
          | {
              # ---- classification (required) ----
              "activity_id": 2,
              "activity_name": "Collect",
              "category_uid": 5,
              "category_name": "Discovery",
              "class_uid": 5001,
              "class_name": "Device Inventory Info",
              "type_uid": 500102,
              "type_name": "Device Inventory Info: Collect",
              "severity_id": 1,
              "severity": "Informational",
              "time": to_epoch_ms($r.agent_local_time),
              "status": "Success",
              "status_id": 1,

              # ---- metadata (required: product, version) ----
              "metadata": {
                "profiles": ["cloud", "osint"],
                "version": "1.9.0",
                "product": {
                  "name": "Falcon",
                  "vendor_name": "CrowdStrike",
                  "version": $r.agent_version,
                  "feature": {
                    "name": "Endpoint Detection and Response"
                  }
                },
                "original_time": $r.agent_local_time
              },

              # ---- osint (required in 1.9.0; no threat-intel in an inventory
              #      snapshot, so emit an empty array honestly) ----
              "osint": [],

              # ---- cloud (required in 1.9.0). CrowdStrike reports the hosting
              #      cloud for cloud-provisioned sensors via service_provider. ----
              "cloud": {
                "provider": ($r.service_provider // "Unknown"),
                "account": (
                  if $r.service_provider_account_id
                  then { "uid": $r.service_provider_account_id } else null end
                )
              },

              # ---- device (required object; type_id required) ----
              # OCSF device.type_id: 1=Server, 2=Desktop, 3=Laptop, 5=Mobile.
              # CrowdStrike "Workstation" is a desktop/laptop endpoint (Desktop);
              # keep the vendor term in unmapped.
              "device": {
                "type_id": (
                  if $r.product_type_desc == "Workstation" then 2
                  elif $r.product_type_desc == "Server" then 1
                  elif $r.product_type_desc == "Mobile" then 5
                  else 99
                  end
                ),
                "type": (
                  if $r.product_type_desc == "Workstation" then "Desktop"
                  elif $r.product_type_desc == "Server" then "Server"
                  elif $r.product_type_desc == "Mobile" then "Mobile"
                  else "Other"
                  end
                ),
                "uid": $r.device_id,
                "hostname": $r.hostname,
                "name": $r.hostname,
                "domain": $r.machine_domain,
                "ip": $r.local_ip,
                "mac": $r.mac_address,
                "instance_uid": $r.instance_id,
                "vendor_name": "CrowdStrike",
                "first_seen_time": to_epoch_ms($r.first_seen),
                "last_seen_time": to_epoch_ms($r.last_seen),
                "modified_time": to_epoch_ms($r.modified_timestamp),
                "is_managed": ($r.provision_status == "Provisioned"),

                "network_interfaces": ([
                  {
                    "type_id": 0,
                    "hostname": $r.hostname,
                    "ip": $r.local_ip,
                    "mac": $r.mac_address,
                    "name": $r.interface_name
                  },
                  (if $r.external_ip then {
                     "type_id": 0,
                     "hostname": $r.hostname,
                     "ip": $r.external_ip,
                     "mac": $r.mac_address,
                     "name": $r.interface_name
                   } else empty end)
                ]),

                "hw_info": {
                  "bios_manufacturer": $r.bios_manufacturer,
                  "bios_ver": $r.bios_version,
                  "chassis": $r.chassis_type_desc,
                  "serial_number": $r.serial_number,
                  "vendor_name": $r.system_manufacturer
                },

                "os": {
                  "name": $r.os_version,
                  "type_id": (
                    if $r.platform_name == "Mac" then 300
                    elif $r.platform_name == "Windows" then 100
                    elif $r.platform_name == "Linux" then 200
                    else 0
                    end
                  ),
                  "type": $r.platform_name,
                  "version": $r.os_version,
                  "build": $r.os_build,
                  "kernel_release": $r.kernel_version
                }
              },

              "raw_data": ($r | tostring),

              "unmapped": {
                "product_type_desc": $r.product_type_desc,
                "system_product_name": $r.system_product_name,
                "cpu_signature": $r.cpu_signature,
                "agent_load_flags": $r.agent_load_flags,
                "config_id_base": $r.config_id_base,
                "config_id_build": $r.config_id_build,
                "config_id_platform": $r.config_id_platform,
                "platform_id": $r.platform_id,
                "reduced_functionality_mode": $r.reduced_functionality_mode,
                "provision_status": $r.provision_status,
                "status": $r.status,
                "cid": $r.cid,
                "tags": $r.tags,
                "groups": $r.groups,
                "device_policies": $r.device_policies
              }
            }
