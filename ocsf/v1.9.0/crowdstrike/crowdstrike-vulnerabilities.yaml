name: "CrowdStrike Vulnerability Findings to OCSF v1.9.0"
description: "Transforms CrowdStrike Spotlight Vulnerability Findings records into the OCSF v1.9.0 Vulnerability Finding (class_uid 2002) class."
# author is ALWAYS "Monad" — never a person. You are a contributor.
author: "Monad"
contributors:
  - "https://github.com/behobu"
inputs:
  - "crowdstrike-vulnerabilities"
  - "crowdstrike-vulnerabilities-cron"
tags:
  - "v1.9.0"
  - "ocsf"
  - "crowdstrike"
  - "vulnerability"
  - "findings"
config:
  operations:
    - operation: "jq"
      arguments:
        key: ""
        query: |
          # ---------------------------------------------------------------
          # OCSF Vulnerability Finding (class_uid=2002) — v1.9.0
          # Input: one CrowdStrike Spotlight vulnerability record per
          # invocation, as emitted by the `crowdstrike-vulnerabilities`
          # input connector.
          #
          # v1.9.0 promotes `osint` and `cloud` to REQUIRED on this class
          # (they were optional in the ported v1.5.0 transform), so both are
          # always populated here.
          # ---------------------------------------------------------------
          # OCSF status_id from a source status word (case-insensitive; "_"/"-" read as
          # spaces) or boolean. $kind picks the class's enum:
          #   "event"    - activity classes: 1 Success, 2 Failure
          #   "finding"  - finding classes (OCSF 1.1.0+): 1 New, 2 In Progress,
          #                3 Suppressed, 4 Resolved. Archived (5) and Deleted (6) exist
          #                only in newer versions, so they map to 99; set them explicitly
          #                when the target version has them.
          #   "incident" - Incident Finding: 1 New, 2 In Progress, 3 On Hold,
          #                4 Resolved, 5 Closed
          # 0 for null/empty/"unknown"; 99 for unrecognized values; null for an unknown $kind.
          def status_to_id($s; $kind):
            ($s | if type == "string" then ascii_downcase | gsub("[\\s_-]+"; " ") | sub("^ "; "") | sub(" $"; "")
                  elif type == "boolean" then tostring else null end) as $l
            | {"event": {"success":1,"succeeded":1,"successful":1,"ok":1,"pass":1,"passed":1,
                         "allow":1,"allowed":1,"accepted":1,"complete":1,"completed":1,"true":1,
                         "failure":2,"failed":2,"fail":2,"error":2,"deny":2,"denied":2,
                         "blocked":2,"rejected":2,"unsuccessful":2,"false":2},
               "finding": {"new":1,"open":1,"opened":1,"active":1,"unresolved":1,"reopened":1,"detected":1,
                           "in progress":2,"investigating":2,"triaged":2,"acknowledged":2,"assigned":2,
                           "suppressed":3,"ignored":3,"muted":3,"dismissed":3,"false positive":3,
                           "risk accepted":3,"accepted risk":3,"snoozed":3,"exception":3,
                           "resolved":4,"fixed":4,"remediated":4,"closed":4,"mitigated":4},
               "incident": {"new":1,"open":1,"opened":1,"triggered":1,"active":1,
                            "in progress":2,"investigating":2,"acknowledged":2,"assigned":2,"mitigating":2,
                            "on hold":3,"paused":3,"snoozed":3,"pending":3,
                            "resolved":4,"mitigated":4,"fixed":4,
                            "closed":5}}[$kind] as $map
            | if $map == null then null
              elif $l == null or $l == "" or $l == "unknown" then 0
              else ($map[$l] // 99) end;


          def to_epoch_ms($ts):
            def _n: if . == null then null else tonumber end;
            def _num_ms($n):
              if   $n >= 1e17 then ($n / 1000000 | floor)
              elif $n >= 1e14 then ($n / 1000 | floor)
              elif $n >= 1e11 then ($n | floor)
              else ($n * 1000 + 0.001 | floor) end;
            def _digits_ms($d):
              ($d | ltrimstr("-") | length) as $l
              | if   $l >= 18 then ($d[0:-6] | tonumber)
                elif $l >= 15 then ($d[0:-3] | tonumber)
                elif $l >= 12 then ($d | tonumber)
                else ($d | tonumber) * 1000 end;
            def _frac_ms($f): if $f == null then 0 else (($f + "000")[0:3] | tonumber) end;
            def _mon($m):
              if $m == null then null
              else {"JAN":1,"FEB":2,"MAR":3,"APR":4,"MAY":5,"JUN":6,
                    "JUL":7,"AUG":8,"SEP":9,"OCT":10,"NOV":11,"DEC":12}[$m[0:3]] end;
            def _zone($z):
              if $z == null or $z == "" then 0
              else
                ($z | if test("^(UTC|GMT|UT)[+-]") then sub("^(UTC|GMT|UT)"; "") else . end) as $z
                | if ($z | test("^[+-][0-9]{1,2}(:?[0-9]{2})?$")) then
                    ($z | capture("^(?<sg>[+-])(?<h>[0-9]{1,2}):?(?<m>[0-9]{2})?$")) as $o
                    | (if $o.sg == "-" then -1 else 1 end)
                      * (($o.h | tonumber) * 3600 + (($o.m // "0") | tonumber) * 60)
                  else
                    {"Z":0,"UTC":0,"GMT":0,"UT":0,"EST":-18000,"EDT":-14400,"CST":-21600,
                     "CDT":-18000,"MST":-25200,"MDT":-21600,"PST":-28800,"PDT":-25200}[$z]
                  end
              end;
            def _ms($c):
              ($c.y | tonumber | if . < 100 then (if . < 70 then . + 2000 else . + 1900 end) else . end) as $y
              | ($c.mo | _n) as $mo
              | ($c.d | tonumber) as $d
              | (($c.h // "0") | tonumber) as $h
              | (($c.mi // "0") | tonumber) as $mi
              | (($c.s // "0") | tonumber) as $s
              | _zone($c.z) as $off
              | if $mo == null or $off == null or $mo < 1 or $mo > 12 or $d < 1 or $d > 31
                   or $h > 23 or $mi > 59 or $s > 60 then null
                else
                  ($y - (if $mo <= 2 then 1 else 0 end)) as $yy
                  | ($yy / 400 | floor) as $era
                  | ($yy - $era * 400) as $yoe
                  | (((153 * ($mo + (if $mo > 2 then -3 else 9 end)) + 2) / 5 | floor) + $d - 1) as $doy
                  | ($yoe * 365 + ($yoe / 4 | floor) - ($yoe / 100 | floor) + $doy) as $doe
                  | ($era * 146097 + $doe - 719468) as $days
                  | ($days * 86400 + $h * 3600 + $mi * 60 + $s - $off) * 1000 + _frac_ms($c.f)
                end;
            def _str($raw):
              ($raw | ascii_upcase | sub("\\s*\\([^)]*\\)\\s*$"; "") | sub("^\\s+"; "") | sub("\\s+$"; "")) as $s
              | "(?<z>Z|(?:UTC|GMT|UT)?[+-][0-9]{1,2}(?::?[0-9]{2})?|[A-Z]{1,5})" as $Z
              | "(?<h>[0-9]{1,2}):(?<mi>[0-9]{2})(?::(?<s>[0-9]{2}))?(?:[.,](?<f>[0-9]+))?" as $T
              | if $s == "" then null
                elif ($s | test("^-?[0-9]+$")) then _digits_ms($s)
                elif ($s | test("^[0-9]+\\.[0-9]+$")) then
                  ($s | split(".")) as $p
                  | if ($p[0] | length) <= 11 then _digits_ms($p[0]) + _frac_ms($p[1])
                    else _digits_ms($p[0]) end
                elif ($s | test("^/DATE\\(-?[0-9]+([+-][0-9]{4})?\\)/$")) then
                  ($s | capture("(?<ms>-?[0-9]+)").ms | tonumber)
                else
                  first(
                    ($s | capture("^(?<y>[0-9]{4})[-/](?<mo>[0-9]{1,2})[-/](?<d>[0-9]{1,2})(?:[T ]+" + $T + ")?\\s*" + $Z + "?(?:\\s+[A-Z]{2,5})?$") | _ms(.)),
                    ($s | capture("^(?<y>[0-9]{4})(?<mo>[0-9]{2})(?<d>[0-9]{2})T(?<h>[0-9]{2})(?<mi>[0-9]{2})(?<s>[0-9]{2})(?:[.,](?<f>[0-9]+))?" + $Z + "?$") | _ms(.)),
                    ($s | capture("^(?:[A-Z]+,?\\s+)?(?<d>[0-9]{1,2})[ -](?<mon>[A-Z]{3,9})[ -](?<y>[0-9]{2,4})\\s+" + $T + "\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?:[A-Z]+,?\\s+)?(?<mon>[A-Z]{3,9})\\.?\\s+(?<d>[0-9]{1,2}),?\\s+(?<y>[0-9]{4})(?:,?\\s+" + $T + ")?\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?:[A-Z]+\\s+)?(?<mon>[A-Z]{3,9})\\s+(?<d>[0-9]{1,2})\\s+" + $T + "\\s+(?:" + $Z + "\\s+)?(?<y>[0-9]{4})$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?<d>[0-9]{1,2})/(?<mon>[A-Z]{3})/(?<y>[0-9]{4}):" + $T + "\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.))
                  ) // null
                end;
            if $ts == null then null
            elif ($ts | type) == "number" then _num_ms($ts)
            elif ($ts | type) == "string" then _str($ts)
            elif ($ts | type) == "object" then
              if   $ts["$date"] != null then to_epoch_ms($ts["$date"])
              elif $ts["$numberLong"] != null then to_epoch_ms($ts["$numberLong"])
              elif $ts.seconds != null then
                ($ts.seconds | tostring | tonumber) * 1000
                + ((($ts.nanos // 0) | tostring | tonumber) / 1000000 | floor)
              else null end
            else null end;

          def safe_timestamp: to_epoch_ms(.);

          def severity_to_id:
            if . == "CRITICAL" then 5
            elif . == "HIGH" then 4
            elif . == "MEDIUM" then 3
            elif . == "LOW" then 2
            else 99
            end;

          # OCSF device.type_id: 1=Server, 2=Desktop, 3=Laptop, 4=Tablet,
          # 5=Mobile, 6=Virtual.
          def device_type_id:
            if . == "Workstation" then 2
            elif . == "Server" then 1
            elif . == "Laptop" then 3
            elif . == "Mobile" then 5
            else 0
            end;

          # OCSF os.type_id: 100=Windows, 200=Linux, 300=macOS, 201=Android,
          # 301=iOS, 99=Other.
          def os_type_id:
            if . == "Windows" then 100
            elif . == "Linux" then 200
            elif . == "Mac" or . == "macOS" then 300
            elif . == "Android" then 201
            elif . == "iOS" then 301
            else 99
            end;

          def build_resource:
            {
              "type": "host",
              "name": (.host_info.hostname // "unknown"),
              "uid": (.aid // "unknown"),
              "criticality": (.host_info.asset_criticality // "Unassigned"),
              "group": {
                "name": (
                  if .host_info.groups and (.host_info.groups | type) == "array" then
                    (.host_info.groups | join(", "))
                  else ""
                  end
                )
              },
              "labels": [
                (.host_info.os_version // "unknown"),
                (.host_info.platform // "unknown"),
                (.host_info.product_type_desc // "unknown")
              ]
            };

          {
            "activity_id": 1,
            "category_uid": 2,
            "class_uid": 2002,
            "type_uid": 200201,

            "time": (.created_timestamp | safe_timestamp),

            "severity_id": ((.cve.severity // "UNKNOWN") | severity_to_id),
            "severity": (.cve.severity // "UNKNOWN"),

            "finding_info": {
              "title": (.vulnerability_id // "UNKNOWN"),
              "uid": (.id // "UNKNOWN"),
              "desc": (.cve.description // "No description available"),
              "created_time": (.created_timestamp | safe_timestamp),
              "modified_time": (.updated_timestamp | safe_timestamp)
            },

            # --- OSINT (REQUIRED in v1.9.0) ---
            # The CVE is the open-source-intelligence indicator this finding
            # is about. type_id 99 = Other (OCSF has no dedicated CVE type).
            "osint": [
              {
                "value": (.vulnerability_id // "UNKNOWN"),
                "type_id": 99,
                "type": "CVE"
              }
            ],

            "vulnerabilities": [
              {
                "title": (.vulnerability_id // "UNKNOWN"),
                "desc": (.cve.description // "No description available"),
                "severity": (.cve.severity // "UNKNOWN"),
                "cve": {
                  "uid": (.vulnerability_id // "UNKNOWN"),
                  "desc": (.cve.description // "No description available"),
                  "cvss": [
                    {
                      "version": "3.1",
                      "base_score": (.cve.base_score // 0),
                      "vector_string": (.cve.vector // "UNKNOWN")
                    }
                  ],
                  "references": (.cve.references // []),
                  "modified_time": (.updated_timestamp | safe_timestamp)
                },
                "remediation": {
                  "desc": (
                    if .remediation and .remediation.entities then
                      (.remediation.entities | map(.action) | join("; "))
                    else ""
                    end
                  ),
                  "references": (
                    if .remediation and .remediation.entities then
                      (.remediation.entities | map(.link) | map(select(length > 0)))
                    else []
                    end
                  ),
                  "kb_articles": (
                    if .remediation and .remediation.entities then
                      (.remediation.entities | map(.reference) | map(select(length > 0)))
                    else []
                    end
                  )
                },
                "first_seen_time": (.created_timestamp | safe_timestamp),
                "last_seen_time": (.updated_timestamp | safe_timestamp),
                "is_exploit_available": ((.cve.exploit_status // 0) > 0)
              }
            ],

            "observables": ([
              (if .vulnerability_id then {
                "name": "vulnerabilities.cve.uid",
                "type": "CVE Object: uid",
                "type_id": 18,
                "value": .vulnerability_id
              } else empty end),
              (if .host_info.hostname then {
                "name": "device.hostname",
                "type": "Hostname",
                "type_id": 1,
                "value": .host_info.hostname
              } else empty end),
              (if .host_info.local_ip then {
                "name": "device.ip",
                "type": "IP Address",
                "type_id": 2,
                "value": .host_info.local_ip
              } else empty end)
            ]),

            "raw_data": (. | tostring),

            "metadata": {
                "profiles": ["cloud", "osint"],
              "version": "1.9.0",
              "product": {
                "name": "Crowdstrike Spotlight",
                "vendor_name": "Crowdstrike",
                "version": "1.0"
              },
              "uid": (.id // "UNKNOWN")
            },

            "confidence": (.confidence // "UNKNOWN"),
            "confidence_id": (
              if .confidence == "confirmed" then 2
              elif .confidence == "high" then 2
              elif .confidence == "medium" then 1
              elif .confidence == "low" then 0
              else 99
              end
            ),

            "status": (.status // "unknown"),
            "status_id": status_to_id((.status // "unknown"); "finding"),

            "resources": [build_resource],

            "device": {
              "type_id": (.host_info.product_type_desc // "" | device_type_id),
              "type": (.host_info.product_type_desc // ""),
              "hostname": (.host_info.hostname // ""),
              "uid": (.aid // ""),
              "instance_uid": (.host_info.instance_id // ""),
              "ip": (.host_info.local_ip // ""),
              "domain": (.host_info.machine_domain // ""),
              "vendor_name": (.host_info.system_manufacturer // ""),
              "os": {
                "name": ((.host_info.platform // "") + " " + (.host_info.os_version // "") | gsub("^\\s+|\\s+$"; "")),
                "type_id": (.host_info.platform // "" | os_type_id),
                "type": (.host_info.platform // ""),
                "version": (.host_info.os_version // ""),
                "build": (.host_info.os_build // "")
              }
            },

            # --- Cloud (REQUIRED in v1.9.0; provider required) ---
            "cloud": {
              "provider": (.host_info.service_provider // "Unknown"),
              "account": { "uid": (.host_info.service_provider_account_id // "") }
            }
          }
