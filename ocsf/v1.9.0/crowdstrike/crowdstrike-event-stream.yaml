name: "CrowdStrike Event Stream Detections to OCSF v1.9.0"
description: "Transforms CrowdStrike Falcon Event Stream DetectionSummaryEvent records into the OCSF v1.9.0 Detection Finding (2004) class, populating finding_info, device, process, file, actor, and the required cloud/osint objects."
author: "Monad"
contributors:
  - "https://github.com/behobu"
inputs:
  - "crowdstrike-event-stream"
tags:
  - "v1.9.0"
  - "ocsf"
  - "crowdstrike"
  - "findings"
  - "detection_finding"
config:
  operations:
    - operation: "jq"
      arguments:
        key: ""
        query: |
          # ---------------------------------------------------------------
          # OCSF Detection Finding (class_uid=2004) — v1.9.0
          # Input: one CrowdStrike Falcon Event Stream record per invocation.
          # Maps the DetectionSummaryEvent shape ({metadata, event}).
          #
          # Base-required in 1.9.0: time, type_uid, activity_id, metadata,
          # category_uid, severity_id, osint, cloud, finding_info, class_uid.
          # ---------------------------------------------------------------

          def to_epoch_ms($ts):
            def _n: if . == null then null else tonumber end;
            def _num_ms($n):
              if   $n >= 1e17 then ($n / 1000000 | floor)
              elif $n >= 1e14 then ($n / 1000 | floor)
              elif $n >= 1e11 then ($n | floor)
              else ($n * 1000 + 0.001 | floor) end;
            def _digits_ms($d):
              ($d | ltrimstr("-") | length) as $l
              | if   $l >= 18 then ($d[0:-6] | tonumber)
                elif $l >= 15 then ($d[0:-3] | tonumber)
                elif $l >= 12 then ($d | tonumber)
                else ($d | tonumber) * 1000 end;
            def _frac_ms($f): if $f == null then 0 else (($f + "000")[0:3] | tonumber) end;
            def _mon($m):
              if $m == null then null
              else {"JAN":1,"FEB":2,"MAR":3,"APR":4,"MAY":5,"JUN":6,
                    "JUL":7,"AUG":8,"SEP":9,"OCT":10,"NOV":11,"DEC":12}[$m[0:3]] end;
            def _zone($z):
              if $z == null or $z == "" then 0
              else
                ($z | if test("^(UTC|GMT|UT)[+-]") then sub("^(UTC|GMT|UT)"; "") else . end) as $z
                | if ($z | test("^[+-][0-9]{1,2}(:?[0-9]{2})?$")) then
                    ($z | capture("^(?<sg>[+-])(?<h>[0-9]{1,2}):?(?<m>[0-9]{2})?$")) as $o
                    | (if $o.sg == "-" then -1 else 1 end)
                      * (($o.h | tonumber) * 3600 + (($o.m // "0") | tonumber) * 60)
                  else
                    {"Z":0,"UTC":0,"GMT":0,"UT":0,"EST":-18000,"EDT":-14400,"CST":-21600,
                     "CDT":-18000,"MST":-25200,"MDT":-21600,"PST":-28800,"PDT":-25200}[$z]
                  end
              end;
            def _ms($c):
              ($c.y | tonumber | if . < 100 then (if . < 70 then . + 2000 else . + 1900 end) else . end) as $y
              | ($c.mo | _n) as $mo
              | ($c.d | tonumber) as $d
              | (($c.h // "0") | tonumber) as $h
              | (($c.mi // "0") | tonumber) as $mi
              | (($c.s // "0") | tonumber) as $s
              | _zone($c.z) as $off
              | if $mo == null or $off == null or $mo < 1 or $mo > 12 or $d < 1 or $d > 31
                   or $h > 23 or $mi > 59 or $s > 60 then null
                else
                  ($y - (if $mo <= 2 then 1 else 0 end)) as $yy
                  | ($yy / 400 | floor) as $era
                  | ($yy - $era * 400) as $yoe
                  | (((153 * ($mo + (if $mo > 2 then -3 else 9 end)) + 2) / 5 | floor) + $d - 1) as $doy
                  | ($yoe * 365 + ($yoe / 4 | floor) - ($yoe / 100 | floor) + $doy) as $doe
                  | ($era * 146097 + $doe - 719468) as $days
                  | ($days * 86400 + $h * 3600 + $mi * 60 + $s - $off) * 1000 + _frac_ms($c.f)
                end;
            def _str($raw):
              ($raw | ascii_upcase | sub("\\s*\\([^)]*\\)\\s*$"; "") | sub("^\\s+"; "") | sub("\\s+$"; "")) as $s
              | "(?<z>Z|(?:UTC|GMT|UT)?[+-][0-9]{1,2}(?::?[0-9]{2})?|[A-Z]{1,5})" as $Z
              | "(?<h>[0-9]{1,2}):(?<mi>[0-9]{2})(?::(?<s>[0-9]{2}))?(?:[.,](?<f>[0-9]+))?" as $T
              | if $s == "" then null
                elif ($s | test("^-?[0-9]+$")) then _digits_ms($s)
                elif ($s | test("^[0-9]+\\.[0-9]+$")) then
                  ($s | split(".")) as $p
                  | if ($p[0] | length) <= 11 then _digits_ms($p[0]) + _frac_ms($p[1])
                    else _digits_ms($p[0]) end
                elif ($s | test("^/DATE\\(-?[0-9]+([+-][0-9]{4})?\\)/$")) then
                  ($s | capture("(?<ms>-?[0-9]+)").ms | tonumber)
                else
                  first(
                    ($s | capture("^(?<y>[0-9]{4})[-/](?<mo>[0-9]{1,2})[-/](?<d>[0-9]{1,2})(?:[T ]+" + $T + ")?\\s*" + $Z + "?(?:\\s+[A-Z]{2,5})?$") | _ms(.)),
                    ($s | capture("^(?<y>[0-9]{4})(?<mo>[0-9]{2})(?<d>[0-9]{2})T(?<h>[0-9]{2})(?<mi>[0-9]{2})(?<s>[0-9]{2})(?:[.,](?<f>[0-9]+))?" + $Z + "?$") | _ms(.)),
                    ($s | capture("^(?:[A-Z]+,?\\s+)?(?<d>[0-9]{1,2})[ -](?<mon>[A-Z]{3,9})[ -](?<y>[0-9]{2,4})\\s+" + $T + "\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?:[A-Z]+,?\\s+)?(?<mon>[A-Z]{3,9})\\.?\\s+(?<d>[0-9]{1,2}),?\\s+(?<y>[0-9]{4})(?:,?\\s+" + $T + ")?\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?:[A-Z]+\\s+)?(?<mon>[A-Z]{3,9})\\s+(?<d>[0-9]{1,2})\\s+" + $T + "\\s+(?:" + $Z + "\\s+)?(?<y>[0-9]{4})$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?<d>[0-9]{1,2})/(?<mon>[A-Z]{3})/(?<y>[0-9]{4}):" + $T + "\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.))
                  ) // null
                end;
            if $ts == null then null
            elif ($ts | type) == "number" then _num_ms($ts)
            elif ($ts | type) == "string" then _str($ts)
            elif ($ts | type) == "object" then
              if   $ts["$date"] != null then to_epoch_ms($ts["$date"])
              elif $ts["$numberLong"] != null then to_epoch_ms($ts["$numberLong"])
              elif $ts.seconds != null then
                ($ts.seconds | tostring | tonumber) * 1000
                + ((($ts.nanos // 0) | tostring | tonumber) / 1000000 | floor)
              else null end
            else null end;

          . as $root
          | (.event // {}) as $e
          | (.metadata // {}) as $m

          # eventCreationTime is epoch-millis; OCSF time is epoch-millis in 1.x
          | (($e.ProcessStartTime // null)
             | if . == null then null
               elif type == "number" then (if . > 1000000000000 then . else (. * 1000) end)
               else null end) as $proc_start

          # CrowdStrike Severity 1..5 -> OCSF severity_id 1..6
          | (($e.Severity // 0)
             | if   . >= 5 then 5   # Critical
               elif . == 4 then 4   # High
               elif . == 3 then 3   # Medium
               elif . <= 2 and . >= 1 then 2  # Low/Informational
               else 0 end) as $sev

          | {
              category_uid: 2,
              class_uid:    2004,
              type_uid:     200401,     # 2004 * 100 + activity_id(1=Create)
              activity_id:  1,
              severity_id:  $sev,
              time:         (($m.eventCreationTime // null)
                             | if . == null then null
                               elif type == "number" then (if . > 1000000000000 then . else (. * 1000) end)
                               else null end),

              metadata: {
                "profiles": ["cloud", "osint"],
                version: "1.9.0",
                product: {
                  vendor_name: "CrowdStrike",
                  name: "Falcon"
                },
                uid: $m.customerIDString,
                event_code: $m.eventType
              },

              # finding_info (required: uid)
              finding_info: {
                uid: $e.DetectId,
                title: $e.DetectName,
                desc: $e.DetectDescription,
                types: [ $m.eventType ],
                src_url: $e.FalconHostLink
              },

              # cloud is base-required in 1.9.0 (provider required); the
              # security-control provider identifies the detecting product.
              cloud: {
                provider: "CrowdStrike Falcon"
              },

              # osint is base-required (array; each needs value + type_id).
              # Surface the detected file's SHA256 as a Hash indicator.
              osint: [
                ( if ($e.SHA256String // "") != ""
                  then { type_id: 4, value: $e.SHA256String }
                  else { type_id: 0, value: ($e.DetectId // "unknown") }
                  end )
              ],

              status_id:    1,
              message:      $e.DetectDescription,
              risk_level:   $e.SeverityName,
              count:        1,

              device: {
                type_id:  0,
                hostname: $e.ComputerName,
                uid:      $e.SensorId,
                domain:   $e.MachineDomain,
                ip:       $e.LocalIP,
                mac:      $e.MACAddress
              },

              # Detection Finding has no top-level `actor` or `process` in the
              # validated 1.9.0 schema; carry the initiating user and the
              # offending process (and its file) as an evidence artifact.
              evidences: [
                {
                  actor: {
                    user: {
                      type_id: 1,
                      name:    $e.UserName
                    }
                  },
                  process: {
                    pid:          $e.ProcessId,
                    created_time: $proc_start,
                    cmd_line:     $e.CommandLine,
                    file: {
                      type_id: 1,
                      name:    $e.FileName,
                      path:    $e.FilePath,
                      hashes: [
                        ( if ($e.SHA256String // "") != "" then { algorithm_id: 3, value: $e.SHA256String } else empty end ),
                        ( if ($e.MD5String // "") != ""    then { algorithm_id: 1, value: $e.MD5String }    else empty end )
                      ]
                    },
                    parent_process: {
                      pid: $e.ParentProcessId,
                      cmd_line: $e.ParentCommandLine
                    }
                  }
                }
              ],

              observables: [
                ( if ($e.ComputerName // "") != "" then { name: "device.hostname", type_id: 1, value: $e.ComputerName } else empty end ),
                ( if ($e.UserName // "") != ""     then { name: "evidences.actor.user.name", type_id: 4, value: $e.UserName } else empty end ),
                ( if ($e.SHA256String // "") != "" then { name: "evidences.process.file.hashes", type_id: 8, value: $e.SHA256String } else empty end ),
                ( if ($e.LocalIP // "") != ""      then { name: "device.ip", type_id: 2, value: $e.LocalIP } else empty end )
              ],

              raw_data: ($root | tostring)
            }

          # Prune nulls/empties, but keep required objects intact.
          | walk(
              if type == "object" then
                with_entries(select(.value != null and .value != "" and .value != {} and .value != []))
              elif type == "array" then
                map(select(. != null and . != "" and . != {} and . != []))
              else .
              end
            )
