name: "Apple Business Manager Audit Events to OCSF v1.9.0"
description: "Transforms Apple Business Manager audit events (device, account, configuration, subscription, domain, and API-key changes) into the OCSF v1.9.0 Entity Management (3004) class."
author: "Monad"
contributors:
  - "https://github.com/behobu"
inputs:
  - "apple-business-audit-events"
tags:
  - "v1.9.0"
  - "ocsf"
  - "apple-business"
  - "iam"
config:
  operations:
    - operation: "jq"
      arguments:
        key: ""
        query: |
          # ---------------------------------------------------------------
          # OCSF Entity Management (class_uid=3004, category_uid=3) — v1.9.0
          # Input: one Apple Business Manager auditEvents resource object.
          # Apple audit events carry NO source IP; there is no src_endpoint.
          # ---------------------------------------------------------------
          def to_epoch_ms($ts):
            def _n: if . == null then null else tonumber end;
            def _num_ms($n):
              if   $n >= 1e17 then ($n / 1000000 | floor)
              elif $n >= 1e14 then ($n / 1000 | floor)
              elif $n >= 1e11 then ($n | floor)
              else ($n * 1000 + 0.001 | floor) end;
            def _digits_ms($d):
              ($d | ltrimstr("-") | length) as $l
              | if   $l >= 18 then ($d[0:-6] | tonumber)
                elif $l >= 15 then ($d[0:-3] | tonumber)
                elif $l >= 12 then ($d | tonumber)
                else ($d | tonumber) * 1000 end;
            def _frac_ms($f): if $f == null then 0 else (($f + "000")[0:3] | tonumber) end;
            def _mon($m):
              if $m == null then null
              else {"JAN":1,"FEB":2,"MAR":3,"APR":4,"MAY":5,"JUN":6,
                    "JUL":7,"AUG":8,"SEP":9,"OCT":10,"NOV":11,"DEC":12}[$m[0:3]] end;
            def _zone($z):
              if $z == null or $z == "" then 0
              else
                ($z | if test("^(UTC|GMT|UT)[+-]") then sub("^(UTC|GMT|UT)"; "") else . end) as $z
                | if ($z | test("^[+-][0-9]{1,2}(:?[0-9]{2})?$")) then
                    ($z | capture("^(?<sg>[+-])(?<h>[0-9]{1,2}):?(?<m>[0-9]{2})?$")) as $o
                    | (if $o.sg == "-" then -1 else 1 end)
                      * (($o.h | tonumber) * 3600 + (($o.m // "0") | tonumber) * 60)
                  else
                    {"Z":0,"UTC":0,"GMT":0,"UT":0,"EST":-18000,"EDT":-14400,"CST":-21600,
                     "CDT":-18000,"MST":-25200,"MDT":-21600,"PST":-28800,"PDT":-25200}[$z]
                  end
              end;
            def _ms($c):
              ($c.y | tonumber | if . < 100 then (if . < 70 then . + 2000 else . + 1900 end) else . end) as $y
              | ($c.mo | _n) as $mo
              | ($c.d | tonumber) as $d
              | (($c.h // "0") | tonumber) as $h
              | (($c.mi // "0") | tonumber) as $mi
              | (($c.s // "0") | tonumber) as $s
              | _zone($c.z) as $off
              | if $mo == null or $off == null or $mo < 1 or $mo > 12 or $d < 1 or $d > 31
                   or $h > 23 or $mi > 59 or $s > 60 then null
                else
                  ($y - (if $mo <= 2 then 1 else 0 end)) as $yy
                  | ($yy / 400 | floor) as $era
                  | ($yy - $era * 400) as $yoe
                  | (((153 * ($mo + (if $mo > 2 then -3 else 9 end)) + 2) / 5 | floor) + $d - 1) as $doy
                  | ($yoe * 365 + ($yoe / 4 | floor) - ($yoe / 100 | floor) + $doy) as $doe
                  | ($era * 146097 + $doe - 719468) as $days
                  | ($days * 86400 + $h * 3600 + $mi * 60 + $s - $off) * 1000 + _frac_ms($c.f)
                end;
            def _str($raw):
              ($raw | ascii_upcase | sub("\\s*\\([^)]*\\)\\s*$"; "") | sub("^\\s+"; "") | sub("\\s+$"; "")) as $s
              | "(?<z>Z|(?:UTC|GMT|UT)?[+-][0-9]{1,2}(?::?[0-9]{2})?|[A-Z]{1,5})" as $Z
              | "(?<h>[0-9]{1,2}):(?<mi>[0-9]{2})(?::(?<s>[0-9]{2}))?(?:[.,](?<f>[0-9]+))?" as $T
              | if $s == "" then null
                elif ($s | test("^-?[0-9]+$")) then _digits_ms($s)
                elif ($s | test("^[0-9]+\\.[0-9]+$")) then
                  ($s | split(".")) as $p
                  | if ($p[0] | length) <= 11 then _digits_ms($p[0]) + _frac_ms($p[1])
                    else _digits_ms($p[0]) end
                elif ($s | test("^/DATE\\(-?[0-9]+([+-][0-9]{4})?\\)/$")) then
                  ($s | capture("(?<ms>-?[0-9]+)").ms | tonumber)
                else
                  first(
                    ($s | capture("^(?<y>[0-9]{4})[-/](?<mo>[0-9]{1,2})[-/](?<d>[0-9]{1,2})(?:[T ]+" + $T + ")?\\s*" + $Z + "?(?:\\s+[A-Z]{2,5})?$") | _ms(.)),
                    ($s | capture("^(?<y>[0-9]{4})(?<mo>[0-9]{2})(?<d>[0-9]{2})T(?<h>[0-9]{2})(?<mi>[0-9]{2})(?<s>[0-9]{2})(?:[.,](?<f>[0-9]+))?" + $Z + "?$") | _ms(.)),
                    ($s | capture("^(?:[A-Z]+,?\\s+)?(?<d>[0-9]{1,2})[ -](?<mon>[A-Z]{3,9})[ -](?<y>[0-9]{2,4})\\s+" + $T + "\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?:[A-Z]+,?\\s+)?(?<mon>[A-Z]{3,9})\\.?\\s+(?<d>[0-9]{1,2}),?\\s+(?<y>[0-9]{4})(?:,?\\s+" + $T + ")?\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?:[A-Z]+\\s+)?(?<mon>[A-Z]{3,9})\\s+(?<d>[0-9]{1,2})\\s+" + $T + "\\s+(?:" + $Z + "\\s+)?(?<y>[0-9]{4})$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?<d>[0-9]{1,2})/(?<mon>[A-Z]{3})/(?<y>[0-9]{4}):" + $T + "\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.))
                  ) // null
                end;
            if $ts == null then null
            elif ($ts | type) == "number" then _num_ms($ts)
            elif ($ts | type) == "string" then _str($ts)
            elif ($ts | type) == "object" then
              if   $ts["$date"] != null then to_epoch_ms($ts["$date"])
              elif $ts["$numberLong"] != null then to_epoch_ms($ts["$numberLong"])
              elif $ts.seconds != null then
                ($ts.seconds | tostring | tonumber) * 1000
                + ((($ts.nanos // 0) | tostring | tonumber) / 1000000 | floor)
              else null end
            else null end;

          def has_sub($t; $s): ($t | ascii_upcase | index($s)) != null;

          . as $r
          | ($r.attributes // {}) as $a
          | ($a.type // "") as $t
          | ($a.eventDataPropertyKey // "") as $edk

          # Activity from the ABM verb.
          | (
              if   has_sub($t;"CREATED") or has_sub($t;"ADDED") or has_sub($t;"ASSOCIATED") or has_sub($t;"GENERATED") then 1
              elif has_sub($t;"DELETED") or has_sub($t;"REMOVED") or has_sub($t;"DISASSOCIATED") or has_sub($t;"REVOKED") then 4
              elif has_sub($t;"UPDATED") or has_sub($t;"CHANGED") then 3
              else 99 end
            ) as $activity

          # Managed-entity type from the subject type.
          | ($a.subjectType // "" | ascii_upcase) as $st
          | (
              if   $st == "DEVICE" then 1
              elif $st == "USER" or $st == "ACCOUNT" or $st == "API_ACCOUNT" then 2
              elif $st == "GROUP" then 3
              elif $st == "ORGANIZATION" or $st == "ORG" then 4
              elif $st == "" then 0
              else 99 end
            ) as $ent_type_id

          | ($a.eventDataDeviceAddedToOrg // $a.eventDataDeviceRemovedFromOrg
             // $a.eventDataDeviceAssignedToServer // $a.eventDataDeviceUnassignedFromServer
             // $a.eventDataDeviceIsErased // {}) as $devdata

          | {
              "category_uid": 3,
              "class_uid":    3004,
              "activity_id":  $activity,
              "type_uid":     (3004 * 100 + $activity),
              "activity_name": (if $t == "" then null else $t end),
              "severity_id":  1,

              "time": to_epoch_ms($a.eventDateTime),

              "status": $a.outcome,
              "status_id": (
                if   ($a.outcome // "" | ascii_upcase) == "SUCCESS" then 1
                elif ($a.outcome // "" | ascii_upcase) == "FAILURE" then 2
                else 0 end),

              "metadata": {
                "profiles": ["cloud", "osint"],
                "version": "1.9.0",
                "uid": $r.id,
                "event_code": ($t | if . == "" then null else . end),
                "original_time": $a.eventDateTime,
                "product": {
                  "vendor_name": "Apple",
                  "name": "Apple Business Manager"
                }
              },

              # Required by the class in 1.9.0.
              "osint": [],
              "cloud": { "provider": "Apple Business Manager" },

              # The managed entity that the action targeted (REQUIRED).
              "entity": ({
                "name": $a.subjectName,
                "uid":  $a.subjectId,
                "type": $a.subjectType,
                "type_id": $ent_type_id,
                "device": (
                  if $ent_type_id == 1 then {
                    "type_id": 0,
                    "uid": ($devdata.serialNumber // $a.subjectId),
                    "name": $a.subjectName,
                    "hostname": $a.subjectName
                  } else null end),
                "user": (
                  if $ent_type_id == 2 then {
                    "name": $a.subjectName,
                    "uid":  $a.subjectId
                  } else null end)
              }),

              # Who performed the action.
              "actor": {
                "user": {
                  "name": $a.actorName,
                  "uid":  $a.actorId,
                  "type_id": (if ($a.actorType // "" | ascii_upcase) == "USER" then 1 else 0 end),
                  "type": $a.actorType
                }
              },

              # The targeted device is modeled inside entity.device above; the
              # top-level device attribute requires the host profile (not claimed
              # here), so it is intentionally omitted.

              "message": (($a.actorName // "actor") + " " + $t + " (" + ($a.outcome // "") + ")"),

              "unmapped": {
                "category": $a.category,
                "groupId": $a.groupId,
                "actorType": $a.actorType,
                "subjectType": $a.subjectType,
                "eventDataPropertyKey": ($edk | if . == "" then null else . end),
                "eventData": ($a[$edk] // null)
              },

              "raw_data": ($r | tostring)
            }

          # Drop null / "" keys; keep required empty arrays (osint) and objects.
          | walk(if type == "object" then with_entries(select(.value != null and .value != "")) else . end)
