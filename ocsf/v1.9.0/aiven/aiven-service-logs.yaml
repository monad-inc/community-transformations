name: "Aiven Service Logs to OCSF v1.9.0"
description: "Transforms Aiven managed-service journald log records (HOSTNAME, SYSTEMD_UNIT, MESSAGE, PRIORITY, timestamp) into the OCSF v1.9.0 Base Event class (class_uid 0), the schema's sanctioned home for otherwise-unclassified log events."
author: "Monad"
contributors:
  - "https://github.com/behobu"
inputs:
  - "aiven-service-logs"
tags:
  - "v1.9.0"
  - "ocsf"
  - "aiven"
  - "system"
config:
  operations:
    - operation: "jq"
      arguments:
        key: ""
        query: |
          # ---------------------------------------------------------------
          # Aiven Service Logs -> OCSF v1.9.0 Base Event (class_uid=0)
          #
          # Input: ONE Aiven service-log record per invocation, as delivered
          # by Aiven's logging integrations (external OpenSearch / rsyslog /
          # journalpump). These are systemd-journal entries emitted by any
          # Aiven managed service (PostgreSQL, Kafka, OpenSearch, Redis, ...).
          # Documented fields: HOSTNAME (service + node), SYSTEMD_UNIT,
          # MESSAGE, timestamp; PRIORITY (syslog level 0-7) and SESSION_ID
          # when journalpump forwards them.
          #
          # These are heterogeneous free-text log lines with no single event
          # semantics, so they map to the OCSF Base Event, which is defined
          # to "log events that are not otherwise defined by the schema".
          # ---------------------------------------------------------------


          # A syslog priority may arrive as a string ("3") or an int (3).
          def to_epoch_ms($ts):
            def _n: if . == null then null else tonumber end;
            def _num_ms($n):
              if   $n >= 1e17 then ($n / 1000000 | floor)
              elif $n >= 1e14 then ($n / 1000 | floor)
              elif $n >= 1e11 then ($n | floor)
              else ($n * 1000 + 0.001 | floor) end;
            def _digits_ms($d):
              ($d | ltrimstr("-") | length) as $l
              | if   $l >= 18 then ($d[0:-6] | tonumber)
                elif $l >= 15 then ($d[0:-3] | tonumber)
                elif $l >= 12 then ($d | tonumber)
                else ($d | tonumber) * 1000 end;
            def _frac_ms($f): if $f == null then 0 else (($f + "000")[0:3] | tonumber) end;
            def _mon($m):
              if $m == null then null
              else {"JAN":1,"FEB":2,"MAR":3,"APR":4,"MAY":5,"JUN":6,
                    "JUL":7,"AUG":8,"SEP":9,"OCT":10,"NOV":11,"DEC":12}[$m[0:3]] end;
            def _zone($z):
              if $z == null or $z == "" then 0
              else
                ($z | if test("^(UTC|GMT|UT)[+-]") then sub("^(UTC|GMT|UT)"; "") else . end) as $z
                | if ($z | test("^[+-][0-9]{1,2}(:?[0-9]{2})?$")) then
                    ($z | capture("^(?<sg>[+-])(?<h>[0-9]{1,2}):?(?<m>[0-9]{2})?$")) as $o
                    | (if $o.sg == "-" then -1 else 1 end)
                      * (($o.h | tonumber) * 3600 + (($o.m // "0") | tonumber) * 60)
                  else
                    {"Z":0,"UTC":0,"GMT":0,"UT":0,"EST":-18000,"EDT":-14400,"CST":-21600,
                     "CDT":-18000,"MST":-25200,"MDT":-21600,"PST":-28800,"PDT":-25200}[$z]
                  end
              end;
            def _ms($c):
              ($c.y | tonumber | if . < 100 then (if . < 70 then . + 2000 else . + 1900 end) else . end) as $y
              | ($c.mo | _n) as $mo
              | ($c.d | tonumber) as $d
              | (($c.h // "0") | tonumber) as $h
              | (($c.mi // "0") | tonumber) as $mi
              | (($c.s // "0") | tonumber) as $s
              | _zone($c.z) as $off
              | if $mo == null or $off == null or $mo < 1 or $mo > 12 or $d < 1 or $d > 31
                   or $h > 23 or $mi > 59 or $s > 60 then null
                else
                  ($y - (if $mo <= 2 then 1 else 0 end)) as $yy
                  | ($yy / 400 | floor) as $era
                  | ($yy - $era * 400) as $yoe
                  | (((153 * ($mo + (if $mo > 2 then -3 else 9 end)) + 2) / 5 | floor) + $d - 1) as $doy
                  | ($yoe * 365 + ($yoe / 4 | floor) - ($yoe / 100 | floor) + $doy) as $doe
                  | ($era * 146097 + $doe - 719468) as $days
                  | ($days * 86400 + $h * 3600 + $mi * 60 + $s - $off) * 1000 + _frac_ms($c.f)
                end;
            def _str($raw):
              ($raw | ascii_upcase | sub("\\s*\\([^)]*\\)\\s*$"; "") | sub("^\\s+"; "") | sub("\\s+$"; "")) as $s
              | "(?<z>Z|(?:UTC|GMT|UT)?[+-][0-9]{1,2}(?::?[0-9]{2})?|[A-Z]{1,5})" as $Z
              | "(?<h>[0-9]{1,2}):(?<mi>[0-9]{2})(?::(?<s>[0-9]{2}))?(?:[.,](?<f>[0-9]+))?" as $T
              | if $s == "" then null
                elif ($s | test("^-?[0-9]+$")) then _digits_ms($s)
                elif ($s | test("^[0-9]+\\.[0-9]+$")) then
                  ($s | split(".")) as $p
                  | if ($p[0] | length) <= 11 then _digits_ms($p[0]) + _frac_ms($p[1])
                    else _digits_ms($p[0]) end
                elif ($s | test("^/DATE\\(-?[0-9]+([+-][0-9]{4})?\\)/$")) then
                  ($s | capture("(?<ms>-?[0-9]+)").ms | tonumber)
                else
                  first(
                    ($s | capture("^(?<y>[0-9]{4})[-/](?<mo>[0-9]{1,2})[-/](?<d>[0-9]{1,2})(?:[T ]+" + $T + ")?\\s*" + $Z + "?(?:\\s+[A-Z]{2,5})?$") | _ms(.)),
                    ($s | capture("^(?<y>[0-9]{4})(?<mo>[0-9]{2})(?<d>[0-9]{2})T(?<h>[0-9]{2})(?<mi>[0-9]{2})(?<s>[0-9]{2})(?:[.,](?<f>[0-9]+))?" + $Z + "?$") | _ms(.)),
                    ($s | capture("^(?:[A-Z]+,?\\s+)?(?<d>[0-9]{1,2})[ -](?<mon>[A-Z]{3,9})[ -](?<y>[0-9]{2,4})\\s+" + $T + "\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?:[A-Z]+,?\\s+)?(?<mon>[A-Z]{3,9})\\.?\\s+(?<d>[0-9]{1,2}),?\\s+(?<y>[0-9]{4})(?:,?\\s+" + $T + ")?\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?:[A-Z]+\\s+)?(?<mon>[A-Z]{3,9})\\s+(?<d>[0-9]{1,2})\\s+" + $T + "\\s+(?:" + $Z + "\\s+)?(?<y>[0-9]{4})$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?<d>[0-9]{1,2})/(?<mon>[A-Z]{3})/(?<y>[0-9]{4}):" + $T + "\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.))
                  ) // null
                end;
            if $ts == null then null
            elif ($ts | type) == "number" then _num_ms($ts)
            elif ($ts | type) == "string" then _str($ts)
            elif ($ts | type) == "object" then
              if   $ts["$date"] != null then to_epoch_ms($ts["$date"])
              elif $ts["$numberLong"] != null then to_epoch_ms($ts["$numberLong"])
              elif $ts.seconds != null then
                ($ts.seconds | tostring | tonumber) * 1000
                + ((($ts.nanos // 0) | tostring | tonumber) / 1000000 | floor)
              else null end
            else null end;

          def prio: ((.PRIORITY // "") | if type == "number" then tostring else . end);

          # journald/syslog PRIORITY (0 emerg .. 7 debug) -> OCSF severity_id.
          def severity_id:
            { "0": 6, "1": 5, "2": 5, "3": 4, "4": 3, "5": 2, "6": 1, "7": 1 }[prio] // 0;
          # OCSF severity caption keyed off the resolved severity_id so the
          # enum sibling matches the schema's caption for that id.
          def severity_txt:
            { "0": "Unknown", "1": "Informational", "2": "Low", "3": "Medium",
              "4": "High", "5": "Critical", "6": "Fatal" }[severity_id | tostring] // "Unknown";

          def is_ip($s):
            def _v4: test("^((25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])[.]){3}(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])$");
            def _v6:
              if (contains(":") and test("^[0-9A-Fa-f:.]+$")) | not then false
              else
                split("::") as $p
                | if ($p | length) > 2 then false
                  else
                    [$p[] | select(. != "") | split(":")[]] as $g
                    | (($g | length) > 0 and ($g[-1] | contains("."))) as $tail4
                    | (if $tail4 then $g[0:-1] else $g end) as $hex
                    | (($hex | length) + (if $tail4 then 2 else 0 end)) as $n
                    | (if $tail4 then ($g[-1] | _v4) else true end)
                      and all($hex[]; test("^[0-9A-Fa-f]{1,4}$"))
                      and (if ($p | length) == 2 then $n <= 7 else $n == 8 end)
                  end
              end;
            ($s | type) == "string" and ($s | _v4 or _v6);

          . as $r
          # Aiven PostgreSQL log lines carry a "user=..,db=..,app=..,client=.."
          # prefix; pull the acting user and client address when present.
          | ( (.MESSAGE // "")
              | capture("user=(?<user>[^,]*),db=(?<db>[^,]*),app=(?<app>[^,]*),client=(?<client>[^ ]*)")
              ? // {} ) as $pg
          | ( if ($pg.user // "") != "" then $pg.user else null end ) as $puser
          | ( if is_ip($pg.client // "") then $pg.client else null end ) as $pclient

          | {
              "category_uid": 0,
              "class_uid":    0,
              "type_uid":     0,
              "activity_id":  0,
              "severity_id":  severity_id,
              "severity":     severity_txt,

              "time": to_epoch_ms(.timestamp),

              "metadata": {
                "profiles": ["cloud", "osint"],
                "version": "1.9.0",
                "product": {
                  "vendor_name": "Aiven",
                  "name": "Aiven Service Logs"
                },
                "log_name": .SYSTEMD_UNIT,
                "logged_time": to_epoch_ms(.timestamp),
                "uid": .SESSION_ID
              },

              # Required on Base Event in this schema build (profile==null).
              "cloud": { "provider": "Aiven" },
              "osint": [],

              "message": .MESSAGE,

              # base_event (uid 0) as enforced by the OCSF validator does not
              # define actor/device/src_endpoint, and no observable can point at
              # them, so the acting user, client host, and hostname are carried
              # in unmapped rather than as first-class attributes.
              "unmapped": ( {
                "hostname": .HOSTNAME,
                "systemd_unit": .SYSTEMD_UNIT,
                "priority": .PRIORITY,
                "session_id": .SESSION_ID,
                "pg_user": $puser,
                "pg_database": ( if ($pg.db // "") != "" then $pg.db else null end ),
                "pg_client": $pclient
              } | with_entries(select(.value != null)) ),

              "raw_data": (. | tostring)
            }
          | with_entries(select(.value != null))
