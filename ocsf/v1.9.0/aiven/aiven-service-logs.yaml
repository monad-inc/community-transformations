name: "Aiven Service Logs to OCSF v1.9.0"
description: "Transforms Aiven service log entries (time, hostname, unit, msg from the Aiven service logs API) into the OCSF v1.9.0 Base Event class (class_uid 0), the schema's sanctioned home for otherwise-unclassified log events."
author: "Monad"
contributors:
  - "https://github.com/behobu"
inputs:
  - "aiven-service-logs"
tags:
  - "v1.9.0"
  - "ocsf"
  - "aiven"
  - "system"
config:
  operations:
    - operation: "jq"
      arguments:
        key: ""
        query: |
          # ---------------------------------------------------------------
          # Aiven Service Logs -> OCSF v1.9.0 Base Event (class_uid=0)
          #
          # Input: ONE Aiven service-log entry per invocation, as emitted by
          # the Monad `aiven-service-logs` input. The input POSTs
          # /v1/project/{project}/service/{service}/logs and emits each item
          # of the response's logs[] array unchanged:
          #   time      ISO 8601 UTC with microseconds ("...T13:40:16.454037Z")
          #   hostname  the service node that produced the line
          #   unit      the systemd unit ("postgresql@14-main.service", ...)
          #   msg       the log line itself
          #
          # These are heterogeneous free-text lines from any Aiven managed
          # service (PostgreSQL, Kafka, OpenSearch, Valkey, ...), with no
          # single event semantics, so they map to the OCSF Base Event, which
          # is defined to "log events that are not otherwise defined by the
          # schema". The API carries no syslog priority, so severity is read
          # from a level keyword in msg when one is present, else Unknown.
          # ---------------------------------------------------------------

          # OCSF timestamp_t is epoch MILLISECONDS. Use this helper for every
          # time / *_time field; it accepts epoch s/ms/us/ns numbers, numeric
          # strings, {seconds,nanos}, and ISO 8601 with any UTC offset, and
          # returns null (not an error) on unparseable input.
          def to_epoch_ms($ts):
            def _num_ms($n):
              if   $n >= 1e17 then ($n / 1000000 | floor)
              elif $n >= 1e14 then ($n / 1000 | floor)
              elif $n >= 1e11 then ($n | floor)
              else ($n * 1000 | floor) end;
            if $ts == null or $ts == "" then null
            elif ($ts | type) == "number" then _num_ms($ts)
            elif ($ts | type) == "object" then
              (if ($ts.seconds // null) == null then null
               else ($ts.seconds * 1000 + ((($ts.nanos // 0) / 1000000) | floor)) end)
            elif ($ts | type) == "string" then
              if ($ts | test("^-?[0-9]+(\\.[0-9]+)?$")) then _num_ms($ts | tonumber)
              else
                ([$ts | ascii_upcase | capture("^(?<d>[0-9]{4}-[0-9]{2}-[0-9]{2})(?:[T ](?<t>[0-9]{2}:[0-9]{2}(?::[0-9]{2})?)(?:[.,](?<f>[0-9]+))?)? ?(?<z>Z|UTC|[+-][0-9]{2}(?::?[0-9]{2})?)?$")] | first) as $m
                | if $m == null then null
                  else
                    (($m.t // "00:00:00") | if length == 5 then . + ":00" else . end) as $t
                    | (($m.z // "Z") | if . == "Z" or . == "UTC" then 0
                        else (.[1:] | gsub(":"; "")) as $o
                          | ((if (.[0:1]) == "-" then -1 else 1 end)
                             * (($o[0:2] | tonumber) * 3600 + ((if ($o | length) >= 4 then $o[2:4] else "00" end) | tonumber) * 60))
                        end) as $off
                    | ((($m.d + "T" + $t + "Z") | fromdateiso8601) - $off) * 1000
                      + (((($m.f // "") + "000")[0:3]) | tonumber)
                  end
              end
            else null end;

          def is_ip($s):
            ($s | type) == "string"
            and ($s | test("^(\\d{1,3}\\.){3}\\d{1,3}$") or (test(":") and test("^[0-9A-Fa-f:.]+$")));
          def nonempty($v): if $v == null or $v == "" or $v == "[unknown]" then null else $v end;

          . as $r
          | ($r.msg // "") as $msg

          # Level keyword: PostgreSQL "LOG:  ..." / "ERROR:  ..." and the
          # bracketed or bare upper-case levels used by Kafka/Java, OpenSearch
          # and others ("[ERROR]", " WARN "). Upper-case only, so ordinary
          # prose ("error occurred") does not set a level.
          | ( [ $msg
                | capture("(?:^|[\\s\\[])(?<lvl>PANIC|FATAL|CRITICAL|SEVERE|ERROR|WARNING|WARN|NOTICE|INFO|LOG|DEBUG[1-5]?|TRACE)(?:\\]|:|\\s|$)")
                | .lvl ] | first // null ) as $lvl
          | ( if   $lvl == null then 0
              elif $lvl == "PANIC" then 6
              elif $lvl == "FATAL" or $lvl == "CRITICAL" or $lvl == "SEVERE" then 5
              elif $lvl == "ERROR" then 4
              elif $lvl == "WARNING" or $lvl == "WARN" then 3
              elif $lvl == "NOTICE" then 2
              else 1 end ) as $sev

          # Aiven PostgreSQL lines carry a log_line_prefix of
          # "pid=..,user=..,db=..,app=..,client=.." (optionally more keys);
          # parse it as key=value pairs so extra or reordered keys still work.
          | ( [ $msg | capture("(?:^|[\\s\\]])(?<kv>pid=[^ ]*)") | .kv ] | first // null ) as $prefix
          | ( if $prefix == null then {}
              else ( $prefix | split(",")
                     | map(capture("^(?<k>[a-z_]+)=(?<v>.*)$")? // empty)
                     | map({ (.k): .v }) | add // {} )
              end ) as $pg
          | nonempty($pg.user) as $puser
          | ( if is_ip($pg.client) then $pg.client else null end ) as $pclient

          | {
              "category_uid": 0,
              "class_uid":    0,
              "type_uid":     0,
              "activity_id":  0,
              "severity_id":  $sev,
              "severity":     ({ "0": "Unknown", "1": "Informational", "2": "Low", "3": "Medium",
                                 "4": "High", "5": "Critical", "6": "Fatal" }[$sev | tostring]),

              "time": to_epoch_ms($r.time),

              "metadata": {
                # host: actor + device; cloud: the Aiven platform.
                "profiles": ["cloud", "host"],
                "version": "1.9.0",
                "product": {
                  "vendor_name": "Aiven",
                  "name": "Aiven Service Logs"
                },
                "log_name": $r.unit,
                "log_level": $lvl,
                "original_time": $r.time,
                # The node that wrote the line.
                "reporter": (if nonempty($r.hostname) != null then { "hostname": $r.hostname } else null end)
              },

              "cloud": { "provider": "Aiven" },

              # The Aiven service node that wrote the line (host profile).
              "device": (if nonempty($r.hostname) != null
                         then { "hostname": $r.hostname, "type_id": 1, "type": "Server" } else null end),

              # The database role that issued the statement (PostgreSQL; host profile).
              "actor": (if $puser != null then { "user": { "name": $puser } } else null end),

              "message": $r.msg,

              "observables": (
                [ ( if $puser != null then { "name": "actor.user.name", "type": "User Name", "type_id": 4, "value": $puser } else empty end ) ]
              ),

              # Base Event defines no endpoint or database attributes, so the
              # PostgreSQL prefix fields without an OCSF home stay here.
              "unmapped": ( {
                "pg_pid": nonempty($pg.pid),
                "pg_database": nonempty($pg.db),
                "pg_application": nonempty($pg.app),
                "pg_client": ($pclient // nonempty($pg.client)),
                "pg_prefix": ($pg | del(.pid, .user, .db, .app, .client) | if . == {} then null else . end)
              } | with_entries(select(.value != null)) ),

              "raw_data": ($r | tostring)
            }
          | with_entries(select(.value != null and .value != [] and .value != {}))
          | .metadata |= with_entries(select(.value != null))
