name: "Rapid7 InsightVM Assets to OCSF v1.9.0"
description: "Transforms Rapid7 InsightVM asset inventory records (GET /api/3/assets) into the OCSF v1.9.0 Device Inventory Info (5001) class."
author: "Monad"
contributors:
  - "https://github.com/behobu"
inputs:
  - "rapid7-assets"
tags:
  - "v1.9.0"
  - "ocsf"
  - "rapid7"
  - "device"
  - "inventory"
config:
  operations:
    - operation: "jq"
      arguments:
        key: ""
        query: |
          # ---------------------------------------------------------------
          # OCSF Device Inventory Info (class_uid=5001) — v1.9.0
          # Category 5 (Discovery), activity_id 2 (Collect).
          # Input: one Rapid7 InsightVM Asset record per invocation.
          # ---------------------------------------------------------------

          def to_epoch_ms($ts):
            def _n: if . == null then null else tonumber end;
            def _num_ms($n):
              if   $n >= 1e17 then ($n / 1000000 | floor)
              elif $n >= 1e14 then ($n / 1000 | floor)
              elif $n >= 1e11 then ($n | floor)
              else ($n * 1000 + 0.001 | floor) end;
            def _digits_ms($d):
              ($d | ltrimstr("-") | length) as $l
              | if   $l >= 18 then ($d[0:-6] | tonumber)
                elif $l >= 15 then ($d[0:-3] | tonumber)
                elif $l >= 12 then ($d | tonumber)
                else ($d | tonumber) * 1000 end;
            def _frac_ms($f): if $f == null then 0 else (($f + "000")[0:3] | tonumber) end;
            def _mon($m):
              if $m == null then null
              else {"JAN":1,"FEB":2,"MAR":3,"APR":4,"MAY":5,"JUN":6,
                    "JUL":7,"AUG":8,"SEP":9,"OCT":10,"NOV":11,"DEC":12}[$m[0:3]] end;
            def _zone($z):
              if $z == null or $z == "" then 0
              else
                ($z | if test("^(UTC|GMT|UT)[+-]") then sub("^(UTC|GMT|UT)"; "") else . end) as $z
                | if ($z | test("^[+-][0-9]{1,2}(:?[0-9]{2})?$")) then
                    ($z | capture("^(?<sg>[+-])(?<h>[0-9]{1,2}):?(?<m>[0-9]{2})?$")) as $o
                    | (if $o.sg == "-" then -1 else 1 end)
                      * (($o.h | tonumber) * 3600 + (($o.m // "0") | tonumber) * 60)
                  else
                    {"Z":0,"UTC":0,"GMT":0,"UT":0,"EST":-18000,"EDT":-14400,"CST":-21600,
                     "CDT":-18000,"MST":-25200,"MDT":-21600,"PST":-28800,"PDT":-25200}[$z]
                  end
              end;
            def _ms($c):
              ($c.y | tonumber | if . < 100 then (if . < 70 then . + 2000 else . + 1900 end) else . end) as $y
              | ($c.mo | _n) as $mo
              | ($c.d | tonumber) as $d
              | (($c.h // "0") | tonumber) as $h
              | (($c.mi // "0") | tonumber) as $mi
              | (($c.s // "0") | tonumber) as $s
              | _zone($c.z) as $off
              | if $mo == null or $off == null or $mo < 1 or $mo > 12 or $d < 1 or $d > 31
                   or $h > 23 or $mi > 59 or $s > 60 then null
                else
                  ($y - (if $mo <= 2 then 1 else 0 end)) as $yy
                  | ($yy / 400 | floor) as $era
                  | ($yy - $era * 400) as $yoe
                  | (((153 * ($mo + (if $mo > 2 then -3 else 9 end)) + 2) / 5 | floor) + $d - 1) as $doy
                  | ($yoe * 365 + ($yoe / 4 | floor) - ($yoe / 100 | floor) + $doy) as $doe
                  | ($era * 146097 + $doe - 719468) as $days
                  | ($days * 86400 + $h * 3600 + $mi * 60 + $s - $off) * 1000 + _frac_ms($c.f)
                end;
            def _str($raw):
              ($raw | ascii_upcase | sub("\\s*\\([^)]*\\)\\s*$"; "") | sub("^\\s+"; "") | sub("\\s+$"; "")) as $s
              | "(?<z>Z|(?:UTC|GMT|UT)?[+-][0-9]{1,2}(?::?[0-9]{2})?|[A-Z]{1,5})" as $Z
              | "(?<h>[0-9]{1,2}):(?<mi>[0-9]{2})(?::(?<s>[0-9]{2}))?(?:[.,](?<f>[0-9]+))?" as $T
              | if $s == "" then null
                elif ($s | test("^-?[0-9]+$")) then _digits_ms($s)
                elif ($s | test("^[0-9]+\\.[0-9]+$")) then
                  ($s | split(".")) as $p
                  | if ($p[0] | length) <= 11 then _digits_ms($p[0]) + _frac_ms($p[1])
                    else _digits_ms($p[0]) end
                elif ($s | test("^/DATE\\(-?[0-9]+([+-][0-9]{4})?\\)/$")) then
                  ($s | capture("(?<ms>-?[0-9]+)").ms | tonumber)
                else
                  first(
                    ($s | capture("^(?<y>[0-9]{4})[-/](?<mo>[0-9]{1,2})[-/](?<d>[0-9]{1,2})(?:[T ]+" + $T + ")?\\s*" + $Z + "?(?:\\s+[A-Z]{2,5})?$") | _ms(.)),
                    ($s | capture("^(?<y>[0-9]{4})(?<mo>[0-9]{2})(?<d>[0-9]{2})T(?<h>[0-9]{2})(?<mi>[0-9]{2})(?<s>[0-9]{2})(?:[.,](?<f>[0-9]+))?" + $Z + "?$") | _ms(.)),
                    ($s | capture("^(?:[A-Z]+,?\\s+)?(?<d>[0-9]{1,2})[ -](?<mon>[A-Z]{3,9})[ -](?<y>[0-9]{2,4})\\s+" + $T + "\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?:[A-Z]+,?\\s+)?(?<mon>[A-Z]{3,9})\\.?\\s+(?<d>[0-9]{1,2}),?\\s+(?<y>[0-9]{4})(?:,?\\s+" + $T + ")?\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?:[A-Z]+\\s+)?(?<mon>[A-Z]{3,9})\\s+(?<d>[0-9]{1,2})\\s+" + $T + "\\s+(?:" + $Z + "\\s+)?(?<y>[0-9]{4})$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?<d>[0-9]{1,2})/(?<mon>[A-Z]{3})/(?<y>[0-9]{4}):" + $T + "\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.))
                  ) // null
                end;
            if $ts == null then null
            elif ($ts | type) == "number" then _num_ms($ts)
            elif ($ts | type) == "string" then _str($ts)
            elif ($ts | type) == "object" then
              if   $ts["$date"] != null then to_epoch_ms($ts["$date"])
              elif $ts["$numberLong"] != null then to_epoch_ms($ts["$numberLong"])
              elif $ts.seconds != null then
                ($ts.seconds | tostring | tonumber) * 1000
                + ((($ts.nanos // 0) | tostring | tonumber) / 1000000 | floor)
              else null end
            else null end;

          . as $r |
          # Latest scan timestamp from history; fall back to now.
          ( ($r.history // []) | map(.date) | map(select(. != null)) | sort ) as $dates |
          ( if ($dates | length) > 0 then $dates[-1] else null end ) as $last_scan |
          # OS strings for type classification.
          ( ( ($r.osFingerprint.family // "") + " "
              + ($r.osFingerprint.systemName // "") + " "
              + ($r.os // "") ) | ascii_downcase ) as $osl |
          # Primary hostname (top-level hostName, else first hostNames entry).
          ( $r.hostName // ( ($r.hostNames // [])[0] | .name? ) ) as $primary_host |
          # Primary IP (top-level ip, else first address).
          ( $r.ip // ( ($r.addresses // [])[0] | .ip? ) ) as $primary_ip |
          # Primary MAC (top-level mac, else first address).
          ( $r.mac // ( ($r.addresses // [])[0] | .mac? ) ) as $primary_mac |
          {
            "category_uid": 5,
            "class_uid": 5001,
            "activity_id": 2,
            "type_uid": 500102,
            "severity_id": 1,

            "time": ( to_epoch_ms($last_scan) // now ),
            "start_time": ( ($r.history // []) | map(.date) | map(select(. != null)) | sort
                            | (if length > 0 then to_epoch_ms(.[0]) else null end) ),
            "end_time": to_epoch_ms($last_scan),

            "metadata": {
                "profiles": ["cloud", "osint"],
              "version": "1.9.0",
              "product": {
                "vendor_name": "Rapid7",
                "name": "InsightVM"
              },
              "logged_time": ( to_epoch_ms($last_scan) // now )
            },

            "device": {
              "type_id": (
                ( ($r.osFingerprint.type // "") | ascii_downcase ) as $ft |
                if   ($ft | test("laptop"))                          then 3
                elif ($ft | test("desktop|workstation"))            then 2
                elif ($ft | test("server"))                          then 1
                elif ($ft | test("mobile|phone|tablet"))            then 5
                elif ($ft | test("virtual|hypervisor|guest"))      then 6
                else
                  ( ($r.type // "") | ascii_downcase ) as $tt |
                  if   ($tt | test("mobile|phone"))          then 5
                  elif ($tt | test("virtual|hypervisor|guest")) then 6
                  else 0 end
                end
              ),
              "uid": ($r.id | tostring),
              "hostname": $primary_host,
              "name": $primary_host,
              "ip": $primary_ip,
              "mac": $primary_mac,
              "os": (
                if ($r.os != null or $r.osFingerprint != null) then {
                  "name": ( $r.os // $r.osFingerprint.product // $r.osFingerprint.family // "Unknown" ),
                  "type_id": (
                    if   ($osl | test("windows"))       then 100
                    elif ($osl | test("android"))        then 201
                    elif ($osl | test("linux"))          then 200
                    elif ($osl | test("ios"))            then 301
                    elif ($osl | test("mac|os x|darwin")) then 300
                    elif ($osl | test("solaris|sunos"))  then 400
                    elif ($osl | test("aix"))            then 401
                    elif ($osl | test("hp-ux|hpux"))     then 402
                    else 0 end
                  ),
                  "version": ($r.osFingerprint.version // null),
                  "cpu_bits": (
                    ( ($r.osFingerprint.architecture // "") | ascii_downcase ) as $arch |
                    if   ($arch | test("x64|amd64|x86_64|64")) then 64
                    elif ($arch | test("x86|i386|i686|32"))    then 32
                    else null end
                  )
                } else null end
              ),
              "network_interfaces": (
                ( $r.addresses // [] )
                | map( { "ip": .ip, "mac": .mac } | with_entries(select(.value != null and .value != "")) )
                | map(select(. != {}))
              )
            },

            # OSINT is base-required in 1.9.0. Anchor it to the device's
            # primary network indicator (IP preferred, else hostname).
            "osint": [
              (
                if $primary_ip != null then
                  { "value": $primary_ip, "type_id": 1, "uid": ($r.id | tostring) }
                elif $primary_host != null then
                  { "value": $primary_host, "type_id": 3, "uid": ($r.id | tostring) }
                else
                  { "value": ($r.id | tostring), "type_id": 0, "uid": ($r.id | tostring) }
                end
              )
            ],

            # Cloud is base-required in 1.9.0. InsightVM asset records carry no
            # cloud-provider context, so declare it Unknown.
            "cloud": {
              "provider": "Unknown"
            },

            "unmapped": {
              "type": $r.type,
              "riskScore": $r.riskScore,
              "rawRiskScore": $r.rawRiskScore,
              "assessedForVulnerabilities": $r.assessedForVulnerabilities,
              "assessedForPolicies": $r.assessedForPolicies,
              "vulnerabilities": $r.vulnerabilities,
              "ids": $r.ids
            }
          }
          # Single end-of-pipeline prune of null / "" / {} / [] leaves, while
          # keeping required objects (device, osint[0], cloud) populated.
          | walk(
              if type == "object" then
                with_entries(select(.value != null and .value != "" and .value != {} and .value != []))
              elif type == "array" then
                map(select(. != null and . != {} and . != ""))
              else . end
            )
