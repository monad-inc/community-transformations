name: "BugSnag Org Events to OCSF v1.9.0"
description: "Transforms BugSnag organization error/crash events into the OCSF v1.9.0 Application Error (6008) class."
author: "Monad"
contributors:
  - "https://github.com/behobu"
inputs:
  - "bugsnag-org-events"
tags:
  - "v1.9.0"
  - "ocsf"
  - "bugsnag"
  - "application"
config:
  operations:
    - operation: "jq"
      arguments:
        key: ""
        query: |
          # ---------------------------------------------------------------
          # OCSF Application Error (class_uid=6008) — v1.9.0
          # Input: one BugSnag org error event (Data Access API shape).
          # ---------------------------------------------------------------
          def to_epoch_ms($ts):
            def _n: if . == null then null else tonumber end;
            def _num_ms($n):
              if   $n >= 1e17 then ($n / 1000000 | floor)
              elif $n >= 1e14 then ($n / 1000 | floor)
              elif $n >= 1e11 then ($n | floor)
              else ($n * 1000 + 0.001 | floor) end;
            def _digits_ms($d):
              ($d | ltrimstr("-") | length) as $l
              | if   $l >= 18 then ($d[0:-6] | tonumber)
                elif $l >= 15 then ($d[0:-3] | tonumber)
                elif $l >= 12 then ($d | tonumber)
                else ($d | tonumber) * 1000 end;
            def _frac_ms($f): if $f == null then 0 else (($f + "000")[0:3] | tonumber) end;
            def _mon($m):
              if $m == null then null
              else {"JAN":1,"FEB":2,"MAR":3,"APR":4,"MAY":5,"JUN":6,
                    "JUL":7,"AUG":8,"SEP":9,"OCT":10,"NOV":11,"DEC":12}[$m[0:3]] end;
            def _zone($z):
              if $z == null or $z == "" then 0
              else
                ($z | if test("^(UTC|GMT|UT)[+-]") then sub("^(UTC|GMT|UT)"; "") else . end) as $z
                | if ($z | test("^[+-][0-9]{1,2}(:?[0-9]{2})?$")) then
                    ($z | capture("^(?<sg>[+-])(?<h>[0-9]{1,2}):?(?<m>[0-9]{2})?$")) as $o
                    | (if $o.sg == "-" then -1 else 1 end)
                      * (($o.h | tonumber) * 3600 + (($o.m // "0") | tonumber) * 60)
                  else
                    {"Z":0,"UTC":0,"GMT":0,"UT":0,"EST":-18000,"EDT":-14400,"CST":-21600,
                     "CDT":-18000,"MST":-25200,"MDT":-21600,"PST":-28800,"PDT":-25200}[$z]
                  end
              end;
            def _ms($c):
              ($c.y | tonumber | if . < 100 then (if . < 70 then . + 2000 else . + 1900 end) else . end) as $y
              | ($c.mo | _n) as $mo
              | ($c.d | tonumber) as $d
              | (($c.h // "0") | tonumber) as $h
              | (($c.mi // "0") | tonumber) as $mi
              | (($c.s // "0") | tonumber) as $s
              | _zone($c.z) as $off
              | if $mo == null or $off == null or $mo < 1 or $mo > 12 or $d < 1 or $d > 31
                   or $h > 23 or $mi > 59 or $s > 60 then null
                else
                  ($y - (if $mo <= 2 then 1 else 0 end)) as $yy
                  | ($yy / 400 | floor) as $era
                  | ($yy - $era * 400) as $yoe
                  | (((153 * ($mo + (if $mo > 2 then -3 else 9 end)) + 2) / 5 | floor) + $d - 1) as $doy
                  | ($yoe * 365 + ($yoe / 4 | floor) - ($yoe / 100 | floor) + $doy) as $doe
                  | ($era * 146097 + $doe - 719468) as $days
                  | ($days * 86400 + $h * 3600 + $mi * 60 + $s - $off) * 1000 + _frac_ms($c.f)
                end;
            def _str($raw):
              ($raw | ascii_upcase | sub("\\s*\\([^)]*\\)\\s*$"; "") | sub("^\\s+"; "") | sub("\\s+$"; "")) as $s
              | "(?<z>Z|(?:UTC|GMT|UT)?[+-][0-9]{1,2}(?::?[0-9]{2})?|[A-Z]{1,5})" as $Z
              | "(?<h>[0-9]{1,2}):(?<mi>[0-9]{2})(?::(?<s>[0-9]{2}))?(?:[.,](?<f>[0-9]+))?" as $T
              | if $s == "" then null
                elif ($s | test("^-?[0-9]+$")) then _digits_ms($s)
                elif ($s | test("^[0-9]+\\.[0-9]+$")) then
                  ($s | split(".")) as $p
                  | if ($p[0] | length) <= 11 then _digits_ms($p[0]) + _frac_ms($p[1])
                    else _digits_ms($p[0]) end
                elif ($s | test("^/DATE\\(-?[0-9]+([+-][0-9]{4})?\\)/$")) then
                  ($s | capture("(?<ms>-?[0-9]+)").ms | tonumber)
                else
                  first(
                    ($s | capture("^(?<y>[0-9]{4})[-/](?<mo>[0-9]{1,2})[-/](?<d>[0-9]{1,2})(?:[T ]+" + $T + ")?\\s*" + $Z + "?(?:\\s+[A-Z]{2,5})?$") | _ms(.)),
                    ($s | capture("^(?<y>[0-9]{4})(?<mo>[0-9]{2})(?<d>[0-9]{2})T(?<h>[0-9]{2})(?<mi>[0-9]{2})(?<s>[0-9]{2})(?:[.,](?<f>[0-9]+))?" + $Z + "?$") | _ms(.)),
                    ($s | capture("^(?:[A-Z]+,?\\s+)?(?<d>[0-9]{1,2})[ -](?<mon>[A-Z]{3,9})[ -](?<y>[0-9]{2,4})\\s+" + $T + "\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?:[A-Z]+,?\\s+)?(?<mon>[A-Z]{3,9})\\.?\\s+(?<d>[0-9]{1,2}),?\\s+(?<y>[0-9]{4})(?:,?\\s+" + $T + ")?\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?:[A-Z]+\\s+)?(?<mon>[A-Z]{3,9})\\s+(?<d>[0-9]{1,2})\\s+" + $T + "\\s+(?:" + $Z + "\\s+)?(?<y>[0-9]{4})$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?<d>[0-9]{1,2})/(?<mon>[A-Z]{3})/(?<y>[0-9]{4}):" + $T + "\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.))
                  ) // null
                end;
            if $ts == null then null
            elif ($ts | type) == "number" then _num_ms($ts)
            elif ($ts | type) == "string" then _str($ts)
            elif ($ts | type) == "object" then
              if   $ts["$date"] != null then to_epoch_ms($ts["$date"])
              elif $ts["$numberLong"] != null then to_epoch_ms($ts["$numberLong"])
              elif $ts.seconds != null then
                ($ts.seconds | tostring | tonumber) * 1000
                + ((($ts.nanos // 0) | tostring | tonumber) / 1000000 | floor)
              else null end
            else null end;

          . as $r
          | ($r.exceptions[0] // {}) as $ex
          | ($r.app // {}) as $app
          | ($r.device // {}) as $dev
          | ($r.user // {}) as $usr
          | ($r.request // {}) as $req

          | 
          # BugSnag severity -> OCSF severity_id
          ( { "error": 4, "warning": 3, "info": 1 }[$r.severity] // 0 ) as $sev

          | {
              # --- Classification (REQUIRED) ---
              "category_uid": 6,
              "class_uid":    6008,
              "activity_id":  1,
              "type_uid":     600801,
              "severity_id":  $sev,

              # --- Time (REQUIRED) ---
              "time": to_epoch_ms($r.received_at),

              # --- Metadata (REQUIRED) ---
              "metadata": {
                "version": "1.9.0",
                "uid": $r.id,
                "product": {
                  "vendor_name": "BugSnag",
                  "name": "BugSnag",
                  "feature": { "name": "Error Monitoring" },
                  "version": $app.version
                },
                "log_name": "org-events",
                "profiles": ["cloud", "osint", "host", "security_control"]
              },

              # --- Cloud (REQUIRED on Application Error) ---
              "cloud": {
                "provider": "Unknown"
              },

              # --- OSINT (REQUIRED on Application Error) ---
              # No native OSINT indicators in BugSnag; carry the event URL as
              # an Other-typed indicator so the required object is populated.
              "osint": [
                {
                  "value": ($r.url // $r.project_url // $r.id),
                  "type_id": 99
                }
              ],

              # --- Recommended ---
              "message": ($ex.message // $r.context // ($r.severity // "error")),
              "status": (if $r.unhandled == true then "Unhandled" else "Handled" end),
              "status_detail": ($r.severity_reason.type // null),
              "is_alert": ($r.unhandled == true),

              "device": {
                "type_id": 0,
                "hostname": $dev.hostname,
                "uid": $dev.id,
                "os": {
                  "name": $dev.os_name,
                  "version": $dev.os_version,
                  "type_id": (
                    ($dev.os_name // "" | ascii_downcase) as $on
                    | if   ($on | test("mac"))     then 300
                      elif ($on | test("win"))     then 100
                      elif ($on | test("android")) then 401
                      elif ($on | test("ios"))     then 400
                      elif ($on | test("linux"))   then 200
                      else 0 end
                  )
                }
              },

              "observables": (
                [
                  ( if $dev.hostname != null
                    then { "name": "device.hostname", "type_id": 1, "value": $dev.hostname }
                    else empty end ),
                  ( if $r.id != null
                    then { "name": "metadata.uid", "type_id": 0, "value": $r.id }
                    else empty end )
                ]
              ),

              # --- Non-OCSF passthrough ---
              "unmapped": {
                "error_id": $r.error_id,
                "context": $r.context,
                "unhandled": $r.unhandled,
                "error_class": $ex.error_class,
                "app_id": $app.id,
                "app_version": $app.version,
                "release_stage": $app.release_stage,
                "app_type": $app.type,
                "url": $r.url,
                "project_url": $r.project_url,
                "user_id": $usr.id,
                "user_name": $usr.name,
                "user_email": $usr.email,
                "browser_name": $dev.browser_name,
                "browser_version": $dev.browser_version,
                "request_url": $req.url,
                "http_method": $req.http_method,
                "client_ip": $req.client_ip,
                "duration": $app.duration
              },

              "raw_data": ($r | tostring)
            }
          # Prune nulls / empty containers (single recursive pass).
          | walk(
              if type == "object" then with_entries(select(.value != null and .value != {} and .value != []))
              elif type == "array" then map(select(. != null))
              else . end
            )
