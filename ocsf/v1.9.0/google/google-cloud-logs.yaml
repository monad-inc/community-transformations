name: "Google Cloud Audit Logs to OCSF v1.9.0"
description: "Transforms Google Cloud Logs records (Cloud Audit Logs, App Engine request logs, and plain log entries) into the OCSF v1.9.0 API Activity (6003) class."
author: "Monad"
contributors:
  - "https://github.com/behobu"
  - "https://github.com/Credgate"
inputs:
  - "google-cloud-logs"
tags:
  - "v1.9.0"
  - "ocsf"
  - "google"
  - "gcp"
  - "api-activity"
config:
  operations:
    - operation: "jq"
      arguments:
        key: ""
        query: |
          # ---------------------------------------------------------------
          # OCSF API Activity (class_uid=6003) — v1.9.0
          # Input: one google-cloud-logs record per call. The connector emits
          # the Go JSON encoding of a Cloud Logging LogEntry, not the REST
          # camelCase shape:
          #   insert_id, log_name, resource{type,labels}
          #   timestamp / receive_timestamp = {seconds, nanos}
          #   severity = LogSeverity number (0 DEFAULT … 800 EMERGENCY)
          #   Payload.ProtoPayload{type_url, value}  (value is the decoded
          #     AuditLog / RequestLog with snake_case keys when "Enable Proto
          #     Payload Parsing" is on, or a base64 string when it is off)
          #   Payload.TextPayload / Payload.JsonPayload for non-proto entries
          # RFC 3339 string timestamps and string severities (synthetic data)
          # are accepted too.
          # ---------------------------------------------------------------
          # Epoch MILLISECONDS from any common timestamp form; null if empty or unparseable.
          def to_epoch_ms($ts):
            def _n: if . == null then null else tonumber end;
            def _num_ms($n):
              if   $n >= 1e17 then ($n / 1000000 | floor)
              elif $n >= 1e14 then ($n / 1000 | floor)
              elif $n >= 1e11 then ($n | floor)
              else ($n * 1000 + 0.001 | floor) end;
            def _digits_ms($d):
              ($d | ltrimstr("-") | length) as $l
              | if   $l >= 18 then ($d[0:-6] | tonumber)
                elif $l >= 15 then ($d[0:-3] | tonumber)
                elif $l >= 12 then ($d | tonumber)
                else ($d | tonumber) * 1000 end;
            def _frac_ms($f): if $f == null then 0 else (($f + "000")[0:3] | tonumber) end;
            def _mon($m):
              if $m == null then null
              else {"JAN":1,"FEB":2,"MAR":3,"APR":4,"MAY":5,"JUN":6,
                    "JUL":7,"AUG":8,"SEP":9,"OCT":10,"NOV":11,"DEC":12}[$m[0:3]] end;
            def _zone($z):
              if $z == null or $z == "" then 0
              else
                ($z | if test("^(UTC|GMT|UT)[+-]") then sub("^(UTC|GMT|UT)"; "") else . end) as $z
                | if ($z | test("^[+-][0-9]{1,2}(:?[0-9]{2})?$")) then
                    ($z | capture("^(?<sg>[+-])(?<h>[0-9]{1,2}):?(?<m>[0-9]{2})?$")) as $o
                    | (if $o.sg == "-" then -1 else 1 end)
                      * (($o.h | tonumber) * 3600 + (($o.m // "0") | tonumber) * 60)
                  else
                    {"Z":0,"UTC":0,"GMT":0,"UT":0,"EST":-18000,"EDT":-14400,"CST":-21600,
                     "CDT":-18000,"MST":-25200,"MDT":-21600,"PST":-28800,"PDT":-25200}[$z]
                  end
              end;
            def _ms($c):
              ($c.y | tonumber | if . < 100 then (if . < 70 then . + 2000 else . + 1900 end) else . end) as $y
              | ($c.mo | _n) as $mo
              | ($c.d | tonumber) as $d
              | (($c.h // "0") | tonumber) as $h
              | (($c.mi // "0") | tonumber) as $mi
              | (($c.s // "0") | tonumber) as $s
              | _zone($c.z) as $off
              | if $mo == null or $off == null or $mo < 1 or $mo > 12 or $d < 1 or $d > 31
                   or $h > 23 or $mi > 59 or $s > 60 then null
                else
                  ($y - (if $mo <= 2 then 1 else 0 end)) as $yy
                  | ($yy / 400 | floor) as $era
                  | ($yy - $era * 400) as $yoe
                  | (((153 * ($mo + (if $mo > 2 then -3 else 9 end)) + 2) / 5 | floor) + $d - 1) as $doy
                  | ($yoe * 365 + ($yoe / 4 | floor) - ($yoe / 100 | floor) + $doy) as $doe
                  | ($era * 146097 + $doe - 719468) as $days
                  | ($days * 86400 + $h * 3600 + $mi * 60 + $s - $off) * 1000 + _frac_ms($c.f)
                end;
            def _str($raw):
              ($raw | ascii_upcase | sub("\\s*\\([^)]*\\)\\s*$"; "") | sub("^\\s+"; "") | sub("\\s+$"; "")) as $s
              | "(?<z>Z|(?:UTC|GMT|UT)?[+-][0-9]{1,2}(?::?[0-9]{2})?|[A-Z]{1,5})" as $Z
              | "(?<h>[0-9]{1,2}):(?<mi>[0-9]{2})(?::(?<s>[0-9]{2}))?(?:[.,](?<f>[0-9]+))?" as $T
              | if $s == "" then null
                elif ($s | test("^-?[0-9]+$")) then _digits_ms($s)
                elif ($s | test("^[0-9]+\\.[0-9]+$")) then
                  ($s | split(".")) as $p
                  | if ($p[0] | length) <= 11 then _digits_ms($p[0]) + _frac_ms($p[1])
                    else _digits_ms($p[0]) end
                elif ($s | test("^/DATE\\(-?[0-9]+([+-][0-9]{4})?\\)/$")) then
                  ($s | capture("(?<ms>-?[0-9]+)").ms | tonumber)
                else
                  first(
                    ($s | capture("^(?<y>[0-9]{4})[-/](?<mo>[0-9]{1,2})[-/](?<d>[0-9]{1,2})(?:[T ]+" + $T + ")?\\s*" + $Z + "?(?:\\s+[A-Z]{2,5})?$") | _ms(.)),
                    ($s | capture("^(?<y>[0-9]{4})(?<mo>[0-9]{2})(?<d>[0-9]{2})T(?<h>[0-9]{2})(?<mi>[0-9]{2})(?<s>[0-9]{2})(?:[.,](?<f>[0-9]+))?" + $Z + "?$") | _ms(.)),
                    ($s | capture("^(?:[A-Z]+,?\\s+)?(?<d>[0-9]{1,2})[ -](?<mon>[A-Z]{3,9})[ -](?<y>[0-9]{2,4})\\s+" + $T + "\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?:[A-Z]+,?\\s+)?(?<mon>[A-Z]{3,9})\\.?\\s+(?<d>[0-9]{1,2}),?\\s+(?<y>[0-9]{4})(?:,?\\s+" + $T + ")?\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?:[A-Z]+\\s+)?(?<mon>[A-Z]{3,9})\\s+(?<d>[0-9]{1,2})\\s+" + $T + "\\s+(?:" + $Z + "\\s+)?(?<y>[0-9]{4})$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?<d>[0-9]{1,2})/(?<mon>[A-Z]{3})/(?<y>[0-9]{4}):" + $T + "\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.))
                  ) // null
                end;
            if $ts == null then null
            elif ($ts | type) == "number" then _num_ms($ts)
            elif ($ts | type) == "string" then _str($ts)
            elif ($ts | type) == "object" then
              if   $ts["$date"] != null then to_epoch_ms($ts["$date"])
              elif $ts["$numberLong"] != null then to_epoch_ms($ts["$numberLong"])
              elif $ts.seconds != null then
                ($ts.seconds | tostring | tonumber) * 1000
                + ((($ts.nanos // 0) | tostring | tonumber) / 1000000 | floor)
              else null end
            else null end;

          def sev_num($s):
            if ($s | type) == "number" then $s
            elif ($s | type) == "string" then
              ({"DEFAULT":0,"DEBUG":100,"INFO":200,"NOTICE":300,"WARNING":400,
                "ERROR":500,"CRITICAL":600,"ALERT":700,"EMERGENCY":800}[$s | ascii_upcase] // 0)
            else 0 end;

          def is_ip($s):
            def _v4: test("^((25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])[.]){3}(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])$");
            def _v6:
              if (contains(":") and test("^[0-9A-Fa-f:.]+$")) | not then false
              else
                split("::") as $p
                | if ($p | length) > 2 then false
                  else
                    [$p[] | select(. != "") | split(":")[]] as $g
                    | (($g | length) > 0 and ($g[-1] | contains("."))) as $tail4
                    | (if $tail4 then $g[0:-1] else $g end) as $hex
                    | (($hex | length) + (if $tail4 then 2 else 0 end)) as $n
                    | (if $tail4 then ($g[-1] | _v4) else true end)
                      and all($hex[]; test("^[0-9A-Fa-f]{1,4}$"))
                      and (if ($p | length) == 2 then $n <= 7 else $n == 8 end)
                  end
              end;
            ($s | type) == "string" and ($s | _v4 or _v6);

          . as $r
          | (($r.resource // {}).labels // {}) as $lbl
          | ($r.Payload // {}) as $pl
          | ($pl.ProtoPayload // {}) as $pp
          | ($pp.type_url // "") as $turl
          # With proto parsing off, value is opaque base64 protobuf: map the
          # LogEntry envelope only.
          | (if ($pp.value | type) == "object" then $pp.value else {} end) as $v
          | ($v != {} and ($turl | endswith("google.cloud.audit.AuditLog"))) as $is_audit
          | ($v != {} and ($turl | endswith("google.appengine.logging.v1.RequestLog"))) as $is_reqlog
          | ($v.request_metadata // {}) as $rm
          | ($v.authentication_info // {}) as $ai
          | (($r.log_name // "") | split("/logs/")) as $ln
          | ($lbl.project_id // ($ln[0] | ltrimstr("projects/") | select(. != "")) // null) as $project
          | (($ln[1] // "") | gsub("%2F"; "/")) as $log_id

          # --- operation, caller, status per payload kind ---
          | (if $is_audit then $v.method_name
             elif $is_reqlog then ([$v.method, $v.resource] | map(select(. != null)) | join(" "))
             else null end) as $op
          | ($op // ($log_id | select(. != "")) // "unknown") as $operation
          | (if $is_audit then $v.service_name
             elif $is_reqlog then ($v.host // $v.app_id)
             else null end) as $service
          | (if $is_audit then $rm.caller_ip elif $is_reqlog then $v.ip else null end) as $caller
          | (if $is_audit then $rm.caller_supplied_user_agent elif $is_reqlog then $v.user_agent else null end) as $ua
          | (if $is_audit then ($v.resource_name // null)
             elif $is_reqlog then $v.resource
             else null end) as $target

          | (if $is_reqlog then
               (($v.method // "") | ascii_upcase) as $m
               | if   $m == "POST" then 1
                 elif ($m == "GET" or $m == "HEAD") then 2
                 elif ($m == "PUT" or $m == "PATCH") then 3
                 elif $m == "DELETE" then 4
                 else 99 end
             elif $is_audit then
               ((($v.method_name // "") | split(".") | last) // "" | ascii_downcase) as $verb
               | if   ($verb | test("^(insert|create|add|import|generate)")) then 1
                 elif ($verb | test("^(get|list|read|search|aggregatedlist|batchget|lookup|query|testiampermissions|export)")) then 2
                 elif ($verb | test("^(update|patch|set|write|replace|modify|enable|disable|move|rename|start|stop|reset|resize|attach|detach)")) then 3
                 elif ($verb | test("^(delete|remove|destroy|purge|undelete)")) then 4
                 else 99 end
             else 99 end) as $activity_id

          | (if $is_audit then (($v.status // {}).code // 0)
             elif $is_reqlog then ($v.status // null)
             else null end) as $code
          | (if $code == null then 0
             elif $is_reqlog then (if $code < 400 then 1 else 2 end)
             elif $code == 0 then 1 else 2 end) as $status_id

          | sev_num($r.severity) as $sev
          | (if   $sev >= 800 then 6
             elif $sev >= 600 then 5
             elif $sev >= 500 then 4
             elif $sev >= 400 then 3
             else 1 end) as $severity_id

          | {
              # --- Classification (REQUIRED) ---
              "category_uid": 6,
              "class_uid":    6003,
              "activity_id":  $activity_id,
              "type_uid":     (6003 * 100 + $activity_id),
              "severity_id":  $severity_id,

              # --- Time (REQUIRED; epoch milliseconds) ---
              "time": to_epoch_ms($r.timestamp),

              # --- Status ---
              "status_id": $status_id,
              "status": ({"0":"Unknown","1":"Success","2":"Failure"}[$status_id | tostring]),
              "status_code": (if $code == null then null else ($code | tostring) end),
              "status_detail": (if $is_audit then ($v.status // {}).message else null end),

              # --- Metadata (REQUIRED) ---
              "metadata": {
                "profiles": ["cloud"],
                "version": "1.9.0",
                "product": {
                  "vendor_name": "Google",
                  "name": "Google Cloud Logging"
                },
                "uid": $r.insert_id,
                "log_name": $r.log_name,
                "logged_time": to_epoch_ms($r.receive_timestamp),
                "event_code": $turl,
                "labels": [ ($r.labels // {}) | to_entries[] | "\(.key)=\(.value)" ]
              },

              # --- Cloud (cloud profile) ---
              "cloud": {
                "provider": "GCP",
                "account": { "uid": $project },
                "region": ($lbl.region // $lbl.location),
                "zone": $lbl.zone
              },

              # --- Actor (REQUIRED) ---
              "actor": {
                "user": (if $ai.principal_email then {
                  "name": $ai.principal_email,
                  "email_addr": $ai.principal_email,
                  "uid": $ai.principal_subject
                } else null end),
                "application": { "name": ($service // ($r.resource // {}).type) }
              },

              # --- API (REQUIRED; operation required) ---
              "api": {
                "operation": $operation,
                "service": { "name": $service },
                "response": (if $is_audit and $code != null then {
                  "code": $code,
                  "error_message": ($v.status // {}).message
                } else null end)
              },

              # --- Source endpoint (REQUIRED) ---
              "src_endpoint": (
                { "ip": (if is_ip($caller) then $caller else null end),
                  "name": (if $caller != null and (is_ip($caller) | not) then $caller else null end) }
                | if .ip == null and .name == null then { "name": "unknown" } else . end
              ),

              # --- HTTP request / response ---
              "http_request": {
                "user_agent": $ua,
                "http_method": (if $is_reqlog then $v.method else null end),
                "url": (if $is_reqlog then { "hostname": $v.host, "path": $v.resource } else null end)
              },
              "http_response": (if $is_reqlog and $code != null then { "code": $code } else null end),

              # --- Resources ---
              "resources": [
                {
                  "type": ($r.resource // {}).type,
                  "name": $target,
                  "uid": ($lbl.instance_id // $lbl.bucket_name // $lbl.module_id),
                  "labels": [ $lbl | to_entries[] | "\(.key)=\(.value)" ]
                }
              ],

              # --- Message ---
              "message": (
                if $is_audit then
                  ($operation + (if $target then " on " + $target else "" end))
                elif $is_reqlog then
                  ($operation + (if $code != null then " -> \($code)" else "" end))
                elif $pl.TextPayload then $pl.TextPayload
                elif $pl.JsonPayload then ($pl.JsonPayload.message // ($pl.JsonPayload | tostring))
                else null end
              ),

              # --- Observables ---
              "observables": [
                (if is_ip($caller) then {"name": "src_endpoint.ip", "type_id": 2, "value": $caller} else empty end),
                (if $ai.principal_email then {"name": "actor.user.email_addr", "type_id": 5, "value": $ai.principal_email} else empty end)
              ],

              # --- Original record ---
              "raw_data": ($r | tostring)
            }
          | walk(
              if type == "object" then with_entries(select(.value != null and .value != "" and .value != [] and .value != {}))
              elif type == "array" then map(select(. != null and . != {}))
              else . end)
