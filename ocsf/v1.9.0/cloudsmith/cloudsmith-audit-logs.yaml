name: "Cloudsmith Audit Logs to OCSF v1.9.0"
description: "Transforms Cloudsmith audit log records into the OCSF v1.9.0 API Activity (6003) class."
author: "Monad"
contributors:
  - "https://github.com/behobu"
inputs:
  - "cloudsmith-audit-logs"
tags:
  - "v1.9.0"
  - "ocsf"
  - "cloudsmith"
  - "application"
  - "api-activity"
config:
  operations:
    - operation: "jq"
      arguments:
        key: ""
        query: |
          # ---------------------------------------------------------------
          # OCSF API Activity (class_uid=6003) — v1.9.0
          # Input: one Cloudsmith audit-log record per invocation.
          # (Cloudsmith NamespaceAuditLog: event, actor, actor_kind,
          #  actor_ip_address, actor_location, object, object_kind, target,
          #  event_at, uuid, context, ...)
          # ---------------------------------------------------------------

          def to_epoch_ms($ts):
            def _n: if . == null then null else tonumber end;
            def _num_ms($n):
              if   $n >= 1e17 then ($n / 1000000 | floor)
              elif $n >= 1e14 then ($n / 1000 | floor)
              elif $n >= 1e11 then ($n | floor)
              else ($n * 1000 + 0.001 | floor) end;
            def _digits_ms($d):
              ($d | ltrimstr("-") | length) as $l
              | if   $l >= 18 then ($d[0:-6] | tonumber)
                elif $l >= 15 then ($d[0:-3] | tonumber)
                elif $l >= 12 then ($d | tonumber)
                else ($d | tonumber) * 1000 end;
            def _frac_ms($f): if $f == null then 0 else (($f + "000")[0:3] | tonumber) end;
            def _mon($m):
              if $m == null then null
              else {"JAN":1,"FEB":2,"MAR":3,"APR":4,"MAY":5,"JUN":6,
                    "JUL":7,"AUG":8,"SEP":9,"OCT":10,"NOV":11,"DEC":12}[$m[0:3]] end;
            def _zone($z):
              if $z == null or $z == "" then 0
              else
                ($z | if test("^(UTC|GMT|UT)[+-]") then sub("^(UTC|GMT|UT)"; "") else . end) as $z
                | if ($z | test("^[+-][0-9]{1,2}(:?[0-9]{2})?$")) then
                    ($z | capture("^(?<sg>[+-])(?<h>[0-9]{1,2}):?(?<m>[0-9]{2})?$")) as $o
                    | (if $o.sg == "-" then -1 else 1 end)
                      * (($o.h | tonumber) * 3600 + (($o.m // "0") | tonumber) * 60)
                  else
                    {"Z":0,"UTC":0,"GMT":0,"UT":0,"EST":-18000,"EDT":-14400,"CST":-21600,
                     "CDT":-18000,"MST":-25200,"MDT":-21600,"PST":-28800,"PDT":-25200}[$z]
                  end
              end;
            def _ms($c):
              ($c.y | tonumber | if . < 100 then (if . < 70 then . + 2000 else . + 1900 end) else . end) as $y
              | ($c.mo | _n) as $mo
              | ($c.d | tonumber) as $d
              | (($c.h // "0") | tonumber) as $h
              | (($c.mi // "0") | tonumber) as $mi
              | (($c.s // "0") | tonumber) as $s
              | _zone($c.z) as $off
              | if $mo == null or $off == null or $mo < 1 or $mo > 12 or $d < 1 or $d > 31
                   or $h > 23 or $mi > 59 or $s > 60 then null
                else
                  ($y - (if $mo <= 2 then 1 else 0 end)) as $yy
                  | ($yy / 400 | floor) as $era
                  | ($yy - $era * 400) as $yoe
                  | (((153 * ($mo + (if $mo > 2 then -3 else 9 end)) + 2) / 5 | floor) + $d - 1) as $doy
                  | ($yoe * 365 + ($yoe / 4 | floor) - ($yoe / 100 | floor) + $doy) as $doe
                  | ($era * 146097 + $doe - 719468) as $days
                  | ($days * 86400 + $h * 3600 + $mi * 60 + $s - $off) * 1000 + _frac_ms($c.f)
                end;
            def _str($raw):
              ($raw | ascii_upcase | sub("\\s*\\([^)]*\\)\\s*$"; "") | sub("^\\s+"; "") | sub("\\s+$"; "")) as $s
              | "(?<z>Z|(?:UTC|GMT|UT)?[+-][0-9]{1,2}(?::?[0-9]{2})?|[A-Z]{1,5})" as $Z
              | "(?<h>[0-9]{1,2}):(?<mi>[0-9]{2})(?::(?<s>[0-9]{2}))?(?:[.,](?<f>[0-9]+))?" as $T
              | if $s == "" then null
                elif ($s | test("^-?[0-9]+$")) then _digits_ms($s)
                elif ($s | test("^[0-9]+\\.[0-9]+$")) then
                  ($s | split(".")) as $p
                  | if ($p[0] | length) <= 11 then _digits_ms($p[0]) + _frac_ms($p[1])
                    else _digits_ms($p[0]) end
                elif ($s | test("^/DATE\\(-?[0-9]+([+-][0-9]{4})?\\)/$")) then
                  ($s | capture("(?<ms>-?[0-9]+)").ms | tonumber)
                else
                  first(
                    ($s | capture("^(?<y>[0-9]{4})[-/](?<mo>[0-9]{1,2})[-/](?<d>[0-9]{1,2})(?:[T ]+" + $T + ")?\\s*" + $Z + "?(?:\\s+[A-Z]{2,5})?$") | _ms(.)),
                    ($s | capture("^(?<y>[0-9]{4})(?<mo>[0-9]{2})(?<d>[0-9]{2})T(?<h>[0-9]{2})(?<mi>[0-9]{2})(?<s>[0-9]{2})(?:[.,](?<f>[0-9]+))?" + $Z + "?$") | _ms(.)),
                    ($s | capture("^(?:[A-Z]+,?\\s+)?(?<d>[0-9]{1,2})[ -](?<mon>[A-Z]{3,9})[ -](?<y>[0-9]{2,4})\\s+" + $T + "\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?:[A-Z]+,?\\s+)?(?<mon>[A-Z]{3,9})\\.?\\s+(?<d>[0-9]{1,2}),?\\s+(?<y>[0-9]{4})(?:,?\\s+" + $T + ")?\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?:[A-Z]+\\s+)?(?<mon>[A-Z]{3,9})\\s+(?<d>[0-9]{1,2})\\s+" + $T + "\\s+(?:" + $Z + "\\s+)?(?<y>[0-9]{4})$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?<d>[0-9]{1,2})/(?<mon>[A-Z]{3})/(?<y>[0-9]{4}):" + $T + "\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.))
                  ) // null
                end;
            if $ts == null then null
            elif ($ts | type) == "number" then _num_ms($ts)
            elif ($ts | type) == "string" then _str($ts)
            elif ($ts | type) == "object" then
              if   $ts["$date"] != null then to_epoch_ms($ts["$date"])
              elif $ts["$numberLong"] != null then to_epoch_ms($ts["$numberLong"])
              elif $ts.seconds != null then
                ($ts.seconds | tostring | tonumber) * 1000
                + ((($ts.nanos // 0) | tostring | tonumber) / 1000000 | floor)
              else null end
            else null end;

          . as $r
          | ($r.event // "")            as $ev
          | ($ev | ascii_downcase)      as $evl
          | (if   ($evl | test("creat|add|invit|generat|publish|upload|push")) then 1
             elif ($evl | test("delet|remov|revok|destroy|purge"))             then 4
             elif ($evl | test("updat|chang|modif|edit|renam|set|sync|promot")) then 3
             elif ($evl | test("download|read|view|list|get|access|pull|login|auth")) then 2
             else 99 end) as $act_id
          | ($r.actor_kind // "")       as $ak
          | (if   $ak == "user"            then 1
             elif $ak == "system"          then 3
             elif $ak == "service_account" then 4
             else 0 end) as $utid
          | ($r.actor_location // {})   as $loc
          | {
              category_uid: 6,
              category_name: "Application Activity",
              class_uid: 6003,
              class_name: "API Activity",
              activity_id: $act_id,
              type_uid: (6003 * 100 + $act_id),
              severity_id: 1,
              severity: "Informational",
              status_id: 1,
              status: "Success",
              time: to_epoch_ms($r.event_at),

              metadata: {
                "profiles": ["cloud", "osint"],
                version: "1.9.0",
                product: {
                  vendor_name: "Cloudsmith",
                  name: "Cloudsmith Audit Logs"
                },
                uid: $r.uuid,
                log_name: "audit-log"
              },

              cloud: { provider: "Cloudsmith" },

              actor: {
                user: ({
                  name: $r.actor,
                  uid: $r.actor_slug_perm,
                  type_id: $utid
                } + (if ($r.actor // "") | test("@") then { email_addr: $r.actor } else {} end))
              },

              api: {
                operation: (if $ev != "" then $ev else "unknown" end),
                service: { name: $r.object_kind },
                request: { uid: $r.uuid }
              },

              src_endpoint: ({ ip: $r.actor_ip_address, svc_name: (($r.context // "cloudsmith") + " (cloudsmith)") }
                + (if ($loc | length) > 0 then { location: {
                      city: $loc.city,
                      country: $loc.country_code,
                      continent: $loc.continent,
                      postal_code: $loc.postal_code,
                      lat: $loc.latitude,
                      long: $loc.longitude
                    } } else {} end)),

              osint: ([
                (if ($r.actor_ip_address // "") != "" then { type_id: 1, value: $r.actor_ip_address } else empty end),
                (if ($r.actor_url // "") != ""        then { type_id: 5, value: $r.actor_url }        else empty end)
              ] | if length == 0 then [ { type_id: 99, value: ($r.object_slug_perm // $r.uuid // $ev) } ] else . end),

              resources: ([
                { type: $r.object_kind, name: $r.object, uid: $r.object_slug_perm },
                (if ($r.target // "") != "" then { type: $r.target_kind, name: $r.target, uid: $r.target_slug_perm } else empty end)
              ]),

              message: ($ev
                        + (if ($r.actor // "") != "" then " by " + $r.actor else "" end)
                        + (if ($r.object // "") != "" then " on " + $r.object else "" end)),

              observables: ([
                (if ($r.actor // "") != ""            then { name: "actor.user.name", type_id: 4, value: $r.actor } else empty end),
                (if ($r.actor_ip_address // "") != "" then { name: "src_endpoint.ip",  type_id: 2, value: $r.actor_ip_address } else empty end)
              ]),

              unmapped: {
                context: $r.context,
                actor_kind: $r.actor_kind,
                object_kind: $r.object_kind,
                target_kind: $r.target_kind
              },

              raw_data: ($r | tostring)
            }
          # Prune nulls / empty strings / empty containers (required fields stay populated).
          | walk(if type == "object"
                 then with_entries(select(.value != null and .value != "" and .value != [] and .value != {}))
                 else . end)
