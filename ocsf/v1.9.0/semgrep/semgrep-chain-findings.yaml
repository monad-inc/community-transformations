name: "Semgrep Supply Chain Findings to OCSF v1.9.0"
description: "Transforms Semgrep Supply Chain (dependency) Findings into the OCSF v1.9.0 Vulnerability Finding class."
author: "Monad"
contributors:
  - "https://github.com/behobu"
  - "https://github.com/Credgate"
inputs:
  - "semgrep-chain-findings"
tags:
  - "v1.9.0"
  - "ocsf"
  - "semgrep"
  - "supply-chain"
  - "vulnerability"
  - "findings"
config:
  operations:
    - operation: "jq"
      arguments:
        key: ""
        query: |
          # ---------------------------------------------------------------
          # OCSF Vulnerability Finding (class_uid=2002) — v1.9.0
          # Input: one semgrep-chain-findings record per invocation.
          # ---------------------------------------------------------------


          def to_epoch_ms($ts):
            def _n: if . == null then null else tonumber end;
            def _num_ms($n):
              if   $n >= 1e17 then ($n / 1000000 | floor)
              elif $n >= 1e14 then ($n / 1000 | floor)
              elif $n >= 1e11 then ($n | floor)
              else ($n * 1000 + 0.001 | floor) end;
            def _digits_ms($d):
              ($d | ltrimstr("-") | length) as $l
              | if   $l >= 18 then ($d[0:-6] | tonumber)
                elif $l >= 15 then ($d[0:-3] | tonumber)
                elif $l >= 12 then ($d | tonumber)
                else ($d | tonumber) * 1000 end;
            def _frac_ms($f): if $f == null then 0 else (($f + "000")[0:3] | tonumber) end;
            def _mon($m):
              if $m == null then null
              else {"JAN":1,"FEB":2,"MAR":3,"APR":4,"MAY":5,"JUN":6,
                    "JUL":7,"AUG":8,"SEP":9,"OCT":10,"NOV":11,"DEC":12}[$m[0:3]] end;
            def _zone($z):
              if $z == null or $z == "" then 0
              else
                ($z | if test("^(UTC|GMT|UT)[+-]") then sub("^(UTC|GMT|UT)"; "") else . end) as $z
                | if ($z | test("^[+-][0-9]{1,2}(:?[0-9]{2})?$")) then
                    ($z | capture("^(?<sg>[+-])(?<h>[0-9]{1,2}):?(?<m>[0-9]{2})?$")) as $o
                    | (if $o.sg == "-" then -1 else 1 end)
                      * (($o.h | tonumber) * 3600 + (($o.m // "0") | tonumber) * 60)
                  else
                    {"Z":0,"UTC":0,"GMT":0,"UT":0,"EST":-18000,"EDT":-14400,"CST":-21600,
                     "CDT":-18000,"MST":-25200,"MDT":-21600,"PST":-28800,"PDT":-25200}[$z]
                  end
              end;
            def _ms($c):
              ($c.y | tonumber | if . < 100 then (if . < 70 then . + 2000 else . + 1900 end) else . end) as $y
              | ($c.mo | _n) as $mo
              | ($c.d | tonumber) as $d
              | (($c.h // "0") | tonumber) as $h
              | (($c.mi // "0") | tonumber) as $mi
              | (($c.s // "0") | tonumber) as $s
              | _zone($c.z) as $off
              | if $mo == null or $off == null or $mo < 1 or $mo > 12 or $d < 1 or $d > 31
                   or $h > 23 or $mi > 59 or $s > 60 then null
                else
                  ($y - (if $mo <= 2 then 1 else 0 end)) as $yy
                  | ($yy / 400 | floor) as $era
                  | ($yy - $era * 400) as $yoe
                  | (((153 * ($mo + (if $mo > 2 then -3 else 9 end)) + 2) / 5 | floor) + $d - 1) as $doy
                  | ($yoe * 365 + ($yoe / 4 | floor) - ($yoe / 100 | floor) + $doy) as $doe
                  | ($era * 146097 + $doe - 719468) as $days
                  | ($days * 86400 + $h * 3600 + $mi * 60 + $s - $off) * 1000 + _frac_ms($c.f)
                end;
            def _str($raw):
              ($raw | ascii_upcase | sub("\\s*\\([^)]*\\)\\s*$"; "") | sub("^\\s+"; "") | sub("\\s+$"; "")) as $s
              | "(?<z>Z|(?:UTC|GMT|UT)?[+-][0-9]{1,2}(?::?[0-9]{2})?|[A-Z]{1,5})" as $Z
              | "(?<h>[0-9]{1,2}):(?<mi>[0-9]{2})(?::(?<s>[0-9]{2}))?(?:[.,](?<f>[0-9]+))?" as $T
              | if $s == "" then null
                elif ($s | test("^-?[0-9]+$")) then _digits_ms($s)
                elif ($s | test("^[0-9]+\\.[0-9]+$")) then
                  ($s | split(".")) as $p
                  | if ($p[0] | length) <= 11 then _digits_ms($p[0]) + _frac_ms($p[1])
                    else _digits_ms($p[0]) end
                elif ($s | test("^/DATE\\(-?[0-9]+([+-][0-9]{4})?\\)/$")) then
                  ($s | capture("(?<ms>-?[0-9]+)").ms | tonumber)
                else
                  first(
                    ($s | capture("^(?<y>[0-9]{4})[-/](?<mo>[0-9]{1,2})[-/](?<d>[0-9]{1,2})(?:[T ]+" + $T + ")?\\s*" + $Z + "?(?:\\s+[A-Z]{2,5})?$") | _ms(.)),
                    ($s | capture("^(?<y>[0-9]{4})(?<mo>[0-9]{2})(?<d>[0-9]{2})T(?<h>[0-9]{2})(?<mi>[0-9]{2})(?<s>[0-9]{2})(?:[.,](?<f>[0-9]+))?" + $Z + "?$") | _ms(.)),
                    ($s | capture("^(?:[A-Z]+,?\\s+)?(?<d>[0-9]{1,2})[ -](?<mon>[A-Z]{3,9})[ -](?<y>[0-9]{2,4})\\s+" + $T + "\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?:[A-Z]+,?\\s+)?(?<mon>[A-Z]{3,9})\\.?\\s+(?<d>[0-9]{1,2}),?\\s+(?<y>[0-9]{4})(?:,?\\s+" + $T + ")?\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?:[A-Z]+\\s+)?(?<mon>[A-Z]{3,9})\\s+(?<d>[0-9]{1,2})\\s+" + $T + "\\s+(?:" + $Z + "\\s+)?(?<y>[0-9]{4})$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?<d>[0-9]{1,2})/(?<mon>[A-Z]{3})/(?<y>[0-9]{4}):" + $T + "\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.))
                  ) // null
                end;
            if $ts == null then null
            elif ($ts | type) == "number" then _num_ms($ts)
            elif ($ts | type) == "string" then _str($ts)
            elif ($ts | type) == "object" then
              if   $ts["$date"] != null then to_epoch_ms($ts["$date"])
              elif $ts["$numberLong"] != null then to_epoch_ms($ts["$numberLong"])
              elif $ts.seconds != null then
                ($ts.seconds | tostring | tonumber) * 1000
                + ((($ts.nanos // 0) | tostring | tonumber) / 1000000 | floor)
              else null end
            else null end;

          . as $r
          | ($r.severity // "" | ascii_downcase) as $sev
          | (if   $sev == "critical" then 5
             elif $sev == "high"     then 4
             elif $sev == "medium"   then 3
             elif $sev == "low"      then 2
             else 1 end) as $sev_id
          | ($r.rule.cwe_names[0] // null) as $cwe0
          | (($r.rule.vulnerability_identifier // "") | startswith("CVE-")) as $has_cve
          | ({ "5": "Critical", "4": "High", "3": "Medium", "2": "Low", "1": "Informational" }[$sev_id | tostring] // "Unknown") as $sev_caption
          | ($r.found_dependency // {}) as $dep
          | (if ($dep.package // null) != null
             then ($dep.package + (if ($dep.version // null) != null then "@" + $dep.version else "" end))
             else ($r.repository.name // ($r.id | tostring)) end) as $indicator
          | {
              "class_uid": 2002,
              "category_uid": 2,
              "activity_id": 1,
              "type_uid": 200201,
              "severity_id": $sev_id,
              "severity": $sev_caption,

              "time": to_epoch_ms($r.created_at),
              "start_time": to_epoch_ms($r.relevant_since),

              "status_id": (if ($r.status // $r.state) == "open" or ($r.status // $r.state) == "unresolved" then 1
                            elif ($r.status // $r.state) == "resolved" or ($r.status // $r.state) == "fixed" then 4
                            else 0 end),
              "status": (if ($r.status // $r.state) == "resolved" or ($r.status // $r.state) == "fixed" then "Resolved" else "New" end),
              "message": $r.rule_message,

              "observables": [
                { "name": "finding_info.uid", "type_id": 0, "value": ($r.id | tostring) },
                { "name": "metadata.uid", "type_id": 0, "value": ($r.id | tostring) }
              ],

              "metadata": {
                "profiles": ["cloud", "osint"],
                "version": "1.9.0",
                "product": {
                  "vendor_name": "Semgrep",
                  "name": "Semgrep Supply Chain"
                },
                "uid": ($r.id | tostring)
              },

              "cloud": {
                "provider": "Unknown",
                "account": { "name": $r.repository.name }
              },

              "finding_info": {
                "uid": ($r.id | tostring),
                "title": $r.rule_name,
                "desc": $r.rule_message,
                "first_seen_time": to_epoch_ms($r.relevant_since),
                "src_url": ($r.repository.url // null)
              },

              "osint": [
                {
                  "value": $indicator,
                  "type_id": 99,
                  "type": "Software Package"
                }
              ],

              "vulnerabilities": [
                {
                  "desc": $r.rule_message,
                  "title": $r.rule_name,
                  "severity": ($r.severity // "Unknown"),
                  "vendor_name": "Semgrep",
                  "is_fix_available": (($r.fix_recommendations // []) | length > 0),
                  "first_seen_time": to_epoch_ms($r.relevant_since),
                  "last_seen_time": to_epoch_ms($r.created_at),
                  # vulnerability carries a just_one [advisory, cve, cwe]
                  # constraint — emit exactly one. Prefer the CVE (more
                  # actionable); fall back to the CWE only when no CVE exists.
                  "cve": (if $has_cve
                          then { "uid": $r.rule.vulnerability_identifier }
                          else null end),
                  "cwe": (if ($has_cve | not) and $cwe0 != null
                          then {
                            "uid": ($cwe0 | split(":")[0]),
                            "caption": ($cwe0 | split(": ")[1:] | join(": ")),
                            "src_url": "https://cwe.mitre.org/"
                          }
                          else null end),
                  "affected_packages": [
                    {
                      "name": ($dep.package // null),
                      "version": ($dep.version // null),
                      "package_manager": ($dep.ecosystem // null),
                      "fixed_in_version": ($r.fix_recommendations // [] | (.[0].version // null))
                    }
                  ],
                  "affected_code": [
                    {
                      "file": {
                        "path": $r.location.file_path,
                        "name": ($r.location.file_path | split("/")[-1]),
                        "type_id": 0
                      },
                      "start_line": $r.location.line,
                      "end_line": $r.location.end_line
                    }
                  ],
                  "references": ($r.rule.references // $r.rule.owasp_names // null)
                }
              ],

              "raw_data": ($r | tostring)
            }
          | walk(if type == "object" then with_entries(select(.value != null and .value != [] and .value != {})) else . end)
