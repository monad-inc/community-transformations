name: "Microsoft Entra ID Sign-in Logs to OCSF v1.9.0"
description: "Transforms Microsoft Entra ID (Azure AD) sign-in log records into the OCSF v1.9.0 Authentication class (class_uid 3002)."
author: "Monad"
contributors:
  - "https://github.com/behobu"
inputs:
  - "microsoft-entra-id"
tags:
  - "v1.9.0"
  - "ocsf"
  - "microsoft"
  - "entra-id"
  - "authentication"
config:
  operations:
    - operation: "jq"
      arguments:
        key: ""
        query: |
          # ---------------------------------------------------------------
          # OCSF Authentication (class_uid=3002) — v1.9.0
          # Input: one Microsoft Entra ID (Azure AD) sign-in log record per
          # invocation, as emitted by the Monad `microsoft-entra-id` input
          # (Microsoft Graph auditLogs/signIns resource shape).
          # ---------------------------------------------------------------


          def to_epoch_ms($ts):
            def _n: if . == null then null else tonumber end;
            def _num_ms($n):
              if   $n >= 1e17 then ($n / 1000000 | floor)
              elif $n >= 1e14 then ($n / 1000 | floor)
              elif $n >= 1e11 then ($n | floor)
              else ($n * 1000 + 0.001 | floor) end;
            def _digits_ms($d):
              ($d | ltrimstr("-") | length) as $l
              | if   $l >= 18 then ($d[0:-6] | tonumber)
                elif $l >= 15 then ($d[0:-3] | tonumber)
                elif $l >= 12 then ($d | tonumber)
                else ($d | tonumber) * 1000 end;
            def _frac_ms($f): if $f == null then 0 else (($f + "000")[0:3] | tonumber) end;
            def _mon($m):
              if $m == null then null
              else {"JAN":1,"FEB":2,"MAR":3,"APR":4,"MAY":5,"JUN":6,
                    "JUL":7,"AUG":8,"SEP":9,"OCT":10,"NOV":11,"DEC":12}[$m[0:3]] end;
            def _zone($z):
              if $z == null or $z == "" then 0
              else
                ($z | if test("^(UTC|GMT|UT)[+-]") then sub("^(UTC|GMT|UT)"; "") else . end) as $z
                | if ($z | test("^[+-][0-9]{1,2}(:?[0-9]{2})?$")) then
                    ($z | capture("^(?<sg>[+-])(?<h>[0-9]{1,2}):?(?<m>[0-9]{2})?$")) as $o
                    | (if $o.sg == "-" then -1 else 1 end)
                      * (($o.h | tonumber) * 3600 + (($o.m // "0") | tonumber) * 60)
                  else
                    {"Z":0,"UTC":0,"GMT":0,"UT":0,"EST":-18000,"EDT":-14400,"CST":-21600,
                     "CDT":-18000,"MST":-25200,"MDT":-21600,"PST":-28800,"PDT":-25200}[$z]
                  end
              end;
            def _ms($c):
              ($c.y | tonumber | if . < 100 then (if . < 70 then . + 2000 else . + 1900 end) else . end) as $y
              | ($c.mo | _n) as $mo
              | ($c.d | tonumber) as $d
              | (($c.h // "0") | tonumber) as $h
              | (($c.mi // "0") | tonumber) as $mi
              | (($c.s // "0") | tonumber) as $s
              | _zone($c.z) as $off
              | if $mo == null or $off == null or $mo < 1 or $mo > 12 or $d < 1 or $d > 31
                   or $h > 23 or $mi > 59 or $s > 60 then null
                else
                  ($y - (if $mo <= 2 then 1 else 0 end)) as $yy
                  | ($yy / 400 | floor) as $era
                  | ($yy - $era * 400) as $yoe
                  | (((153 * ($mo + (if $mo > 2 then -3 else 9 end)) + 2) / 5 | floor) + $d - 1) as $doy
                  | ($yoe * 365 + ($yoe / 4 | floor) - ($yoe / 100 | floor) + $doy) as $doe
                  | ($era * 146097 + $doe - 719468) as $days
                  | ($days * 86400 + $h * 3600 + $mi * 60 + $s - $off) * 1000 + _frac_ms($c.f)
                end;
            def _str($raw):
              ($raw | ascii_upcase | sub("\\s*\\([^)]*\\)\\s*$"; "") | sub("^\\s+"; "") | sub("\\s+$"; "")) as $s
              | "(?<z>Z|(?:UTC|GMT|UT)?[+-][0-9]{1,2}(?::?[0-9]{2})?|[A-Z]{1,5})" as $Z
              | "(?<h>[0-9]{1,2}):(?<mi>[0-9]{2})(?::(?<s>[0-9]{2}))?(?:[.,](?<f>[0-9]+))?" as $T
              | if $s == "" then null
                elif ($s | test("^-?[0-9]+$")) then _digits_ms($s)
                elif ($s | test("^[0-9]+\\.[0-9]+$")) then
                  ($s | split(".")) as $p
                  | if ($p[0] | length) <= 11 then _digits_ms($p[0]) + _frac_ms($p[1])
                    else _digits_ms($p[0]) end
                elif ($s | test("^/DATE\\(-?[0-9]+([+-][0-9]{4})?\\)/$")) then
                  ($s | capture("(?<ms>-?[0-9]+)").ms | tonumber)
                else
                  first(
                    ($s | capture("^(?<y>[0-9]{4})[-/](?<mo>[0-9]{1,2})[-/](?<d>[0-9]{1,2})(?:[T ]+" + $T + ")?\\s*" + $Z + "?(?:\\s+[A-Z]{2,5})?$") | _ms(.)),
                    ($s | capture("^(?<y>[0-9]{4})(?<mo>[0-9]{2})(?<d>[0-9]{2})T(?<h>[0-9]{2})(?<mi>[0-9]{2})(?<s>[0-9]{2})(?:[.,](?<f>[0-9]+))?" + $Z + "?$") | _ms(.)),
                    ($s | capture("^(?:[A-Z]+,?\\s+)?(?<d>[0-9]{1,2})[ -](?<mon>[A-Z]{3,9})[ -](?<y>[0-9]{2,4})\\s+" + $T + "\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?:[A-Z]+,?\\s+)?(?<mon>[A-Z]{3,9})\\.?\\s+(?<d>[0-9]{1,2}),?\\s+(?<y>[0-9]{4})(?:,?\\s+" + $T + ")?\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?:[A-Z]+\\s+)?(?<mon>[A-Z]{3,9})\\s+(?<d>[0-9]{1,2})\\s+" + $T + "\\s+(?:" + $Z + "\\s+)?(?<y>[0-9]{4})$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?<d>[0-9]{1,2})/(?<mon>[A-Z]{3})/(?<y>[0-9]{4}):" + $T + "\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.))
                  ) // null
                end;
            if $ts == null then null
            elif ($ts | type) == "number" then _num_ms($ts)
            elif ($ts | type) == "string" then _str($ts)
            elif ($ts | type) == "object" then
              if   $ts["$date"] != null then to_epoch_ms($ts["$date"])
              elif $ts["$numberLong"] != null then to_epoch_ms($ts["$numberLong"])
              elif $ts.seconds != null then
                ($ts.seconds | tostring | tonumber) * 1000
                + ((($ts.nanos // 0) | tostring | tonumber) / 1000000 | floor)
              else null end
            else null end;

          . as $r
          | ( $r.status // {} ) as $st
          | ( $r.deviceDetail // {} ) as $dd
          | ( $r.location // {} ) as $loc
          # Entra sign-in success is signalled by status.errorCode == 0.
          | ( ($st.errorCode // 0) == 0 ) as $ok
          # multiFactorAuthentication requirement -> is_mfa true.
          | ( ($r.authenticationRequirement // "") == "multiFactorAuthentication" ) as $mfa
          | {
              # --- Classification (REQUIRED) ---
              category_uid: 3,
              category_name: "Identity & Access Management",
              class_uid: 3002,
              class_name: "Authentication",
              activity_id: 1,
              activity_name: "Logon",
              type_uid: 300201,
              type_name: "Authentication: Logon",

              # --- Severity: success is informational; a failed sign-in is
              #     surfaced as Medium so downstream detection can key on it ---
              severity_id: ( if $ok then 1 else 3 end ),
              severity: ( if $ok then "Informational" else "Medium" end ),

              # --- Status ---
              status_id: ( if $ok then 1 else 2 end ),
              status: ( if $ok then "Success" else "Failure" end ),
              status_code: (($st.errorCode // 0) | tostring),
              status_detail: ($st.failureReason // $st.additionalDetails),

              # --- Time (REQUIRED) ---
              time: to_epoch_ms($r.createdDateTime),

              # --- Auth details ---
              is_mfa: $mfa,
              # Entra sign-in logs don't report the underlying auth protocol
              # (NTLM/Kerberos/etc.); the MFA requirement is carried by is_mfa.
              auth_protocol_id: 0,
              auth_protocol: "Unknown",
              logon_type: ($r.clientAppUsed),

              # --- User (REQUIRED) ---
              user: {
                type_id: 1,
                type: "User",
                name: ($r.userPrincipalName),
                uid: ($r.userId),
                full_name: ($r.userDisplayName),
                email_addr: ($r.userPrincipalName)
              },

              # --- Service (satisfies the class at_least_one[service,dst_endpoint]) ---
              service: {
                name: ($r.resourceDisplayName),
                uid: ($r.resourceId)
              },

              # --- Source endpoint ---
              src_endpoint: {
                ip: ($r.ipAddress),
                location: {
                  city: ($loc.city),
                  region: ($loc.state),
                  country: ($loc.countryOrRegion),
                  lat: ($loc.geoCoordinates.latitude),
                  long: ($loc.geoCoordinates.longitude)
                }
              },

              # --- Device ---
              device: {
                type_id: 0,
                uid: ($dd.deviceId),
                name: ($dd.displayName),
                os: (
                  if ($dd.operatingSystem // "") != ""
                  then {
                    name: $dd.operatingSystem,
                    type_id: (
                      ($dd.operatingSystem | ascii_downcase) as $os
                      | if   ($os | test("windows")) then 100
                        elif ($os | test("ipados")) then 302
                        elif ($os | test("ios")) then 301
                        elif ($os | test("mac")) then 300
                        elif ($os | test("android")) then 201
                        elif ($os | test("linux")) then 200
                        else 0 end
                    )
                  }
                  else null end
                ),
                is_compliant: ($dd.isCompliant),
                is_managed: ($dd.isManaged)
              },

              # --- Session ---
              session: {
                uid: ($r.correlationId),
                is_remote: true
              },

              # --- Cloud (Entra ID is an Azure cloud IAM service) ---
              cloud: {
                provider: "Microsoft Azure",
                account: {
                  uid: ($r.resourceTenantId // $r.homeTenantId),
                  type: "Azure AD Tenant"
                }
              },

              # --- OSINT: the sign-in source address as an observed indicator.
              #     The Authentication class carries an osint context array;
              #     populate it with the client IP seen on this event. ---
              osint: [
                {
                  type_id: 1,
                  value: ($r.ipAddress // "unknown")
                }
              ],

              # --- Metadata (REQUIRED) ---
              metadata: {
                "profiles": ["cloud", "osint", "host", "security_control"],
                version: "1.9.0",
                uid: ($r.id),
                correlation_uid: ($r.correlationId),
                original_time: ($r.createdDateTime),
                product: {
                  vendor_name: "Microsoft",
                  name: "Microsoft Entra ID"
                }
              },

              # --- Observables ---
              observables: (
                [ ( if $r.userPrincipalName != null
                    then { name: "user.name", type: "User Name", type_id: 4, value: $r.userPrincipalName }
                    else empty end ),
                  ( if $r.ipAddress != null
                    then { name: "src_endpoint.ip", type: "IP Address", type_id: 2, value: $r.ipAddress }
                    else empty end ) ]
              ),

              # --- Recommended ---
              message: (
                "Sign-in for " + ($r.userPrincipalName // "unknown")
                + " to " + ($r.resourceDisplayName // "resource")
                + ( if $ok then " succeeded" else " failed" end )
              ),
              risk_level: ($r.riskLevelDuringSignIn),

              # --- Pass-through / audit ---
              unmapped: {
                appId: ($r.appId),
                appDisplayName: ($r.appDisplayName),
                conditionalAccessStatus: ($r.conditionalAccessStatus),
                resourceTenantId: ($r.resourceTenantId),
                homeTenantId: ($r.homeTenantId),
                isInteractive: ($r.isInteractive)
              },
              raw_data: (. | tostring)
            }
          # Single shallow prune of top-level nulls; keeps required objects.
          | walk(
              if type == "object" then
                with_entries(select(.value != null and .value != {} and .value != []))
              elif type == "array" then map(select(. != null))
              else . end
            )
