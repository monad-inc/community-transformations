name: "Microsoft Azure Virtual Machine to OCSF v1.9.0"
description: "Transforms Microsoft Azure Compute Virtual Machine (Get/List) inventory records into the OCSF v1.9.0 Device Inventory Info (5001) class."
author: "Monad"
contributors:
  - "https://github.com/behobu"
inputs:
  - "microsoft-azure-virtual-machine"
tags:
  - "v1.9.0"
  - "ocsf"
  - "microsoft"
  - "azure"
  - "device"
  - "inventory"
config:
  operations:
    - operation: "jq"
      arguments:
        key: ""
        query: |
          # ---------------------------------------------------------------
          # OCSF Device Inventory Info (class_uid=5001) — v1.9.0
          # Category: Discovery (5). Activity: Collect (2).
          # Input: one Azure Compute Virtual Machine record per invocation
          #        (Microsoft.Compute/virtualMachines Get or List item).
          # A VM record is a proactively-collected device inventory snapshot.
          # ---------------------------------------------------------------

          def to_epoch_ms($ts):
            def _n: if . == null then null else tonumber end;
            def _num_ms($n):
              if   $n >= 1e17 then ($n / 1000000 | floor)
              elif $n >= 1e14 then ($n / 1000 | floor)
              elif $n >= 1e11 then ($n | floor)
              else ($n * 1000 + 0.001 | floor) end;
            def _digits_ms($d):
              ($d | ltrimstr("-") | length) as $l
              | if   $l >= 18 then ($d[0:-6] | tonumber)
                elif $l >= 15 then ($d[0:-3] | tonumber)
                elif $l >= 12 then ($d | tonumber)
                else ($d | tonumber) * 1000 end;
            def _frac_ms($f): if $f == null then 0 else (($f + "000")[0:3] | tonumber) end;
            def _mon($m):
              if $m == null then null
              else {"JAN":1,"FEB":2,"MAR":3,"APR":4,"MAY":5,"JUN":6,
                    "JUL":7,"AUG":8,"SEP":9,"OCT":10,"NOV":11,"DEC":12}[$m[0:3]] end;
            def _zone($z):
              if $z == null or $z == "" then 0
              else
                ($z | if test("^(UTC|GMT|UT)[+-]") then sub("^(UTC|GMT|UT)"; "") else . end) as $z
                | if ($z | test("^[+-][0-9]{1,2}(:?[0-9]{2})?$")) then
                    ($z | capture("^(?<sg>[+-])(?<h>[0-9]{1,2}):?(?<m>[0-9]{2})?$")) as $o
                    | (if $o.sg == "-" then -1 else 1 end)
                      * (($o.h | tonumber) * 3600 + (($o.m // "0") | tonumber) * 60)
                  else
                    {"Z":0,"UTC":0,"GMT":0,"UT":0,"EST":-18000,"EDT":-14400,"CST":-21600,
                     "CDT":-18000,"MST":-25200,"MDT":-21600,"PST":-28800,"PDT":-25200}[$z]
                  end
              end;
            def _ms($c):
              ($c.y | tonumber | if . < 100 then (if . < 70 then . + 2000 else . + 1900 end) else . end) as $y
              | ($c.mo | _n) as $mo
              | ($c.d | tonumber) as $d
              | (($c.h // "0") | tonumber) as $h
              | (($c.mi // "0") | tonumber) as $mi
              | (($c.s // "0") | tonumber) as $s
              | _zone($c.z) as $off
              | if $mo == null or $off == null or $mo < 1 or $mo > 12 or $d < 1 or $d > 31
                   or $h > 23 or $mi > 59 or $s > 60 then null
                else
                  ($y - (if $mo <= 2 then 1 else 0 end)) as $yy
                  | ($yy / 400 | floor) as $era
                  | ($yy - $era * 400) as $yoe
                  | (((153 * ($mo + (if $mo > 2 then -3 else 9 end)) + 2) / 5 | floor) + $d - 1) as $doy
                  | ($yoe * 365 + ($yoe / 4 | floor) - ($yoe / 100 | floor) + $doy) as $doe
                  | ($era * 146097 + $doe - 719468) as $days
                  | ($days * 86400 + $h * 3600 + $mi * 60 + $s - $off) * 1000 + _frac_ms($c.f)
                end;
            def _str($raw):
              ($raw | ascii_upcase | sub("\\s*\\([^)]*\\)\\s*$"; "") | sub("^\\s+"; "") | sub("\\s+$"; "")) as $s
              | "(?<z>Z|(?:UTC|GMT|UT)?[+-][0-9]{1,2}(?::?[0-9]{2})?|[A-Z]{1,5})" as $Z
              | "(?<h>[0-9]{1,2}):(?<mi>[0-9]{2})(?::(?<s>[0-9]{2}))?(?:[.,](?<f>[0-9]+))?" as $T
              | if $s == "" then null
                elif ($s | test("^-?[0-9]+$")) then _digits_ms($s)
                elif ($s | test("^[0-9]+\\.[0-9]+$")) then
                  ($s | split(".")) as $p
                  | if ($p[0] | length) <= 11 then _digits_ms($p[0]) + _frac_ms($p[1])
                    else _digits_ms($p[0]) end
                elif ($s | test("^/DATE\\(-?[0-9]+([+-][0-9]{4})?\\)/$")) then
                  ($s | capture("(?<ms>-?[0-9]+)").ms | tonumber)
                else
                  first(
                    ($s | capture("^(?<y>[0-9]{4})[-/](?<mo>[0-9]{1,2})[-/](?<d>[0-9]{1,2})(?:[T ]+" + $T + ")?\\s*" + $Z + "?(?:\\s+[A-Z]{2,5})?$") | _ms(.)),
                    ($s | capture("^(?<y>[0-9]{4})(?<mo>[0-9]{2})(?<d>[0-9]{2})T(?<h>[0-9]{2})(?<mi>[0-9]{2})(?<s>[0-9]{2})(?:[.,](?<f>[0-9]+))?" + $Z + "?$") | _ms(.)),
                    ($s | capture("^(?:[A-Z]+,?\\s+)?(?<d>[0-9]{1,2})[ -](?<mon>[A-Z]{3,9})[ -](?<y>[0-9]{2,4})\\s+" + $T + "\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?:[A-Z]+,?\\s+)?(?<mon>[A-Z]{3,9})\\.?\\s+(?<d>[0-9]{1,2}),?\\s+(?<y>[0-9]{4})(?:,?\\s+" + $T + ")?\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?:[A-Z]+\\s+)?(?<mon>[A-Z]{3,9})\\s+(?<d>[0-9]{1,2})\\s+" + $T + "\\s+(?:" + $Z + "\\s+)?(?<y>[0-9]{4})$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?<d>[0-9]{1,2})/(?<mon>[A-Z]{3})/(?<y>[0-9]{4}):" + $T + "\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.))
                  ) // null
                end;
            if $ts == null then null
            elif ($ts | type) == "number" then _num_ms($ts)
            elif ($ts | type) == "string" then _str($ts)
            elif ($ts | type) == "object" then
              if   $ts["$date"] != null then to_epoch_ms($ts["$date"])
              elif $ts["$numberLong"] != null then to_epoch_ms($ts["$numberLong"])
              elif $ts.seconds != null then
                ($ts.seconds | tostring | tonumber) * 1000
                + ((($ts.nanos // 0) | tostring | tonumber) / 1000000 | floor)
              else null end
            else null end;

          def prune:
            walk(if type == "object" then with_entries(select(.value != null and .value != {} and .value != []))
                 elif type == "array" then map(select(. != null and . != {} and . != []))
                 else . end);

          . as $r
          | ($r.properties // {}) as $p
          | (($r.id // "") | split("/")) as $idp
          | ($p.storageProfile // {}) as $sp
          | ($sp.imageReference // {}) as $img
          | ($sp.osDisk // {}) as $osd
          | ($p.osProfile // {}) as $osp
          | ($osd.osType // "") as $ostype
          | ( $osp.computerName // $r.name ) as $host
          | {
              # --- Classification (REQUIRED) ---
              "category_uid":  5,
              "category_name": "Discovery",
              "class_uid":     5001,
              "class_name":    "Device Inventory Info",
              "activity_id":   2,
              "activity_name": "Collect",
              "type_uid":      500102,
              "type_name":     "Device Inventory Info: Collect",
              "severity_id":   1,
              "severity":      "Informational",

              # --- Time (REQUIRED) — VM creation timestamp ---
              "time": ( to_epoch_ms($p.timeCreated) // now * 1000 | floor ),

              # --- Metadata (REQUIRED) ---
              "metadata": {
                "version": "1.9.0",
                "product": {
                  "vendor_name": "Microsoft",
                  "name": "Azure Virtual Machines",
                  "feature": { "name": "Compute" }
                },
                "profiles": [ "cloud", "host" ]
              },

              # --- Device (REQUIRED object; type_id required) ---
              "device": {
                "type_id": 6,
                "type":    "Virtual",
                "uid":     $p.vmId,
                "name":    $r.name,
                "hostname": $host,
                "region":  $r.location,
                "vendor_name": "Microsoft",
                "os": {
                  "type_id": ( if $ostype == "Windows" then 100
                               elif $ostype == "Linux" then 200
                               else 0 end ),
                  "type":    ( if $ostype == "" then null else $ostype end ),
                  "name": (
                    [ $img.publisher, $img.offer, $img.sku ]
                    | map(select(. != null and . != "")) | join(" ")
                    | if . == "" then null else . end
                  ),
                  "version": $img.exactVersion
                },
                "hw_info": {
                  "vendor_name": "Microsoft",
                  "cpu_count": ($p.hardwareProfile.vmSizeProperties.vCPUsAvailable),
                  "serial_number": $osd.name
                }
              },

              # --- Cloud (REQUIRED object; provider required) ---
              "cloud": {
                "provider": "Microsoft Azure",
                "region":   $r.location,
                "zone":     ( $r.zones[0]? ),
                "account": {
                  "uid":  ( $idp[2]? ),
                  "name": "Azure Subscription"
                }
              },

              # --- OSINT (REQUIRED array; each needs value + type_id) ---
              # The device's collected hostname is the observable indicator.
              "osint": [
                { "type_id": 3, "value": ($host // $r.name // "unknown") }
              ],

              # --- Passthrough / audit ---
              "unmapped": {
                "provisioning_state": $p.provisioningState,
                "vm_size":            $p.hardwareProfile.vmSize,
                "resource_group":     ( $idp[4]? ),
                "image_publisher":    $img.publisher,
                "image_offer":        $img.offer,
                "image_sku":          $img.sku,
                "admin_username":     $osp.adminUsername,
                "security_type":      $p.securityProfile.securityType,
                "tags":               $r.tags
              },
              "raw_data": ( . | tostring )
            }
          | prune
