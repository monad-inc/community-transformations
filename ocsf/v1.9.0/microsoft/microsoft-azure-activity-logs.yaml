name: "Microsoft Azure Activity Logs to OCSF v1.9.0"
description: "Transforms Microsoft Azure Activity Log records (control-plane management operations) into the OCSF v1.9.0 API Activity class (class_uid 6003)."
author: "Monad"
contributors:
  - "https://github.com/behobu"
inputs:
  - "microsoft-azure-activity-logs"
tags:
  - "v1.9.0"
  - "ocsf"
  - "microsoft"
  - "application"
config:
  operations:
    - operation: "jq"
      arguments:
        key: ""
        query: |
          # ---------------------------------------------------------------
          # OCSF API Activity (class_uid=6003, category_uid=6) — v1.9.0
          # Input: one Microsoft Azure Activity Log record per invocation
          #   (Azure Monitor resource-log schema exported via Diagnostic
          #   Settings / Event Hub / the microsoft-azure-activity-logs input).
          #
          # Azure control-plane operations name a verb via the trailing
          # segment of operationName (/write, /read, /delete, /action). That
          # verb selects the OCSF API Activity activity_id.
          # ---------------------------------------------------------------


          # Azure Monitor sometimes wraps operationName / resultType as
          # {value, localizedValue}; read whichever shape arrives.
          def to_epoch_ms($ts):
            def _n: if . == null then null else tonumber end;
            def _num_ms($n):
              if   $n >= 1e17 then ($n / 1000000 | floor)
              elif $n >= 1e14 then ($n / 1000 | floor)
              elif $n >= 1e11 then ($n | floor)
              else ($n * 1000 + 0.001 | floor) end;
            def _digits_ms($d):
              ($d | ltrimstr("-") | length) as $l
              | if   $l >= 18 then ($d[0:-6] | tonumber)
                elif $l >= 15 then ($d[0:-3] | tonumber)
                elif $l >= 12 then ($d | tonumber)
                else ($d | tonumber) * 1000 end;
            def _frac_ms($f): if $f == null then 0 else (($f + "000")[0:3] | tonumber) end;
            def _mon($m):
              if $m == null then null
              else {"JAN":1,"FEB":2,"MAR":3,"APR":4,"MAY":5,"JUN":6,
                    "JUL":7,"AUG":8,"SEP":9,"OCT":10,"NOV":11,"DEC":12}[$m[0:3]] end;
            def _zone($z):
              if $z == null or $z == "" then 0
              else
                ($z | if test("^(UTC|GMT|UT)[+-]") then sub("^(UTC|GMT|UT)"; "") else . end) as $z
                | if ($z | test("^[+-][0-9]{1,2}(:?[0-9]{2})?$")) then
                    ($z | capture("^(?<sg>[+-])(?<h>[0-9]{1,2}):?(?<m>[0-9]{2})?$")) as $o
                    | (if $o.sg == "-" then -1 else 1 end)
                      * (($o.h | tonumber) * 3600 + (($o.m // "0") | tonumber) * 60)
                  else
                    {"Z":0,"UTC":0,"GMT":0,"UT":0,"EST":-18000,"EDT":-14400,"CST":-21600,
                     "CDT":-18000,"MST":-25200,"MDT":-21600,"PST":-28800,"PDT":-25200}[$z]
                  end
              end;
            def _ms($c):
              ($c.y | tonumber | if . < 100 then (if . < 70 then . + 2000 else . + 1900 end) else . end) as $y
              | ($c.mo | _n) as $mo
              | ($c.d | tonumber) as $d
              | (($c.h // "0") | tonumber) as $h
              | (($c.mi // "0") | tonumber) as $mi
              | (($c.s // "0") | tonumber) as $s
              | _zone($c.z) as $off
              | if $mo == null or $off == null or $mo < 1 or $mo > 12 or $d < 1 or $d > 31
                   or $h > 23 or $mi > 59 or $s > 60 then null
                else
                  ($y - (if $mo <= 2 then 1 else 0 end)) as $yy
                  | ($yy / 400 | floor) as $era
                  | ($yy - $era * 400) as $yoe
                  | (((153 * ($mo + (if $mo > 2 then -3 else 9 end)) + 2) / 5 | floor) + $d - 1) as $doy
                  | ($yoe * 365 + ($yoe / 4 | floor) - ($yoe / 100 | floor) + $doy) as $doe
                  | ($era * 146097 + $doe - 719468) as $days
                  | ($days * 86400 + $h * 3600 + $mi * 60 + $s - $off) * 1000 + _frac_ms($c.f)
                end;
            def _str($raw):
              ($raw | ascii_upcase | sub("\\s*\\([^)]*\\)\\s*$"; "") | sub("^\\s+"; "") | sub("\\s+$"; "")) as $s
              | "(?<z>Z|(?:UTC|GMT|UT)?[+-][0-9]{1,2}(?::?[0-9]{2})?|[A-Z]{1,5})" as $Z
              | "(?<h>[0-9]{1,2}):(?<mi>[0-9]{2})(?::(?<s>[0-9]{2}))?(?:[.,](?<f>[0-9]+))?" as $T
              | if $s == "" then null
                elif ($s | test("^-?[0-9]+$")) then _digits_ms($s)
                elif ($s | test("^[0-9]+\\.[0-9]+$")) then
                  ($s | split(".")) as $p
                  | if ($p[0] | length) <= 11 then _digits_ms($p[0]) + _frac_ms($p[1])
                    else _digits_ms($p[0]) end
                elif ($s | test("^/DATE\\(-?[0-9]+([+-][0-9]{4})?\\)/$")) then
                  ($s | capture("(?<ms>-?[0-9]+)").ms | tonumber)
                else
                  first(
                    ($s | capture("^(?<y>[0-9]{4})[-/](?<mo>[0-9]{1,2})[-/](?<d>[0-9]{1,2})(?:[T ]+" + $T + ")?\\s*" + $Z + "?(?:\\s+[A-Z]{2,5})?$") | _ms(.)),
                    ($s | capture("^(?<y>[0-9]{4})(?<mo>[0-9]{2})(?<d>[0-9]{2})T(?<h>[0-9]{2})(?<mi>[0-9]{2})(?<s>[0-9]{2})(?:[.,](?<f>[0-9]+))?" + $Z + "?$") | _ms(.)),
                    ($s | capture("^(?:[A-Z]+,?\\s+)?(?<d>[0-9]{1,2})[ -](?<mon>[A-Z]{3,9})[ -](?<y>[0-9]{2,4})\\s+" + $T + "\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?:[A-Z]+,?\\s+)?(?<mon>[A-Z]{3,9})\\.?\\s+(?<d>[0-9]{1,2}),?\\s+(?<y>[0-9]{4})(?:,?\\s+" + $T + ")?\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?:[A-Z]+\\s+)?(?<mon>[A-Z]{3,9})\\s+(?<d>[0-9]{1,2})\\s+" + $T + "\\s+(?:" + $Z + "\\s+)?(?<y>[0-9]{4})$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?<d>[0-9]{1,2})/(?<mon>[A-Z]{3})/(?<y>[0-9]{4}):" + $T + "\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.))
                  ) // null
                end;
            if $ts == null then null
            elif ($ts | type) == "number" then _num_ms($ts)
            elif ($ts | type) == "string" then _str($ts)
            elif ($ts | type) == "object" then
              if   $ts["$date"] != null then to_epoch_ms($ts["$date"])
              elif $ts["$numberLong"] != null then to_epoch_ms($ts["$numberLong"])
              elif $ts.seconds != null then
                ($ts.seconds | tostring | tonumber) * 1000
                + ((($ts.nanos // 0) | tostring | tonumber) / 1000000 | floor)
              else null end
            else null end;

          def strv($f):
            if ($f | type) == "object" then ($f.value // $f.localizedValue)
            else $f end;

          . as $r
          | ( $r.identity.claims // {} ) as $claims
          | ( strv($r.operationName) // "" ) as $op
          | ( $op | ascii_downcase ) as $opl
          | ( strv($r.resultType) // $r.status // "" ) as $result
          | ( $r.caller
              // $claims["http://schemas.xmlsoap.org/ws/2005/05/identity/claims/upn"]
              // $claims["http://schemas.xmlsoap.org/ws/2005/05/identity/claims/name"] ) as $caller
          | ( $claims["http://schemas.microsoft.com/identity/claims/objectidentifier"] ) as $caller_uid
          | ( $r.callerIpAddress // $claims.ipaddr ) as $caller_ip

          # ---- activity_id (API Activity: 1 Create, 2 Read, 3 Update,
          #      4 Delete, 99 Other, 0 Unknown) --------------------------
          | ( if ($opl | endswith("/write")) then 3
              elif ($opl | endswith("/read")) then 2
              elif ($opl | endswith("/delete")) then 4
              elif ($opl | endswith("/action")) then 99
              elif $op == "" then 0
              else 99 end ) as $activity_id

          # ---- severity_id from Azure level ------------------------------
          | ( { "Informational": 1, "Warning": 3, "Error": 4, "Critical": 5 }[$r.level] // 0 ) as $sev

          # ---- status_id (1 Success, 2 Failure) --------------------------
          | ( if ($result | ascii_downcase | startswith("succ")) then 1
              elif ($result | ascii_downcase | startswith("fail")) then 2
              else 0 end ) as $status_id

          | {
              category_uid: 6,
              class_uid: 6003,
              type_uid: (6003 * 100 + $activity_id),
              activity_id: $activity_id,
              severity_id: $sev,

              time: to_epoch_ms($r.time // $r.eventTimestamp),

              metadata: {
                "profiles": ["cloud", "osint"],
                version: "1.9.0",
                product: {
                  vendor_name: "Microsoft",
                  name: "Azure Activity Log"
                },
                correlation_uid: $r.correlationId,
                uid: $r.eventDataId,
                log_provider: "Azure Monitor"
              },

              # API Activity requires an actor, api, cloud, src_endpoint.
              actor: {
                user: {
                  name: $caller,
                  uid: $caller_uid,
                  type_id: 1
                },
                app_name: $claims.appid
              },

              api: {
                operation: (if $op == "" then "Unknown" else $op end),
                service: { name: ($op | split("/")[0]) }
              },

              cloud: {
                provider: "Azure",
                region: $r.location,
                account: { uid: ($r.subscriptionId // $claims["http://schemas.microsoft.com/identity/claims/tenantid"]) }
              },

              src_endpoint: {
                ip: $caller_ip
              },

              # OCSF 1.9.0 marks osint required on API Activity; no OSINT
              # indicators are present on an Azure control-plane record.
              osint: [],

              status_id: $status_id,
              status: $result,
              status_detail: (strv($r.resultSignature)),
              message: ($r.properties.message // $op),

              resources: [
                { uid: $r.resourceId, type: "azure-resource" }
              ],

              unmapped: {
                category: $r.category,
                correlationId: $r.correlationId,
                tenantId: $r.tenantId,
                level: $r.level
              },

              raw_data: ($r | tostring)
            }
          # Drop only null values; keep osint:[] and any required empty object.
          | walk(if type == "object" then with_entries(select(.value != null)) else . end)
