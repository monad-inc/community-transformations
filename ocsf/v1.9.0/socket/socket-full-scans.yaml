name: "Socket Full Scan Findings to OCSF v1.9.0"
description: "Transforms Socket.dev full-scan SBOM artifact records into the OCSF v1.9.0 Vulnerability Finding (class_uid 2002) class, one finding per scanned package with each supply-chain/CVE alert mapped to a vulnerability entry."
# author is ALWAYS "Monad" — never a person. You are a contributor.
author: "Monad"
contributors:
  - "https://github.com/behobu"
inputs:
  - "socket-full-scans"
tags:
  - "v1.9.0"
  - "ocsf"
  - "socket"
  - "vulnerability"
  - "findings"
config:
  operations:
    - operation: "jq"
      arguments:
        key: ""
        query: |
          # ---------------------------------------------------------------
          # OCSF Vulnerability Finding (class_uid=2002) — v1.9.0
          # Input: one Socket.dev full-scan SBOM artifact per invocation.
          #   Each artifact is one scanned package carrying an alerts[] array
          #   of supply-chain / CVE / quality findings. We emit ONE OCSF
          #   Vulnerability Finding per artifact, with one vulnerabilities[]
          #   entry per alert.
          # ---------------------------------------------------------------
          # OCSF severity_id from a source severity: a label (case-insensitive) or a
          # 0-10 score using the CVSS qualitative ranges (0 None -> 1, <4 Low, <7 Medium,
          # <9 High, else Critical). 0 for null/empty/"unknown"; 99 for an unrecognized
          # label (then keep the source label in `severity`). Map vendor-specific
          # numeric scales (e.g. 1-5) explicitly instead.
          def sev_to_id($s):
            def _score($n):
              if $n < 0 or $n > 10 then 99
              elif $n == 0 then 1 elif $n < 4 then 2 elif $n < 7 then 3 elif $n < 9 then 4
              else 5 end;
            if $s == null then 0
            elif ($s | type) == "number" then _score($s)
            elif ($s | type) != "string" then 99
            else
              ($s | ascii_downcase | sub("^\\s+"; "") | sub("\\s+$"; "")) as $l
              | if $l == "" or $l == "unknown" or $l == "unspecified" or $l == "untriaged" then 0
                elif ($l | test("^[0-9]+(\\.[0-9]+)?$")) then _score($l | tonumber)
                else
                  {"info":1,"informational":1,"information":1,"none":1,"notice":1,"debug":1,"trace":1,
                   "low":2,"minor":2,
                   "medium":3,"moderate":3,"middle":3,"warning":3,"warn":3,
                   "high":4,"major":4,"important":4,"error":4,
                   "critical":5,"crit":5,"severe":5,"alert":5,
                   "fatal":6,"emergency":6,"emerg":6}[$l] // 99
                end
            end;



          # Socket severity label -> OCSF severity_id. Socket uses the label
          # "middle" for the medium bucket.
          def to_epoch_ms($ts):
            def _n: if . == null then null else tonumber end;
            def _num_ms($n):
              if   $n >= 1e17 then ($n / 1000000 | floor)
              elif $n >= 1e14 then ($n / 1000 | floor)
              elif $n >= 1e11 then ($n | floor)
              else ($n * 1000 + 0.001 | floor) end;
            def _digits_ms($d):
              ($d | ltrimstr("-") | length) as $l
              | if   $l >= 18 then ($d[0:-6] | tonumber)
                elif $l >= 15 then ($d[0:-3] | tonumber)
                elif $l >= 12 then ($d | tonumber)
                else ($d | tonumber) * 1000 end;
            def _frac_ms($f): if $f == null then 0 else (($f + "000")[0:3] | tonumber) end;
            def _mon($m):
              if $m == null then null
              else {"JAN":1,"FEB":2,"MAR":3,"APR":4,"MAY":5,"JUN":6,
                    "JUL":7,"AUG":8,"SEP":9,"OCT":10,"NOV":11,"DEC":12}[$m[0:3]] end;
            def _zone($z):
              if $z == null or $z == "" then 0
              else
                ($z | if test("^(UTC|GMT|UT)[+-]") then sub("^(UTC|GMT|UT)"; "") else . end) as $z
                | if ($z | test("^[+-][0-9]{1,2}(:?[0-9]{2})?$")) then
                    ($z | capture("^(?<sg>[+-])(?<h>[0-9]{1,2}):?(?<m>[0-9]{2})?$")) as $o
                    | (if $o.sg == "-" then -1 else 1 end)
                      * (($o.h | tonumber) * 3600 + (($o.m // "0") | tonumber) * 60)
                  else
                    {"Z":0,"UTC":0,"GMT":0,"UT":0,"EST":-18000,"EDT":-14400,"CST":-21600,
                     "CDT":-18000,"MST":-25200,"MDT":-21600,"PST":-28800,"PDT":-25200}[$z]
                  end
              end;
            def _ms($c):
              ($c.y | tonumber | if . < 100 then (if . < 70 then . + 2000 else . + 1900 end) else . end) as $y
              | ($c.mo | _n) as $mo
              | ($c.d | tonumber) as $d
              | (($c.h // "0") | tonumber) as $h
              | (($c.mi // "0") | tonumber) as $mi
              | (($c.s // "0") | tonumber) as $s
              | _zone($c.z) as $off
              | if $mo == null or $off == null or $mo < 1 or $mo > 12 or $d < 1 or $d > 31
                   or $h > 23 or $mi > 59 or $s > 60 then null
                else
                  ($y - (if $mo <= 2 then 1 else 0 end)) as $yy
                  | ($yy / 400 | floor) as $era
                  | ($yy - $era * 400) as $yoe
                  | (((153 * ($mo + (if $mo > 2 then -3 else 9 end)) + 2) / 5 | floor) + $d - 1) as $doy
                  | ($yoe * 365 + ($yoe / 4 | floor) - ($yoe / 100 | floor) + $doy) as $doe
                  | ($era * 146097 + $doe - 719468) as $days
                  | ($days * 86400 + $h * 3600 + $mi * 60 + $s - $off) * 1000 + _frac_ms($c.f)
                end;
            def _str($raw):
              ($raw | ascii_upcase | sub("\\s*\\([^)]*\\)\\s*$"; "") | sub("^\\s+"; "") | sub("\\s+$"; "")) as $s
              | "(?<z>Z|(?:UTC|GMT|UT)?[+-][0-9]{1,2}(?::?[0-9]{2})?|[A-Z]{1,5})" as $Z
              | "(?<h>[0-9]{1,2}):(?<mi>[0-9]{2})(?::(?<s>[0-9]{2}))?(?:[.,](?<f>[0-9]+))?" as $T
              | if $s == "" then null
                elif ($s | test("^-?[0-9]+$")) then _digits_ms($s)
                elif ($s | test("^[0-9]+\\.[0-9]+$")) then
                  ($s | split(".")) as $p
                  | if ($p[0] | length) <= 11 then _digits_ms($p[0]) + _frac_ms($p[1])
                    else _digits_ms($p[0]) end
                elif ($s | test("^/DATE\\(-?[0-9]+([+-][0-9]{4})?\\)/$")) then
                  ($s | capture("(?<ms>-?[0-9]+)").ms | tonumber)
                else
                  first(
                    ($s | capture("^(?<y>[0-9]{4})[-/](?<mo>[0-9]{1,2})[-/](?<d>[0-9]{1,2})(?:[T ]+" + $T + ")?\\s*" + $Z + "?(?:\\s+[A-Z]{2,5})?$") | _ms(.)),
                    ($s | capture("^(?<y>[0-9]{4})(?<mo>[0-9]{2})(?<d>[0-9]{2})T(?<h>[0-9]{2})(?<mi>[0-9]{2})(?<s>[0-9]{2})(?:[.,](?<f>[0-9]+))?" + $Z + "?$") | _ms(.)),
                    ($s | capture("^(?:[A-Z]+,?\\s+)?(?<d>[0-9]{1,2})[ -](?<mon>[A-Z]{3,9})[ -](?<y>[0-9]{2,4})\\s+" + $T + "\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?:[A-Z]+,?\\s+)?(?<mon>[A-Z]{3,9})\\.?\\s+(?<d>[0-9]{1,2}),?\\s+(?<y>[0-9]{4})(?:,?\\s+" + $T + ")?\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?:[A-Z]+\\s+)?(?<mon>[A-Z]{3,9})\\s+(?<d>[0-9]{1,2})\\s+" + $T + "\\s+(?:" + $Z + "\\s+)?(?<y>[0-9]{4})$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?<d>[0-9]{1,2})/(?<mon>[A-Z]{3})/(?<y>[0-9]{4}):" + $T + "\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.))
                  ) // null
                end;
            if $ts == null then null
            elif ($ts | type) == "number" then _num_ms($ts)
            elif ($ts | type) == "string" then _str($ts)
            elif ($ts | type) == "object" then
              if   $ts["$date"] != null then to_epoch_ms($ts["$date"])
              elif $ts["$numberLong"] != null then to_epoch_ms($ts["$numberLong"])
              elif $ts.seconds != null then
                ($ts.seconds | tostring | tonumber) * 1000
                + ((($ts.nanos // 0) | tostring | tonumber) / 1000000 | floor)
              else null end
            else null end;

          def sev_caption($id):
            {"0":"Unknown","1":"Informational","2":"Low","3":"Medium","4":"High",
             "5":"Critical","6":"Fatal","99":"Other"}[$id | tostring];

          . as $r |
          (.alerts // []) as $alerts |

          # Reconstruct the package URL when the artifact doesn't carry one.
          ( ($r.inputPurl)
            // ( "pkg:" + ($r.type // "generic")
                 + (if ($r.namespace // "") != "" then "/" + $r.namespace else "" end)
                 + "/" + ($r.name // "unknown")
                 + (if ($r.version // "") != "" then "@" + $r.version else "" end) )
          ) as $purl |

          # The affected package object, shared by every vulnerability entry.
          # The OCSF affected_package object requires both name and version, so
          # default them when the SBOM artifact omits a version.
          ( {
              "name": ($r.name // "unknown"),
              "version": ($r.version // "0.0.0"),
              "purl": $purl,
              "type": $r.type,
              "license": $r.license
            } ) as $affected_pkg |

          # Overall finding severity = the worst alert severity on the package.
          ( [ $alerts[] | sev_to_id(.severity) ] | (max // 0) ) as $sev_id |

          {
            # --- Classification (REQUIRED) ---
            "category_uid": 2,
            "class_uid": 2002,
            "type_uid": 200201,
            "activity_id": 1,

            # --- Severity (REQUIRED); sibling string = OCSF caption ---
            "severity_id": $sev_id,
            "severity": sev_caption($sev_id),

            # --- Time (REQUIRED): package publication time from the SBOM;
            # fall back to ingest time when the artifact omits publishedAt ---
            "time": (to_epoch_ms($r.publishedAt) // (now * 1000 | floor)),

            # --- Metadata (REQUIRED); declare the base-required profiles ---
            "metadata": {
              "version": "1.9.0",
              "product": {
                "vendor_name": "Socket",
                "name": "Socket Full Scans"
              },
              "uid": ($r.id | tostring),
              "profiles": ["cloud", "osint"]
            },

            # --- Cloud (base-required in 1.9.0) ---
            "cloud": {
              "provider": "Socket"
            },

            # --- Finding Info (REQUIRED) ---
            "finding_info": {
              "uid": ($r.id | tostring),
              "title": (($r.name // "package") + "@" + ($r.version // "?") + " — Socket supply-chain finding"),
              "desc": ("Socket full-scan alerts for " + $purl),
              "types": ["Vulnerability"],
              "src_url": ("https://socket.dev/npm/package/" + ($r.name // ""))
            },

            # --- Vulnerabilities (REQUIRED) ---
            # One entry per Socket alert. The OCSF vulnerability object carries
            # a `just_one: [advisory, cve, cwe]` constraint, so CVE alerts emit
            # `cve` and every other Socket alert type emits an `advisory`.
            "vulnerabilities": (
              if ($alerts | length) > 0 then
                [ $alerts[] as $al |
                  sev_to_id($al.severity) as $aid |
                  {
                    "title": $al.type,
                    "desc": ($al.props.description // $al.props.note // $al.type),
                    "severity": sev_caption($aid),
                    "affected_packages": [ $affected_pkg ],
                    "vendor_name": "Socket"
                  }
                  + ( if ($al.props.cveId != null) then
                        { "cve": (
                            { "uid": $al.props.cveId }
                            + (if ($al.props.cvssScore != null) then
                                 { "cvss": [ { "version": "3.0", "base_score": $al.props.cvssScore }
                                             + (if $al.props.cvssVector != null then { "vector_string": $al.props.cvssVector } else {} end) ] }
                               else {} end)
                            + (if ($al.props.url != null) then { "references": [ $al.props.url ] } else {} end)
                          ) }
                      else
                        { "advisory": {
                            "uid": $al.type,
                            "desc": ($al.props.description // $al.props.note // $al.type)
                          } }
                      end )
                ]
              else
                [ { "title": "supply-chain-scan",
                    "advisory": { "uid": "no-alerts", "desc": "Socket scanned the package with no active alerts." },
                    "affected_packages": [ $affected_pkg ] } ]
              end
            ),

            # --- OSINT (base-required in 1.9.0). Each alert becomes an
            # indicator: CVE alerts as a Vulnerability indicator (type_id 10),
            # every other alert as the package purl (type_id 99). ---
            "osint": (
              ( [ $alerts[] as $al |
                  if ($al.props.cveId != null) then
                    { "type_id": 10, "value": $al.props.cveId, "name": $al.type }
                  else
                    { "type_id": 99, "value": $purl, "name": $al.type }
                  end ]
              ) as $o |
              if ($o | length) > 0 then ($o | unique) else [ { "type_id": 99, "value": $purl } ] end
            ),

            # --- Recommended: resources describing the scanned package ---
            "resources": [ {
              "type": "package",
              "name": ($r.name),
              "uid": $purl
            } ],

            # --- Recommended: observables (natural pivots) ---
            "observables": (
              [ { "name": "resource.uid", "type": "Resource UID", "type_id": 10, "value": $purl } ]
              + [ $alerts[] | select(.props.cveId != null)
                  | { "name": "vulnerabilities.cve.uid", "type": "CVE Object: uid", "type_id": 18, "value": .props.cveId } ]
            ),

            # --- Original record for audit / debugging ---
            "raw_data": ($r | tostring)
          }
          # Drop keys that resolved to null (OCSF rejects null-typed values),
          # but keep the required objects populated above.
          | del(.. | nulls)
