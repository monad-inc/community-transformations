name: "GitHub Dependabot Alerts to OCSF v1.9.0"
description: "Transforms GitHub Dependabot vulnerability alert records into the OCSF v1.9.0 Vulnerability Finding (class_uid 2002) class, populating finding_info, the vulnerabilities array (CVE/CWE/CVSS, affected package, fix availability), osint, cloud, and severity."
author: "Monad"
contributors:
  - "https://github.com/behobu"
inputs:
  - "github-dependabot-alerts"
tags:
  - "v1.9.0"
  - "ocsf"
  - "github"
  - "findings"
  - "vulnerability"
config:
  operations:
    - operation: "jq"
      arguments:
        key: ""
        query: |
          # ---------------------------------------------------------------
          # OCSF Vulnerability Finding (class_uid=2002) — v1.9.0
          # Input: one GitHub Dependabot alert record per invocation
          #   (org/enterprise list shape; `repository` present).
          # ---------------------------------------------------------------

          def to_epoch_ms($ts):
            def _n: if . == null then null else tonumber end;
            def _num_ms($n):
              if   $n >= 1e17 then ($n / 1000000 | floor)
              elif $n >= 1e14 then ($n / 1000 | floor)
              elif $n >= 1e11 then ($n | floor)
              else ($n * 1000 + 0.001 | floor) end;
            def _digits_ms($d):
              ($d | ltrimstr("-") | length) as $l
              | if   $l >= 18 then ($d[0:-6] | tonumber)
                elif $l >= 15 then ($d[0:-3] | tonumber)
                elif $l >= 12 then ($d | tonumber)
                else ($d | tonumber) * 1000 end;
            def _frac_ms($f): if $f == null then 0 else (($f + "000")[0:3] | tonumber) end;
            def _mon($m):
              if $m == null then null
              else {"JAN":1,"FEB":2,"MAR":3,"APR":4,"MAY":5,"JUN":6,
                    "JUL":7,"AUG":8,"SEP":9,"OCT":10,"NOV":11,"DEC":12}[$m[0:3]] end;
            def _zone($z):
              if $z == null or $z == "" then 0
              else
                ($z | if test("^(UTC|GMT|UT)[+-]") then sub("^(UTC|GMT|UT)"; "") else . end) as $z
                | if ($z | test("^[+-][0-9]{1,2}(:?[0-9]{2})?$")) then
                    ($z | capture("^(?<sg>[+-])(?<h>[0-9]{1,2}):?(?<m>[0-9]{2})?$")) as $o
                    | (if $o.sg == "-" then -1 else 1 end)
                      * (($o.h | tonumber) * 3600 + (($o.m // "0") | tonumber) * 60)
                  else
                    {"Z":0,"UTC":0,"GMT":0,"UT":0,"EST":-18000,"EDT":-14400,"CST":-21600,
                     "CDT":-18000,"MST":-25200,"MDT":-21600,"PST":-28800,"PDT":-25200}[$z]
                  end
              end;
            def _ms($c):
              ($c.y | tonumber | if . < 100 then (if . < 70 then . + 2000 else . + 1900 end) else . end) as $y
              | ($c.mo | _n) as $mo
              | ($c.d | tonumber) as $d
              | (($c.h // "0") | tonumber) as $h
              | (($c.mi // "0") | tonumber) as $mi
              | (($c.s // "0") | tonumber) as $s
              | _zone($c.z) as $off
              | if $mo == null or $off == null or $mo < 1 or $mo > 12 or $d < 1 or $d > 31
                   or $h > 23 or $mi > 59 or $s > 60 then null
                else
                  ($y - (if $mo <= 2 then 1 else 0 end)) as $yy
                  | ($yy / 400 | floor) as $era
                  | ($yy - $era * 400) as $yoe
                  | (((153 * ($mo + (if $mo > 2 then -3 else 9 end)) + 2) / 5 | floor) + $d - 1) as $doy
                  | ($yoe * 365 + ($yoe / 4 | floor) - ($yoe / 100 | floor) + $doy) as $doe
                  | ($era * 146097 + $doe - 719468) as $days
                  | ($days * 86400 + $h * 3600 + $mi * 60 + $s - $off) * 1000 + _frac_ms($c.f)
                end;
            def _str($raw):
              ($raw | ascii_upcase | sub("\\s*\\([^)]*\\)\\s*$"; "") | sub("^\\s+"; "") | sub("\\s+$"; "")) as $s
              | "(?<z>Z|(?:UTC|GMT|UT)?[+-][0-9]{1,2}(?::?[0-9]{2})?|[A-Z]{1,5})" as $Z
              | "(?<h>[0-9]{1,2}):(?<mi>[0-9]{2})(?::(?<s>[0-9]{2}))?(?:[.,](?<f>[0-9]+))?" as $T
              | if $s == "" then null
                elif ($s | test("^-?[0-9]+$")) then _digits_ms($s)
                elif ($s | test("^[0-9]+\\.[0-9]+$")) then
                  ($s | split(".")) as $p
                  | if ($p[0] | length) <= 11 then _digits_ms($p[0]) + _frac_ms($p[1])
                    else _digits_ms($p[0]) end
                elif ($s | test("^/DATE\\(-?[0-9]+([+-][0-9]{4})?\\)/$")) then
                  ($s | capture("(?<ms>-?[0-9]+)").ms | tonumber)
                else
                  first(
                    ($s | capture("^(?<y>[0-9]{4})[-/](?<mo>[0-9]{1,2})[-/](?<d>[0-9]{1,2})(?:[T ]+" + $T + ")?\\s*" + $Z + "?(?:\\s+[A-Z]{2,5})?$") | _ms(.)),
                    ($s | capture("^(?<y>[0-9]{4})(?<mo>[0-9]{2})(?<d>[0-9]{2})T(?<h>[0-9]{2})(?<mi>[0-9]{2})(?<s>[0-9]{2})(?:[.,](?<f>[0-9]+))?" + $Z + "?$") | _ms(.)),
                    ($s | capture("^(?:[A-Z]+,?\\s+)?(?<d>[0-9]{1,2})[ -](?<mon>[A-Z]{3,9})[ -](?<y>[0-9]{2,4})\\s+" + $T + "\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?:[A-Z]+,?\\s+)?(?<mon>[A-Z]{3,9})\\.?\\s+(?<d>[0-9]{1,2}),?\\s+(?<y>[0-9]{4})(?:,?\\s+" + $T + ")?\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?:[A-Z]+\\s+)?(?<mon>[A-Z]{3,9})\\s+(?<d>[0-9]{1,2})\\s+" + $T + "\\s+(?:" + $Z + "\\s+)?(?<y>[0-9]{4})$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?<d>[0-9]{1,2})/(?<mon>[A-Z]{3})/(?<y>[0-9]{4}):" + $T + "\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.))
                  ) // null
                end;
            if $ts == null then null
            elif ($ts | type) == "number" then _num_ms($ts)
            elif ($ts | type) == "string" then _str($ts)
            elif ($ts | type) == "object" then
              if   $ts["$date"] != null then to_epoch_ms($ts["$date"])
              elif $ts["$numberLong"] != null then to_epoch_ms($ts["$numberLong"])
              elif $ts.seconds != null then
                ($ts.seconds | tostring | tonumber) * 1000
                + ((($ts.nanos // 0) | tostring | tonumber) / 1000000 | floor)
              else null end
            else null end;

          . as $r
          | ($r.security_advisory // {}) as $adv
          | ($r.security_vulnerability // {}) as $sv
          | ($r.dependency // {}) as $dep
          | (($dep.package // $sv.package // $adv.vulnerabilities[0].package) // {}) as $pkg
          | ($adv.severity // $sv.severity // "") as $sev

          # Dependabot state -> OCSF finding activity + status
          | (if $r.state == "open" then 1                       # Create
             elif ($r.state == "fixed" or $r.state == "dismissed" or $r.state == "auto_dismissed") then 3  # Close
             else 2 end) as $activity                            # Update (fallback)
          | (if $r.state == "open" then 1                        # New
             elif $r.state == "fixed" then 4                     # Resolved
             elif ($r.state == "dismissed" or $r.state == "auto_dismissed") then 3  # Suppressed
             else 0 end) as $status

          # GitHub severity string -> OCSF severity_id
          | ({ "low": 2, "medium": 3, "high": 4, "critical": 5 }[$sev] // 0) as $sevid

          | {
              "category_uid": 2,
              "class_uid":    2002,
              "activity_id":  $activity,
              "type_uid":     (2002 * 100 + $activity),
              "severity_id":  $sevid,
              "status_id":    $status,

              "time": to_epoch_ms($r.updated_at // $r.created_at),
              "start_time": to_epoch_ms($r.created_at),

              "metadata": {
                "version": "1.9.0",
                "product": {
                  "vendor_name": "GitHub",
                  "name": "Dependabot",
                  "feature": { "name": "Dependabot Alerts" }
                },
                "profiles": ["cloud"]
              },

              # Cloud is required on Vulnerability Finding in 1.9.0.
              "cloud": { "provider": "GitHub" },

              "finding_info": {
                "uid": ($adv.ghsa_id // ($r.url // ("dependabot-alert-" + ($r.number | tostring)))),
                "title": ($adv.summary // ("Dependabot alert " + ($r.number | tostring))),
                "desc": $adv.description,
                "src_url": $r.html_url,
                "first_seen_time": to_epoch_ms($r.created_at),
                "modified_time": to_epoch_ms($r.updated_at),
                "types": ["Software Composition Analysis"]
              },

              # OSINT is required on Vulnerability Finding in 1.9.0.
              # type_id 10 = Vulnerability.
              "osint": [ {
                "value": ($adv.cve_id // $adv.ghsa_id // "unknown"),
                "type_id": 10,
                "type": (if $adv.cve_id then "CVE" else "GHSA" end)
              } ],

              "vulnerabilities": [ {
                "title": ($adv.summary // $adv.ghsa_id),
                "desc": $adv.description,
                "severity": (if $sev != "" then ($sev | ascii_upcase) else null end),
                "references": [ ($adv.references // [])[] | .url ],
                "is_fix_available": (($sv.first_patched_version.identifier // null) != null),
                "fix_available": (($sv.first_patched_version.identifier // null) != null),
                "cve": {
                  "uid": ($adv.cve_id // $adv.ghsa_id),
                  "desc": $adv.summary,
                  "created_time": to_epoch_ms($adv.published_at),
                  "modified_time": to_epoch_ms($adv.updated_at),
                  "references": [ ($adv.references // [])[] | .url ],
                  "cvss": ( if ($adv.cvss.vector_string // null) != null then [ {
                      "version": ( ($adv.cvss.vector_string | capture("^CVSS:(?<v>[0-9.]+)").v) // "3.1" ),
                      "base_score": $adv.cvss.score,
                      "vector_string": $adv.cvss.vector_string
                  } ] else null end )
                },
                "cwe": ( ($adv.cwes // [])[0] | if . then {
                    "uid": .cwe_id,
                    "caption": .name
                } else null end ),
                "affected_packages": [ {
                  "name": $pkg.name,
                  "package_manager": $pkg.ecosystem,
                  "path": $dep.manifest_path,
                  "vulnerable_version_range": $sv.vulnerable_version_range,
                  "fixed_in_version": $sv.first_patched_version.identifier,
                  "remediation": ( if ($sv.first_patched_version.identifier // null) != null
                                   then { "desc": ("Upgrade " + ($pkg.name // "package") + " to " + $sv.first_patched_version.identifier + " or later.") }
                                   else null end )
                } ]
              } ],

              # Repository context in the vendor namespace.
              "resource": {
                "name": ($r.repository.full_name // $r.repository.name),
                "type": "Repository",
                "uid": ($r.repository.id | tostring),
                "cloud_partition": null
              },

              "message": ($adv.summary // ("Dependabot alert " + ($r.number | tostring))),
              "raw_data": ($r | tostring)
            }
          | walk( if type == "object" then with_entries(select(.value != null and .value != "" and .value != [] and .value != {})) else . end )
