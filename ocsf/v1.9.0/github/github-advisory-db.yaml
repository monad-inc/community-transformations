name: "GitHub Advisory Database to OCSF v1.9.0"
description: "Transforms GitHub Advisory Database (Global Security Advisory) records into the OCSF v1.9.0 Vulnerability Finding class."
author: "Monad"
contributors:
  - "https://github.com/behobu"
inputs:
  - "github-advisory-db"
tags:
  - "v1.9.0"
  - "ocsf"
  - "github"
  - "vulnerability"
  - "findings"
config:
  operations:
    - operation: "jq"
      arguments:
        key: ""
        query: |
          # ---------------------------------------------------------------
          # OCSF Vulnerability Finding (class_uid=2002) — v1.9.0
          # Input: one GitHub Global Security Advisory record per invocation
          #   (the github-advisory-db input connector). This is a VULNERABILITY
          #   CATALOG entry — a published advisory, not a host-scoped scan
          #   result — so there is no device/asset context.
          #
          # v1.9.0 makes `cloud` and `osint` base-REQUIRED on this class (they
          # were not required at 1.5.0), so both are always emitted: `cloud`
          # carries the source platform (GitHub) and `osint` carries the
          # advisory identifier as a Vulnerability-type indicator.
          # ---------------------------------------------------------------
          # OCSF severity_id from a source severity: a label (case-insensitive) or a
          # 0-10 score using the CVSS qualitative ranges (0 None -> 1, <4 Low, <7 Medium,
          # <9 High, else Critical). 0 for null/empty/"unknown"; 99 for an unrecognized
          # label (then keep the source label in `severity`). Map vendor-specific
          # numeric scales (e.g. 1-5) explicitly instead.
          def sev_to_id($s):
            def _score($n):
              if $n < 0 or $n > 10 then 99
              elif $n == 0 then 1 elif $n < 4 then 2 elif $n < 7 then 3 elif $n < 9 then 4
              else 5 end;
            if $s == null then 0
            elif ($s | type) == "number" then _score($s)
            elif ($s | type) != "string" then 99
            else
              ($s | ascii_downcase | sub("^\\s+"; "") | sub("\\s+$"; "")) as $l
              | if $l == "" or $l == "unknown" or $l == "unspecified" or $l == "untriaged" then 0
                elif ($l | test("^[0-9]+(\\.[0-9]+)?$")) then _score($l | tonumber)
                else
                  {"info":1,"informational":1,"information":1,"none":1,"notice":1,"debug":1,"trace":1,
                   "low":2,"minor":2,
                   "medium":3,"moderate":3,"middle":3,"warning":3,"warn":3,
                   "high":4,"major":4,"important":4,"error":4,
                   "critical":5,"crit":5,"severe":5,"alert":5,
                   "fatal":6,"emergency":6,"emerg":6}[$l] // 99
                end
            end;



          # GHSA severity label -> OCSF severity_id (+ caption sibling).
          def to_epoch_ms($ts):
            def _n: if . == null then null else tonumber end;
            def _num_ms($n):
              if   $n >= 1e17 then ($n / 1000000 | floor)
              elif $n >= 1e14 then ($n / 1000 | floor)
              elif $n >= 1e11 then ($n | floor)
              else ($n * 1000 + 0.001 | floor) end;
            def _digits_ms($d):
              ($d | ltrimstr("-") | length) as $l
              | if   $l >= 18 then ($d[0:-6] | tonumber)
                elif $l >= 15 then ($d[0:-3] | tonumber)
                elif $l >= 12 then ($d | tonumber)
                else ($d | tonumber) * 1000 end;
            def _frac_ms($f): if $f == null then 0 else (($f + "000")[0:3] | tonumber) end;
            def _mon($m):
              if $m == null then null
              else {"JAN":1,"FEB":2,"MAR":3,"APR":4,"MAY":5,"JUN":6,
                    "JUL":7,"AUG":8,"SEP":9,"OCT":10,"NOV":11,"DEC":12}[$m[0:3]] end;
            def _zone($z):
              if $z == null or $z == "" then 0
              else
                ($z | if test("^(UTC|GMT|UT)[+-]") then sub("^(UTC|GMT|UT)"; "") else . end) as $z
                | if ($z | test("^[+-][0-9]{1,2}(:?[0-9]{2})?$")) then
                    ($z | capture("^(?<sg>[+-])(?<h>[0-9]{1,2}):?(?<m>[0-9]{2})?$")) as $o
                    | (if $o.sg == "-" then -1 else 1 end)
                      * (($o.h | tonumber) * 3600 + (($o.m // "0") | tonumber) * 60)
                  else
                    {"Z":0,"UTC":0,"GMT":0,"UT":0,"EST":-18000,"EDT":-14400,"CST":-21600,
                     "CDT":-18000,"MST":-25200,"MDT":-21600,"PST":-28800,"PDT":-25200}[$z]
                  end
              end;
            def _ms($c):
              ($c.y | tonumber | if . < 100 then (if . < 70 then . + 2000 else . + 1900 end) else . end) as $y
              | ($c.mo | _n) as $mo
              | ($c.d | tonumber) as $d
              | (($c.h // "0") | tonumber) as $h
              | (($c.mi // "0") | tonumber) as $mi
              | (($c.s // "0") | tonumber) as $s
              | _zone($c.z) as $off
              | if $mo == null or $off == null or $mo < 1 or $mo > 12 or $d < 1 or $d > 31
                   or $h > 23 or $mi > 59 or $s > 60 then null
                else
                  ($y - (if $mo <= 2 then 1 else 0 end)) as $yy
                  | ($yy / 400 | floor) as $era
                  | ($yy - $era * 400) as $yoe
                  | (((153 * ($mo + (if $mo > 2 then -3 else 9 end)) + 2) / 5 | floor) + $d - 1) as $doy
                  | ($yoe * 365 + ($yoe / 4 | floor) - ($yoe / 100 | floor) + $doy) as $doe
                  | ($era * 146097 + $doe - 719468) as $days
                  | ($days * 86400 + $h * 3600 + $mi * 60 + $s - $off) * 1000 + _frac_ms($c.f)
                end;
            def _str($raw):
              ($raw | ascii_upcase | sub("\\s*\\([^)]*\\)\\s*$"; "") | sub("^\\s+"; "") | sub("\\s+$"; "")) as $s
              | "(?<z>Z|(?:UTC|GMT|UT)?[+-][0-9]{1,2}(?::?[0-9]{2})?|[A-Z]{1,5})" as $Z
              | "(?<h>[0-9]{1,2}):(?<mi>[0-9]{2})(?::(?<s>[0-9]{2}))?(?:[.,](?<f>[0-9]+))?" as $T
              | if $s == "" then null
                elif ($s | test("^-?[0-9]+$")) then _digits_ms($s)
                elif ($s | test("^[0-9]+\\.[0-9]+$")) then
                  ($s | split(".")) as $p
                  | if ($p[0] | length) <= 11 then _digits_ms($p[0]) + _frac_ms($p[1])
                    else _digits_ms($p[0]) end
                elif ($s | test("^/DATE\\(-?[0-9]+([+-][0-9]{4})?\\)/$")) then
                  ($s | capture("(?<ms>-?[0-9]+)").ms | tonumber)
                else
                  first(
                    ($s | capture("^(?<y>[0-9]{4})[-/](?<mo>[0-9]{1,2})[-/](?<d>[0-9]{1,2})(?:[T ]+" + $T + ")?\\s*" + $Z + "?(?:\\s+[A-Z]{2,5})?$") | _ms(.)),
                    ($s | capture("^(?<y>[0-9]{4})(?<mo>[0-9]{2})(?<d>[0-9]{2})T(?<h>[0-9]{2})(?<mi>[0-9]{2})(?<s>[0-9]{2})(?:[.,](?<f>[0-9]+))?" + $Z + "?$") | _ms(.)),
                    ($s | capture("^(?:[A-Z]+,?\\s+)?(?<d>[0-9]{1,2})[ -](?<mon>[A-Z]{3,9})[ -](?<y>[0-9]{2,4})\\s+" + $T + "\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?:[A-Z]+,?\\s+)?(?<mon>[A-Z]{3,9})\\.?\\s+(?<d>[0-9]{1,2}),?\\s+(?<y>[0-9]{4})(?:,?\\s+" + $T + ")?\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?:[A-Z]+\\s+)?(?<mon>[A-Z]{3,9})\\s+(?<d>[0-9]{1,2})\\s+" + $T + "\\s+(?:" + $Z + "\\s+)?(?<y>[0-9]{4})$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?<d>[0-9]{1,2})/(?<mon>[A-Z]{3})/(?<y>[0-9]{4}):" + $T + "\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.))
                  ) // null
                end;
            if $ts == null then null
            elif ($ts | type) == "number" then _num_ms($ts)
            elif ($ts | type) == "string" then _str($ts)
            elif ($ts | type) == "object" then
              if   $ts["$date"] != null then to_epoch_ms($ts["$date"])
              elif $ts["$numberLong"] != null then to_epoch_ms($ts["$numberLong"])
              elif $ts.seconds != null then
                ($ts.seconds | tostring | tonumber) * 1000
                + ((($ts.nanos // 0) | tostring | tonumber) / 1000000 | floor)
              else null end
            else null end;

          def sev_caption($id):
            {"0":"Unknown","1":"Informational","2":"Low","3":"Medium","4":"High",
             "5":"Critical","6":"Fatal","99":"Other"}[$id | tostring];

          # Derive the CVSS version string ("3.1", "4.0", ...) from the vector
          # prefix "CVSS:<ver>/..."; default to "3.1" when only a bare score
          # is present.
          def cvss_ver($vec):
            if ($vec | type) == "string" and ($vec | startswith("CVSS:"))
            then ($vec | ltrimstr("CVSS:") | split("/")[0])
            else "3.1" end;

          . as $r |
          ($r.references // []) as $refs |
          ($r.vulnerabilities // []) as $vulns |
          ($r.cwes // []) as $cwes |
          # Prefer the structured cvss_severities.cvss_v3, then the legacy
          # top-level cvss object.
          (($r.cvss_severities.cvss_v3 // $r.cvss // {})) as $cv |

          # Primary indicator id: the GHSA id (always present), CVE as fallback.
          ($r.ghsa_id // $r.cve_id) as $primary_id |

          # One OCSF CVSS object when a base score is present.
          (if ($cv.score != null)
             then [ { "version": cvss_ver($cv.vector_string),
                      "base_score": $cv.score }
                    + (if $cv.vector_string != null
                         then {"vector_string": $cv.vector_string} else {} end) ]
             else [] end) as $cvss |

          # The CVE object (recommended on the vulnerability), only when a CVE
          # id exists.
          (if $r.cve_id != null
             then { "uid": $r.cve_id,
                    "title": $r.summary,
                    "desc": $r.description,
                    "references": $refs,
                    "created_time": to_epoch_ms($r.nvd_published_at // $r.published_at) }
                  + (if ($cvss | length) > 0 then {"cvss": $cvss} else {} end)
             else null end) as $cve |

          # First CWE (recommended on the vulnerability), when present.
          ($cwes | first) as $cwe0 |

          # Affected packages, one per vulnerabilities[] entry. name+version
          # are REQUIRED on affected_package; the range is the "version".
          ([ $vulns[] | {
              "name": (.package.name // "unknown"),
              "version": (.vulnerable_version_range // "*"),
              "fixed_in_version": .first_patched_version,
              "package_manager": .package.ecosystem
            } ]) as $pkgs |

          # Is a fix published for any affected package?
          ([ $vulns[] | .first_patched_version ] | map(select(. != null)) | length > 0) as $has_fix |

          sev_to_id($r.severity // "") as $sev_id |

          {
            # --- Classification (REQUIRED) ---
            "category_uid": 2,
            "class_uid": 2002,
            "type_uid": 200201,
            "activity_id": 1,

            # --- Severity (REQUIRED) ---
            "severity_id": $sev_id,
            "severity": sev_caption($sev_id),

            # --- Time (REQUIRED) ---
            "time": to_epoch_ms($r.published_at),

            # --- Metadata (REQUIRED) ---
            "metadata": {
              "version": "1.9.0",
              # `cloud` and `osint` are anchors of their respective OCSF
              # profiles; declare the profiles so the fields are recognized.
              "profiles": ["cloud", "osint"],
              "product": {
                "vendor_name": "GitHub",
                "name": "GitHub Advisory Database"
              },
              "uid": $r.ghsa_id,
              "logged_time": to_epoch_ms($r.github_reviewed_at)
            },

            # --- Cloud (cloud profile); provider is the source platform ---
            "cloud": { "provider": "GitHub" },

            # --- OSINT (osint profile, array); the advisory id as a
            #     Vulnerability-type (type_id=10) indicator ---
            "osint": [{
              "value": $primary_id,
              "type_id": 10,
              "type": "Vulnerability"
            }],

            # --- Finding Info (REQUIRED) ---
            "finding_info": {
              "uid": $r.ghsa_id,
              "title": $r.summary,
              "desc": $r.description,
              "created_time": to_epoch_ms($r.published_at),
              "modified_time": to_epoch_ms($r.updated_at),
              "src_url": $r.html_url,
              "types": ["Vulnerability"]
            },

            # --- Vulnerabilities (REQUIRED) — one advisory = one entry. The
            #     OCSF `vulnerability` object carries a `just_one:
            #     [advisory, cve, cwe]` constraint, so attach EXACTLY one:
            #     prefer the CVE, else the first CWE, else a synthesized
            #     advisory keyed by the GHSA id. ---
            "vulnerabilities": [
              ({
                "title": $r.summary,
                "desc": $r.description,
                "severity": $r.severity,
                "references": $refs,
                "is_fix_available": $has_fix,
                "first_seen_time": to_epoch_ms($r.published_at),
                "affected_packages": (if ($pkgs | length) > 0 then $pkgs else null end)
              }
              + (if $cve != null then {"cve": $cve}
                 elif $cwe0 != null then {"cwe": {"uid": $cwe0.cwe_id, "caption": $cwe0.name}}
                 else {"advisory": {"uid": $r.ghsa_id, "desc": $r.summary, "references": $refs}} end)
              + (if $has_fix
                   then {"remediation": {"desc": ("Upgrade to a patched release. Fixed versions: "
                          + ([ $vulns[] | select(.first_patched_version != null)
                               | (.package.name // "package") + " " + .first_patched_version ] | join(", "))),
                          "references": $refs}}
                   else {} end))
            ],

            # --- Recommended: observables (natural pivots) ---
            "observables": [
              (if $r.cve_id != null
                 then { "name": "vulnerabilities.cve.uid", "type": "CVE Object: uid", "type_id": 18, "value": $r.cve_id } else empty end),
              (if $cwe0 != null
                 then { "name": "vulnerabilities.cwe.uid", "type": "CWE Object: uid", "type_id": 17, "value": $cwe0.cwe_id } else empty end)
            ],

            # --- Original record for audit / debugging ---
            "raw_data": (. | tostring)
          }
          # Drop keys that resolved to null (the OCSF validator rejects nulls).
          | del(.. | nulls)
