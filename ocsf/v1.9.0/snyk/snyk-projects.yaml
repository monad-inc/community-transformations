name: "Snyk Project Metadata to OCSF v1.9.0"
description: "Transforms Snyk Project Metadata into the OCSF v1.9.0 Software Inventory Info class (Discovery)."
author: "Monad"
contributors:
  - "https://github.com/behobu"
inputs:
  - "snyk-projects"
tags:
  - "v1.9.0"
  - "ocsf"
  - "snyk"
  - "inventory"
config:
  operations:
    - operation: "jq"
      arguments:
        key: ""
        query: |
          # ---------------------------------------------------------------
          # OCSF Software Inventory Info (class_uid=5020, Discovery) — v1.9.0
          # Input: one Snyk REST API /orgs/{id}/projects record per call.
          # A Snyk "project" is a scanned software asset (a manifest in a
          # repo), so it models as a software inventory snapshot collected
          # from Snyk. cloud + osint are base-required for this class.
          # ---------------------------------------------------------------


          def to_epoch_ms($ts):
            def _num_ms($n):
              if   $n >= 1e17 then ($n / 1000000 | floor)
              elif $n >= 1e14 then ($n / 1000 | floor)
              elif $n >= 1e11 then ($n | floor)
              else ($n * 1000 | floor) end;
            if $ts == null or $ts == "" then null
            elif ($ts | type) == "number" then _num_ms($ts)
            elif ($ts | type) == "object" then
              (if ($ts.seconds // null) == null then null
               else ($ts.seconds * 1000 + ((($ts.nanos // 0) / 1000000) | floor)) end)
            elif ($ts | type) == "string" then
              if ($ts | test("^-?[0-9]+(\\.[0-9]+)?$")) then _num_ms($ts | tonumber)
              else
                ([$ts | ascii_upcase | capture("^(?<d>[0-9]{4}-[0-9]{2}-[0-9]{2})(?:[T ](?<t>[0-9]{2}:[0-9]{2}(?::[0-9]{2})?)(?:[.,](?<f>[0-9]+))?)? ?(?<z>Z|UTC|[+-][0-9]{2}(?::?[0-9]{2})?)?$")] | first) as $m
                | if $m == null then null
                  else
                    (($m.t // "00:00:00") | if length == 5 then . + ":00" else . end) as $t
                    | (($m.z // "Z") | if . == "Z" or . == "UTC" then 0
                        else (.[1:] | gsub(":"; "")) as $o
                          | ((if (.[0:1]) == "-" then -1 else 1 end)
                             * (($o[0:2] | tonumber) * 3600 + ((if ($o | length) >= 4 then $o[2:4] else "00" end) | tonumber) * 60))
                        end) as $off
                    | ((($m.d + "T" + $t + "Z") | fromdateiso8601) - $off) * 1000
                      + (((($m.f // "") + "000")[0:3]) | tonumber)
                  end
              end
            else null end;

          . as $r
          | ($r.attributes // {}) as $a
          | ($r.relationships.target.data.id // null) as $target_id
          | {
              "class_uid":    5020,
              "category_uid": 5,
              "activity_id":  2,
              "type_uid":     502002,
              "severity_id":  1,
              "time": (to_epoch_ms($a.created) // 0),
              "message": ($a.name // ""),
              "status": $a.status,
              "is_alert": false,
              "metadata": {
                "version": "1.9.0",
                "product": {
                  "name": "Snyk",
                  "vendor_name": "Snyk"
                },
                "uid": $r.id,
                "profiles": [ "cloud", "osint" ],
                "labels": (
                  [ $a.tags[]? | select(.key != null) | "\(.key):\(.value)" ]
                )
              },
              "cloud": {
                "provider": "Snyk"
              },
              "device": {
                "type_id": 0,
                "name": $a.name,
                "uid": $target_id
              },
              "osint": [
                {
                  "value": ($r.id // $a.name),
                  "type_id": 0,
                  "name": ($a.name // null)
                }
              ],
              "unmapped": {
                "project_type": $a.type,
                "origin": $a.origin,
                "target_file": $a.target_file,
                "target_reference": $a.target_reference,
                "business_criticality": $a.business_criticality,
                "environment": $a.environment,
                "lifecycle": $a.lifecycle,
                "read_only": $a.read_only
              },
              "raw_data": ($r | tostring)
            }
            | walk( if type == "object" then with_entries(select(.value != null and .value != [] and .value != {})) else . end )
