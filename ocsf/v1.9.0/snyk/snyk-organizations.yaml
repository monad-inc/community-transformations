name: "Snyk Organizations to OCSF v1.9.0"
description: "Transforms Snyk Organization inventory records (Snyk REST GET /orgs) into the OCSF v1.9.0 API Activity class (class_uid 6003)."
# author is ALWAYS "Monad" — never a person. You are a contributor.
author: "Monad"
contributors:
  - "https://github.com/behobu"
inputs:
  - "snyk-organizations"
tags:
  - "v1.9.0"
  - "ocsf"
  - "snyk"
  - "api-activity"
config:
  operations:
    - operation: "jq"
      arguments:
        key: ""
        query: |
          # ---------------------------------------------------------------
          # OCSF API Activity (class_uid=6003) — v1.9.0
          # Input: one Snyk organization record (REST GET /orgs data[]).
          # An org-inventory pull is a Read (activity_id=2) API event.
          # cloud + osint are base-required in 1.9.0; both profiles are
          # declared in metadata.profiles and osint is emitted as an array.
          # ---------------------------------------------------------------

          def to_epoch_ms($ts):
            def _num_ms($n):
              if   $n >= 1e17 then ($n / 1000000 | floor)
              elif $n >= 1e14 then ($n / 1000 | floor)
              elif $n >= 1e11 then ($n | floor)
              else ($n * 1000 | floor) end;
            if $ts == null or $ts == "" then null
            elif ($ts | type) == "number" then _num_ms($ts)
            elif ($ts | type) == "object" then
              (if ($ts.seconds // null) == null then null
               else ($ts.seconds * 1000 + ((($ts.nanos // 0) / 1000000) | floor)) end)
            elif ($ts | type) == "string" then
              if ($ts | test("^-?[0-9]+(\\.[0-9]+)?$")) then _num_ms($ts | tonumber)
              else
                ([$ts | ascii_upcase | capture("^(?<d>[0-9]{4}-[0-9]{2}-[0-9]{2})(?:[T ](?<t>[0-9]{2}:[0-9]{2}(?::[0-9]{2})?)(?:[.,](?<f>[0-9]+))?)? ?(?<z>Z|UTC|[+-][0-9]{2}(?::?[0-9]{2})?)?$")] | first) as $m
                | if $m == null then null
                  else
                    (($m.t // "00:00:00") | if length == 5 then . + ":00" else . end) as $t
                    | (($m.z // "Z") | if . == "Z" or . == "UTC" then 0
                        else (.[1:] | gsub(":"; "")) as $o
                          | ((if (.[0:1]) == "-" then -1 else 1 end)
                             * (($o[0:2] | tonumber) * 3600 + ((if ($o | length) >= 4 then $o[2:4] else "00" end) | tonumber) * 60))
                        end) as $off
                    | ((($m.d + "T" + $t + "Z") | fromdateiso8601) - $off) * 1000
                      + (((($m.f // "") + "000")[0:3]) | tonumber)
                  end
              end
            else null end;

          . as $r
          | ($r.attributes // {}) as $a
          | {
              # --- Classification (REQUIRED) ---
              "category_uid": 6,
              "class_uid":    6003,
              "activity_id":  2,
              "type_uid":     600302,
              "severity_id":  1,

              # --- Time (REQUIRED) ---
              "time": (to_epoch_ms($a.created_at) // 0),

              # --- Metadata (REQUIRED) ---
              "metadata": {
                "version": "1.9.0",
                "product": {
                  "vendor_name": "Snyk",
                  "name": "Snyk"
                },
                "profiles": ["cloud", "osint"]
              },

              # --- cloud (base-required in 1.9.0) ---
              "cloud": {
                "provider": "Snyk"
              },

              # --- osint (base-required in 1.9.0; no indicators in an org record) ---
              "osint": [],

              # --- api (base-required; this is a REST GET) ---
              "api": {
                "operation": "GET /orgs"
              },

              # --- actor (base-required; the Snyk integration performing the read) ---
              "actor": {
                "app_name": "Snyk"
              },

              # --- src_endpoint (base-required; the Snyk REST API host) ---
              "src_endpoint": {
                "svc_name": "Snyk REST API",
                "hostname": "api.snyk.io"
              },

              # --- Recommended ---
              "status_id": 1,
              "message": ("Snyk organization: " + ($a.name // $r.id)),

              # --- Fields with no clean OCSF home ---
              "unmapped": {
                "org_slug": $a.slug,
                "group_id": $a.group_id,
                "is_personal": $a.is_personal,
                "access_requests_enabled": $a.access_requests_enabled
              },

              # --- Original record ---
              "raw_data": ($r | tostring)
            }
          # Prune null/"" only — keep osint:[] (base-required) intact.
          | walk(
              if type == "object"
              then with_entries(select(.value != null and .value != ""))
              else . end
            )
