name: "Snyk Issue Findings to OCSF v1.9.0"
description: "Transforms Snyk Issue Findings into the OCSF v1.9.0 Vulnerability Finding class."
author: "Monad"
contributors:
  - "https://github.com/behobu"
  - "https://github.com/Credgate"
inputs:
  - "snyk-issues"
tags:
  - "v1.9.0"
  - "ocsf"
  - "snyk"
  - "vulnerability"
config:
  operations:
    - operation: "jq"
      arguments:
        key: ""
        query: |
          # ---------------------------------------------------------------
          # OCSF Vulnerability Finding (class_uid=2002) — v1.9.0
          # Input: one Snyk REST API /issues record per invocation.
          # ---------------------------------------------------------------


          def to_epoch_ms($ts):
            def _num_ms($n):
              if   $n >= 1e17 then ($n / 1000000 | floor)
              elif $n >= 1e14 then ($n / 1000 | floor)
              elif $n >= 1e11 then ($n | floor)
              else ($n * 1000 | floor) end;
            if $ts == null or $ts == "" then null
            elif ($ts | type) == "number" then _num_ms($ts)
            elif ($ts | type) == "object" then
              (if ($ts.seconds // null) == null then null
               else ($ts.seconds * 1000 + ((($ts.nanos // 0) / 1000000) | floor)) end)
            elif ($ts | type) == "string" then
              if ($ts | test("^-?[0-9]+(\\.[0-9]+)?$")) then _num_ms($ts | tonumber)
              else
                ([$ts | ascii_upcase | capture("^(?<d>[0-9]{4}-[0-9]{2}-[0-9]{2})(?:[T ](?<t>[0-9]{2}:[0-9]{2}(?::[0-9]{2})?)(?:[.,](?<f>[0-9]+))?)? ?(?<z>Z|UTC|[+-][0-9]{2}(?::?[0-9]{2})?)?$")] | first) as $m
                | if $m == null then null
                  else
                    (($m.t // "00:00:00") | if length == 5 then . + ":00" else . end) as $t
                    | (($m.z // "Z") | if . == "Z" or . == "UTC" then 0
                        else (.[1:] | gsub(":"; "")) as $o
                          | ((if (.[0:1]) == "-" then -1 else 1 end)
                             * (($o[0:2] | tonumber) * 3600 + ((if ($o | length) >= 4 then $o[2:4] else "00" end) | tonumber) * 60))
                        end) as $off
                    | ((($m.d + "T" + $t + "Z") | fromdateiso8601) - $off) * 1000
                      + (((($m.f // "") + "000")[0:3]) | tonumber)
                  end
              end
            else null end;

          . as $r
          | ($r.attributes // {}) as $a
          | {
              "class_uid":    2002,
              "category_uid": 2,
              "activity_id":  2,
              "type_uid":     200202,
              "severity_id": (
                { "info": 1, "low": 2, "medium": 3, "high": 4, "critical": 5 }[$a.effective_severity_level] // 0
              ),
              "status": $a.status,
              "status_id": ({ "open": 1, "resolved": 4, "ignored": 3 }[$a.status // ""] // 99),
              "message": ($a.title // ""),
              "time": (to_epoch_ms($a.updated_at) // to_epoch_ms($a.created_at) // 0),
              "cloud": {
                "provider": "Snyk"
              },
              "osint": [
                ( $a.problems[]? | select((.id // "") | test("^CVE-")) | { "value": .id, "type_id": 99, "src_url": .url } )
              ],
              "metadata": {
                "profiles": ["cloud", "osint"],
                "version": "1.9.0",
                "product": {
                  "name": "Snyk",
                  "vendor_name": "Snyk"
                },
                "uid": $r.id
              },
              "finding_info": {
                "uid": $r.id,
                "title": $a.title,
                "desc": $a.description,
                "types": [ $a.type ],
                "created_time": (to_epoch_ms($a.created_at) // 0),
                "modified_time": (to_epoch_ms($a.updated_at) // 0),
                "src_url": ($a.problems[0].url // null)
              },
              "vulnerabilities": [
                {
                  "title": $a.title,
                  "desc": $a.description,
                  "severity": $a.effective_severity_level,
                  "is_fix_available": ($a.coordinates[0].is_fixable_snyk // null),
                  "references": [ $a.problems[]?.url | select(. != null) ],
                  "cve": (
                    ( [ $a.problems[]? | select((.id // "") | test("^CVE-")) | .id ][0] ) as $cve
                    | if $cve != null then {
                        "uid": $cve,
                        "cvss": [ $a.severities[]? | select(.score != null) | {
                            "version": (.version // "3.1"),
                            "base_score": .score,
                            "vector_string": .vector
                        } ]
                      } else null end
                  ),
                  # vulnerability carries a just_one(advisory, cve, cwe) constraint;
                  # prefer the CVE and only emit the CWE when no CVE is present.
                  "cwe": (
                    ( [ $a.problems[]? | select((.id // "") | test("^CVE-")) | .id ][0] ) as $cve
                    | ( [ $a.classes[]?  | select(.source == "CWE") | .id ][0] ) as $cwe
                    | if ($cve == null and $cwe != null) then { "uid": $cwe } else null end
                  ),
                  "affected_packages": [
                    $a.coordinates[]?.representations[]?.dependency
                    | select(. != null)
                    | {
                        "name": .package_name,
                        "version": .package_version
                      }
                  ]
                }
              ],
              "raw_data": ($r | tostring)
            }
            | walk( if type == "object" then with_entries(select(.value != null and .value != [] and .value != {})) else . end )
            # osint is required once the profile is declared; drop the profile when no CVE was found.
            | if has("osint") then . else .metadata.profiles -= ["osint"] end
