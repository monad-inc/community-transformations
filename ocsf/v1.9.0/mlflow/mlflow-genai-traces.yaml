name: "MLflow GenAI Traces to OCSF v1.9.0"
description: "Transforms MLflow GenAI traces received as OTLP trace export requests into OCSF v1.9.0 API Activity (6003) events, one per trace, with the trace, ai_model and message_context (token usage) objects of the trace and ai_operation profiles."
author: "Monad"
contributors:
  - "https://github.com/behobu"
inputs:
  - "mlflow-genai-traces"
tags:
  - "v1.9.0"
  - "ocsf"
  - "mlflow"
  - "ai"
  - "application activity"
  - "api activity"
config:
  operations:
    - operation: "jq"
      arguments:
        key: ""
        query: |
          # =================================================================
          # MLflow GenAI Traces (OTLP) -> OCSF v1.9.0 API Activity (6003)
          #
          # Input: ONE OTLP trace export request per invocation, as forwarded by
          # the Monad `mlflow-genai-traces` input (an OTLP-wrapped input that
          # MLflow's OpenTelemetry exporter pushes to). The body is an
          # ExportTraceServiceRequest: resourceSpans[].scopeSpans[].spans[].
          # An OTLP/protobuf body is re-encoded as protojson (traceId/spanId
          # base64, enum names such as "STATUS_CODE_ERROR"); an OTLP/JSON body
          # is passed through as sent (hex ids, numeric enums). Both are handled.
          # Timestamps are nanosecond strings; int64 attribute values are strings.
          #
          # Output: ONE event PER TRACE. Spans are grouped by traceId; the root
          # span (no parentSpanId) names the operation and gives its status;
          # start/end span the whole trace; token usage is summed over the
          # trace's spans. A request may hold several traces (several events)
          # or only part of one (the root may arrive in another request; the
          # event is then labelled trace.partial).
          #
          # A trace is one GenAI application invocation, mapped to API Activity
          # with activity 99/Other (an LLM call is not a CRUD verb). The model
          # and token usage go in ai_model / message_context (ai_operation
          # profile); trace/root-span ids and timing go in trace (trace profile).
          # MLflow JSON-encodes its own span attribute values (mlflow.spanType =
          # "\"LLM\"", mlflow.chat.tokenUsage = "{...}"), so values that look
          # like JSON are decoded.
          # =================================================================

          # OCSF timestamp_t is epoch MILLISECONDS. Use this helper for every
          # time / *_time field; it accepts epoch s/ms/us/ns numbers, numeric
          # strings, {seconds,nanos}, and ISO 8601 with any UTC offset, and
          # returns null (not an error) on unparseable input.
          def to_epoch_ms($ts):
            def _num_ms($n):
              if   $n >= 1e17 then ($n / 1000000 | floor)
              elif $n >= 1e14 then ($n / 1000 | floor)
              elif $n >= 1e11 then ($n | floor)
              else ($n * 1000 | floor) end;
            if $ts == null or $ts == "" then null
            elif ($ts | type) == "number" then _num_ms($ts)
            elif ($ts | type) == "object" then
              (if ($ts.seconds // null) == null then null
               else ($ts.seconds * 1000 + ((($ts.nanos // 0) / 1000000) | floor)) end)
            elif ($ts | type) == "string" then
              if ($ts | test("^-?[0-9]+(\\.[0-9]+)?$")) then _num_ms($ts | tonumber)
              else
                ([$ts | ascii_upcase | capture("^(?<d>[0-9]{4}-[0-9]{2}-[0-9]{2})(?:[T ](?<t>[0-9]{2}:[0-9]{2}(?::[0-9]{2})?)(?:[.,](?<f>[0-9]+))?)? ?(?<z>Z|UTC|[+-][0-9]{2}(?::?[0-9]{2})?)?$")] | first) as $m
                | if $m == null then null
                  else
                    (($m.t // "00:00:00") | if length == 5 then . + ":00" else . end) as $t
                    | (($m.z // "Z") | if . == "Z" or . == "UTC" then 0
                        else (.[1:] | gsub(":"; "")) as $o
                          | ((if (.[0:1]) == "-" then -1 else 1 end)
                             * (($o[0:2] | tonumber) * 3600 + ((if ($o | length) >= 4 then $o[2:4] else "00" end) | tonumber) * 60))
                        end) as $off
                    | ((($m.d + "T" + $t + "Z") | fromdateiso8601) - $off) * 1000
                      + (((($m.f // "") + "000")[0:3]) | tonumber)
                  end
              end
            else null end;

          # OTLP AnyValue -> plain JSON (int64 arrives as a string).
          def av($v):
            if   $v == null             then null
            elif $v.stringValue != null then $v.stringValue
            elif $v.intValue    != null then ($v.intValue | tonumber)
            elif $v.doubleValue != null then $v.doubleValue
            elif $v.boolValue   != null then $v.boolValue
            elif $v.arrayValue  != null then ((($v.arrayValue.values) // []) | map(av(.)))
            elif $v.kvlistValue != null then (reduce ((($v.kvlistValue.values) // [])[]) as $a ({}; .[$a.key] = av($a.value)))
            else null end;
          def kv($arr): reduce (($arr // [])[]) as $a ({}; .[$a.key] = av($a.value));
          # Decode MLflow's JSON-encoded attribute values; leave plain strings.
          def pj($v):
            if ($v | type) == "string" and ($v | test("^\\s*[\\[{\"]")) then (($v | fromjson?) // $v)
            else $v end;
          def num($v):
            if ($v | type) == "number" then $v
            elif ($v | type) == "string" and ($v | test("^[0-9]+$")) then ($v | tonumber)
            else null end;
          # Base64 (protojson) id -> lower-case hex; hex ids pass through.
          def hexid($s):
            if $s == null or $s == "" then null
            elif ($s | test("^[0-9a-fA-F]+$")) and (($s | length) == 32 or ($s | length) == 16) then ($s | ascii_downcase)
            else
              ($s | gsub("[=\\s]"; "") | explode
               | map(if . >= 65 and . <= 90 then . - 65
                     elif . >= 97 and . <= 122 then . - 71
                     elif . >= 48 and . <= 57 then . + 4
                     elif . == 43 or . == 45 then 62
                     elif . == 47 or . == 95 then 63
                     else -1 end)) as $v
              | if any($v[]; . < 0) then $s
                else
                  [ $v[] | . as $x | (32, 16, 8, 4, 2, 1) as $p | ((($x / $p) | floor) % 2) ] as $bits
                  | [ range(0; (($bits | length) / 8 | floor)) as $i
                      | $bits[($i * 8):($i * 8 + 8)] | reduce .[] as $b (0; . * 2 + $b) ]
                  | map("0123456789abcdef"[((. / 16) | floor):((. / 16) | floor) + 1]
                        + "0123456789abcdef"[(. % 16):(. % 16) + 1])
                  | join("")
                end
            end;
          # OTLP status code: protojson enum name or OTLP/JSON integer.
          def scode($st):
            ($st.code // 0) as $c
            | if   $c == "STATUS_CODE_ERROR" or $c == 2 or $c == "2" then "ERROR"
              elif $c == "STATUS_CODE_OK" or $c == 1 or $c == "1" then "OK"
              else "UNSET" end;
          def model_of($a): ($a["gen_ai.response.model"] // $a["gen_ai.request.model"] // $a["mlflow.chat.model"] // $a["llm.model_name"]);
          def usage_of($a):
            (if ($a["mlflow.chat.tokenUsage"] | type) == "object" then $a["mlflow.chat.tokenUsage"] else {} end) as $u
            | { in:  num($a["gen_ai.usage.input_tokens"] // $a["gen_ai.usage.prompt_tokens"] // $u.input_tokens),
                out: num($a["gen_ai.usage.output_tokens"] // $a["gen_ai.usage.completion_tokens"] // $u.output_tokens),
                tot: num($a["gen_ai.usage.total_tokens"] // $u.total_tokens) };
          # OTLP nanosecond strings exceed float precision in some jq builds;
          # drop the sub-millisecond digits before converting.
          def ns_ms($v):
            if ($v | type) == "string" and ($v | test("^[0-9]{16,}$")) then to_epoch_ms($v[0:-6])
            else to_epoch_ms($v) end;
          def sum_or_null($xs): ($xs | map(select(. != null))) as $n | if ($n | length) == 0 then null else ($n | add) end;

          # Flatten every span with its resource/scope and decoded attributes.
          [ (.resourceSpans // [])[] as $rs
            | kv($rs.resource.attributes) as $res
            | ($rs.scopeSpans // [])[] as $ss
            | ($ss.spans // [])[]
            | { res: $res, resource: $rs.resource, scope: $ss.scope, span: .,
                a: (kv(.attributes) | map_values(pj(.))),
                start: ns_ms(.startTimeUnixNano), end: ns_ms(.endTimeUnixNano),
                status: scode(.status) } ] as $all
          | ($all | map(.span.spanId)) as $ids

          # One event per trace.
          | ($all | group_by(.span.traceId // "") | .[]) as $g
          | ($g | map(select((.span.parentSpanId // "") == ""))) as $roots
          | ($g | map(select((.span.parentSpanId // "") != ""
                             and (.span.parentSpanId as $p | any($ids[]; . == $p) | not)))
                | sort_by(.start // 0)) as $orphans
          | ($roots[0] // $orphans[0] // ($g | sort_by(.start // 0) | .[0])) as $root
          | (($roots | length) > 0) as $root_present
          | ($root.res) as $res
          | ($root.a) as $ra
          | hexid($root.span.traceId) as $tid

          # Timing over the whole trace.
          | ($g | map(.start) | map(select(. != null)) | min) as $t0
          | ($g | map(.end) | map(select(. != null)) | max) as $t1
          | (if $t0 != null and $t1 != null then $t1 - $t0 else null end) as $dur

          # Status: any error span fails the trace; otherwise the root's code.
          | ($g | map(select(.status == "ERROR"))) as $errs
          | ( if ($errs | length) > 0 then 2 elif $root.status == "OK" then 1 else 0 end ) as $sid
          | ( ($errs[0].span.status.message // $root.span.status.message) ) as $smsg

          # Model / provider from the root if it names one, else the first
          # LLM-typed span, else any span that names a model.
          | ( [ $g[] | select(model_of(.a) != null) ] ) as $mspans
          | ( if model_of($ra) != null then $root
              else ( [ $mspans[] | select(((.a["mlflow.spanType"] // "") | tostring | ascii_upcase) as $t
                                          | $t == "LLM" or $t == "CHAT_MODEL"
                                            or ((.a["gen_ai.operation.name"] // "") | test("^(chat|text_completion|generate_content)$"))) ][0]
                     // $mspans[0] ) end ) as $mspan
          | ( if $mspan != null then model_of($mspan.a) else null end ) as $model
          | ( if $mspan != null then ($mspan.a["gen_ai.provider.name"] // $mspan.a["gen_ai.system"]) else null end ) as $provider
          | ( [ $g[] | model_of(.a) | select(. != null) ] | unique ) as $models

          # Token usage: MLflow's trace aggregate when present, else the sum.
          | ( [ $g[] | .a["mlflow.trace.tokenUsage"] | select(type == "object") ][0] ) as $tu
          | ( [ $g[] | usage_of(.a) ] ) as $us
          | ( if $tu != null then num($tu.input_tokens) else sum_or_null($us | map(.in)) end ) as $in_tok
          | ( if $tu != null then num($tu.output_tokens) else sum_or_null($us | map(.out)) end ) as $out_tok
          | ( (if $tu != null then num($tu.total_tokens) else null end)
              // (if $in_tok != null or $out_tok != null then (($in_tok // 0) + ($out_tok // 0)) else null end)
              // sum_or_null($us | map(.tot)) ) as $total_tok

          # Identity: MLflow trace user/session, or OTel semantic attributes.
          | ( [ ($root, $g[]) | .a | (.["mlflow.trace.user"] // .["user.id"] // .["enduser.id"] // .["gen_ai.user.id"]) | select(. != null) ][0] ) as $user_id
          | ( [ ($root, $g[]) | .a | (.["mlflow.trace.session"] // .["session.id"] // .["gen_ai.conversation.id"]) | select(. != null) ][0] ) as $sess
          | ( $user_id == null ) as $no_identity

          | ($res["service.name"] // "mlflow") as $svc
          | ($root.span.name // $ra["gen_ai.operation.name"] // "mlflow.trace") as $op

          | {
              category_uid: 6,
              category_name: "Application Activity",
              class_uid: 6003,
              class_name: "API Activity",
              activity_id: 99,
              # 99/Other carries the source's own operation kind.
              activity_name: (($ra["gen_ai.operation.name"] // $mspan.a["gen_ai.operation.name"]
                               // $ra["mlflow.spanType"] // "trace") | tostring),
              type_uid: 600399,
              type_name: "API Activity: Other",
              # Identity guard: a trace with no user is kept but floored at Medium.
              severity_id: (if $sid == 2 or $no_identity then 3 else 1 end),
              status_id: $sid,
              status: ({ "0": "Unknown", "1": "Success", "2": "Failure" }[$sid | tostring]),
              status_code: $root.status,
              status_detail: $smsg,

              time: $t0,
              start_time: $t0,
              end_time: $t1,
              duration: $dur,

              actor: {
                application: { name: $svc, version: $res["service.version"], uid: $res["service.instance.id"] },
                user: (if $user_id != null then { name: ($user_id | tostring), uid: ($user_id | tostring) } else null end),
                session: (if $sess != null then { uid: ($sess | tostring) } else null end)
              },
              api: {
                operation: $op,
                service: { name: $svc },
                request: (if $ra["mlflow.traceRequestId"] != null then { uid: ($ra["mlflow.traceRequestId"] | tostring) } else null end)
              },
              src_endpoint: {
                svc_name: $svc,
                hostname: $res["host.name"],
                uid: $res["service.instance.id"]
              },
              trace: {
                uid: $tid,
                service: { name: $svc },
                start_time: $t0,
                end_time: $t1,
                duration: $dur,
                # The root span; for a partial trace, the earliest span whose
                # parent is not in this request (parent_uid then set).
                span: (if $root.span.spanId != null then
                  { uid: hexid($root.span.spanId),
                    parent_uid: hexid($root.span.parentSpanId),
                    operation: $root.span.name,
                    start_time: $root.start,
                    end_time: $root.end,
                    duration: (if $root.start != null and $root.end != null then $root.end - $root.start else null end),
                    status_code: $root.status,
                    message: $root.span.status.message }
                  else null end)
              },

              ai_model: (if $model != null then { name: ($model | tostring), ai_provider: (($provider // "unknown") | tostring) } else null end),
              message_context: (if ($in_tok != null or $out_tok != null or $model != null) then
                  { ai_role_id: 2, ai_role: "Assistant",
                    prompt_tokens: $in_tok, completion_tokens: $out_tok, total_tokens: $total_tok,
                    service: { name: $svc } }
                else null end),

              message: ( $op + " "
                         + ({ "0": "(status unset)", "1": "succeeded", "2": "failed" }[$sid | tostring])
                         + ": " + (($g | length) | tostring) + " span(s)"
                         + (if $model != null then ", model " + ($model | tostring) else "" end)
                         + (if $no_identity then "; no user identity on trace" else "" end) ),

              metadata: {
                version: "1.9.0",
                uid: $tid,
                correlation_uid: ($ra["mlflow.traceRequestId"] | if . == null then null else tostring end),
                log_name: "mlflow-genai-traces",
                product: { vendor_name: "MLflow", name: "MLflow Tracing" },
                labels: ( [ (if $no_identity then "identity.missing" else empty end),
                            (if $root_present then empty else "trace.partial" end) ] )
              },

              observables: (
                [ (if $tid != null then { name: "metadata.uid", type: "Trace ID", type_id: 99, value: $tid } else empty end) ]
                + (if $user_id != null then [ { name: "actor.user.name", type: "User Name", type_id: 4, value: ($user_id | tostring) } ] else [] end)
                + (if $res["host.name"] != null then [ { name: "src_endpoint.hostname", type: "Hostname", type_id: 1, value: $res["host.name"] } ] else [] end) ),

              # No OCSF home: MLflow experiment/run ids, span counts, all models.
              unmapped: {
                span_count: ($g | length),
                error_span_count: ($errs | length),
                root_span_present: $root_present,
                models: (if ($models | length) > 1 then $models else null end),
                span_type: $ra["mlflow.spanType"],
                experiment_id: ([ $g[] | .a["mlflow.experimentId"] | select(. != null) ][0]),
                run_id: ([ $g[] | .a["mlflow.runId"] | select(. != null) ][0]),
                scope: $root.scope
              },
              # This trace's spans only (a request may carry several traces).
              raw_data: ({ resource: $root.resource, scope: $root.scope, spans: [ $g[] | .span ] } | tostring)
            }
          # Declare the profiles whose objects this event carries.
          | .metadata.profiles = ( ["trace"]
              + (if (.ai_model != null) or (.message_context != null) then ["ai_operation"] else [] end) )
          # Recursive prune: drop null / "" / empty-array / empty-object leaves.
          | walk(if type == "object"
                 then with_entries(select((.value != null) and (.value != "") and (.value != []) and (.value != {})))
                 else . end)
