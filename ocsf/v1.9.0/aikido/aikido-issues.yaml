name: "Aikido Issues to OCSF v1.9.0"
description: "Transforms Aikido Security issue export records into the OCSF v1.9.0 Vulnerability Finding (2002) class."
author: "Monad"
contributors:
  - "https://github.com/behobu"
inputs:
  - "aikido-issues"
tags:
  - "v1.9.0"
  - "ocsf"
  - "aikido"
  - "vulnerability"
config:
  operations:
    - operation: "jq"
      arguments:
        key: ""
        query: |
          def to_epoch_ms($ts):
            def _num_ms($n):
              if   $n >= 1e17 then ($n / 1000000 | floor)
              elif $n >= 1e14 then ($n / 1000 | floor)
              elif $n >= 1e11 then ($n | floor)
              else ($n * 1000 | floor) end;
            if $ts == null or $ts == "" then null
            elif ($ts | type) == "number" then _num_ms($ts)
            elif ($ts | type) == "object" then
              (if ($ts.seconds // null) == null then null
               else ($ts.seconds * 1000 + ((($ts.nanos // 0) / 1000000) | floor)) end)
            elif ($ts | type) == "string" then
              if ($ts | test("^-?[0-9]+(\\.[0-9]+)?$")) then _num_ms($ts | tonumber)
              else
                ([$ts | ascii_upcase | capture("^(?<d>[0-9]{4}-[0-9]{2}-[0-9]{2})(?:[T ](?<t>[0-9]{2}:[0-9]{2}(?::[0-9]{2})?)(?:[.,](?<f>[0-9]+))?)? ?(?<z>Z|UTC|[+-][0-9]{2}(?::?[0-9]{2})?)?$")] | first) as $m
                | if $m == null then null
                  else
                    (($m.t // "00:00:00") | if length == 5 then . + ":00" else . end) as $t
                    | (($m.z // "Z") | if . == "Z" or . == "UTC" then 0
                        else (.[1:] | gsub(":"; "")) as $o
                          | ((if (.[0:1]) == "-" then -1 else 1 end)
                             * (($o[0:2] | tonumber) * 3600 + ((if ($o | length) >= 4 then $o[2:4] else "00" end) | tonumber) * 60))
                        end) as $off
                    | ((($m.d + "T" + $t + "Z") | fromdateiso8601) - $off) * 1000
                      + (((($m.f // "") + "000")[0:3]) | tonumber)
                  end
              end
            else null end;

          . as $r
          | ($r.severity // "" | ascii_downcase) as $sev
          | ($r.status // "" | ascii_downcase) as $st
          | {
              "class_uid": 2002,
              "category_uid": 2,
              "activity_id": 1,
              "type_uid": 200201,
              "time": (to_epoch_ms($r.first_detected_at) // 0),
              "severity_id": (
                { "critical": 5, "high": 4, "medium": 3, "low": 2 }[$sev] // 0
              ),
              "status_id": (
                { "open": 1, "snoozed": 2, "ignored": 3, "closed": 4 }[$st] // 0
              ),
              "message": ($r.rule // null),
              "finding_info": {
                "uid": ($r.id | tostring),
                "title": ($r.rule // "Aikido issue"),
                "desc": ($r.rule // null),
                "types": [ $r.type ] | map(select(. != null)),
                "created_time": to_epoch_ms($r.first_detected_at),
                "first_seen_time": to_epoch_ms($r.first_detected_at),
                "src_url": (
                  if $r.group_id != null
                  then "https://app.aikido.dev/feature/issues/" + ($r.group_id | tostring)
                  else null end
                ),
                "product": {
                  "name": "Aikido Security",
                  "vendor_name": "Aikido"
                }
              },
              "vulnerabilities": [
                {
                  "title": ($r.rule // null),
                  "desc": ($r.rule // null),
                  "severity": ($r.severity // null),
                  "is_exploit_available": ($r.exploitability != null and $r.exploitability != "no_known_exploit"),
                  "is_fix_available": (($r.patched_versions // []) | length > 0),
                  "first_seen_time": to_epoch_ms($r.first_detected_at),
                  "remediation": (
                    if ($r.patched_versions // []) | length > 0
                    then { "desc": ("Upgrade to a patched version: " + (($r.patched_versions // []) | join(", "))) }
                    else null end
                  ),
                  "cve": (
                    if $r.cve_id != null
                    then {
                      "uid": $r.cve_id,
                      "cvss": (
                        if $r.original_cvss_severity_score != null
                        then [ { "version": "3.1", "base_score": (($r.original_cvss_severity_score / 10)) } ]
                        else null end
                      )
                    }
                    else null end
                  ),
                  "cwe": (
                    if $r.cve_id == null and (($r.cwe_classes // []) | length > 0)
                    then { "uid": ($r.cwe_classes[0]) }
                    else null end
                  ),
                  "affected_code": (
                    if $r.affected_file != null
                    then [ {
                      "file": { "path": $r.affected_file, "name": ($r.affected_file | split("/") | last), "type_id": 1 },
                      "start_line": ($r.start_line // null),
                      "end_line": ($r.end_line // null)
                    } ]
                    else null end
                  ),
                  "affected_packages": (
                    if $r.affected_package != null
                    then [ {
                      "name": $r.affected_package,
                      "version": ($r.installed_version // "unknown"),
                      "fixed_in_version": (($r.patched_versions // []) | first),
                      "package_manager": ($r.programming_language // null)
                    } | with_entries(select(.value != null)) ]
                    else null end
                  )
                } | with_entries(select(.value != null))
              ],
              "osint": [],
              "cloud": {
                "provider": ($r.cloud_name // "N/A")
              },
              "resource": (
                if $r.code_repo_name != null then { "name": $r.code_repo_name, "type": "code_repository" }
                elif $r.container_repo_name != null then { "name": $r.container_repo_name, "type": "container_image" }
                elif $r.cloud_name != null then { "name": $r.cloud_name, "type": "cloud_account" }
                elif $r.domain_name != null then { "name": $r.domain_name, "type": "domain" }
                else null end
              ),
              "metadata": {
                "profiles": ["cloud", "osint"],
                "product": {
                  "name": "Aikido Security",
                  "vendor_name": "Aikido"
                },
                "version": "1.9.0"
              },
              "raw_data": ($r | tostring)
            }
          | with_entries(select(.value != null))
