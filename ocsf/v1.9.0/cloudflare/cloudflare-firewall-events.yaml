name: "Cloudflare Firewall Events to OCSF v1.9.0"
description: "Transforms Cloudflare firewall_events (WAF / firewall rule matches) records into the OCSF v1.9.0 HTTP Activity (4002) class."
author: "Monad"
contributors:
  - "https://github.com/behobu"
inputs:
  - "cloudflare-firewall-events"
tags:
  - "v1.9.0"
  - "ocsf"
  - "cloudflare"
  - "network"
config:
  operations:
    - operation: "jq"
      arguments:
        key: ""
        query: |
          # ---------------------------------------------------------------
          # OCSF HTTP Activity (class_uid=4002, category_uid=4) — v1.9.0
          # Input: one Cloudflare firewall_events record per invocation.
          # ---------------------------------------------------------------
          def to_epoch_ms($ts):
            def _n: if . == null then null else tonumber end;
            def _num_ms($n):
              if   $n >= 1e17 then ($n / 1000000 | floor)
              elif $n >= 1e14 then ($n / 1000 | floor)
              elif $n >= 1e11 then ($n | floor)
              else ($n * 1000 + 0.001 | floor) end;
            def _digits_ms($d):
              ($d | ltrimstr("-") | length) as $l
              | if   $l >= 18 then ($d[0:-6] | tonumber)
                elif $l >= 15 then ($d[0:-3] | tonumber)
                elif $l >= 12 then ($d | tonumber)
                else ($d | tonumber) * 1000 end;
            def _frac_ms($f): if $f == null then 0 else (($f + "000")[0:3] | tonumber) end;
            def _mon($m):
              if $m == null then null
              else {"JAN":1,"FEB":2,"MAR":3,"APR":4,"MAY":5,"JUN":6,
                    "JUL":7,"AUG":8,"SEP":9,"OCT":10,"NOV":11,"DEC":12}[$m[0:3]] end;
            def _zone($z):
              if $z == null or $z == "" then 0
              else
                ($z | if test("^(UTC|GMT|UT)[+-]") then sub("^(UTC|GMT|UT)"; "") else . end) as $z
                | if ($z | test("^[+-][0-9]{1,2}(:?[0-9]{2})?$")) then
                    ($z | capture("^(?<sg>[+-])(?<h>[0-9]{1,2}):?(?<m>[0-9]{2})?$")) as $o
                    | (if $o.sg == "-" then -1 else 1 end)
                      * (($o.h | tonumber) * 3600 + (($o.m // "0") | tonumber) * 60)
                  else
                    {"Z":0,"UTC":0,"GMT":0,"UT":0,"EST":-18000,"EDT":-14400,"CST":-21600,
                     "CDT":-18000,"MST":-25200,"MDT":-21600,"PST":-28800,"PDT":-25200}[$z]
                  end
              end;
            def _ms($c):
              ($c.y | tonumber | if . < 100 then (if . < 70 then . + 2000 else . + 1900 end) else . end) as $y
              | ($c.mo | _n) as $mo
              | ($c.d | tonumber) as $d
              | (($c.h // "0") | tonumber) as $h
              | (($c.mi // "0") | tonumber) as $mi
              | (($c.s // "0") | tonumber) as $s
              | _zone($c.z) as $off
              | if $mo == null or $off == null or $mo < 1 or $mo > 12 or $d < 1 or $d > 31
                   or $h > 23 or $mi > 59 or $s > 60 then null
                else
                  ($y - (if $mo <= 2 then 1 else 0 end)) as $yy
                  | ($yy / 400 | floor) as $era
                  | ($yy - $era * 400) as $yoe
                  | (((153 * ($mo + (if $mo > 2 then -3 else 9 end)) + 2) / 5 | floor) + $d - 1) as $doy
                  | ($yoe * 365 + ($yoe / 4 | floor) - ($yoe / 100 | floor) + $doy) as $doe
                  | ($era * 146097 + $doe - 719468) as $days
                  | ($days * 86400 + $h * 3600 + $mi * 60 + $s - $off) * 1000 + _frac_ms($c.f)
                end;
            def _str($raw):
              ($raw | ascii_upcase | sub("\\s*\\([^)]*\\)\\s*$"; "") | sub("^\\s+"; "") | sub("\\s+$"; "")) as $s
              | "(?<z>Z|(?:UTC|GMT|UT)?[+-][0-9]{1,2}(?::?[0-9]{2})?|[A-Z]{1,5})" as $Z
              | "(?<h>[0-9]{1,2}):(?<mi>[0-9]{2})(?::(?<s>[0-9]{2}))?(?:[.,](?<f>[0-9]+))?" as $T
              | if $s == "" then null
                elif ($s | test("^-?[0-9]+$")) then _digits_ms($s)
                elif ($s | test("^[0-9]+\\.[0-9]+$")) then
                  ($s | split(".")) as $p
                  | if ($p[0] | length) <= 11 then _digits_ms($p[0]) + _frac_ms($p[1])
                    else _digits_ms($p[0]) end
                elif ($s | test("^/DATE\\(-?[0-9]+([+-][0-9]{4})?\\)/$")) then
                  ($s | capture("(?<ms>-?[0-9]+)").ms | tonumber)
                else
                  first(
                    ($s | capture("^(?<y>[0-9]{4})[-/](?<mo>[0-9]{1,2})[-/](?<d>[0-9]{1,2})(?:[T ]+" + $T + ")?\\s*" + $Z + "?(?:\\s+[A-Z]{2,5})?$") | _ms(.)),
                    ($s | capture("^(?<y>[0-9]{4})(?<mo>[0-9]{2})(?<d>[0-9]{2})T(?<h>[0-9]{2})(?<mi>[0-9]{2})(?<s>[0-9]{2})(?:[.,](?<f>[0-9]+))?" + $Z + "?$") | _ms(.)),
                    ($s | capture("^(?:[A-Z]+,?\\s+)?(?<d>[0-9]{1,2})[ -](?<mon>[A-Z]{3,9})[ -](?<y>[0-9]{2,4})\\s+" + $T + "\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?:[A-Z]+,?\\s+)?(?<mon>[A-Z]{3,9})\\.?\\s+(?<d>[0-9]{1,2}),?\\s+(?<y>[0-9]{4})(?:,?\\s+" + $T + ")?\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?:[A-Z]+\\s+)?(?<mon>[A-Z]{3,9})\\s+(?<d>[0-9]{1,2})\\s+" + $T + "\\s+(?:" + $Z + "\\s+)?(?<y>[0-9]{4})$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?<d>[0-9]{1,2})/(?<mon>[A-Z]{3})/(?<y>[0-9]{4}):" + $T + "\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.))
                  ) // null
                end;
            if $ts == null then null
            elif ($ts | type) == "number" then _num_ms($ts)
            elif ($ts | type) == "string" then _str($ts)
            elif ($ts | type) == "object" then
              if   $ts["$date"] != null then to_epoch_ms($ts["$date"])
              elif $ts["$numberLong"] != null then to_epoch_ms($ts["$numberLong"])
              elif $ts.seconds != null then
                ($ts.seconds | tostring | tonumber) * 1000
                + ((($ts.nanos // 0) | tostring | tonumber) / 1000000 | floor)
              else null end
            else null end;

          . as $r

          # Datetime is ISO-8601 or epoch (seconds/ms). OCSF time = epoch milliseconds.
          | to_epoch_ms($r.Datetime) as $t

          # HTTP method -> activity_id
          | ( { "CONNECT":1,"DELETE":2,"GET":3,"HEAD":4,"OPTIONS":5,
                "POST":6,"PUT":7,"TRACE":8,"PATCH":9 }[($r.ClientRequestMethod // "" | ascii_upcase)] // 99 ) as $act

          # Cloudflare Action -> OCSF disposition_id
          | ( { "allow":1,"bypass":1,"skip":1,"block":2,"drop":6,
                "connectionclose":21,"jschallenge":22,"managedchallenge":23,
                "challenge":23,"log":17 }[($r.Action // "" | ascii_downcase)] // 99 ) as $disp

          # disposition -> action_id (allowed / denied / other)
          | ( if $disp == 1 then 1
              elif ($disp == 2 or $disp == 6) then 2
              else 99 end ) as $action_id

          # Action -> severity_id
          | ( { "block":4,"drop":4,"connectionclose":4,
                "challenge":3,"managedchallenge":3,"jschallenge":3,
                "log":1,"allow":1,"bypass":1,"skip":1 }[($r.Action // "" | ascii_downcase)] // 2 ) as $sev

          | {
              "category_uid": 4,
              "class_uid":    4002,
              "type_uid":     (4002 * 100 + $act),
              "activity_id":  $act,
              "severity_id":  $sev,
              "disposition_id": $disp,
              "action_id":    $action_id,
              "is_alert":     ($disp == 2 or $disp == 6),

              "time": $t,

              "metadata": {
                "version": "1.9.0",
                "product": {
                  "vendor_name": "Cloudflare",
                  "name": "Cloudflare WAF"
                },
                "uid": $r.RayID,
                "log_provider": "Cloudflare Logpush",
                "profiles": ["cloud", "osint", "security_control"]
              },

              "cloud": {
                "provider": "Cloudflare"
              },

              "osint": [],

              "message": $r.Description,
              "status_code": ($r.EdgeResponseStatus // null | if . == null then null else tostring end),

              "src_endpoint": {
                "ip": $r.ClientIP,
                "location": (if ($r.ClientCountry // "") != "" then { "country": ($r.ClientCountry | ascii_upcase) } else null end),
                "autonomous_system": (if ($r.ClientASN // null) != null then { "number": $r.ClientASN, "name": $r.ClientASNDescription } else null end)
              },

              "dst_endpoint": {
                "domain": $r.ClientRequestHost,
                "svc_name": $r.EdgeColoCode
              },

              "http_request": {
                "http_method": $r.ClientRequestMethod,
                "user_agent": $r.ClientRequestUserAgent,
                "version": $r.ClientRequestProtocol,
                "referrer": (if ($r.ClientRefererHost // "") != ""
                             then (($r.ClientRefererScheme // "https") + "://" + $r.ClientRefererHost + ($r.ClientRefererPath // "")) else null end),
                "url": {
                  "scheme": $r.ClientRequestScheme,
                  "hostname": $r.ClientRequestHost,
                  "path": $r.ClientRequestPath,
                  "query_string": (if ($r.ClientRequestQuery // "") != "" then ($r.ClientRequestQuery | ltrimstr("?")) else null end)
                }
              },

              "http_response": {
                "code": ($r.EdgeResponseStatus // 0)
              },

              "observables": (
                [ (if ($r.ClientIP // "") != "" then { "name": "src_endpoint.ip", "type_id": 2, "value": $r.ClientIP } else empty end),
                  (if ($r.ClientRequestHost // "") != "" then { "name": "http_request.url.hostname", "type_id": 1, "value": $r.ClientRequestHost } else empty end),
                  (if ($r.RayID // "") != "" then { "name": "metadata.uid", "type_id": 10, "value": $r.RayID } else empty end)
                ] ),

              "unmapped": {
                "RuleID": $r.RuleID,
                "Ref": $r.Ref,
                "Kind": $r.Kind,
                "Source": $r.Source,
                "ClientIPClass": $r.ClientIPClass,
                "MatchIndex": $r.MatchIndex,
                "OriginResponseStatus": $r.OriginResponseStatus,
                "OriginatorRayID": (if ($r.OriginatorRayID // "00") != "00" then $r.OriginatorRayID else null end),
                "ZoneName": $r.ZoneName,
                "LeakedCredentialCheckResult": $r.LeakedCredentialCheckResult,
                "cf_metadata": $r.Metadata
              },

              "raw_data": ($r | tostring)
            }

          # Prune nulls / empty objects / empty arrays (single recursive pass).
          | walk( if type == "object" then with_entries(select(.value != null and .value != "" and .value != {} and .value != []))
                  elif type == "array" then map(select(. != null and . != {} and . != []))
                  else . end )

          # osint is a required attribute of HTTP Activity; guarantee its
          # presence even though the prune pass drops empty arrays elsewhere.
          | .osint = (.osint // [])
