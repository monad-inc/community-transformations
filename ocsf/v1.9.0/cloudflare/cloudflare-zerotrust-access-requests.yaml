name: "Cloudflare Zero Trust Access Requests to OCSF v1.9.0"
description: "Transforms Cloudflare Zero Trust Access authentication (access_requests) logs into the OCSF v1.9.0 Authentication (3002) class."
author: "Monad"
contributors:
  - "https://github.com/behobu"
inputs:
  - "cloudflare-zerotrust-access-requests"
tags:
  - "v1.9.0"
  - "ocsf"
  - "cloudflare"
  - "iam"
config:
  operations:
    - operation: "jq"
      arguments:
        key: ""
        query: |
          # ---------------------------------------------------------------
          # OCSF Authentication (class_uid=3002, category_uid=3) — v1.9.0
          # Input: one Cloudflare Zero Trust Access access_requests record.
          # ---------------------------------------------------------------
          def to_epoch_ms($ts):
            def _num_ms($n):
              if   $n >= 1e17 then ($n / 1000000 | floor)
              elif $n >= 1e14 then ($n / 1000 | floor)
              elif $n >= 1e11 then ($n | floor)
              else ($n * 1000 | floor) end;
            if $ts == null or $ts == "" then null
            elif ($ts | type) == "number" then _num_ms($ts)
            elif ($ts | type) == "object" then
              (if ($ts.seconds // null) == null then null
               else ($ts.seconds * 1000 + ((($ts.nanos // 0) / 1000000) | floor)) end)
            elif ($ts | type) == "string" then
              if ($ts | test("^-?[0-9]+(\\.[0-9]+)?$")) then _num_ms($ts | tonumber)
              else
                ([$ts | ascii_upcase | capture("^(?<d>[0-9]{4}-[0-9]{2}-[0-9]{2})(?:[T ](?<t>[0-9]{2}:[0-9]{2}(?::[0-9]{2})?)(?:[.,](?<f>[0-9]+))?)? ?(?<z>Z|UTC|[+-][0-9]{2}(?::?[0-9]{2})?)?$")] | first) as $m
                | if $m == null then null
                  else
                    (($m.t // "00:00:00") | if length == 5 then . + ":00" else . end) as $t
                    | (($m.z // "Z") | if . == "Z" or . == "UTC" then 0
                        else (.[1:] | gsub(":"; "")) as $o
                          | ((if (.[0:1]) == "-" then -1 else 1 end)
                             * (($o[0:2] | tonumber) * 3600 + ((if ($o | length) >= 4 then $o[2:4] else "00" end) | tonumber) * 60))
                        end) as $off
                    | ((($m.d + "T" + $t + "Z") | fromdateiso8601) - $off) * 1000
                      + (((($m.f // "") + "000")[0:3]) | tonumber)
                  end
              end
            else null end;

                    def is_ip($s):
                      def _v4: test("^((25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\\.){3}(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])$");
                      def _v6:
                        if test("^[0-9A-Fa-f:.]+$") | not then false
                        else
                          (if test("\\.")
                           then (split(":") | last) as $t
                             | if ($t | _v4) then .[0:length - ($t | length)] + "0:0" else "x" end
                           else . end) as $h
                          | ($h | split("::")) as $p
                          | if ($p | length) > 2 then false
                            else ([$p[] | if . == "" then empty else split(":")[] end]) as $g
                              | ($g | all(test("^[0-9A-Fa-f]{1,4}$")))
                                and (if ($p | length) == 2 then ($g | length) <= 7 else ($g | length) == 8 end)
                            end
                        end;
                      ($s | type) == "string" and ($s | _v4 or _v6);

          . as $r
          | (($r.action // "") | ascii_downcase) as $act
          | (if ($act | startswith("logout") or startswith("logoff")) then 2
             elif ($act | startswith("login") or startswith("logon")) then 1
             else 99 end) as $activity_id
          | (if $r.allowed == true then 1
             elif $r.allowed == false then 2
             else 0 end) as $status_id
          | {
              "category_uid": 3,
              "class_uid":    3002,
              "type_uid":     (3002 * 100 + $activity_id),
              "activity_id":  $activity_id,
              "severity_id":  1,
              "status_id":    $status_id,

              "time": to_epoch_ms($r.created_at),

              "metadata": {
                "profiles": ["cloud", "osint"],
                "version": "1.9.0",
                "uid": $r.ray_id,
                "product": {
                  "vendor_name": "Cloudflare",
                  "name": "Cloudflare Zero Trust Access"
                }
              },

              "user": {
                "type_id": 1,
                "name": $r.user_email,
                "email_addr": $r.user_email
              },

              "cloud": {
                "provider": "Cloudflare"
              },

              "osint": [],

              "auth_protocol": $r.connection,

              "src_endpoint": (
                if is_ip($r.ip_address)
                then { "ip": $r.ip_address }
                else null end
              ),

              "dst_endpoint": (
                if ($r.app_domain // "") != ""
                then { "domain": $r.app_domain }
                else null end
              ),

              "message": (
                ($r.user_email // "unknown") + " "
                + (if $status_id == 1 then "allowed" elif $status_id == 2 then "denied" else "attempted" end)
                + " access to " + ($r.app_domain // "application")
              ),

              "unmapped": (
                { "app_uid": $r.app_uid, "connection": $r.connection }
                | with_entries(select(.value != null and .value != ""))
              ),

              "raw_data": ($r | tostring)
            }
          # Drop only optional keys that came out null; required keys
          # (including osint: []) are always emitted above.
          | with_entries(select(.value != null))
