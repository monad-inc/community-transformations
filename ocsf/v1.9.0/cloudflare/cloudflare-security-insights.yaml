name: "Cloudflare Security Insights to OCSF v1.9.0"
description: "Transforms Cloudflare Security Center Insights (security posture / misconfiguration findings) records into the OCSF v1.9.0 Compliance Finding class."
author: "Monad"
contributors:
  - "https://github.com/behobu"
inputs:
  - "cloudflare-security-insights"
tags:
  - "v1.9.0"
  - "ocsf"
  - "cloudflare"
  - "findings"
config:
  operations:
    - operation: "jq"
      arguments:
        key: ""
        query: |
          # ---------------------------------------------------------------
          # OCSF Compliance Finding (class_uid=2003) — v1.9.0
          # Input: one Cloudflare Security Center Insight record per
          # invocation, as emitted by the `cloudflare-security-insights`
          # input connector (the Security Center Insights list endpoint's
          # issue/insight instance object).
          #
          # A Security Center Insight is a security-posture evaluation of a
          # zone/resource (insecure configuration, weak authentication,
          # exposed infrastructure, compliance violation, ...), which maps
          # onto the OCSF Compliance Finding class.
          # ---------------------------------------------------------------


          # Recursively drop nulls / empty objects / empty arrays so the
          # emitted event stays compact. Required objects always retain at
          # least one populated child, so they survive the prune.
          def to_epoch_ms($ts):
            def _n: if . == null then null else tonumber end;
            def _num_ms($n):
              if   $n >= 1e17 then ($n / 1000000 | floor)
              elif $n >= 1e14 then ($n / 1000 | floor)
              elif $n >= 1e11 then ($n | floor)
              else ($n * 1000 + 0.001 | floor) end;
            def _digits_ms($d):
              ($d | ltrimstr("-") | length) as $l
              | if   $l >= 18 then ($d[0:-6] | tonumber)
                elif $l >= 15 then ($d[0:-3] | tonumber)
                elif $l >= 12 then ($d | tonumber)
                else ($d | tonumber) * 1000 end;
            def _frac_ms($f): if $f == null then 0 else (($f + "000")[0:3] | tonumber) end;
            def _mon($m):
              if $m == null then null
              else {"JAN":1,"FEB":2,"MAR":3,"APR":4,"MAY":5,"JUN":6,
                    "JUL":7,"AUG":8,"SEP":9,"OCT":10,"NOV":11,"DEC":12}[$m[0:3]] end;
            def _zone($z):
              if $z == null or $z == "" then 0
              else
                ($z | if test("^(UTC|GMT|UT)[+-]") then sub("^(UTC|GMT|UT)"; "") else . end) as $z
                | if ($z | test("^[+-][0-9]{1,2}(:?[0-9]{2})?$")) then
                    ($z | capture("^(?<sg>[+-])(?<h>[0-9]{1,2}):?(?<m>[0-9]{2})?$")) as $o
                    | (if $o.sg == "-" then -1 else 1 end)
                      * (($o.h | tonumber) * 3600 + (($o.m // "0") | tonumber) * 60)
                  else
                    {"Z":0,"UTC":0,"GMT":0,"UT":0,"EST":-18000,"EDT":-14400,"CST":-21600,
                     "CDT":-18000,"MST":-25200,"MDT":-21600,"PST":-28800,"PDT":-25200}[$z]
                  end
              end;
            def _ms($c):
              ($c.y | tonumber | if . < 100 then (if . < 70 then . + 2000 else . + 1900 end) else . end) as $y
              | ($c.mo | _n) as $mo
              | ($c.d | tonumber) as $d
              | (($c.h // "0") | tonumber) as $h
              | (($c.mi // "0") | tonumber) as $mi
              | (($c.s // "0") | tonumber) as $s
              | _zone($c.z) as $off
              | if $mo == null or $off == null or $mo < 1 or $mo > 12 or $d < 1 or $d > 31
                   or $h > 23 or $mi > 59 or $s > 60 then null
                else
                  ($y - (if $mo <= 2 then 1 else 0 end)) as $yy
                  | ($yy / 400 | floor) as $era
                  | ($yy - $era * 400) as $yoe
                  | (((153 * ($mo + (if $mo > 2 then -3 else 9 end)) + 2) / 5 | floor) + $d - 1) as $doy
                  | ($yoe * 365 + ($yoe / 4 | floor) - ($yoe / 100 | floor) + $doy) as $doe
                  | ($era * 146097 + $doe - 719468) as $days
                  | ($days * 86400 + $h * 3600 + $mi * 60 + $s - $off) * 1000 + _frac_ms($c.f)
                end;
            def _str($raw):
              ($raw | ascii_upcase | sub("\\s*\\([^)]*\\)\\s*$"; "") | sub("^\\s+"; "") | sub("\\s+$"; "")) as $s
              | "(?<z>Z|(?:UTC|GMT|UT)?[+-][0-9]{1,2}(?::?[0-9]{2})?|[A-Z]{1,5})" as $Z
              | "(?<h>[0-9]{1,2}):(?<mi>[0-9]{2})(?::(?<s>[0-9]{2}))?(?:[.,](?<f>[0-9]+))?" as $T
              | if $s == "" then null
                elif ($s | test("^-?[0-9]+$")) then _digits_ms($s)
                elif ($s | test("^[0-9]+\\.[0-9]+$")) then
                  ($s | split(".")) as $p
                  | if ($p[0] | length) <= 11 then _digits_ms($p[0]) + _frac_ms($p[1])
                    else _digits_ms($p[0]) end
                elif ($s | test("^/DATE\\(-?[0-9]+([+-][0-9]{4})?\\)/$")) then
                  ($s | capture("(?<ms>-?[0-9]+)").ms | tonumber)
                else
                  first(
                    ($s | capture("^(?<y>[0-9]{4})[-/](?<mo>[0-9]{1,2})[-/](?<d>[0-9]{1,2})(?:[T ]+" + $T + ")?\\s*" + $Z + "?(?:\\s+[A-Z]{2,5})?$") | _ms(.)),
                    ($s | capture("^(?<y>[0-9]{4})(?<mo>[0-9]{2})(?<d>[0-9]{2})T(?<h>[0-9]{2})(?<mi>[0-9]{2})(?<s>[0-9]{2})(?:[.,](?<f>[0-9]+))?" + $Z + "?$") | _ms(.)),
                    ($s | capture("^(?:[A-Z]+,?\\s+)?(?<d>[0-9]{1,2})[ -](?<mon>[A-Z]{3,9})[ -](?<y>[0-9]{2,4})\\s+" + $T + "\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?:[A-Z]+,?\\s+)?(?<mon>[A-Z]{3,9})\\.?\\s+(?<d>[0-9]{1,2}),?\\s+(?<y>[0-9]{4})(?:,?\\s+" + $T + ")?\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?:[A-Z]+\\s+)?(?<mon>[A-Z]{3,9})\\s+(?<d>[0-9]{1,2})\\s+" + $T + "\\s+(?:" + $Z + "\\s+)?(?<y>[0-9]{4})$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?<d>[0-9]{1,2})/(?<mon>[A-Z]{3})/(?<y>[0-9]{4}):" + $T + "\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.))
                  ) // null
                end;
            if $ts == null then null
            elif ($ts | type) == "number" then _num_ms($ts)
            elif ($ts | type) == "string" then _str($ts)
            elif ($ts | type) == "object" then
              if   $ts["$date"] != null then to_epoch_ms($ts["$date"])
              elif $ts["$numberLong"] != null then to_epoch_ms($ts["$numberLong"])
              elif $ts.seconds != null then
                ($ts.seconds | tostring | tonumber) * 1000
                + ((($ts.nanos // 0) | tostring | tonumber) / 1000000 | floor)
              else null end
            else null end;

          def prune:
            walk(if type == "object" then with_entries(select(.value != null and .value != {} and .value != []))
                 elif type == "array" then map(select(. != null and . != {} and . != []))
                 else . end);

          . as $r
          | ( $r.payload ) as $p
          # Cloudflare severities: Low / Moderate / Critical.
          | ( { "Low": 2, "Moderate": 3, "Critical": 5 }[$r.severity] // 0 ) as $sev
          # A newly-surfaced insight is a Create; a resolved or dismissed
          # one is a Close.
          | ( if ($r.dismissed == true) or ($r.status == "resolved")
              then 3 else 1 end ) as $act
          | {
              # --- Classification (REQUIRED) ---
              category_uid: 2,
              class_uid:    2003,
              type_uid:     (2003 * 100 + $act),
              activity_id:  $act,
              severity_id:  $sev,

              # --- Time (REQUIRED) ---
              time: to_epoch_ms($r.timestamp),

              # --- Metadata (REQUIRED). The cloud + osint objects below are
              #     OCSF profile attributes, so the profiles MUST be declared
              #     here or the event fails validation with "attribute_unknown". ---
              metadata: {
                version: "1.9.0",
                product: {
                  vendor_name: "Cloudflare",
                  name: "Cloudflare Security Center"
                },
                profiles: ["cloud", "osint"],
                uid: $r.id
              },

              # --- Finding information (REQUIRED: uid) ---
              finding_info: {
                uid:             $r.id,
                title:           ($r.resolve_text // $r.issue_type),
                desc:            $r.issue_type,
                types:           ( if $r.issue_type != null then [ $r.issue_type ] else null end ),
                src_url:         $r.resolve_link,
                first_seen_time: to_epoch_ms($r.since),
                modified_time:   to_epoch_ms($r.timestamp)
              },

              # --- Compliance (REQUIRED) ---
              compliance: {
                control:    $r.issue_type,
                standards:  ( if $r.issue_class != null then [ $r.issue_class ] else null end ),
                status:     ( if $r.status == "resolved" then "Pass" else "Fail" end ),
                status_id:  ( if $r.status == "resolved" then 1 else 3 end )
              },

              # --- OSINT (REQUIRED for this class): the affected subject
              #     is a domain / FQDN (osint type_id 2 = Domain). ---
              osint: ( if $r.subject != null
                then [ { value: $r.subject, type_id: 2 } ]
                else [ { value: ($r.id // "unknown"), type_id: 0 } ] end ),

              # --- Cloud (REQUIRED for this class) ---
              cloud: {
                provider: "Cloudflare",
                zone: ( if ($p | type) == "object" then $p.zone_tag else null end )
              },

              # --- Affected resource ---
              resources: ( if $r.subject != null
                then [ { name: $r.subject, type: "Cloudflare Zone" } ]
                else null end ),

              status: $r.status,
              message: ($r.resolve_text // $r.issue_type),

              # --- Fields with no clean OCSF home ---
              unmapped: {
                severity:             $r.severity,
                dismissed:            $r.dismissed,
                user_classification:  $r.user_classification,
                has_extended_context: $r.has_extended_context,
                detection_method:     ( if ($p | type) == "object" then $p.detection_method else null end )
              },

              raw_data: ($r | tostring)
            }
          | prune
