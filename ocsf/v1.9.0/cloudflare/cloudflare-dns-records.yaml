name: "Cloudflare DNS Records to OCSF v1.9.0"
description: "Transforms Cloudflare DNS Records inventory into the OCSF v1.9.0 Cloud Resources Inventory Info (class_uid 5023) class."
author: "Monad"
contributors:
  - "https://github.com/behobu"
inputs:
  - "cloudflare-dns-records"
tags:
  - "v1.9.0"
  - "ocsf"
  - "cloudflare"
  - "discovery"
config:
  operations:
    - operation: "jq"
      arguments:
        key: ""
        query: |
          # ---------------------------------------------------------------
          # OCSF Cloud Resources Inventory Info (class_uid=5023) — v1.9.0
          # Input: one Cloudflare DNS record per invocation (List DNS Records).
          # A DNS record is a cloud-hosted configuration resource, collected
          # from the Cloudflare API -> activity_id 2 (Collect).
          # ---------------------------------------------------------------
          def to_epoch_ms($ts):
            def _num_ms($n):
              if   $n >= 1e17 then ($n / 1000000 | floor)
              elif $n >= 1e14 then ($n / 1000 | floor)
              elif $n >= 1e11 then ($n | floor)
              else ($n * 1000 | floor) end;
            if $ts == null or $ts == "" then null
            elif ($ts | type) == "number" then _num_ms($ts)
            elif ($ts | type) == "object" then
              (if ($ts.seconds // null) == null then null
               else ($ts.seconds * 1000 + ((($ts.nanos // 0) / 1000000) | floor)) end)
            elif ($ts | type) == "string" then
              if ($ts | test("^-?[0-9]+(\\.[0-9]+)?$")) then _num_ms($ts | tonumber)
              else
                ([$ts | ascii_upcase | capture("^(?<d>[0-9]{4}-[0-9]{2}-[0-9]{2})(?:[T ](?<t>[0-9]{2}:[0-9]{2}(?::[0-9]{2})?)(?:[.,](?<f>[0-9]+))?)? ?(?<z>Z|UTC|[+-][0-9]{2}(?::?[0-9]{2})?)?$")] | first) as $m
                | if $m == null then null
                  else
                    (($m.t // "00:00:00") | if length == 5 then . + ":00" else . end) as $t
                    | (($m.z // "Z") | if . == "Z" or . == "UTC" then 0
                        else (.[1:] | gsub(":"; "")) as $o
                          | ((if (.[0:1]) == "-" then -1 else 1 end)
                             * (($o[0:2] | tonumber) * 3600 + ((if ($o | length) >= 4 then $o[2:4] else "00" end) | tonumber) * 60))
                        end) as $off
                    | ((($m.d + "T" + $t + "Z") | fromdateiso8601) - $off) * 1000
                      + (((($m.f // "") + "000")[0:3]) | tonumber)
                  end
              end
            else null end;

                    def is_ip($s):
                      def _v4: test("^((25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\\.){3}(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])$");
                      def _v6:
                        if test("^[0-9A-Fa-f:.]+$") | not then false
                        else
                          (if test("\\.")
                           then (split(":") | last) as $t
                             | if ($t | _v4) then .[0:length - ($t | length)] + "0:0" else "x" end
                           else . end) as $h
                          | ($h | split("::")) as $p
                          | if ($p | length) > 2 then false
                            else ([$p[] | if . == "" then empty else split(":")[] end]) as $g
                              | ($g | all(test("^[0-9A-Fa-f]{1,4}$")))
                                and (if ($p | length) == 2 then ($g | length) <= 7 else ($g | length) == 8 end)
                            end
                        end;
                      ($s | type) == "string" and ($s | _v4 or _v6);

          . as $r
          | {
              "category_uid": 5,
              "class_uid":    5023,
              "type_uid":     502302,
              "activity_id":  2,
              "severity_id":  1,
              "time":         to_epoch_ms($r.modified_on),

              "metadata": {
                "version": "1.9.0",
                "product": {
                  "vendor_name": "Cloudflare",
                  "name": "Cloudflare DNS"
                },
                "profiles": ["osint"],
                "original_time": $r.modified_on
              },

              # at_least_one constraint: cloud + resources both populated.
              "cloud": {
                "provider": "Cloudflare"
              },

              "resources": [
                {
                  "uid":  $r.id,
                  "name": $r.name,
                  "type": ("DNS " + ($r.type // "") + " Record"),
                  "hostname": $r.name,
                  "ip": (if is_ip($r.content) then $r.content else null end),
                  "labels": ($r.tags // []),
                  "created_time": to_epoch_ms($r.created_on),
                  "modified_time": to_epoch_ms($r.modified_on),
                  "data": {
                    "record_type": $r.type,
                    "content": $r.content,
                    "ttl": $r.ttl,
                    "proxied": $r.proxied,
                    "proxiable": $r.proxiable,
                    "zone_id": $r.zone_id,
                    "zone_name": $r.zone_name,
                    "comment": $r.comment
                  }
                }
              ],

              # OSINT indicator: the record name is a domain/FQDN.
              "osint": [
                {
                  "value": $r.name,
                  "type_id": 2
                }
              ],

              "status_id": 1,
              "message": ("Cloudflare DNS " + ($r.type // "") + " record for " + ($r.name // "")),

              "unmapped": {
                "settings": $r.settings,
                "meta": $r.meta,
                "comment_modified_on": $r.comment_modified_on,
                "tags_modified_on": $r.tags_modified_on
              },

              "raw_data": ($r | tostring)
            }
          | walk(
              if type == "object" then with_entries(select(.value != null and .value != "" and .value != {} and .value != []))
              else . end
            )
