name: "Cloudflare Rulesets to OCSF v1.9.0"
description: "Transforms Cloudflare Rulesets inventory records into the OCSF v1.9.0 Cloud Resources Inventory Info class (class_uid 5023)."
author: "Monad"
contributors:
  - "https://github.com/behobu"
inputs:
  - "cloudflare-rulesets"
tags:
  - "v1.9.0"
  - "ocsf"
  - "cloudflare"
  - "discovery"
config:
  operations:
    - operation: "jq"
      arguments:
        key: ""
        query: |
          # ---------------------------------------------------------------
          # OCSF Cloud Resources Inventory Info (class_uid=5023) — v1.9.0
          # Input: one Cloudflare ruleset object per invocation (Rulesets API).
          # A ruleset is a cloud/SaaS configuration asset, so it maps to the
          # Discovery > Cloud Resources Inventory Info class (activity Collect).
          # ---------------------------------------------------------------


          def to_epoch_ms($ts):
            def _num_ms($n):
              if   $n >= 1e17 then ($n / 1000000 | floor)
              elif $n >= 1e14 then ($n / 1000 | floor)
              elif $n >= 1e11 then ($n | floor)
              else ($n * 1000 | floor) end;
            if $ts == null or $ts == "" then null
            elif ($ts | type) == "number" then _num_ms($ts)
            elif ($ts | type) == "object" then
              (if ($ts.seconds // null) == null then null
               else ($ts.seconds * 1000 + ((($ts.nanos // 0) / 1000000) | floor)) end)
            elif ($ts | type) == "string" then
              if ($ts | test("^-?[0-9]+(\\.[0-9]+)?$")) then _num_ms($ts | tonumber)
              else
                ([$ts | ascii_upcase | capture("^(?<d>[0-9]{4}-[0-9]{2}-[0-9]{2})(?:[T ](?<t>[0-9]{2}:[0-9]{2}(?::[0-9]{2})?)(?:[.,](?<f>[0-9]+))?)? ?(?<z>Z|UTC|[+-][0-9]{2}(?::?[0-9]{2})?)?$")] | first) as $m
                | if $m == null then null
                  else
                    (($m.t // "00:00:00") | if length == 5 then . + ":00" else . end) as $t
                    | (($m.z // "Z") | if . == "Z" or . == "UTC" then 0
                        else (.[1:] | gsub(":"; "")) as $o
                          | ((if (.[0:1]) == "-" then -1 else 1 end)
                             * (($o[0:2] | tonumber) * 3600 + ((if ($o | length) >= 4 then $o[2:4] else "00" end) | tonumber) * 60))
                        end) as $off
                    | ((($m.d + "T" + $t + "Z") | fromdateiso8601) - $off) * 1000
                      + (((($m.f // "") + "000")[0:3]) | tonumber)
                  end
              end
            else null end;

          . as $r
          | ($r.rules // []) as $rules
          | {
              # --- Classification (REQUIRED) ---
              "category_uid": 5,
              "class_uid":    5023,
              "activity_id":  2,
              "type_uid":     502302,
              "severity_id":  1,

              # --- Time (REQUIRED) ---
              "time": to_epoch_ms($r.last_updated),

              # --- Metadata (REQUIRED) ---
              "metadata": {
                "profiles": ["cloud", "osint"],
                "version": "1.9.0",
                "product": {
                  "vendor_name": "Cloudflare",
                  "name": "Cloudflare Rulesets"
                }
              },

              # --- OSINT (REQUIRED in the 1.9.0 discovery base). No related
              #     indicator exists for a ruleset asset, so type_id=0/Unknown
              #     and value carries the ruleset id. ---
              "osint": [{
                "value": ($r.id // "unknown"),
                "type_id": 0
              }],

              # --- Cloud (recommended; Cloudflare is the SaaS provider) ---
              "cloud": {
                "provider": "Cloudflare",
                "account": {
                  "uid": ($r.account_id // $r.zone_id)
                }
              },

              # --- The ruleset itself as an inventoried cloud resource ---
              "resources": [
                {
                  "uid":  $r.id,
                  "name": $r.name,
                  "type": "cloudflare-ruleset",
                  "labels": ([$r.kind, $r.phase] | map(select(. != null)))
                }
              ],

              # --- Recommended ---
              "status_id": 1,
              "message": ($r.description // $r.name),
              "count": ($rules | length),

              # --- Fields with no clean OCSF home ---
              "unmapped": {
                "kind":       $r.kind,
                "phase":      $r.phase,
                "version":    $r.version,
                "source":     $r.source,
                "zone_id":    $r.zone_id,
                "rule_count": ($rules | length),
                "rules": ($rules | map({
                  id:          .id,
                  action:      .action,
                  expression:  .expression,
                  enabled:     .enabled,
                  ref:         .ref,
                  version:     .version,
                  description: .description
                }))
              },

              # --- Original record for audit ---
              "raw_data": ($r | tostring)
            }
          | walk(
              if type == "object" then
                with_entries(select(.value != null and .value != "" and .value != [] and .value != {}))
              else . end
            )
