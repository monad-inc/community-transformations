name: "Cloudflare Access Login Events to OCSF v1.9.0"
description: "Transforms Cloudflare Access login events (GraphQL accessLoginRequestsAdaptiveGroups) into the OCSF v1.9.0 Authentication (3002) class."
author: "Monad"
contributors:
  - "https://github.com/behobu"
inputs:
  - "cloudflare-access-login-events"
tags:
  - "v1.9.0"
  - "ocsf"
  - "cloudflare"
  - "iam"
  - "authentication"
config:
  operations:
    - operation: "jq"
      arguments:
        key: ""
        query: |
          # ---------------------------------------------------------------
          # OCSF Authentication (class_uid=3002) — v1.9.0
          # Input: one Cloudflare Access login event per call — the raw
          # `dimensions` object of a GraphQL accessLoginRequestsAdaptiveGroups
          # row: datetime, isSuccessfulLogin / hasWarpEnabled /
          # hasGatewayEnabled / hasExistingJWT (0/1), cfRayId, ipAddress,
          # userUuid, identityProvider, country, deviceId, approvingPolicyId,
          # mtlsStatus / mtlsCertSerialId / mtlsCommonName, serviceTokenId.
          # Empty strings mean "not applicable" and are dropped.
          # ---------------------------------------------------------------
          def to_epoch_ms($ts):
            def _num_ms($n):
              if   $n >= 1e17 then ($n / 1000000 | floor)
              elif $n >= 1e14 then ($n / 1000 | floor)
              elif $n >= 1e11 then ($n | floor)
              else ($n * 1000 | floor) end;
            if $ts == null or $ts == "" then null
            elif ($ts | type) == "number" then _num_ms($ts)
            elif ($ts | type) == "object" then
              (if ($ts.seconds // null) == null then null
               else ($ts.seconds * 1000 + ((($ts.nanos // 0) / 1000000) | floor)) end)
            elif ($ts | type) == "string" then
              if ($ts | test("^-?[0-9]+(\\.[0-9]+)?$")) then _num_ms($ts | tonumber)
              else
                ([$ts | ascii_upcase | capture("^(?<d>[0-9]{4}-[0-9]{2}-[0-9]{2})(?:[T ](?<t>[0-9]{2}:[0-9]{2}(?::[0-9]{2})?)(?:[.,](?<f>[0-9]+))?)? ?(?<z>Z|UTC|[+-][0-9]{2}(?::?[0-9]{2})?)?$")] | first) as $m
                | if $m == null then null
                  else
                    (($m.t // "00:00:00") | if length == 5 then . + ":00" else . end) as $t
                    | (($m.z // "Z") | if . == "Z" or . == "UTC" then 0
                        else (.[1:] | gsub(":"; "")) as $o
                          | ((if (.[0:1]) == "-" then -1 else 1 end)
                             * (($o[0:2] | tonumber) * 3600 + ((if ($o | length) >= 4 then $o[2:4] else "00" end) | tonumber) * 60))
                        end) as $off
                    | ((($m.d + "T" + $t + "Z") | fromdateiso8601) - $off) * 1000
                      + (((($m.f // "") + "000")[0:3]) | tonumber)
                  end
              end
            else null end;

          # The GraphQL flags are 0/1 integers; also accept booleans / strings.
          def flag($v):
            $v == true or $v == 1 or (($v | type) == "string" and (($v | ascii_downcase) == "true" or $v == "1"));

          # "" -> null so the prune pass drops not-applicable fields.
          def nz($v): if $v == "" then null else $v end;

          . as $r
          | flag($r.isSuccessfulLogin) as $ok
          | nz($r.userUuid) as $user_uid
          | nz($r.serviceTokenId) as $svc_token
          | nz($r.identityProvider) as $idp
          | ($idp // "" | ascii_downcase) as $idp_lc
          # user is required and needs one of [account, name, uid]. A
          # service-token login has no user UUID; an anonymous attempt
          # (e.g. identityProvider "nonidentity") has neither.
          | ( if $user_uid != null then { uid: $user_uid, type_id: 1, type: "User" }
              elif $svc_token != null then { uid: $svc_token, type_id: 4, type: "Service" }
              else { name: "Unknown", type_id: 0, type: "Unknown" } end ) as $user
          # Every row is a login attempt against Cloudflare Access.
          | 1 as $activity
          | {
              category_uid: 3,
              class_uid:    3002,
              activity_id:  $activity,
              type_uid:     (3002 * 100 + $activity),
              severity_id:  (if $ok then 1 else 3 end),
              status_id:    (if $ok then 1 else 2 end),
              status:       (if $ok then "Success" else "Failure" end),

              time: to_epoch_ms($r.datetime),

              metadata: {
                # device (host profile) and policy (security_control
                # profile) are only valid when their profile is declared.
                profiles: (["cloud"]
                           + (if nz($r.deviceId) != null then ["host"] else [] end)
                           + (if nz($r.approvingPolicyId) != null then ["security_control"] else [] end)),
                version: "1.9.0",
                product: {
                  vendor_name: "Cloudflare",
                  name: "Cloudflare Access"
                },
                uid: nz($r.cfRayId),
                log_name: "accessLoginRequestsAdaptiveGroups"
              },

              cloud: { provider: "Cloudflare" },

              # The service authenticated to (satisfies the class's
              # at_least_one [service, dst_endpoint] constraint; the source
              # row carries no application identifier).
              service: { name: "Cloudflare Access" },

              user: $user,

              # The identity provider used; actor needs one of its
              # at_least_one attributes, so the login's user is repeated.
              actor: (if $idp != null then { user: $user, idp: { name: $idp } } else null end),

              auth_protocol_id: (if $idp_lc == "saml" then 5
                                 elif $idp_lc == "oidc" then 4
                                 elif $idp_lc == "onetimepin" then 99
                                 else null end),
              auth_protocol: (if $idp_lc == "saml" then "SAML"
                              elif $idp_lc == "oidc" then "OpenID"
                              elif $idp_lc == "onetimepin" then "One-time PIN"
                              else null end),

              src_endpoint: {
                ip: nz($r.ipAddress),
                location: (if nz($r.country) != null then { country: $r.country } else null end)
              },

              device: (if nz($r.deviceId) != null then { uid: $r.deviceId, type_id: 0 } else null end),

              policy: (if nz($r.approvingPolicyId) != null
                       then { uid: $r.approvingPolicyId, is_applied: true } else null end),

              message: ("Cloudflare Access login "
                        + (if $ok then "succeeded" else "failed" end)
                        + (if $idp != null then " via " + $idp else "" end)),

              observables: [
                (if nz($r.ipAddress) != null then { name: "src_endpoint.ip", type_id: 2, value: $r.ipAddress } else empty end),
                (if $user_uid != null then { name: "user.uid", type_id: 31, value: $user_uid } else empty end),
                (if nz($r.deviceId) != null then { name: "device.uid", type_id: 47, value: $r.deviceId } else empty end)
              ],

              # No OCSF home: the mTLS cert fields lack the issuer that OCSF
              # certificate requires; the WARP/Gateway/JWT flags are posture.
              unmapped: {
                hasWarpEnabled: $r.hasWarpEnabled,
                hasGatewayEnabled: $r.hasGatewayEnabled,
                hasExistingJWT: $r.hasExistingJWT,
                mtlsStatus: $r.mtlsStatus,
                mtlsCertSerialId: $r.mtlsCertSerialId,
                mtlsCommonName: $r.mtlsCommonName,
                serviceTokenId: $r.serviceTokenId
              },

              raw_data: ($r | tostring)
            }
          | walk(
              if type == "object" then
                with_entries(select(.value != null and .value != "" and .value != {} and .value != []))
              elif type == "array" then
                map(select(. != null and . != {} and . != []))
              else . end
            )
