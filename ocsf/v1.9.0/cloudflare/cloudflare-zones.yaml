name: "Cloudflare Zones to OCSF v1.9.0"
description: "Transforms Cloudflare Zones inventory records into the OCSF v1.9.0 Cloud Resources Inventory Info (class_uid 5023) class."
author: "Monad"
contributors:
  - "https://github.com/behobu"
inputs:
  - "cloudflare-zones"
tags:
  - "v1.9.0"
  - "ocsf"
  - "cloudflare"
  - "discovery"
config:
  operations:
    - operation: "jq"
      arguments:
        key: ""
        query: |
          # ---------------------------------------------------------------
          # OCSF Cloud Resources Inventory Info (class_uid=5023) — v1.9.0
          # Input: one Cloudflare Zone record (GET /zones) per invocation.
          # A Cloudflare zone is a cloud-managed web asset, collected via the
          # Cloudflare API -> activity_id 2 (Collect).
          # ---------------------------------------------------------------


          def to_epoch_ms($ts):
            def _n: if . == null then null else tonumber end;
            def _num_ms($n):
              if   $n >= 1e17 then ($n / 1000000 | floor)
              elif $n >= 1e14 then ($n / 1000 | floor)
              elif $n >= 1e11 then ($n | floor)
              else ($n * 1000 + 0.001 | floor) end;
            def _digits_ms($d):
              ($d | ltrimstr("-") | length) as $l
              | if   $l >= 18 then ($d[0:-6] | tonumber)
                elif $l >= 15 then ($d[0:-3] | tonumber)
                elif $l >= 12 then ($d | tonumber)
                else ($d | tonumber) * 1000 end;
            def _frac_ms($f): if $f == null then 0 else (($f + "000")[0:3] | tonumber) end;
            def _mon($m):
              if $m == null then null
              else {"JAN":1,"FEB":2,"MAR":3,"APR":4,"MAY":5,"JUN":6,
                    "JUL":7,"AUG":8,"SEP":9,"OCT":10,"NOV":11,"DEC":12}[$m[0:3]] end;
            def _zone($z):
              if $z == null or $z == "" then 0
              else
                ($z | if test("^(UTC|GMT|UT)[+-]") then sub("^(UTC|GMT|UT)"; "") else . end) as $z
                | if ($z | test("^[+-][0-9]{1,2}(:?[0-9]{2})?$")) then
                    ($z | capture("^(?<sg>[+-])(?<h>[0-9]{1,2}):?(?<m>[0-9]{2})?$")) as $o
                    | (if $o.sg == "-" then -1 else 1 end)
                      * (($o.h | tonumber) * 3600 + (($o.m // "0") | tonumber) * 60)
                  else
                    {"Z":0,"UTC":0,"GMT":0,"UT":0,"EST":-18000,"EDT":-14400,"CST":-21600,
                     "CDT":-18000,"MST":-25200,"MDT":-21600,"PST":-28800,"PDT":-25200}[$z]
                  end
              end;
            def _ms($c):
              ($c.y | tonumber | if . < 100 then (if . < 70 then . + 2000 else . + 1900 end) else . end) as $y
              | ($c.mo | _n) as $mo
              | ($c.d | tonumber) as $d
              | (($c.h // "0") | tonumber) as $h
              | (($c.mi // "0") | tonumber) as $mi
              | (($c.s // "0") | tonumber) as $s
              | _zone($c.z) as $off
              | if $mo == null or $off == null or $mo < 1 or $mo > 12 or $d < 1 or $d > 31
                   or $h > 23 or $mi > 59 or $s > 60 then null
                else
                  ($y - (if $mo <= 2 then 1 else 0 end)) as $yy
                  | ($yy / 400 | floor) as $era
                  | ($yy - $era * 400) as $yoe
                  | (((153 * ($mo + (if $mo > 2 then -3 else 9 end)) + 2) / 5 | floor) + $d - 1) as $doy
                  | ($yoe * 365 + ($yoe / 4 | floor) - ($yoe / 100 | floor) + $doy) as $doe
                  | ($era * 146097 + $doe - 719468) as $days
                  | ($days * 86400 + $h * 3600 + $mi * 60 + $s - $off) * 1000 + _frac_ms($c.f)
                end;
            def _str($raw):
              ($raw | ascii_upcase | sub("\\s*\\([^)]*\\)\\s*$"; "") | sub("^\\s+"; "") | sub("\\s+$"; "")) as $s
              | "(?<z>Z|(?:UTC|GMT|UT)?[+-][0-9]{1,2}(?::?[0-9]{2})?|[A-Z]{1,5})" as $Z
              | "(?<h>[0-9]{1,2}):(?<mi>[0-9]{2})(?::(?<s>[0-9]{2}))?(?:[.,](?<f>[0-9]+))?" as $T
              | if $s == "" then null
                elif ($s | test("^-?[0-9]+$")) then _digits_ms($s)
                elif ($s | test("^[0-9]+\\.[0-9]+$")) then
                  ($s | split(".")) as $p
                  | if ($p[0] | length) <= 11 then _digits_ms($p[0]) + _frac_ms($p[1])
                    else _digits_ms($p[0]) end
                elif ($s | test("^/DATE\\(-?[0-9]+([+-][0-9]{4})?\\)/$")) then
                  ($s | capture("(?<ms>-?[0-9]+)").ms | tonumber)
                else
                  first(
                    ($s | capture("^(?<y>[0-9]{4})[-/](?<mo>[0-9]{1,2})[-/](?<d>[0-9]{1,2})(?:[T ]+" + $T + ")?\\s*" + $Z + "?(?:\\s+[A-Z]{2,5})?$") | _ms(.)),
                    ($s | capture("^(?<y>[0-9]{4})(?<mo>[0-9]{2})(?<d>[0-9]{2})T(?<h>[0-9]{2})(?<mi>[0-9]{2})(?<s>[0-9]{2})(?:[.,](?<f>[0-9]+))?" + $Z + "?$") | _ms(.)),
                    ($s | capture("^(?:[A-Z]+,?\\s+)?(?<d>[0-9]{1,2})[ -](?<mon>[A-Z]{3,9})[ -](?<y>[0-9]{2,4})\\s+" + $T + "\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?:[A-Z]+,?\\s+)?(?<mon>[A-Z]{3,9})\\.?\\s+(?<d>[0-9]{1,2}),?\\s+(?<y>[0-9]{4})(?:,?\\s+" + $T + ")?\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?:[A-Z]+\\s+)?(?<mon>[A-Z]{3,9})\\s+(?<d>[0-9]{1,2})\\s+" + $T + "\\s+(?:" + $Z + "\\s+)?(?<y>[0-9]{4})$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?<d>[0-9]{1,2})/(?<mon>[A-Z]{3})/(?<y>[0-9]{4}):" + $T + "\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.))
                  ) // null
                end;
            if $ts == null then null
            elif ($ts | type) == "number" then _num_ms($ts)
            elif ($ts | type) == "string" then _str($ts)
            elif ($ts | type) == "object" then
              if   $ts["$date"] != null then to_epoch_ms($ts["$date"])
              elif $ts["$numberLong"] != null then to_epoch_ms($ts["$numberLong"])
              elif $ts.seconds != null then
                ($ts.seconds | tostring | tonumber) * 1000
                + ((($ts.nanos // 0) | tostring | tonumber) / 1000000 | floor)
              else null end
            else null end;

          . as $r
          | ($r.account // {}) as $acct
          | ($r.owner // {}) as $owner
          | ($r.plan // {}) as $plan
          | {
              "category_uid": 5,
              "class_uid":    5023,
              "type_uid":     502302,
              "activity_id":  2,
              "severity_id":  1,

              "time":       to_epoch_ms($r.modified_on // $r.created_on),
              "start_time": to_epoch_ms($r.created_on),
              "end_time":   to_epoch_ms($r.activated_on),

              "metadata": {
                "version": "1.9.0",
                "product": {
                  "vendor_name": "Cloudflare",
                  "name": "Cloudflare Zones"
                },
                "profiles": ["cloud", "osint"]
              },

              # osint is base-required for 5023 (osint profile); array of indicators.
              # The zone name is a domain indicator (type_id 2 = Domain).
              "osint": [
                { "value":   $r.name,
                  "type_id": 2,
                  "type":    "Domain",
                  "subdomains": ($r.name_servers // []),
                  "whois": (
                    { "registrar": $r.original_registrar }
                    | with_entries(select(.value != null))
                  )
                } | with_entries(select(.value != null))
              ],

              # cloud satisfies the class at_least_one constraint. Nested account/org
              # each carry their own at_least_one, so omit them when empty.
              "cloud": (
                { "provider": "Cloudflare",
                  "account": (
                    { "uid": $acct.id, "name": $acct.name, "type": "Cloud Account" }
                    | with_entries(select(.value != null))
                    | if length > 0 then . else null end
                  ),
                  "org": (
                    { "uid": $owner.id, "name": $owner.name }
                    | with_entries(select(.value != null))
                    | if length > 0 then . else null end
                  )
                } | with_entries(select(.value != null))
              ),

              # resources also satisfies the constraint and carries the asset.
              "resources": [
                { "uid":  $r.id,
                  "name": $r.name,
                  "type": "Cloudflare Zone",
                  "hostname": $r.name,
                  "labels": (
                    [ (if $r.type      then ("type:" + $r.type) else empty end),
                      (if $r.status    then ("status:" + $r.status) else empty end),
                      (if $r.paused    then "paused" else empty end),
                      (if $plan.name   then ("plan:" + $plan.name) else empty end) ]
                  ),
                  "created_time": to_epoch_ms($r.created_on),
                  "modified_time": to_epoch_ms($r.modified_on)
                } | with_entries(select(.value != null))
              ],

              # status_id describes the collection operation (succeeded), not the
              # asset lifecycle state; the zone's own status lives in status_detail.
              "status_id":     1,
              "status_detail": ($r.status // "unknown"),
              "message":       ("Cloudflare zone " + ($r.name // "unknown") + " (" + ($r.status // "unknown") + ")"),

              "observables": (
                [ (if $r.name then { "name": "osint.value", "type": "Hostname", "type_id": 1, "value": $r.name } else empty end),
                  (if $r.id   then { "name": "resources.uid", "type": "Resource UID", "type_id": 10, "value": $r.id } else empty end) ]
              ),

              "unmapped": (
                { "development_mode": $r.development_mode,
                  "original_dnshost": $r.original_dnshost,
                  "original_name_servers": $r.original_name_servers,
                  "permissions": $r.permissions,
                  "plan_id": $plan.id,
                  "plan_legacy_id": $plan.legacy_id,
                  "plan_price": $plan.price,
                  "plan_currency": $plan.currency,
                  "plan_frequency": $plan.frequency,
                  "plan_is_subscribed": $plan.is_subscribed,
                  "meta": $r.meta }
                | with_entries(select(.value != null))
              ),

              "raw_data": ($r | tostring)
            }
