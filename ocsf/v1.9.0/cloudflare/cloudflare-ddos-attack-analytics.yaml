name: "Cloudflare DDoS Attack Analytics to OCSF v1.9.0"
description: "Transforms Cloudflare DDoS Attack Analytics (dosdAttackAnalyticsGroups GraphQL) records into the OCSF v1.9.0 Network Activity (4001) class."
author: "Monad"
contributors:
  - "https://github.com/behobu"
inputs:
  - "cloudflare-ddos-attack-analytics"
tags:
  - "v1.9.0"
  - "ocsf"
  - "cloudflare"
  - "network"
config:
  operations:
    - operation: "jq"
      arguments:
        key: ""
        query: |
          # ---------------------------------------------------------------
          # OCSF Network Activity (class_uid=4001) — v1.9.0
          # Input: one Cloudflare DDoS Attack Analytics group row per
          # invocation (dosdAttackAnalyticsGroups: dimensions{} + sum{}).
          # A DDoS attack Cloudflare detected and mitigated is modeled as
          # aggregated inbound traffic (activity_id=6 Traffic) that a
          # security control denied/dropped.
          # ---------------------------------------------------------------


          def to_epoch_ms($ts):
            def _num_ms($n):
              if   $n >= 1e17 then ($n / 1000000 | floor)
              elif $n >= 1e14 then ($n / 1000 | floor)
              elif $n >= 1e11 then ($n | floor)
              else ($n * 1000 | floor) end;
            if $ts == null or $ts == "" then null
            elif ($ts | type) == "number" then _num_ms($ts)
            elif ($ts | type) == "object" then
              (if ($ts.seconds // null) == null then null
               else ($ts.seconds * 1000 + ((($ts.nanos // 0) / 1000000) | floor)) end)
            elif ($ts | type) == "string" then
              if ($ts | test("^-?[0-9]+(\\.[0-9]+)?$")) then _num_ms($ts | tonumber)
              else
                ([$ts | ascii_upcase | capture("^(?<d>[0-9]{4}-[0-9]{2}-[0-9]{2})(?:[T ](?<t>[0-9]{2}:[0-9]{2}(?::[0-9]{2})?)(?:[.,](?<f>[0-9]+))?)? ?(?<z>Z|UTC|[+-][0-9]{2}(?::?[0-9]{2})?)?$")] | first) as $m
                | if $m == null then null
                  else
                    (($m.t // "00:00:00") | if length == 5 then . + ":00" else . end) as $t
                    | (($m.z // "Z") | if . == "Z" or . == "UTC" then 0
                        else (.[1:] | gsub(":"; "")) as $o
                          | ((if (.[0:1]) == "-" then -1 else 1 end)
                             * (($o[0:2] | tonumber) * 3600 + ((if ($o | length) >= 4 then $o[2:4] else "00" end) | tonumber) * 60))
                        end) as $off
                    | ((($m.d + "T" + $t + "Z") | fromdateiso8601) - $off) * 1000
                      + (((($m.f // "") + "000")[0:3]) | tonumber)
                  end
              end
            else null end;

          . as $r
          | ($r.dimensions // {}) as $d
          | ($r.sum // {}) as $s
          | {
              "category_uid": 4,
              "class_uid":    4001,
              "activity_id":  6,
              "type_uid":     400106,
              "severity_id":  4,
              "is_alert":     true,
              "status_id":    1,
              "status":       "Success",

              "time": to_epoch_ms($d.datetime),
              "start_time": to_epoch_ms($d.startDatetime),
              "end_time": to_epoch_ms($d.endDatetime),

              "metadata": {
                "profiles": ["cloud", "osint", "security_control"],
                "version": "1.9.0",
                "product": {
                  "vendor_name": "Cloudflare",
                  "name": "Cloudflare DDoS Protection",
                  "feature": { "name": "DDoS Attack Analytics" }
                }
              },

              # OCSF 1.9.0 requires these on Network Activity.
              "cloud": { "provider": "Cloudflare" },
              "osint": [],

              # Mitigation outcome: packets dropped by the DDoS managed ruleset.
              "action_id": 2,
              "action": "Denied",
              "disposition_id": 6,
              "disposition": "Dropped",

              "dst_endpoint": {
                "ip": $d.destinationIP,
                "port": $d.destinationPort,
                "location": {
                  "city": $d.coloCity,
                  "country": $d.coloCountry
                }
              },

              "connection_info": {
                "direction": "Inbound",
                "direction_id": 1,
                "protocol_name": ( $d.attackProtocol // $d.attackProtocolName
                                   | if . == null then null else ascii_downcase end )
              },

              "traffic": {
                "packets": $s.packets,
                "bytes": ( if $s.bits == null then null else ($s.bits / 8 | floor) end )
              },

              "message": ( [ "Cloudflare mitigated ", ($d.attackType // "DDoS attack"),
                             " (", ($d.attackVector // "unknown vector"), ")" ] | add ),

              "unmapped": {
                "attackId": $d.attackId,
                "attackType": $d.attackType,
                "attackVector": $d.attackVector,
                "mitigationType": $d.mitigationType,
                "action": $d.action,
                "sourcePort": $d.sourcePort,
                "droppedPackets": $s.droppedPackets,
                "droppedBits": $s.droppedBits,
                "sampleInterval": ($r.avg.sampleInterval),
                "count": $r.count
              },

              "raw_data": ($r | tostring)
            }
          # Drop nulls/empties so required objects stay intact but noise is pruned.
          | walk( if type == "object" then with_entries(select(.value != null and .value != "" and .value != {})) else . end )
