name: "Cloudflare DDoS Attack Analytics to OCSF v1.9.0"
description: "Transforms Cloudflare DDoS Attack Analytics (dosdAttackAnalyticsGroups GraphQL) records into the OCSF v1.9.0 Network Activity (4001) class."
author: "Monad"
contributors:
  - "https://github.com/behobu"
inputs:
  - "cloudflare-ddos-attack-analytics"
tags:
  - "v1.9.0"
  - "ocsf"
  - "cloudflare"
  - "network"
config:
  operations:
    - operation: "jq"
      arguments:
        key: ""
        query: |
          # ---------------------------------------------------------------
          # OCSF Network Activity (class_uid=4001) — v1.9.0
          # Input: one dosdAttackAnalyticsGroups row per invocation, emitted
          # flat by the connector (no dimensions/sum wrapper): attackId,
          # attackType, attackVector, bits, packets, droppedBits,
          # droppedPackets, startDatetime, endDatetime, sourceIp, sourcePort,
          # destinationIp, destinationPort, ipProtocol, ipProtocolName,
          # mitigationType/Reason/Scope, ruleId, ruleName, rulesetId,
          # rulesetOverrideId, tcpFlags(+Names), commonTcpFlags(+Names).
          # A DDoS attack Cloudflare detected and mitigated is modeled as
          # aggregated inbound traffic (activity_id=6 Traffic) that a
          # security control dropped.
          # ---------------------------------------------------------------
          def to_epoch_ms($ts):
            def _num_ms($n):
              if   $n >= 1e17 then ($n / 1000000 | floor)
              elif $n >= 1e14 then ($n / 1000 | floor)
              elif $n >= 1e11 then ($n | floor)
              else ($n * 1000 | floor) end;
            if $ts == null or $ts == "" then null
            elif ($ts | type) == "number" then _num_ms($ts)
            elif ($ts | type) == "object" then
              (if ($ts.seconds // null) == null then null
               else ($ts.seconds * 1000 + ((($ts.nanos // 0) / 1000000) | floor)) end)
            elif ($ts | type) == "string" then
              if ($ts | test("^-?[0-9]+(\\.[0-9]+)?$")) then _num_ms($ts | tonumber)
              else
                ([$ts | ascii_upcase | capture("^(?<d>[0-9]{4}-[0-9]{2}-[0-9]{2})(?:[T ](?<t>[0-9]{2}:[0-9]{2}(?::[0-9]{2})?)(?:[.,](?<f>[0-9]+))?)? ?(?<z>Z|UTC|[+-][0-9]{2}(?::?[0-9]{2})?)?$")] | first) as $m
                | if $m == null then null
                  else
                    (($m.t // "00:00:00") | if length == 5 then . + ":00" else . end) as $t
                    | (($m.z // "Z") | if . == "Z" or . == "UTC" then 0
                        else (.[1:] | gsub(":"; "")) as $o
                          | ((if (.[0:1]) == "-" then -1 else 1 end)
                             * (($o[0:2] | tonumber) * 3600 + ((if ($o | length) >= 4 then $o[2:4] else "00" end) | tonumber) * 60))
                        end) as $off
                    | ((($m.d + "T" + $t + "Z") | fromdateiso8601) - $off) * 1000
                      + (((($m.f // "") + "000")[0:3]) | tonumber)
                  end
              end
            else null end;

          # "" -> null so the prune pass drops not-applicable fields.
          def nz($v): if $v == "" then null else $v end;
          def num($v): if ($v | type) == "string" then ($v | tonumber? // null) else $v end;

          . as $r
          | num($r.droppedPackets) as $dropped
          # Rows with droppedPackets == 0 were detected but not dropped.
          | ($dropped == null or $dropped > 0) as $was_dropped
          | {
              category_uid: 4,
              class_uid:    4001,
              activity_id:  6,
              type_uid:     (4001 * 100 + 6),
              severity_id:  4,
              is_alert:     true,
              status_id:    1,
              status:       "Success",

              time:       to_epoch_ms($r.startDatetime),
              start_time: to_epoch_ms($r.startDatetime),
              end_time:   to_epoch_ms($r.endDatetime),

              metadata: {
                # firewall_rule/policy/action_id/disposition_id/is_alert are
                # security_control profile attributes.
                profiles: ["cloud", "security_control"],
                version: "1.9.0",
                product: {
                  vendor_name: "Cloudflare",
                  name: "Cloudflare DDoS Protection",
                  feature: { name: "DDoS Attack Analytics" }
                },
                uid: nz($r.attackId),
                log_name: "dosdAttackAnalyticsGroups"
              },

              cloud: { provider: "Cloudflare" },

              action_id:      (if $was_dropped then 2 else 3 end),
              action:         (if $was_dropped then "Denied" else "Observed" end),
              disposition_id: (if $was_dropped then 6 else 15 end),
              disposition:    (if $was_dropped then "Dropped" else "Detected" end),

              src_endpoint: {
                ip:   nz($r.sourceIp),
                port: num($r.sourcePort)
              },

              dst_endpoint: {
                ip:   nz($r.destinationIp),
                port: num($r.destinationPort)
              },

              connection_info: {
                direction_id:  1,
                direction:     "Inbound",
                protocol_num:  num($r.ipProtocol),
                protocol_name: (nz($r.ipProtocolName) | if . == null then null else ascii_downcase end),
                tcp_flags:     num($r.tcpFlags)
              },

              # Cloudflare reports volume in bits; OCSF traffic is bytes.
              traffic: {
                packets: num($r.packets),
                bytes:   (num($r.bits) | if . == null then null else (. / 8 | floor) end)
              },

              firewall_rule: (if nz($r.ruleId) != null or nz($r.ruleName) != null
                              then { uid: nz($r.ruleId), name: nz($r.ruleName) } else null end),
              policy: (if nz($r.rulesetId) != null then { uid: $r.rulesetId, is_applied: true } else null end),

              message: ( "Cloudflare "
                         + (if $was_dropped then "mitigated " else "detected " end)
                         + (nz($r.attackVector) // nz($r.attackType) // "DDoS attack")
                         + (if nz($r.destinationIp) != null then " targeting " + $r.destinationIp else "" end) ),

              observables: [
                (if nz($r.sourceIp) != null then { name: "src_endpoint.ip", type_id: 2, value: $r.sourceIp } else empty end),
                (if nz($r.destinationIp) != null then { name: "dst_endpoint.ip", type_id: 2, value: $r.destinationIp } else empty end)
              ],

              unmapped: {
                attackType: $r.attackType,
                attackVector: $r.attackVector,
                droppedBits: $r.droppedBits,
                droppedPackets: $r.droppedPackets,
                mitigationType: $r.mitigationType,
                mitigationReason: $r.mitigationReason,
                mitigationScope: $r.mitigationScope,
                rulesetOverrideId: $r.rulesetOverrideId,
                tcpFlagsNames: $r.tcpFlagsNames,
                commonTcpFlags: $r.commonTcpFlags,
                commonTcpFlagsNames: $r.commonTcpFlagsNames
              },

              raw_data: ($r | tostring)
            }
          # Drop nulls/empties so required objects stay intact but noise is pruned.
          | walk(
              if type == "object" then
                with_entries(select(.value != null and .value != "" and .value != {} and .value != []))
              elif type == "array" then
                map(select(. != null and . != {} and . != []))
              else . end
            )
