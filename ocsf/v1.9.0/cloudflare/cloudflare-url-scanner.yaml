name: "Cloudflare URL Scanner to OCSF v1.9.0"
description: "Transforms Cloudflare URL Scanner scan-result records into the OCSF v1.9.0 Detection Finding (class_uid 2004) class."
author: "Monad"
contributors:
  - "https://github.com/behobu"
inputs:
  - "cloudflare-url-scanner"
tags:
  - "v1.9.0"
  - "ocsf"
  - "cloudflare"
  - "findings"
config:
  operations:
    - operation: "jq"
      arguments:
        key: ""
        query: |
          # ---------------------------------------------------------------
          # OCSF Detection Finding (class_uid=2004) — v1.9.0
          # Input: one Cloudflare URL Scanner scan-result record per invocation.
          # A scan verdict (malicious / benign for a submitted URL) is a
          # detection produced by Cloudflare's URL Scanner engine.
          # ---------------------------------------------------------------

          def to_epoch_ms($ts):
            def _n: if . == null then null else tonumber end;
            def _num_ms($n):
              if   $n >= 1e17 then ($n / 1000000 | floor)
              elif $n >= 1e14 then ($n / 1000 | floor)
              elif $n >= 1e11 then ($n | floor)
              else ($n * 1000 + 0.001 | floor) end;
            def _digits_ms($d):
              ($d | ltrimstr("-") | length) as $l
              | if   $l >= 18 then ($d[0:-6] | tonumber)
                elif $l >= 15 then ($d[0:-3] | tonumber)
                elif $l >= 12 then ($d | tonumber)
                else ($d | tonumber) * 1000 end;
            def _frac_ms($f): if $f == null then 0 else (($f + "000")[0:3] | tonumber) end;
            def _mon($m):
              if $m == null then null
              else {"JAN":1,"FEB":2,"MAR":3,"APR":4,"MAY":5,"JUN":6,
                    "JUL":7,"AUG":8,"SEP":9,"OCT":10,"NOV":11,"DEC":12}[$m[0:3]] end;
            def _zone($z):
              if $z == null or $z == "" then 0
              else
                ($z | if test("^(UTC|GMT|UT)[+-]") then sub("^(UTC|GMT|UT)"; "") else . end) as $z
                | if ($z | test("^[+-][0-9]{1,2}(:?[0-9]{2})?$")) then
                    ($z | capture("^(?<sg>[+-])(?<h>[0-9]{1,2}):?(?<m>[0-9]{2})?$")) as $o
                    | (if $o.sg == "-" then -1 else 1 end)
                      * (($o.h | tonumber) * 3600 + (($o.m // "0") | tonumber) * 60)
                  else
                    {"Z":0,"UTC":0,"GMT":0,"UT":0,"EST":-18000,"EDT":-14400,"CST":-21600,
                     "CDT":-18000,"MST":-25200,"MDT":-21600,"PST":-28800,"PDT":-25200}[$z]
                  end
              end;
            def _ms($c):
              ($c.y | tonumber | if . < 100 then (if . < 70 then . + 2000 else . + 1900 end) else . end) as $y
              | ($c.mo | _n) as $mo
              | ($c.d | tonumber) as $d
              | (($c.h // "0") | tonumber) as $h
              | (($c.mi // "0") | tonumber) as $mi
              | (($c.s // "0") | tonumber) as $s
              | _zone($c.z) as $off
              | if $mo == null or $off == null or $mo < 1 or $mo > 12 or $d < 1 or $d > 31
                   or $h > 23 or $mi > 59 or $s > 60 then null
                else
                  ($y - (if $mo <= 2 then 1 else 0 end)) as $yy
                  | ($yy / 400 | floor) as $era
                  | ($yy - $era * 400) as $yoe
                  | (((153 * ($mo + (if $mo > 2 then -3 else 9 end)) + 2) / 5 | floor) + $d - 1) as $doy
                  | ($yoe * 365 + ($yoe / 4 | floor) - ($yoe / 100 | floor) + $doy) as $doe
                  | ($era * 146097 + $doe - 719468) as $days
                  | ($days * 86400 + $h * 3600 + $mi * 60 + $s - $off) * 1000 + _frac_ms($c.f)
                end;
            def _str($raw):
              ($raw | ascii_upcase | sub("\\s*\\([^)]*\\)\\s*$"; "") | sub("^\\s+"; "") | sub("\\s+$"; "")) as $s
              | "(?<z>Z|(?:UTC|GMT|UT)?[+-][0-9]{1,2}(?::?[0-9]{2})?|[A-Z]{1,5})" as $Z
              | "(?<h>[0-9]{1,2}):(?<mi>[0-9]{2})(?::(?<s>[0-9]{2}))?(?:[.,](?<f>[0-9]+))?" as $T
              | if $s == "" then null
                elif ($s | test("^-?[0-9]+$")) then _digits_ms($s)
                elif ($s | test("^[0-9]+\\.[0-9]+$")) then
                  ($s | split(".")) as $p
                  | if ($p[0] | length) <= 11 then _digits_ms($p[0]) + _frac_ms($p[1])
                    else _digits_ms($p[0]) end
                elif ($s | test("^/DATE\\(-?[0-9]+([+-][0-9]{4})?\\)/$")) then
                  ($s | capture("(?<ms>-?[0-9]+)").ms | tonumber)
                else
                  first(
                    ($s | capture("^(?<y>[0-9]{4})[-/](?<mo>[0-9]{1,2})[-/](?<d>[0-9]{1,2})(?:[T ]+" + $T + ")?\\s*" + $Z + "?(?:\\s+[A-Z]{2,5})?$") | _ms(.)),
                    ($s | capture("^(?<y>[0-9]{4})(?<mo>[0-9]{2})(?<d>[0-9]{2})T(?<h>[0-9]{2})(?<mi>[0-9]{2})(?<s>[0-9]{2})(?:[.,](?<f>[0-9]+))?" + $Z + "?$") | _ms(.)),
                    ($s | capture("^(?:[A-Z]+,?\\s+)?(?<d>[0-9]{1,2})[ -](?<mon>[A-Z]{3,9})[ -](?<y>[0-9]{2,4})\\s+" + $T + "\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?:[A-Z]+,?\\s+)?(?<mon>[A-Z]{3,9})\\.?\\s+(?<d>[0-9]{1,2}),?\\s+(?<y>[0-9]{4})(?:,?\\s+" + $T + ")?\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?:[A-Z]+\\s+)?(?<mon>[A-Z]{3,9})\\s+(?<d>[0-9]{1,2})\\s+" + $T + "\\s+(?:" + $Z + "\\s+)?(?<y>[0-9]{4})$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?<d>[0-9]{1,2})/(?<mon>[A-Z]{3})/(?<y>[0-9]{4}):" + $T + "\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.))
                  ) // null
                end;
            if $ts == null then null
            elif ($ts | type) == "number" then _num_ms($ts)
            elif ($ts | type) == "string" then _str($ts)
            elif ($ts | type) == "object" then
              if   $ts["$date"] != null then to_epoch_ms($ts["$date"])
              elif $ts["$numberLong"] != null then to_epoch_ms($ts["$numberLong"])
              elif $ts.seconds != null then
                ($ts.seconds | tostring | tonumber) * 1000
                + ((($ts.nanos // 0) | tostring | tonumber) / 1000000 | floor)
              else null end
            else null end;

          . as $r
          | ($r.task // {}) as $t
          | ($r.page // {}) as $p
          | (($r.verdicts // {}).overall // {}) as $v
          | (($v.malicious) == true) as $bad
          | {
              # --- Classification (REQUIRED) ---
              "category_uid": 2,
              "class_uid":    2004,
              "activity_id":  1,
              "type_uid":     200401,
              "severity_id":  (if $bad then 4 else 1 end),

              # --- Time (REQUIRED) ---
              "time": to_epoch_ms($t.time),

              # --- Metadata (REQUIRED) ---
              "metadata": {
                "profiles": ["cloud", "osint", "incident"],
                "version": "1.9.0",
                "product": {
                  "vendor_name": "Cloudflare",
                  "name": "Cloudflare URL Scanner"
                },
                "uid": $t.uuid
              },

              # --- Cloud (REQUIRED by schema — scan run by Cloudflare) ---
              "cloud": { "provider": "Cloudflare" },

              # --- OSINT (REQUIRED — the scanned URL as an indicator) ---
              "osint": [
                ( { "value": $t.url, "type_id": 5 }
                  | if (($v.categories // []) | length) > 0
                    then . + { "category": ($v.categories | join(", ")) } else . end )
              ],

              # --- Finding info (REQUIRED: uid) ---
              "finding_info": {
                "uid": $t.uuid,
                "title": (if $bad
                          then ("Malicious URL detected: " + ($t.url // ""))
                          else ("URL scanned clean: " + ($t.url // "")) end),
                "types": ($v.categories // []),
                "src_url": $t.reportURL
              },

              # --- Recommended fields ---
              "status_id": (if $t.success == true then 1 else 0 end),
              "is_alert":  $bad,
              "verdict_id": (if $bad then 2 else 5 end),
              "message": (if $bad
                          then ("Cloudflare URL Scanner flagged " + ($t.url // "") + " as malicious")
                          else ("Cloudflare URL Scanner found no threat for " + ($t.url // "")) end),
              "src_url": $t.reportURL,

              # --- Observables (URL, host, IP seen in the scan) ---
              "observables": (
                [ ( if $p.url  != null then { "name": "evidences.url.url_string", "type_id": 6,  "value": $p.url }  else empty end ),
                  ( if $p.domain != null then { "name": "device.hostname", "type_id": 1, "value": $p.domain } else empty end ),
                  ( if $p.ip   != null then { "name": "device.ip",       "type_id": 2,  "value": $p.ip }   else empty end )
                ]
              ),

              # --- Evidence: the resolved page ---
              "evidences": [
                { "url": {
                    "url_string": $p.url,
                    "hostname":   $p.domain,
                    "scheme":     (if ($p.url // "") | startswith("https") then "https" else "http" end)
                  },
                  "device": (
                    { "type_id": 0, "hostname": $p.domain, "ip": $p.ip, "region": $p.country }
                    | with_entries(select(.value != null))
                  ),
                  "data": {
                    "http_status": $p.status,
                    "server": $p.server,
                    "asn": $p.asn,
                    "categories": ($v.categories // []),
                    "tags": ($v.tags // [])
                  }
                }
              ],

              # --- Original record for audit / debugging ---
              "raw_data": ($r | tostring)
            }
          # Prune null/empty leaves while preserving required objects.
          | walk(
              if type == "object" then with_entries(select(.value != null and .value != "" and .value != [] and .value != {}))
              elif type == "array" then map(select(. != null))
              else . end
            )
