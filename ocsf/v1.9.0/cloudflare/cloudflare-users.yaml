name: "Cloudflare Account Members to OCSF v1.9.0"
description: "Transforms Cloudflare account member (user) inventory records into the OCSF v1.9.0 User Inventory Info (class_uid 5003) class."
author: "Monad"
contributors:
  - "https://github.com/behobu"
inputs:
  - "cloudflare-users"
tags:
  - "v1.9.0"
  - "ocsf"
  - "cloudflare"
  - "discovery"
config:
  operations:
    - operation: "jq"
      arguments:
        key: ""
        query: |
          # ---------------------------------------------------------------
          # OCSF User Inventory Info (class_uid=5003) — v1.9.0
          # Input: one Cloudflare account member record per invocation
          #        (Accounts > List Members API).
          # ---------------------------------------------------------------
          def to_epoch_ms($ts):
            def _n: if . == null then null else tonumber end;
            def _num_ms($n):
              if   $n >= 1e17 then ($n / 1000000 | floor)
              elif $n >= 1e14 then ($n / 1000 | floor)
              elif $n >= 1e11 then ($n | floor)
              else ($n * 1000 + 0.001 | floor) end;
            def _digits_ms($d):
              ($d | ltrimstr("-") | length) as $l
              | if   $l >= 18 then ($d[0:-6] | tonumber)
                elif $l >= 15 then ($d[0:-3] | tonumber)
                elif $l >= 12 then ($d | tonumber)
                else ($d | tonumber) * 1000 end;
            def _frac_ms($f): if $f == null then 0 else (($f + "000")[0:3] | tonumber) end;
            def _mon($m):
              if $m == null then null
              else {"JAN":1,"FEB":2,"MAR":3,"APR":4,"MAY":5,"JUN":6,
                    "JUL":7,"AUG":8,"SEP":9,"OCT":10,"NOV":11,"DEC":12}[$m[0:3]] end;
            def _zone($z):
              if $z == null or $z == "" then 0
              else
                ($z | if test("^(UTC|GMT|UT)[+-]") then sub("^(UTC|GMT|UT)"; "") else . end) as $z
                | if ($z | test("^[+-][0-9]{1,2}(:?[0-9]{2})?$")) then
                    ($z | capture("^(?<sg>[+-])(?<h>[0-9]{1,2}):?(?<m>[0-9]{2})?$")) as $o
                    | (if $o.sg == "-" then -1 else 1 end)
                      * (($o.h | tonumber) * 3600 + (($o.m // "0") | tonumber) * 60)
                  else
                    {"Z":0,"UTC":0,"GMT":0,"UT":0,"EST":-18000,"EDT":-14400,"CST":-21600,
                     "CDT":-18000,"MST":-25200,"MDT":-21600,"PST":-28800,"PDT":-25200}[$z]
                  end
              end;
            def _ms($c):
              ($c.y | tonumber | if . < 100 then (if . < 70 then . + 2000 else . + 1900 end) else . end) as $y
              | ($c.mo | _n) as $mo
              | ($c.d | tonumber) as $d
              | (($c.h // "0") | tonumber) as $h
              | (($c.mi // "0") | tonumber) as $mi
              | (($c.s // "0") | tonumber) as $s
              | _zone($c.z) as $off
              | if $mo == null or $off == null or $mo < 1 or $mo > 12 or $d < 1 or $d > 31
                   or $h > 23 or $mi > 59 or $s > 60 then null
                else
                  ($y - (if $mo <= 2 then 1 else 0 end)) as $yy
                  | ($yy / 400 | floor) as $era
                  | ($yy - $era * 400) as $yoe
                  | (((153 * ($mo + (if $mo > 2 then -3 else 9 end)) + 2) / 5 | floor) + $d - 1) as $doy
                  | ($yoe * 365 + ($yoe / 4 | floor) - ($yoe / 100 | floor) + $doy) as $doe
                  | ($era * 146097 + $doe - 719468) as $days
                  | ($days * 86400 + $h * 3600 + $mi * 60 + $s - $off) * 1000 + _frac_ms($c.f)
                end;
            def _str($raw):
              ($raw | ascii_upcase | sub("\\s*\\([^)]*\\)\\s*$"; "") | sub("^\\s+"; "") | sub("\\s+$"; "")) as $s
              | "(?<z>Z|(?:UTC|GMT|UT)?[+-][0-9]{1,2}(?::?[0-9]{2})?|[A-Z]{1,5})" as $Z
              | "(?<h>[0-9]{1,2}):(?<mi>[0-9]{2})(?::(?<s>[0-9]{2}))?(?:[.,](?<f>[0-9]+))?" as $T
              | if $s == "" then null
                elif ($s | test("^-?[0-9]+$")) then _digits_ms($s)
                elif ($s | test("^[0-9]+\\.[0-9]+$")) then
                  ($s | split(".")) as $p
                  | if ($p[0] | length) <= 11 then _digits_ms($p[0]) + _frac_ms($p[1])
                    else _digits_ms($p[0]) end
                elif ($s | test("^/DATE\\(-?[0-9]+([+-][0-9]{4})?\\)/$")) then
                  ($s | capture("(?<ms>-?[0-9]+)").ms | tonumber)
                else
                  first(
                    ($s | capture("^(?<y>[0-9]{4})[-/](?<mo>[0-9]{1,2})[-/](?<d>[0-9]{1,2})(?:[T ]+" + $T + ")?\\s*" + $Z + "?(?:\\s+[A-Z]{2,5})?$") | _ms(.)),
                    ($s | capture("^(?<y>[0-9]{4})(?<mo>[0-9]{2})(?<d>[0-9]{2})T(?<h>[0-9]{2})(?<mi>[0-9]{2})(?<s>[0-9]{2})(?:[.,](?<f>[0-9]+))?" + $Z + "?$") | _ms(.)),
                    ($s | capture("^(?:[A-Z]+,?\\s+)?(?<d>[0-9]{1,2})[ -](?<mon>[A-Z]{3,9})[ -](?<y>[0-9]{2,4})\\s+" + $T + "\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?:[A-Z]+,?\\s+)?(?<mon>[A-Z]{3,9})\\.?\\s+(?<d>[0-9]{1,2}),?\\s+(?<y>[0-9]{4})(?:,?\\s+" + $T + ")?\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?:[A-Z]+\\s+)?(?<mon>[A-Z]{3,9})\\s+(?<d>[0-9]{1,2})\\s+" + $T + "\\s+(?:" + $Z + "\\s+)?(?<y>[0-9]{4})$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?<d>[0-9]{1,2})/(?<mon>[A-Z]{3})/(?<y>[0-9]{4}):" + $T + "\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.))
                  ) // null
                end;
            if $ts == null then null
            elif ($ts | type) == "number" then _num_ms($ts)
            elif ($ts | type) == "string" then _str($ts)
            elif ($ts | type) == "object" then
              if   $ts["$date"] != null then to_epoch_ms($ts["$date"])
              elif $ts["$numberLong"] != null then to_epoch_ms($ts["$numberLong"])
              elif $ts.seconds != null then
                ($ts.seconds | tostring | tonumber) * 1000
                + ((($ts.nanos // 0) | tostring | tonumber) / 1000000 | floor)
              else null end
            else null end;

          . as $r
          | ($r.user // {}) as $u
          | ($r.account // {}) as $acct
          # Emit an account object only when there's a real uid/name to satisfy
          # the account at_least_one[name,uid,...] constraint.
          | (if ($acct.id != null or $acct.name != null)
             then { "uid": $acct.id, "name": $acct.name, "type_id": 99 }
             else null end) as $acctobj
          | (([$u.first_name, $u.last_name] | map(select(. != null and . != "")) | join(" "))) as $full
          | ($r.email // $u.email) as $mail
          | {
              # --- Classification (REQUIRED) ---
              "category_uid": 5,
              "class_uid":    5003,
              "activity_id":  2,
              "type_uid":     500302,
              "severity_id":  1,

              # --- Time (REQUIRED) — inventory collection time (now) ---
              "time": (now * 1000 | floor),

              # --- Metadata (REQUIRED: product + version) ---
              # Declare cloud + osint profiles so those objects are legal on
              # this class (class 5003 supports both).
              "metadata": {
                "version": "1.9.0",
                "product": {
                  "vendor_name": "Cloudflare",
                  "name": "Cloudflare Account Members"
                },
                "profiles": ["cloud", "osint"]
              },

              # --- User (REQUIRED; constraint at_least_one[account,name,uid]) ---
              "user": {
                "uid":         ($u.id // $r.id),
                "name":        ($mail // $r.id),
                "email_addr":  $mail,
                "full_name":   (if $full == "" then null else $full end),
                "type_id":     1,
                "has_mfa":     $u.two_factor_authentication_enabled,
                "account": $acctobj,
                "groups": (
                  ($r.roles // [])
                  | map(select(.name != null) | { "uid": .id, "name": .name, "desc": .description })
                )
              },

              # --- Cloud (REQUIRED: provider) ---
              "cloud": {
                "provider": "Cloudflare",
                "account": $acctobj
              },

              # --- OSINT (REQUIRED; array of object_t) ---
              # type_id 8 = Email Address; the member email is the indicator.
              "osint": [
                {
                  "value":   ($mail // ($u.id // $r.id)),
                  "type_id": (if $mail != null then 8 else 99 end)
                }
              ],

              # --- Recommended ---
              # Raw Cloudflare membership status ("accepted"/"pending") is a
              # free-form string, not the OCSF status_id enum, so carry it in
              # status_detail to avoid an enum-sibling mismatch.
              "status_detail": ($r.status // null),
              "message": ("Cloudflare account membership for " + ($mail // ($r.id // "unknown"))),

              # --- Observables ---
              "observables": (
                [ (if $mail != null then { "name": "user.email_addr", "type_id": 5, "value": $mail } else empty end),
                  (if ($u.id // $r.id) != null then { "name": "user.uid", "type_id": 10, "value": ($u.id // $r.id) } else empty end)
                ]
              ),

              # --- Original record for audit ---
              "raw_data": ($r | tostring)
            }
          # Single end-of-pipeline prune of nulls/empties (keeps required objects).
          | walk( if type == "object" then with_entries(select(.value != null and .value != "" and .value != [] and .value != {})) else . end )
