name: "Cloudflare Audit Logs to OCSF v1.9.0"
description: "Transforms Cloudflare account Audit Log records into the OCSF v1.9.0 API Activity class (class_uid 6003)."
author: "Monad"
contributors:
  - "https://github.com/behobu"
inputs:
  - "cloudflare-audit-logs"
tags:
  - "v1.9.0"
  - "ocsf"
  - "cloudflare"
  - "application"
config:
  operations:
    - operation: "jq"
      arguments:
        key: ""
        query: |
          # ---------------------------------------------------------------
          # OCSF API Activity (class_uid=6003, category_uid=6) — v1.9.0
          # Input: ONE Cloudflare (classic) audit-log record per invocation
          #   as emitted by the Monad `cloudflare-audit-logs` connector:
          #   { id, action{type,result}, actor{id,email,ip,type}, interface,
          #     metadata{...}, newValue, oldValue, owner{id},
          #     resource{id,type}, when }
          #
          # A Cloudflare audit log is an administrative CRUD action taken on
          # a Cloudflare resource through an interface (API / dashboard),
          # which maps cleanly onto OCSF API Activity.
          # ---------------------------------------------------------------


          # Recursively drop null / "" / {} / [] so the event stays compact.
          # osint is re-attached AFTER the prune (it is a required attribute
          # that legitimately carries an empty array here).
          def to_epoch_ms($ts):
            def _n: if . == null then null else tonumber end;
            def _num_ms($n):
              if   $n >= 1e17 then ($n / 1000000 | floor)
              elif $n >= 1e14 then ($n / 1000 | floor)
              elif $n >= 1e11 then ($n | floor)
              else ($n * 1000 + 0.001 | floor) end;
            def _digits_ms($d):
              ($d | ltrimstr("-") | length) as $l
              | if   $l >= 18 then ($d[0:-6] | tonumber)
                elif $l >= 15 then ($d[0:-3] | tonumber)
                elif $l >= 12 then ($d | tonumber)
                else ($d | tonumber) * 1000 end;
            def _frac_ms($f): if $f == null then 0 else (($f + "000")[0:3] | tonumber) end;
            def _mon($m):
              if $m == null then null
              else {"JAN":1,"FEB":2,"MAR":3,"APR":4,"MAY":5,"JUN":6,
                    "JUL":7,"AUG":8,"SEP":9,"OCT":10,"NOV":11,"DEC":12}[$m[0:3]] end;
            def _zone($z):
              if $z == null or $z == "" then 0
              else
                ($z | if test("^(UTC|GMT|UT)[+-]") then sub("^(UTC|GMT|UT)"; "") else . end) as $z
                | if ($z | test("^[+-][0-9]{1,2}(:?[0-9]{2})?$")) then
                    ($z | capture("^(?<sg>[+-])(?<h>[0-9]{1,2}):?(?<m>[0-9]{2})?$")) as $o
                    | (if $o.sg == "-" then -1 else 1 end)
                      * (($o.h | tonumber) * 3600 + (($o.m // "0") | tonumber) * 60)
                  else
                    {"Z":0,"UTC":0,"GMT":0,"UT":0,"EST":-18000,"EDT":-14400,"CST":-21600,
                     "CDT":-18000,"MST":-25200,"MDT":-21600,"PST":-28800,"PDT":-25200}[$z]
                  end
              end;
            def _ms($c):
              ($c.y | tonumber | if . < 100 then (if . < 70 then . + 2000 else . + 1900 end) else . end) as $y
              | ($c.mo | _n) as $mo
              | ($c.d | tonumber) as $d
              | (($c.h // "0") | tonumber) as $h
              | (($c.mi // "0") | tonumber) as $mi
              | (($c.s // "0") | tonumber) as $s
              | _zone($c.z) as $off
              | if $mo == null or $off == null or $mo < 1 or $mo > 12 or $d < 1 or $d > 31
                   or $h > 23 or $mi > 59 or $s > 60 then null
                else
                  ($y - (if $mo <= 2 then 1 else 0 end)) as $yy
                  | ($yy / 400 | floor) as $era
                  | ($yy - $era * 400) as $yoe
                  | (((153 * ($mo + (if $mo > 2 then -3 else 9 end)) + 2) / 5 | floor) + $d - 1) as $doy
                  | ($yoe * 365 + ($yoe / 4 | floor) - ($yoe / 100 | floor) + $doy) as $doe
                  | ($era * 146097 + $doe - 719468) as $days
                  | ($days * 86400 + $h * 3600 + $mi * 60 + $s - $off) * 1000 + _frac_ms($c.f)
                end;
            def _str($raw):
              ($raw | ascii_upcase | sub("\\s*\\([^)]*\\)\\s*$"; "") | sub("^\\s+"; "") | sub("\\s+$"; "")) as $s
              | "(?<z>Z|(?:UTC|GMT|UT)?[+-][0-9]{1,2}(?::?[0-9]{2})?|[A-Z]{1,5})" as $Z
              | "(?<h>[0-9]{1,2}):(?<mi>[0-9]{2})(?::(?<s>[0-9]{2}))?(?:[.,](?<f>[0-9]+))?" as $T
              | if $s == "" then null
                elif ($s | test("^-?[0-9]+$")) then _digits_ms($s)
                elif ($s | test("^[0-9]+\\.[0-9]+$")) then
                  ($s | split(".")) as $p
                  | if ($p[0] | length) <= 11 then _digits_ms($p[0]) + _frac_ms($p[1])
                    else _digits_ms($p[0]) end
                elif ($s | test("^/DATE\\(-?[0-9]+([+-][0-9]{4})?\\)/$")) then
                  ($s | capture("(?<ms>-?[0-9]+)").ms | tonumber)
                else
                  first(
                    ($s | capture("^(?<y>[0-9]{4})[-/](?<mo>[0-9]{1,2})[-/](?<d>[0-9]{1,2})(?:[T ]+" + $T + ")?\\s*" + $Z + "?(?:\\s+[A-Z]{2,5})?$") | _ms(.)),
                    ($s | capture("^(?<y>[0-9]{4})(?<mo>[0-9]{2})(?<d>[0-9]{2})T(?<h>[0-9]{2})(?<mi>[0-9]{2})(?<s>[0-9]{2})(?:[.,](?<f>[0-9]+))?" + $Z + "?$") | _ms(.)),
                    ($s | capture("^(?:[A-Z]+,?\\s+)?(?<d>[0-9]{1,2})[ -](?<mon>[A-Z]{3,9})[ -](?<y>[0-9]{2,4})\\s+" + $T + "\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?:[A-Z]+,?\\s+)?(?<mon>[A-Z]{3,9})\\.?\\s+(?<d>[0-9]{1,2}),?\\s+(?<y>[0-9]{4})(?:,?\\s+" + $T + ")?\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?:[A-Z]+\\s+)?(?<mon>[A-Z]{3,9})\\s+(?<d>[0-9]{1,2})\\s+" + $T + "\\s+(?:" + $Z + "\\s+)?(?<y>[0-9]{4})$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?<d>[0-9]{1,2})/(?<mon>[A-Z]{3})/(?<y>[0-9]{4}):" + $T + "\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.))
                  ) // null
                end;
            if $ts == null then null
            elif ($ts | type) == "number" then _num_ms($ts)
            elif ($ts | type) == "string" then _str($ts)
            elif ($ts | type) == "object" then
              if   $ts["$date"] != null then to_epoch_ms($ts["$date"])
              elif $ts["$numberLong"] != null then to_epoch_ms($ts["$numberLong"])
              elif $ts.seconds != null then
                ($ts.seconds | tostring | tonumber) * 1000
                + ((($ts.nanos // 0) | tostring | tonumber) / 1000000 | floor)
              else null end
            else null end;

          def prune_blank:
            walk(if type == "object" then with_entries(select(.value != null and .value != "" and .value != {} and .value != []))
                 elif type == "array" then map(select(. != null and . != "" and . != {} and . != []))
                 else . end);

          . as $r
          | ($r.action // {}) as $act
          | ($r.actor // {}) as $ac
          | ($r.resource // {}) as $res
          | ($act.type // "") as $atype

          # ---- activity_id from the action verb --------------------------
          | ( if   ($atype | test("(?i)(^|_)(create|add|new|provision|register|invoke)"))  then 1
              elif ($atype | test("(?i)(^|_)(delete|remove|revoke|deregister|purge|disable)")) then 4
              elif ($atype | test("(?i)(^|_)(view|read|get|list|download|export)"))         then 2
              elif ($atype | test("(?i)(change|update|set|edit|modify|rotate|enable|patch)")) then 3
              else 99 end ) as $activity_id

          # action.result is a bool in the classic schema (true = success).
          | ( ($act.result == true) or (($act.result | type) == "string" and ($act.result | ascii_downcase) == "true") ) as $ok

          | ({
              # --- Classification (REQUIRED) ---
              "category_uid": 6,
              "class_uid":    6003,
              "activity_id":  $activity_id,
              "type_uid":     (6003 * 100 + $activity_id),
              "severity_id":  (if $ok then 1 else 3 end),
              "status_id":    (if $ok then 1 else 2 end),

              # --- Time (REQUIRED) ---
              "time": to_epoch_ms($r.when),

              # --- Metadata (REQUIRED) ---
              "metadata": {
                "profiles": ["cloud", "osint"],
                "version": "1.9.0",
                "product": {
                  "vendor_name": "Cloudflare",
                  "name": "Cloudflare Audit Logs"
                },
                "uid": $r.id,
                "log_provider": "Cloudflare"
              },

              # --- Cloud (REQUIRED by API Activity; provider required) ---
              "cloud": {
                "provider": "Cloudflare"
              },

              # --- Actor (REQUIRED) ---
              "actor": {
                "user": {
                  "uid": $ac.id,
                  "name": ($ac.email // $ac.id),
                  "email_addr": $ac.email,
                  "type": ($ac.type // "Unknown")
                }
              },

              # --- API (REQUIRED; operation required) ---
              "api": {
                "operation": (if $atype == "" then "unknown" else $atype end),
                "service": { "name": ($r.metadata.type // $res.type) }
              },

              # --- Source endpoint (REQUIRED) ---
              "src_endpoint": {
                "ip": $ac.ip
              },

              # --- Recommended ---
              "activity_name": (if $activity_id == 99 then $atype else null end),
              "status": (if $ok then "Success" else "Failure" end),
              "message": ("Cloudflare " + $atype + (if ($res.type // "") != "" then (" on " + $res.type) else "" end)),

              "resources": [ {
                "uid": $res.id,
                "type": $res.type,
                "name": ($r.metadata.name // $r.metadata.zone_name)
              } ],

              # --- Fields with no clean OCSF home ---
              "unmapped": {
                "interface": $r.interface,
                "owner_id": ($r.owner // {}).id,
                "old_value": (if $r.oldValue != null then ($r.oldValue | tostring) else null end),
                "new_value": (if $r.newValue != null then ($r.newValue | tostring) else null end),
                "metadata": $r.metadata
              },

              "observables": ( [
                (if ($ac.email // null) != null then {"name":"actor.user.email_addr","type_id":5,"type":"Email Address","value":$ac.email} else null end),
                (if ($ac.ip // null) != null then {"name":"src_endpoint.ip","type_id":2,"type":"IP Address","value":$ac.ip} else null end)
              ] | map(select(. != null)) ),

              "raw_data": ($r | tostring)
            } | prune_blank)

          # osint is a REQUIRED attribute of API Activity but has no source
          # here; attach an empty array after the prune so it survives.
          | . + { "osint": [] }
