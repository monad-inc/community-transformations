name: "Box Users to OCSF v1.9.0"
description: "Transforms Box User account records (Admin API /2.0/users) into the OCSF v1.9.0 User Inventory Info class (5003)."
author: "Monad"
contributors:
  - "https://github.com/behobu"
inputs:
  - "box-users"
tags:
  - "v1.9.0"
  - "ocsf"
  - "box"
  - "discovery"
  - "identity"
config:
  operations:
    - operation: "jq"
      arguments:
        key: ""
        query: |
          # ---------------------------------------------------------------
          # OCSF User Inventory Info (class_uid=5003, category_uid=5) — v1.9.0
          # Input: one Box User account record per invocation.
          # activity_id=2 (Collect) — records are proactively collected from
          # the Box Admin API user listing.
          # ---------------------------------------------------------------
          # RFC3339 with numeric offset (Box: "2026-08-01T18:20:00-07:00") -> epoch seconds (UTC)

          def to_epoch_ms($ts):
            def _n: if . == null then null else tonumber end;
            def _num_ms($n):
              if   $n >= 1e17 then ($n / 1000000 | floor)
              elif $n >= 1e14 then ($n / 1000 | floor)
              elif $n >= 1e11 then ($n | floor)
              else ($n * 1000 + 0.001 | floor) end;
            def _digits_ms($d):
              ($d | ltrimstr("-") | length) as $l
              | if   $l >= 18 then ($d[0:-6] | tonumber)
                elif $l >= 15 then ($d[0:-3] | tonumber)
                elif $l >= 12 then ($d | tonumber)
                else ($d | tonumber) * 1000 end;
            def _frac_ms($f): if $f == null then 0 else (($f + "000")[0:3] | tonumber) end;
            def _mon($m):
              if $m == null then null
              else {"JAN":1,"FEB":2,"MAR":3,"APR":4,"MAY":5,"JUN":6,
                    "JUL":7,"AUG":8,"SEP":9,"OCT":10,"NOV":11,"DEC":12}[$m[0:3]] end;
            def _zone($z):
              if $z == null or $z == "" then 0
              else
                ($z | if test("^(UTC|GMT|UT)[+-]") then sub("^(UTC|GMT|UT)"; "") else . end) as $z
                | if ($z | test("^[+-][0-9]{1,2}(:?[0-9]{2})?$")) then
                    ($z | capture("^(?<sg>[+-])(?<h>[0-9]{1,2}):?(?<m>[0-9]{2})?$")) as $o
                    | (if $o.sg == "-" then -1 else 1 end)
                      * (($o.h | tonumber) * 3600 + (($o.m // "0") | tonumber) * 60)
                  else
                    {"Z":0,"UTC":0,"GMT":0,"UT":0,"EST":-18000,"EDT":-14400,"CST":-21600,
                     "CDT":-18000,"MST":-25200,"MDT":-21600,"PST":-28800,"PDT":-25200}[$z]
                  end
              end;
            def _ms($c):
              ($c.y | tonumber | if . < 100 then (if . < 70 then . + 2000 else . + 1900 end) else . end) as $y
              | ($c.mo | _n) as $mo
              | ($c.d | tonumber) as $d
              | (($c.h // "0") | tonumber) as $h
              | (($c.mi // "0") | tonumber) as $mi
              | (($c.s // "0") | tonumber) as $s
              | _zone($c.z) as $off
              | if $mo == null or $off == null or $mo < 1 or $mo > 12 or $d < 1 or $d > 31
                   or $h > 23 or $mi > 59 or $s > 60 then null
                else
                  ($y - (if $mo <= 2 then 1 else 0 end)) as $yy
                  | ($yy / 400 | floor) as $era
                  | ($yy - $era * 400) as $yoe
                  | (((153 * ($mo + (if $mo > 2 then -3 else 9 end)) + 2) / 5 | floor) + $d - 1) as $doy
                  | ($yoe * 365 + ($yoe / 4 | floor) - ($yoe / 100 | floor) + $doy) as $doe
                  | ($era * 146097 + $doe - 719468) as $days
                  | ($days * 86400 + $h * 3600 + $mi * 60 + $s - $off) * 1000 + _frac_ms($c.f)
                end;
            def _str($raw):
              ($raw | ascii_upcase | sub("\\s*\\([^)]*\\)\\s*$"; "") | sub("^\\s+"; "") | sub("\\s+$"; "")) as $s
              | "(?<z>Z|(?:UTC|GMT|UT)?[+-][0-9]{1,2}(?::?[0-9]{2})?|[A-Z]{1,5})" as $Z
              | "(?<h>[0-9]{1,2}):(?<mi>[0-9]{2})(?::(?<s>[0-9]{2}))?(?:[.,](?<f>[0-9]+))?" as $T
              | if $s == "" then null
                elif ($s | test("^-?[0-9]+$")) then _digits_ms($s)
                elif ($s | test("^[0-9]+\\.[0-9]+$")) then
                  ($s | split(".")) as $p
                  | if ($p[0] | length) <= 11 then _digits_ms($p[0]) + _frac_ms($p[1])
                    else _digits_ms($p[0]) end
                elif ($s | test("^/DATE\\(-?[0-9]+([+-][0-9]{4})?\\)/$")) then
                  ($s | capture("(?<ms>-?[0-9]+)").ms | tonumber)
                else
                  first(
                    ($s | capture("^(?<y>[0-9]{4})[-/](?<mo>[0-9]{1,2})[-/](?<d>[0-9]{1,2})(?:[T ]+" + $T + ")?\\s*" + $Z + "?(?:\\s+[A-Z]{2,5})?$") | _ms(.)),
                    ($s | capture("^(?<y>[0-9]{4})(?<mo>[0-9]{2})(?<d>[0-9]{2})T(?<h>[0-9]{2})(?<mi>[0-9]{2})(?<s>[0-9]{2})(?:[.,](?<f>[0-9]+))?" + $Z + "?$") | _ms(.)),
                    ($s | capture("^(?:[A-Z]+,?\\s+)?(?<d>[0-9]{1,2})[ -](?<mon>[A-Z]{3,9})[ -](?<y>[0-9]{2,4})\\s+" + $T + "\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?:[A-Z]+,?\\s+)?(?<mon>[A-Z]{3,9})\\.?\\s+(?<d>[0-9]{1,2}),?\\s+(?<y>[0-9]{4})(?:,?\\s+" + $T + ")?\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?:[A-Z]+\\s+)?(?<mon>[A-Z]{3,9})\\s+(?<d>[0-9]{1,2})\\s+" + $T + "\\s+(?:" + $Z + "\\s+)?(?<y>[0-9]{4})$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?<d>[0-9]{1,2})/(?<mon>[A-Z]{3})/(?<y>[0-9]{4}):" + $T + "\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.))
                  ) // null
                end;
            if $ts == null then null
            elif ($ts | type) == "number" then _num_ms($ts)
            elif ($ts | type) == "string" then _str($ts)
            elif ($ts | type) == "object" then
              if   $ts["$date"] != null then to_epoch_ms($ts["$date"])
              elif $ts["$numberLong"] != null then to_epoch_ms($ts["$numberLong"])
              elif $ts.seconds != null then
                ($ts.seconds | tostring | tonumber) * 1000
                + ((($ts.nanos // 0) | tostring | tonumber) / 1000000 | floor)
              else null end
            else null end;

          . as $u |
          # Box role -> OCSF user.type_id: admin/coadmin => Admin(2), else User(1)
          (if ($u.role // "user") == "admin" or ($u.role // "") == "coadmin"
             then 2 else 1 end) as $utype |
          2 as $activity_id |

          {
            "category_uid": 5,
            "class_uid": 5003,
            "type_uid": (5003 * 100 + $activity_id),
            "activity_id": $activity_id,
            "activity_name": "Collect",
            "severity_id": 1,
            "severity": "Informational",

            "time": to_epoch_ms($u.modified_at // $u.created_at),

            "metadata": {
              "version": "1.9.0",
              "profiles": ["cloud", "osint"],
              "product": {
                "vendor_name": "Box",
                "name": "Box"
              },
              "original_time": ($u.modified_at // $u.created_at)
            },

            # --- Cloud (required by class) ---
            "cloud": ({
              "provider": "Box"
            } + (if ($u.enterprise.id // "") != "" then {
              "account": {
                "uid": ($u.enterprise.id | tostring),
                "name": ($u.enterprise.name // ""),
                "type_id": 99
              }
            } else {} end)),

            # --- OSINT (required by class): the user's login email as an indicator ---
            "osint": [{
              "value": ($u.login // ($u.id | tostring)),
              "type_id": (if ($u.login // "") != "" then 9 else 0 end)
            }],

            # --- User (required by class) ---
            "user": ({
              "uid": ($u.id | tostring),
              "type_id": $utype
            }
            + (if ($u.login // "") != "" then {"name": $u.login, "email_addr": $u.login} else {} end)
            + (if ($u.name // "") != "" then {"full_name": $u.name} else {} end)
            + {"type": (if $utype == 2 then "Admin" else "User" end)}
            + (if ($u.enterprise.id // "") != "" then {
                "org": {
                  "uid": ($u.enterprise.id | tostring),
                  "name": ($u.enterprise.name // "")
                },
                "account": {
                  "uid": ($u.enterprise.id | tostring),
                  "name": ($u.enterprise.name // ""),
                  "type_id": 99
                }
              } else {} end)
            + (if ($u.is_exempt_from_login_verification // null) != null
                 then {"has_mfa": ($u.is_exempt_from_login_verification | not)} else {} end)),

            "message": (
              "Box user " + ($u.login // ($u.id | tostring))
              + " (" + ($u.status // "unknown") + ", role " + ($u.role // "user") + ")"
            ),

            "enrichments": ([
              (if ($u.job_title // "") != "" then {"name": "job_title", "value": $u.job_title, "data": {"job_title": $u.job_title}} else null end),
              (if ($u.space_used // null) != null then {"name": "space_used", "value": ($u.space_used | tostring), "data": {"space_used": $u.space_used, "space_amount": $u.space_amount}} else null end)
            ] | map(select(. != null))),

            "observables": ([
              (if ($u.login // "") != "" then {"name": "user.email_addr", "type_id": 5, "value": $u.login} else null end),
              (if ($u.id // null) != null then {"name": "user.uid", "type_id": 0, "value": ($u.id | tostring)} else null end)
            ] | map(select(. != null))),

            "unmapped": ({}
              + (if ($u.role // "") != "" then {"role": $u.role} else {} end)
              + (if ($u.status // "") != "" then {"status": $u.status} else {} end)
              + (if ($u.language // "") != "" then {"language": $u.language} else {} end)
              + (if ($u.timezone // "") != "" then {"timezone": $u.timezone} else {} end)
              + (if ($u.phone // "") != "" then {"phone": $u.phone} else {} end)
              + (if ($u.address // "") != "" then {"address": $u.address} else {} end)
              + (if ($u.max_upload_size // null) != null then {"max_upload_size": $u.max_upload_size} else {} end)
              + (if ($u.is_platform_access_only // null) != null then {"is_platform_access_only": $u.is_platform_access_only} else {} end)
              + (if ($u.is_sync_enabled // null) != null then {"is_sync_enabled": $u.is_sync_enabled} else {} end)
              + (if ($u.tracking_codes // null) != null then {"tracking_codes": $u.tracking_codes} else {} end))
          }
