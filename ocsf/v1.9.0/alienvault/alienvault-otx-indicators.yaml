name: "AlienVault OTX Indicators to OCSF v1.9.0"
description: "Transforms AlienVault OTX IOC indicator records (enriched with parent-pulse threat context) into the OCSF v1.9.0 Detection Finding class (class_uid 2004) using the OSINT object."
author: "Monad"
contributors:
  - "https://github.com/behobu"
inputs:
  - "alienvault-otx-indicators"
tags:
  - "v1.9.0"
  - "ocsf"
  - "alienvault"
  - "findings"
config:
  operations:
    - operation: "jq"
      arguments:
        key: ""
        query: |
          # ---------------------------------------------------------------
          # OCSF Detection Finding (class_uid=2004) — v1.9.0
          # Input: ONE AlienVault OTX indicator record per invocation, as
          #   emitted by the Monad `alienvault-otx-indicators` connector:
          #   an IOC (indicator/type/created/role/...) enriched with a nested
          #   parent-pulse object under `.pulse`.
          #
          # A threat-intel indicator is modeled as a Detection Finding that
          # carries the IOC in the required `osint` object; the pulse supplies
          # the finding title, references, and threat actor context.
          # ---------------------------------------------------------------


          def to_epoch_ms($ts):
            def _n: if . == null then null else tonumber end;
            def _num_ms($n):
              if   $n >= 1e17 then ($n / 1000000 | floor)
              elif $n >= 1e14 then ($n / 1000 | floor)
              elif $n >= 1e11 then ($n | floor)
              else ($n * 1000 + 0.001 | floor) end;
            def _digits_ms($d):
              ($d | ltrimstr("-") | length) as $l
              | if   $l >= 18 then ($d[0:-6] | tonumber)
                elif $l >= 15 then ($d[0:-3] | tonumber)
                elif $l >= 12 then ($d | tonumber)
                else ($d | tonumber) * 1000 end;
            def _frac_ms($f): if $f == null then 0 else (($f + "000")[0:3] | tonumber) end;
            def _mon($m):
              if $m == null then null
              else {"JAN":1,"FEB":2,"MAR":3,"APR":4,"MAY":5,"JUN":6,
                    "JUL":7,"AUG":8,"SEP":9,"OCT":10,"NOV":11,"DEC":12}[$m[0:3]] end;
            def _zone($z):
              if $z == null or $z == "" then 0
              else
                ($z | if test("^(UTC|GMT|UT)[+-]") then sub("^(UTC|GMT|UT)"; "") else . end) as $z
                | if ($z | test("^[+-][0-9]{1,2}(:?[0-9]{2})?$")) then
                    ($z | capture("^(?<sg>[+-])(?<h>[0-9]{1,2}):?(?<m>[0-9]{2})?$")) as $o
                    | (if $o.sg == "-" then -1 else 1 end)
                      * (($o.h | tonumber) * 3600 + (($o.m // "0") | tonumber) * 60)
                  else
                    {"Z":0,"UTC":0,"GMT":0,"UT":0,"EST":-18000,"EDT":-14400,"CST":-21600,
                     "CDT":-18000,"MST":-25200,"MDT":-21600,"PST":-28800,"PDT":-25200}[$z]
                  end
              end;
            def _ms($c):
              ($c.y | tonumber | if . < 100 then (if . < 70 then . + 2000 else . + 1900 end) else . end) as $y
              | ($c.mo | _n) as $mo
              | ($c.d | tonumber) as $d
              | (($c.h // "0") | tonumber) as $h
              | (($c.mi // "0") | tonumber) as $mi
              | (($c.s // "0") | tonumber) as $s
              | _zone($c.z) as $off
              | if $mo == null or $off == null or $mo < 1 or $mo > 12 or $d < 1 or $d > 31
                   or $h > 23 or $mi > 59 or $s > 60 then null
                else
                  ($y - (if $mo <= 2 then 1 else 0 end)) as $yy
                  | ($yy / 400 | floor) as $era
                  | ($yy - $era * 400) as $yoe
                  | (((153 * ($mo + (if $mo > 2 then -3 else 9 end)) + 2) / 5 | floor) + $d - 1) as $doy
                  | ($yoe * 365 + ($yoe / 4 | floor) - ($yoe / 100 | floor) + $doy) as $doe
                  | ($era * 146097 + $doe - 719468) as $days
                  | ($days * 86400 + $h * 3600 + $mi * 60 + $s - $off) * 1000 + _frac_ms($c.f)
                end;
            def _str($raw):
              ($raw | ascii_upcase | sub("\\s*\\([^)]*\\)\\s*$"; "") | sub("^\\s+"; "") | sub("\\s+$"; "")) as $s
              | "(?<z>Z|(?:UTC|GMT|UT)?[+-][0-9]{1,2}(?::?[0-9]{2})?|[A-Z]{1,5})" as $Z
              | "(?<h>[0-9]{1,2}):(?<mi>[0-9]{2})(?::(?<s>[0-9]{2}))?(?:[.,](?<f>[0-9]+))?" as $T
              | if $s == "" then null
                elif ($s | test("^-?[0-9]+$")) then _digits_ms($s)
                elif ($s | test("^[0-9]+\\.[0-9]+$")) then
                  ($s | split(".")) as $p
                  | if ($p[0] | length) <= 11 then _digits_ms($p[0]) + _frac_ms($p[1])
                    else _digits_ms($p[0]) end
                elif ($s | test("^/DATE\\(-?[0-9]+([+-][0-9]{4})?\\)/$")) then
                  ($s | capture("(?<ms>-?[0-9]+)").ms | tonumber)
                else
                  first(
                    ($s | capture("^(?<y>[0-9]{4})[-/](?<mo>[0-9]{1,2})[-/](?<d>[0-9]{1,2})(?:[T ]+" + $T + ")?\\s*" + $Z + "?(?:\\s+[A-Z]{2,5})?$") | _ms(.)),
                    ($s | capture("^(?<y>[0-9]{4})(?<mo>[0-9]{2})(?<d>[0-9]{2})T(?<h>[0-9]{2})(?<mi>[0-9]{2})(?<s>[0-9]{2})(?:[.,](?<f>[0-9]+))?" + $Z + "?$") | _ms(.)),
                    ($s | capture("^(?:[A-Z]+,?\\s+)?(?<d>[0-9]{1,2})[ -](?<mon>[A-Z]{3,9})[ -](?<y>[0-9]{2,4})\\s+" + $T + "\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?:[A-Z]+,?\\s+)?(?<mon>[A-Z]{3,9})\\.?\\s+(?<d>[0-9]{1,2}),?\\s+(?<y>[0-9]{4})(?:,?\\s+" + $T + ")?\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?:[A-Z]+\\s+)?(?<mon>[A-Z]{3,9})\\s+(?<d>[0-9]{1,2})\\s+" + $T + "\\s+(?:" + $Z + "\\s+)?(?<y>[0-9]{4})$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?<d>[0-9]{1,2})/(?<mon>[A-Z]{3})/(?<y>[0-9]{4}):" + $T + "\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.))
                  ) // null
                end;
            if $ts == null then null
            elif ($ts | type) == "number" then _num_ms($ts)
            elif ($ts | type) == "string" then _str($ts)
            elif ($ts | type) == "object" then
              if   $ts["$date"] != null then to_epoch_ms($ts["$date"])
              elif $ts["$numberLong"] != null then to_epoch_ms($ts["$numberLong"])
              elif $ts.seconds != null then
                ($ts.seconds | tostring | tonumber) * 1000
                + ((($ts.nanos // 0) | tostring | tonumber) / 1000000 | floor)
              else null end
            else null end;

          . as $r
          | ($r.type // "") as $itype
          | ($r.pulse // {}) as $p
          | ($r.role // "") as $role

          # OTX indicator type -> OCSF osint.type_id
          | ( { "IPv4":1, "IPv6":1, "CIDR":1,
                "domain":2,
                "hostname":3,
                "URL":5, "URI":5,
                "FileHash-MD5":4, "FileHash-SHA1":4, "FileHash-SHA256":4,
                "FileHash-PEHASH":4, "FileHash-IMPHASH":4, "FileHash-SSDEEP":4,
                "email":9,
                "CVE":10,
                "FilePath":11, "Mutex":11 }[$itype] // 0 ) as $osint_type_id

          # role -> OCSF severity_id (Unknown/Info/Low/Medium/High/Critical)
          | ( { "malware_hosting":4, "c2":5, "command_and_control":5,
                "exploit_hosting":4, "phishing":4, "scanning_host":3,
                "malware":4, "bruteforce":3 }[$role] // 3 ) as $sev

          | {
              "category_uid": 2,
              "class_uid":    2004,
              "activity_id":  1,
              "type_uid":     200401,
              "severity_id":  $sev,

              "time": to_epoch_ms($r.created),

              "metadata": {
                "profiles": ["cloud", "osint"],
                "version": "1.9.0",
                "product": {
                  "vendor_name": "AlienVault",
                  "name": "Open Threat Exchange (OTX)"
                }
              },

              # The feed source of the indicator. Detection Finding requires a
              # cloud object in the bundled schema; the OTX feed is the provider.
              "cloud": {
                "provider": "AlienVault OTX"
              },

              "finding_info": {
                "uid": ($r.id // $r.indicator | tostring),
                "title": ($p.name // $r.title // ("OTX indicator: " + ($r.indicator // "unknown"))),
                "desc": ($r.description // $r.content // $p.description // null),
                "types": (if $itype == "" then null else [$itype] end),
                "src_url": ($p.references[0]? // null)
              },

              # OSINT object carries the IOC itself (required: value, type_id).
              # osint is an array of OSINT objects on Detection Finding.
              "osint": [{
                "value": ($r.indicator // ""),
                "type_id": $osint_type_id,
                "type": (if $itype == "" then null else $itype end),
                "tlp": (if ($p.tlp // "") == "" then null else ($p.tlp | ascii_upcase) end),
                "confidence_id": (if ($r.is_active // 0) == 1 then 2 else 0 end),
                "name": ($r.title // null),
                "desc": ($r.description // $r.content // null),
                "uid": ($r.id | tostring),
                "created_time": to_epoch_ms($r.created),
                "expiration_time": to_epoch_ms($r.expiration),
                "labels": ($p.tags // null),
                "threat_actor": (if ($p.adversary // "") == "" then null
                                 else { "name": $p.adversary } end),
                # malware.classification_ids is required; source has only
                # family names, so classification is Unknown (0).
                "malware": (if ($p.malware_families // []) | length > 0
                            then [ $p.malware_families[]
                                   | { "name": ., "classification_ids": [0] } ]
                            else null end),
                # OTX attack_ids are MITRE ATT&CK technique IDs -> attacks[].technique.
                "attacks": (if ($p.attack_ids // []) | length > 0
                            then [ $p.attack_ids[] | { "technique": { "uid": . } } ]
                            else null end)
              }],

              "status_id": (if ($r.is_active // 0) == 1 then 1 else 3 end),
              "message": (($p.name // "OTX indicator")
                          + " — " + ($itype // "indicator")
                          + " " + ($r.indicator // "")),

              "observables": (
                [ { "name": "osint.value",
                    "type_id": (if $osint_type_id == 1 then 2
                                elif $osint_type_id == 2 then 1
                                elif $osint_type_id == 5 then 6
                                elif $osint_type_id == 4 then 8
                                else 0 end),
                    "value": ($r.indicator // "") } ]
              ),

              "unmapped": {
                "role": (if $role == "" then null else $role end),
                "targeted_countries": ($p.targeted_countries // null),
                "industries": ($p.industries // null),
                "pulse_id": ($p.id // null),
                "pulse_modified": ($p.modified // null)
              },

              "raw_data": ($r | tostring)
            }
          # prune null / empty leaves while keeping required objects populated
          | walk(
              if type == "object" then
                with_entries(select(.value != null and .value != {} and .value != []))
              elif type == "array" then
                map(select(. != null))
              else . end
            )
