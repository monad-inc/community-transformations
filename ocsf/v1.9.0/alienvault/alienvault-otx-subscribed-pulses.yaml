name: "AlienVault OTX Subscribed Pulses to OCSF v1.9.0"
description: "Transforms AlienVault OTX subscribed-pulse threat-intelligence records into the OCSF v1.9.0 Detection Finding (2004) class, carrying each pulse indicator as an OSINT object."
author: "Monad"
contributors:
  - "https://github.com/behobu"
inputs:
  - "alienvault-otx-subscribed-pulses"
tags:
  - "v1.9.0"
  - "ocsf"
  - "alienvault"
  - "findings"
config:
  operations:
    - operation: "jq"
      arguments:
        key: ""
        query: |
          # ---------------------------------------------------------------
          # OCSF Detection Finding (class_uid=2004) — v1.9.0
          # Input: one AlienVault OTX subscribed pulse per invocation
          #        (pulse metadata + its indicators[] array).
          # Each pulse indicator becomes one OSINT object (osint is a
          # required, array-valued attribute on this class via the OSINT
          # profile). Pulse-level threat context (adversary, malware
          # families, ATT&CK ids, target countries/industries) that has no
          # clean OCSF home is preserved under `unmapped`.
          # NOTE: the Detection Finding class marks `cloud` as required even
          # though OSINT feeds carry no cloud context; a minimal placeholder
          # provider is emitted to satisfy the schema.
          # ---------------------------------------------------------------

          # OTX indicator type -> OCSF osint.type_id enum
          def to_epoch_ms($ts):
            def _n: if . == null then null else tonumber end;
            def _num_ms($n):
              if   $n >= 1e17 then ($n / 1000000 | floor)
              elif $n >= 1e14 then ($n / 1000 | floor)
              elif $n >= 1e11 then ($n | floor)
              else ($n * 1000 + 0.001 | floor) end;
            def _digits_ms($d):
              ($d | ltrimstr("-") | length) as $l
              | if   $l >= 18 then ($d[0:-6] | tonumber)
                elif $l >= 15 then ($d[0:-3] | tonumber)
                elif $l >= 12 then ($d | tonumber)
                else ($d | tonumber) * 1000 end;
            def _frac_ms($f): if $f == null then 0 else (($f + "000")[0:3] | tonumber) end;
            def _mon($m):
              if $m == null then null
              else {"JAN":1,"FEB":2,"MAR":3,"APR":4,"MAY":5,"JUN":6,
                    "JUL":7,"AUG":8,"SEP":9,"OCT":10,"NOV":11,"DEC":12}[$m[0:3]] end;
            def _zone($z):
              if $z == null or $z == "" then 0
              else
                ($z | if test("^(UTC|GMT|UT)[+-]") then sub("^(UTC|GMT|UT)"; "") else . end) as $z
                | if ($z | test("^[+-][0-9]{1,2}(:?[0-9]{2})?$")) then
                    ($z | capture("^(?<sg>[+-])(?<h>[0-9]{1,2}):?(?<m>[0-9]{2})?$")) as $o
                    | (if $o.sg == "-" then -1 else 1 end)
                      * (($o.h | tonumber) * 3600 + (($o.m // "0") | tonumber) * 60)
                  else
                    {"Z":0,"UTC":0,"GMT":0,"UT":0,"EST":-18000,"EDT":-14400,"CST":-21600,
                     "CDT":-18000,"MST":-25200,"MDT":-21600,"PST":-28800,"PDT":-25200}[$z]
                  end
              end;
            def _ms($c):
              ($c.y | tonumber | if . < 100 then (if . < 70 then . + 2000 else . + 1900 end) else . end) as $y
              | ($c.mo | _n) as $mo
              | ($c.d | tonumber) as $d
              | (($c.h // "0") | tonumber) as $h
              | (($c.mi // "0") | tonumber) as $mi
              | (($c.s // "0") | tonumber) as $s
              | _zone($c.z) as $off
              | if $mo == null or $off == null or $mo < 1 or $mo > 12 or $d < 1 or $d > 31
                   or $h > 23 or $mi > 59 or $s > 60 then null
                else
                  ($y - (if $mo <= 2 then 1 else 0 end)) as $yy
                  | ($yy / 400 | floor) as $era
                  | ($yy - $era * 400) as $yoe
                  | (((153 * ($mo + (if $mo > 2 then -3 else 9 end)) + 2) / 5 | floor) + $d - 1) as $doy
                  | ($yoe * 365 + ($yoe / 4 | floor) - ($yoe / 100 | floor) + $doy) as $doe
                  | ($era * 146097 + $doe - 719468) as $days
                  | ($days * 86400 + $h * 3600 + $mi * 60 + $s - $off) * 1000 + _frac_ms($c.f)
                end;
            def _str($raw):
              ($raw | ascii_upcase | sub("\\s*\\([^)]*\\)\\s*$"; "") | sub("^\\s+"; "") | sub("\\s+$"; "")) as $s
              | "(?<z>Z|(?:UTC|GMT|UT)?[+-][0-9]{1,2}(?::?[0-9]{2})?|[A-Z]{1,5})" as $Z
              | "(?<h>[0-9]{1,2}):(?<mi>[0-9]{2})(?::(?<s>[0-9]{2}))?(?:[.,](?<f>[0-9]+))?" as $T
              | if $s == "" then null
                elif ($s | test("^-?[0-9]+$")) then _digits_ms($s)
                elif ($s | test("^[0-9]+\\.[0-9]+$")) then
                  ($s | split(".")) as $p
                  | if ($p[0] | length) <= 11 then _digits_ms($p[0]) + _frac_ms($p[1])
                    else _digits_ms($p[0]) end
                elif ($s | test("^/DATE\\(-?[0-9]+([+-][0-9]{4})?\\)/$")) then
                  ($s | capture("(?<ms>-?[0-9]+)").ms | tonumber)
                else
                  first(
                    ($s | capture("^(?<y>[0-9]{4})[-/](?<mo>[0-9]{1,2})[-/](?<d>[0-9]{1,2})(?:[T ]+" + $T + ")?\\s*" + $Z + "?(?:\\s+[A-Z]{2,5})?$") | _ms(.)),
                    ($s | capture("^(?<y>[0-9]{4})(?<mo>[0-9]{2})(?<d>[0-9]{2})T(?<h>[0-9]{2})(?<mi>[0-9]{2})(?<s>[0-9]{2})(?:[.,](?<f>[0-9]+))?" + $Z + "?$") | _ms(.)),
                    ($s | capture("^(?:[A-Z]+,?\\s+)?(?<d>[0-9]{1,2})[ -](?<mon>[A-Z]{3,9})[ -](?<y>[0-9]{2,4})\\s+" + $T + "\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?:[A-Z]+,?\\s+)?(?<mon>[A-Z]{3,9})\\.?\\s+(?<d>[0-9]{1,2}),?\\s+(?<y>[0-9]{4})(?:,?\\s+" + $T + ")?\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?:[A-Z]+\\s+)?(?<mon>[A-Z]{3,9})\\s+(?<d>[0-9]{1,2})\\s+" + $T + "\\s+(?:" + $Z + "\\s+)?(?<y>[0-9]{4})$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?<d>[0-9]{1,2})/(?<mon>[A-Z]{3})/(?<y>[0-9]{4}):" + $T + "\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.))
                  ) // null
                end;
            if $ts == null then null
            elif ($ts | type) == "number" then _num_ms($ts)
            elif ($ts | type) == "string" then _str($ts)
            elif ($ts | type) == "object" then
              if   $ts["$date"] != null then to_epoch_ms($ts["$date"])
              elif $ts["$numberLong"] != null then to_epoch_ms($ts["$numberLong"])
              elif $ts.seconds != null then
                ($ts.seconds | tostring | tonumber) * 1000
                + ((($ts.nanos // 0) | tostring | tonumber) / 1000000 | floor)
              else null end
            else null end;

          def osint_type_id($t):
            ($t // "" | ascii_downcase) as $l
            | if   $l == "ipv4" or $l == "ipv6" or $l == "cidr" then 1
              elif $l == "domain" then 2
              elif $l == "hostname" then 3
              elif ($l | startswith("filehash")) then 4
              elif $l == "url" or $l == "uri" then 5
              elif $l == "user agent" or $l == "useragent" then 6
              elif $l == "sslcertfingerprint" or $l == "x509" then 7
              elif $l == "email" then 9
              elif $l == "cve" then 10
              elif $l == "filepath" then 11
              else 99
              end;

          . as $p
          | (($p.TLP // "") | ascii_upcase) as $tlp
          | ($p.references // []) as $refs
          | {
              # --- Classification (REQUIRED) ---
              "category_uid": 2,
              "class_uid":    2004,
              "activity_id":  1,
              "type_uid":     (2004 * 100 + 1),
              "severity_id":  1,

              # --- Time (REQUIRED) ---
              "time": (to_epoch_ms($p.modified) // to_epoch_ms($p.created)),

              # --- Metadata (REQUIRED) ---
              "metadata": {
                "version": "1.9.0",
                "profiles": ["osint", "cloud"],
                "product": {
                  "vendor_name": "AlienVault",
                  "name": "Open Threat Exchange (OTX)"
                }
              },

              # --- Finding info (REQUIRED) ---
              "finding_info": {
                "uid":   ($p.id // "unknown" | tostring),
                "title": ($p.name // "OTX Pulse"),
                "desc":  $p.description,
                "src_url": ($refs[0]),
                "created_time":  to_epoch_ms($p.created),
                "modified_time": to_epoch_ms($p.modified)
              },

              # --- Cloud (REQUIRED by class; N/A for OSINT feed) ---
              "cloud": { "provider": "Other" },

              # --- OSINT (REQUIRED, array — one entry per indicator) ---
              "osint": [
                ($p.indicators // [])[]
                | {
                    "value":   .indicator,
                    "type_id": osint_type_id(.type),
                    "tlp":     (if $tlp == "" then null else $tlp end),
                    "name":    (if (.title // "") == "" then null else .title end),
                    "desc":    (if (.description // "") == "" then null else .description end),
                    "external_uid": (.id | tostring),
                    "created_time": to_epoch_ms(.created),
                    "expiration_time": to_epoch_ms(.expiration),
                    # raw OTX indicator type + role preserved as labels (the
                    # OCSF `type` string sibling must mirror the type_id enum
                    # caption, so the vendor string is kept here instead).
                    "labels": ([ .type, .role ] | map(select(. != null and . != ""))),
                    "references": $refs
                  }
                | with_entries(select(.value != null and .value != "" and .value != []))
              ],

              # --- Recommended ---
              "is_alert": false,
              "message": ($p.name // ""),
              "status_id": 1,

              # --- Pulse-level threat context with no clean OCSF home ---
              "unmapped": {
                "adversary":          $p.adversary,
                "malware_families":   $p.malware_families,
                "attack_ids":         $p.attack_ids,
                "tags":               $p.tags,
                "targeted_countries": $p.targeted_countries,
                "industries":         $p.industries,
                "revision":           $p.revision,
                "author_name":        $p.author_name,
                "public":             $p.public
              } | with_entries(select(.value != null and .value != "" and .value != []))
            }
          | walk(if type == "object" then with_entries(select(.value != null and .value != "" and .value != [] and .value != {})) else . end)
