name: "Abnormal Security Audit Logs to OCSF v1.9.0"
description: "Transforms Abnormal Security portal/API audit-log records into the OCSF v1.9.0 API Activity (6003) class."
author: "Monad"
contributors:
  - "https://github.com/behobu"
inputs:
  - "abnormal-audit-logs"
tags:
  - "v1.9.0"
  - "ocsf"
  - "abnormal"
  - "application"
config:
  operations:
    - operation: "jq"
      arguments:
        key: ""
        query: |
          # ---------------------------------------------------------------
          # OCSF API Activity (class_uid=6003) — v1.9.0
          # Input: ONE Abnormal Security audit-log record per invocation,
          # as emitted by the `abnormal-audit-logs` input connector. The
          # record carries an abx_metadata envelope (event_type, trace_id)
          # and an abx_body with the actual audited action.
          # ---------------------------------------------------------------

          def to_epoch_ms($ts):
            def _n: if . == null then null else tonumber end;
            def _num_ms($n):
              if   $n >= 1e17 then ($n / 1000000 | floor)
              elif $n >= 1e14 then ($n / 1000 | floor)
              elif $n >= 1e11 then ($n | floor)
              else ($n * 1000 + 0.001 | floor) end;
            def _digits_ms($d):
              ($d | ltrimstr("-") | length) as $l
              | if   $l >= 18 then ($d[0:-6] | tonumber)
                elif $l >= 15 then ($d[0:-3] | tonumber)
                elif $l >= 12 then ($d | tonumber)
                else ($d | tonumber) * 1000 end;
            def _frac_ms($f): if $f == null then 0 else (($f + "000")[0:3] | tonumber) end;
            def _mon($m):
              if $m == null then null
              else {"JAN":1,"FEB":2,"MAR":3,"APR":4,"MAY":5,"JUN":6,
                    "JUL":7,"AUG":8,"SEP":9,"OCT":10,"NOV":11,"DEC":12}[$m[0:3]] end;
            def _zone($z):
              if $z == null or $z == "" then 0
              else
                ($z | if test("^(UTC|GMT|UT)[+-]") then sub("^(UTC|GMT|UT)"; "") else . end) as $z
                | if ($z | test("^[+-][0-9]{1,2}(:?[0-9]{2})?$")) then
                    ($z | capture("^(?<sg>[+-])(?<h>[0-9]{1,2}):?(?<m>[0-9]{2})?$")) as $o
                    | (if $o.sg == "-" then -1 else 1 end)
                      * (($o.h | tonumber) * 3600 + (($o.m // "0") | tonumber) * 60)
                  else
                    {"Z":0,"UTC":0,"GMT":0,"UT":0,"EST":-18000,"EDT":-14400,"CST":-21600,
                     "CDT":-18000,"MST":-25200,"MDT":-21600,"PST":-28800,"PDT":-25200}[$z]
                  end
              end;
            def _ms($c):
              ($c.y | tonumber | if . < 100 then (if . < 70 then . + 2000 else . + 1900 end) else . end) as $y
              | ($c.mo | _n) as $mo
              | ($c.d | tonumber) as $d
              | (($c.h // "0") | tonumber) as $h
              | (($c.mi // "0") | tonumber) as $mi
              | (($c.s // "0") | tonumber) as $s
              | _zone($c.z) as $off
              | if $mo == null or $off == null or $mo < 1 or $mo > 12 or $d < 1 or $d > 31
                   or $h > 23 or $mi > 59 or $s > 60 then null
                else
                  ($y - (if $mo <= 2 then 1 else 0 end)) as $yy
                  | ($yy / 400 | floor) as $era
                  | ($yy - $era * 400) as $yoe
                  | (((153 * ($mo + (if $mo > 2 then -3 else 9 end)) + 2) / 5 | floor) + $d - 1) as $doy
                  | ($yoe * 365 + ($yoe / 4 | floor) - ($yoe / 100 | floor) + $doy) as $doe
                  | ($era * 146097 + $doe - 719468) as $days
                  | ($days * 86400 + $h * 3600 + $mi * 60 + $s - $off) * 1000 + _frac_ms($c.f)
                end;
            def _str($raw):
              ($raw | ascii_upcase | sub("\\s*\\([^)]*\\)\\s*$"; "") | sub("^\\s+"; "") | sub("\\s+$"; "")) as $s
              | "(?<z>Z|(?:UTC|GMT|UT)?[+-][0-9]{1,2}(?::?[0-9]{2})?|[A-Z]{1,5})" as $Z
              | "(?<h>[0-9]{1,2}):(?<mi>[0-9]{2})(?::(?<s>[0-9]{2}))?(?:[.,](?<f>[0-9]+))?" as $T
              | if $s == "" then null
                elif ($s | test("^-?[0-9]+$")) then _digits_ms($s)
                elif ($s | test("^[0-9]+\\.[0-9]+$")) then
                  ($s | split(".")) as $p
                  | if ($p[0] | length) <= 11 then _digits_ms($p[0]) + _frac_ms($p[1])
                    else _digits_ms($p[0]) end
                elif ($s | test("^/DATE\\(-?[0-9]+([+-][0-9]{4})?\\)/$")) then
                  ($s | capture("(?<ms>-?[0-9]+)").ms | tonumber)
                else
                  first(
                    ($s | capture("^(?<y>[0-9]{4})[-/](?<mo>[0-9]{1,2})[-/](?<d>[0-9]{1,2})(?:[T ]+" + $T + ")?\\s*" + $Z + "?(?:\\s+[A-Z]{2,5})?$") | _ms(.)),
                    ($s | capture("^(?<y>[0-9]{4})(?<mo>[0-9]{2})(?<d>[0-9]{2})T(?<h>[0-9]{2})(?<mi>[0-9]{2})(?<s>[0-9]{2})(?:[.,](?<f>[0-9]+))?" + $Z + "?$") | _ms(.)),
                    ($s | capture("^(?:[A-Z]+,?\\s+)?(?<d>[0-9]{1,2})[ -](?<mon>[A-Z]{3,9})[ -](?<y>[0-9]{2,4})\\s+" + $T + "\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?:[A-Z]+,?\\s+)?(?<mon>[A-Z]{3,9})\\.?\\s+(?<d>[0-9]{1,2}),?\\s+(?<y>[0-9]{4})(?:,?\\s+" + $T + ")?\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?:[A-Z]+\\s+)?(?<mon>[A-Z]{3,9})\\s+(?<d>[0-9]{1,2})\\s+" + $T + "\\s+(?:" + $Z + "\\s+)?(?<y>[0-9]{4})$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?<d>[0-9]{1,2})/(?<mon>[A-Z]{3})/(?<y>[0-9]{4}):" + $T + "\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.))
                  ) // null
                end;
            if $ts == null then null
            elif ($ts | type) == "number" then _num_ms($ts)
            elif ($ts | type) == "string" then _str($ts)
            elif ($ts | type) == "object" then
              if   $ts["$date"] != null then to_epoch_ms($ts["$date"])
              elif $ts["$numberLong"] != null then to_epoch_ms($ts["$numberLong"])
              elif $ts.seconds != null then
                ($ts.seconds | tostring | tonumber) * 1000
                + ((($ts.nanos // 0) | tostring | tonumber) / 1000000 | floor)
              else null end
            else null end;

          . as $r
          | ($r.abx_metadata // {}) as $m
          | ($r.abx_body // {}) as $b
          | ($b.action_details // {}) as $ad
          | ($b.user // {}) as $u
          | (($b.action // $b.category // "") | ascii_downcase) as $act
          # Map the audited verb onto the API Activity CRUD activity_id.
          | (if   ($act | test("delete|purge|remove|remediat")) then 4
             elif ($act | test("create|add|new"))               then 1
             elif ($act | test("update|change|modif|set|status")) then 3
             elif ($act | test("login|read|get|list|search|view|export")) then 2
             else 99 end) as $activity_id
          | {
              "category_uid": 6,
              "class_uid":    6003,
              "activity_id":  $activity_id,
              "type_uid":     (6003 * 100 + $activity_id),
              "severity_id":  1,
              "status_id":    (if   (($b.status // "") | ascii_upcase) == "SUCCESS" then 1
                               elif (($b.status // "") | ascii_upcase) == "FAILURE" then 2
                               else 0 end),
              "status":       (if   (($b.status // "") | ascii_upcase) == "SUCCESS" then "Success"
                               elif (($b.status // "") | ascii_upcase) == "FAILURE" then "Failure"
                               else ($b.status // null) end),

              "time": to_epoch_ms($b.timestamp // $m.timestamp),

              "metadata": {
                "profiles": ["cloud", "osint"],
                "version": "1.9.0",
                "product": {
                  "vendor_name": "Abnormal Security",
                  "name": "Abnormal Security Audit Logs"
                },
                "uid":          $m.trace_id,
                "event_code":   $b.category,
                "log_provider": "Abnormal Security"
              },

              # API Activity requires actor, api, src_endpoint, plus the
              # base cloud/osint attributes.
              "actor": {
                "user": {
                  "name":       $u.email,
                  "email_addr": $u.email,
                  "type_id":    1
                }
              },

              "api": {
                "operation": ($b.action // $b.category // "unknown"),
                "service":   { "name": "Abnormal Security Portal API" },
                "request":   { "uid": $m.trace_id }
              },

              "http_request": {
                "url": { "path": $ad.request_url }
              },

              "src_endpoint": {
                "ip": $b.source_ip
              },

              "cloud": {
                "provider": "Abnormal Security"
              },

              "osint": [],

              "message": (($b.action // $b.category) // ""),
              "unmapped": {
                "tenant_name":     $b.tenant_name,
                "provided_reason": $ad.provided_reason,
                "message_id":      $ad.message_id,
                "event_type":      $m.event_type
              },

              "raw_data": ($r | tostring)
            }
          # Prune null/empty leaves, then reinstate the required-but-empty osint.
          | walk(
              if type == "object" then with_entries(select(.value != null and .value != "" and .value != {} and .value != []))
              elif type == "array" then map(select(. != null))
              else . end
            )
          | .osint = []
          # src_endpoint is required; keep it present even when source_ip is absent.
          | .src_endpoint = (.src_endpoint // {})
