name: "Abnormal Security Audit Logs to OCSF v1.9.0"
description: "Transforms Abnormal Security portal/API audit-log records (GET /v1/auditlogs) into the OCSF v1.9.0 API Activity (6003) class."
author: "Monad"
contributors:
  - "https://github.com/behobu"
inputs:
  - "abnormal-audit-logs"
tags:
  - "v1.9.0"
  - "ocsf"
  - "abnormal"
  - "application"
  - "api activity"
config:
  operations:
    - operation: "jq"
      arguments:
        key: ""
        query: |
          # ---------------------------------------------------------------
          # OCSF API Activity (class_uid=6003) — v1.9.0
          # Input: ONE Abnormal Security audit-log record per invocation, as
          # emitted by the `abnormal-audit-logs` input connector: one raw
          # element of the GET /v1/auditlogs `auditLogs[]` array, flat
          # camelCase:
          #   { category, action, status, timestamp (RFC 3339), sourceIp,
          #     tenantName, user { email },
          #     actionDetails { requestUrl, messageId, providedReason } }
          # `action` and every actionDetails field may be null.
          # ---------------------------------------------------------------

          def to_epoch_ms($ts):
            def _num_ms($n):
              if   $n >= 1e17 then ($n / 1000000 | floor)
              elif $n >= 1e14 then ($n / 1000 | floor)
              elif $n >= 1e11 then ($n | floor)
              else ($n * 1000 | floor) end;
            if $ts == null or $ts == "" then null
            elif ($ts | type) == "number" then _num_ms($ts)
            elif ($ts | type) == "object" then
              (if ($ts.seconds // null) == null then null
               else ($ts.seconds * 1000 + ((($ts.nanos // 0) / 1000000) | floor)) end)
            elif ($ts | type) == "string" then
              if ($ts | test("^-?[0-9]+(\\.[0-9]+)?$")) then _num_ms($ts | tonumber)
              else
                ([$ts | ascii_upcase | capture("^(?<d>[0-9]{4}-[0-9]{2}-[0-9]{2})(?:[T ](?<t>[0-9]{2}:[0-9]{2}(?::[0-9]{2})?)(?:[.,](?<f>[0-9]+))?)? ?(?<z>Z|UTC|[+-][0-9]{2}(?::?[0-9]{2})?)?$")] | first) as $m
                | if $m == null then null
                  else
                    (($m.t // "00:00:00") | if length == 5 then . + ":00" else . end) as $t
                    | (($m.z // "Z") | if . == "Z" or . == "UTC" then 0
                        else (.[1:] | gsub(":"; "")) as $o
                          | ((if (.[0:1]) == "-" then -1 else 1 end)
                             * (($o[0:2] | tonumber) * 3600 + ((if ($o | length) >= 4 then $o[2:4] else "00" end) | tonumber) * 60))
                        end) as $off
                    | ((($m.d + "T" + $t + "Z") | fromdateiso8601) - $off) * 1000
                      + (((($m.f // "") + "000")[0:3]) | tonumber)
                  end
              end
            else null end;

          . as $r
          | ($r.actionDetails // {}) as $ad
          | ($r.user // {}) as $u
          | (($r.status // "") | ascii_upcase) as $st
          # Map the audited verb onto the API Activity CRUD activity_id.
          # `action` (e.g. message_purge, user_invite, key_rotation) carries
          # the verb; when it is null fall back to the category, and only
          # where the category itself implies one.
          | (($r.action // "") | ascii_downcase) as $act
          | (if $act != "" then
               (if   ($act | test("delete|purge|remove|revoke")) then 4
                elif ($act | test("create|add|invite|new|generate")) then 1
                elif ($act | test("update|change|modif|set|rotat|undo|enable|disable|edit")) then 3
                elif ($act | test("read|get|list|search|view|export|download")) then 2
                else 99 end)
             elif (($r.category // "") | ascii_downcase) == "configuration-change" then 3
             else 99 end) as $activity_id
          | {
              "category_uid": 6,
              "class_uid":    6003,
              "activity_id":  $activity_id,
              "activity_name": (if $activity_id == 99 then ($r.action // $r.category) else null end),
              "type_uid":     (6003 * 100 + $activity_id),
              "severity_id":  1,
              "status_id":    (if $st == "SUCCESS" then 1 elif $st == "FAILURE" then 2 else 0 end),
              "status":       (if $st == "SUCCESS" then "Success" elif $st == "FAILURE" then "Failure" else null end),
              "status_code":  $r.status,

              # Time is required; fall back to ingest time only when the
              # record carries no parseable timestamp.
              "time": (to_epoch_ms($r.timestamp) // (now * 1000 | floor)),

              "metadata": {
                "version": "1.9.0",
                "product": {
                  "vendor_name": "Abnormal Security",
                  "name": "Abnormal Security Audit Logs"
                },
                "event_code":   $r.category,
                "tenant_uid":   $r.tenantName,
                "log_provider": "Abnormal Security"
              },

              "actor": {
                # user carries at_least_one [account, name, uid]; real
                # records always carry user.email, "unknown" only guards a
                # malformed record.
                "user": {
                  "name":       ($u.email // "unknown"),
                  "email_addr": $u.email,
                  "type_id":    (if $u.email != null then 1 else 0 end),
                  "org":        (if $r.tenantName != null then { "name": $r.tenantName } else null end)
                }
              },

              "api": {
                "operation": ($r.action // $r.category // "unknown"),
                "service":   { "name": "Abnormal Security Portal API" }
              },

              "http_request": (if $ad.requestUrl != null
                               then { "url": { "path": $ad.requestUrl } } else null end),

              "src_endpoint": { "ip": $r.sourceIp },

              # The message an action (e.g. a purge) was taken on.
              "resources": (if $ad.messageId != null
                            then [ { "uid": $ad.messageId, "type": "Email Message" } ] else null end),

              "observables": (
                  (if $u.email      != null then [ { "name": "actor.user.email_addr", "type_id": 5, "value": $u.email } ] else [] end)
                + (if $r.sourceIp   != null then [ { "name": "src_endpoint.ip", "type_id": 2, "value": $r.sourceIp } ] else [] end)
                + (if $ad.messageId != null then [ { "name": "resources.uid", "type_id": 10, "value": $ad.messageId } ] else [] end)),

              "message": ([ $r.action // $r.category, $u.email, $r.status ]
                          | map(select(. != null and . != "")) | join(" ")),
              "unmapped": {
                "category":        $r.category,
                "provided_reason": $ad.providedReason
              },

              "raw_data": ($r | tostring)
            }
          # Prune null/empty leaves. Required objects (metadata, actor, api)
          # keep at least one populated leaf. src_endpoint is required and
          # network_endpoint carries at_least_one [ip, name, ...]; real
          # records always carry sourceIp, the "unknown" name only guards a
          # malformed record.
          | walk(
              if type == "object" then with_entries(select(.value != null and .value != "" and .value != {} and .value != []))
              else . end
            )
          | .src_endpoint = (.src_endpoint // { "name": "unknown" })
