name: "NIST NVD CVE to OCSF v1.9.0"
description: "Transforms NIST NVD CVE records into the OCSF v1.9.0 Vulnerability Finding (class_uid=2002) class."
author: "Monad"
contributors:
  - "https://github.com/behobu"
inputs:
  - "nist-cve"
tags:
  - "v1.9.0"
  - "ocsf"
  - "nist"
  - "vulnerability"
  - "findings"
config:
  operations:
    - operation: "jq"
      arguments:
        key: ""
        query: |
          # ---------------------------------------------------------------
          # OCSF Vulnerability Finding (class_uid=2002) — v1.9.0
          # Input: one NIST NVD CVE record (native API 2.0 shape,
          # {cve:{...}}) per invocation.
          # ---------------------------------------------------------------

          # NVD timestamps carry fractional seconds and no zone
          # (e.g. "2024-08-13T18:15:10.017"); strip the fraction, force Z.

          # CVSS baseSeverity string -> OCSF severity_id (+ caption sibling).
          def to_epoch_ms($ts):
            def _n: if . == null then null else tonumber end;
            def _num_ms($n):
              if   $n >= 1e17 then ($n / 1000000 | floor)
              elif $n >= 1e14 then ($n / 1000 | floor)
              elif $n >= 1e11 then ($n | floor)
              else ($n * 1000 + 0.001 | floor) end;
            def _digits_ms($d):
              ($d | ltrimstr("-") | length) as $l
              | if   $l >= 18 then ($d[0:-6] | tonumber)
                elif $l >= 15 then ($d[0:-3] | tonumber)
                elif $l >= 12 then ($d | tonumber)
                else ($d | tonumber) * 1000 end;
            def _frac_ms($f): if $f == null then 0 else (($f + "000")[0:3] | tonumber) end;
            def _mon($m):
              if $m == null then null
              else {"JAN":1,"FEB":2,"MAR":3,"APR":4,"MAY":5,"JUN":6,
                    "JUL":7,"AUG":8,"SEP":9,"OCT":10,"NOV":11,"DEC":12}[$m[0:3]] end;
            def _zone($z):
              if $z == null or $z == "" then 0
              else
                ($z | if test("^(UTC|GMT|UT)[+-]") then sub("^(UTC|GMT|UT)"; "") else . end) as $z
                | if ($z | test("^[+-][0-9]{1,2}(:?[0-9]{2})?$")) then
                    ($z | capture("^(?<sg>[+-])(?<h>[0-9]{1,2}):?(?<m>[0-9]{2})?$")) as $o
                    | (if $o.sg == "-" then -1 else 1 end)
                      * (($o.h | tonumber) * 3600 + (($o.m // "0") | tonumber) * 60)
                  else
                    {"Z":0,"UTC":0,"GMT":0,"UT":0,"EST":-18000,"EDT":-14400,"CST":-21600,
                     "CDT":-18000,"MST":-25200,"MDT":-21600,"PST":-28800,"PDT":-25200}[$z]
                  end
              end;
            def _ms($c):
              ($c.y | tonumber | if . < 100 then (if . < 70 then . + 2000 else . + 1900 end) else . end) as $y
              | ($c.mo | _n) as $mo
              | ($c.d | tonumber) as $d
              | (($c.h // "0") | tonumber) as $h
              | (($c.mi // "0") | tonumber) as $mi
              | (($c.s // "0") | tonumber) as $s
              | _zone($c.z) as $off
              | if $mo == null or $off == null or $mo < 1 or $mo > 12 or $d < 1 or $d > 31
                   or $h > 23 or $mi > 59 or $s > 60 then null
                else
                  ($y - (if $mo <= 2 then 1 else 0 end)) as $yy
                  | ($yy / 400 | floor) as $era
                  | ($yy - $era * 400) as $yoe
                  | (((153 * ($mo + (if $mo > 2 then -3 else 9 end)) + 2) / 5 | floor) + $d - 1) as $doy
                  | ($yoe * 365 + ($yoe / 4 | floor) - ($yoe / 100 | floor) + $doy) as $doe
                  | ($era * 146097 + $doe - 719468) as $days
                  | ($days * 86400 + $h * 3600 + $mi * 60 + $s - $off) * 1000 + _frac_ms($c.f)
                end;
            def _str($raw):
              ($raw | ascii_upcase | sub("\\s*\\([^)]*\\)\\s*$"; "") | sub("^\\s+"; "") | sub("\\s+$"; "")) as $s
              | "(?<z>Z|(?:UTC|GMT|UT)?[+-][0-9]{1,2}(?::?[0-9]{2})?|[A-Z]{1,5})" as $Z
              | "(?<h>[0-9]{1,2}):(?<mi>[0-9]{2})(?::(?<s>[0-9]{2}))?(?:[.,](?<f>[0-9]+))?" as $T
              | if $s == "" then null
                elif ($s | test("^-?[0-9]+$")) then _digits_ms($s)
                elif ($s | test("^[0-9]+\\.[0-9]+$")) then
                  ($s | split(".")) as $p
                  | if ($p[0] | length) <= 11 then _digits_ms($p[0]) + _frac_ms($p[1])
                    else _digits_ms($p[0]) end
                elif ($s | test("^/DATE\\(-?[0-9]+([+-][0-9]{4})?\\)/$")) then
                  ($s | capture("(?<ms>-?[0-9]+)").ms | tonumber)
                else
                  first(
                    ($s | capture("^(?<y>[0-9]{4})[-/](?<mo>[0-9]{1,2})[-/](?<d>[0-9]{1,2})(?:[T ]+" + $T + ")?\\s*" + $Z + "?(?:\\s+[A-Z]{2,5})?$") | _ms(.)),
                    ($s | capture("^(?<y>[0-9]{4})(?<mo>[0-9]{2})(?<d>[0-9]{2})T(?<h>[0-9]{2})(?<mi>[0-9]{2})(?<s>[0-9]{2})(?:[.,](?<f>[0-9]+))?" + $Z + "?$") | _ms(.)),
                    ($s | capture("^(?:[A-Z]+,?\\s+)?(?<d>[0-9]{1,2})[ -](?<mon>[A-Z]{3,9})[ -](?<y>[0-9]{2,4})\\s+" + $T + "\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?:[A-Z]+,?\\s+)?(?<mon>[A-Z]{3,9})\\.?\\s+(?<d>[0-9]{1,2}),?\\s+(?<y>[0-9]{4})(?:,?\\s+" + $T + ")?\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?:[A-Z]+\\s+)?(?<mon>[A-Z]{3,9})\\s+(?<d>[0-9]{1,2})\\s+" + $T + "\\s+(?:" + $Z + "\\s+)?(?<y>[0-9]{4})$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?<d>[0-9]{1,2})/(?<mon>[A-Z]{3})/(?<y>[0-9]{4}):" + $T + "\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.))
                  ) // null
                end;
            if $ts == null then null
            elif ($ts | type) == "number" then _num_ms($ts)
            elif ($ts | type) == "string" then _str($ts)
            elif ($ts | type) == "object" then
              if   $ts["$date"] != null then to_epoch_ms($ts["$date"])
              elif $ts["$numberLong"] != null then to_epoch_ms($ts["$numberLong"])
              elif $ts.seconds != null then
                ($ts.seconds | tostring | tonumber) * 1000
                + ((($ts.nanos // 0) | tostring | tonumber) / 1000000 | floor)
              else null end
            else null end;

          def sev_to_id($s):
            def _score($n):
              if $n < 0 or $n > 10 then 99
              elif $n == 0 then 1 elif $n < 4 then 2 elif $n < 7 then 3 elif $n < 9 then 4
              else 5 end;
            if $s == null then 0
            elif ($s | type) == "number" then _score($s)
            elif ($s | type) != "string" then 99
            else
              ($s | ascii_downcase | sub("^\\s+"; "") | sub("\\s+$"; "")) as $l
              | if $l == "" or $l == "unknown" or $l == "unspecified" or $l == "untriaged" then 0
                elif ($l | test("^[0-9]+(\\.[0-9]+)?$")) then _score($l | tonumber)
                else
                  {"info":1,"informational":1,"information":1,"none":1,"notice":1,"debug":1,"trace":1,
                   "low":2,"minor":2,
                   "medium":3,"moderate":3,"middle":3,"warning":3,"warn":3,
                   "high":4,"major":4,"important":4,"error":4,
                   "critical":5,"crit":5,"severe":5,"alert":5,
                   "fatal":6,"emergency":6,"emerg":6}[$l] // 99
                end
            end;
          def sev_caption($id):
            {"0":"Unknown","1":"Informational","2":"Low","3":"Medium","4":"High",
             "5":"Critical","6":"Fatal","99":"Other"}[$id | tostring];

          # NVD vulnStatus -> OCSF status_id (+ caption).
          def nvd_status_to_id($s):
            ($s // "" | ascii_downcase) as $x |
            if   $x == "rejected" then 4
            elif ($x | test("analy")) then 1
            elif ($x | test("await|undergoing|received")) then 2
            else 99 end;
          def nvd_status_caption($id):
            {"1":"New","2":"In Progress","4":"Resolved"}[$id|tostring] // "Other";

          (.cve // .) as $c |
          # English description preferred; fall back to first available.
          (($c.descriptions // []) | (map(select(.lang == "en")) | .[0].value) // (.[0].value)) as $desc |
          # Primary CVSS v3.1 metric (fall back to v3.0, then v2).
          (($c.metrics.cvssMetricV31 // $c.metrics.cvssMetricV30 // $c.metrics.cvssMetricV2 // []) | .[0]) as $m |
          ($m.cvssData // {}) as $cd |
          # CWEs from the weaknesses[].description[].value entries.
          ([ ($c.weaknesses // [])[].description[]? | select(.value | test("^CWE-")) | .value ] | unique) as $cwes |
          # Reference URLs.
          ([ ($c.references // [])[].url ] | unique) as $refs |

          (sev_to_id($cd.baseSeverity)) as $sev_id |
          (nvd_status_to_id($c.vulnStatus)) as $status_id |

          # One OCSF cvss object when a base score is present.
          (if $cd.baseScore != null then
             [ { "version": ($cd.version // "3.1"), "base_score": $cd.baseScore }
               + (if $cd.vectorString != null then { "vector_string": $cd.vectorString } else {} end)
               + (if $cd.baseSeverity != null then { "severity": $cd.baseSeverity } else {} end) ]
           else null end) as $cvss |

          # The CVE object embedded in the vulnerability (required just_one).
          ({
            "uid": $c.id,
            "desc": $desc,
            "created_time": to_epoch_ms($c.published),
            "modified_time": to_epoch_ms($c.lastModified),
            "references": $refs
          } + (if $cvss != null then { "cvss": $cvss } else {} end)) as $cve_obj |

          {
            # --- Classification (REQUIRED) ---
            "category_uid": 2,
            "class_uid": 2002,
            "type_uid": 200201,
            "activity_id": 1,

            # --- Severity (REQUIRED); sibling string = OCSF caption ---
            "severity_id": $sev_id,
            "severity": sev_caption($sev_id),

            # --- Time (REQUIRED) = CVE publication time ---
            "time": to_epoch_ms($c.published),

            # --- Status ---
            "status_id": $status_id,
            "status": nvd_status_caption($status_id),
            "status_detail": $c.vulnStatus,

            # --- Metadata (REQUIRED) ---
            "metadata": {
                "profiles": ["cloud", "osint"],
              "version": "1.9.0",
              "product": {
                "vendor_name": "NIST",
                "name": "National Vulnerability Database",
                "feature": { "name": "CVE API 2.0" }
              },
              "logged_time": to_epoch_ms($c.lastModified)
            },

            # --- Cloud (REQUIRED in 1.9.0; provider = the OSINT source) ---
            "cloud": { "provider": "NIST NVD" },

            # --- OSINT (REQUIRED in 1.9.0); the CVE as a vulnerability
            # indicator (type_id 10 = Vulnerability) ---
            "osint": [
              {
                "value": $c.id,
                "type_id": 10,
                "type": "Vulnerability",
                "desc": $desc
              }
            ],

            # --- Finding Info (REQUIRED) ---
            "finding_info": {
              "uid": $c.id,
              "title": ("NIST NVD " + $c.id),
              "desc": $desc,
              "created_time": to_epoch_ms($c.published),
              "modified_time": to_epoch_ms($c.lastModified),
              "src_url": ($refs | first),
              "types": ["Vulnerability"]
            },

            # --- Vulnerabilities (REQUIRED); one entry, CVE branch of the
            # just_one:[advisory,cve,cwe] constraint ---
            "vulnerabilities": [
              {
                "title": $c.id,
                "desc": $desc,
                "severity": ($cd.baseSeverity // sev_caption($sev_id)),
                "references": $refs,
                "cve": $cve_obj,
                "first_seen_time": to_epoch_ms($c.published),
                "last_seen_time": to_epoch_ms($c.lastModified)
              }
            ],

            # --- Recommended: observables (natural pivots) ---
            "observables": (
              [ { "name": "vulnerabilities.cve.uid", "type": "CVE Object: uid", "type_id": 18, "value": $c.id } ]
              + ($cwes | map({ "name": "vulnerabilities.cwe.uid", "type": "CWE Object: uid", "type_id": 19, "value": . }))
            ),

            # --- Message summary ---
            "message": ($c.id + ": " + ($desc // "")),

            # --- Original record for audit / debugging ---
            "raw_data": (. | tostring)
          }
          # Drop keys that resolved to null (OCSF rejects null-typed values);
          # the single permitted recursive pass.
          | del(.. | nulls)
