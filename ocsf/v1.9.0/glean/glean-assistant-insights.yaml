name: "Glean Assistant Insights to OCSF v1.9.0"
description: "Transforms Glean Assistant Insights usage/adoption snapshot records into the OCSF v1.9.0 Application Lifecycle (6002) class."
author: "Monad"
contributors:
  - "https://github.com/behobu"
inputs:
  - "glean-assistant-insights"
tags:
  - "v1.9.0"
  - "ocsf"
  - "glean"
  - "ai"
  - "application"
config:
  operations:
    - operation: "jq"
      arguments:
        key: ""
        query: |
          # ---------------------------------------------------------------
          # OCSF Application Lifecycle (class_uid=6002) — v1.9.0
          # Input: one Glean Assistant Insights snapshot per invocation — the
          # AssistantInsightsResponse the `glean-assistant-insights` input
          # connector unwraps from POST /rest/api/v1/insights:
          #   { monthlyActiveUsers, weeklyActiveUsers, lastUpdatedTs (unix s),
          #     totalSignups, *Timeseries { label, countInfo[] {count,
          #     period, org} }, perUserInsights[] }
          # This is an org-level Assistant usage/adoption snapshot with no
          # single per-user/per-device subject, so — like the sibling
          # glean-overview-insights transform — it maps to activity_id 99
          # (Other) with activity_name naming the concrete event, and carries
          # the aggregate metrics under `unmapped`.
          # ---------------------------------------------------------------

          def to_epoch_ms($ts):
            def _num_ms($n):
              if   $n >= 1e17 then ($n / 1000000 | floor)
              elif $n >= 1e14 then ($n / 1000 | floor)
              elif $n >= 1e11 then ($n | floor)
              else ($n * 1000 | floor) end;
            if $ts == null or $ts == "" then null
            elif ($ts | type) == "number" then _num_ms($ts)
            elif ($ts | type) == "object" then
              (if ($ts.seconds // null) == null then null
               else ($ts.seconds * 1000 + ((($ts.nanos // 0) / 1000000) | floor)) end)
            elif ($ts | type) == "string" then
              if ($ts | test("^-?[0-9]+(\\.[0-9]+)?$")) then _num_ms($ts | tonumber)
              else
                ([$ts | ascii_upcase | capture("^(?<d>[0-9]{4}-[0-9]{2}-[0-9]{2})(?:[T ](?<t>[0-9]{2}:[0-9]{2}(?::[0-9]{2})?)(?:[.,](?<f>[0-9]+))?)? ?(?<z>Z|UTC|[+-][0-9]{2}(?::?[0-9]{2})?)?$")] | first) as $m
                | if $m == null then null
                  else
                    (($m.t // "00:00:00") | if length == 5 then . + ":00" else . end) as $t
                    | (($m.z // "Z") | if . == "Z" or . == "UTC" then 0
                        else (.[1:] | gsub(":"; "")) as $o
                          | ((if (.[0:1]) == "-" then -1 else 1 end)
                             * (($o[0:2] | tonumber) * 3600 + ((if ($o | length) >= 4 then $o[2:4] else "00" end) | tonumber) * 60))
                        end) as $off
                    | ((($m.d + "T" + $t + "Z") | fromdateiso8601) - $off) * 1000
                      + (((($m.f // "") + "000")[0:3]) | tonumber)
                  end
              end
            else null end;

          # Tolerate a record still wrapped in its response envelope.
          (if (.assistantResponse | type) == "object" then .assistantResponse else . end) as $r
          # CountInfo names its aggregation unit `org` (department or
          # company); "" means unset, so treat it as absent.
          | ([ $r.monthlyActiveUserTimeseries.countInfo[-1].org,
               $r.weeklyActiveUserTimeseries.countInfo[-1].org ]
             | map(select(. != null and . != "")) | first) as $org
          # lastUpdatedTs is unix SECONDS; ingest time only when it is absent.
          | (to_epoch_ms($r.lastUpdatedTs) // (now * 1000 | floor)) as $t
          | {
              # --- Classification (REQUIRED) ---
              "category_uid": 6,
              "class_uid":    6002,
              "type_uid":     (6002 * 100 + 99),
              "activity_id":  99,
              "activity_name": "Assistant Insights Snapshot",
              "severity_id":  1,
              "status_id":    1,

              # --- Time (REQUIRED) ---
              "time": $t,

              # --- Metadata (REQUIRED: product + version) ---
              "metadata": {
                "version": "1.9.0",
                "product": {
                  "vendor_name": "Glean",
                  "name": "Glean Assistant Insights"
                },
                "logged_time": to_epoch_ms($r.lastUpdatedTs)
              },

              # --- Class context: the application these metrics describe
              # (satisfies at_least_one [app, application]) ---
              "application": {
                "name": "Glean Assistant",
                "uid":  $org
              },

              "message": "Glean Assistant adoption snapshot: \($r.monthlyActiveUsers // 0) MAU, \($r.weeklyActiveUsers // 0) WAU across \($r.totalSignups // 0) signups",

              # --- Aggregate metrics (no native OCSF home) ---
              "unmapped": {
                "monthly_active_users":             $r.monthlyActiveUsers,
                "weekly_active_users":              $r.weeklyActiveUsers,
                "total_signups":                    $r.totalSignups,
                "organization":                     $org,
                "monthly_active_user_timeseries":   $r.monthlyActiveUserTimeseries,
                "weekly_active_user_timeseries":    $r.weeklyActiveUserTimeseries,
                "daily_active_user_timeseries":     $r.dailyActiveUserTimeseries,
                "chat_messages_timeseries":         $r.chatMessagesTimeseries,
                "summarizations_timeseries":        $r.summarizationsTimeseries,
                "ai_answers_timeseries":            $r.aiAnswersTimeseries,
                "gleanbot_interactions_timeseries": $r.gleanbotInteractionsTimeseries,
                "upvotes_timeseries":               $r.upvotesTimeseries,
                "downvotes_timeseries":             $r.downvotesTimeseries,
                "per_user_insights":                $r.perUserInsights
              },

              "raw_data": ($r | tostring)
            }
          # Prune null/empty leaves; required objects (metadata, application)
          # are populated above so they survive.
          | walk(
              if type == "object" then
                with_entries(select(.value != null and .value != "" and .value != {} and .value != []))
              else . end
            )
