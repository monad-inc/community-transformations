name: "Buildkite Audit Logs to OCSF v1.9.0"
description: "Transforms Buildkite Audit Log events into the OCSF v1.9.0 User Management (3007) class."
author: "Monad"
contributors:
  - "https://github.com/behobu"
inputs:
  - "buildkite-audit-logs"
tags:
  - "v1.9.0"
  - "ocsf"
  - "buildkite"
  - "iam"
config:
  operations:
    - operation: "jq"
      arguments:
        key: ""
        query: |
          # ---------------------------------------------------------------
          # OCSF User Management (class_uid=3007) — v1.9.0
          # Input: one Buildkite Audit Log event per invocation.
          # Buildkite audit events record administrative/lifecycle actions on
          # organization members, teams, tokens, pipelines, etc. Member/user
          # lifecycle events map cleanly to User Management; the activity_id is
          # derived from the SCREAMING_SNAKE event `type` suffix.
          # ---------------------------------------------------------------

          def to_epoch_ms($ts):
            def _n: if . == null then null else tonumber end;
            def _num_ms($n):
              if   $n >= 1e17 then ($n / 1000000 | floor)
              elif $n >= 1e14 then ($n / 1000 | floor)
              elif $n >= 1e11 then ($n | floor)
              else ($n * 1000 + 0.001 | floor) end;
            def _digits_ms($d):
              ($d | ltrimstr("-") | length) as $l
              | if   $l >= 18 then ($d[0:-6] | tonumber)
                elif $l >= 15 then ($d[0:-3] | tonumber)
                elif $l >= 12 then ($d | tonumber)
                else ($d | tonumber) * 1000 end;
            def _frac_ms($f): if $f == null then 0 else (($f + "000")[0:3] | tonumber) end;
            def _mon($m):
              if $m == null then null
              else {"JAN":1,"FEB":2,"MAR":3,"APR":4,"MAY":5,"JUN":6,
                    "JUL":7,"AUG":8,"SEP":9,"OCT":10,"NOV":11,"DEC":12}[$m[0:3]] end;
            def _zone($z):
              if $z == null or $z == "" then 0
              else
                ($z | if test("^(UTC|GMT|UT)[+-]") then sub("^(UTC|GMT|UT)"; "") else . end) as $z
                | if ($z | test("^[+-][0-9]{1,2}(:?[0-9]{2})?$")) then
                    ($z | capture("^(?<sg>[+-])(?<h>[0-9]{1,2}):?(?<m>[0-9]{2})?$")) as $o
                    | (if $o.sg == "-" then -1 else 1 end)
                      * (($o.h | tonumber) * 3600 + (($o.m // "0") | tonumber) * 60)
                  else
                    {"Z":0,"UTC":0,"GMT":0,"UT":0,"EST":-18000,"EDT":-14400,"CST":-21600,
                     "CDT":-18000,"MST":-25200,"MDT":-21600,"PST":-28800,"PDT":-25200}[$z]
                  end
              end;
            def _ms($c):
              ($c.y | tonumber | if . < 100 then (if . < 70 then . + 2000 else . + 1900 end) else . end) as $y
              | ($c.mo | _n) as $mo
              | ($c.d | tonumber) as $d
              | (($c.h // "0") | tonumber) as $h
              | (($c.mi // "0") | tonumber) as $mi
              | (($c.s // "0") | tonumber) as $s
              | _zone($c.z) as $off
              | if $mo == null or $off == null or $mo < 1 or $mo > 12 or $d < 1 or $d > 31
                   or $h > 23 or $mi > 59 or $s > 60 then null
                else
                  ($y - (if $mo <= 2 then 1 else 0 end)) as $yy
                  | ($yy / 400 | floor) as $era
                  | ($yy - $era * 400) as $yoe
                  | (((153 * ($mo + (if $mo > 2 then -3 else 9 end)) + 2) / 5 | floor) + $d - 1) as $doy
                  | ($yoe * 365 + ($yoe / 4 | floor) - ($yoe / 100 | floor) + $doy) as $doe
                  | ($era * 146097 + $doe - 719468) as $days
                  | ($days * 86400 + $h * 3600 + $mi * 60 + $s - $off) * 1000 + _frac_ms($c.f)
                end;
            def _str($raw):
              ($raw | ascii_upcase | sub("\\s*\\([^)]*\\)\\s*$"; "") | sub("^\\s+"; "") | sub("\\s+$"; "")) as $s
              | "(?<z>Z|(?:UTC|GMT|UT)?[+-][0-9]{1,2}(?::?[0-9]{2})?|[A-Z]{1,5})" as $Z
              | "(?<h>[0-9]{1,2}):(?<mi>[0-9]{2})(?::(?<s>[0-9]{2}))?(?:[.,](?<f>[0-9]+))?" as $T
              | if $s == "" then null
                elif ($s | test("^-?[0-9]+$")) then _digits_ms($s)
                elif ($s | test("^[0-9]+\\.[0-9]+$")) then
                  ($s | split(".")) as $p
                  | if ($p[0] | length) <= 11 then _digits_ms($p[0]) + _frac_ms($p[1])
                    else _digits_ms($p[0]) end
                elif ($s | test("^/DATE\\(-?[0-9]+([+-][0-9]{4})?\\)/$")) then
                  ($s | capture("(?<ms>-?[0-9]+)").ms | tonumber)
                else
                  first(
                    ($s | capture("^(?<y>[0-9]{4})[-/](?<mo>[0-9]{1,2})[-/](?<d>[0-9]{1,2})(?:[T ]+" + $T + ")?\\s*" + $Z + "?(?:\\s+[A-Z]{2,5})?$") | _ms(.)),
                    ($s | capture("^(?<y>[0-9]{4})(?<mo>[0-9]{2})(?<d>[0-9]{2})T(?<h>[0-9]{2})(?<mi>[0-9]{2})(?<s>[0-9]{2})(?:[.,](?<f>[0-9]+))?" + $Z + "?$") | _ms(.)),
                    ($s | capture("^(?:[A-Z]+,?\\s+)?(?<d>[0-9]{1,2})[ -](?<mon>[A-Z]{3,9})[ -](?<y>[0-9]{2,4})\\s+" + $T + "\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?:[A-Z]+,?\\s+)?(?<mon>[A-Z]{3,9})\\.?\\s+(?<d>[0-9]{1,2}),?\\s+(?<y>[0-9]{4})(?:,?\\s+" + $T + ")?\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?:[A-Z]+\\s+)?(?<mon>[A-Z]{3,9})\\s+(?<d>[0-9]{1,2})\\s+" + $T + "\\s+(?:" + $Z + "\\s+)?(?<y>[0-9]{4})$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?<d>[0-9]{1,2})/(?<mon>[A-Z]{3})/(?<y>[0-9]{4}):" + $T + "\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.))
                  ) // null
                end;
            if $ts == null then null
            elif ($ts | type) == "number" then _num_ms($ts)
            elif ($ts | type) == "string" then _str($ts)
            elif ($ts | type) == "object" then
              if   $ts["$date"] != null then to_epoch_ms($ts["$date"])
              elif $ts["$numberLong"] != null then to_epoch_ms($ts["$numberLong"])
              elif $ts.seconds != null then
                ($ts.seconds | tostring | tonumber) * 1000
                + ((($ts.nanos // 0) | tostring | tonumber) / 1000000 | floor)
              else null end
            else null end;

          . as $r
          | ($r.type // "") as $t
          | (if   ($t | endswith("_CREATED")) then 1
             elif ($t | endswith("_DELETED")) then 3
             elif ($t | endswith("_UPDATED")) then 2
             elif ($t | endswith("_ENABLED")) then 4
             elif ($t | endswith("_DISABLED")) then 5
             else 99 end) as $activity_id
          | ({ "1": "Create", "2": "Update", "3": "Delete", "4": "Enable",
               "5": "Disable", "99": "Other" }[$activity_id | tostring]) as $activity_name

          | {
              # --- Classification (REQUIRED) ---
              "category_uid": 3,
              "class_uid":    3007,
              "activity_id":  $activity_id,
              "type_uid":     (3007 * 100 + $activity_id),
              "activity_name": $activity_name,
              "severity_id":  1,

              # --- Time (REQUIRED) ---
              "time": to_epoch_ms($r.occurred_at),

              # --- Metadata (REQUIRED: product + version) ---
              "metadata": {
                "profiles": ["cloud", "osint"],
                "version": "1.9.0",
                "product": {
                  "vendor_name": "Buildkite",
                  "name": "Buildkite Audit Log"
                },
                "uid": $r.uuid,
                "log_name": $t,
                "original_time": $r.occurred_at
              },

              # --- Managed user = the event subject (REQUIRED) ---
              "user": ({
                "name":       ($r.subject.name // null),
                "uid":        ($r.subject.uuid // null),
                "type":       ($r.subject.type // null),
                "type_id":    (if ($r.subject.type // "") == "User" then 1 else 0 end),
                "email_addr": ($r.data.email // null)
              } | with_entries(select(.value != null))),

              # --- cloud (REQUIRED in the 1.9.0 3007 bundle: provider) ---
              "cloud": { "provider": "Buildkite" },

              # --- osint (REQUIRED key; no threat-intel indicators in an
              #     audit record, so an empty array satisfies presence) ---
              "osint": [],

              # --- Actor: who performed the action (recommended) ---
              "actor": ({
                "user": ({
                  "name":    ($r.actor.name // null),
                  "uid":     ($r.actor.uuid // null),
                  "type":    ($r.actor.type // null),
                  "type_id": (if ($r.actor.type // "") == "User" then 1 else 0 end)
                } | with_entries(select(.value != null)))
              }),

              # --- Source endpoint from the request context (recommended) ---
              # network_endpoint has no user_agent; keep the UA in unmapped.
              "src_endpoint": ({
                "ip":         ($r.context.request_ip // null)
              } | with_entries(select(.value != null))),

              # --- Outcome: Buildkite records completed actions (recommended) ---
              "status_id": 1,
              "status": "Success",
              "message": $t,

              # --- Pass-through for fields without a clean OCSF home ---
              "unmapped": ({
                "graphql_id": $r.graphql_id,
                "url":        $r.url,
                "user_agent": ($r.context.request_user_agent // null),
                "data":       $r.data
              } | with_entries(select(.value != null))),

              "raw_data": ($r | tostring)
            }
