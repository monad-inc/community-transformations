name: "Atlassian Confluence Audit Logs to OCSF v1.9.0"
description: "Transforms Atlassian Confluence audit log records into the OCSF v1.9.0 Entity Management (3004) class, mapping the acting author to the actor, the affected Confluence object to the managed entity, and the audit summary/category to the CRUD activity."
author: "Monad"
contributors:
  - "https://github.com/behobu"
inputs:
  - "atlassian-confluence-audit-logs"
tags:
  - "v1.9.0"
  - "ocsf"
  - "atlassian"
  - "iam"
config:
  operations:
    - operation: "jq"
      arguments:
        key: ""
        query: |
          # ---------------------------------------------------------------
          # OCSF Entity Management (class_uid=3004, category_uid=3) — v1.9.0
          # Input: one Atlassian Confluence audit record per invocation.
          # A Confluence audit record reports a create/read/update/delete on
          # a managed Confluence object (space, page, user, permission, ...),
          # which is exactly the Entity Management semantic.
          # ---------------------------------------------------------------

          # Confluence creationDate is epoch MILLISECONDS; OCSF timestamp_t is
          # epoch-ms, so pass it through numerically. ISO strings (server API)
          # are converted to ms.

          def to_epoch_ms($ts):
            def _n: if . == null then null else tonumber end;
            def _num_ms($n):
              if   $n >= 1e17 then ($n / 1000000 | floor)
              elif $n >= 1e14 then ($n / 1000 | floor)
              elif $n >= 1e11 then ($n | floor)
              else ($n * 1000 + 0.001 | floor) end;
            def _digits_ms($d):
              ($d | ltrimstr("-") | length) as $l
              | if   $l >= 18 then ($d[0:-6] | tonumber)
                elif $l >= 15 then ($d[0:-3] | tonumber)
                elif $l >= 12 then ($d | tonumber)
                else ($d | tonumber) * 1000 end;
            def _frac_ms($f): if $f == null then 0 else (($f + "000")[0:3] | tonumber) end;
            def _mon($m):
              if $m == null then null
              else {"JAN":1,"FEB":2,"MAR":3,"APR":4,"MAY":5,"JUN":6,
                    "JUL":7,"AUG":8,"SEP":9,"OCT":10,"NOV":11,"DEC":12}[$m[0:3]] end;
            def _zone($z):
              if $z == null or $z == "" then 0
              else
                ($z | if test("^(UTC|GMT|UT)[+-]") then sub("^(UTC|GMT|UT)"; "") else . end) as $z
                | if ($z | test("^[+-][0-9]{1,2}(:?[0-9]{2})?$")) then
                    ($z | capture("^(?<sg>[+-])(?<h>[0-9]{1,2}):?(?<m>[0-9]{2})?$")) as $o
                    | (if $o.sg == "-" then -1 else 1 end)
                      * (($o.h | tonumber) * 3600 + (($o.m // "0") | tonumber) * 60)
                  else
                    {"Z":0,"UTC":0,"GMT":0,"UT":0,"EST":-18000,"EDT":-14400,"CST":-21600,
                     "CDT":-18000,"MST":-25200,"MDT":-21600,"PST":-28800,"PDT":-25200}[$z]
                  end
              end;
            def _ms($c):
              ($c.y | tonumber | if . < 100 then (if . < 70 then . + 2000 else . + 1900 end) else . end) as $y
              | ($c.mo | _n) as $mo
              | ($c.d | tonumber) as $d
              | (($c.h // "0") | tonumber) as $h
              | (($c.mi // "0") | tonumber) as $mi
              | (($c.s // "0") | tonumber) as $s
              | _zone($c.z) as $off
              | if $mo == null or $off == null or $mo < 1 or $mo > 12 or $d < 1 or $d > 31
                   or $h > 23 or $mi > 59 or $s > 60 then null
                else
                  ($y - (if $mo <= 2 then 1 else 0 end)) as $yy
                  | ($yy / 400 | floor) as $era
                  | ($yy - $era * 400) as $yoe
                  | (((153 * ($mo + (if $mo > 2 then -3 else 9 end)) + 2) / 5 | floor) + $d - 1) as $doy
                  | ($yoe * 365 + ($yoe / 4 | floor) - ($yoe / 100 | floor) + $doy) as $doe
                  | ($era * 146097 + $doe - 719468) as $days
                  | ($days * 86400 + $h * 3600 + $mi * 60 + $s - $off) * 1000 + _frac_ms($c.f)
                end;
            def _str($raw):
              ($raw | ascii_upcase | sub("\\s*\\([^)]*\\)\\s*$"; "") | sub("^\\s+"; "") | sub("\\s+$"; "")) as $s
              | "(?<z>Z|(?:UTC|GMT|UT)?[+-][0-9]{1,2}(?::?[0-9]{2})?|[A-Z]{1,5})" as $Z
              | "(?<h>[0-9]{1,2}):(?<mi>[0-9]{2})(?::(?<s>[0-9]{2}))?(?:[.,](?<f>[0-9]+))?" as $T
              | if $s == "" then null
                elif ($s | test("^-?[0-9]+$")) then _digits_ms($s)
                elif ($s | test("^[0-9]+\\.[0-9]+$")) then
                  ($s | split(".")) as $p
                  | if ($p[0] | length) <= 11 then _digits_ms($p[0]) + _frac_ms($p[1])
                    else _digits_ms($p[0]) end
                elif ($s | test("^/DATE\\(-?[0-9]+([+-][0-9]{4})?\\)/$")) then
                  ($s | capture("(?<ms>-?[0-9]+)").ms | tonumber)
                else
                  first(
                    ($s | capture("^(?<y>[0-9]{4})[-/](?<mo>[0-9]{1,2})[-/](?<d>[0-9]{1,2})(?:[T ]+" + $T + ")?\\s*" + $Z + "?(?:\\s+[A-Z]{2,5})?$") | _ms(.)),
                    ($s | capture("^(?<y>[0-9]{4})(?<mo>[0-9]{2})(?<d>[0-9]{2})T(?<h>[0-9]{2})(?<mi>[0-9]{2})(?<s>[0-9]{2})(?:[.,](?<f>[0-9]+))?" + $Z + "?$") | _ms(.)),
                    ($s | capture("^(?:[A-Z]+,?\\s+)?(?<d>[0-9]{1,2})[ -](?<mon>[A-Z]{3,9})[ -](?<y>[0-9]{2,4})\\s+" + $T + "\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?:[A-Z]+,?\\s+)?(?<mon>[A-Z]{3,9})\\.?\\s+(?<d>[0-9]{1,2}),?\\s+(?<y>[0-9]{4})(?:,?\\s+" + $T + ")?\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?:[A-Z]+\\s+)?(?<mon>[A-Z]{3,9})\\s+(?<d>[0-9]{1,2})\\s+" + $T + "\\s+(?:" + $Z + "\\s+)?(?<y>[0-9]{4})$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?<d>[0-9]{1,2})/(?<mon>[A-Z]{3})/(?<y>[0-9]{4}):" + $T + "\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.))
                  ) // null
                end;
            if $ts == null then null
            elif ($ts | type) == "number" then _num_ms($ts)
            elif ($ts | type) == "string" then _str($ts)
            elif ($ts | type) == "object" then
              if   $ts["$date"] != null then to_epoch_ms($ts["$date"])
              elif $ts["$numberLong"] != null then to_epoch_ms($ts["$numberLong"])
              elif $ts.seconds != null then
                ($ts.seconds | tostring | tonumber) * 1000
                + ((($ts.nanos // 0) | tostring | tonumber) / 1000000 | floor)
              else null end
            else null end;

          def is_ip($s):
            def _v4: test("^((25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])[.]){3}(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])$");
            def _v6:
              if (contains(":") and test("^[0-9A-Fa-f:.]+$")) | not then false
              else
                split("::") as $p
                | if ($p | length) > 2 then false
                  else
                    [$p[] | select(. != "") | split(":")[]] as $g
                    | (($g | length) > 0 and ($g[-1] | contains("."))) as $tail4
                    | (if $tail4 then $g[0:-1] else $g end) as $hex
                    | (($hex | length) + (if $tail4 then 2 else 0 end)) as $n
                    | (if $tail4 then ($g[-1] | _v4) else true end)
                      and all($hex[]; test("^[0-9A-Fa-f]{1,4}$"))
                      and (if ($p | length) == 2 then $n <= 7 else $n == 8 end)
                  end
              end;
            ($s | type) == "string" and ($s | _v4 or _v6);

          # Derive the CRUD activity from the human summary/category text.
          def lc($s): ($s // "") | ascii_downcase;
          def prune:
            walk(if type == "object" then with_entries(select(.value != null and .value != {} and .value != []))
                 elif type == "array" then map(select(. != null and . != {} and . != []))
                 else . end);

          . as $r
          | ($r.author // {}) as $au
          | (lc($r.summary) + " " + lc($r.description) + " " + lc($r.category)) as $txt
          | ( if   ($txt | test("creat|add|grant|enabl")) then 1
              elif ($txt | test("delet|remov|revok|disabl")) then 4
              elif ($txt | test("updat|chang|modif|edit|renam|move")) then 3
              elif ($txt | test("view|read|access|export|download")) then 2
              else 99 end ) as $act
          | {
              category_uid: 3,
              class_uid:    3004,
              type_uid:     (3004 * 100 + $act),
              activity_id:  $act,
              severity_id:  1,

              time: to_epoch_ms($r.creationDate),

              metadata: {
                version: "1.9.0",
                product: {
                  vendor_name: "Atlassian",
                  name: "Confluence"
                },
                profiles: []
              },

              # The affected Confluence object is the managed entity.
              entity: {
                name: ($r.affectedObject.name // $r.summary),
                type: ($r.affectedObject.objectType // "Confluence Object"),
                type_id: 99
              },

              # The audit author is the actor performing the change.
              actor: {
                user: {
                  type_id: 1,
                  name: ($au.displayName // $au.publicName),
                  uid: $au.accountId,
                  account: (if $au.accountType != null then { type: $au.accountType } else null end)
                }
              },

              src_endpoint: (if is_ip($r.remoteAddress) then { ip: $r.remoteAddress } else null end),

              status_id: 1,
              message: ($r.description // $r.summary),

              observables: (
                [ (if $au.displayName != null then { name: "actor.user.name", type: "User", value: $au.displayName } else empty end),
                  (if is_ip($r.remoteAddress) then { name: "src_endpoint.ip", type: "IP Address", value: $r.remoteAddress } else empty end)
                ]
              ),

              unmapped: {
                category: $r.category,
                sysAdmin: $r.sysAdmin,
                superAdmin: $r.superAdmin,
                changedValues: $r.changedValues,
                associatedObjects: $r.associatedObjects
              },

              raw_data: ($r | tostring)
            }
          | prune
          # osint + cloud are class-required in OCSF 1.9.0. Confluence Cloud is
          # a hosted SaaS (provider populated); no OSINT enrichment on an audit
          # record, so osint is an empty array. Added post-prune so the empty
          # array survives.
          | . + {
              osint: [],
              cloud: { provider: "Atlassian" }
            }
