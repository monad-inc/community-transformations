name: "Anthropic Compliance Activities to OCSF v1.9.0"
description: "Transforms Anthropic Claude Compliance API activity-feed records into OCSF v1.9.0, routing authentication activities to the Authentication (3002) class and all other audit activities to the API Activity (6003) class as generic CRUD."
author: "Monad"
contributors:
  - "https://github.com/behobu"
inputs:
  - "anthropic-compliance-activities"
tags:
  - "v1.9.0"
  - "ocsf"
  - "anthropic"
  - "ai"
  - "iam"
config:
  operations:
    - operation: "jq"
      arguments:
        key: ""
        query: |
          # ---------------------------------------------------------------
          # Anthropic Claude Compliance API activity feed -> OCSF v1.9.0
          # One activity record in -> one OCSF event out.
          #
          # Routing (by activity `type`):
          #   login/logout/sso/mfa/session/authentication -> Authentication 3002 (IAM)
          #   everything else (chat/file/project/admin/api-key/role/group CRUD)
          #                                               -> API Activity 6003 (Application)
          #
          # The `actor` discriminated union (user_actor, api_actor,
          # admin_api_key_actor, unauthenticated_user_actor, anthropic_actor,
          # scim_directory_sync_actor) is normalized to one OCSF user + endpoint.
          # ---------------------------------------------------------------

          def to_epoch_ms($ts):
            def _n: if . == null then null else tonumber end;
            def _num_ms($n):
              if   $n >= 1e17 then ($n / 1000000 | floor)
              elif $n >= 1e14 then ($n / 1000 | floor)
              elif $n >= 1e11 then ($n | floor)
              else ($n * 1000 + 0.001 | floor) end;
            def _digits_ms($d):
              ($d | ltrimstr("-") | length) as $l
              | if   $l >= 18 then ($d[0:-6] | tonumber)
                elif $l >= 15 then ($d[0:-3] | tonumber)
                elif $l >= 12 then ($d | tonumber)
                else ($d | tonumber) * 1000 end;
            def _frac_ms($f): if $f == null then 0 else (($f + "000")[0:3] | tonumber) end;
            def _mon($m):
              if $m == null then null
              else {"JAN":1,"FEB":2,"MAR":3,"APR":4,"MAY":5,"JUN":6,
                    "JUL":7,"AUG":8,"SEP":9,"OCT":10,"NOV":11,"DEC":12}[$m[0:3]] end;
            def _zone($z):
              if $z == null or $z == "" then 0
              else
                ($z | if test("^(UTC|GMT|UT)[+-]") then sub("^(UTC|GMT|UT)"; "") else . end) as $z
                | if ($z | test("^[+-][0-9]{1,2}(:?[0-9]{2})?$")) then
                    ($z | capture("^(?<sg>[+-])(?<h>[0-9]{1,2}):?(?<m>[0-9]{2})?$")) as $o
                    | (if $o.sg == "-" then -1 else 1 end)
                      * (($o.h | tonumber) * 3600 + (($o.m // "0") | tonumber) * 60)
                  else
                    {"Z":0,"UTC":0,"GMT":0,"UT":0,"EST":-18000,"EDT":-14400,"CST":-21600,
                     "CDT":-18000,"MST":-25200,"MDT":-21600,"PST":-28800,"PDT":-25200}[$z]
                  end
              end;
            def _ms($c):
              ($c.y | tonumber | if . < 100 then (if . < 70 then . + 2000 else . + 1900 end) else . end) as $y
              | ($c.mo | _n) as $mo
              | ($c.d | tonumber) as $d
              | (($c.h // "0") | tonumber) as $h
              | (($c.mi // "0") | tonumber) as $mi
              | (($c.s // "0") | tonumber) as $s
              | _zone($c.z) as $off
              | if $mo == null or $off == null or $mo < 1 or $mo > 12 or $d < 1 or $d > 31
                   or $h > 23 or $mi > 59 or $s > 60 then null
                else
                  ($y - (if $mo <= 2 then 1 else 0 end)) as $yy
                  | ($yy / 400 | floor) as $era
                  | ($yy - $era * 400) as $yoe
                  | (((153 * ($mo + (if $mo > 2 then -3 else 9 end)) + 2) / 5 | floor) + $d - 1) as $doy
                  | ($yoe * 365 + ($yoe / 4 | floor) - ($yoe / 100 | floor) + $doy) as $doe
                  | ($era * 146097 + $doe - 719468) as $days
                  | ($days * 86400 + $h * 3600 + $mi * 60 + $s - $off) * 1000 + _frac_ms($c.f)
                end;
            def _str($raw):
              ($raw | ascii_upcase | sub("\\s*\\([^)]*\\)\\s*$"; "") | sub("^\\s+"; "") | sub("\\s+$"; "")) as $s
              | "(?<z>Z|(?:UTC|GMT|UT)?[+-][0-9]{1,2}(?::?[0-9]{2})?|[A-Z]{1,5})" as $Z
              | "(?<h>[0-9]{1,2}):(?<mi>[0-9]{2})(?::(?<s>[0-9]{2}))?(?:[.,](?<f>[0-9]+))?" as $T
              | if $s == "" then null
                elif ($s | test("^-?[0-9]+$")) then _digits_ms($s)
                elif ($s | test("^[0-9]+\\.[0-9]+$")) then
                  ($s | split(".")) as $p
                  | if ($p[0] | length) <= 11 then _digits_ms($p[0]) + _frac_ms($p[1])
                    else _digits_ms($p[0]) end
                elif ($s | test("^/DATE\\(-?[0-9]+([+-][0-9]{4})?\\)/$")) then
                  ($s | capture("(?<ms>-?[0-9]+)").ms | tonumber)
                else
                  first(
                    ($s | capture("^(?<y>[0-9]{4})[-/](?<mo>[0-9]{1,2})[-/](?<d>[0-9]{1,2})(?:[T ]+" + $T + ")?\\s*" + $Z + "?(?:\\s+[A-Z]{2,5})?$") | _ms(.)),
                    ($s | capture("^(?<y>[0-9]{4})(?<mo>[0-9]{2})(?<d>[0-9]{2})T(?<h>[0-9]{2})(?<mi>[0-9]{2})(?<s>[0-9]{2})(?:[.,](?<f>[0-9]+))?" + $Z + "?$") | _ms(.)),
                    ($s | capture("^(?:[A-Z]+,?\\s+)?(?<d>[0-9]{1,2})[ -](?<mon>[A-Z]{3,9})[ -](?<y>[0-9]{2,4})\\s+" + $T + "\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?:[A-Z]+,?\\s+)?(?<mon>[A-Z]{3,9})\\.?\\s+(?<d>[0-9]{1,2}),?\\s+(?<y>[0-9]{4})(?:,?\\s+" + $T + ")?\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?:[A-Z]+\\s+)?(?<mon>[A-Z]{3,9})\\s+(?<d>[0-9]{1,2})\\s+" + $T + "\\s+(?:" + $Z + "\\s+)?(?<y>[0-9]{4})$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?<d>[0-9]{1,2})/(?<mon>[A-Z]{3})/(?<y>[0-9]{4}):" + $T + "\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.))
                  ) // null
                end;
            if $ts == null then null
            elif ($ts | type) == "number" then _num_ms($ts)
            elif ($ts | type) == "string" then _str($ts)
            elif ($ts | type) == "object" then
              if   $ts["$date"] != null then to_epoch_ms($ts["$date"])
              elif $ts["$numberLong"] != null then to_epoch_ms($ts["$numberLong"])
              elif $ts.seconds != null then
                ($ts.seconds | tostring | tonumber) * 1000
                + ((($ts.nanos // 0) | tostring | tonumber) / 1000000 | floor)
              else null end
            else null end;

                    def prune_blank:
                      walk(if type == "object" then with_entries(select(.value != null and .value != "" and .value != {} and .value != []))
                           elif type == "array" then map(select(. != null and . != "" and . != {} and . != []))
                           else . end);

          . as $r
          | ($r.actor // {}) as $a
          | ($a.email_address // $a.unauthenticated_email_address) as $email
          | ($a.user_id // $a.api_key_id // $a.admin_api_key_id // $a.directory_id) as $auid
          | ($a.ip_address) as $ip
          | ($r.type // "") as $t
          | ($t | ascii_downcase) as $tl
          # string-builtin predicate (avoids regex per autoscaling rule 4)
          | (def has($s): ($tl | contains($s));
             (has("login") or has("logout") or has("logon") or has("logoff")
              or has("sso") or has("sign_in") or has("sign_out") or has("mfa")
              or has("session_") or has("authenticat")) ) as $isauth
          | (def has($s): ($tl | contains($s));
             if (has("failed") or has("denied") or has("rejected")
                 or has("blocked") or has("error") or has("revoked_access")) then 2
             else 1 end) as $status_id
          | (def has($s): ($tl | contains($s));
             if (has("created") or has("added") or has("uploaded") or has("invited")
                 or has("generated") or has("enrolled") or has("installed")) then 1
             elif (has("deleted") or has("removed") or has("revoked")
                   or has("archived") or has("uninstalled")) then 4
             elif (has("updated") or has("changed") or has("renamed") or has("modified")
                   or has("enabled") or has("disabled") or has("accepted") or has("assigned")) then 3
             elif (has("viewed") or has("read") or has("listed") or has("exported")
                   or has("downloaded") or has("accessed") or has("retrieved")) then 2
             else 99 end) as $apiact
          | (def has($s): ($tl | contains($s));
             if (has("login") or has("logon") or has("sign_in")) then 1
             elif (has("logout") or has("logoff") or has("sign_out")) then 2
             else 99 end) as $authact
          | (if $status_id == 2 then 3 elif $apiact == 4 then 2 else 1 end) as $severity_id
          | ({
              "user_actor": 1, "admin_api_key_actor": 2,
              "anthropic_actor": 3
            }[$a.type] // 0) as $user_type_id
          | {
              type_id: $user_type_id,
              name: ($email // $a.type // "unknown"),
              email_addr: $email,
              uid: $auid
            } as $user
          | (if $isauth then {
              category_uid: 3,
              class_uid: 3002,
              activity_id: $authact,
              type_uid: (3002 * 100 + $authact),
              user: $user,
              service: { name: "Claude Enterprise" },
              auth_protocol_id: (if ($tl | contains("sso")) then 5 else null end),
              src_endpoint: { ip: $ip, uid: $auid }
            } else {
              category_uid: 6,
              class_uid: 6003,
              activity_id: $apiact,
              type_uid: (6003 * 100 + $apiact),
              actor: { user: $user },
              api: { operation: $t, service: { name: "Compliance Activity Feed" } },
              src_endpoint: { ip: $ip, uid: $auid }
            } end)
          + {
              time: to_epoch_ms($r.created_at),
              severity_id: $severity_id,
              status_id: $status_id,
              status: (if $status_id == 1 then "Success" else "Failure" end),
              cloud: { provider: "Anthropic" },
              metadata: {
                product: { vendor_name: "Anthropic", name: "Claude Compliance API" },
                version: "1.9.0",
                uid: $r.id,
                log_name: "compliance_activities"
              },
              message: ("Anthropic compliance activity: " + $t),
              unmapped: ({
                activity_type: $r.type,
                organization_id: $r.organization_id,
                organization_uuid: $r.organization_uuid,
                actor_type: $a.type,
                user_agent: $a.user_agent,
                claude_chat_id: $r.claude_chat_id,
                claude_project_id: $r.claude_project_id,
                filename: $r.filename,
                directory_id: $a.directory_id,
                idp_connection_type: $a.idp_connection_type,
                workos_event_id: $a.workos_event_id
              } | with_entries(select(.value != null)))
            }
          | prune_blank
          | .osint = []
