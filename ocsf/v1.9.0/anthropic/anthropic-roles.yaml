name: "Anthropic Organization Roles to OCSF v1.9.0"
description: "Transforms Anthropic Compliance API organization role records into the OCSF v1.9.0 Cloud Resources Inventory Info (5023) class, one role resource per event."
author: "Monad"
contributors:
  - "https://github.com/behobu"
inputs:
  - "anthropic-roles"
tags:
  - "v1.9.0"
  - "ocsf"
  - "anthropic"
  - "discovery"
  - "inventory"
config:
  operations:
    - operation: "jq"
      arguments:
        key: ""
        query: |
          # ---------------------------------------------------------------
          # OCSF Cloud Resources Inventory Info (class_uid=5023) — v1.9.0
          # Input: one Anthropic organization role per invocation, as emitted
          # by the `anthropic-roles` input connector from the Compliance API
          # (GET /v1/compliance/organizations/{org_uuid}/roles), with the
          # connector-added organization_uuid:
          #   { id, name, description, created_at, updated_at,
          #     organization_uuid }
          # The connector re-emits the full role list every run, so each
          # event is an inventory snapshot of one role definition (a SaaS
          # resource of type "role"), not a user or a membership change.
          # activity_id=2 (Collect): proactively collected from the API.
          # The Anthropic organization is the cloud org context, so the
          # cloud profile is declared and cloud.org carries its uuid.
          # ---------------------------------------------------------------

          def to_epoch_ms($ts):
            def _num_ms($n):
              if   $n >= 1e17 then ($n / 1000000 | floor)
              elif $n >= 1e14 then ($n / 1000 | floor)
              elif $n >= 1e11 then ($n | floor)
              else ($n * 1000 | floor) end;
            if $ts == null or $ts == "" then null
            elif ($ts | type) == "number" then _num_ms($ts)
            elif ($ts | type) == "object" then
              (if ($ts.seconds // null) == null then null
               else ($ts.seconds * 1000 + ((($ts.nanos // 0) / 1000000) | floor)) end)
            elif ($ts | type) == "string" then
              if ($ts | test("^-?[0-9]+(\\.[0-9]+)?$")) then _num_ms($ts | tonumber)
              else
                ([$ts | ascii_upcase | capture("^(?<d>[0-9]{4}-[0-9]{2}-[0-9]{2})(?:[T ](?<t>[0-9]{2}:[0-9]{2}(?::[0-9]{2})?)(?:[.,](?<f>[0-9]+))?)? ?(?<z>Z|UTC|[+-][0-9]{2}(?::?[0-9]{2})?)?$")] | first) as $m
                | if $m == null then null
                  else
                    (($m.t // "00:00:00") | if length == 5 then . + ":00" else . end) as $t
                    | (($m.z // "Z") | if . == "Z" or . == "UTC" then 0
                        else (.[1:] | gsub(":"; "")) as $o
                          | ((if (.[0:1]) == "-" then -1 else 1 end)
                             * (($o[0:2] | tonumber) * 3600 + ((if ($o | length) >= 4 then $o[2:4] else "00" end) | tonumber) * 60))
                        end) as $off
                    | ((($m.d + "T" + $t + "Z") | fromdateiso8601) - $off) * 1000
                      + (((($m.f // "") + "000")[0:3]) | tonumber)
                  end
              end
            else null end;

          . as $r
          | (to_epoch_ms($r.updated_at // $r.created_at)) as $t
          | {
              # --- Classification (REQUIRED) ---
              "category_uid": 5,
              "class_uid":    5023,
              "activity_id":  2,
              "type_uid":     (5023 * 100 + 2),
              "severity_id":  1,
              "status_id":    1,

              # --- Time (REQUIRED) — last change to the role definition;
              # ingest time only when the record carries no timestamp ---
              "time": ($t // (now * 1000 | floor)),

              # --- Metadata (REQUIRED) ---
              "metadata": {
                "version":  "1.9.0",
                "profiles": [ "cloud" ],
                "product": {
                  "vendor_name": "Anthropic",
                  "name": "Anthropic Compliance API"
                }
              },

              # --- Cloud (cloud profile) — the Anthropic organization ---
              "cloud": {
                "provider": "Anthropic",
                "org": (if $r.organization_uuid != null
                        then { "uid": $r.organization_uuid } else null end)
              },

              # --- The inventoried role (satisfies at_least_one) ---
              "resources": [ {
                "uid":           $r.id,
                "name":          $r.name,
                "type":          "role",
                "provider":      "Anthropic",
                "created_time":  to_epoch_ms($r.created_at),
                "modified_time": to_epoch_ms($r.updated_at),
                "data":          (if ($r.description // "") != ""
                                  then { "description": $r.description } else null end)
              } ],

              "message": ("Anthropic organization role " + ($r.name // $r.id // "unknown")
                          + (if $r.organization_uuid != null then " in organization " + $r.organization_uuid else "" end)),

              "observables": (
                  (if $r.id   != null then [ { "name": "resources.uid",  "type_id": 10, "value": $r.id } ] else [] end)
                + (if $r.name != null then [ { "name": "resources.name", "type_id": 38, "value": $r.name } ] else [] end)),

              # --- Original record for audit ---
              "raw_data": ($r | tostring)
            }
          # Drop null/empty leaves; cloud.provider and the role resource keep
          # the required objects populated.
          | walk( if type == "object" then with_entries(select(.value != null and .value != "" and .value != [] and .value != {})) else . end )
