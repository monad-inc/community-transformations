name: "Anthropic Claude.ai Chat Messages to OCSF v1.9.0"
description: "Transforms Anthropic Compliance API chat message records (anthropic-chat-messages) into OCSF v1.9.0 API Activity (6003) events with the ai_operation profile, mapping the chat user, conversation context, and message role/content."
author: "Monad"
contributors:
  - "https://github.com/behobu"
inputs:
  - "anthropic-chat-messages"
tags:
  - "v1.9.0"
  - "ocsf"
  - "anthropic"
  - "ai"
  - "application"
config:
  operations:
    - operation: "jq"
      arguments:
        key: ""
        query: |
          # -----------------------------------------------------------------
          # Anthropic Compliance API chat message -> OCSF v1.9.0
          # One message record in -> one OCSF API Activity (6003) event out.
          #
          # A compliance chat message is an application-level event: a user
          # (human) or Claude (assistant) authored a message inside a Claude.ai
          # conversation. API Activity (6003) is the closest class that carries
          # the ai_operation profile (message_context) and models a
          # create-a-resource action without forcing an OS device/process.
          #
          # activity_id 1 = Create (a new message was authored).
          # ai_role_id: human -> 1 (User), assistant -> 2 (Assistant).
          #
          # NOTE ON osint/cloud: the bundled OCSF v1.9.0 schema resolves the
          # osint + cloud profile attributes as class-required, so both are
          # emitted at the top level to satisfy the structural validator. osint
          # is an empty array (no OSINT enrichment on a chat message); cloud
          # carries the SaaS provider.
          # -----------------------------------------------------------------

          def to_epoch_ms($ts):
            def _n: if . == null then null else tonumber end;
            def _num_ms($n):
              if   $n >= 1e17 then ($n / 1000000 | floor)
              elif $n >= 1e14 then ($n / 1000 | floor)
              elif $n >= 1e11 then ($n | floor)
              else ($n * 1000 + 0.001 | floor) end;
            def _digits_ms($d):
              ($d | ltrimstr("-") | length) as $l
              | if   $l >= 18 then ($d[0:-6] | tonumber)
                elif $l >= 15 then ($d[0:-3] | tonumber)
                elif $l >= 12 then ($d | tonumber)
                else ($d | tonumber) * 1000 end;
            def _frac_ms($f): if $f == null then 0 else (($f + "000")[0:3] | tonumber) end;
            def _mon($m):
              if $m == null then null
              else {"JAN":1,"FEB":2,"MAR":3,"APR":4,"MAY":5,"JUN":6,
                    "JUL":7,"AUG":8,"SEP":9,"OCT":10,"NOV":11,"DEC":12}[$m[0:3]] end;
            def _zone($z):
              if $z == null or $z == "" then 0
              else
                ($z | if test("^(UTC|GMT|UT)[+-]") then sub("^(UTC|GMT|UT)"; "") else . end) as $z
                | if ($z | test("^[+-][0-9]{1,2}(:?[0-9]{2})?$")) then
                    ($z | capture("^(?<sg>[+-])(?<h>[0-9]{1,2}):?(?<m>[0-9]{2})?$")) as $o
                    | (if $o.sg == "-" then -1 else 1 end)
                      * (($o.h | tonumber) * 3600 + (($o.m // "0") | tonumber) * 60)
                  else
                    {"Z":0,"UTC":0,"GMT":0,"UT":0,"EST":-18000,"EDT":-14400,"CST":-21600,
                     "CDT":-18000,"MST":-25200,"MDT":-21600,"PST":-28800,"PDT":-25200}[$z]
                  end
              end;
            def _ms($c):
              ($c.y | tonumber | if . < 100 then (if . < 70 then . + 2000 else . + 1900 end) else . end) as $y
              | ($c.mo | _n) as $mo
              | ($c.d | tonumber) as $d
              | (($c.h // "0") | tonumber) as $h
              | (($c.mi // "0") | tonumber) as $mi
              | (($c.s // "0") | tonumber) as $s
              | _zone($c.z) as $off
              | if $mo == null or $off == null or $mo < 1 or $mo > 12 or $d < 1 or $d > 31
                   or $h > 23 or $mi > 59 or $s > 60 then null
                else
                  ($y - (if $mo <= 2 then 1 else 0 end)) as $yy
                  | ($yy / 400 | floor) as $era
                  | ($yy - $era * 400) as $yoe
                  | (((153 * ($mo + (if $mo > 2 then -3 else 9 end)) + 2) / 5 | floor) + $d - 1) as $doy
                  | ($yoe * 365 + ($yoe / 4 | floor) - ($yoe / 100 | floor) + $doy) as $doe
                  | ($era * 146097 + $doe - 719468) as $days
                  | ($days * 86400 + $h * 3600 + $mi * 60 + $s - $off) * 1000 + _frac_ms($c.f)
                end;
            def _str($raw):
              ($raw | ascii_upcase | sub("\\s*\\([^)]*\\)\\s*$"; "") | sub("^\\s+"; "") | sub("\\s+$"; "")) as $s
              | "(?<z>Z|(?:UTC|GMT|UT)?[+-][0-9]{1,2}(?::?[0-9]{2})?|[A-Z]{1,5})" as $Z
              | "(?<h>[0-9]{1,2}):(?<mi>[0-9]{2})(?::(?<s>[0-9]{2}))?(?:[.,](?<f>[0-9]+))?" as $T
              | if $s == "" then null
                elif ($s | test("^-?[0-9]+$")) then _digits_ms($s)
                elif ($s | test("^[0-9]+\\.[0-9]+$")) then
                  ($s | split(".")) as $p
                  | if ($p[0] | length) <= 11 then _digits_ms($p[0]) + _frac_ms($p[1])
                    else _digits_ms($p[0]) end
                elif ($s | test("^/DATE\\(-?[0-9]+([+-][0-9]{4})?\\)/$")) then
                  ($s | capture("(?<ms>-?[0-9]+)").ms | tonumber)
                else
                  first(
                    ($s | capture("^(?<y>[0-9]{4})[-/](?<mo>[0-9]{1,2})[-/](?<d>[0-9]{1,2})(?:[T ]+" + $T + ")?\\s*" + $Z + "?(?:\\s+[A-Z]{2,5})?$") | _ms(.)),
                    ($s | capture("^(?<y>[0-9]{4})(?<mo>[0-9]{2})(?<d>[0-9]{2})T(?<h>[0-9]{2})(?<mi>[0-9]{2})(?<s>[0-9]{2})(?:[.,](?<f>[0-9]+))?" + $Z + "?$") | _ms(.)),
                    ($s | capture("^(?:[A-Z]+,?\\s+)?(?<d>[0-9]{1,2})[ -](?<mon>[A-Z]{3,9})[ -](?<y>[0-9]{2,4})\\s+" + $T + "\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?:[A-Z]+,?\\s+)?(?<mon>[A-Z]{3,9})\\.?\\s+(?<d>[0-9]{1,2}),?\\s+(?<y>[0-9]{4})(?:,?\\s+" + $T + ")?\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?:[A-Z]+\\s+)?(?<mon>[A-Z]{3,9})\\s+(?<d>[0-9]{1,2})\\s+" + $T + "\\s+(?:" + $Z + "\\s+)?(?<y>[0-9]{4})$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?<d>[0-9]{1,2})/(?<mon>[A-Z]{3})/(?<y>[0-9]{4}):" + $T + "\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.))
                  ) // null
                end;
            if $ts == null then null
            elif ($ts | type) == "number" then _num_ms($ts)
            elif ($ts | type) == "string" then _str($ts)
            elif ($ts | type) == "object" then
              if   $ts["$date"] != null then to_epoch_ms($ts["$date"])
              elif $ts["$numberLong"] != null then to_epoch_ms($ts["$numberLong"])
              elif $ts.seconds != null then
                ($ts.seconds | tostring | tonumber) * 1000
                + ((($ts.nanos // 0) | tostring | tonumber) / 1000000 | floor)
              else null end
            else null end;

          . as $r
          | ($r.chat_user // {}) as $cu
          | ($r.role // "unknown") as $role
          | (if $role == "assistant" then 2 elif $role == "human" then 1 else 0 end) as $ai_role
          | ([ ($r.content // [])[]? | .type ] | map(select(. != null)) | unique) as $ctypes
          | ([ ($r.content // [])[]? | select(.type == "text") | .text ]
             | map(select(. != null)) | join("\n")) as $text
          | ($cu.email_address // "") as $email
          | (if ($email | index("@")) != null then ($email | split("@")[0]) else null end) as $uname

          | ({ type_id: 1,
               name: (if ($uname // "") != "" then $uname else ($cu.id // (if $email != "" then $email else "unknown" end)) end),
               uid: $cu.id,
               email_addr: (if $email != "" then $email else null end) }) as $user

          | ([ (if $email != "" then {name:"actor.user.email_addr", type_id:5, value:$email} else empty end),
               (if ($r.id // "") != "" then {name:"metadata.uid", type_id:10, value:$r.id} else empty end) ]) as $obs

          | ({ chat_id: $r.chat_id,
               chat_name: $r.chat_name,
               project_id: $r.project_id,
               organization_id: $r.organization_id,
               organization_uuid: $r.organization_uuid,
               message_role: $role,
               content_types: $ctypes,
               content_length: (if ($text | length) > 0 then ($text | length) else null end),
               content_preview: (if ($text | length) > 280 then (($text[0:280]) + "…") else (if $text == "" then null else $text end) end),
               file_count: (($r.files // []) | length),
               artifact_count: (($r.artifacts // []) | length) }) as $ctx

          | { time: to_epoch_ms($r.created_at),
              category_uid: 6,
              class_uid: 6003,
              activity_id: 1,
              type_uid: 600301,
              severity_id: 1,
              status_id: 1,
              status: "Success",
              metadata: {
                version: "1.9.0",
                product: { vendor_name: "Anthropic", name: "Claude.ai",
                           feature: { name: "Compliance API" } },
                log_name: "chat.message",
                uid: $r.id,
                tenant_uid: ($r.organization_id // $r.organization_uuid),
                profiles: ["ai_operation"]
              },
              cloud: { provider: "Anthropic" },
              actor: { user: $user, app_name: "Claude.ai" },
              api: {
                operation: ("chat.message." + $role),
                service: { name: "Claude.ai", version: null },
                request: { uid: $r.id }
              },
              message_context: {
                ai_role_id: $ai_role,
                service: { name: "Claude.ai" }
              },
              src_endpoint: { name: "claude.ai", svc_name: "Claude.ai" },
              observables: $obs,
              message: ($role + " message in chat \"" + ($r.chat_name // "untitled") + "\""),
              unmapped: $ctx }

          # prune null / empty-string / empty-array leaves
          | walk(if type == "object"
                 then with_entries(select((.value != null) and (.value != "")
                        and ((((.value | type) == "array") and ((.value | length) == 0)) | not)))
                 else . end)
          # re-assert osint (empty = no OSINT on a chat message) after prune so the
          # bundle-required top-level key survives the empty-array drop
          | .osint = []
