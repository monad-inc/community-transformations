name: "Monad Organization Logs to OCSF v1.9.0"
description: "Transforms Monad Organization Logs (monad-logs) into the OCSF v1.9.0 API Activity (6003) class."
author: "Monad"
contributors:
  - "https://github.com/behobu"
inputs:
  - "monad-logs"
tags:
  - "v1.9.0"
  - "ocsf"
  - "monad"
  - "organization"
  - "logs"
  - "api-activity"
config:
  operations:
    - operation: "jq"
      arguments:
        key: ""
        query: |
          # Monad Organization Logs -> OCSF v1.9.0 API Activity (class_uid 6003)
          def to_epoch_ms($ts):
            def _num_ms($n):
              if   $n >= 1e17 then ($n / 1000000 | floor)
              elif $n >= 1e14 then ($n / 1000 | floor)
              elif $n >= 1e11 then ($n | floor)
              else ($n * 1000 | floor) end;
            if $ts == null or $ts == "" then null
            elif ($ts | type) == "number" then _num_ms($ts)
            elif ($ts | type) == "object" then
              (if ($ts.seconds // null) == null then null
               else ($ts.seconds * 1000 + ((($ts.nanos // 0) / 1000000) | floor)) end)
            elif ($ts | type) == "string" then
              if ($ts | test("^-?[0-9]+(\\.[0-9]+)?$")) then _num_ms($ts | tonumber)
              else
                ([$ts | ascii_upcase | capture("^(?<d>[0-9]{4}-[0-9]{2}-[0-9]{2})(?:[T ](?<t>[0-9]{2}:[0-9]{2}(?::[0-9]{2})?)(?:[.,](?<f>[0-9]+))?)? ?(?<z>Z|UTC|[+-][0-9]{2}(?::?[0-9]{2})?)?$")] | first) as $m
                | if $m == null then null
                  else
                    (($m.t // "00:00:00") | if length == 5 then . + ":00" else . end) as $t
                    | (($m.z // "Z") | if . == "Z" or . == "UTC" then 0
                        else (.[1:] | gsub(":"; "")) as $o
                          | ((if (.[0:1]) == "-" then -1 else 1 end)
                             * (($o[0:2] | tonumber) * 3600 + ((if ($o | length) >= 4 then $o[2:4] else "00" end) | tonumber) * 60))
                        end) as $off
                    | ((($m.d + "T" + $t + "Z") | fromdateiso8601) - $off) * 1000
                      + (((($m.f // "") + "000")[0:3]) | tonumber)
                  end
              end
            else null end;

          . as $r
          | (
              if   $r.method == "GET"    then 2   # Read
              elif $r.method == "POST"   then 1   # Create
              elif $r.method == "PATCH"  then 3   # Update
              elif $r.method == "PUT"    then 3   # Update
              elif $r.method == "DELETE" then 4   # Delete
              else 99                             # Other
              end
            ) as $activity_id
          | (
              if   ($r.status | tonumber) >= 500 then 4   # High
              elif ($r.status | tonumber) >= 400 then 3   # Medium
              else 1                                       # Informational
              end
            ) as $severity_id
          | {
              "time": to_epoch_ms($r.timestamp),
              "activity_id": $activity_id,
              "type_uid": (6003 * 100 + $activity_id),
              "category_uid": 6,
              "class_uid": 6003,
              "severity_id": $severity_id,
              "metadata": {
                "profiles": ["cloud", "osint"],
                "product": {
                  "name": "Monad",
                  "vendor_name": "Monad",
                  "version": ($r.log_version // "unknown")
                },
                "version": "1.9.0"
              },
              "cloud": {
                "provider": "Monad"
              },
              "actor": {
                "user": {
                  "name": $r.user_email,
                  "email_addr": $r.user_email
                }
              },
              "api": {
                "operation": $r.method,
                "request": {
                  "uid": $r.id
                },
                "response": {
                  "code": ($r.status | tonumber)
                }
              },
              "src_endpoint": {
                "ip": $r.client_ip
              },
              "http_request": {
                "http_method": $r.method,
                "url": { "path": $r.resource },
                "user_agent": $r.client_info
              },
              "osint": [],
              "unmapped": (
                { "additional_info": $r.additional_info }
                | with_entries(select(.value != null))
              )
            }
