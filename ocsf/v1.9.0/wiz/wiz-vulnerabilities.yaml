name: "Wiz Vulnerabilities to OCSF v1.9.0"
description: "Transforms Wiz Vulnerabilities into the OCSF v1.9.0 Vulnerability Finding class (class_uid 2002)."
author: "Monad"
contributors:
  - "https://github.com/behobu"
  - "https://github.com/Credgate"
inputs:
  - "wiz-vulnerabilities"
tags:
  - "v1.9.0"
  - "ocsf"
  - "wiz"
  - "vulnerability"
config:
  operations:
    - operation: "jq"
      arguments:
        key: ""
        query: |
          # ---------------------------------------------------------------
          # OCSF Vulnerability Finding (class_uid=2002) — v1.9.0
          # Input: one Wiz vulnerability finding record per invocation.
          # Handles both the camelCase (GraphQL) and PascalCase (report)
          # field spellings Wiz emits.
          # ---------------------------------------------------------------

          def to_epoch_ms($ts):
            def _n: if . == null then null else tonumber end;
            def _num_ms($n):
              if   $n >= 1e17 then ($n / 1000000 | floor)
              elif $n >= 1e14 then ($n / 1000 | floor)
              elif $n >= 1e11 then ($n | floor)
              else ($n * 1000 + 0.001 | floor) end;
            def _digits_ms($d):
              ($d | ltrimstr("-") | length) as $l
              | if   $l >= 18 then ($d[0:-6] | tonumber)
                elif $l >= 15 then ($d[0:-3] | tonumber)
                elif $l >= 12 then ($d | tonumber)
                else ($d | tonumber) * 1000 end;
            def _frac_ms($f): if $f == null then 0 else (($f + "000")[0:3] | tonumber) end;
            def _mon($m):
              if $m == null then null
              else {"JAN":1,"FEB":2,"MAR":3,"APR":4,"MAY":5,"JUN":6,
                    "JUL":7,"AUG":8,"SEP":9,"OCT":10,"NOV":11,"DEC":12}[$m[0:3]] end;
            def _zone($z):
              if $z == null or $z == "" then 0
              else
                ($z | if test("^(UTC|GMT|UT)[+-]") then sub("^(UTC|GMT|UT)"; "") else . end) as $z
                | if ($z | test("^[+-][0-9]{1,2}(:?[0-9]{2})?$")) then
                    ($z | capture("^(?<sg>[+-])(?<h>[0-9]{1,2}):?(?<m>[0-9]{2})?$")) as $o
                    | (if $o.sg == "-" then -1 else 1 end)
                      * (($o.h | tonumber) * 3600 + (($o.m // "0") | tonumber) * 60)
                  else
                    {"Z":0,"UTC":0,"GMT":0,"UT":0,"EST":-18000,"EDT":-14400,"CST":-21600,
                     "CDT":-18000,"MST":-25200,"MDT":-21600,"PST":-28800,"PDT":-25200}[$z]
                  end
              end;
            def _ms($c):
              ($c.y | tonumber | if . < 100 then (if . < 70 then . + 2000 else . + 1900 end) else . end) as $y
              | ($c.mo | _n) as $mo
              | ($c.d | tonumber) as $d
              | (($c.h // "0") | tonumber) as $h
              | (($c.mi // "0") | tonumber) as $mi
              | (($c.s // "0") | tonumber) as $s
              | _zone($c.z) as $off
              | if $mo == null or $off == null or $mo < 1 or $mo > 12 or $d < 1 or $d > 31
                   or $h > 23 or $mi > 59 or $s > 60 then null
                else
                  ($y - (if $mo <= 2 then 1 else 0 end)) as $yy
                  | ($yy / 400 | floor) as $era
                  | ($yy - $era * 400) as $yoe
                  | (((153 * ($mo + (if $mo > 2 then -3 else 9 end)) + 2) / 5 | floor) + $d - 1) as $doy
                  | ($yoe * 365 + ($yoe / 4 | floor) - ($yoe / 100 | floor) + $doy) as $doe
                  | ($era * 146097 + $doe - 719468) as $days
                  | ($days * 86400 + $h * 3600 + $mi * 60 + $s - $off) * 1000 + _frac_ms($c.f)
                end;
            def _str($raw):
              ($raw | ascii_upcase | sub("\\s*\\([^)]*\\)\\s*$"; "") | sub("^\\s+"; "") | sub("\\s+$"; "")) as $s
              | "(?<z>Z|(?:UTC|GMT|UT)?[+-][0-9]{1,2}(?::?[0-9]{2})?|[A-Z]{1,5})" as $Z
              | "(?<h>[0-9]{1,2}):(?<mi>[0-9]{2})(?::(?<s>[0-9]{2}))?(?:[.,](?<f>[0-9]+))?" as $T
              | if $s == "" then null
                elif ($s | test("^-?[0-9]+$")) then _digits_ms($s)
                elif ($s | test("^[0-9]+\\.[0-9]+$")) then
                  ($s | split(".")) as $p
                  | if ($p[0] | length) <= 11 then _digits_ms($p[0]) + _frac_ms($p[1])
                    else _digits_ms($p[0]) end
                elif ($s | test("^/DATE\\(-?[0-9]+([+-][0-9]{4})?\\)/$")) then
                  ($s | capture("(?<ms>-?[0-9]+)").ms | tonumber)
                else
                  first(
                    ($s | capture("^(?<y>[0-9]{4})[-/](?<mo>[0-9]{1,2})[-/](?<d>[0-9]{1,2})(?:[T ]+" + $T + ")?\\s*" + $Z + "?(?:\\s+[A-Z]{2,5})?$") | _ms(.)),
                    ($s | capture("^(?<y>[0-9]{4})(?<mo>[0-9]{2})(?<d>[0-9]{2})T(?<h>[0-9]{2})(?<mi>[0-9]{2})(?<s>[0-9]{2})(?:[.,](?<f>[0-9]+))?" + $Z + "?$") | _ms(.)),
                    ($s | capture("^(?:[A-Z]+,?\\s+)?(?<d>[0-9]{1,2})[ -](?<mon>[A-Z]{3,9})[ -](?<y>[0-9]{2,4})\\s+" + $T + "\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?:[A-Z]+,?\\s+)?(?<mon>[A-Z]{3,9})\\.?\\s+(?<d>[0-9]{1,2}),?\\s+(?<y>[0-9]{4})(?:,?\\s+" + $T + ")?\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?:[A-Z]+\\s+)?(?<mon>[A-Z]{3,9})\\s+(?<d>[0-9]{1,2})\\s+" + $T + "\\s+(?:" + $Z + "\\s+)?(?<y>[0-9]{4})$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?<d>[0-9]{1,2})/(?<mon>[A-Z]{3})/(?<y>[0-9]{4}):" + $T + "\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.))
                  ) // null
                end;
            if $ts == null then null
            elif ($ts | type) == "number" then _num_ms($ts)
            elif ($ts | type) == "string" then _str($ts)
            elif ($ts | type) == "object" then
              if   $ts["$date"] != null then to_epoch_ms($ts["$date"])
              elif $ts["$numberLong"] != null then to_epoch_ms($ts["$numberLong"])
              elif $ts.seconds != null then
                ($ts.seconds | tostring | tonumber) * 1000
                + ((($ts.nanos // 0) | tostring | tonumber) / 1000000 | floor)
              else null end
            else null end;

          def sev($s):
            if   $s == "CRITICAL"      or $s == "Critical"      then 5
            elif $s == "HIGH"          or $s == "High"          then 4
            elif $s == "MEDIUM"        or $s == "Medium"        then 3
            elif $s == "LOW"           or $s == "Low"           then 2
            elif $s == "INFORMATIONAL" or $s == "Informational" then 1
            else 0 end;

          # impact_id uses the Finding impact scale (Critical=4, no 5-value).
          def impact($s):
            if   $s == "CRITICAL"      or $s == "Critical"      then 4
            elif $s == "HIGH"          or $s == "High"          then 3
            elif $s == "MEDIUM"        or $s == "Medium"        then 2
            elif $s == "LOW"           or $s == "Low"           then 1
            elif $s == "INFORMATIONAL" or $s == "Informational" then 1
            else 0 end;

          . as $r
          | ($r.vulnerableAsset // {}) as $a
          | ($r.name // $r.Name) as $cve_id
          | ($r.vendorSeverity // $r.VendorSeverity) as $vsev
          | ($r.cloudPlatform // $a.cloudPlatform // $r.CloudPlatform) as $provider
          | {
              # --- Classification (REQUIRED) ---
              "category_uid": 2,
              "class_uid": 2002,
              "activity_id": 1,
              "type_uid": 200201,
              "severity_id": (sev($vsev)),

              # --- Time (REQUIRED) ---
              "time": (
                (to_epoch_ms($r.firstDetectedAt // $r.FirstDetected)) // (now * 1000 | floor)
              ),
              "start_time": (to_epoch_ms($r.firstDetectedAt // $r.FirstDetected)),
              "end_time": (to_epoch_ms($r.lastDetectedAt // $r.LastDetected)),

              # --- Status ---
              "status_id": (
                if   ($r.status // $r.FindingStatus) == "OPEN"        or ($r.status // $r.FindingStatus) == "Open"       then 1
                elif ($r.status // $r.FindingStatus) == "IN_PROGRESS" or ($r.status // $r.FindingStatus) == "InProgress" then 2
                elif ($r.status // $r.FindingStatus) == "RESOLVED"    or ($r.status // $r.FindingStatus) == "Resolved"   then 99
                else 0 end
              ),

              # --- finding_info (REQUIRED; requires uid) ---
              "finding_info": {
                "uid": ($r.id // $r.ID),
                "title": ($r.name // $r.Name),
                "desc": ($r.description // $r.Description),
                "types": ["Vulnerability"],
                "src_url": ($r.portalUrl // $r.WizURL)
              },

              # --- vulnerabilities (REQUIRED) ---
              "vulnerabilities": [
                {
                  "cve": {
                    "uid": $cve_id,
                    "cvss": (
                      if ($r.score // $r.Score) then [
                        {
                          "base_score": ($r.score // $r.Score),
                          "version": "3.1",
                          "severity": ($r.cvssSeverity // $r.CVSSSeverity)
                        }
                      ] else null end
                    )
                  },
                  "desc": ($r.CVEDescription // $r.description // $r.Description),
                  "title": $cve_id,
                  "severity": $vsev,
                  "is_exploit_available": ($r.hasExploit // $r.HasExploit),
                  "is_fix_available": (if ($r.fixedVersion // $r.FixedVersion) then true else false end),
                  "first_seen_time": (to_epoch_ms($r.firstDetectedAt // $r.FirstDetected)),
                  "last_seen_time": (to_epoch_ms($r.lastDetectedAt // $r.LastDetected)),
                  "affected_packages": [
                    {
                      "name": ($r.detailedName // $r.DetailedName),
                      "version": ($r.version // $r.Version),
                      "fixed_in_version": ($r.fixedVersion // $r.FixedVersion),
                      "path": ($r.locationPath // $r.LocationPath)
                    }
                  ],
                  "references": (
                    if   ($r.link // $r.Link) then [($r.link // $r.Link)]
                    else [] end
                  ),
                  "remediation": (
                    if ($r.remediation // $r.Remediation) then {
                      "desc": ($r.remediation // $r.Remediation)
                    } else null end
                  ),
                  "vendor_name": "Wiz"
                }
              ],

              # --- osint (REQUIRED in 1.9.0; value + type_id) ---
              "osint": [
                {
                  "value": $cve_id,
                  "type_id": 10
                }
              ],

              # --- resources ---
              "resources": [
                {
                  "uid": ($a.id // $r.AssetID),
                  "name": ($a.name // $r.AssetName),
                  "type": ($a.type // $r.OperatingSystem // "Unknown"),
                  "region": ($a.region // $r.AssetRegion),
                  "cloud_partition": $provider,
                  "labels": (
                    if $a.tags then [$a.tags | to_entries[] | (.key + ":" + (.value | tostring))]
                    elif $r.Tags then [$r.Tags | to_entries[] | (.key + ":" + (.value | tostring))]
                    else [] end
                  )
                }
              ],

              # --- cloud (REQUIRED; requires provider) ---
              "cloud": {
                "provider": ($provider // "Unknown"),
                "region": ($a.region // $r.AssetRegion),
                "account": {
                  "uid": ($a.subscriptionId // $r.SubscriptionId),
                  "name": ($a.subscriptionName // $r.SubscriptionName)
                }
              },

              # --- confidence / impact ---
              "confidence_id": 3,
              "impact_id": (impact($vsev)),

              # --- metadata (REQUIRED; requires product + version) ---
              "metadata": {
                "profiles": ["cloud", "osint", "incident"],
                "uid": ($r.id // $r.ID),
                "version": "1.9.0",
                "product": {
                  "name": "Wiz",
                  "vendor_name": "Wiz, Inc.",
                  "version": "1.0"
                },
                "labels": (
                  [
                    (if ($r.detectionMethod // $r.DetectionMethod) then ("detection_method:" + ($r.detectionMethod // $r.DetectionMethod)) else empty end),
                    (if ($r.hasCisaKevExploit // $r.HasCisaKevExploit) then "cisa_kev:true" else empty end),
                    (if $r.validatedInRuntime then ("validated_in_runtime:" + ($r.validatedInRuntime | tostring)) else empty end),
                    (if $r.dataSourceName then ("data_source:" + $r.dataSourceName) else empty end),
                    (if $r.projects then ($r.projects[] | ("project:" + .)) else empty end)
                  ]
                )
              },

              # --- observables ---
              "observables": (
                [
                  (if ($a.id // $r.AssetID) then {
                    "name": "resource.uid",
                    "type": "Resource UID",
                    "type_id": 10,
                    "value": ($a.id // $r.AssetID)
                  } else empty end),
                  (if ($cve_id | type) == "string" and ($cve_id | startswith("CVE-")) then {
                    "name": "vulnerabilities.cve.uid",
                    "type": "Resource UID",
                    "type_id": 10,
                    "value": $cve_id
                  } else empty end)
                ]
              ),

              # --- Original record for audit / debugging ---
              "raw_data": (. | tostring)
            }
          # Prune null / empty leaves while keeping required objects present.
          | walk(
              if type == "object" then with_entries(select(.value != null and .value != {} and .value != []))
              elif type == "array" then map(select(. != null))
              else . end
            )
