name: "AWS Redshift Audit Logs to OCSF v1.9.0"
description: "Transforms AWS Redshift database audit connection-log records into the OCSF v1.9.0 Authentication (3002) class."
author: "Monad"
contributors:
  - "https://github.com/behobu"
inputs:
  - "aws-redshift-audit-logs"
tags:
  - "v1.9.0"
  - "ocsf"
  - "aws"
  - "iam"
config:
  operations:
    - operation: "jq"
      arguments:
        key: ""
        query: |
          # ---------------------------------------------------------------
          # OCSF Authentication (class_uid=3002, category_uid=3) — v1.9.0
          # Input: one AWS Redshift audit connection-log record per
          #   invocation (event, recordtime, remotehost, remoteport,
          #   username, authmethod, sslversion, sslcipher, sessionid, ...).
          # The connection log records authentication attempts, connections,
          # and disconnections — the security-relevant Redshift audit stream.
          # ---------------------------------------------------------------


          def to_epoch_ms($ts):
            def _n: if . == null then null else tonumber end;
            def _num_ms($n):
              if   $n >= 1e17 then ($n / 1000000 | floor)
              elif $n >= 1e14 then ($n / 1000 | floor)
              elif $n >= 1e11 then ($n | floor)
              else ($n * 1000 + 0.001 | floor) end;
            def _digits_ms($d):
              ($d | ltrimstr("-") | length) as $l
              | if   $l >= 18 then ($d[0:-6] | tonumber)
                elif $l >= 15 then ($d[0:-3] | tonumber)
                elif $l >= 12 then ($d | tonumber)
                else ($d | tonumber) * 1000 end;
            def _frac_ms($f): if $f == null then 0 else (($f + "000")[0:3] | tonumber) end;
            def _mon($m):
              if $m == null then null
              else {"JAN":1,"FEB":2,"MAR":3,"APR":4,"MAY":5,"JUN":6,
                    "JUL":7,"AUG":8,"SEP":9,"OCT":10,"NOV":11,"DEC":12}[$m[0:3]] end;
            def _zone($z):
              if $z == null or $z == "" then 0
              else
                ($z | if test("^(UTC|GMT|UT)[+-]") then sub("^(UTC|GMT|UT)"; "") else . end) as $z
                | if ($z | test("^[+-][0-9]{1,2}(:?[0-9]{2})?$")) then
                    ($z | capture("^(?<sg>[+-])(?<h>[0-9]{1,2}):?(?<m>[0-9]{2})?$")) as $o
                    | (if $o.sg == "-" then -1 else 1 end)
                      * (($o.h | tonumber) * 3600 + (($o.m // "0") | tonumber) * 60)
                  else
                    {"Z":0,"UTC":0,"GMT":0,"UT":0,"EST":-18000,"EDT":-14400,"CST":-21600,
                     "CDT":-18000,"MST":-25200,"MDT":-21600,"PST":-28800,"PDT":-25200}[$z]
                  end
              end;
            def _ms($c):
              ($c.y | tonumber | if . < 100 then (if . < 70 then . + 2000 else . + 1900 end) else . end) as $y
              | ($c.mo | _n) as $mo
              | ($c.d | tonumber) as $d
              | (($c.h // "0") | tonumber) as $h
              | (($c.mi // "0") | tonumber) as $mi
              | (($c.s // "0") | tonumber) as $s
              | _zone($c.z) as $off
              | if $mo == null or $off == null or $mo < 1 or $mo > 12 or $d < 1 or $d > 31
                   or $h > 23 or $mi > 59 or $s > 60 then null
                else
                  ($y - (if $mo <= 2 then 1 else 0 end)) as $yy
                  | ($yy / 400 | floor) as $era
                  | ($yy - $era * 400) as $yoe
                  | (((153 * ($mo + (if $mo > 2 then -3 else 9 end)) + 2) / 5 | floor) + $d - 1) as $doy
                  | ($yoe * 365 + ($yoe / 4 | floor) - ($yoe / 100 | floor) + $doy) as $doe
                  | ($era * 146097 + $doe - 719468) as $days
                  | ($days * 86400 + $h * 3600 + $mi * 60 + $s - $off) * 1000 + _frac_ms($c.f)
                end;
            def _str($raw):
              ($raw | ascii_upcase | sub("\\s*\\([^)]*\\)\\s*$"; "") | sub("^\\s+"; "") | sub("\\s+$"; "")) as $s
              | "(?<z>Z|(?:UTC|GMT|UT)?[+-][0-9]{1,2}(?::?[0-9]{2})?|[A-Z]{1,5})" as $Z
              | "(?<h>[0-9]{1,2}):(?<mi>[0-9]{2})(?::(?<s>[0-9]{2}))?(?:[.,](?<f>[0-9]+))?" as $T
              | if $s == "" then null
                elif ($s | test("^-?[0-9]+$")) then _digits_ms($s)
                elif ($s | test("^[0-9]+\\.[0-9]+$")) then
                  ($s | split(".")) as $p
                  | if ($p[0] | length) <= 11 then _digits_ms($p[0]) + _frac_ms($p[1])
                    else _digits_ms($p[0]) end
                elif ($s | test("^/DATE\\(-?[0-9]+([+-][0-9]{4})?\\)/$")) then
                  ($s | capture("(?<ms>-?[0-9]+)").ms | tonumber)
                else
                  first(
                    ($s | capture("^(?<y>[0-9]{4})[-/](?<mo>[0-9]{1,2})[-/](?<d>[0-9]{1,2})(?:[T ]+" + $T + ")?\\s*" + $Z + "?(?:\\s+[A-Z]{2,5})?$") | _ms(.)),
                    ($s | capture("^(?<y>[0-9]{4})(?<mo>[0-9]{2})(?<d>[0-9]{2})T(?<h>[0-9]{2})(?<mi>[0-9]{2})(?<s>[0-9]{2})(?:[.,](?<f>[0-9]+))?" + $Z + "?$") | _ms(.)),
                    ($s | capture("^(?:[A-Z]+,?\\s+)?(?<d>[0-9]{1,2})[ -](?<mon>[A-Z]{3,9})[ -](?<y>[0-9]{2,4})\\s+" + $T + "\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?:[A-Z]+,?\\s+)?(?<mon>[A-Z]{3,9})\\.?\\s+(?<d>[0-9]{1,2}),?\\s+(?<y>[0-9]{4})(?:,?\\s+" + $T + ")?\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?:[A-Z]+\\s+)?(?<mon>[A-Z]{3,9})\\s+(?<d>[0-9]{1,2})\\s+" + $T + "\\s+(?:" + $Z + "\\s+)?(?<y>[0-9]{4})$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?<d>[0-9]{1,2})/(?<mon>[A-Z]{3})/(?<y>[0-9]{4}):" + $T + "\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.))
                  ) // null
                end;
            if $ts == null then null
            elif ($ts | type) == "number" then _num_ms($ts)
            elif ($ts | type) == "string" then _str($ts)
            elif ($ts | type) == "object" then
              if   $ts["$date"] != null then to_epoch_ms($ts["$date"])
              elif $ts["$numberLong"] != null then to_epoch_ms($ts["$numberLong"])
              elif $ts.seconds != null then
                ($ts.seconds | tostring | tonumber) * 1000
                + ((($ts.nanos // 0) | tostring | tonumber) / 1000000 | floor)
              else null end
            else null end;

          def is_ip($s):
            def _v4: test("^((25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])[.]){3}(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])$");
            def _v6:
              if (contains(":") and test("^[0-9A-Fa-f:.]+$")) | not then false
              else
                split("::") as $p
                | if ($p | length) > 2 then false
                  else
                    [$p[] | select(. != "") | split(":")[]] as $g
                    | (($g | length) > 0 and ($g[-1] | contains("."))) as $tail4
                    | (if $tail4 then $g[0:-1] else $g end) as $hex
                    | (($hex | length) + (if $tail4 then 2 else 0 end)) as $n
                    | (if $tail4 then ($g[-1] | _v4) else true end)
                      and all($hex[]; test("^[0-9A-Fa-f]{1,4}$"))
                      and (if ($p | length) == 2 then $n <= 7 else $n == 8 end)
                  end
              end;
            ($s | type) == "string" and ($s | _v4 or _v6);

          . as $r
          | ($r.event // "" | ascii_downcase) as $ev

          # Activity: authenticated / initiating session -> Logon(1);
          # disconnecting session -> Logoff(2); everything else -> Unknown(0).
          | ( if ($ev | test("disconnect")) then 2
              elif ($ev | test("auth|initiat|session")) then 1
              else 0 end ) as $activity_id

          # Status: explicit "authentication failure" -> Failure(2);
          # a positive connection/auth event -> Success(1); else Unknown(0).
          | ( if ($ev | test("fail|denied|error")) then 2
              elif ($ev | test("auth|initiat|session|connect")) then 1
              else 0 end ) as $status_id

          | ( if $status_id == 2 then 3 else 1 end ) as $severity_id

          | {
              category_uid: 3,
              class_uid:    3002,
              type_uid:     (3002 * 100 + $activity_id),
              activity_id:  $activity_id,
              severity_id:  $severity_id,
              status_id:    $status_id,

              time: to_epoch_ms($r.recordtime),

              metadata: {
                "profiles": ["cloud", "osint"],
                version: "1.9.0",
                product: {
                  vendor_name: "AWS",
                  name: "Amazon Redshift",
                  feature: { name: "Database Audit Logging" }
                },
                log_name: "connectionlog",
                original_time: ($r.recordtime // null)
              },

              # Authentication class requires osint (indicator context); a
              # connection-log auth event carries none, so emit an empty array.
              osint: [],

              # user constraint: at_least_one [account, name, uid]. Redshift's
              # connection log identifies the principal by database user name.
              user: {
                name: ($r.username // null),
                domain: ($r.dbname // null)
              },

              cloud: {
                provider: "AWS",
                region: ($r.region // null),
                account: ( if $r.account then { uid: ($r.account | tostring) } else null end )
              },

              src_endpoint: {
                ip: ( if is_ip($r.remotehost) then $r.remotehost else null end ),
                hostname: ( if is_ip($r.remotehost) then null else $r.remotehost end ),
                port: ( if $r.remoteport then ($r.remoteport | tonumber? // null) else null end )
              },

              # Authentication constraint: at_least_one [service, dst_endpoint].
              # The connection is made TO the Redshift cluster; identify it by
              # cluster id / database name so the auth target is expressed.
              dst_endpoint: ( {
                svc_name: ($r.clusterid // null),
                domain: ($r.dbname // null)
              } | with_entries(select(.value != null)) ),

              # authmethod (e.g. "IAM AssumeUser", "password", "MD5") is the
              # protocol/method the client used to authenticate.
              auth_protocol: ($r.authmethod // null),

              session: ( if $r.sessionid then { uid: ($r.sessionid | tostring) } else null end ),

              status_detail: ($r.event // null),
              message: ( ($r.event // "connection event") + " for user " + ($r.username // "unknown") ),

              unmapped: {
                pid: ($r.pid // null),
                duration: ($r.duration // null),
                sslversion: ($r.sslversion // null),
                sslcipher: ($r.sslcipher // null),
                application_name: ($r.application_name // null),
                driver_version: ($r.driver_version // null),
                os_version: ($r.os_version // null),
                plugin_name: ($r.plugin_name // null),
                protocol_version: ($r.protocol_version // null),
                iamauthguid: ($r.iamauthguid // null),
                clusterid: ($r.clusterid // null),
                compression: ($r.compression // null),
                mtu: ($r.mtu // null)
              },

              raw_data: ($r | tostring)
            }
          | walk( if type == "object" then with_entries(select(.value != null and .value != {})) else . end )
