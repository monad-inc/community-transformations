name: "AWS CloudTrail (SQS/S3) to OCSF v1.9.0"
description: "Transforms AWS CloudTrail management/data event records delivered via the aws-sqs-s3-cloudtrail connector into the OCSF v1.9.0 API Activity class (class_uid 6003)."
author: "Monad"
contributors:
  - "https://github.com/behobu"
inputs:
  - "aws-sqs-s3-cloudtrail"
tags:
  - "v1.9.0"
  - "ocsf"
  - "aws"
  - "application"
config:
  operations:
    - operation: "jq"
      arguments:
        key: ""
        query: |
          # ---------------------------------------------------------------
          # OCSF API Activity (class_uid=6003, category_uid=6) — v1.9.0
          # Input: ONE raw AWS CloudTrail event record per invocation, as
          # delivered by the `aws-sqs-s3-cloudtrail` connector (one bare
          # event per record; the CloudTrail `Records` envelope is exploded
          # upstream by the connector's per_record chunking).
          #
          # AWS CloudTrail is the canonical example named in the OCSF API
          # Activity class description, so every general CRUD API call maps
          # here (ConsoleLogin / AssumeRole sign-in forms would pivot to the
          # Authentication class in a separate transform).
          # ---------------------------------------------------------------


          # An `ip`-typed OCSF field must not receive an AWS service name
          # (e.g. "cloudtrail.amazonaws.com"); guard before assigning.
          def to_epoch_ms($ts):
            def _n: if . == null then null else tonumber end;
            def _num_ms($n):
              if   $n >= 1e17 then ($n / 1000000 | floor)
              elif $n >= 1e14 then ($n / 1000 | floor)
              elif $n >= 1e11 then ($n | floor)
              else ($n * 1000 + 0.001 | floor) end;
            def _digits_ms($d):
              ($d | ltrimstr("-") | length) as $l
              | if   $l >= 18 then ($d[0:-6] | tonumber)
                elif $l >= 15 then ($d[0:-3] | tonumber)
                elif $l >= 12 then ($d | tonumber)
                else ($d | tonumber) * 1000 end;
            def _frac_ms($f): if $f == null then 0 else (($f + "000")[0:3] | tonumber) end;
            def _mon($m):
              if $m == null then null
              else {"JAN":1,"FEB":2,"MAR":3,"APR":4,"MAY":5,"JUN":6,
                    "JUL":7,"AUG":8,"SEP":9,"OCT":10,"NOV":11,"DEC":12}[$m[0:3]] end;
            def _zone($z):
              if $z == null or $z == "" then 0
              else
                ($z | if test("^(UTC|GMT|UT)[+-]") then sub("^(UTC|GMT|UT)"; "") else . end) as $z
                | if ($z | test("^[+-][0-9]{1,2}(:?[0-9]{2})?$")) then
                    ($z | capture("^(?<sg>[+-])(?<h>[0-9]{1,2}):?(?<m>[0-9]{2})?$")) as $o
                    | (if $o.sg == "-" then -1 else 1 end)
                      * (($o.h | tonumber) * 3600 + (($o.m // "0") | tonumber) * 60)
                  else
                    {"Z":0,"UTC":0,"GMT":0,"UT":0,"EST":-18000,"EDT":-14400,"CST":-21600,
                     "CDT":-18000,"MST":-25200,"MDT":-21600,"PST":-28800,"PDT":-25200}[$z]
                  end
              end;
            def _ms($c):
              ($c.y | tonumber | if . < 100 then (if . < 70 then . + 2000 else . + 1900 end) else . end) as $y
              | ($c.mo | _n) as $mo
              | ($c.d | tonumber) as $d
              | (($c.h // "0") | tonumber) as $h
              | (($c.mi // "0") | tonumber) as $mi
              | (($c.s // "0") | tonumber) as $s
              | _zone($c.z) as $off
              | if $mo == null or $off == null or $mo < 1 or $mo > 12 or $d < 1 or $d > 31
                   or $h > 23 or $mi > 59 or $s > 60 then null
                else
                  ($y - (if $mo <= 2 then 1 else 0 end)) as $yy
                  | ($yy / 400 | floor) as $era
                  | ($yy - $era * 400) as $yoe
                  | (((153 * ($mo + (if $mo > 2 then -3 else 9 end)) + 2) / 5 | floor) + $d - 1) as $doy
                  | ($yoe * 365 + ($yoe / 4 | floor) - ($yoe / 100 | floor) + $doy) as $doe
                  | ($era * 146097 + $doe - 719468) as $days
                  | ($days * 86400 + $h * 3600 + $mi * 60 + $s - $off) * 1000 + _frac_ms($c.f)
                end;
            def _str($raw):
              ($raw | ascii_upcase | sub("\\s*\\([^)]*\\)\\s*$"; "") | sub("^\\s+"; "") | sub("\\s+$"; "")) as $s
              | "(?<z>Z|(?:UTC|GMT|UT)?[+-][0-9]{1,2}(?::?[0-9]{2})?|[A-Z]{1,5})" as $Z
              | "(?<h>[0-9]{1,2}):(?<mi>[0-9]{2})(?::(?<s>[0-9]{2}))?(?:[.,](?<f>[0-9]+))?" as $T
              | if $s == "" then null
                elif ($s | test("^-?[0-9]+$")) then _digits_ms($s)
                elif ($s | test("^[0-9]+\\.[0-9]+$")) then
                  ($s | split(".")) as $p
                  | if ($p[0] | length) <= 11 then _digits_ms($p[0]) + _frac_ms($p[1])
                    else _digits_ms($p[0]) end
                elif ($s | test("^/DATE\\(-?[0-9]+([+-][0-9]{4})?\\)/$")) then
                  ($s | capture("(?<ms>-?[0-9]+)").ms | tonumber)
                else
                  first(
                    ($s | capture("^(?<y>[0-9]{4})[-/](?<mo>[0-9]{1,2})[-/](?<d>[0-9]{1,2})(?:[T ]+" + $T + ")?\\s*" + $Z + "?(?:\\s+[A-Z]{2,5})?$") | _ms(.)),
                    ($s | capture("^(?<y>[0-9]{4})(?<mo>[0-9]{2})(?<d>[0-9]{2})T(?<h>[0-9]{2})(?<mi>[0-9]{2})(?<s>[0-9]{2})(?:[.,](?<f>[0-9]+))?" + $Z + "?$") | _ms(.)),
                    ($s | capture("^(?:[A-Z]+,?\\s+)?(?<d>[0-9]{1,2})[ -](?<mon>[A-Z]{3,9})[ -](?<y>[0-9]{2,4})\\s+" + $T + "\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?:[A-Z]+,?\\s+)?(?<mon>[A-Z]{3,9})\\.?\\s+(?<d>[0-9]{1,2}),?\\s+(?<y>[0-9]{4})(?:,?\\s+" + $T + ")?\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?:[A-Z]+\\s+)?(?<mon>[A-Z]{3,9})\\s+(?<d>[0-9]{1,2})\\s+" + $T + "\\s+(?:" + $Z + "\\s+)?(?<y>[0-9]{4})$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?<d>[0-9]{1,2})/(?<mon>[A-Z]{3})/(?<y>[0-9]{4}):" + $T + "\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.))
                  ) // null
                end;
            if $ts == null then null
            elif ($ts | type) == "number" then _num_ms($ts)
            elif ($ts | type) == "string" then _str($ts)
            elif ($ts | type) == "object" then
              if   $ts["$date"] != null then to_epoch_ms($ts["$date"])
              elif $ts["$numberLong"] != null then to_epoch_ms($ts["$numberLong"])
              elif $ts.seconds != null then
                ($ts.seconds | tostring | tonumber) * 1000
                + ((($ts.nanos // 0) | tostring | tonumber) / 1000000 | floor)
              else null end
            else null end;

          def is_ip($s):
            def _v4: test("^((25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])[.]){3}(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])$");
            def _v6:
              if (contains(":") and test("^[0-9A-Fa-f:.]+$")) | not then false
              else
                split("::") as $p
                | if ($p | length) > 2 then false
                  else
                    [$p[] | select(. != "") | split(":")[]] as $g
                    | (($g | length) > 0 and ($g[-1] | contains("."))) as $tail4
                    | (if $tail4 then $g[0:-1] else $g end) as $hex
                    | (($hex | length) + (if $tail4 then 2 else 0 end)) as $n
                    | (if $tail4 then ($g[-1] | _v4) else true end)
                      and all($hex[]; test("^[0-9A-Fa-f]{1,4}$"))
                      and (if ($p | length) == 2 then $n <= 7 else $n == 8 end)
                  end
              end;
            ($s | type) == "string" and ($s | _v4 or _v6);

          # CloudTrail redacts a failed-sign-in username with this sentinel.
          def real_name($s):
            if ($s | type) == "string" and $s != "HIDDEN_DUE_TO_SECURITY_REASONS"
            then $s else null end;

          # requestParameters / responseElements are not always objects.
          def g($o; $k): if ($o | type) == "object" then $o[$k] else null end;

          # session-name half of an assumed-role principalId
          # ("AROAEXAMPLE:alice" -> "alice").
          def session_name($p):
            if ($p | type) == "string" and ($p | test(":"))
            then ($p | sub("^[^:]*:"; "")) else null end;

          . as $r
          | ( $r.userIdentity // {} ) as $ui
          | ( $ui.sessionContext // {} ) as $sc
          | ( $sc.sessionIssuer // {} ) as $si

          # ---- activity_id (CRUD) ----------------------------------------
          # 1 Create, 2 Read, 3 Update, 4 Delete, 99 Other. readOnly wins for
          # Read; otherwise classify by the API verb prefix.
          | ( if ($r.readOnly // false) == true then 2
              elif (($r.eventName // "") | test("^(Create|Add|Run|Register|Import|Provision|Allocate|Generate|Start|Enable|Attach|Associate|Authorize)"))
                then 1
              elif (($r.eventName // "") | test("^(Delete|Remove|Deregister|Terminate|Revoke|Detach|Disassociate|Disable|Deactivate|Cancel|Stop)"))
                then 4
              elif (($r.eventName // "") | test("^(Update|Modify|Set|Put|Change|Replace|Tag|Untag)"))
                then 3
              elif (($r.eventName // "") | test("^(Get|List|Describe|Lookup|Head|Query|Select|Search|BatchGet|View)"))
                then 2
              else 99 end ) as $activity_id

          # ---- outcome / status ------------------------------------------
          | ( ($r.errorCode // null) != null ) as $failed
          | ( real_name($si.userName) ) as $role_name
          | ( session_name($ui.principalId)
              // real_name($ui.userName)
              // $role_name ) as $actor_name

          | {
              "category_uid": 6,
              "class_uid":    6003,
              "type_uid":     (6003 * 100 + $activity_id),
              "activity_id":  $activity_id,

              # errorCode present => the API call was rejected; treat as a
              # Medium finding, otherwise Informational.
              "severity_id":  ( if $failed then 3 else 1 end ),
              "status_id":    ( if $failed then 2 else 1 end ),
              "status_code":  $r.errorCode,
              "status_detail": $r.errorMessage,

              "time": to_epoch_ms($r.eventTime),

              "metadata": {
                "profiles": ["cloud", "osint"],
                "version": "1.9.0",
                "uid": $r.eventID,
                "product": {
                  "vendor_name": "AWS",
                  "name": "AWS CloudTrail",
                  "feature": { "name": $r.eventSource }
                }
              },

              # OSINT is a base-required array on API Activity in 1.9.0; a
              # raw CloudTrail record carries no threat-intel enrichment.
              "osint": [],

              "cloud": {
                "provider": "AWS",
                "region": $r.awsRegion,
                "account": {
                  "uid": ($r.recipientAccountId // $ui.accountId),
                  "type_id": 10
                }
              },

              # Actor = the identity that initiated the call. user carries an
              # at_least_one[account,name,uid] constraint, satisfied by name
              # (and uid when a principalId is present).
              "actor": {
                "user": {
                  "uid": $ui.principalId,
                  "name": $actor_name,
                  "uid_alt": $ui.accessKeyId,
                  "type": $ui.type,
                  "account": {
                    "uid": $ui.accountId,
                    "type_id": 10
                  }
                },
                "session": {
                  "created_time": (to_epoch_ms(g($sc.attributes; "creationDate"))),
                  "is_mfa": ((g($sc.attributes; "mfaAuthenticated") // "") == "true")
                }
              },

              "api": {
                "operation": $r.eventName,
                "service": { "name": $r.eventSource },
                "request": { "uid": $r.requestID }
              },

              # src_endpoint carries an at_least_one endpoint constraint;
              # populate ip when the source is a real address, else record
              # the AWS service name that stood in for it.
              "src_endpoint": (
                if is_ip($r.sourceIPAddress) then { "ip": $r.sourceIPAddress }
                else { "svc_name": $r.sourceIPAddress } end
              ),

              # HTTP client that issued the call.
              "http_request": { "user_agent": $r.userAgent },

              # Resources the API call acted on. resource_details has no
              # account attribute (the owning account is already on
              # cloud.account); carry it in namespace instead.
              "resources": (
                ($r.resources // []) | map({
                  "uid": .ARN,
                  "type": .type,
                  "namespace": .accountId
                })
              ),

              "unmapped": {
                "eventType": $r.eventType,
                "eventCategory": $r.eventCategory,
                "managementEvent": $r.managementEvent,
                "tlsDetails": $r.tlsDetails,
                "additionalEventData": $r.additionalEventData
              },

              "raw_data": ($r | tostring)
            }

          # Prune null/empty leaves while preserving required objects.
          | walk(
              if type == "object" then
                with_entries(select(.value != null and .value != {} and .value != []))
              elif type == "array" then
                map(select(. != null))
              else . end
            )
          # osint is required and legitimately empty here; re-assert it after
          # the prune stripped the empty array.
          | .osint = (.osint // [])
