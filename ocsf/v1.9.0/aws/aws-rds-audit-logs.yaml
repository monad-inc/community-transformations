name: "AWS RDS Audit Logs to OCSF v1.9.0"
description: "Transforms AWS RDS (MySQL / MariaDB) audit log records — the MariaDB Audit Plugin CSV line carried in the connector's message field — into the OCSF v1.9.0 Datastore Activity (6005) class."
author: "Monad"
contributors:
  - "https://github.com/behobu"
inputs:
  - "aws-rds-audit-logs"
tags:
  - "v1.9.0"
  - "ocsf"
  - "aws"
  - "application_activity"
config:
  operations:
    - operation: "jq"
      arguments:
        key: ""
        query: |
          # ---------------------------------------------------------------
          # OCSF Datastore Activity (class_uid=6005) — v1.9.0
          # Input: one aws-rds-audit-logs record per invocation.
          #
          # The connector emits a small envelope
          #   { engine, instance_id, log_file_name, message, region, source }
          # where `message` is ONE raw MariaDB Audit Plugin CSV line:
          #   ts,serverhost,username,host,connectionid,queryid,
          #     operation,database,object,retcode
          # The `object` field (query text / table) may itself contain commas
          # and is single-quoted, so it is captured greedily up to the final
          # comma (retcode is always last and never contains a comma).
          # ---------------------------------------------------------------

          def to_epoch_ms($ts):
            def _n: if . == null then null else tonumber end;
            def _num_ms($n):
              if   $n >= 1e17 then ($n / 1000000 | floor)
              elif $n >= 1e14 then ($n / 1000 | floor)
              elif $n >= 1e11 then ($n | floor)
              else ($n * 1000 + 0.001 | floor) end;
            def _digits_ms($d):
              ($d | ltrimstr("-") | length) as $l
              | if   $l >= 18 then ($d[0:-6] | tonumber)
                elif $l >= 15 then ($d[0:-3] | tonumber)
                elif $l >= 12 then ($d | tonumber)
                else ($d | tonumber) * 1000 end;
            def _frac_ms($f): if $f == null then 0 else (($f + "000")[0:3] | tonumber) end;
            def _mon($m):
              if $m == null then null
              else {"JAN":1,"FEB":2,"MAR":3,"APR":4,"MAY":5,"JUN":6,
                    "JUL":7,"AUG":8,"SEP":9,"OCT":10,"NOV":11,"DEC":12}[$m[0:3]] end;
            def _zone($z):
              if $z == null or $z == "" then 0
              else
                ($z | if test("^(UTC|GMT|UT)[+-]") then sub("^(UTC|GMT|UT)"; "") else . end) as $z
                | if ($z | test("^[+-][0-9]{1,2}(:?[0-9]{2})?$")) then
                    ($z | capture("^(?<sg>[+-])(?<h>[0-9]{1,2}):?(?<m>[0-9]{2})?$")) as $o
                    | (if $o.sg == "-" then -1 else 1 end)
                      * (($o.h | tonumber) * 3600 + (($o.m // "0") | tonumber) * 60)
                  else
                    {"Z":0,"UTC":0,"GMT":0,"UT":0,"EST":-18000,"EDT":-14400,"CST":-21600,
                     "CDT":-18000,"MST":-25200,"MDT":-21600,"PST":-28800,"PDT":-25200}[$z]
                  end
              end;
            def _ms($c):
              ($c.y | tonumber | if . < 100 then (if . < 70 then . + 2000 else . + 1900 end) else . end) as $y
              | ($c.mo | _n) as $mo
              | ($c.d | tonumber) as $d
              | (($c.h // "0") | tonumber) as $h
              | (($c.mi // "0") | tonumber) as $mi
              | (($c.s // "0") | tonumber) as $s
              | _zone($c.z) as $off
              | if $mo == null or $off == null or $mo < 1 or $mo > 12 or $d < 1 or $d > 31
                   or $h > 23 or $mi > 59 or $s > 60 then null
                else
                  ($y - (if $mo <= 2 then 1 else 0 end)) as $yy
                  | ($yy / 400 | floor) as $era
                  | ($yy - $era * 400) as $yoe
                  | (((153 * ($mo + (if $mo > 2 then -3 else 9 end)) + 2) / 5 | floor) + $d - 1) as $doy
                  | ($yoe * 365 + ($yoe / 4 | floor) - ($yoe / 100 | floor) + $doy) as $doe
                  | ($era * 146097 + $doe - 719468) as $days
                  | ($days * 86400 + $h * 3600 + $mi * 60 + $s - $off) * 1000 + _frac_ms($c.f)
                end;
            def _str($raw):
              ($raw | ascii_upcase | sub("\\s*\\([^)]*\\)\\s*$"; "") | sub("^\\s+"; "") | sub("\\s+$"; "")) as $s
              | "(?<z>Z|(?:UTC|GMT|UT)?[+-][0-9]{1,2}(?::?[0-9]{2})?|[A-Z]{1,5})" as $Z
              | "(?<h>[0-9]{1,2}):(?<mi>[0-9]{2})(?::(?<s>[0-9]{2}))?(?:[.,](?<f>[0-9]+))?" as $T
              | if $s == "" then null
                elif ($s | test("^-?[0-9]+$")) then _digits_ms($s)
                elif ($s | test("^[0-9]+\\.[0-9]+$")) then
                  ($s | split(".")) as $p
                  | if ($p[0] | length) <= 11 then _digits_ms($p[0]) + _frac_ms($p[1])
                    else _digits_ms($p[0]) end
                elif ($s | test("^/DATE\\(-?[0-9]+([+-][0-9]{4})?\\)/$")) then
                  ($s | capture("(?<ms>-?[0-9]+)").ms | tonumber)
                else
                  first(
                    ($s | capture("^(?<y>[0-9]{4})[-/](?<mo>[0-9]{1,2})[-/](?<d>[0-9]{1,2})(?:[T ]+" + $T + ")?\\s*" + $Z + "?(?:\\s+[A-Z]{2,5})?$") | _ms(.)),
                    ($s | capture("^(?<y>[0-9]{4})(?<mo>[0-9]{2})(?<d>[0-9]{2})T(?<h>[0-9]{2})(?<mi>[0-9]{2})(?<s>[0-9]{2})(?:[.,](?<f>[0-9]+))?" + $Z + "?$") | _ms(.)),
                    ($s | capture("^(?:[A-Z]+,?\\s+)?(?<d>[0-9]{1,2})[ -](?<mon>[A-Z]{3,9})[ -](?<y>[0-9]{2,4})\\s+" + $T + "\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?:[A-Z]+,?\\s+)?(?<mon>[A-Z]{3,9})\\.?\\s+(?<d>[0-9]{1,2}),?\\s+(?<y>[0-9]{4})(?:,?\\s+" + $T + ")?\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?:[A-Z]+\\s+)?(?<mon>[A-Z]{3,9})\\s+(?<d>[0-9]{1,2})\\s+" + $T + "\\s+(?:" + $Z + "\\s+)?(?<y>[0-9]{4})$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?<d>[0-9]{1,2})/(?<mon>[A-Z]{3})/(?<y>[0-9]{4}):" + $T + "\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.))
                  ) // null
                end;
            if $ts == null then null
            elif ($ts | type) == "number" then _num_ms($ts)
            elif ($ts | type) == "string" then _str($ts)
            elif ($ts | type) == "object" then
              if   $ts["$date"] != null then to_epoch_ms($ts["$date"])
              elif $ts["$numberLong"] != null then to_epoch_ms($ts["$numberLong"])
              elif $ts.seconds != null then
                ($ts.seconds | tostring | tonumber) * 1000
                + ((($ts.nanos // 0) | tostring | tonumber) / 1000000 | floor)
              else null end
            else null end;

          . as $r
          | ( $r.message
              | capture("^(?<ts>[^,]*),(?<serverhost>[^,]*),(?<username>[^,]*),(?<host>[^,]*),(?<connectionid>[^,]*),(?<queryid>[^,]*),(?<operation>[^,]*),(?<database>[^,]*),(?<object>.*),(?<retcode>[^,]*)$")
            ) as $m

          # Strip the single quotes MariaDB wraps around the object/query and
          # un-double any escaped internal quotes.
          | ( ($m.object // "")
              | sub("^'"; "") | sub("'$"; "") | gsub("''"; "'") ) as $obj

          | ( ($m.operation // "") | ascii_upcase ) as $op
          | ( $m.retcode // "" ) as $ret
          | ( $m.database // "" ) as $db

          # MariaDB audit `operation` -> OCSF Datastore Activity activity_id.
          | ( { "READ":1, "UPDATE":2, "CONNECT":3, "QUERY":4, "WRITE":5,
                "CREATE":6, "ALTER":2, "RENAME":2, "DROP":7 }[$op] // 99 ) as $activity_id

          | ( if $ret == "0" or $ret == "" then 1 else 2 end ) as $status_id

          # A non-zero return code (e.g. FAILED_CONNECT) is Medium; routine
          # audited activity is Informational.
          | ( if $status_id == 2 then 3 else 1 end ) as $severity_id

          | ( try (($m.ts | strptime("%Y%m%d %H:%M:%S") | mktime) * 1000) catch null ) as $time

          | {
              category_uid: 6,
              class_uid: 6005,
              activity_id: $activity_id,
              type_uid: (6005 * 100 + $activity_id),
              severity_id: $severity_id,
              status_id: $status_id,

              time: $time,

              metadata: {
                version: "1.9.0",
                product: {
                  vendor_name: "AWS",
                  name: "Amazon RDS",
                  feature: { name: "MariaDB Audit Plugin" }
                },
                log_name: $r.log_file_name
              },

              cloud: {
                provider: "AWS",
                region: $r.region
              },

              # The authenticated database user is the acting principal.
              actor: {
                user: { name: $m.username, type_id: 1 }
              },

              # The client that opened the DB connection.
              src_endpoint: (
                if ($m.host | test("^(\\d{1,3}\\.){3}\\d{1,3}$"))
                then { ip: $m.host, hostname: $m.host }
                else { hostname: $m.host } end
              ),

              # The datastore the activity targeted. uid (the RDS instance id)
              # always satisfies the class/object at_least_one constraint even
              # when the active database name is empty (e.g. on CONNECT).
              database: {
                type_id: 1,
                type: "Relational",
                uid: $r.instance_id,
                name: (if $db == "" then null else $db end)
              },

              query_info: (
                if $obj == "" then null
                else { query_string: $obj, uid: (if $m.queryid == "" then null else $m.queryid end) }
                end
              ),

              # activity_name carries the OCSF caption for a mapped activity,
              # and the raw MariaDB operation for the unmapped (99) case.
              activity_name: ( { "1":"Read","2":"Update","3":"Connect","4":"Query",
                                 "5":"Write","6":"Create","7":"Delete" }[$activity_id|tostring] // $op ),
              status: (if $status_id == 1 then "Success" else "Failure" end),
              message: (if $obj == "" then $op else $obj end),

              unmapped: {
                engine: $r.engine,
                operation: $op,
                serverhost: $m.serverhost,
                connectionid: $m.connectionid,
                queryid: $m.queryid,
                retcode: $ret
              },

              raw_data: ($r.message | tostring)
            }

          # Drop nulls / empty objects so optional slots vanish cleanly, then
          # re-assert osint (a required-but-empty array the prune would strip).
          | walk(
              if type == "object" then with_entries(select(.value != null and .value != {} and .value != []))
              elif type == "array" then map(select(. != null))
              else . end
            )
          | .osint = []
