name: "AWS EKS Audit Logs to OCSF v1.9.0"
description: "Transforms Amazon EKS (Kubernetes API server) audit.k8s.io/v1 audit records into the OCSF v1.9.0 API Activity class (class_uid 6003)."
author: "Monad"
contributors:
  - "https://github.com/behobu"
inputs:
  - "aws-eks-audit-logs"
tags:
  - "v1.9.0"
  - "ocsf"
  - "aws"
  - "application"
config:
  operations:
    - operation: "jq"
      arguments:
        key: ""
        query: |
          # ---------------------------------------------------------------
          # OCSF API Activity (class_uid=6003, category_uid=6) — v1.9.0
          # Input: one Amazon EKS Kubernetes audit event (audit.k8s.io/v1)
          # per invocation, as delivered by the aws-eks-audit-logs connector.
          #
          # Kubernetes audit verb -> OCSF activity_id:
          #   create                       -> 1 (Create)
          #   get/list/watch               -> 2 (Read)
          #   update/patch                 -> 3 (Update)
          #   delete/deletecollection      -> 4 (Delete)
          #   anything else                -> 99 (Other)
          # ---------------------------------------------------------------


          def to_epoch_ms($ts):
            def _n: if . == null then null else tonumber end;
            def _num_ms($n):
              if   $n >= 1e17 then ($n / 1000000 | floor)
              elif $n >= 1e14 then ($n / 1000 | floor)
              elif $n >= 1e11 then ($n | floor)
              else ($n * 1000 + 0.001 | floor) end;
            def _digits_ms($d):
              ($d | ltrimstr("-") | length) as $l
              | if   $l >= 18 then ($d[0:-6] | tonumber)
                elif $l >= 15 then ($d[0:-3] | tonumber)
                elif $l >= 12 then ($d | tonumber)
                else ($d | tonumber) * 1000 end;
            def _frac_ms($f): if $f == null then 0 else (($f + "000")[0:3] | tonumber) end;
            def _mon($m):
              if $m == null then null
              else {"JAN":1,"FEB":2,"MAR":3,"APR":4,"MAY":5,"JUN":6,
                    "JUL":7,"AUG":8,"SEP":9,"OCT":10,"NOV":11,"DEC":12}[$m[0:3]] end;
            def _zone($z):
              if $z == null or $z == "" then 0
              else
                ($z | if test("^(UTC|GMT|UT)[+-]") then sub("^(UTC|GMT|UT)"; "") else . end) as $z
                | if ($z | test("^[+-][0-9]{1,2}(:?[0-9]{2})?$")) then
                    ($z | capture("^(?<sg>[+-])(?<h>[0-9]{1,2}):?(?<m>[0-9]{2})?$")) as $o
                    | (if $o.sg == "-" then -1 else 1 end)
                      * (($o.h | tonumber) * 3600 + (($o.m // "0") | tonumber) * 60)
                  else
                    {"Z":0,"UTC":0,"GMT":0,"UT":0,"EST":-18000,"EDT":-14400,"CST":-21600,
                     "CDT":-18000,"MST":-25200,"MDT":-21600,"PST":-28800,"PDT":-25200}[$z]
                  end
              end;
            def _ms($c):
              ($c.y | tonumber | if . < 100 then (if . < 70 then . + 2000 else . + 1900 end) else . end) as $y
              | ($c.mo | _n) as $mo
              | ($c.d | tonumber) as $d
              | (($c.h // "0") | tonumber) as $h
              | (($c.mi // "0") | tonumber) as $mi
              | (($c.s // "0") | tonumber) as $s
              | _zone($c.z) as $off
              | if $mo == null or $off == null or $mo < 1 or $mo > 12 or $d < 1 or $d > 31
                   or $h > 23 or $mi > 59 or $s > 60 then null
                else
                  ($y - (if $mo <= 2 then 1 else 0 end)) as $yy
                  | ($yy / 400 | floor) as $era
                  | ($yy - $era * 400) as $yoe
                  | (((153 * ($mo + (if $mo > 2 then -3 else 9 end)) + 2) / 5 | floor) + $d - 1) as $doy
                  | ($yoe * 365 + ($yoe / 4 | floor) - ($yoe / 100 | floor) + $doy) as $doe
                  | ($era * 146097 + $doe - 719468) as $days
                  | ($days * 86400 + $h * 3600 + $mi * 60 + $s - $off) * 1000 + _frac_ms($c.f)
                end;
            def _str($raw):
              ($raw | ascii_upcase | sub("\\s*\\([^)]*\\)\\s*$"; "") | sub("^\\s+"; "") | sub("\\s+$"; "")) as $s
              | "(?<z>Z|(?:UTC|GMT|UT)?[+-][0-9]{1,2}(?::?[0-9]{2})?|[A-Z]{1,5})" as $Z
              | "(?<h>[0-9]{1,2}):(?<mi>[0-9]{2})(?::(?<s>[0-9]{2}))?(?:[.,](?<f>[0-9]+))?" as $T
              | if $s == "" then null
                elif ($s | test("^-?[0-9]+$")) then _digits_ms($s)
                elif ($s | test("^[0-9]+\\.[0-9]+$")) then
                  ($s | split(".")) as $p
                  | if ($p[0] | length) <= 11 then _digits_ms($p[0]) + _frac_ms($p[1])
                    else _digits_ms($p[0]) end
                elif ($s | test("^/DATE\\(-?[0-9]+([+-][0-9]{4})?\\)/$")) then
                  ($s | capture("(?<ms>-?[0-9]+)").ms | tonumber)
                else
                  first(
                    ($s | capture("^(?<y>[0-9]{4})[-/](?<mo>[0-9]{1,2})[-/](?<d>[0-9]{1,2})(?:[T ]+" + $T + ")?\\s*" + $Z + "?(?:\\s+[A-Z]{2,5})?$") | _ms(.)),
                    ($s | capture("^(?<y>[0-9]{4})(?<mo>[0-9]{2})(?<d>[0-9]{2})T(?<h>[0-9]{2})(?<mi>[0-9]{2})(?<s>[0-9]{2})(?:[.,](?<f>[0-9]+))?" + $Z + "?$") | _ms(.)),
                    ($s | capture("^(?:[A-Z]+,?\\s+)?(?<d>[0-9]{1,2})[ -](?<mon>[A-Z]{3,9})[ -](?<y>[0-9]{2,4})\\s+" + $T + "\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?:[A-Z]+,?\\s+)?(?<mon>[A-Z]{3,9})\\.?\\s+(?<d>[0-9]{1,2}),?\\s+(?<y>[0-9]{4})(?:,?\\s+" + $T + ")?\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?:[A-Z]+\\s+)?(?<mon>[A-Z]{3,9})\\s+(?<d>[0-9]{1,2})\\s+" + $T + "\\s+(?:" + $Z + "\\s+)?(?<y>[0-9]{4})$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?<d>[0-9]{1,2})/(?<mon>[A-Z]{3})/(?<y>[0-9]{4}):" + $T + "\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.))
                  ) // null
                end;
            if $ts == null then null
            elif ($ts | type) == "number" then _num_ms($ts)
            elif ($ts | type) == "string" then _str($ts)
            elif ($ts | type) == "object" then
              if   $ts["$date"] != null then to_epoch_ms($ts["$date"])
              elif $ts["$numberLong"] != null then to_epoch_ms($ts["$numberLong"])
              elif $ts.seconds != null then
                ($ts.seconds | tostring | tonumber) * 1000
                + ((($ts.nanos // 0) | tostring | tonumber) / 1000000 | floor)
              else null end
            else null end;

          def prune:
            walk(if type == "object" then with_entries(select(.value != null and .value != {} and .value != []))
                 elif type == "array" then map(select(. != null and . != {} and . != []))
                 else . end);

          . as $r
          | ( $r.user // {} )           as $u
          | ( $r.objectRef // {} )      as $obj
          | ( $r.responseStatus // {} ) as $rs
          | ( $r.annotations // {} )    as $ann
          | ( $r.verb // "" )           as $verb
          | ( { "create":1, "get":2, "list":2, "watch":2,
                "update":3, "patch":3, "delete":4, "deletecollection":4 }[$verb] // 99 ) as $activity
          # Map the Kubernetes audit verb to the closest real HTTP method for
          # http_request.http_method (an enum). Unknown verbs -> null (omitted).
          | ( { "create":"POST", "get":"GET", "list":"GET", "watch":"GET",
                "update":"PUT", "patch":"PATCH", "delete":"DELETE",
                "deletecollection":"DELETE" }[$verb] ) as $httpm
          | ( $rs.code // null )        as $code
          | ( $ann["authorization.k8s.io/decision"] // null ) as $decision
          | ( if ($decision == "forbid") or ($code != null and $code >= 400)
              then 2 else 1 end ) as $status_id
          | ( if $status_id == 2 then 3 else 1 end ) as $severity_id

          | ( {
              category_uid: 6,
              class_uid:    6003,
              type_uid:     (6003 * 100 + $activity),
              activity_id:  $activity,
              severity_id:  $severity_id,

              status_id:     $status_id,
              status:        ( if $status_id == 2 then "Failure" else "Success" end ),
              status_code:   ( if $code != null then ($code | tostring) else null end ),
              status_detail: ( $rs.reason // $rs.status ),

              time:    to_epoch_ms($r.requestReceivedTimestamp),
              message: ( $ann["authorization.k8s.io/reason"] ),

              metadata: {
                "profiles": ["cloud", "osint"],
                version: "1.9.0",
                product: {
                  vendor_name: "AWS",
                  name: "Amazon EKS",
                  feature: { name: "Kubernetes Audit" }
                },
                uid: $r.auditID,
                log_name: $r.level,
                log_provider: "audit.k8s.io",
                original_time: $r.requestReceivedTimestamp
              },

              cloud: { provider: "aws" },

              actor: {
                user: {
                  name: $u.username,
                  uid:  $u.uid,
                  groups: ( ($u.groups // []) | map({ name: . }) )
                }
              },

              api: {
                operation: $verb,
                version:   $obj.apiVersion,
                service:   { name: ( $obj.apiGroup // "core" ) },
                request:   { uid: $r.auditID },
                response:  {
                  code:  $code,
                  message: ( $rs.status // $rs.reason ),
                  error: ( if $status_id == 2 then ($rs.reason // $rs.status) else null end )
                }
              },

              http_request: {
                user_agent: $r.userAgent,
                http_method: $httpm,
                url: { path: $r.requestURI }
              },

              http_response: {
                code: $code,
                status: ( $rs.status // $rs.reason )
              },

              src_endpoint: {
                ip: ( $r.sourceIPs // [] | .[0] ),
                intermediate_ips: ( ($r.sourceIPs // []) | .[1:] )
              },

              resources: [ {
                type:      $obj.resource,
                name:      $obj.name,
                uid:       $obj.uid,
                namespace: $obj.namespace,
                version:   $obj.apiVersion
              } ],

              unmapped: {
                stage:          $r.stage,
                stageTimestamp: $r.stageTimestamp,
                subresource:    $obj.subresource,
                impersonatedUser: $r.impersonatedUser
              },

              raw_data: ( $r | tostring )
            } | prune ) as $core

          # osint and src_endpoint are class-required containers; re-attach
          # after prune so an empty-value collapse can never drop them.
          | $core + {
              osint: [],
              src_endpoint: ( $core.src_endpoint // {} )
            }
