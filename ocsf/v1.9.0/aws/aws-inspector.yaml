name: "AWS Inspector Findings to OCSF v1.9.0"
description: "Transforms AWS Inspector (Inspector2) findings into the OCSF v1.9.0 Vulnerability Finding class (2002), mapping package-vulnerability, code-vulnerability, and network-reachability findings, CVSS/EPSS scores, and the affected AWS resource."
author: "Monad"
contributors:
  - "https://github.com/behobu"
inputs:
  - "aws-inspector"
tags:
  - "v1.9.0"
  - "ocsf"
  - "aws"
  - "findings"
config:
  operations:
    - operation: "jq"
      arguments:
        key: ""
        query: |
          # ---------------------------------------------------------------
          # OCSF Vulnerability Finding (class_uid=2002) — v1.9.0
          # Input: one AWS Inspector (Inspector2) Finding record per call.
          # ---------------------------------------------------------------


          # Prune null / "" / {} but KEEP arrays (osint: [] must survive).
          def to_epoch_ms($ts):
            def _n: if . == null then null else tonumber end;
            def _num_ms($n):
              if   $n >= 1e17 then ($n / 1000000 | floor)
              elif $n >= 1e14 then ($n / 1000 | floor)
              elif $n >= 1e11 then ($n | floor)
              else ($n * 1000 + 0.001 | floor) end;
            def _digits_ms($d):
              ($d | ltrimstr("-") | length) as $l
              | if   $l >= 18 then ($d[0:-6] | tonumber)
                elif $l >= 15 then ($d[0:-3] | tonumber)
                elif $l >= 12 then ($d | tonumber)
                else ($d | tonumber) * 1000 end;
            def _frac_ms($f): if $f == null then 0 else (($f + "000")[0:3] | tonumber) end;
            def _mon($m):
              if $m == null then null
              else {"JAN":1,"FEB":2,"MAR":3,"APR":4,"MAY":5,"JUN":6,
                    "JUL":7,"AUG":8,"SEP":9,"OCT":10,"NOV":11,"DEC":12}[$m[0:3]] end;
            def _zone($z):
              if $z == null or $z == "" then 0
              else
                ($z | if test("^(UTC|GMT|UT)[+-]") then sub("^(UTC|GMT|UT)"; "") else . end) as $z
                | if ($z | test("^[+-][0-9]{1,2}(:?[0-9]{2})?$")) then
                    ($z | capture("^(?<sg>[+-])(?<h>[0-9]{1,2}):?(?<m>[0-9]{2})?$")) as $o
                    | (if $o.sg == "-" then -1 else 1 end)
                      * (($o.h | tonumber) * 3600 + (($o.m // "0") | tonumber) * 60)
                  else
                    {"Z":0,"UTC":0,"GMT":0,"UT":0,"EST":-18000,"EDT":-14400,"CST":-21600,
                     "CDT":-18000,"MST":-25200,"MDT":-21600,"PST":-28800,"PDT":-25200}[$z]
                  end
              end;
            def _ms($c):
              ($c.y | tonumber | if . < 100 then (if . < 70 then . + 2000 else . + 1900 end) else . end) as $y
              | ($c.mo | _n) as $mo
              | ($c.d | tonumber) as $d
              | (($c.h // "0") | tonumber) as $h
              | (($c.mi // "0") | tonumber) as $mi
              | (($c.s // "0") | tonumber) as $s
              | _zone($c.z) as $off
              | if $mo == null or $off == null or $mo < 1 or $mo > 12 or $d < 1 or $d > 31
                   or $h > 23 or $mi > 59 or $s > 60 then null
                else
                  ($y - (if $mo <= 2 then 1 else 0 end)) as $yy
                  | ($yy / 400 | floor) as $era
                  | ($yy - $era * 400) as $yoe
                  | (((153 * ($mo + (if $mo > 2 then -3 else 9 end)) + 2) / 5 | floor) + $d - 1) as $doy
                  | ($yoe * 365 + ($yoe / 4 | floor) - ($yoe / 100 | floor) + $doy) as $doe
                  | ($era * 146097 + $doe - 719468) as $days
                  | ($days * 86400 + $h * 3600 + $mi * 60 + $s - $off) * 1000 + _frac_ms($c.f)
                end;
            def _str($raw):
              ($raw | ascii_upcase | sub("\\s*\\([^)]*\\)\\s*$"; "") | sub("^\\s+"; "") | sub("\\s+$"; "")) as $s
              | "(?<z>Z|(?:UTC|GMT|UT)?[+-][0-9]{1,2}(?::?[0-9]{2})?|[A-Z]{1,5})" as $Z
              | "(?<h>[0-9]{1,2}):(?<mi>[0-9]{2})(?::(?<s>[0-9]{2}))?(?:[.,](?<f>[0-9]+))?" as $T
              | if $s == "" then null
                elif ($s | test("^-?[0-9]+$")) then _digits_ms($s)
                elif ($s | test("^[0-9]+\\.[0-9]+$")) then
                  ($s | split(".")) as $p
                  | if ($p[0] | length) <= 11 then _digits_ms($p[0]) + _frac_ms($p[1])
                    else _digits_ms($p[0]) end
                elif ($s | test("^/DATE\\(-?[0-9]+([+-][0-9]{4})?\\)/$")) then
                  ($s | capture("(?<ms>-?[0-9]+)").ms | tonumber)
                else
                  first(
                    ($s | capture("^(?<y>[0-9]{4})[-/](?<mo>[0-9]{1,2})[-/](?<d>[0-9]{1,2})(?:[T ]+" + $T + ")?\\s*" + $Z + "?(?:\\s+[A-Z]{2,5})?$") | _ms(.)),
                    ($s | capture("^(?<y>[0-9]{4})(?<mo>[0-9]{2})(?<d>[0-9]{2})T(?<h>[0-9]{2})(?<mi>[0-9]{2})(?<s>[0-9]{2})(?:[.,](?<f>[0-9]+))?" + $Z + "?$") | _ms(.)),
                    ($s | capture("^(?:[A-Z]+,?\\s+)?(?<d>[0-9]{1,2})[ -](?<mon>[A-Z]{3,9})[ -](?<y>[0-9]{2,4})\\s+" + $T + "\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?:[A-Z]+,?\\s+)?(?<mon>[A-Z]{3,9})\\.?\\s+(?<d>[0-9]{1,2}),?\\s+(?<y>[0-9]{4})(?:,?\\s+" + $T + ")?\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?:[A-Z]+\\s+)?(?<mon>[A-Z]{3,9})\\s+(?<d>[0-9]{1,2})\\s+" + $T + "\\s+(?:" + $Z + "\\s+)?(?<y>[0-9]{4})$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?<d>[0-9]{1,2})/(?<mon>[A-Z]{3})/(?<y>[0-9]{4}):" + $T + "\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.))
                  ) // null
                end;
            if $ts == null then null
            elif ($ts | type) == "number" then _num_ms($ts)
            elif ($ts | type) == "string" then _str($ts)
            elif ($ts | type) == "object" then
              if   $ts["$date"] != null then to_epoch_ms($ts["$date"])
              elif $ts["$numberLong"] != null then to_epoch_ms($ts["$numberLong"])
              elif $ts.seconds != null then
                ($ts.seconds | tostring | tonumber) * 1000
                + ((($ts.nanos // 0) | tostring | tonumber) / 1000000 | floor)
              else null end
            else null end;

          # Not the canonical prune: keeps [] values so the required osint array survives.
          def prune_keep_arrays:
            walk(
              if type == "object" then
                with_entries(select(.value != null and .value != "" and .value != {}))
              else . end
            );

          . as $r
          | ( $r.packageVulnerabilityDetails ) as $pvd
          | ( $r.resources // [] ) as $res
          | ( $res[0] // {} ) as $r0

          # --- severity: Inspector -> OCSF severity_id ---
          | ( { "INFORMATIONAL": 1, "LOW": 2, "MEDIUM": 3,
                "HIGH": 4, "CRITICAL": 5, "UNTRIAGED": 0 }[$r.severity] // 0 ) as $sev

          # --- status: Inspector -> OCSF status_id ---
          | ( { "ACTIVE": 1, "SUPPRESSED": 3, "CLOSED": 4 }[$r.status] // 0 ) as $stat

          # --- activity: closed finding -> Close; re-observed -> Update; else Create ---
          | ( if $r.status == "CLOSED" then 3
              elif (($r.updatedAt // 0) > ($r.firstObservedAt // 0)) then 2
              else 1 end ) as $act

          # --- CVSS scores from packageVulnerabilityDetails.cvss[] ---
          | ( ($pvd.cvss // [])
              | map({ base_score: .baseScore,
                      vector_string: .scoringVector,
                      version: .version,
                      src_url: .source }) ) as $cvss

          # --- affected packages ---
          | ( ($pvd.vulnerablePackages // [])
              | map({ name: .name,
                      version: .version,
                      architecture: .arch,
                      epoch: .epoch,
                      release: .release,
                      package_manager: .packageManager,
                      path: .filePath,
                      fixed_in_version: .fixedInVersion,
                      remediation: ( if .remediation != null
                                     then { desc: .remediation } else null end ) }
                    | with_entries(select(.value != null))) ) as $pkgs

          | {
              category_uid: 2,
              class_uid:    2002,
              activity_id:  $act,
              type_uid:     (2002 * 100 + $act),
              severity_id:  $sev,
              status_id:    $stat,

              time: to_epoch_ms($r.updatedAt // $r.lastObservedAt // $r.firstObservedAt),
              start_time: to_epoch_ms($r.firstObservedAt),
              end_time:   to_epoch_ms($r.lastObservedAt),

              message: $r.description,

              metadata: {
                "profiles": ["cloud", "osint"],
                version: "1.9.0",
                product: {
                  vendor_name: "AWS",
                  name: "Amazon Inspector",
                  feature: { name: $r.type }
                },
                uid: $r.findingArn
              },

              # OSINT is a base-required attribute of the class in 1.9.0.
              # Inspector carries no open-source-intel indicators, so emit [].
              osint: [],

              cloud: {
                provider: "AWS",
                region: ($r0.region // "unknown"),
                account: { uid: $r.awsAccountId }
              },

              finding_info: {
                uid: $r.findingArn,
                title: ($r.title // ($pvd.vulnerabilityId // "AWS Inspector finding")),
                desc: $r.description,
                types: [ $r.type ],
                created_time: to_epoch_ms($r.firstObservedAt),
                first_seen_time: to_epoch_ms($r.firstObservedAt),
                last_seen_time: to_epoch_ms($r.lastObservedAt),
                modified_time: to_epoch_ms($r.updatedAt),
                src_url: ($pvd.sourceUrl // null)
              },

              vulnerabilities: [
                {
                  title: $r.title,
                  desc: $r.description,
                  severity: $r.severity,
                  is_fix_available: ( ($r.fixAvailable // "NO") | (. == "YES" or . == "PARTIAL") ),
                  is_exploit_available: ( ($r.exploitAvailable // "NO") == "YES" ),
                  references: ($pvd.referenceUrls // []),
                  first_seen_time: to_epoch_ms($r.firstObservedAt),
                  last_seen_time: to_epoch_ms($r.lastObservedAt),
                  remediation: ( if ($r.remediation.recommendation.text // null) != null
                                 then { desc: $r.remediation.recommendation.text,
                                        references: ( [ $r.remediation.recommendation.Url ]
                                                      | map(select(. != null)) ) }
                                 else null end ),
                  affected_packages: $pkgs,
                  cve: ( if ($pvd.vulnerabilityId // null) != null then {
                           uid: $pvd.vulnerabilityId,
                           title: $r.title,
                           references: ($pvd.referenceUrls // []),
                           created_time: to_epoch_ms($pvd.vendorCreatedAt),
                           modified_time: to_epoch_ms($pvd.vendorUpdatedAt),
                           cvss: $cvss,
                           epss: ( if ($r.epss.score // null) != null
                                   then { score: ($r.epss.score | tostring) } else null end )
                         } | with_entries(select(.value != null)) else null end )
                }
                | with_entries(select(.value != null))
              ],

              resources: ( $res | map({
                  uid: .id,
                  type: .type,
                  region: .region,
                  cloud_partition: .partition,
                  labels: ( (.tags // {}) | to_entries | map("\(.key):\(.value)") )
                } | with_entries(select(.value != null))) ),

              observables: (
                [ ( if ($pvd.vulnerabilityId // null) != null
                    then { name: "vulnerabilities.cve.uid", type_id: 25, value: $pvd.vulnerabilityId }
                    else null end ),
                  ( if ($r0.id // null) != null
                    then { name: "resources.uid", type_id: 10, value: $r0.id }
                    else null end ) ]
                | map(select(. != null)) ),

              raw_data: ($r | tostring)
            }
          | prune_keep_arrays
