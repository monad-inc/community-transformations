name: "AWS KMS Keys to OCSF v1.9.0"
description: "Transforms AWS Key Management Service (KMS) key inventory records — DescribeKey KeyMetadata plus rotation status, aliases, and grants collected by the aws-kms connector — into the OCSF v1.9.0 Cloud Resources Inventory Info class (class_uid 5023)."
author: "Monad"
contributors:
  - "https://github.com/behobu"
inputs:
  - "aws-kms"
tags:
  - "v1.9.0"
  - "ocsf"
  - "aws"
  - "discovery"
config:
  operations:
    - operation: "jq"
      arguments:
        key: ""
        query: |
          # ---------------------------------------------------------------
          # OCSF Cloud Resources Inventory Info (class_uid=5023) — v1.9.0
          # Input: one AWS KMS key inventory record per invocation, as
          # emitted by the Monad `aws-kms` connector (DescribeKey
          # KeyMetadata joined with GetKeyRotationStatus, ListAliases,
          # ListGrants, and tags).
          #
          # activity_id = 2 (Collect) — the connector proactively polls the
          # KMS APIs, which is the "collection process" activity.
          # type_uid    = 5023 * 100 + 2 = 502302
          # ---------------------------------------------------------------

          # AWS timestamps arrive as ISO-8601 with a numeric offset
          # ("...+00:00") or, from some SDKs, as a numeric epoch. Normalize
          # both to integer epoch seconds (OCSF `time` is epoch seconds).

          def to_epoch_ms($ts):
            def _n: if . == null then null else tonumber end;
            def _num_ms($n):
              if   $n >= 1e17 then ($n / 1000000 | floor)
              elif $n >= 1e14 then ($n / 1000 | floor)
              elif $n >= 1e11 then ($n | floor)
              else ($n * 1000 + 0.001 | floor) end;
            def _digits_ms($d):
              ($d | ltrimstr("-") | length) as $l
              | if   $l >= 18 then ($d[0:-6] | tonumber)
                elif $l >= 15 then ($d[0:-3] | tonumber)
                elif $l >= 12 then ($d | tonumber)
                else ($d | tonumber) * 1000 end;
            def _frac_ms($f): if $f == null then 0 else (($f + "000")[0:3] | tonumber) end;
            def _mon($m):
              if $m == null then null
              else {"JAN":1,"FEB":2,"MAR":3,"APR":4,"MAY":5,"JUN":6,
                    "JUL":7,"AUG":8,"SEP":9,"OCT":10,"NOV":11,"DEC":12}[$m[0:3]] end;
            def _zone($z):
              if $z == null or $z == "" then 0
              else
                ($z | if test("^(UTC|GMT|UT)[+-]") then sub("^(UTC|GMT|UT)"; "") else . end) as $z
                | if ($z | test("^[+-][0-9]{1,2}(:?[0-9]{2})?$")) then
                    ($z | capture("^(?<sg>[+-])(?<h>[0-9]{1,2}):?(?<m>[0-9]{2})?$")) as $o
                    | (if $o.sg == "-" then -1 else 1 end)
                      * (($o.h | tonumber) * 3600 + (($o.m // "0") | tonumber) * 60)
                  else
                    {"Z":0,"UTC":0,"GMT":0,"UT":0,"EST":-18000,"EDT":-14400,"CST":-21600,
                     "CDT":-18000,"MST":-25200,"MDT":-21600,"PST":-28800,"PDT":-25200}[$z]
                  end
              end;
            def _ms($c):
              ($c.y | tonumber | if . < 100 then (if . < 70 then . + 2000 else . + 1900 end) else . end) as $y
              | ($c.mo | _n) as $mo
              | ($c.d | tonumber) as $d
              | (($c.h // "0") | tonumber) as $h
              | (($c.mi // "0") | tonumber) as $mi
              | (($c.s // "0") | tonumber) as $s
              | _zone($c.z) as $off
              | if $mo == null or $off == null or $mo < 1 or $mo > 12 or $d < 1 or $d > 31
                   or $h > 23 or $mi > 59 or $s > 60 then null
                else
                  ($y - (if $mo <= 2 then 1 else 0 end)) as $yy
                  | ($yy / 400 | floor) as $era
                  | ($yy - $era * 400) as $yoe
                  | (((153 * ($mo + (if $mo > 2 then -3 else 9 end)) + 2) / 5 | floor) + $d - 1) as $doy
                  | ($yoe * 365 + ($yoe / 4 | floor) - ($yoe / 100 | floor) + $doy) as $doe
                  | ($era * 146097 + $doe - 719468) as $days
                  | ($days * 86400 + $h * 3600 + $mi * 60 + $s - $off) * 1000 + _frac_ms($c.f)
                end;
            def _str($raw):
              ($raw | ascii_upcase | sub("\\s*\\([^)]*\\)\\s*$"; "") | sub("^\\s+"; "") | sub("\\s+$"; "")) as $s
              | "(?<z>Z|(?:UTC|GMT|UT)?[+-][0-9]{1,2}(?::?[0-9]{2})?|[A-Z]{1,5})" as $Z
              | "(?<h>[0-9]{1,2}):(?<mi>[0-9]{2})(?::(?<s>[0-9]{2}))?(?:[.,](?<f>[0-9]+))?" as $T
              | if $s == "" then null
                elif ($s | test("^-?[0-9]+$")) then _digits_ms($s)
                elif ($s | test("^[0-9]+\\.[0-9]+$")) then
                  ($s | split(".")) as $p
                  | if ($p[0] | length) <= 11 then _digits_ms($p[0]) + _frac_ms($p[1])
                    else _digits_ms($p[0]) end
                elif ($s | test("^/DATE\\(-?[0-9]+([+-][0-9]{4})?\\)/$")) then
                  ($s | capture("(?<ms>-?[0-9]+)").ms | tonumber)
                else
                  first(
                    ($s | capture("^(?<y>[0-9]{4})[-/](?<mo>[0-9]{1,2})[-/](?<d>[0-9]{1,2})(?:[T ]+" + $T + ")?\\s*" + $Z + "?(?:\\s+[A-Z]{2,5})?$") | _ms(.)),
                    ($s | capture("^(?<y>[0-9]{4})(?<mo>[0-9]{2})(?<d>[0-9]{2})T(?<h>[0-9]{2})(?<mi>[0-9]{2})(?<s>[0-9]{2})(?:[.,](?<f>[0-9]+))?" + $Z + "?$") | _ms(.)),
                    ($s | capture("^(?:[A-Z]+,?\\s+)?(?<d>[0-9]{1,2})[ -](?<mon>[A-Z]{3,9})[ -](?<y>[0-9]{2,4})\\s+" + $T + "\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?:[A-Z]+,?\\s+)?(?<mon>[A-Z]{3,9})\\.?\\s+(?<d>[0-9]{1,2}),?\\s+(?<y>[0-9]{4})(?:,?\\s+" + $T + ")?\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?:[A-Z]+\\s+)?(?<mon>[A-Z]{3,9})\\s+(?<d>[0-9]{1,2})\\s+" + $T + "\\s+(?:" + $Z + "\\s+)?(?<y>[0-9]{4})$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?<d>[0-9]{1,2})/(?<mon>[A-Z]{3})/(?<y>[0-9]{4}):" + $T + "\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.))
                  ) // null
                end;
            if $ts == null then null
            elif ($ts | type) == "number" then _num_ms($ts)
            elif ($ts | type) == "string" then _str($ts)
            elif ($ts | type) == "object" then
              if   $ts["$date"] != null then to_epoch_ms($ts["$date"])
              elif $ts["$numberLong"] != null then to_epoch_ms($ts["$numberLong"])
              elif $ts.seconds != null then
                ($ts.seconds | tostring | tonumber) * 1000
                + ((($ts.nanos // 0) | tostring | tonumber) / 1000000 | floor)
              else null end
            else null end;

          . as $r
          | ( $r.KeyMetadata // {} ) as $km
          | ( $r.KeyRotationStatus // {} ) as $rot
          | ( $r.Aliases // [] ) as $aliases
          | ( ($aliases[0].AliasName) // $km.KeyId ) as $display_name
          | ( ($r.Tags // []) | map("\(.TagKey):\(.TagValue)") ) as $labels

          | {
              # --- Classification (REQUIRED) ---
              "category_uid": 5,
              "class_uid":    5023,
              "type_uid":     502302,
              "activity_id":  2,
              "activity_name": "Collect",
              "severity_id":  1,

              # --- Time (REQUIRED) ---
              "time": to_epoch_ms($km.CreationDate),

              # --- Metadata (REQUIRED) ---
              "metadata": {
                "profiles": ["cloud", "osint"],
                "version": "1.9.0",
                "product": {
                  "vendor_name": "AWS",
                  "name": "AWS Key Management Service",
                  "feature": { "name": "KMS" }
                }
              },

              # --- OSINT (REQUIRED array; no threat-intel context here) ---
              "osint": [],

              # --- Cloud context (recommended) ---
              "cloud": {
                "provider": "aws",
                "region": ($r.Region // ($km.Arn | if type == "string" then (split(":")[3]) else null end)),
                "account": {
                  "uid": $km.AWSAccountId,
                  "type": "AWS Account",
                  "type_id": 10
                }
              },

              # --- The inventoried resource: the KMS key itself ---
              "resources": [
                {
                  "uid": $km.Arn,
                  "name": $display_name,
                  "type": "AWS::KMS::Key",
                  "labels": $labels,
                  "criticality": ($km.KeyManager // null),
                  "data": $km
                }
              ],

              # --- Recommended enrichers ---
              "status_id": 1,
              "message": ("AWS KMS key " + ($km.KeyId // "unknown") + " (" + ($km.KeyState // "unknown") + ")"),
              "count": 1,

              # --- Everything the class has no first-class home for ---
              "unmapped": {
                "key_state": $km.KeyState,
                "key_usage": $km.KeyUsage,
                "key_spec": ($km.KeySpec // $km.CustomerMasterKeySpec),
                "key_manager": $km.KeyManager,
                "origin": $km.Origin,
                "enabled": $km.Enabled,
                "multi_region": $km.MultiRegion,
                "rotation": $rot,
                "aliases": $aliases,
                "grants": ($r.Grants // [])
              },

              # --- Original record for audit / debugging ---
              "raw_data": ($r | tostring)
            }
