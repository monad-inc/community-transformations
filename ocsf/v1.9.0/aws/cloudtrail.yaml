name: "AWS CloudTrail to OCSF v1.9.0"
description: "Transforms individual AWS CloudTrail event records into the OCSF v1.9.0 API Activity (6003) class, resolving the acting identity across every AWS sign-in form and mapping the API call, cloud context, and source endpoint."
author: "Monad"
contributors:
  - "https://github.com/behobu"
inputs:
  - "cloudtrail"
tags:
  - "v1.9.0"
  - "ocsf"
  - "aws"
  - "cloudtrail"
  - "api"
config:
  operations:
    - operation: "jq"
      arguments:
        key: ""
        query: |
          # ---------------------------------------------------------------
          # OCSF API Activity (class_uid=6003, category_uid=6) — v1.9.0
          # Input: one AWS CloudTrail event record per invocation, as emitted
          #   by the Monad `cloudtrail` input connector.
          #
          # CloudTrail is the canonical example of an OCSF API Activity event:
          # a general CRUD API call. activity_id is derived from the eventName
          # verb (Create=1 / Read=2 / Update=3 / Delete=4, else Other=99).
          # ---------------------------------------------------------------


          def to_epoch_ms($ts):
            def _n: if . == null then null else tonumber end;
            def _num_ms($n):
              if   $n >= 1e17 then ($n / 1000000 | floor)
              elif $n >= 1e14 then ($n / 1000 | floor)
              elif $n >= 1e11 then ($n | floor)
              else ($n * 1000 + 0.001 | floor) end;
            def _digits_ms($d):
              ($d | ltrimstr("-") | length) as $l
              | if   $l >= 18 then ($d[0:-6] | tonumber)
                elif $l >= 15 then ($d[0:-3] | tonumber)
                elif $l >= 12 then ($d | tonumber)
                else ($d | tonumber) * 1000 end;
            def _frac_ms($f): if $f == null then 0 else (($f + "000")[0:3] | tonumber) end;
            def _mon($m):
              if $m == null then null
              else {"JAN":1,"FEB":2,"MAR":3,"APR":4,"MAY":5,"JUN":6,
                    "JUL":7,"AUG":8,"SEP":9,"OCT":10,"NOV":11,"DEC":12}[$m[0:3]] end;
            def _zone($z):
              if $z == null or $z == "" then 0
              else
                ($z | if test("^(UTC|GMT|UT)[+-]") then sub("^(UTC|GMT|UT)"; "") else . end) as $z
                | if ($z | test("^[+-][0-9]{1,2}(:?[0-9]{2})?$")) then
                    ($z | capture("^(?<sg>[+-])(?<h>[0-9]{1,2}):?(?<m>[0-9]{2})?$")) as $o
                    | (if $o.sg == "-" then -1 else 1 end)
                      * (($o.h | tonumber) * 3600 + (($o.m // "0") | tonumber) * 60)
                  else
                    {"Z":0,"UTC":0,"GMT":0,"UT":0,"EST":-18000,"EDT":-14400,"CST":-21600,
                     "CDT":-18000,"MST":-25200,"MDT":-21600,"PST":-28800,"PDT":-25200}[$z]
                  end
              end;
            def _ms($c):
              ($c.y | tonumber | if . < 100 then (if . < 70 then . + 2000 else . + 1900 end) else . end) as $y
              | ($c.mo | _n) as $mo
              | ($c.d | tonumber) as $d
              | (($c.h // "0") | tonumber) as $h
              | (($c.mi // "0") | tonumber) as $mi
              | (($c.s // "0") | tonumber) as $s
              | _zone($c.z) as $off
              | if $mo == null or $off == null or $mo < 1 or $mo > 12 or $d < 1 or $d > 31
                   or $h > 23 or $mi > 59 or $s > 60 then null
                else
                  ($y - (if $mo <= 2 then 1 else 0 end)) as $yy
                  | ($yy / 400 | floor) as $era
                  | ($yy - $era * 400) as $yoe
                  | (((153 * ($mo + (if $mo > 2 then -3 else 9 end)) + 2) / 5 | floor) + $d - 1) as $doy
                  | ($yoe * 365 + ($yoe / 4 | floor) - ($yoe / 100 | floor) + $doy) as $doe
                  | ($era * 146097 + $doe - 719468) as $days
                  | ($days * 86400 + $h * 3600 + $mi * 60 + $s - $off) * 1000 + _frac_ms($c.f)
                end;
            def _str($raw):
              ($raw | ascii_upcase | sub("\\s*\\([^)]*\\)\\s*$"; "") | sub("^\\s+"; "") | sub("\\s+$"; "")) as $s
              | "(?<z>Z|(?:UTC|GMT|UT)?[+-][0-9]{1,2}(?::?[0-9]{2})?|[A-Z]{1,5})" as $Z
              | "(?<h>[0-9]{1,2}):(?<mi>[0-9]{2})(?::(?<s>[0-9]{2}))?(?:[.,](?<f>[0-9]+))?" as $T
              | if $s == "" then null
                elif ($s | test("^-?[0-9]+$")) then _digits_ms($s)
                elif ($s | test("^[0-9]+\\.[0-9]+$")) then
                  ($s | split(".")) as $p
                  | if ($p[0] | length) <= 11 then _digits_ms($p[0]) + _frac_ms($p[1])
                    else _digits_ms($p[0]) end
                elif ($s | test("^/DATE\\(-?[0-9]+([+-][0-9]{4})?\\)/$")) then
                  ($s | capture("(?<ms>-?[0-9]+)").ms | tonumber)
                else
                  first(
                    ($s | capture("^(?<y>[0-9]{4})[-/](?<mo>[0-9]{1,2})[-/](?<d>[0-9]{1,2})(?:[T ]+" + $T + ")?\\s*" + $Z + "?(?:\\s+[A-Z]{2,5})?$") | _ms(.)),
                    ($s | capture("^(?<y>[0-9]{4})(?<mo>[0-9]{2})(?<d>[0-9]{2})T(?<h>[0-9]{2})(?<mi>[0-9]{2})(?<s>[0-9]{2})(?:[.,](?<f>[0-9]+))?" + $Z + "?$") | _ms(.)),
                    ($s | capture("^(?:[A-Z]+,?\\s+)?(?<d>[0-9]{1,2})[ -](?<mon>[A-Z]{3,9})[ -](?<y>[0-9]{2,4})\\s+" + $T + "\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?:[A-Z]+,?\\s+)?(?<mon>[A-Z]{3,9})\\.?\\s+(?<d>[0-9]{1,2}),?\\s+(?<y>[0-9]{4})(?:,?\\s+" + $T + ")?\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?:[A-Z]+\\s+)?(?<mon>[A-Z]{3,9})\\s+(?<d>[0-9]{1,2})\\s+" + $T + "\\s+(?:" + $Z + "\\s+)?(?<y>[0-9]{4})$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?<d>[0-9]{1,2})/(?<mon>[A-Z]{3})/(?<y>[0-9]{4}):" + $T + "\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.))
                  ) // null
                end;
            if $ts == null then null
            elif ($ts | type) == "number" then _num_ms($ts)
            elif ($ts | type) == "string" then _str($ts)
            elif ($ts | type) == "object" then
              if   $ts["$date"] != null then to_epoch_ms($ts["$date"])
              elif $ts["$numberLong"] != null then to_epoch_ms($ts["$numberLong"])
              elif $ts.seconds != null then
                ($ts.seconds | tostring | tonumber) * 1000
                + ((($ts.nanos // 0) | tostring | tonumber) / 1000000 | floor)
              else null end
            else null end;

          def is_ip($s):
            def _v4: test("^((25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])[.]){3}(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])$");
            def _v6:
              if (contains(":") and test("^[0-9A-Fa-f:.]+$")) | not then false
              else
                split("::") as $p
                | if ($p | length) > 2 then false
                  else
                    [$p[] | select(. != "") | split(":")[]] as $g
                    | (($g | length) > 0 and ($g[-1] | contains("."))) as $tail4
                    | (if $tail4 then $g[0:-1] else $g end) as $hex
                    | (($hex | length) + (if $tail4 then 2 else 0 end)) as $n
                    | (if $tail4 then ($g[-1] | _v4) else true end)
                      and all($hex[]; test("^[0-9A-Fa-f]{1,4}$"))
                      and (if ($p | length) == 2 then $n <= 7 else $n == 8 end)
                  end
              end;
            ($s | type) == "string" and ($s | _v4 or _v6);

          def real_name($s):
            if ($s | type) == "string" and $s != "HIDDEN_DUE_TO_SECURITY_REASONS"
            then $s else null end;

          def g($o; $k): if ($o | type) == "object" then $o[$k] else null end;

          def sid($o): real_name(g($o; "sourceIdentity"));

          def session_name($p):
            if ($p | type) == "string" and ($p | test(":"))
            then ($p | sub("^[^:]*:"; "")) else null end;

          def prune:
            walk(if type == "object" then with_entries(select(.value != null and .value != {} and .value != []))
                 elif type == "array" then map(select(. != null and . != {} and . != []))
                 else . end);

          . as $r
          | ( $r.userIdentity // {} ) as $ui
          | ( $ui.sessionContext // {} ) as $sc
          | ( $r.requestParameters ) as $rp
          | ( $r.responseElements ) as $re
          | ( $r.additionalEventData ) as $aed

          # ---- activity_id (CRUD) from the eventName verb -----------------
          | ( ($r.eventName // "") ) as $en
          | ( if ($r.readOnly // false) == true then 2
              elif ($en | test("^(Create|Add|Enable|Register|Put|Allocate|Import|Run|Provision|Attach|Associate|Generate|Issue)")) then 1
              elif ($en | test("^(Delete|Remove|Deregister|Disable|Detach|Disassociate|Terminate|Revoke)")) then 4
              elif ($en | test("^(Update|Modify|Set|Change|Replace|Put)")) then 3
              elif ($en | test("^(Describe|Get|List|Lookup|Head|Search|View|Batch)")) then 2
              else 99 end ) as $activity_id

          # ---- outcome / status ------------------------------------------
          | ( ($r.errorCode // null) != null ) as $is_failure
          | ( if $is_failure then 2 else 1 end ) as $status_id

          # ---- IDENTITY RESOLUTION (most-authoritative first) ------------
          | ( g($ui.onBehalfOf; "userId") ) as $idc_user_id
          | ( if $idc_user_id != null then session_name($ui.principalId)
              else null end ) as $idc_name
          | ( sid($sc) // sid($rp) // sid($re) ) as $source_identity
          | ( $source_identity
              // $idc_name
              // real_name(g($aed; "UserName"))
              // real_name($ui.userName)
              // real_name($sc.sessionIssuer.userName) ) as $actor_name

          | {
              # --- Classification (required) ---
              "category_uid": 6,
              "class_uid":    6003,
              "activity_id":  $activity_id,
              "type_uid":     (6003 * 100 + $activity_id),
              "severity_id":  1,
              "status_id":    $status_id,
              "status":       ( if $is_failure then "Failure" else "Success" end ),

              # --- Time (required) ---
              "time": to_epoch_ms($r.eventTime),

              # --- Metadata (required) ---
              "metadata": {
                "profiles": ["cloud", "osint"],
                "version": "1.9.0",
                "uid": $r.eventID,
                "correlation_uid": $r.requestID,
                "product": {
                  "vendor_name": "AWS",
                  "name": "CloudTrail",
                  "feature": { "name": ($r.eventType // "AwsApiCall") }
                }
              },

              # --- OSINT (required array; empty when no threat-intel context) ---
              "osint": [],

              # --- Cloud (required) ---
              "cloud": {
                "provider": "AWS",
                "region": $r.awsRegion,
                "account": { "uid": ($r.recipientAccountId // $ui.accountId), "type_id": 10 }
              },

              # --- Actor (required; at_least_one user/... satisfied by user) ---
              "actor": {
                "user": {
                  "name": $actor_name,
                  "uid": ($idc_user_id // $ui.principalId),
                  "uid_alt": $ui.arn,
                  "account": { "uid": $ui.accountId, "type_id": 10 },
                  "credential_uid": $ui.accessKeyId
                },
                "session": {
                  "created_time": ( to_epoch_ms(g($sc.attributes; "creationDate")) ),
                  "is_mfa": ( (g($sc.attributes; "mfaAuthenticated") // "") == "true" ),
                  "issuer": $sc.sessionIssuer.arn
                },
                "invoked_by": $ui.invokedBy
              },

              # --- API (required; api.operation required) ---
              "api": {
                "operation": $r.eventName,
                "version": $r.apiVersion,
                "request": { "uid": $r.requestID },
                "response": (
                  if $is_failure
                  then { "error": $r.errorCode, "message": $r.errorMessage }
                  else null end
                ),
                "service": { "name": $r.eventSource }
              },

              # --- Source endpoint (required; at_least_one ip/domain/...) ---
              "src_endpoint": {
                "ip": ( if is_ip($r.sourceIPAddress) then $r.sourceIPAddress else null end ),
                "domain": ( if is_ip($r.sourceIPAddress) then null else $r.sourceIPAddress end ),
                "uid": $r.vpcEndpointId
              },

              # --- Recommended fields ---
              "dst_endpoint": {
                "svc_name": $r.eventSource,
                "domain": ( g($r.tlsDetails; "clientProvidedHostHeader") )
              },
              "http_request": { "user_agent": $r.userAgent },
              "resources": ( ($r.resources // [])
                | map({ "uid": .ARN, "type": .type,
                        "cloud_partition": null,
                        "labels": null } | with_entries(select(.value != null))) ),
              "unmapped": {
                "eventVersion": $r.eventVersion,
                "managementEvent": $r.managementEvent,
                "readOnly": $r.readOnly,
                "eventCategory": $r.eventCategory,
                "tlsVersion": ( g($r.tlsDetails; "tlsVersion") ),
                "cipherSuite": ( g($r.tlsDetails; "cipherSuite") )
              },

              # --- Observables (a real attribute of this class each) ---
              "observables": (
                [ ( if $actor_name != null
                    then { "name": "actor.user.name", "type_id": 21, "value": $actor_name }
                    else null end ),
                  ( if is_ip($r.sourceIPAddress)
                    then { "name": "src_endpoint.ip", "type_id": 2, "value": $r.sourceIPAddress }
                    else null end ) ]
                | map(select(. != null))
              )
            }
          # Prune nulls/empties, then guarantee the required osint scaffold
          # survives (an empty array is valid and expected here).
          | . as $built
          | ($built | prune) + { "osint": ($built.osint // []) }
