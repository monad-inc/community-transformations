name: "AWS IAM Account Aliases to OCSF v1.9.0"
description: "Transforms AWS IAM account-alias inventory records (one AWS account and its IAM account alias) into the OCSF v1.9.0 Cloud Resources Inventory Info class (class_uid 5023)."
author: "Monad"
contributors:
  - "https://github.com/behobu"
inputs:
  - "aws-iam-aliases"
tags:
  - "v1.9.0"
  - "ocsf"
  - "aws"
  - "discovery"
  - "inventory"
config:
  operations:
    - operation: "jq"
      arguments:
        key: ""
        query: |
          # ---------------------------------------------------------------
          # OCSF Cloud Resources Inventory Info (class_uid=5023) — v1.9.0
          # Input: one aws-iam-aliases record per invocation, shape:
          #   { "AccountID": "123456789012", "Alias": "acme-production" }
          # emitted by the Monad `aws-iam-aliases` input connector, which
          # lists each configured AWS account together with its single IAM
          # account alias (AWS permits at most one alias per account).
          #
          # This is an INVENTORY SNAPSHOT, not an event: the source carries
          # no event time and no actor. It is modeled as a proactively
          # collected cloud-resource inventory record.
          #   activity_id = 2 (Collect — gathered via the IAM API, not a log)
          #   time        = collection time (now); source has no timestamp
          #   .AccountID  -> cloud.account.uid, resources[].uid
          #   .Alias      -> cloud.account.name, resources[].name
          # ---------------------------------------------------------------

          def to_epoch_ms($ts):
            def _n: if . == null then null else tonumber end;
            def _num_ms($n):
              if   $n >= 1e17 then ($n / 1000000 | floor)
              elif $n >= 1e14 then ($n / 1000 | floor)
              elif $n >= 1e11 then ($n | floor)
              else ($n * 1000 + 0.001 | floor) end;
            def _digits_ms($d):
              ($d | ltrimstr("-") | length) as $l
              | if   $l >= 18 then ($d[0:-6] | tonumber)
                elif $l >= 15 then ($d[0:-3] | tonumber)
                elif $l >= 12 then ($d | tonumber)
                else ($d | tonumber) * 1000 end;
            def _frac_ms($f): if $f == null then 0 else (($f + "000")[0:3] | tonumber) end;
            def _mon($m):
              if $m == null then null
              else {"JAN":1,"FEB":2,"MAR":3,"APR":4,"MAY":5,"JUN":6,
                    "JUL":7,"AUG":8,"SEP":9,"OCT":10,"NOV":11,"DEC":12}[$m[0:3]] end;
            def _zone($z):
              if $z == null or $z == "" then 0
              else
                ($z | if test("^(UTC|GMT|UT)[+-]") then sub("^(UTC|GMT|UT)"; "") else . end) as $z
                | if ($z | test("^[+-][0-9]{1,2}(:?[0-9]{2})?$")) then
                    ($z | capture("^(?<sg>[+-])(?<h>[0-9]{1,2}):?(?<m>[0-9]{2})?$")) as $o
                    | (if $o.sg == "-" then -1 else 1 end)
                      * (($o.h | tonumber) * 3600 + (($o.m // "0") | tonumber) * 60)
                  else
                    {"Z":0,"UTC":0,"GMT":0,"UT":0,"EST":-18000,"EDT":-14400,"CST":-21600,
                     "CDT":-18000,"MST":-25200,"MDT":-21600,"PST":-28800,"PDT":-25200}[$z]
                  end
              end;
            def _ms($c):
              ($c.y | tonumber | if . < 100 then (if . < 70 then . + 2000 else . + 1900 end) else . end) as $y
              | ($c.mo | _n) as $mo
              | ($c.d | tonumber) as $d
              | (($c.h // "0") | tonumber) as $h
              | (($c.mi // "0") | tonumber) as $mi
              | (($c.s // "0") | tonumber) as $s
              | _zone($c.z) as $off
              | if $mo == null or $off == null or $mo < 1 or $mo > 12 or $d < 1 or $d > 31
                   or $h > 23 or $mi > 59 or $s > 60 then null
                else
                  ($y - (if $mo <= 2 then 1 else 0 end)) as $yy
                  | ($yy / 400 | floor) as $era
                  | ($yy - $era * 400) as $yoe
                  | (((153 * ($mo + (if $mo > 2 then -3 else 9 end)) + 2) / 5 | floor) + $d - 1) as $doy
                  | ($yoe * 365 + ($yoe / 4 | floor) - ($yoe / 100 | floor) + $doy) as $doe
                  | ($era * 146097 + $doe - 719468) as $days
                  | ($days * 86400 + $h * 3600 + $mi * 60 + $s - $off) * 1000 + _frac_ms($c.f)
                end;
            def _str($raw):
              ($raw | ascii_upcase | sub("\\s*\\([^)]*\\)\\s*$"; "") | sub("^\\s+"; "") | sub("\\s+$"; "")) as $s
              | "(?<z>Z|(?:UTC|GMT|UT)?[+-][0-9]{1,2}(?::?[0-9]{2})?|[A-Z]{1,5})" as $Z
              | "(?<h>[0-9]{1,2}):(?<mi>[0-9]{2})(?::(?<s>[0-9]{2}))?(?:[.,](?<f>[0-9]+))?" as $T
              | if $s == "" then null
                elif ($s | test("^-?[0-9]+$")) then _digits_ms($s)
                elif ($s | test("^[0-9]+\\.[0-9]+$")) then
                  ($s | split(".")) as $p
                  | if ($p[0] | length) <= 11 then _digits_ms($p[0]) + _frac_ms($p[1])
                    else _digits_ms($p[0]) end
                elif ($s | test("^/DATE\\(-?[0-9]+([+-][0-9]{4})?\\)/$")) then
                  ($s | capture("(?<ms>-?[0-9]+)").ms | tonumber)
                else
                  first(
                    ($s | capture("^(?<y>[0-9]{4})[-/](?<mo>[0-9]{1,2})[-/](?<d>[0-9]{1,2})(?:[T ]+" + $T + ")?\\s*" + $Z + "?(?:\\s+[A-Z]{2,5})?$") | _ms(.)),
                    ($s | capture("^(?<y>[0-9]{4})(?<mo>[0-9]{2})(?<d>[0-9]{2})T(?<h>[0-9]{2})(?<mi>[0-9]{2})(?<s>[0-9]{2})(?:[.,](?<f>[0-9]+))?" + $Z + "?$") | _ms(.)),
                    ($s | capture("^(?:[A-Z]+,?\\s+)?(?<d>[0-9]{1,2})[ -](?<mon>[A-Z]{3,9})[ -](?<y>[0-9]{2,4})\\s+" + $T + "\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?:[A-Z]+,?\\s+)?(?<mon>[A-Z]{3,9})\\.?\\s+(?<d>[0-9]{1,2}),?\\s+(?<y>[0-9]{4})(?:,?\\s+" + $T + ")?\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?:[A-Z]+\\s+)?(?<mon>[A-Z]{3,9})\\s+(?<d>[0-9]{1,2})\\s+" + $T + "\\s+(?:" + $Z + "\\s+)?(?<y>[0-9]{4})$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?<d>[0-9]{1,2})/(?<mon>[A-Z]{3})/(?<y>[0-9]{4}):" + $T + "\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.))
                  ) // null
                end;
            if $ts == null then null
            elif ($ts | type) == "number" then _num_ms($ts)
            elif ($ts | type) == "string" then _str($ts)
            elif ($ts | type) == "object" then
              if   $ts["$date"] != null then to_epoch_ms($ts["$date"])
              elif $ts["$numberLong"] != null then to_epoch_ms($ts["$numberLong"])
              elif $ts.seconds != null then
                ($ts.seconds | tostring | tonumber) * 1000
                + ((($ts.nanos // 0) | tostring | tonumber) / 1000000 | floor)
              else null end
            else null end;

          . as $r
          | ($r.AccountID // null) as $acct
          | ($r.Alias // null) as $alias
          | (now * 1000 | floor) as $t

          | {
              # --- Classification (REQUIRED) ---
              "category_uid": 5,
              "class_uid":    5023,
              "type_uid":     502302,       # 5023 * 100 + activity_id(2)
              "activity_id":  2,            # Collect
              "severity_id":  1,            # Informational

              # --- Time (REQUIRED) — collection time, source has none ---
              "time": $t,

              # --- Metadata (REQUIRED) ---
              "metadata": {
                "profiles": ["cloud", "osint"],
                "version": "1.9.0",
                "product": {
                  "vendor_name": "AWS",
                  "name": "AWS IAM"
                }
              },

              # --- OSINT (REQUIRED by the 5023 base in OCSF 1.9.0) --------
              # The Cloud Resources Inventory Info class marks `osint` as a
              # base-required field in OCSF 1.9.0. An account alias is not a
              # threat indicator, so this is a schema-mandated placeholder:
              # type_id 99 (Other), value = the account identity.
              "osint": [{
                "value":   ($alias // $acct // "unknown"),
                "type_id": 99,
                "name":    "AWS account alias",
                "desc":    "Schema-required OSINT placeholder; not a threat indicator."
              }],

              # --- Recommended: the cloud account this record describes ---
              "cloud": {
                "provider": "aws",
                "account": {
                  "uid":     $acct,
                  "name":    $alias,
                  "type_id": 10        # AWS Account
                }
              },

              # --- Recommended: the inventoried resource(s) ---
              "resources": [
                {
                  "uid":  $acct,
                  "name": $alias,
                  "type": "AWS Account"
                }
              ],

              "status_id": 1,          # Success
              "message": (
                if $alias != null and $acct != null
                then "AWS account " + $acct + " alias: " + $alias
                elif $acct != null
                then "AWS account " + $acct + " (no alias set)"
                else "AWS account alias inventory record" end
              ),

              "observables": (
                [ ( if $acct  != null then {"name":"cloud.account.uid","type_id":10,"value":$acct} else empty end ),
                  ( if $alias != null then {"name":"cloud.account.name","type_id":0,"value":$alias} else empty end ) ]
              ),

              "raw_data": ($r | tostring)
            }

          # Drop nulls / empties while preserving required objects.
          | walk(
              if type == "object" then
                with_entries(select(.value != null and .value != {} and .value != []))
              elif type == "array" then
                map(select(. != null))
              else . end
            )
