name: "AWS IAM Access Analyzer Findings to OCSF v1.9.0"
description: "Transforms AWS IAM Access Analyzer external-access finding records into the OCSF v1.9.0 IAM Analysis Finding class (class_uid 2008)."
author: "Monad"
contributors:
  - "https://github.com/behobu"
inputs:
  - "aws-iam-access-analyzer"
tags:
  - "v1.9.0"
  - "ocsf"
  - "aws"
  - "findings"
  - "iam"
config:
  operations:
    - operation: "jq"
      arguments:
        key: ""
        query: |
          # =================================================================
          # AWS IAM Access Analyzer -> OCSF v1.9.0 IAM Analysis Finding (2008)
          #
          # Input: ONE Access Analyzer Finding record per invocation, as
          # returned by ListFindings / GetFinding and emitted by the Monad
          # `aws-iam-access-analyzer` input connector.
          #
          # Field mappings:
          #   .analyzedAt / .updatedAt / .createdAt -> time
          #   .id                    -> finding_info.uid, metadata.uid
          #   .resource              -> osint.value, resource ARN references
          #   .status                -> activity_id / status / status_id
          #   .isPublic              -> severity_id
          #   .action[]              -> access_analysis_result.granted_privileges
          #   .principal             -> access_analysis_result.accessors
          #   .resourceOwnerAccount  -> cloud.account.uid
          #   .analyzerArn (region)  -> cloud.region
          # The IAM Analysis Finding class requires at_least_one of
          # access_analysis_result / permission_analysis_results / ... ; this
          # is a resource-centric (who-can-access) finding, so it populates
          # access_analysis_result.
          # =================================================================


          def to_epoch_ms($ts):
            def _n: if . == null then null else tonumber end;
            def _num_ms($n):
              if   $n >= 1e17 then ($n / 1000000 | floor)
              elif $n >= 1e14 then ($n / 1000 | floor)
              elif $n >= 1e11 then ($n | floor)
              else ($n * 1000 + 0.001 | floor) end;
            def _digits_ms($d):
              ($d | ltrimstr("-") | length) as $l
              | if   $l >= 18 then ($d[0:-6] | tonumber)
                elif $l >= 15 then ($d[0:-3] | tonumber)
                elif $l >= 12 then ($d | tonumber)
                else ($d | tonumber) * 1000 end;
            def _frac_ms($f): if $f == null then 0 else (($f + "000")[0:3] | tonumber) end;
            def _mon($m):
              if $m == null then null
              else {"JAN":1,"FEB":2,"MAR":3,"APR":4,"MAY":5,"JUN":6,
                    "JUL":7,"AUG":8,"SEP":9,"OCT":10,"NOV":11,"DEC":12}[$m[0:3]] end;
            def _zone($z):
              if $z == null or $z == "" then 0
              else
                ($z | if test("^(UTC|GMT|UT)[+-]") then sub("^(UTC|GMT|UT)"; "") else . end) as $z
                | if ($z | test("^[+-][0-9]{1,2}(:?[0-9]{2})?$")) then
                    ($z | capture("^(?<sg>[+-])(?<h>[0-9]{1,2}):?(?<m>[0-9]{2})?$")) as $o
                    | (if $o.sg == "-" then -1 else 1 end)
                      * (($o.h | tonumber) * 3600 + (($o.m // "0") | tonumber) * 60)
                  else
                    {"Z":0,"UTC":0,"GMT":0,"UT":0,"EST":-18000,"EDT":-14400,"CST":-21600,
                     "CDT":-18000,"MST":-25200,"MDT":-21600,"PST":-28800,"PDT":-25200}[$z]
                  end
              end;
            def _ms($c):
              ($c.y | tonumber | if . < 100 then (if . < 70 then . + 2000 else . + 1900 end) else . end) as $y
              | ($c.mo | _n) as $mo
              | ($c.d | tonumber) as $d
              | (($c.h // "0") | tonumber) as $h
              | (($c.mi // "0") | tonumber) as $mi
              | (($c.s // "0") | tonumber) as $s
              | _zone($c.z) as $off
              | if $mo == null or $off == null or $mo < 1 or $mo > 12 or $d < 1 or $d > 31
                   or $h > 23 or $mi > 59 or $s > 60 then null
                else
                  ($y - (if $mo <= 2 then 1 else 0 end)) as $yy
                  | ($yy / 400 | floor) as $era
                  | ($yy - $era * 400) as $yoe
                  | (((153 * ($mo + (if $mo > 2 then -3 else 9 end)) + 2) / 5 | floor) + $d - 1) as $doy
                  | ($yoe * 365 + ($yoe / 4 | floor) - ($yoe / 100 | floor) + $doy) as $doe
                  | ($era * 146097 + $doe - 719468) as $days
                  | ($days * 86400 + $h * 3600 + $mi * 60 + $s - $off) * 1000 + _frac_ms($c.f)
                end;
            def _str($raw):
              ($raw | ascii_upcase | sub("\\s*\\([^)]*\\)\\s*$"; "") | sub("^\\s+"; "") | sub("\\s+$"; "")) as $s
              | "(?<z>Z|(?:UTC|GMT|UT)?[+-][0-9]{1,2}(?::?[0-9]{2})?|[A-Z]{1,5})" as $Z
              | "(?<h>[0-9]{1,2}):(?<mi>[0-9]{2})(?::(?<s>[0-9]{2}))?(?:[.,](?<f>[0-9]+))?" as $T
              | if $s == "" then null
                elif ($s | test("^-?[0-9]+$")) then _digits_ms($s)
                elif ($s | test("^[0-9]+\\.[0-9]+$")) then
                  ($s | split(".")) as $p
                  | if ($p[0] | length) <= 11 then _digits_ms($p[0]) + _frac_ms($p[1])
                    else _digits_ms($p[0]) end
                elif ($s | test("^/DATE\\(-?[0-9]+([+-][0-9]{4})?\\)/$")) then
                  ($s | capture("(?<ms>-?[0-9]+)").ms | tonumber)
                else
                  first(
                    ($s | capture("^(?<y>[0-9]{4})[-/](?<mo>[0-9]{1,2})[-/](?<d>[0-9]{1,2})(?:[T ]+" + $T + ")?\\s*" + $Z + "?(?:\\s+[A-Z]{2,5})?$") | _ms(.)),
                    ($s | capture("^(?<y>[0-9]{4})(?<mo>[0-9]{2})(?<d>[0-9]{2})T(?<h>[0-9]{2})(?<mi>[0-9]{2})(?<s>[0-9]{2})(?:[.,](?<f>[0-9]+))?" + $Z + "?$") | _ms(.)),
                    ($s | capture("^(?:[A-Z]+,?\\s+)?(?<d>[0-9]{1,2})[ -](?<mon>[A-Z]{3,9})[ -](?<y>[0-9]{2,4})\\s+" + $T + "\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?:[A-Z]+,?\\s+)?(?<mon>[A-Z]{3,9})\\.?\\s+(?<d>[0-9]{1,2}),?\\s+(?<y>[0-9]{4})(?:,?\\s+" + $T + ")?\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?:[A-Z]+\\s+)?(?<mon>[A-Z]{3,9})\\s+(?<d>[0-9]{1,2})\\s+" + $T + "\\s+(?:" + $Z + "\\s+)?(?<y>[0-9]{4})$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?<d>[0-9]{1,2})/(?<mon>[A-Z]{3})/(?<y>[0-9]{4}):" + $T + "\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.))
                  ) // null
                end;
            if $ts == null then null
            elif ($ts | type) == "number" then _num_ms($ts)
            elif ($ts | type) == "string" then _str($ts)
            elif ($ts | type) == "object" then
              if   $ts["$date"] != null then to_epoch_ms($ts["$date"])
              elif $ts["$numberLong"] != null then to_epoch_ms($ts["$numberLong"])
              elif $ts.seconds != null then
                ($ts.seconds | tostring | tonumber) * 1000
                + ((($ts.nanos // 0) | tostring | tonumber) / 1000000 | floor)
              else null end
            else null end;

          def prune:
            walk(if type == "object" then with_entries(select(.value != null and .value != {} and .value != []))
                 elif type == "array" then map(select(. != null and . != {} and . != []))
                 else . end);

          . as $r
          | ( $r.status // "ACTIVE" ) as $status
          # A resolved/archived finding is a Close; an unchanged create time is
          # a Create; anything else is an Update.
          | ( if ($status == "RESOLVED" or $status == "ARCHIVED") then 3
              elif ($r.createdAt // "") == ($r.updatedAt // "x") then 1
              else 2 end ) as $activity_id
          # Public exposure is High; scoped external access is Medium; a
          # closed finding drops to Low.
          | ( if ($status == "RESOLVED" or $status == "ARCHIVED") then 2
              elif ($r.isPublic // false) == true then 4
              else 3 end ) as $severity_id
          | ( { "ACTIVE": 1, "ARCHIVED": 5, "RESOLVED": 4 }[$status] // 0 ) as $status_id
          # Analyzer ARN carries the region (arn:aws:access-analyzer:REGION:...);
          # the resource ARN for S3 buckets has none, so prefer the analyzer.
          | ( ($r.analyzerArn // "") | split(":") ) as $aarn
          | ( if ($aarn | length) > 3 and ($aarn[3] != "") then $aarn[3] else null end ) as $region
          | ( [ ($r.principal // {}) | to_entries[] | { "name": .value, "type": .key } ] ) as $accessors

          | {
              "category_uid": 2,
              "class_uid": 2008,
              "type_uid": (200800 + $activity_id),
              "activity_id": $activity_id,
              "severity_id": $severity_id,

              "time": (to_epoch_ms($r.analyzedAt) // to_epoch_ms($r.updatedAt) // to_epoch_ms($r.createdAt)),

              "metadata": {
                "profiles": ["cloud", "osint"],
                "version": "1.9.0",
                "uid": $r.id,
                "product": {
                  "vendor_name": "AWS",
                  "name": "IAM Access Analyzer",
                  "feature": { "name": "External Access Analyzer" }
                }
              },

              "cloud": {
                "provider": "AWS",
                "region": $region,
                "account": { "uid": $r.resourceOwnerAccount, "type_id": 10 }
              },

              # The class requires an osint array; the analyzed resource ARN
              # is the indicator this finding is about.
              "osint": [{
                "value": ($r.resource // $r.id),
                "type_id": 99,
                "type": "Resource ARN"
              }],

              "finding_info": {
                "uid": $r.id,
                "title": ("External access to " + ($r.resourceType // "resource") + " " + ($r.resource // $r.id)),
                "desc": (if ($r.isPublic // false) == true
                         then "Access Analyzer found a policy granting public access to this resource."
                         else "Access Analyzer found a policy granting an external principal access to this resource."
                         end),
                "created_time": to_epoch_ms($r.createdAt),
                "modified_time": to_epoch_ms($r.updatedAt),
                "first_seen_time": to_epoch_ms($r.createdAt),
                "last_seen_time": to_epoch_ms($r.analyzedAt),
                "types": [ ($r.resourceType // null) ],
                "src_url": null,
                "analytic": {
                  "type_id": 1,
                  "name": "IAM Access Analyzer",
                  "type": "Rule"
                }
              },

              "access_analysis_result": {
                "access_type": (if ($r.isPublic // false) == true then "PUBLIC_ACCESS" else "EXTERNAL_ACCESS" end),
                "access_level": (if ($r.isPublic // false) == true then "PUBLIC" else "EXTERNAL" end),
                "granted_privileges": ($r.action // null),
                "accessors": (if ($accessors | length) > 0 then $accessors else null end),
                "condition_keys": (if (($r.condition // {}) | length) > 0
                                   then [ ($r.condition | to_entries[] | { "name": .key, "value": .value }) ]
                                   else null end)
              },

              "status": $status,
              "status_id": $status_id,
              "message": (if ($r.error // null) != null
                          then ("Access Analyzer finding error: " + $r.error)
                          else ("External access finding for " + ($r.resource // $r.id)) end),

              "resources": [
                {
                  "uid": $r.resource,
                  "type": $r.resourceType,
                  "cloud_partition": "aws",
                  "owner": { "account": { "uid": $r.resourceOwnerAccount, "type_id": 10 } }
                }
              ],

              "observables": [
                { "name": "finding_info.uid", "type_id": 8, "value": $r.id },
                { "name": "osint.value", "type_id": 99, "value": $r.resource }
              ],

              "unmapped": {
                "sources": $r.sources,
                "resourceControlPolicyRestriction": $r.resourceControlPolicyRestriction,
                "analyzerArn": $r.analyzerArn
              },

              "raw_data": ($r | tostring)
            }
          | prune
