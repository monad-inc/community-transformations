name: "AWS IAM Access Analyzer Findings to OCSF v1.9.0"
description: "Transforms AWS IAM Access Analyzer finding summaries (external, internal, and unused access) into the OCSF v1.9.0 IAM Analysis Finding class (class_uid 2008)."
author: "Monad"
contributors:
  - "https://github.com/behobu"
inputs:
  - "aws-iam-access-analyzer"
tags:
  - "v1.9.0"
  - "ocsf"
  - "aws"
  - "findings"
  - "iam"
config:
  operations:
    - operation: "jq"
      arguments:
        key: ""
        query: |
          # =================================================================
          # AWS IAM Access Analyzer -> OCSF v1.9.0 IAM Analysis Finding (2008)
          #
          # Input: ONE finding per invocation, as emitted by the Monad
          # `aws-iam-access-analyzer` input connector: a json.Marshal of the
          # AWS SDK for Go v2 accessanalyzer types.FindingSummaryV2
          # (ListFindingsV2). The SDK structs carry no json tags, so keys are
          # PascalCase and the record holds only:
          #   Id, AnalyzedAt, CreatedAt, UpdatedAt (RFC 3339, ns precision),
          #   ResourceOwnerAccount, ResourceType, Status, Error,
          #   FindingType, Resource (ARN).
          # A summary has no principal, action, condition, isPublic, or
          # sources — those exist only on GetFindingV2 details, which the
          # connector does not fetch. A camelCase record is normalized to
          # PascalCase first.
          #
          # Field mappings:
          #   AnalyzedAt / UpdatedAt / CreatedAt -> time (first non-null)
          #   Id                       -> finding_info.uid, metadata.uid
          #   FindingType              -> finding_info.types / title, severity_id,
          #                               metadata.product.feature.name, and which
          #                               analysis object is emitted (below)
          #   Status                   -> status_code / status_id / activity_id
          #   Error                    -> status_detail / message
          #   Resource / ResourceType  -> resources[0].uid / type, finding_info.title
          #   Resource ARN partition/region -> cloud.cloud_partition / cloud.region
          #   ResourceOwnerAccount     -> cloud.account.uid, resources[0].owner
          #
          # The class requires at_least_one of access_analysis_result /
          # permission_analysis_results / identity_activity_metrics /
          # applications. Access findings (ExternalAccess, InternalAccess) are
          # resource-centric, so they carry access_analysis_result with
          # access_type from FindingType and an EMPTY accessors list (the
          # summary does not name the principal). Unused-access findings are
          # identity-centric and carry an empty permission_analysis_results
          # entry. Nothing is invented to fill them.
          # =================================================================

          # OCSF timestamp_t is epoch MILLISECONDS. Use this helper for every
          # time / *_time field; it accepts epoch s/ms/us/ns numbers, numeric
          # strings, {seconds,nanos}, and ISO 8601 with any UTC offset, and
          # returns null (not an error) on unparseable input.
          def to_epoch_ms($ts):
            def _num_ms($n):
              if   $n >= 1e17 then ($n / 1000000 | floor)
              elif $n >= 1e14 then ($n / 1000 | floor)
              elif $n >= 1e11 then ($n | floor)
              else ($n * 1000 | floor) end;
            if $ts == null or $ts == "" then null
            elif ($ts | type) == "number" then _num_ms($ts)
            elif ($ts | type) == "object" then
              (if ($ts.seconds // null) == null then null
               else ($ts.seconds * 1000 + ((($ts.nanos // 0) / 1000000) | floor)) end)
            elif ($ts | type) == "string" then
              if ($ts | test("^-?[0-9]+(\\.[0-9]+)?$")) then _num_ms($ts | tonumber)
              else
                ([$ts | ascii_upcase | capture("^(?<d>[0-9]{4}-[0-9]{2}-[0-9]{2})(?:[T ](?<t>[0-9]{2}:[0-9]{2}(?::[0-9]{2})?)(?:[.,](?<f>[0-9]+))?)? ?(?<z>Z|UTC|[+-][0-9]{2}(?::?[0-9]{2})?)?$")] | first) as $m
                | if $m == null then null
                  else
                    (($m.t // "00:00:00") | if length == 5 then . + ":00" else . end) as $t
                    | (($m.z // "Z") | if . == "Z" or . == "UTC" then 0
                        else (.[1:] | gsub(":"; "")) as $o
                          | ((if (.[0:1]) == "-" then -1 else 1 end)
                             * (($o[0:2] | tonumber) * 3600 + ((if ($o | length) >= 4 then $o[2:4] else "00" end) | tonumber) * 60))
                        end) as $off
                    | ((($m.d + "T" + $t + "Z") | fromdateiso8601) - $off) * 1000
                      + (((($m.f // "") + "000")[0:3]) | tonumber)
                  end
              end
            else null end;

          def prune:
            walk(
              if type == "object" then
                with_entries(select(.value != null and .value != "" and .value != {} and .value != []))
              elif type == "array" then
                map(select(. != null))
              else . end
            );

          # camelCase -> PascalCase keys (only when the record is not already
          # in the connector's PascalCase shape).
          def pascal_keys:
            with_entries(.key |= ((.[0:1] | ascii_upcase) + .[1:]));

          (if (has("Id") | not) and has("id") then pascal_keys else . end) as $r
          | ($r.Status // "") as $status
          | ($r.FindingType // "") as $ftype
          | (to_epoch_ms($r.CreatedAt)) as $created
          | (to_epoch_ms($r.UpdatedAt)) as $updated
          | ($status == "RESOLVED" or $status == "ARCHIVED") as $closed

          # A resolved/archived finding is a Close; a finding whose update
          # time equals its create time is a Create; anything else an Update.
          | ( if $closed then 3
              elif ($created != null and $updated != null and $updated > $created) then 2
              else 1 end ) as $activity_id

          # The summary carries no severity. Derive one from the finding
          # type: external access Medium, internal / unused access Low; a
          # closed finding is Informational; an unknown type is Unknown.
          | ( if $closed then 1
              elif $ftype == "ExternalAccess" then 3
              elif $ftype == "InternalAccess" or ($ftype | startswith("Unused")) then 2
              else 0 end ) as $severity_id

          | ( { "ACTIVE": 1, "ARCHIVED": 5, "RESOLVED": 4 }[$status] // 0 ) as $status_id

          | ( { "ExternalAccess": "External access",
                "InternalAccess": "Internal access",
                "UnusedIAMRole": "Unused IAM role",
                "UnusedIAMUserAccessKey": "Unused IAM user access key",
                "UnusedIAMUserPassword": "Unused IAM user password",
                "UnusedPermission": "Unused permissions" }[$ftype] // (if $ftype != "" then $ftype else "Access Analyzer finding" end) ) as $label

          | ( if $ftype == "ExternalAccess" then "External Access Analyzer"
              elif $ftype == "InternalAccess" then "Internal Access Analyzer"
              elif ($ftype | startswith("Unused")) then "Unused Access Analyzer"
              else null end ) as $feature

          # arn:<partition>:<service>:<region>:<account>:<resource>
          | ( ($r.Resource // "") | split(":") ) as $arn
          | ( if ($arn | length) > 3 and $arn[0] == "arn" then $arn[1] else null end ) as $partition
          | ( if ($arn | length) > 3 and $arn[0] == "arn" and $arn[3] != "" then $arn[3] else null end ) as $region

          | {
              "category_uid": 2,
              "class_uid": 2008,
              "type_uid": (2008 * 100 + $activity_id),
              "activity_id": $activity_id,
              "severity_id": $severity_id,

              "time": (to_epoch_ms($r.AnalyzedAt) // $updated // $created // (now * 1000 | floor)),

              "metadata": {
                "profiles": ["cloud"],
                "version": "1.9.0",
                "uid": $r.Id,
                "product": {
                  "vendor_name": "AWS",
                  "name": "AWS IAM Access Analyzer",
                  "feature": (if $feature != null then { "name": $feature } else null end)
                }
              },

              "cloud": {
                "provider": "AWS",
                "region": $region,
                "cloud_partition": $partition,
                "account": { "uid": $r.ResourceOwnerAccount, "type_id": 10 }
              },

              "finding_info": {
                "uid": $r.Id,
                "title": ($label + ": " + ($r.Resource // $r.ResourceType // $r.Id // "unknown resource")),
                "desc": ($label + " finding for "
                         + (if $r.ResourceType != null then $r.ResourceType + " " else "" end)
                         + ($r.Resource // "an unidentified resource")
                         + (if $r.ResourceOwnerAccount != null then " in account " + $r.ResourceOwnerAccount else "" end)
                         + "."),
                "types": (if $ftype != "" then [ $ftype ] else null end),
                "created_time": $created,
                "modified_time": $updated,
                "first_seen_time": $created,
                "last_seen_time": to_epoch_ms($r.AnalyzedAt),
                "analytic": {
                  "name": ("IAM Access Analyzer" + (if $ftype != "" then " " + $ftype else "" end)),
                  "type_id": 1,
                  "type": "Rule"
                }
              },

              # Vendor value in status_code; OCSF `status` must match the
              # status_id caption, so it is left to consumers to derive.
              "status_code": (if $status != "" then $status else null end),
              "status_id": $status_id,
              "status_detail": $r.Error,
              "message": (if $r.Error != null
                          then ("Access Analyzer finding error: " + $r.Error)
                          else ($label + " finding for " + ($r.Resource // $r.ResourceType // "resource")) end),

              "resources": (if $r.Resource != null then [
                {
                  "uid": $r.Resource,
                  "type": $r.ResourceType,
                  "region": $region,
                  "cloud_partition": $partition,
                  "owner": { "account": { "uid": $r.ResourceOwnerAccount, "type_id": 10 } }
                }
              ] else null end),

              "observables": [
                (if $r.Resource != null then { "name": "resources.uid", "type_id": 10, "value": $r.Resource } else empty end),
                (if $r.ResourceOwnerAccount != null then { "name": "cloud.account.uid", "type_id": 35, "value": $r.ResourceOwnerAccount } else empty end)
              ],

              "raw_data": (. | tostring)
            }
          | prune
          # Satisfy the class at_least_one with the analysis object matching
          # the finding type (added after prune so the empty lists survive).
          | if ($ftype | startswith("Unused"))
            then .permission_analysis_results = [ {} ]
            else .access_analysis_result = (
                   { "accessors": [] }
                   + (if $ftype == "ExternalAccess" then { "access_type": "External" }
                      elif $ftype == "InternalAccess" then { "access_type": "Internal" }
                      else {} end) )
            end
