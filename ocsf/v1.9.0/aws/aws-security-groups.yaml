name: "AWS Security Groups to OCSF v1.9.0"
description: "Transforms AWS EC2 Security Group inventory records (as emitted by the aws-security-groups input connector) into the OCSF v1.9.0 Cloud Resources Inventory Info class (class_uid 5023)."
author: "Monad"
contributors:
  - "https://github.com/behobu"
inputs:
  - "aws-security-groups"
tags:
  - "v1.9.0"
  - "ocsf"
  - "aws"
  - "discovery"
  - "cloud-security"
  - "security-groups"
config:
  operations:
    - operation: "jq"
      arguments:
        key: ""
        query: |
          # ---------------------------------------------------------------
          # OCSF Cloud Resources Inventory Info (class_uid=5023) — v1.9.0
          # Category: Discovery (5).  Activity: Collect (2) — records are
          # proactively pulled from the EC2 DescribeSecurityGroups API on a
          # cron by the aws-security-groups connector, not logged at an event.
          #
          # Input: one AWS EC2 SecurityGroup record per invocation (SDK/JSON
          # PascalCase form), e.g. { GroupId, GroupName, Description, VpcId,
          # OwnerId, SecurityGroupArn, IpPermissions[], IpPermissionsEgress[],
          # Tags[] }.
          #
          # A security group carries no event timestamp of its own (it is a
          # configuration snapshot), so `time` is stamped at collection with
          # `now`, consistent with activity_id=Collect.
          # ---------------------------------------------------------------

          def to_epoch_ms($ts):
            def _n: if . == null then null else tonumber end;
            def _num_ms($n):
              if   $n >= 1e17 then ($n / 1000000 | floor)
              elif $n >= 1e14 then ($n / 1000 | floor)
              elif $n >= 1e11 then ($n | floor)
              else ($n * 1000 + 0.001 | floor) end;
            def _digits_ms($d):
              ($d | ltrimstr("-") | length) as $l
              | if   $l >= 18 then ($d[0:-6] | tonumber)
                elif $l >= 15 then ($d[0:-3] | tonumber)
                elif $l >= 12 then ($d | tonumber)
                else ($d | tonumber) * 1000 end;
            def _frac_ms($f): if $f == null then 0 else (($f + "000")[0:3] | tonumber) end;
            def _mon($m):
              if $m == null then null
              else {"JAN":1,"FEB":2,"MAR":3,"APR":4,"MAY":5,"JUN":6,
                    "JUL":7,"AUG":8,"SEP":9,"OCT":10,"NOV":11,"DEC":12}[$m[0:3]] end;
            def _zone($z):
              if $z == null or $z == "" then 0
              else
                ($z | if test("^(UTC|GMT|UT)[+-]") then sub("^(UTC|GMT|UT)"; "") else . end) as $z
                | if ($z | test("^[+-][0-9]{1,2}(:?[0-9]{2})?$")) then
                    ($z | capture("^(?<sg>[+-])(?<h>[0-9]{1,2}):?(?<m>[0-9]{2})?$")) as $o
                    | (if $o.sg == "-" then -1 else 1 end)
                      * (($o.h | tonumber) * 3600 + (($o.m // "0") | tonumber) * 60)
                  else
                    {"Z":0,"UTC":0,"GMT":0,"UT":0,"EST":-18000,"EDT":-14400,"CST":-21600,
                     "CDT":-18000,"MST":-25200,"MDT":-21600,"PST":-28800,"PDT":-25200}[$z]
                  end
              end;
            def _ms($c):
              ($c.y | tonumber | if . < 100 then (if . < 70 then . + 2000 else . + 1900 end) else . end) as $y
              | ($c.mo | _n) as $mo
              | ($c.d | tonumber) as $d
              | (($c.h // "0") | tonumber) as $h
              | (($c.mi // "0") | tonumber) as $mi
              | (($c.s // "0") | tonumber) as $s
              | _zone($c.z) as $off
              | if $mo == null or $off == null or $mo < 1 or $mo > 12 or $d < 1 or $d > 31
                   or $h > 23 or $mi > 59 or $s > 60 then null
                else
                  ($y - (if $mo <= 2 then 1 else 0 end)) as $yy
                  | ($yy / 400 | floor) as $era
                  | ($yy - $era * 400) as $yoe
                  | (((153 * ($mo + (if $mo > 2 then -3 else 9 end)) + 2) / 5 | floor) + $d - 1) as $doy
                  | ($yoe * 365 + ($yoe / 4 | floor) - ($yoe / 100 | floor) + $doy) as $doe
                  | ($era * 146097 + $doe - 719468) as $days
                  | ($days * 86400 + $h * 3600 + $mi * 60 + $s - $off) * 1000 + _frac_ms($c.f)
                end;
            def _str($raw):
              ($raw | ascii_upcase | sub("\\s*\\([^)]*\\)\\s*$"; "") | sub("^\\s+"; "") | sub("\\s+$"; "")) as $s
              | "(?<z>Z|(?:UTC|GMT|UT)?[+-][0-9]{1,2}(?::?[0-9]{2})?|[A-Z]{1,5})" as $Z
              | "(?<h>[0-9]{1,2}):(?<mi>[0-9]{2})(?::(?<s>[0-9]{2}))?(?:[.,](?<f>[0-9]+))?" as $T
              | if $s == "" then null
                elif ($s | test("^-?[0-9]+$")) then _digits_ms($s)
                elif ($s | test("^[0-9]+\\.[0-9]+$")) then
                  ($s | split(".")) as $p
                  | if ($p[0] | length) <= 11 then _digits_ms($p[0]) + _frac_ms($p[1])
                    else _digits_ms($p[0]) end
                elif ($s | test("^/DATE\\(-?[0-9]+([+-][0-9]{4})?\\)/$")) then
                  ($s | capture("(?<ms>-?[0-9]+)").ms | tonumber)
                else
                  first(
                    ($s | capture("^(?<y>[0-9]{4})[-/](?<mo>[0-9]{1,2})[-/](?<d>[0-9]{1,2})(?:[T ]+" + $T + ")?\\s*" + $Z + "?(?:\\s+[A-Z]{2,5})?$") | _ms(.)),
                    ($s | capture("^(?<y>[0-9]{4})(?<mo>[0-9]{2})(?<d>[0-9]{2})T(?<h>[0-9]{2})(?<mi>[0-9]{2})(?<s>[0-9]{2})(?:[.,](?<f>[0-9]+))?" + $Z + "?$") | _ms(.)),
                    ($s | capture("^(?:[A-Z]+,?\\s+)?(?<d>[0-9]{1,2})[ -](?<mon>[A-Z]{3,9})[ -](?<y>[0-9]{2,4})\\s+" + $T + "\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?:[A-Z]+,?\\s+)?(?<mon>[A-Z]{3,9})\\.?\\s+(?<d>[0-9]{1,2}),?\\s+(?<y>[0-9]{4})(?:,?\\s+" + $T + ")?\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?:[A-Z]+\\s+)?(?<mon>[A-Z]{3,9})\\s+(?<d>[0-9]{1,2})\\s+" + $T + "\\s+(?:" + $Z + "\\s+)?(?<y>[0-9]{4})$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?<d>[0-9]{1,2})/(?<mon>[A-Z]{3})/(?<y>[0-9]{4}):" + $T + "\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.))
                  ) // null
                end;
            if $ts == null then null
            elif ($ts | type) == "number" then _num_ms($ts)
            elif ($ts | type) == "string" then _str($ts)
            elif ($ts | type) == "object" then
              if   $ts["$date"] != null then to_epoch_ms($ts["$date"])
              elif $ts["$numberLong"] != null then to_epoch_ms($ts["$numberLong"])
              elif $ts.seconds != null then
                ($ts.seconds | tostring | tonumber) * 1000
                + ((($ts.nanos // 0) | tostring | tonumber) / 1000000 | floor)
              else null end
            else null end;

          . as $r

          # Region is not a top-level field on the record; derive it from the
          # ARN (arn:aws:ec2:<region>:<account>:security-group/<id>).
          | ( ($r.SecurityGroupArn // "") | split(":") ) as $arn
          | ( if ($arn | length) > 3 and ($arn[3] != "") then $arn[3] else null end ) as $region

          # Count rules that expose the group to the whole internet
          # (0.0.0.0/0 or ::/0 on any ingress rule) — surfaced in `message`
          # so a reader sees the exposure without parsing every rule.
          | ( ($r.IpPermissions // [])
              | map( ( (.IpRanges   // []) | map(.CidrIp   == "0.0.0.0/0") | any )
                     or ( (.Ipv6Ranges // []) | map(.CidrIpv6 == "::/0")     | any ) )
              | map(select(.)) | length ) as $world_open_ingress

          | {
              # --- Classification (REQUIRED) ---
              category_uid: 5,
              class_uid:    5023,
              type_uid:     502302,
              activity_id:  2,
              activity_name: "Collect",
              severity_id:  1,
              severity:     "Informational",

              # --- Time (REQUIRED) ---
              time: (now * 1000 | floor),

              # --- Metadata (REQUIRED) ---
              metadata: {
                "profiles": ["cloud", "osint"],
                version: "1.9.0",
                product: {
                  vendor_name: "AWS",
                  name: "Amazon EC2"
                }
              },

              # --- OSINT (REQUIRED array; no threat-intel indicators on an
              #     inventory snapshot, so an empty array) ---
              osint: [],

              # --- Recommended ---
              message: ( "Security group \($r.GroupName // $r.GroupId) "
                         + "(\($r.GroupId)) — "
                         + "\(($r.IpPermissions // []) | length) ingress / "
                         + "\(($r.IpPermissionsEgress // []) | length) egress rule(s)"
                         + ( if $world_open_ingress > 0
                             then "; \($world_open_ingress) rule(s) open to 0.0.0.0/0 or ::/0"
                             else "" end ) ),
              status_id: 1,
              status: "Success",
              region: $region,

              cloud: {
                provider: "AWS",
                region: $region,
                account: {
                  uid: $r.OwnerId,
                  type: "AWS Account",
                  type_id: 10
                }
              },

              resources: [
                {
                  uid: ($r.SecurityGroupArn // $r.GroupId),
                  name: $r.GroupName,
                  type: "AWS::EC2::SecurityGroup",
                  region: $region,
                  owner: { uid: $r.OwnerId },
                  labels: ( ($r.Tags // []) | map("\(.Key)=\(.Value)") ),
                  namespace: $r.VpcId
                }
              ],

              # --- Fields with no clean OCSF home kept for investigation ---
              unmapped: {
                group_id: $r.GroupId,
                description: $r.Description,
                vpc_id: $r.VpcId,
                ingress_rules: (($r.IpPermissions // []) | tostring),
                egress_rules: (($r.IpPermissionsEgress // []) | tostring),
                world_open_ingress_rules: $world_open_ingress
              },

              raw_data: ($r | tostring)
            }

          # Drop nulls / empty containers so the event stays compact while the
          # required objects (metadata, osint, etc.) always survive.
          | walk(
              if type == "object" then
                with_entries(select(.value != null and .value != {} and .value != []))
              elif type == "array" then
                map(select(. != null))
              else . end
            )
          # osint is a REQUIRED array but legitimately empty here; the prune
          # above strips empty arrays, so restore it as the final step.
          | .osint = (.osint // [])
