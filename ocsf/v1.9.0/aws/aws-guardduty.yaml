name: "AWS GuardDuty Findings to OCSF v1.9.0"
description: "Transforms Amazon GuardDuty finding records into the OCSF v1.9.0 Detection Finding (2004) class."
# author is ALWAYS "Monad" — never a person. You are a contributor.
author: "Monad"
contributors:
  - "https://github.com/behobu"
inputs:
  - "aws-guardduty"
tags:
  - "v1.9.0"
  - "ocsf"
  - "aws"
  - "findings"
config:
  operations:
    - operation: "jq"
      arguments:
        key: ""
        query: |
          # ---------------------------------------------------------------
          # OCSF Detection Finding (class_uid=2004) — v1.9.0
          # Input: one Amazon GuardDuty finding record per invocation.
          # ---------------------------------------------------------------


          # GuardDuty severity (float 0-8.9) -> OCSF severity_id (1-6)
          def to_epoch_ms($ts):
            def _n: if . == null then null else tonumber end;
            def _num_ms($n):
              if   $n >= 1e17 then ($n / 1000000 | floor)
              elif $n >= 1e14 then ($n / 1000 | floor)
              elif $n >= 1e11 then ($n | floor)
              else ($n * 1000 + 0.001 | floor) end;
            def _digits_ms($d):
              ($d | ltrimstr("-") | length) as $l
              | if   $l >= 18 then ($d[0:-6] | tonumber)
                elif $l >= 15 then ($d[0:-3] | tonumber)
                elif $l >= 12 then ($d | tonumber)
                else ($d | tonumber) * 1000 end;
            def _frac_ms($f): if $f == null then 0 else (($f + "000")[0:3] | tonumber) end;
            def _mon($m):
              if $m == null then null
              else {"JAN":1,"FEB":2,"MAR":3,"APR":4,"MAY":5,"JUN":6,
                    "JUL":7,"AUG":8,"SEP":9,"OCT":10,"NOV":11,"DEC":12}[$m[0:3]] end;
            def _zone($z):
              if $z == null or $z == "" then 0
              else
                ($z | if test("^(UTC|GMT|UT)[+-]") then sub("^(UTC|GMT|UT)"; "") else . end) as $z
                | if ($z | test("^[+-][0-9]{1,2}(:?[0-9]{2})?$")) then
                    ($z | capture("^(?<sg>[+-])(?<h>[0-9]{1,2}):?(?<m>[0-9]{2})?$")) as $o
                    | (if $o.sg == "-" then -1 else 1 end)
                      * (($o.h | tonumber) * 3600 + (($o.m // "0") | tonumber) * 60)
                  else
                    {"Z":0,"UTC":0,"GMT":0,"UT":0,"EST":-18000,"EDT":-14400,"CST":-21600,
                     "CDT":-18000,"MST":-25200,"MDT":-21600,"PST":-28800,"PDT":-25200}[$z]
                  end
              end;
            def _ms($c):
              ($c.y | tonumber | if . < 100 then (if . < 70 then . + 2000 else . + 1900 end) else . end) as $y
              | ($c.mo | _n) as $mo
              | ($c.d | tonumber) as $d
              | (($c.h // "0") | tonumber) as $h
              | (($c.mi // "0") | tonumber) as $mi
              | (($c.s // "0") | tonumber) as $s
              | _zone($c.z) as $off
              | if $mo == null or $off == null or $mo < 1 or $mo > 12 or $d < 1 or $d > 31
                   or $h > 23 or $mi > 59 or $s > 60 then null
                else
                  ($y - (if $mo <= 2 then 1 else 0 end)) as $yy
                  | ($yy / 400 | floor) as $era
                  | ($yy - $era * 400) as $yoe
                  | (((153 * ($mo + (if $mo > 2 then -3 else 9 end)) + 2) / 5 | floor) + $d - 1) as $doy
                  | ($yoe * 365 + ($yoe / 4 | floor) - ($yoe / 100 | floor) + $doy) as $doe
                  | ($era * 146097 + $doe - 719468) as $days
                  | ($days * 86400 + $h * 3600 + $mi * 60 + $s - $off) * 1000 + _frac_ms($c.f)
                end;
            def _str($raw):
              ($raw | ascii_upcase | sub("\\s*\\([^)]*\\)\\s*$"; "") | sub("^\\s+"; "") | sub("\\s+$"; "")) as $s
              | "(?<z>Z|(?:UTC|GMT|UT)?[+-][0-9]{1,2}(?::?[0-9]{2})?|[A-Z]{1,5})" as $Z
              | "(?<h>[0-9]{1,2}):(?<mi>[0-9]{2})(?::(?<s>[0-9]{2}))?(?:[.,](?<f>[0-9]+))?" as $T
              | if $s == "" then null
                elif ($s | test("^-?[0-9]+$")) then _digits_ms($s)
                elif ($s | test("^[0-9]+\\.[0-9]+$")) then
                  ($s | split(".")) as $p
                  | if ($p[0] | length) <= 11 then _digits_ms($p[0]) + _frac_ms($p[1])
                    else _digits_ms($p[0]) end
                elif ($s | test("^/DATE\\(-?[0-9]+([+-][0-9]{4})?\\)/$")) then
                  ($s | capture("(?<ms>-?[0-9]+)").ms | tonumber)
                else
                  first(
                    ($s | capture("^(?<y>[0-9]{4})[-/](?<mo>[0-9]{1,2})[-/](?<d>[0-9]{1,2})(?:[T ]+" + $T + ")?\\s*" + $Z + "?(?:\\s+[A-Z]{2,5})?$") | _ms(.)),
                    ($s | capture("^(?<y>[0-9]{4})(?<mo>[0-9]{2})(?<d>[0-9]{2})T(?<h>[0-9]{2})(?<mi>[0-9]{2})(?<s>[0-9]{2})(?:[.,](?<f>[0-9]+))?" + $Z + "?$") | _ms(.)),
                    ($s | capture("^(?:[A-Z]+,?\\s+)?(?<d>[0-9]{1,2})[ -](?<mon>[A-Z]{3,9})[ -](?<y>[0-9]{2,4})\\s+" + $T + "\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?:[A-Z]+,?\\s+)?(?<mon>[A-Z]{3,9})\\.?\\s+(?<d>[0-9]{1,2}),?\\s+(?<y>[0-9]{4})(?:,?\\s+" + $T + ")?\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?:[A-Z]+\\s+)?(?<mon>[A-Z]{3,9})\\s+(?<d>[0-9]{1,2})\\s+" + $T + "\\s+(?:" + $Z + "\\s+)?(?<y>[0-9]{4})$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?<d>[0-9]{1,2})/(?<mon>[A-Z]{3})/(?<y>[0-9]{4}):" + $T + "\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.))
                  ) // null
                end;
            if $ts == null then null
            elif ($ts | type) == "number" then _num_ms($ts)
            elif ($ts | type) == "string" then _str($ts)
            elif ($ts | type) == "object" then
              if   $ts["$date"] != null then to_epoch_ms($ts["$date"])
              elif $ts["$numberLong"] != null then to_epoch_ms($ts["$numberLong"])
              elif $ts.seconds != null then
                ($ts.seconds | tostring | tonumber) * 1000
                + ((($ts.nanos // 0) | tostring | tonumber) / 1000000 | floor)
              else null end
            else null end;

          def sev_id($s):
            if $s == null then 0
            elif $s < 1 then 1        # Informational
            elif $s < 4 then 2        # Low
            elif $s < 7 then 3        # Medium
            elif $s < 9 then 4        # High
            else 5 end;               # Critical

          . as $r
          | ($r.service // {}) as $svc
          | ($svc.action // {}) as $act
          | (($act.networkConnectionAction // {}).remoteIpDetails // {}) as $remote
          | ($r.resource // {}) as $res
          | (($res.instanceDetails // {}).networkInterfaces[0] // {}) as $nic
          | ( if ($r.updatedAt != null and $r.updatedAt != $r.createdAt) then 2 else 1 end ) as $activity
          | ($remote.ipAddressV4 // $r.arn) as $osint_val
          | {
              # --- Classification (REQUIRED for every OCSF event) ---
              "category_uid": 2,
              "class_uid":    2004,
              "activity_id":  $activity,
              "type_uid":     (2004 * 100 + $activity),
              "severity_id":  sev_id($r.severity),

              # --- Time (REQUIRED) ---
              "time": to_epoch_ms($r.updatedAt // $r.createdAt),
              "start_time": to_epoch_ms($svc.eventFirstSeen),
              "end_time":   to_epoch_ms($svc.eventLastSeen),

              # --- Metadata (REQUIRED) ---
              "metadata": {
                "profiles": ["cloud", "osint"],
                "version": "1.9.0",
                "uid": $r.id,
                "product": {
                  "vendor_name": "AWS",
                  "name": "Amazon GuardDuty",
                  "feature": { "name": ($svc.serviceName // "guardduty") }
                }
              },

              # --- Cloud (REQUIRED on Detection Finding) ---
              "cloud": {
                "provider": "AWS",
                "region": $r.region,
                "account": { "uid": $r.accountId, "type_id": 10 },
                "zone": (($res.instanceDetails // {}).availabilityZone)
              },

              # --- OSINT (REQUIRED on Detection Finding) ---
              "osint": [
                { "type_id": 1, "value": $osint_val }
              ],

              # --- Finding info (REQUIRED) ---
              "finding_info": {
                "uid": $r.id,
                "title": $r.title,
                "desc": $r.description,
                "types": [ $r.type ],
                "created_time": to_epoch_ms($r.createdAt),
                "first_seen_time": to_epoch_ms($svc.eventFirstSeen),
                "last_seen_time": to_epoch_ms($svc.eventLastSeen),
                "src_url": ("https://console.aws.amazon.com/guardduty/home?region=" + ($r.region // "") + "#/findings?fId=" + ($r.id // ""))
              },

              # --- Recommended fields ---
              "status_id": (if ($svc.archived == true) then 4 else 1 end),
              "is_alert": true,
              "confidence_id": 0,
              "count": $svc.count,
              "message": $r.description,
              "observables": (
                [ { "name": "finding_info.uid", "type_id": 8, "value": $r.id },
                  { "name": "cloud.account.uid", "type_id": 35, "value": $r.accountId },
                  (if $remote.ipAddressV4 then { "name": "device.ip", "type_id": 2, "value": $remote.ipAddressV4 } else empty end)
                ]
              ),
              "resources": [
                {
                  "type": ($res.resourceType),
                  "uid": (($res.instanceDetails // {}).instanceId),
                  "cloud_partition": $r.partition,
                  "region": $r.region
                }
              ],

              # --- Fields with no clean OCSF home ---
              "unmapped": {
                "action": (if ((($act.networkConnectionAction // {}).blocked) == true) then "Denied" else "Allowed" end),
                "disposition": (if ((($act.networkConnectionAction // {}).blocked) == true) then "Blocked" else "Allowed" end),
                "priority": (
                  if $r.severity == null then "Unknown"
                  elif $r.severity < 4 then "Low"
                  elif $r.severity < 7 then "Medium"
                  elif $r.severity < 9 then "High"
                  else "Critical" end
                ),
                "actionType": ($act.actionType),
                "connectionDirection": (($act.networkConnectionAction // {}).connectionDirection),
                "protocol": (($act.networkConnectionAction // {}).protocol),
                "blocked": (($act.networkConnectionAction // {}).blocked),
                "remoteIp": ($remote.ipAddressV4),
                "remoteCountry": (($remote.country // {}).countryName),
                "remoteCity": (($remote.city // {}).cityName),
                "remoteAsnOrg": (($remote.organization // {}).asnOrg),
                "localPort": ((($act.networkConnectionAction // {}).localPortDetails // {}).port),
                "remotePort": ((($act.networkConnectionAction // {}).remotePortDetails // {}).port),
                "privateIp": ($nic.privateIpAddress),
                "publicIp": ($nic.publicIp),
                "vpcId": ($nic.vpcId),
                "subnetId": ($nic.subnetId),
                "instanceType": (($res.instanceDetails // {}).instanceType),
                "detectorId": ($svc.detectorId),
                "resourceRole": ($svc.resourceRole)
              },

              # --- Original record for audit / debugging ---
              "raw_data": (. | tostring)
            }
          | walk(if type == "object" then with_entries(select(.value != null and .value != "" and .value != {} and .value != [])) else . end)
