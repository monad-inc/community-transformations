name: "AWS Config Resource Evaluations to OCSF v1.9.0"
description: "Transforms AWS Config resource compliance evaluation results (EvaluationResult) into the OCSF v1.9.0 Compliance Finding (2003) class."
author: "Monad"
contributors:
  - "https://github.com/behobu"
inputs:
  - "aws-resource-evaluations"
tags:
  - "v1.9.0"
  - "ocsf"
  - "aws"
  - "findings"
config:
  operations:
    - operation: "jq"
      arguments:
        key: ""
        query: |
          # ---------------------------------------------------------------
          # OCSF Compliance Finding (class_uid=2003) — v1.9.0
          # Input: one AWS Config EvaluationResult record per invocation
          #   (as returned by GetComplianceDetailsByConfigRule /
          #   the aws-resource-evaluations connector).
          #
          # Field mappings:
          #   .ComplianceType                    -> compliance.status / severity_id / status_id
          #   qualifier.ConfigRuleName           -> compliance.control / finding_info.title
          #   qualifier.ResourceType/ResourceId  -> resource.type / resource.uid+name
          #   .ResultRecordedTime                -> time
          #   .Annotation                        -> message / finding_info.desc / status_detail
          #   identifier.ResourceEvaluationId    -> finding_info.uid
          #   .AwsAccountId / .AwsRegion         -> cloud.account.uid / cloud.region
          # ---------------------------------------------------------------


          def to_epoch_ms($ts):
            def _n: if . == null then null else tonumber end;
            def _num_ms($n):
              if   $n >= 1e17 then ($n / 1000000 | floor)
              elif $n >= 1e14 then ($n / 1000 | floor)
              elif $n >= 1e11 then ($n | floor)
              else ($n * 1000 + 0.001 | floor) end;
            def _digits_ms($d):
              ($d | ltrimstr("-") | length) as $l
              | if   $l >= 18 then ($d[0:-6] | tonumber)
                elif $l >= 15 then ($d[0:-3] | tonumber)
                elif $l >= 12 then ($d | tonumber)
                else ($d | tonumber) * 1000 end;
            def _frac_ms($f): if $f == null then 0 else (($f + "000")[0:3] | tonumber) end;
            def _mon($m):
              if $m == null then null
              else {"JAN":1,"FEB":2,"MAR":3,"APR":4,"MAY":5,"JUN":6,
                    "JUL":7,"AUG":8,"SEP":9,"OCT":10,"NOV":11,"DEC":12}[$m[0:3]] end;
            def _zone($z):
              if $z == null or $z == "" then 0
              else
                ($z | if test("^(UTC|GMT|UT)[+-]") then sub("^(UTC|GMT|UT)"; "") else . end) as $z
                | if ($z | test("^[+-][0-9]{1,2}(:?[0-9]{2})?$")) then
                    ($z | capture("^(?<sg>[+-])(?<h>[0-9]{1,2}):?(?<m>[0-9]{2})?$")) as $o
                    | (if $o.sg == "-" then -1 else 1 end)
                      * (($o.h | tonumber) * 3600 + (($o.m // "0") | tonumber) * 60)
                  else
                    {"Z":0,"UTC":0,"GMT":0,"UT":0,"EST":-18000,"EDT":-14400,"CST":-21600,
                     "CDT":-18000,"MST":-25200,"MDT":-21600,"PST":-28800,"PDT":-25200}[$z]
                  end
              end;
            def _ms($c):
              ($c.y | tonumber | if . < 100 then (if . < 70 then . + 2000 else . + 1900 end) else . end) as $y
              | ($c.mo | _n) as $mo
              | ($c.d | tonumber) as $d
              | (($c.h // "0") | tonumber) as $h
              | (($c.mi // "0") | tonumber) as $mi
              | (($c.s // "0") | tonumber) as $s
              | _zone($c.z) as $off
              | if $mo == null or $off == null or $mo < 1 or $mo > 12 or $d < 1 or $d > 31
                   or $h > 23 or $mi > 59 or $s > 60 then null
                else
                  ($y - (if $mo <= 2 then 1 else 0 end)) as $yy
                  | ($yy / 400 | floor) as $era
                  | ($yy - $era * 400) as $yoe
                  | (((153 * ($mo + (if $mo > 2 then -3 else 9 end)) + 2) / 5 | floor) + $d - 1) as $doy
                  | ($yoe * 365 + ($yoe / 4 | floor) - ($yoe / 100 | floor) + $doy) as $doe
                  | ($era * 146097 + $doe - 719468) as $days
                  | ($days * 86400 + $h * 3600 + $mi * 60 + $s - $off) * 1000 + _frac_ms($c.f)
                end;
            def _str($raw):
              ($raw | ascii_upcase | sub("\\s*\\([^)]*\\)\\s*$"; "") | sub("^\\s+"; "") | sub("\\s+$"; "")) as $s
              | "(?<z>Z|(?:UTC|GMT|UT)?[+-][0-9]{1,2}(?::?[0-9]{2})?|[A-Z]{1,5})" as $Z
              | "(?<h>[0-9]{1,2}):(?<mi>[0-9]{2})(?::(?<s>[0-9]{2}))?(?:[.,](?<f>[0-9]+))?" as $T
              | if $s == "" then null
                elif ($s | test("^-?[0-9]+$")) then _digits_ms($s)
                elif ($s | test("^[0-9]+\\.[0-9]+$")) then
                  ($s | split(".")) as $p
                  | if ($p[0] | length) <= 11 then _digits_ms($p[0]) + _frac_ms($p[1])
                    else _digits_ms($p[0]) end
                elif ($s | test("^/DATE\\(-?[0-9]+([+-][0-9]{4})?\\)/$")) then
                  ($s | capture("(?<ms>-?[0-9]+)").ms | tonumber)
                else
                  first(
                    ($s | capture("^(?<y>[0-9]{4})[-/](?<mo>[0-9]{1,2})[-/](?<d>[0-9]{1,2})(?:[T ]+" + $T + ")?\\s*" + $Z + "?(?:\\s+[A-Z]{2,5})?$") | _ms(.)),
                    ($s | capture("^(?<y>[0-9]{4})(?<mo>[0-9]{2})(?<d>[0-9]{2})T(?<h>[0-9]{2})(?<mi>[0-9]{2})(?<s>[0-9]{2})(?:[.,](?<f>[0-9]+))?" + $Z + "?$") | _ms(.)),
                    ($s | capture("^(?:[A-Z]+,?\\s+)?(?<d>[0-9]{1,2})[ -](?<mon>[A-Z]{3,9})[ -](?<y>[0-9]{2,4})\\s+" + $T + "\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?:[A-Z]+,?\\s+)?(?<mon>[A-Z]{3,9})\\.?\\s+(?<d>[0-9]{1,2}),?\\s+(?<y>[0-9]{4})(?:,?\\s+" + $T + ")?\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?:[A-Z]+\\s+)?(?<mon>[A-Z]{3,9})\\s+(?<d>[0-9]{1,2})\\s+" + $T + "\\s+(?:" + $Z + "\\s+)?(?<y>[0-9]{4})$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?<d>[0-9]{1,2})/(?<mon>[A-Z]{3})/(?<y>[0-9]{4}):" + $T + "\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.))
                  ) // null
                end;
            if $ts == null then null
            elif ($ts | type) == "number" then _num_ms($ts)
            elif ($ts | type) == "string" then _str($ts)
            elif ($ts | type) == "object" then
              if   $ts["$date"] != null then to_epoch_ms($ts["$date"])
              elif $ts["$numberLong"] != null then to_epoch_ms($ts["$numberLong"])
              elif $ts.seconds != null then
                ($ts.seconds | tostring | tonumber) * 1000
                + ((($ts.nanos // 0) | tostring | tonumber) / 1000000 | floor)
              else null end
            else null end;

          def prune:
            walk(if type == "object" then with_entries(select(.value != null and .value != {} and .value != []))
                 elif type == "array" then map(select(. != null and . != {} and . != []))
                 else . end);

          . as $r
          | ( $r.EvaluationResultIdentifier // {} ) as $id
          | ( $id.EvaluationResultQualifier // {} ) as $q
          | ( $r.ComplianceType // "" ) as $ct

          # Compliance status_id: 1=Pass, 2=Warning, 3=Fail, 99=Other, 0=Unknown.
          | ( { "COMPLIANT": 1, "NON_COMPLIANT": 3,
                "NOT_APPLICABLE": 99, "INSUFFICIENT_DATA": 0 }[$ct] // 0 ) as $comp_status_id

          # Finding severity: a NON_COMPLIANT result is a High finding; a
          # passing / N/A result carries no urgency (Informational).
          | ( { "NON_COMPLIANT": 4, "COMPLIANT": 1,
                "NOT_APPLICABLE": 1, "INSUFFICIENT_DATA": 0 }[$ct] // 0 ) as $sev

          # Finding lifecycle status: a compliant resource is Resolved, a
          # non-compliant one is New (open), the rest Unknown.
          | ( { "COMPLIANT": 4, "NON_COMPLIANT": 1 }[$ct] // 0 ) as $status_id

          | {
              category_uid: 2,
              class_uid:    2003,
              type_uid:     200301,
              activity_id:  1,
              severity_id:  $sev,

              time: to_epoch_ms($r.ResultRecordedTime // $id.OrderingTimestamp),

              status_id: $status_id,
              status_detail: $r.Annotation,
              message: $r.Annotation,

              metadata: {
                "profiles": ["cloud", "osint"],
                version: "1.9.0",
                product: {
                  vendor_name: "AWS",
                  name: "AWS Config"
                },
                original_time: ($r.ResultRecordedTime // $id.OrderingTimestamp),
                log_name: "aws-resource-evaluations"
              },

              compliance: {
                control:   $q.ConfigRuleName,
                status:    (if $ct != "" then $ct else null end),
                status_id: $comp_status_id,
                standards: ["AWS Config Managed Rules"],
                status_detail: $r.Annotation
              },

              cloud: {
                provider: "aws",
                region:   $r.AwsRegion,
                account:  { uid: $r.AwsAccountId }
              },

              finding_info: {
                uid:   ($id.ResourceEvaluationId // $r.ResultToken),
                title: ( ($q.ConfigRuleName // "AWS Config rule")
                         + " — " + (if $ct != "" then $ct else "UNKNOWN" end) ),
                desc:  $r.Annotation,
                created_time: to_epoch_ms($id.OrderingTimestamp),
                modified_time: to_epoch_ms($r.ResultRecordedTime)
              },

              resource: {
                uid:  $q.ResourceId,
                name: $q.ResourceId,
                type: $q.ResourceType
              },

              # No threat-intel enrichment on a Config evaluation; the class
              # marks osint required, so emit an explicit empty array.
              osint: [],

              unmapped: {
                EvaluationMode: $q.EvaluationMode,
                ConfigRuleInvokedTime: $r.ConfigRuleInvokedTime,
                ResultToken: $r.ResultToken
              },

              raw_data: ($r | tostring)
            }
          | prune
          | .osint = (.osint // [])
