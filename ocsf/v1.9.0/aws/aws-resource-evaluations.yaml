name: "AWS Config Resource Evaluations to OCSF v1.9.0"
description: "Transforms AWS Config resource evaluation records (ListResourceEvaluations) into the OCSF v1.9.0 Scan Activity (6007) class as scan Started events."
author: "Monad"
contributors:
  - "https://github.com/behobu"
inputs:
  - "aws-resource-evaluations"
tags:
  - "v1.9.0"
  - "ocsf"
  - "aws"
  - "application activity"
  - "scan activity"
config:
  operations:
    - operation: "jq"
      arguments:
        key: ""
        query: |
          # ---------------------------------------------------------------
          # OCSF Scan Activity (class_uid=6007) — v1.9.0
          # Input: one AWS Config resource evaluation per invocation, as
          # emitted by the Monad aws-resource-evaluations connector: a
          # json.Marshal of the AWS SDK for Go v2 configservice
          # types.ResourceEvaluation returned by ListResourceEvaluations.
          # The SDK struct carries no json tags, so the record is exactly:
          #   { "EvaluationMode": "PROACTIVE" | "DETECTIVE",
          #     "EvaluationStartTimestamp": "<RFC 3339, ns precision>",
          #     "ResourceEvaluationId": "<id>" }
          # It carries no compliance result, rule, resource, account, or
          # region (those come only from GetResourceEvaluationSummary, which
          # the connector does not call), so each record is modelled as the
          # start of an evaluation (scan) job rather than a finding.
          # A camelCase record is normalized to PascalCase first.
          #
          # Field mappings:
          #   ResourceEvaluationId     -> scan.uid, metadata.uid
          #   EvaluationMode           -> scan.type / scan.name (scan.type_id 99 Other)
          #   EvaluationStartTimestamp -> time, start_time
          #   activity_id              -> 1 (Started)
          # ---------------------------------------------------------------

          # OCSF timestamp_t is epoch MILLISECONDS. Use this helper for every
          # time / *_time field; it accepts epoch s/ms/us/ns numbers, numeric
          # strings, {seconds,nanos}, and ISO 8601 with any UTC offset, and
          # returns null (not an error) on unparseable input.
          def to_epoch_ms($ts):
            def _num_ms($n):
              if   $n >= 1e17 then ($n / 1000000 | floor)
              elif $n >= 1e14 then ($n / 1000 | floor)
              elif $n >= 1e11 then ($n | floor)
              else ($n * 1000 | floor) end;
            if $ts == null or $ts == "" then null
            elif ($ts | type) == "number" then _num_ms($ts)
            elif ($ts | type) == "object" then
              (if ($ts.seconds // null) == null then null
               else ($ts.seconds * 1000 + ((($ts.nanos // 0) / 1000000) | floor)) end)
            elif ($ts | type) == "string" then
              if ($ts | test("^-?[0-9]+(\\.[0-9]+)?$")) then _num_ms($ts | tonumber)
              else
                ([$ts | ascii_upcase | capture("^(?<d>[0-9]{4}-[0-9]{2}-[0-9]{2})(?:[T ](?<t>[0-9]{2}:[0-9]{2}(?::[0-9]{2})?)(?:[.,](?<f>[0-9]+))?)? ?(?<z>Z|UTC|[+-][0-9]{2}(?::?[0-9]{2})?)?$")] | first) as $m
                | if $m == null then null
                  else
                    (($m.t // "00:00:00") | if length == 5 then . + ":00" else . end) as $t
                    | (($m.z // "Z") | if . == "Z" or . == "UTC" then 0
                        else (.[1:] | gsub(":"; "")) as $o
                          | ((if (.[0:1]) == "-" then -1 else 1 end)
                             * (($o[0:2] | tonumber) * 3600 + ((if ($o | length) >= 4 then $o[2:4] else "00" end) | tonumber) * 60))
                        end) as $off
                    | ((($m.d + "T" + $t + "Z") | fromdateiso8601) - $off) * 1000
                      + (((($m.f // "") + "000")[0:3]) | tonumber)
                  end
              end
            else null end;

          def prune:
            walk(
              if type == "object" then
                with_entries(select(.value != null and .value != "" and .value != {} and .value != []))
              elif type == "array" then
                map(select(. != null))
              else . end
            );

          # camelCase -> PascalCase keys (only when the record is not already
          # in the connector's PascalCase shape).
          def pascal_keys:
            with_entries(.key |= ((.[0:1] | ascii_upcase) + .[1:]));

          (if (has("ResourceEvaluationId") | not) and has("resourceEvaluationId") then pascal_keys else . end) as $r
          | ($r.EvaluationMode // "") as $mode
          | ( { "PROACTIVE": "Proactive", "DETECTIVE": "Detective" }[$mode]
              // (if $mode != "" then $mode else null end) ) as $mode_label
          | to_epoch_ms($r.EvaluationStartTimestamp) as $start

          | {
              category_uid: 6,
              class_uid:    6007,
              type_uid:     (6007 * 100 + 1),
              activity_id:  1,
              # A scan start carries no risk of its own.
              severity_id:  1,

              time:       ($start // (now * 1000 | floor)),
              start_time: $start,

              metadata: {
                version: "1.9.0",
                uid: $r.ResourceEvaluationId,
                product: {
                  vendor_name: "AWS",
                  name: "AWS Config",
                  feature: { name: "Resource Evaluations" }
                },
                log_name: "aws-resource-evaluations"
              },

              # OCSF scan.type_id has no proactive/detective value: use
              # 99 Other with the mode in scan.type (0 Unknown when absent).
              scan: {
                uid:     $r.ResourceEvaluationId,
                name:    ("AWS Config " + (if $mode_label != null then ($mode_label | ascii_downcase) + " " else "" end)
                          + "resource evaluation"),
                type_id: (if $mode_label != null then 99 else 0 end),
                type:    $mode_label
              },

              message: ("AWS Config " + (if $mode_label != null then ($mode_label | ascii_downcase) + " " else "" end)
                        + "resource evaluation " + ($r.ResourceEvaluationId // "(no id)") + " started"),

              raw_data: (. | tostring)
            }
          | prune
