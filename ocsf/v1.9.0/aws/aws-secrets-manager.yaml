name: "AWS Secrets Manager Secret Inventory to OCSF v1.9.0"
description: "Transforms AWS Secrets Manager secret inventory records (ListSecrets/DescribeSecret metadata) into the OCSF v1.9.0 Cloud Resources Inventory Info (class_uid 5023) class."
# author is ALWAYS "Monad" — never a person. You are a contributor.
author: "Monad"
contributors:
  - "https://github.com/behobu"
inputs:
  - "aws-secrets-manager"
tags:
  - "v1.9.0"
  - "ocsf"
  - "aws"
  - "discovery"
config:
  operations:
    - operation: "jq"
      arguments:
        key: ""
        query: |
          # ---------------------------------------------------------------
          # OCSF Cloud Resources Inventory Info (class_uid=5023) — v1.9.0
          # Input: one AWS Secrets Manager secret-metadata record per
          # invocation, as emitted by the Monad `aws-secrets-manager` input
          # connector (a ListSecrets entry enriched with DescribeSecret).
          # These are proactively collected inventory snapshots, not events,
          # so activity_id=2 (Collect).
          #
          # The class constraint is at_least_one of
          #   [cloud, container, database, databucket, idp, resources, table]
          # — satisfied here by `cloud` and `resources`. The class also makes
          # `osint` required; a secret is not a threat indicator, so it is
          # emitted with type_id 0 (Unknown / no related indicator) and the
          # ARN as its value to satisfy the schema honestly.
          # ---------------------------------------------------------------

          # Secrets Manager timestamps arrive as epoch SECONDS (sometimes
          # fractional, e.g. 1722384000.729). OCSF `time`/`*_time` are integer
          # epochs — floor to drop the fraction. Guard non-numbers.

          def to_epoch_ms($ts):
            def _n: if . == null then null else tonumber end;
            def _num_ms($n):
              if   $n >= 1e17 then ($n / 1000000 | floor)
              elif $n >= 1e14 then ($n / 1000 | floor)
              elif $n >= 1e11 then ($n | floor)
              else ($n * 1000 + 0.001 | floor) end;
            def _digits_ms($d):
              ($d | ltrimstr("-") | length) as $l
              | if   $l >= 18 then ($d[0:-6] | tonumber)
                elif $l >= 15 then ($d[0:-3] | tonumber)
                elif $l >= 12 then ($d | tonumber)
                else ($d | tonumber) * 1000 end;
            def _frac_ms($f): if $f == null then 0 else (($f + "000")[0:3] | tonumber) end;
            def _mon($m):
              if $m == null then null
              else {"JAN":1,"FEB":2,"MAR":3,"APR":4,"MAY":5,"JUN":6,
                    "JUL":7,"AUG":8,"SEP":9,"OCT":10,"NOV":11,"DEC":12}[$m[0:3]] end;
            def _zone($z):
              if $z == null or $z == "" then 0
              else
                ($z | if test("^(UTC|GMT|UT)[+-]") then sub("^(UTC|GMT|UT)"; "") else . end) as $z
                | if ($z | test("^[+-][0-9]{1,2}(:?[0-9]{2})?$")) then
                    ($z | capture("^(?<sg>[+-])(?<h>[0-9]{1,2}):?(?<m>[0-9]{2})?$")) as $o
                    | (if $o.sg == "-" then -1 else 1 end)
                      * (($o.h | tonumber) * 3600 + (($o.m // "0") | tonumber) * 60)
                  else
                    {"Z":0,"UTC":0,"GMT":0,"UT":0,"EST":-18000,"EDT":-14400,"CST":-21600,
                     "CDT":-18000,"MST":-25200,"MDT":-21600,"PST":-28800,"PDT":-25200}[$z]
                  end
              end;
            def _ms($c):
              ($c.y | tonumber | if . < 100 then (if . < 70 then . + 2000 else . + 1900 end) else . end) as $y
              | ($c.mo | _n) as $mo
              | ($c.d | tonumber) as $d
              | (($c.h // "0") | tonumber) as $h
              | (($c.mi // "0") | tonumber) as $mi
              | (($c.s // "0") | tonumber) as $s
              | _zone($c.z) as $off
              | if $mo == null or $off == null or $mo < 1 or $mo > 12 or $d < 1 or $d > 31
                   or $h > 23 or $mi > 59 or $s > 60 then null
                else
                  ($y - (if $mo <= 2 then 1 else 0 end)) as $yy
                  | ($yy / 400 | floor) as $era
                  | ($yy - $era * 400) as $yoe
                  | (((153 * ($mo + (if $mo > 2 then -3 else 9 end)) + 2) / 5 | floor) + $d - 1) as $doy
                  | ($yoe * 365 + ($yoe / 4 | floor) - ($yoe / 100 | floor) + $doy) as $doe
                  | ($era * 146097 + $doe - 719468) as $days
                  | ($days * 86400 + $h * 3600 + $mi * 60 + $s - $off) * 1000 + _frac_ms($c.f)
                end;
            def _str($raw):
              ($raw | ascii_upcase | sub("\\s*\\([^)]*\\)\\s*$"; "") | sub("^\\s+"; "") | sub("\\s+$"; "")) as $s
              | "(?<z>Z|(?:UTC|GMT|UT)?[+-][0-9]{1,2}(?::?[0-9]{2})?|[A-Z]{1,5})" as $Z
              | "(?<h>[0-9]{1,2}):(?<mi>[0-9]{2})(?::(?<s>[0-9]{2}))?(?:[.,](?<f>[0-9]+))?" as $T
              | if $s == "" then null
                elif ($s | test("^-?[0-9]+$")) then _digits_ms($s)
                elif ($s | test("^[0-9]+\\.[0-9]+$")) then
                  ($s | split(".")) as $p
                  | if ($p[0] | length) <= 11 then _digits_ms($p[0]) + _frac_ms($p[1])
                    else _digits_ms($p[0]) end
                elif ($s | test("^/DATE\\(-?[0-9]+([+-][0-9]{4})?\\)/$")) then
                  ($s | capture("(?<ms>-?[0-9]+)").ms | tonumber)
                else
                  first(
                    ($s | capture("^(?<y>[0-9]{4})[-/](?<mo>[0-9]{1,2})[-/](?<d>[0-9]{1,2})(?:[T ]+" + $T + ")?\\s*" + $Z + "?(?:\\s+[A-Z]{2,5})?$") | _ms(.)),
                    ($s | capture("^(?<y>[0-9]{4})(?<mo>[0-9]{2})(?<d>[0-9]{2})T(?<h>[0-9]{2})(?<mi>[0-9]{2})(?<s>[0-9]{2})(?:[.,](?<f>[0-9]+))?" + $Z + "?$") | _ms(.)),
                    ($s | capture("^(?:[A-Z]+,?\\s+)?(?<d>[0-9]{1,2})[ -](?<mon>[A-Z]{3,9})[ -](?<y>[0-9]{2,4})\\s+" + $T + "\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?:[A-Z]+,?\\s+)?(?<mon>[A-Z]{3,9})\\.?\\s+(?<d>[0-9]{1,2}),?\\s+(?<y>[0-9]{4})(?:,?\\s+" + $T + ")?\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?:[A-Z]+\\s+)?(?<mon>[A-Z]{3,9})\\s+(?<d>[0-9]{1,2})\\s+" + $T + "\\s+(?:" + $Z + "\\s+)?(?<y>[0-9]{4})$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?<d>[0-9]{1,2})/(?<mon>[A-Z]{3})/(?<y>[0-9]{4}):" + $T + "\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.))
                  ) // null
                end;
            if $ts == null then null
            elif ($ts | type) == "number" then _num_ms($ts)
            elif ($ts | type) == "string" then _str($ts)
            elif ($ts | type) == "object" then
              if   $ts["$date"] != null then to_epoch_ms($ts["$date"])
              elif $ts["$numberLong"] != null then to_epoch_ms($ts["$numberLong"])
              elif $ts.seconds != null then
                ($ts.seconds | tostring | tonumber) * 1000
                + ((($ts.nanos // 0) | tostring | tonumber) / 1000000 | floor)
              else null end
            else null end;

          . as $r
          # Pull the 12-digit account id out of the secret ARN
          # (arn:aws:secretsmanager:<region>:<account>:secret:<name>).
          | ( ($r.ARN // "") | split(":") ) as $arn_parts
          | ( if ($arn_parts | length) > 4 then $arn_parts[4] else null end ) as $account_id

          | {
              # --- Classification (REQUIRED) ---
              "category_uid": 5,
              "class_uid":    5023,
              "activity_id":  2,
              "type_uid":     502302,
              "severity_id":  1,
              "status_id":    1,

              # --- Time (REQUIRED) ---
              "time": ( to_epoch_ms($r.LastChangedDate)
                        // to_epoch_ms($r.CreatedDate) ),

              # --- Metadata (REQUIRED) ---
              "metadata": {
                "profiles": ["cloud", "osint"],
                "version": "1.9.0",
                "product": {
                  "vendor_name": "AWS",
                  "name": "AWS Secrets Manager",
                  "feature": { "name": "Secrets Inventory" }
                }
              },

              # --- OSINT (REQUIRED by class 5023) ---
              # Not a real threat indicator for a secret; type_id 0 = Unknown.
              "osint": [
                {
                  "type_id": 0,
                  "value": ($r.ARN // $r.Name // "unknown")
                }
              ],

              # --- Cloud (constraint at_least_one) ---
              "cloud": {
                "provider": "AWS",
                "region": $r.PrimaryRegion,
                "account": ( if $account_id != null
                             then { "uid": $account_id, "type_id": 10 }
                             else null end )
              },

              # --- Cloud resource inventory (constraint at_least_one) ---
              "resources": [
                {
                  "uid": $r.ARN,
                  "name": $r.Name,
                  "type": "AWS::SecretsManager::Secret",
                  "namespace": $r.OwningService,
                  "region": $r.PrimaryRegion,
                  "cloud_partition": "aws",
                  "created_time": to_epoch_ms($r.CreatedDate),
                  "modified_time": to_epoch_ms($r.LastChangedDate),
                  "labels": ( [
                      ( if ($r.RotationEnabled == true) then "rotation-enabled"
                        elif ($r.RotationEnabled == false) then "rotation-disabled"
                        else empty end ),
                      ( if $r.OwningService != null
                        then "managed-by:" + $r.OwningService else empty end )
                    ] ),
                  "tags": ( ($r.Tags // [])
                            | map({ "name": .Key, "value": .Value }) )
                }
              ],

              # --- Recommended ---
              "message": ( "Secrets Manager secret " + ($r.Name // ($r.ARN // "")) ),

              # --- Source-specific fields with no clean OCSF home ---
              "unmapped": {
                "KmsKeyId": $r.KmsKeyId,
                "RotationEnabled": $r.RotationEnabled,
                "RotationLambdaARN": $r.RotationLambdaARN,
                "RotationRules": $r.RotationRules,
                "LastAccessedDate": $r.LastAccessedDate,
                "LastRotatedDate": $r.LastRotatedDate,
                "NextRotationDate": $r.NextRotationDate,
                "DeletedDate": $r.DeletedDate,
                "SecretVersionsToStages": $r.SecretVersionsToStages
              },

              "raw_data": ($r | tostring)
            }
          # Single recursive prune: drop nulls, empty objects, empty arrays.
          | walk(
              if type == "object" then
                with_entries(select(.value != null and .value != {} and .value != []))
              elif type == "array" then
                map(select(. != null))
              else . end
            )
