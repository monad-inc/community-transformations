name: "GitLab Issues to OCSF v1.9.0"
description: "Transforms GitLab Issues API records into the OCSF v1.9.0 API Activity (6003) class, modeling issue create/update lifecycle as a CRUD API event."
# author is ALWAYS "Monad" — never a person. You are a contributor.
author: "Monad"
contributors:
  - "https://github.com/behobu"
inputs:
  - "gitlab-issues"
tags:
  - "v1.9.0"
  - "ocsf"
  - "gitlab"
  - "application"
config:
  operations:
    - operation: "jq"
      arguments:
        key: ""
        query: |
          # -----------------------------------------------------------------
          # GitLab Issues API record -> OCSF v1.9.0 API Activity (class_uid 6003)
          # One issue record per invocation -> one OCSF API Activity event.
          #
          # A GitLab issue is a tracked work item; its lifecycle (create/update)
          # is modeled here as a CRUD API activity:
          #   created_at == updated_at  -> Create (activity_id 1)
          #   otherwise                 -> Update (activity_id 3)
          #
          # 6003 base-required objects populated: metadata, actor, api, cloud,
          # osint, src_endpoint (osint/cloud are required by this class in 1.9.0).
          # -----------------------------------------------------------------


          # GitLab issue severity -> OCSF severity_id (default Informational)
          def to_epoch_ms($ts):
            def _n: if . == null then null else tonumber end;
            def _num_ms($n):
              if   $n >= 1e17 then ($n / 1000000 | floor)
              elif $n >= 1e14 then ($n / 1000 | floor)
              elif $n >= 1e11 then ($n | floor)
              else ($n * 1000 + 0.001 | floor) end;
            def _digits_ms($d):
              ($d | ltrimstr("-") | length) as $l
              | if   $l >= 18 then ($d[0:-6] | tonumber)
                elif $l >= 15 then ($d[0:-3] | tonumber)
                elif $l >= 12 then ($d | tonumber)
                else ($d | tonumber) * 1000 end;
            def _frac_ms($f): if $f == null then 0 else (($f + "000")[0:3] | tonumber) end;
            def _mon($m):
              if $m == null then null
              else {"JAN":1,"FEB":2,"MAR":3,"APR":4,"MAY":5,"JUN":6,
                    "JUL":7,"AUG":8,"SEP":9,"OCT":10,"NOV":11,"DEC":12}[$m[0:3]] end;
            def _zone($z):
              if $z == null or $z == "" then 0
              else
                ($z | if test("^(UTC|GMT|UT)[+-]") then sub("^(UTC|GMT|UT)"; "") else . end) as $z
                | if ($z | test("^[+-][0-9]{1,2}(:?[0-9]{2})?$")) then
                    ($z | capture("^(?<sg>[+-])(?<h>[0-9]{1,2}):?(?<m>[0-9]{2})?$")) as $o
                    | (if $o.sg == "-" then -1 else 1 end)
                      * (($o.h | tonumber) * 3600 + (($o.m // "0") | tonumber) * 60)
                  else
                    {"Z":0,"UTC":0,"GMT":0,"UT":0,"EST":-18000,"EDT":-14400,"CST":-21600,
                     "CDT":-18000,"MST":-25200,"MDT":-21600,"PST":-28800,"PDT":-25200}[$z]
                  end
              end;
            def _ms($c):
              ($c.y | tonumber | if . < 100 then (if . < 70 then . + 2000 else . + 1900 end) else . end) as $y
              | ($c.mo | _n) as $mo
              | ($c.d | tonumber) as $d
              | (($c.h // "0") | tonumber) as $h
              | (($c.mi // "0") | tonumber) as $mi
              | (($c.s // "0") | tonumber) as $s
              | _zone($c.z) as $off
              | if $mo == null or $off == null or $mo < 1 or $mo > 12 or $d < 1 or $d > 31
                   or $h > 23 or $mi > 59 or $s > 60 then null
                else
                  ($y - (if $mo <= 2 then 1 else 0 end)) as $yy
                  | ($yy / 400 | floor) as $era
                  | ($yy - $era * 400) as $yoe
                  | (((153 * ($mo + (if $mo > 2 then -3 else 9 end)) + 2) / 5 | floor) + $d - 1) as $doy
                  | ($yoe * 365 + ($yoe / 4 | floor) - ($yoe / 100 | floor) + $doy) as $doe
                  | ($era * 146097 + $doe - 719468) as $days
                  | ($days * 86400 + $h * 3600 + $mi * 60 + $s - $off) * 1000 + _frac_ms($c.f)
                end;
            def _str($raw):
              ($raw | ascii_upcase | sub("\\s*\\([^)]*\\)\\s*$"; "") | sub("^\\s+"; "") | sub("\\s+$"; "")) as $s
              | "(?<z>Z|(?:UTC|GMT|UT)?[+-][0-9]{1,2}(?::?[0-9]{2})?|[A-Z]{1,5})" as $Z
              | "(?<h>[0-9]{1,2}):(?<mi>[0-9]{2})(?::(?<s>[0-9]{2}))?(?:[.,](?<f>[0-9]+))?" as $T
              | if $s == "" then null
                elif ($s | test("^-?[0-9]+$")) then _digits_ms($s)
                elif ($s | test("^[0-9]+\\.[0-9]+$")) then
                  ($s | split(".")) as $p
                  | if ($p[0] | length) <= 11 then _digits_ms($p[0]) + _frac_ms($p[1])
                    else _digits_ms($p[0]) end
                elif ($s | test("^/DATE\\(-?[0-9]+([+-][0-9]{4})?\\)/$")) then
                  ($s | capture("(?<ms>-?[0-9]+)").ms | tonumber)
                else
                  first(
                    ($s | capture("^(?<y>[0-9]{4})[-/](?<mo>[0-9]{1,2})[-/](?<d>[0-9]{1,2})(?:[T ]+" + $T + ")?\\s*" + $Z + "?(?:\\s+[A-Z]{2,5})?$") | _ms(.)),
                    ($s | capture("^(?<y>[0-9]{4})(?<mo>[0-9]{2})(?<d>[0-9]{2})T(?<h>[0-9]{2})(?<mi>[0-9]{2})(?<s>[0-9]{2})(?:[.,](?<f>[0-9]+))?" + $Z + "?$") | _ms(.)),
                    ($s | capture("^(?:[A-Z]+,?\\s+)?(?<d>[0-9]{1,2})[ -](?<mon>[A-Z]{3,9})[ -](?<y>[0-9]{2,4})\\s+" + $T + "\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?:[A-Z]+,?\\s+)?(?<mon>[A-Z]{3,9})\\.?\\s+(?<d>[0-9]{1,2}),?\\s+(?<y>[0-9]{4})(?:,?\\s+" + $T + ")?\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?:[A-Z]+\\s+)?(?<mon>[A-Z]{3,9})\\s+(?<d>[0-9]{1,2})\\s+" + $T + "\\s+(?:" + $Z + "\\s+)?(?<y>[0-9]{4})$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?<d>[0-9]{1,2})/(?<mon>[A-Z]{3})/(?<y>[0-9]{4}):" + $T + "\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.))
                  ) // null
                end;
            if $ts == null then null
            elif ($ts | type) == "number" then _num_ms($ts)
            elif ($ts | type) == "string" then _str($ts)
            elif ($ts | type) == "object" then
              if   $ts["$date"] != null then to_epoch_ms($ts["$date"])
              elif $ts["$numberLong"] != null then to_epoch_ms($ts["$numberLong"])
              elif $ts.seconds != null then
                ($ts.seconds | tostring | tonumber) * 1000
                + ((($ts.nanos // 0) | tostring | tonumber) / 1000000 | floor)
              else null end
            else null end;

          def sev_id($s):
            ({ "critical": 5, "high": 4, "medium": 3, "low": 2, "unknown": 1 }
              [($s // "" | ascii_downcase)] // 1);

          . as $r
          | (if ($r.created_at == $r.updated_at) then 1 else 3 end) as $act
          | (if $act == 1 then "issues.create" else "issues.update" end) as $op
          | ($r.author // {}) as $au
          | (($r.assignees // []) | map(.username) | map(select(. != null))) as $assignees
          | ($r.web_url // $r.references.full // "unknown") as $url

          # Actor (required): the issue author performed the activity.
          | ({ user: { type_id: 1,
                       name: $au.username,
                       uid: (if $au.id != null then ($au.id | tostring) else null end),
                       full_name: $au.name,
                       email_addr: null },
               application: { name: "GitLab" } }) as $actor

          # Observables — reference only attributes 6003 actually defines.
          | ([ (if $au.username != null then {name:"actor.user.name", type_id:4, value:$au.username} else empty end),
               (if $au.id != null then {name:"actor.user.uid", type_id:31, value:($au.id|tostring)} else empty end),
               {name:"osint.value", type_id:6, value:$url} ]) as $observables

          | {
              # --- Classification (REQUIRED) ---
              category_uid: 6,
              class_uid:    6003,
              activity_id:  $act,
              type_uid:     (6003 * 100 + $act),
              severity_id:  sev_id($r.severity),

              # --- Time (REQUIRED) ---
              time: to_epoch_ms($r.updated_at // $r.created_at),

              # --- Metadata (REQUIRED) ---
              metadata: {
                version: "1.9.0",
                product: { vendor_name: "GitLab", name: "GitLab Issues" },
                profiles: ["cloud", "osint"],
                uid: (if $r.id != null then ($r.id | tostring) else null end),
                log_name: ($r.issue_type // $r.type // "issue")
              },

              # --- API details (REQUIRED for 6003) ---
              api: { operation: $op, service: { name: "GitLab Issues" } },

              # --- Actor (REQUIRED for 6003) ---
              actor: $actor,

              # --- Cloud (REQUIRED for 6003) ---
              cloud: { provider: "GitLab" },

              # --- OSINT (REQUIRED for 6003) — the issue's canonical URL indicator ---
              osint: [ { value: $url, type_id: 5 } ],

              # --- Source endpoint (REQUIRED for 6003) ---
              src_endpoint: { svc_name: "gitlab-issues",
                              uid: (if $r.project_id != null then ($r.project_id | tostring) else null end) },

              # --- Recommended ---
              status_id: (if ($r.state == "opened" or $r.state == "closed") then 1 else 0 end),
              message: $r.title,
              observables: $observables,

              # --- Fields with no clean OCSF home ---
              unmapped: {
                iid: $r.iid,
                issue_type: $r.issue_type,
                state: $r.state,
                confidential: $r.confidential,
                labels: $r.labels,
                assignees: $assignees,
                milestone: ($r.milestone.title // null),
                upvotes: $r.upvotes,
                downvotes: $r.downvotes,
                merge_requests_count: $r.merge_requests_count,
                user_notes_count: $r.user_notes_count,
                due_date: $r.due_date,
                closed_at: $r.closed_at,
                references: ($r.references.full // null),
                description: $r.description
              },

              raw_data: ($r | tostring)
            }
            # Prune nulls / empties last; required objects stay populated.
            | walk( if type == "object" then with_entries(select(.value != null and .value != "" and .value != [] and .value != {}))
                    elif type == "array" then map(select(. != null))
                    else . end )
