name: "Bitwarden Event Logs to OCSF v1.9.0"
description: "Transforms Bitwarden Events (organization audit log) records into the OCSF v1.9.0 Authentication (3002) class."
author: "Monad"
contributors:
  - "https://github.com/behobu"
inputs:
  - "bitwarden-events"
tags:
  - "v1.9.0"
  - "ocsf"
  - "bitwarden"
  - "iam"
config:
  operations:
    - operation: "jq"
      arguments:
        key: ""
        query: |
          # ---------------------------------------------------------------
          # OCSF Authentication (class_uid=3002) — v1.9.0
          # Input: one Bitwarden Events (Public API /public/events) record.
          # Fields: object,type,itemId,collectionId,groupId,policyId,
          #         memberId,actingUserId,installationId,date,device,ipAddress
          # Modeled for the login-family event types (1000/1005/1006);
          # non-auth type codes fall back to activity/status Unknown.
          # ---------------------------------------------------------------

          def to_epoch_ms($ts):
            def _n: if . == null then null else tonumber end;
            def _num_ms($n):
              if   $n >= 1e17 then ($n / 1000000 | floor)
              elif $n >= 1e14 then ($n / 1000 | floor)
              elif $n >= 1e11 then ($n | floor)
              else ($n * 1000 + 0.001 | floor) end;
            def _digits_ms($d):
              ($d | ltrimstr("-") | length) as $l
              | if   $l >= 18 then ($d[0:-6] | tonumber)
                elif $l >= 15 then ($d[0:-3] | tonumber)
                elif $l >= 12 then ($d | tonumber)
                else ($d | tonumber) * 1000 end;
            def _frac_ms($f): if $f == null then 0 else (($f + "000")[0:3] | tonumber) end;
            def _mon($m):
              if $m == null then null
              else {"JAN":1,"FEB":2,"MAR":3,"APR":4,"MAY":5,"JUN":6,
                    "JUL":7,"AUG":8,"SEP":9,"OCT":10,"NOV":11,"DEC":12}[$m[0:3]] end;
            def _zone($z):
              if $z == null or $z == "" then 0
              else
                ($z | if test("^(UTC|GMT|UT)[+-]") then sub("^(UTC|GMT|UT)"; "") else . end) as $z
                | if ($z | test("^[+-][0-9]{1,2}(:?[0-9]{2})?$")) then
                    ($z | capture("^(?<sg>[+-])(?<h>[0-9]{1,2}):?(?<m>[0-9]{2})?$")) as $o
                    | (if $o.sg == "-" then -1 else 1 end)
                      * (($o.h | tonumber) * 3600 + (($o.m // "0") | tonumber) * 60)
                  else
                    {"Z":0,"UTC":0,"GMT":0,"UT":0,"EST":-18000,"EDT":-14400,"CST":-21600,
                     "CDT":-18000,"MST":-25200,"MDT":-21600,"PST":-28800,"PDT":-25200}[$z]
                  end
              end;
            def _ms($c):
              ($c.y | tonumber | if . < 100 then (if . < 70 then . + 2000 else . + 1900 end) else . end) as $y
              | ($c.mo | _n) as $mo
              | ($c.d | tonumber) as $d
              | (($c.h // "0") | tonumber) as $h
              | (($c.mi // "0") | tonumber) as $mi
              | (($c.s // "0") | tonumber) as $s
              | _zone($c.z) as $off
              | if $mo == null or $off == null or $mo < 1 or $mo > 12 or $d < 1 or $d > 31
                   or $h > 23 or $mi > 59 or $s > 60 then null
                else
                  ($y - (if $mo <= 2 then 1 else 0 end)) as $yy
                  | ($yy / 400 | floor) as $era
                  | ($yy - $era * 400) as $yoe
                  | (((153 * ($mo + (if $mo > 2 then -3 else 9 end)) + 2) / 5 | floor) + $d - 1) as $doy
                  | ($yoe * 365 + ($yoe / 4 | floor) - ($yoe / 100 | floor) + $doy) as $doe
                  | ($era * 146097 + $doe - 719468) as $days
                  | ($days * 86400 + $h * 3600 + $mi * 60 + $s - $off) * 1000 + _frac_ms($c.f)
                end;
            def _str($raw):
              ($raw | ascii_upcase | sub("\\s*\\([^)]*\\)\\s*$"; "") | sub("^\\s+"; "") | sub("\\s+$"; "")) as $s
              | "(?<z>Z|(?:UTC|GMT|UT)?[+-][0-9]{1,2}(?::?[0-9]{2})?|[A-Z]{1,5})" as $Z
              | "(?<h>[0-9]{1,2}):(?<mi>[0-9]{2})(?::(?<s>[0-9]{2}))?(?:[.,](?<f>[0-9]+))?" as $T
              | if $s == "" then null
                elif ($s | test("^-?[0-9]+$")) then _digits_ms($s)
                elif ($s | test("^[0-9]+\\.[0-9]+$")) then
                  ($s | split(".")) as $p
                  | if ($p[0] | length) <= 11 then _digits_ms($p[0]) + _frac_ms($p[1])
                    else _digits_ms($p[0]) end
                elif ($s | test("^/DATE\\(-?[0-9]+([+-][0-9]{4})?\\)/$")) then
                  ($s | capture("(?<ms>-?[0-9]+)").ms | tonumber)
                else
                  first(
                    ($s | capture("^(?<y>[0-9]{4})[-/](?<mo>[0-9]{1,2})[-/](?<d>[0-9]{1,2})(?:[T ]+" + $T + ")?\\s*" + $Z + "?(?:\\s+[A-Z]{2,5})?$") | _ms(.)),
                    ($s | capture("^(?<y>[0-9]{4})(?<mo>[0-9]{2})(?<d>[0-9]{2})T(?<h>[0-9]{2})(?<mi>[0-9]{2})(?<s>[0-9]{2})(?:[.,](?<f>[0-9]+))?" + $Z + "?$") | _ms(.)),
                    ($s | capture("^(?:[A-Z]+,?\\s+)?(?<d>[0-9]{1,2})[ -](?<mon>[A-Z]{3,9})[ -](?<y>[0-9]{2,4})\\s+" + $T + "\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?:[A-Z]+,?\\s+)?(?<mon>[A-Z]{3,9})\\.?\\s+(?<d>[0-9]{1,2}),?\\s+(?<y>[0-9]{4})(?:,?\\s+" + $T + ")?\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?:[A-Z]+\\s+)?(?<mon>[A-Z]{3,9})\\s+(?<d>[0-9]{1,2})\\s+" + $T + "\\s+(?:" + $Z + "\\s+)?(?<y>[0-9]{4})$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?<d>[0-9]{1,2})/(?<mon>[A-Z]{3})/(?<y>[0-9]{4}):" + $T + "\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.))
                  ) // null
                end;
            if $ts == null then null
            elif ($ts | type) == "number" then _num_ms($ts)
            elif ($ts | type) == "string" then _str($ts)
            elif ($ts | type) == "object" then
              if   $ts["$date"] != null then to_epoch_ms($ts["$date"])
              elif $ts["$numberLong"] != null then to_epoch_ms($ts["$numberLong"])
              elif $ts.seconds != null then
                ($ts.seconds | tostring | tonumber) * 1000
                + ((($ts.nanos // 0) | tostring | tonumber) / 1000000 | floor)
              else null end
            else null end;

          def device_name($d):
            {
              "0":"Android","1":"iOS","2":"Chrome Extension","3":"Firefox Extension",
              "4":"Opera Extension","5":"Edge Extension","6":"Windows Desktop",
              "7":"macOS Desktop","8":"Linux Desktop","9":"Chrome Browser",
              "10":"Firefox Browser","11":"Opera Browser","12":"Edge Browser",
              "13":"IE Browser","14":"Unknown Browser","15":"Android (Amazon)",
              "16":"UWP","17":"Safari Browser","18":"Vivaldi Browser",
              "19":"Vivaldi Extension","20":"Safari Extension","21":"SDK"
            }[$d | tostring];

          def event_name($t):
            {
              "1000":"Logged in","1001":"Changed account password",
              "1002":"Enabled/updated two-step login","1003":"Disabled two-step login",
              "1004":"Recovered account from two-step login","1005":"Login attempt failed (bad password)",
              "1006":"Login attempt failed (bad two-step)","1007":"Exported individual vault",
              "1008":"Account recovery requested","1009":"Account recovery key migrated"
            }[$t | tostring] // "Bitwarden event";

          . as $r
          | ($r.type) as $t
          | (($t == 1005) or ($t == 1006)) as $failed
          | {
              "category_uid": 3,
              "class_uid":    3002,
              "activity_id":  (if $t == 1000 or $failed then 1 else 99 end),
              "type_uid":     (3002 * 100 + (if $t == 1000 or $failed then 1 else 99 end)),
              "severity_id":  (if $failed then 2 else 1 end),
              "status_id":    (if $t == 1000 then 1 elif $failed then 2 else 0 end),
              "status":       (if $t == 1000 then "Success" elif $failed then "Failure" else "Unknown" end),

              "time": to_epoch_ms($r.date),

              "metadata": {
                "profiles": ["cloud", "osint", "host"],
                "version": "1.9.0",
                "product": {
                  "vendor_name": "Bitwarden",
                  "name": "Bitwarden Event Logs"
                },
                "uid": ($r.actingUserId // $r.memberId),
                "log_provider": "Bitwarden Public API"
              },

              "user": {
                "uid": ($r.actingUserId // $r.memberId),
                "type_id": 1
              },

              # at_least_one [service, dst_endpoint] — Bitwarden is the service.
              "service": { "name": "Bitwarden" },

              "src_endpoint": ( if $r.ipAddress != null
                                then { "ip": $r.ipAddress } else null end ),

              "device": ( if $r.device != null
                          then { "name": device_name($r.device), "type": device_name($r.device), "type_id": 99 }
                          else null end ),

              # Required by the OCSF v1.9.0 base for this class.
              "cloud":  { "provider": "Bitwarden" },
              "osint":  [],

              "message": event_name($t),

              "unmapped": {
                "bitwarden_event_type": $t,
                "member_id": $r.memberId,
                "item_id": $r.itemId,
                "collection_id": $r.collectionId,
                "group_id": $r.groupId,
                "policy_id": $r.policyId,
                "installation_id": $r.installationId,
                "device_code": $r.device
              },

              "raw_data": ($r | tostring)
            }
          | walk( if type == "object"
                  then with_entries(select(.value != null and .value != {} and .value != ""))
                  else . end )
