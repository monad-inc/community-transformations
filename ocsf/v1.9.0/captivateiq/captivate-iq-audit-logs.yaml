name: "CaptivateIQ Audit Logs to OCSF v1.9.0"
description: "Transforms CaptivateIQ Audit Logs records into the OCSF v1.9.0 Entity Management (class_uid 3004) class."
author: "Monad"
contributors:
  - "https://github.com/behobu"
inputs:
  - "captivate-iq-audit-logs"
tags:
  - "v1.9.0"
  - "ocsf"
  - "captivateiq"
  - "iam"
config:
  operations:
    - operation: "jq"
      arguments:
        key: ""
        query: |
          # ---------------------------------------------------------------
          # OCSF Entity Management (class_uid=3004, category_uid=3) — v1.9.0
          # Input: one CaptivateIQ audit_log record per invocation.
          # A user at the CaptivateIQ management console performs a
          # create/update/delete on a managed entity (worksheet, plan,
          # employee, user, column, ...). event_type -> activity_id.
          # ---------------------------------------------------------------

          def to_epoch_ms($ts):
            def _n: if . == null then null else tonumber end;
            def _num_ms($n):
              if   $n >= 1e17 then ($n / 1000000 | floor)
              elif $n >= 1e14 then ($n / 1000 | floor)
              elif $n >= 1e11 then ($n | floor)
              else ($n * 1000 + 0.001 | floor) end;
            def _digits_ms($d):
              ($d | ltrimstr("-") | length) as $l
              | if   $l >= 18 then ($d[0:-6] | tonumber)
                elif $l >= 15 then ($d[0:-3] | tonumber)
                elif $l >= 12 then ($d | tonumber)
                else ($d | tonumber) * 1000 end;
            def _frac_ms($f): if $f == null then 0 else (($f + "000")[0:3] | tonumber) end;
            def _mon($m):
              if $m == null then null
              else {"JAN":1,"FEB":2,"MAR":3,"APR":4,"MAY":5,"JUN":6,
                    "JUL":7,"AUG":8,"SEP":9,"OCT":10,"NOV":11,"DEC":12}[$m[0:3]] end;
            def _zone($z):
              if $z == null or $z == "" then 0
              else
                ($z | if test("^(UTC|GMT|UT)[+-]") then sub("^(UTC|GMT|UT)"; "") else . end) as $z
                | if ($z | test("^[+-][0-9]{1,2}(:?[0-9]{2})?$")) then
                    ($z | capture("^(?<sg>[+-])(?<h>[0-9]{1,2}):?(?<m>[0-9]{2})?$")) as $o
                    | (if $o.sg == "-" then -1 else 1 end)
                      * (($o.h | tonumber) * 3600 + (($o.m // "0") | tonumber) * 60)
                  else
                    {"Z":0,"UTC":0,"GMT":0,"UT":0,"EST":-18000,"EDT":-14400,"CST":-21600,
                     "CDT":-18000,"MST":-25200,"MDT":-21600,"PST":-28800,"PDT":-25200}[$z]
                  end
              end;
            def _ms($c):
              ($c.y | tonumber | if . < 100 then (if . < 70 then . + 2000 else . + 1900 end) else . end) as $y
              | ($c.mo | _n) as $mo
              | ($c.d | tonumber) as $d
              | (($c.h // "0") | tonumber) as $h
              | (($c.mi // "0") | tonumber) as $mi
              | (($c.s // "0") | tonumber) as $s
              | _zone($c.z) as $off
              | if $mo == null or $off == null or $mo < 1 or $mo > 12 or $d < 1 or $d > 31
                   or $h > 23 or $mi > 59 or $s > 60 then null
                else
                  ($y - (if $mo <= 2 then 1 else 0 end)) as $yy
                  | ($yy / 400 | floor) as $era
                  | ($yy - $era * 400) as $yoe
                  | (((153 * ($mo + (if $mo > 2 then -3 else 9 end)) + 2) / 5 | floor) + $d - 1) as $doy
                  | ($yoe * 365 + ($yoe / 4 | floor) - ($yoe / 100 | floor) + $doy) as $doe
                  | ($era * 146097 + $doe - 719468) as $days
                  | ($days * 86400 + $h * 3600 + $mi * 60 + $s - $off) * 1000 + _frac_ms($c.f)
                end;
            def _str($raw):
              ($raw | ascii_upcase | sub("\\s*\\([^)]*\\)\\s*$"; "") | sub("^\\s+"; "") | sub("\\s+$"; "")) as $s
              | "(?<z>Z|(?:UTC|GMT|UT)?[+-][0-9]{1,2}(?::?[0-9]{2})?|[A-Z]{1,5})" as $Z
              | "(?<h>[0-9]{1,2}):(?<mi>[0-9]{2})(?::(?<s>[0-9]{2}))?(?:[.,](?<f>[0-9]+))?" as $T
              | if $s == "" then null
                elif ($s | test("^-?[0-9]+$")) then _digits_ms($s)
                elif ($s | test("^[0-9]+\\.[0-9]+$")) then
                  ($s | split(".")) as $p
                  | if ($p[0] | length) <= 11 then _digits_ms($p[0]) + _frac_ms($p[1])
                    else _digits_ms($p[0]) end
                elif ($s | test("^/DATE\\(-?[0-9]+([+-][0-9]{4})?\\)/$")) then
                  ($s | capture("(?<ms>-?[0-9]+)").ms | tonumber)
                else
                  first(
                    ($s | capture("^(?<y>[0-9]{4})[-/](?<mo>[0-9]{1,2})[-/](?<d>[0-9]{1,2})(?:[T ]+" + $T + ")?\\s*" + $Z + "?(?:\\s+[A-Z]{2,5})?$") | _ms(.)),
                    ($s | capture("^(?<y>[0-9]{4})(?<mo>[0-9]{2})(?<d>[0-9]{2})T(?<h>[0-9]{2})(?<mi>[0-9]{2})(?<s>[0-9]{2})(?:[.,](?<f>[0-9]+))?" + $Z + "?$") | _ms(.)),
                    ($s | capture("^(?:[A-Z]+,?\\s+)?(?<d>[0-9]{1,2})[ -](?<mon>[A-Z]{3,9})[ -](?<y>[0-9]{2,4})\\s+" + $T + "\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?:[A-Z]+,?\\s+)?(?<mon>[A-Z]{3,9})\\.?\\s+(?<d>[0-9]{1,2}),?\\s+(?<y>[0-9]{4})(?:,?\\s+" + $T + ")?\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?:[A-Z]+\\s+)?(?<mon>[A-Z]{3,9})\\s+(?<d>[0-9]{1,2})\\s+" + $T + "\\s+(?:" + $Z + "\\s+)?(?<y>[0-9]{4})$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?<d>[0-9]{1,2})/(?<mon>[A-Z]{3})/(?<y>[0-9]{4}):" + $T + "\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.))
                  ) // null
                end;
            if $ts == null then null
            elif ($ts | type) == "number" then _num_ms($ts)
            elif ($ts | type) == "string" then _str($ts)
            elif ($ts | type) == "object" then
              if   $ts["$date"] != null then to_epoch_ms($ts["$date"])
              elif $ts["$numberLong"] != null then to_epoch_ms($ts["$numberLong"])
              elif $ts.seconds != null then
                ($ts.seconds | tostring | tonumber) * 1000
                + ((($ts.nanos // 0) | tostring | tonumber) / 1000000 | floor)
              else null end
            else null end;

          . as $r
          | ($r.event_type // "" | ascii_downcase) as $et
          | ( { "create": 1, "read": 2, "update": 3, "delete": 4 }[$et] // 0 ) as $act
          | ($r.object_type // "" | ascii_downcase) as $ot
          | ( if ($ot == "user") then 2
              elif ($ot == "employee") then 2
              elif ($ot == "organization" or $ot == "org") then 4
              else 99 end ) as $ent_type_id
          | ($r.ip_address) as $ip
          | ($r.user_email // $r.logged_in_user_email) as $email
          | {
              "category_uid": 3,
              "class_uid":    3004,
              "activity_id":  $act,
              "type_uid":     (3004 * 100 + $act),
              "severity_id":  1,

              "time": to_epoch_ms($r.created_at),

              "metadata": {
                "profiles": ["cloud", "osint"],
                "version": "1.9.0",
                "product": {
                  "vendor_name": "CaptivateIQ",
                  "name": "CaptivateIQ"
                },
                "tenant_uid": $r.organization_id,
                "log_name": "audit_log",
                "uid": $r.id
              },

              # The managed entity that was created/updated/deleted.
              "entity": ( {
                "type_id": $ent_type_id,
                "uid":     $r.object_id,
                "name":    $r.object_name,
                "type":    $r.object_type,
                "data":    ($r.data // null)
              } | with_entries(select(.value != null)) ),

              # Who performed it. The logged-in principal (impersonation case)
              # is retained under unmapped; actor.invoked_by is deprecated in
              # OCSF 1.9.0.
              "actor": {
                "user": ( {
                  "uid":        $r.user_id,
                  "name":       $r.user_name,
                  "email_addr": $r.user_email
                } | with_entries(select(.value != null)) )
              },

              "src_endpoint": ( { "ip": $ip } | with_entries(select(.value != null)) ),

              # osint + cloud are class-required in OCSF 1.9.0. Represent the
              # source IP as an observable indicator; cloud = the SaaS provider.
              "osint": ( if $ip != null then [{ "type_id": 1, "value": $ip }]
                         elif $email != null then [{ "type_id": 8, "value": $email }]
                         else [{ "type_id": 99, "value": ($r.object_id // "unknown") }] end ),
              "cloud": { "provider": "CaptivateIQ" },

              "status_id": 1,
              "status": "Success",
              "message": ("CaptivateIQ " + ($r.event_type // "event") + " on " + ($r.object_type // "object") + " " + ($r.object_name // ($r.object_id // ""))),

              "unmapped": ( {
                "api_version":         $r.version,
                "object":              $r.object,
                "organization_name":   $r.organization_name,
                "logged_in_user_name": $r.logged_in_user_name,
                "logged_in_user_id":   ( if ($r.logged_in_user_id != null and $r.logged_in_user_id != $r.user_id)
                                         then $r.logged_in_user_id else null end ),
                "logged_in_user_email": ( if ($r.logged_in_user_id != null and $r.logged_in_user_id != $r.user_id)
                                          then $r.logged_in_user_email else null end ),
                "parent_objects":      $r.parent_objects
              } | with_entries(select(.value != null)) ),

              "raw_data": ($r | tostring)
            }
