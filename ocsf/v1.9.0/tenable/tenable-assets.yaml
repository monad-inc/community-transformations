name: "Tenable Assets to OCSF v1.9.0"
description: "Transforms Tenable Vulnerability Management asset inventory records into the OCSF v1.9.0 Device Inventory Info (5001) class."
author: "Monad"
contributors:
  - "https://github.com/behobu"
  - "https://github.com/Credgate"
inputs:
  - "tenable-assets"
  - "tenable-assets-cron"
tags:
  - "v1.9.0"
  - "ocsf"
  - "tenable"
  - "asset"
  - "inventory"
config:
  operations:
    - operation: "jq"
      arguments:
        key: ""
        query: |
          # Tenable asset inventory record -> OCSF v1.9.0 Device Inventory Info (5001).
          # Discovery category (5); activity Collect (2); type_uid 500102.
          def to_epoch_ms($ts):
            def _num_ms($n):
              if   $n >= 1e17 then ($n / 1000000 | floor)
              elif $n >= 1e14 then ($n / 1000 | floor)
              elif $n >= 1e11 then ($n | floor)
              else ($n * 1000 | floor) end;
            if $ts == null or $ts == "" then null
            elif ($ts | type) == "number" then _num_ms($ts)
            elif ($ts | type) == "object" then
              (if ($ts.seconds // null) == null then null
               else ($ts.seconds * 1000 + ((($ts.nanos // 0) / 1000000) | floor)) end)
            elif ($ts | type) == "string" then
              if ($ts | test("^-?[0-9]+(\\.[0-9]+)?$")) then _num_ms($ts | tonumber)
              else
                ([$ts | ascii_upcase | capture("^(?<d>[0-9]{4}-[0-9]{2}-[0-9]{2})(?:[T ](?<t>[0-9]{2}:[0-9]{2}(?::[0-9]{2})?)(?:[.,](?<f>[0-9]+))?)? ?(?<z>Z|UTC|[+-][0-9]{2}(?::?[0-9]{2})?)?$")] | first) as $m
                | if $m == null then null
                  else
                    (($m.t // "00:00:00") | if length == 5 then . + ":00" else . end) as $t
                    | (($m.z // "Z") | if . == "Z" or . == "UTC" then 0
                        else (.[1:] | gsub(":"; "")) as $o
                          | ((if (.[0:1]) == "-" then -1 else 1 end)
                             * (($o[0:2] | tonumber) * 3600 + ((if ($o | length) >= 4 then $o[2:4] else "00" end) | tonumber) * 60))
                        end) as $off
                    | ((($m.d + "T" + $t + "Z") | fromdateiso8601) - $off) * 1000
                      + (((($m.f // "") + "000")[0:3]) | tonumber)
                  end
              end
            else null end;

                    . as $r |
          {
            category_uid: 5,
            class_uid: 5001,
            activity_id: 2,
            type_uid: 500102,
            severity_id: 1,

            time: ( to_epoch_ms($r.updated_at) // (now * 1000 | floor) ),

            metadata: {
                "profiles": ["cloud", "osint"],
              version: "1.9.0",
              product: {
                vendor_name: "Tenable",
                name: "Tenable Vulnerability Management"
              }
            },

            device: {
              type_id: 0,
              uid: $r.id,
              hostname: ( ($r.hostnames // [])[0] ),
              ip: ( ($r.ipv4s // [])[0] ),
              mac: ( ($r.mac_addresses // [])[0] ),
              name: ( ($r.netbios_names // [])[0] ),
              domain: ( ($r.fqdns // [])[0] ),
              type: ( ($r.system_types // [])[0] ),
              first_seen_time: to_epoch_ms($r.first_seen),
              last_seen_time: to_epoch_ms($r.last_seen),
              created_time: to_epoch_ms($r.created_at),
              modified_time: to_epoch_ms($r.updated_at),
              region: $r.aws_region,
              zone: $r.network_name,
              instance_uid: $r.aws_ec2_instance_id,
              os: (
                if ($r.operating_systems // [] | length) > 0 then
                  ($r.operating_systems[0]) as $osn |
                  {
                    name: $osn,
                    type_id: (
                      ($osn | ascii_downcase) as $l |
                      if ($l | contains("windows")) then 100
                      elif ($l | contains("linux")) then 200
                      elif ($l | contains("mac")) then 300
                      elif ($l | contains("android")) then 400
                      elif ($l | contains("ios")) then 500
                      else 0 end
                    )
                  }
                else null end
              ),
              network_interfaces: (
                [ ($r.network_interfaces // [])[]
                  | {
                      name: .name,
                      ip: ((.ipv4 // [])[0]),
                      mac: ((.mac_address // [])[0]),
                      hostname: ((.fqdns // [])[0])
                    }
                ]
              )
            },

            # OSINT is required at the class level in v1.9.0; an asset inventory
            # record carries no open-source intelligence indicators.
            osint: [],

            cloud: (
              if ($r.aws_region != null or $r.aws_ec2_instance_id != null) then
                {
                  provider: "AWS",
                  region: $r.aws_region,
                  zone: $r.aws_availability_zone,
                  account: ( if $r.aws_owner_id then { uid: $r.aws_owner_id } else null end )
                }
              else
                { provider: "Other" }
              end
            ),

            raw_data: ($r | tostring)
          }
