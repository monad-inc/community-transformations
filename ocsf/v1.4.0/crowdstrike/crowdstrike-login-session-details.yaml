name: "CrowdStrike Login Activity to OCSF v1.4.0"
description: "Transforms CrowdStrike Login Activity (per-device recent login records) into the OCSF v1.4.0 Authentication class. Emits one event per login in the source record's recent_logins array."
author: "Monad"
contributors:
  - "https://github.com/behobu"
inputs:
  - "crowdstrike-login-session-details"
tags:
  - "v1.4.0"
  - "ocsf"
  - "crowdstrike"
  - "iam"
  - "authentication"
config:
  operations:
    - operation: "jq"
      arguments:
        key: ""
        query: |
          # ---------------------------------------------------------------
          # OCSF Authentication (class_uid=3002) — v1.4.0
          # Input: one CrowdStrike Login Activity record per invocation.
          # The record is per-device and carries a recent_logins array;
          # this transform emits ONE OCSF Authentication event per login.
          #
          # Carries forward from v1.1.0 the base mapping, and adds the
          # v1.4.0-recommended `observables` array, populated from the
          # two natural pivots the source provides:
          #   * type_id  4 (User Name)    from recent_logins[].user_name
          #   * type_id 10 (Resource UID) from .device_id
          # ---------------------------------------------------------------


          def to_epoch_ms($ts):
            def _num_ms($n):
              if   $n >= 1e17 then ($n / 1000000 | floor)
              elif $n >= 1e14 then ($n / 1000 | floor)
              elif $n >= 1e11 then ($n | floor)
              else ($n * 1000 | floor) end;
            if $ts == null or $ts == "" then null
            elif ($ts | type) == "number" then _num_ms($ts)
            elif ($ts | type) == "object" then
              (if ($ts.seconds // null) == null then null
               else ($ts.seconds * 1000 + ((($ts.nanos // 0) / 1000000) | floor)) end)
            elif ($ts | type) == "string" then
              if ($ts | test("^-?[0-9]+(\\.[0-9]+)?$")) then _num_ms($ts | tonumber)
              else
                ([$ts | ascii_upcase | capture("^(?<d>[0-9]{4}-[0-9]{2}-[0-9]{2})(?:[T ](?<t>[0-9]{2}:[0-9]{2}(?::[0-9]{2})?)(?:[.,](?<f>[0-9]+))?)? ?(?<z>Z|UTC|[+-][0-9]{2}(?::?[0-9]{2})?)?$")] | first) as $m
                | if $m == null then null
                  else
                    (($m.t // "00:00:00") | if length == 5 then . + ":00" else . end) as $t
                    | (($m.z // "Z") | if . == "Z" or . == "UTC" then 0
                        else (.[1:] | gsub(":"; "")) as $o
                          | ((if (.[0:1]) == "-" then -1 else 1 end)
                             * (($o[0:2] | tonumber) * 3600 + ((if ($o | length) >= 4 then $o[2:4] else "00" end) | tonumber) * 60))
                        end) as $off
                    | ((($m.d + "T" + $t + "Z") | fromdateiso8601) - $off) * 1000
                      + (((($m.f // "") + "000")[0:3]) | tonumber)
                  end
              end
            else null end;

          . as $root
          | (.recent_logins // [])[]
          | . as $login
          | select(.login_time != null and .login_time != "")
          | {
              category_uid: 3,
              class_uid:    3002,
              type_uid:     300201,
              activity_id:  1,
              severity_id:  1,
              status_id:    1,
              time:         to_epoch_ms(.login_time),
              metadata: ({
                version: "1.4.0",
                product: {
                  vendor_name: "CrowdStrike",
                  name: "Falcon"
                },
                tenant_uid: $root.cid
              } | if .tenant_uid == null then del(.tenant_uid) else . end),
              user: ({
                type_id: 1,
                name: .user_name
              } | if .name == null then del(.name) else . end),
              dst_endpoint: ({
                uid: $root.device_id
              } | if .uid == null then null else . end),
              observables: (
                [
                  (if $login.user_name != null and $login.user_name != ""
                   then {name: "user.name", type_id: 4, value: $login.user_name}
                   else empty end),
                  (if $root.device_id != null and $root.device_id != ""
                   then {name: "dst_endpoint.uid", type_id: 10, value: $root.device_id}
                   else empty end)
                ]
              ),
              raw_data: (. | tostring)
            }
          | if .dst_endpoint == null then del(.dst_endpoint) else . end
          | if (.observables | length) == 0 then del(.observables) else . end
