name: "Crowdstrike Device Details to OCSF"
description: "Transforms Crowdstrike device details into OCSF Schema"
author: "Monad"
contributors:
  - "https://github.com/Credgate"
inputs:
  - "crowdstrike-device-details"
tags:
  - "v1.1.0"
  - "ocsf"
  - "crowdstrike"
  - "device"
  - "inventory"
config:
  operations:
    - operation: "jq"
      arguments:
        key: ""
        query: |
          def to_epoch_ms($ts):
            def _num_ms($n):
              if   $n >= 1e17 then ($n / 1000000 | floor)
              elif $n >= 1e14 then ($n / 1000 | floor)
              elif $n >= 1e11 then ($n | floor)
              else ($n * 1000 | floor) end;
            if $ts == null or $ts == "" then null
            elif ($ts | type) == "number" then _num_ms($ts)
            elif ($ts | type) == "object" then
              (if ($ts.seconds // null) == null then null
               else ($ts.seconds * 1000 + ((($ts.nanos // 0) / 1000000) | floor)) end)
            elif ($ts | type) == "string" then
              if ($ts | test("^-?[0-9]+(\\.[0-9]+)?$")) then _num_ms($ts | tonumber)
              else
                ([$ts | ascii_upcase | capture("^(?<d>[0-9]{4}-[0-9]{2}-[0-9]{2})(?:[T ](?<t>[0-9]{2}:[0-9]{2}(?::[0-9]{2})?)(?:[.,](?<f>[0-9]+))?)? ?(?<z>Z|UTC|[+-][0-9]{2}(?::?[0-9]{2})?)?$")] | first) as $m
                | if $m == null then null
                  else
                    (($m.t // "00:00:00") | if length == 5 then . + ":00" else . end) as $t
                    | (($m.z // "Z") | if . == "Z" or . == "UTC" then 0
                        else (.[1:] | gsub(":"; "")) as $o
                          | ((if (.[0:1]) == "-" then -1 else 1 end)
                             * (($o[0:2] | tonumber) * 3600 + ((if ($o | length) >= 4 then $o[2:4] else "00" end) | tonumber) * 60))
                        end) as $off
                    | ((($m.d + "T" + $t + "Z") | fromdateiso8601) - $off) * 1000
                      + (((($m.f // "") + "000")[0:3]) | tonumber)
                  end
              end
            else null end;

          {
            # Required fields per schema
            "activity_id": 1,
            "activity_name": "Information",
            "category_uid": 5,
            "category_name": "Discovery",
            "class_uid": 5001,
            "class_name": "Device Inventory Info",
            "type_uid": 0,
            "type_name": "Device Information",
            "severity_id": 0,
            "severity": "Info",
            "time": to_epoch_ms(.agent_local_time),
            "status": "Success",
            "status_id": 0,

            # Metadata (required)
            "metadata": {
              "version": "1.1.0",
              "product": {
                "name": "Endpoint Protection",
                "vendor_name": "Security Vendor",
                "feature": {
                  "name": "Device Control",
                  "uid": .device_policies.device_control.policy_id,
                  "version": .agent_version
                }
              }
            },

            # Device object following exact schema
            "device": {
              # Required field
              "type_id": (
                if .product_type_desc == "Workstation" then 1
                elif .product_type_desc == "Server" then 2
                elif .product_type_desc == "Mobile" then 4
                else 99
                end
              ),

              # Optional fields present in input
              "hostname": .hostname,
              "name": .hostname,
              "uid": .device_id,
              "domain": null,
              "ip": .local_ip,
              "mac": .mac_address,
              "first_seen_time": to_epoch_ms(.first_seen),
              "last_seen_time": to_epoch_ms(.last_seen),
              "is_managed": (.provision_status == "Provisioned"),

              # Network interfaces array
              "network_interfaces": [
                {
                  "type_id": 1,
                  "type": "Wired",
                  "hostname": .hostname,
                  "ip": .local_ip,
                  "mac": .mac_address,
                  "name": .interface_name
                },
                (
                  if .connection_ip then {
                    "type_id": (if (.connection_ip | contains(":")) then 2 else 1 end),
                    "type": (if (.connection_ip | contains(":")) then "Wireless" else "Wired" end),
                    "hostname": .hostname,
                    "ip": .connection_ip,
                    "mac": .mac_address,
                    "name": .interface_name
                  } else empty
                  end
                ),
                (
                  if .external_ip then {
                    "type_id": (if (.external_ip | contains(":")) then 2 else 1 end),
                    "type": (if (.external_ip | contains(":")) then "Wireless" else "Wired" end),
                    "hostname": .hostname,
                    "ip": .external_ip,
                    "mac": .mac_address,
                    "name": .interface_name
                  } else empty
                  end
                )
              ],

              # Hardware info
              "hw_info": {
                "bios_manufacturer": .system_manufacturer,
                "bios_ver": ("v" + .agent_version),
                "cpu_bits": (if .platform_name == "Mac" then 64 else null end),
                "cpu_type": (.cpu_vendor | tostring),
                "chassis": .chassis_type_desc,
                "serial_number": .serial_number
              },

              # OS information
              "os": {
                "name": (.platform_name + " " + .os_version),
                "type_id": (
                  if .platform_name == "Mac" then 300
                  elif .platform_name == "Windows" then 100
                  elif .platform_name == "Linux" then 200
                  else 0
                  end
                ),
                "type": .platform_name,
                "version": .os_version,
                "build": .os_build,
                "cpu_bits": (if .platform_name == "Mac" then 64 else null end),
                "cpe_name": (
                  if .platform_name == "Mac" then
                    ("cpe:/o:apple:macos:" + (.os_version | split(" ")[0] | ascii_downcase))
                  else null
                  end
                )
              },

              # Modified time if available
              "modified_time": (if .modified_timestamp then to_epoch_ms(.modified_timestamp) else null end)
            },

            "raw_data": (. | tostring),

            # Optional fields that are present in source data
            "unmapped": {
              "agent_load_flags": .agent_load_flags,
              "config_id_base": .config_id_base,
              "config_id_build": .config_id_build,
              "config_id_platform": .config_id_platform,
              "kernel_version": .kernel_version,
              "platform_id": .platform_id,
              "platform_name": .platform_name,
              "provision_status": .provision_status,
              "reduced_functionality_mode": .reduced_functionality_mode,
              "device_policies": .device_policies
            }
          }