name: "Crowdstrike Device Details to OCSF"
description: "Transforms Crowdstrike device details into OCSF Schema"
author: "Monad"
contributors:
  - "https://github.com/Credgate"
  - "https://github.com/behobu"
inputs:
  - "crowdstrike-device-details"
tags:
  - "v1.1.0"
  - "ocsf"
  - "crowdstrike"
  - "device"
  - "inventory"
config:
  operations:
    - operation: "jq"
      arguments:
        key: ""
        query: |
          def to_epoch_ms($ts):
            def _n: if . == null then null else tonumber end;
            def _num_ms($n):
              if   $n >= 1e17 then ($n / 1000000 | floor)
              elif $n >= 1e14 then ($n / 1000 | floor)
              elif $n >= 1e11 then ($n | floor)
              else ($n * 1000 + 0.001 | floor) end;
            def _digits_ms($d):
              ($d | ltrimstr("-") | length) as $l
              | if   $l >= 18 then ($d[0:-6] | tonumber)
                elif $l >= 15 then ($d[0:-3] | tonumber)
                elif $l >= 12 then ($d | tonumber)
                else ($d | tonumber) * 1000 end;
            def _frac_ms($f): if $f == null then 0 else (($f + "000")[0:3] | tonumber) end;
            def _mon($m):
              if $m == null then null
              else {"JAN":1,"FEB":2,"MAR":3,"APR":4,"MAY":5,"JUN":6,
                    "JUL":7,"AUG":8,"SEP":9,"OCT":10,"NOV":11,"DEC":12}[$m[0:3]] end;
            def _zone($z):
              if $z == null or $z == "" then 0
              else
                ($z | if test("^(UTC|GMT|UT)[+-]") then sub("^(UTC|GMT|UT)"; "") else . end) as $z
                | if ($z | test("^[+-][0-9]{1,2}(:?[0-9]{2})?$")) then
                    ($z | capture("^(?<sg>[+-])(?<h>[0-9]{1,2}):?(?<m>[0-9]{2})?$")) as $o
                    | (if $o.sg == "-" then -1 else 1 end)
                      * (($o.h | tonumber) * 3600 + (($o.m // "0") | tonumber) * 60)
                  else
                    {"Z":0,"UTC":0,"GMT":0,"UT":0,"EST":-18000,"EDT":-14400,"CST":-21600,
                     "CDT":-18000,"MST":-25200,"MDT":-21600,"PST":-28800,"PDT":-25200}[$z]
                  end
              end;
            def _ms($c):
              ($c.y | tonumber | if . < 100 then (if . < 70 then . + 2000 else . + 1900 end) else . end) as $y
              | ($c.mo | _n) as $mo
              | ($c.d | tonumber) as $d
              | (($c.h // "0") | tonumber) as $h
              | (($c.mi // "0") | tonumber) as $mi
              | (($c.s // "0") | tonumber) as $s
              | _zone($c.z) as $off
              | if $mo == null or $off == null or $mo < 1 or $mo > 12 or $d < 1 or $d > 31
                   or $h > 23 or $mi > 59 or $s > 60 then null
                else
                  ($y - (if $mo <= 2 then 1 else 0 end)) as $yy
                  | ($yy / 400 | floor) as $era
                  | ($yy - $era * 400) as $yoe
                  | (((153 * ($mo + (if $mo > 2 then -3 else 9 end)) + 2) / 5 | floor) + $d - 1) as $doy
                  | ($yoe * 365 + ($yoe / 4 | floor) - ($yoe / 100 | floor) + $doy) as $doe
                  | ($era * 146097 + $doe - 719468) as $days
                  | ($days * 86400 + $h * 3600 + $mi * 60 + $s - $off) * 1000 + _frac_ms($c.f)
                end;
            def _str($raw):
              ($raw | ascii_upcase | sub("\\s*\\([^)]*\\)\\s*$"; "") | sub("^\\s+"; "") | sub("\\s+$"; "")) as $s
              | "(?<z>Z|(?:UTC|GMT|UT)?[+-][0-9]{1,2}(?::?[0-9]{2})?|[A-Z]{1,5})" as $Z
              | "(?<h>[0-9]{1,2}):(?<mi>[0-9]{2})(?::(?<s>[0-9]{2}))?(?:[.,](?<f>[0-9]+))?" as $T
              | if $s == "" then null
                elif ($s | test("^-?[0-9]+$")) then _digits_ms($s)
                elif ($s | test("^[0-9]+\\.[0-9]+$")) then
                  ($s | split(".")) as $p
                  | if ($p[0] | length) <= 11 then _digits_ms($p[0]) + _frac_ms($p[1])
                    else _digits_ms($p[0]) end
                elif ($s | test("^/DATE\\(-?[0-9]+([+-][0-9]{4})?\\)/$")) then
                  ($s | capture("(?<ms>-?[0-9]+)").ms | tonumber)
                else
                  first(
                    ($s | capture("^(?<y>[0-9]{4})[-/](?<mo>[0-9]{1,2})[-/](?<d>[0-9]{1,2})(?:[T ]+" + $T + ")?\\s*" + $Z + "?(?:\\s+[A-Z]{2,5})?$") | _ms(.)),
                    ($s | capture("^(?<y>[0-9]{4})(?<mo>[0-9]{2})(?<d>[0-9]{2})T(?<h>[0-9]{2})(?<mi>[0-9]{2})(?<s>[0-9]{2})(?:[.,](?<f>[0-9]+))?" + $Z + "?$") | _ms(.)),
                    ($s | capture("^(?:[A-Z]+,?\\s+)?(?<d>[0-9]{1,2})[ -](?<mon>[A-Z]{3,9})[ -](?<y>[0-9]{2,4})\\s+" + $T + "\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?:[A-Z]+,?\\s+)?(?<mon>[A-Z]{3,9})\\.?\\s+(?<d>[0-9]{1,2}),?\\s+(?<y>[0-9]{4})(?:,?\\s+" + $T + ")?\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?:[A-Z]+\\s+)?(?<mon>[A-Z]{3,9})\\s+(?<d>[0-9]{1,2})\\s+" + $T + "\\s+(?:" + $Z + "\\s+)?(?<y>[0-9]{4})$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?<d>[0-9]{1,2})/(?<mon>[A-Z]{3})/(?<y>[0-9]{4}):" + $T + "\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.))
                  ) // null
                end;
            if $ts == null then null
            elif ($ts | type) == "number" then _num_ms($ts)
            elif ($ts | type) == "string" then _str($ts)
            elif ($ts | type) == "object" then
              if   $ts["$date"] != null then to_epoch_ms($ts["$date"])
              elif $ts["$numberLong"] != null then to_epoch_ms($ts["$numberLong"])
              elif $ts.seconds != null then
                ($ts.seconds | tostring | tonumber) * 1000
                + ((($ts.nanos // 0) | tostring | tonumber) / 1000000 | floor)
              else null end
            else null end;

          {
            # Required fields per schema
            "activity_id": 1,
            "activity_name": "Information",
            "category_uid": 5,
            "category_name": "Discovery",
            "class_uid": 5001,
            "class_name": "Device Inventory Info",
            "type_uid": 0,
            "type_name": "Device Information",
            "severity_id": 0,
            "severity": "Info",
            "time": to_epoch_ms(.agent_local_time),
            "status": "Success",
            "status_id": 0,

            # Metadata (required)
            "metadata": {
              "version": "1.1.0",
              "product": {
                "name": "Endpoint Protection",
                "vendor_name": "Security Vendor",
                "feature": {
                  "name": "Device Control",
                  "uid": .device_policies.device_control.policy_id,
                  "version": .agent_version
                }
              }
            },

            # Device object following exact schema
            "device": {
              # Required field
              "type_id": (
                if .product_type_desc == "Workstation" then 1
                elif .product_type_desc == "Server" then 2
                elif .product_type_desc == "Mobile" then 4
                else 99
                end
              ),

              # Optional fields present in input
              "hostname": .hostname,
              "name": .hostname,
              "uid": .device_id,
              "domain": null,
              "ip": .local_ip,
              "mac": .mac_address,
              "first_seen_time": to_epoch_ms(.first_seen),
              "last_seen_time": to_epoch_ms(.last_seen),
              "is_managed": (.provision_status == "Provisioned"),

              # Network interfaces array
              "network_interfaces": [
                {
                  "type_id": 1,
                  "type": "Wired",
                  "hostname": .hostname,
                  "ip": .local_ip,
                  "mac": .mac_address,
                  "name": .interface_name
                },
                (
                  if .connection_ip then {
                    "type_id": (if (.connection_ip | contains(":")) then 2 else 1 end),
                    "type": (if (.connection_ip | contains(":")) then "Wireless" else "Wired" end),
                    "hostname": .hostname,
                    "ip": .connection_ip,
                    "mac": .mac_address,
                    "name": .interface_name
                  } else empty
                  end
                ),
                (
                  if .external_ip then {
                    "type_id": (if (.external_ip | contains(":")) then 2 else 1 end),
                    "type": (if (.external_ip | contains(":")) then "Wireless" else "Wired" end),
                    "hostname": .hostname,
                    "ip": .external_ip,
                    "mac": .mac_address,
                    "name": .interface_name
                  } else empty
                  end
                )
              ],

              # Hardware info
              "hw_info": {
                "bios_manufacturer": .system_manufacturer,
                "bios_ver": ("v" + .agent_version),
                "cpu_bits": (if .platform_name == "Mac" then 64 else null end),
                "cpu_type": (.cpu_vendor | tostring),
                "chassis": .chassis_type_desc,
                "serial_number": .serial_number
              },

              # OS information
              "os": {
                "name": (.platform_name + " " + .os_version),
                "type_id": (
                  if .platform_name == "Mac" then 300
                  elif .platform_name == "Windows" then 100
                  elif .platform_name == "Linux" then 200
                  else 0
                  end
                ),
                "type": .platform_name,
                "version": .os_version,
                "build": .os_build,
                "cpu_bits": (if .platform_name == "Mac" then 64 else null end),
                "cpe_name": (
                  if .platform_name == "Mac" then
                    ("cpe:/o:apple:macos:" + (.os_version | split(" ")[0] | ascii_downcase))
                  else null
                  end
                )
              },

              # Modified time if available
              "modified_time": (if .modified_timestamp then to_epoch_ms(.modified_timestamp) else null end)
            },

            "raw_data": (. | tostring),

            # Optional fields that are present in source data
            "unmapped": {
              "agent_load_flags": .agent_load_flags,
              "config_id_base": .config_id_base,
              "config_id_build": .config_id_build,
              "config_id_platform": .config_id_platform,
              "kernel_version": .kernel_version,
              "platform_id": .platform_id,
              "platform_name": .platform_name,
              "provision_status": .provision_status,
              "reduced_functionality_mode": .reduced_functionality_mode,
              "device_policies": .device_policies
            }
          }