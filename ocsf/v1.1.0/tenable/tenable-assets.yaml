name: "Tenable Assets to OCSF"
description: "Transforms Tenable Asset Inventory into OCSF Schema"
author: "Monad"
contributors:
  - "https://github.com/Credgate"
  - "https://github.com/behobu"
inputs:
  - "tenable-assets"
  - "tenable-assets-cron"
tags:
  - "v1.1.0"
  - "ocsf"
  - "tenable"
  - "asset"
  - "inventory"
config:
  operations:
    - operation: "jq"
      arguments:
        key: ""
        query: |
          def to_epoch_ms($ts):
            def _num_ms($n):
              if   $n >= 1e17 then ($n / 1000000 | floor)
              elif $n >= 1e14 then ($n / 1000 | floor)
              elif $n >= 1e11 then ($n | floor)
              else ($n * 1000 | floor) end;
            if $ts == null or $ts == "" then null
            elif ($ts | type) == "number" then _num_ms($ts)
            elif ($ts | type) == "object" then
              (if ($ts.seconds // null) == null then null
               else ($ts.seconds * 1000 + ((($ts.nanos // 0) / 1000000) | floor)) end)
            elif ($ts | type) == "string" then
              if ($ts | test("^-?[0-9]+(\\.[0-9]+)?$")) then _num_ms($ts | tonumber)
              else
                ([$ts | ascii_upcase | capture("^(?<d>[0-9]{4}-[0-9]{2}-[0-9]{2})(?:[T ](?<t>[0-9]{2}:[0-9]{2}(?::[0-9]{2})?)(?:[.,](?<f>[0-9]+))?)? ?(?<z>Z|UTC|[+-][0-9]{2}(?::?[0-9]{2})?)?$")] | first) as $m
                | if $m == null then null
                  else
                    (($m.t // "00:00:00") | if length == 5 then . + ":00" else . end) as $t
                    | (($m.z // "Z") | if . == "Z" or . == "UTC" then 0
                        else (.[1:] | gsub(":"; "")) as $o
                          | ((if (.[0:1]) == "-" then -1 else 1 end)
                             * (($o[0:2] | tonumber) * 3600 + ((if ($o | length) >= 4 then $o[2:4] else "00" end) | tonumber) * 60))
                        end) as $off
                    | ((($m.d + "T" + $t + "Z") | fromdateiso8601) - $off) * 1000
                      + (((($m.f // "") + "000")[0:3]) | tonumber)
                  end
              end
            else null end;

          {
            # Static fields
            "category_uid": 5,                    # Discovery
            "class_uid": 5001,                    # Device Inventory Info
            "activity_id": 2,                     # Collect
            "type_uid": 500102,                   # Device Inventory Info: Collect
            "severity_id": 1,                     # Informational
          
            # Dynamic time field - remove milliseconds and convert to epoch
            "time": (
              if .updated_at then
                to_epoch_ms(.updated_at)
              else
                (now * 1000 | floor)
              end
            ),
          
            # Device object with all available fields
            "device": {
              "type_id": 0,                       # Unknown
              "uid": .id,
              "hostname": (
                if (.hostnames | length > 0) then
                  .hostnames[0]
                else
                  ""
                end
              ),
              "ip": (
                if (.ipv4s | length > 0) then
                  .ipv4s[0]
                else
                  null
                end
              ),
              "mac": (
                if (.mac_addresses | length > 0) then
                  .mac_addresses[0]
                else
                  null
                end
              ),
              # Additional fields
              "first_seen_time": (
                if .first_seen then
                  to_epoch_ms(.first_seen)
                else
                  null
                end
              ),
              "last_seen_time": (
                if .last_seen then
                  to_epoch_ms(.last_seen)
                else
                  null
                end
              ),
              "network_interfaces": (
                if (.network_interfaces | length > 0) then
                  .network_interfaces
                else
                  []
                end
              ),
              "region": (
                if .aws_region then
                  .aws_region
                else
                  null
                end
              ),
              "type": (
                if (.system_types | length > 0) then
                  .system_types[0]
                else
                  null
                end
              ),
              "domain": (
                if (.fqdns | length > 0) then
                  .fqdns[0]
                else
                  null
                end
              ),
              "os": (
                if (.operating_systems | length > 0) then
                  .operating_systems[0]
                else
                  null
                end
              ),
              "created_time": (
                if .created_at then
                  to_epoch_ms(.created_at)
                else
                  null
                end
              ),
              "modified_time": (
                if .updated_at then
                  to_epoch_ms(.updated_at)
                else
                  null
                end
              ),
              "zone": (
                if .network_name then
                  .network_name
                else
                  null
                end
              )
            },
          
            # Static metadata
            "metadata": {
              "version": "1.1.0",
              "product": {
                "vendor_name": "Tenable"
              }
            },
            "raw_data": (. | tostring)
          }