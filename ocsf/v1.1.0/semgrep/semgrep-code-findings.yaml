name: "Semgrep Code Vulnerability Findings to OCSF"
description: "Transforms Semgrep Code Vulnerability Findings into OCSF Schema"
author: "Monad"
contributors:
  - "https://github.com/Credgate"
inputs:
  - "semgrep-code-findings"
tags:
  - "v1.1.0"
  - "ocsf"
  - "semgrep"
  - "code"
  - "vulnerability"
  - "findings"
config:
  operations:
    - operation: "jq"
      arguments:
        key: ""
        query: |
          def to_epoch_ms($ts):
            def _num_ms($n):
              if   $n >= 1e17 then ($n / 1000000 | floor)
              elif $n >= 1e14 then ($n / 1000 | floor)
              elif $n >= 1e11 then ($n | floor)
              else ($n * 1000 | floor) end;
            if $ts == null or $ts == "" then null
            elif ($ts | type) == "number" then _num_ms($ts)
            elif ($ts | type) == "object" then
              (if ($ts.seconds // null) == null then null
               else ($ts.seconds * 1000 + ((($ts.nanos // 0) / 1000000) | floor)) end)
            elif ($ts | type) == "string" then
              if ($ts | test("^-?[0-9]+(\\.[0-9]+)?$")) then _num_ms($ts | tonumber)
              else
                ([$ts | ascii_upcase | capture("^(?<d>[0-9]{4}-[0-9]{2}-[0-9]{2})(?:[T ](?<t>[0-9]{2}:[0-9]{2}(?::[0-9]{2})?)(?:[.,](?<f>[0-9]+))?)? ?(?<z>Z|UTC|[+-][0-9]{2}(?::?[0-9]{2})?)?$")] | first) as $m
                | if $m == null then null
                  else
                    (($m.t // "00:00:00") | if length == 5 then . + ":00" else . end) as $t
                    | (($m.z // "Z") | if . == "Z" or . == "UTC" then 0
                        else (.[1:] | gsub(":"; "")) as $o
                          | ((if (.[0:1]) == "-" then -1 else 1 end)
                             * (($o[0:2] | tonumber) * 3600 + ((if ($o | length) >= 4 then $o[2:4] else "00" end) | tonumber) * 60))
                        end) as $off
                    | ((($m.d + "T" + $t + "Z") | fromdateiso8601) - $off) * 1000
                      + (((($m.f // "") + "000")[0:3]) | tonumber)
                  end
              end
            else null end;

          {
            "class_uid": 2002, # Vulnerability Finding
            "category_uid": 2, # Findings
            "type_uid": 200200, # Vulnerability Finding: Unknown
            "activity_id": 0, # Unknown
            "severity_id": (.severity | if . == "medium" then 2 else if . == "high" then 3 else if . == "critical" then 4 else 1 end end end),
            "time": to_epoch_ms(.created_at),
            "cloud": {
              "provider": "Unknown",
              "account": { "name": .repository.name }
            },
            "finding_info": {
              "uid": .id | tostring,
              "title": .rule_name,
              "desc": .rule_message,
              "first_seen_time": to_epoch_ms(.relevant_since)
            },
            "vulnerabilities": [{
              "desc": .rule_message,
              "severity": .severity,
              "title": .rule_name,
              "vendor_name": "Semgrep",
              "first_seen_time": to_epoch_ms(.relevant_since),
              "last_seen_time": to_epoch_ms(.created_at),
              "cwe": {
                "uid": (if .rule.cwe_names and .rule.cwe_names[0] then (.rule.cwe_names[0] | split("-")[1]) else null end),
                "caption": (if .rule.cwe_names and .rule.cwe_names[0] then (.rule.cwe_names[0] | split(":")[1]) else null end)
              },
              "affected_code": [{
                "file": {
                  "path": .location.file_path,
                  "name": (if .location.file_path then (.location.file_path | split("/")[-1]) else null end),
                  "type_id": 0 #Unknown
                },
                "start_line": .location.line,
                "end_line": .location.end_line
              }],
              "references": .rule.owasp_names
            }],
            "raw_data": (. | tostring),
            "metadata": {
              "version": "1.1.0",
              "product": {
                "vendor_name": "Semgrep",
                "name": "Semgrep"
              }
            }
          }