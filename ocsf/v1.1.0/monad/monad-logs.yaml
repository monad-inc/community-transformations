name: "Monad Organization Logs to OCSF v1.1.0"
description: "Transforms Monad Organization Logs into OCSF v1.1.0 Schema"
author: "Monad"
contributors:
  - "https://github.com/Credgate"
  - "https://github.com/behobu"
inputs:
  - "monad-logs"
tags:
  - "v1.1.0"
  - "ocsf"
  - "monad"
  - "organization"
  - "logs"
config:
  operations:
    - operation: "jq"
      arguments:
        key: ""
        query: |
          def to_epoch_ms($ts):
            def _num_ms($n):
              if   $n >= 1e17 then ($n / 1000000 | floor)
              elif $n >= 1e14 then ($n / 1000 | floor)
              elif $n >= 1e11 then ($n | floor)
              else ($n * 1000 | floor) end;
            if $ts == null or $ts == "" then null
            elif ($ts | type) == "number" then _num_ms($ts)
            elif ($ts | type) == "object" then
              (if ($ts.seconds // null) == null then null
               else ($ts.seconds * 1000 + ((($ts.nanos // 0) / 1000000) | floor)) end)
            elif ($ts | type) == "string" then
              if ($ts | test("^-?[0-9]+(\\.[0-9]+)?$")) then _num_ms($ts | tonumber)
              else
                ([$ts | ascii_upcase | capture("^(?<d>[0-9]{4}-[0-9]{2}-[0-9]{2})(?:[T ](?<t>[0-9]{2}:[0-9]{2}(?::[0-9]{2})?)(?:[.,](?<f>[0-9]+))?)? ?(?<z>Z|UTC|[+-][0-9]{2}(?::?[0-9]{2})?)?$")] | first) as $m
                | if $m == null then null
                  else
                    (($m.t // "00:00:00") | if length == 5 then . + ":00" else . end) as $t
                    | (($m.z // "Z") | if . == "Z" or . == "UTC" then 0
                        else (.[1:] | gsub(":"; "")) as $o
                          | ((if (.[0:1]) == "-" then -1 else 1 end)
                             * (($o[0:2] | tonumber) * 3600 + ((if ($o | length) >= 4 then $o[2:4] else "00" end) | tonumber) * 60))
                        end) as $off
                    | ((($m.d + "T" + $t + "Z") | fromdateiso8601) - $off) * 1000
                      + (((($m.f // "") + "000")[0:3]) | tonumber)
                  end
              end
            else null end;

          # API log v1.1.0 (current producer) nests request/response/actor;
          # flatten it to the legacy v1.0.0 field names this mapping reads.
          (if (.request | type) == "object" then
             { id: .request.request_id, timestamp: .timestamp,
               user_email: (.actor.email // .actor.name),
               resource: .request.resource, method: .request.method,
               status: .response.status, client_info: .request.user_agent,
               client_ip: (.request.ip | if type == "string" then (split(",")[0] | gsub("^\\s+|\\s+$"; "")) else . end),
               log_version: .version }
           else . end)
          # Pipeline logs carry no HTTP request and are not API Activity.
          | if .method == null then . else
          {
            "activity_id": (
              if .method == "GET" then 2      # Read
              elif .method == "POST" then 1    # Create
              elif .method == "PATCH" then 3   # Update
              elif .method == "PUT" then 3     # Update
              elif .method == "DELETE" then 4  # Delete
              else 99                         # Other
              end
            ),
            "time": to_epoch_ms(.timestamp),
            "actor": {
              "user": {
                "email": .user_email
              }
            },
            "api": {
              "operation": .method,
              "request": {
                "uid": .id,
                "protocol": "HTTP",
                "method": .method,
                "url": .resource
              },
              "response": {
                "status_code": .status
              }
            },
            "src_endpoint": {
              "ip": .client_ip
            },
            "user_agent": .client_info,
            "metadata": {
              "product": {
                "name": "Monad",
                "version": .log_version,
                "vendor_name": "Monad"
              },
              "version": "1.0.0"
            },
            "cloud": {
              "provider": "Monad"
            },
            "severity_id": 0,
            "type_uid": (6003 * 100 + (
              if .method == "GET" then 2      # Read
              elif .method == "POST" then 1    # Create
              elif .method == "PATCH" then 3   # Update
              elif .method == "PUT" then 3     # Update
              elif .method == "DELETE" then 4  # Delete
              else 99                         # Other
              end
            )),
            "category_uid": 6,
            "class_uid": 6003
          }
          end
