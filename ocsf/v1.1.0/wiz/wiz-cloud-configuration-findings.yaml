name: "Wiz Cloud Config Findings to OCSF"
description: "Transforms Wiz Cloud Config Findings into OCSF Schema"
author: "Monad"
contributors:
  - "https://github.com/Credgate"
inputs:
  - "wiz-cloud-configuration-findings"
tags:
  - "v1.1.0"
  - "ocsf"
  - "wiz"
  - "cloud"
  - "configuration"
config:
  operations:
    - operation: "jq"
      arguments:
        key: ""
        query: |
          def to_epoch_ms($ts):
            def _num_ms($n):
              if   $n >= 1e17 then ($n / 1000000 | floor)
              elif $n >= 1e14 then ($n / 1000 | floor)
              elif $n >= 1e11 then ($n | floor)
              else ($n * 1000 | floor) end;
            if $ts == null or $ts == "" then null
            elif ($ts | type) == "number" then _num_ms($ts)
            elif ($ts | type) == "object" then
              (if ($ts.seconds // null) == null then null
               else ($ts.seconds * 1000 + ((($ts.nanos // 0) / 1000000) | floor)) end)
            elif ($ts | type) == "string" then
              if ($ts | test("^-?[0-9]+(\\.[0-9]+)?$")) then _num_ms($ts | tonumber)
              else
                ([$ts | ascii_upcase | capture("^(?<d>[0-9]{4}-[0-9]{2}-[0-9]{2})(?:[T ](?<t>[0-9]{2}:[0-9]{2}(?::[0-9]{2})?)(?:[.,](?<f>[0-9]+))?)? ?(?<z>Z|UTC|[+-][0-9]{2}(?::?[0-9]{2})?)?$")] | first) as $m
                | if $m == null then null
                  else
                    (($m.t // "00:00:00") | if length == 5 then . + ":00" else . end) as $t
                    | (($m.z // "Z") | if . == "Z" or . == "UTC" then 0
                        else (.[1:] | gsub(":"; "")) as $o
                          | ((if (.[0:1]) == "-" then -1 else 1 end)
                             * (($o[0:2] | tonumber) * 3600 + ((if ($o | length) >= 4 then $o[2:4] else "00" end) | tonumber) * 60))
                        end) as $off
                    | ((($m.d + "T" + $t + "Z") | fromdateiso8601) - $off) * 1000
                      + (((($m.f // "") + "000")[0:3]) | tonumber)
                  end
              end
            else null end;

          {
            # Required OCSF Fields
            "category_uid": 2,
            "class_uid": 2003,
            "time": to_epoch_ms(.firstSeenAt),
            "type_uid": 200302,
            "activity_id": 2,
          
            # Name fields
            "category_name": "Findings",
            "class_name": "Compliance Finding",
            "type_name": "Compliance Finding: Update",
            "activity_name": "Update",
          
            # Severity mapping
            "severity": .severity,
            "severity_id": (
              if .severity == "MEDIUM" then 3 
              elif .severity == "HIGH" then 4 
              elif .severity == "LOW" then 2
              else 0 
              end
            ),
          
            # Finding Info
            "finding_info": {
              "title": (.rule.name // null),
              "uid": .id,
              "desc": (.rule.description // null),
              "created_time": to_epoch_ms(.firstSeenAt),
              "modified_time": to_epoch_ms(.updatedAt),
              "types": [
                "configuration"
              ]
            },
          
            # Metadata
            "metadata": {
              "product": {
                "name": "Wiz",
                "vendor_name": "Wiz",
                "version": "1.0"
              },
              "version": "1.1.0"
            },
          
            # Message and Resource details
            "message": (.rule.name // null),
            "resource": {
              "type": (.resource.type // null),
              "uid": (.resource.id // null),
              "name": (.resource.name // null),
              "labels": (if .resource.labels then (.resource.labels | to_entries | map(.value)) else [] end),
              "owner": (.resource | if .owner then {
                "name": (.owner // null),
                "uid": (.ownerId // null),
                "type_id": (
                  if .ownerType == "ADMIN" then 2
                  elif .ownerType == "SYSTEM" then 3
                  elif .ownerType == "USER" then 1
                  else 0 
                  end
                ),
                "type": (.ownerType // null)
              } else null end),
              "cloud": {
                "provider": (.resource.cloudPlatform // null),
                "account": {
                  "uid": (.resource.subscription.externalId // null)
                },
                "region": (.resource.region // null)
              }
            },
          
            # Remediation and Status
            "remediation": (.remediation // null),
            "status": (.status // null),
            "status_id": (
              if .status == "OPEN" then 1
              elif .status == "RESOLVED" then 4
              else 0 
              end
            ),
          
            # Raw data and Observables
            "raw_data": (. | tostring),
            "observables": [{
              "name": "resource_id",
              "value": (.targetExternalId // null),
              "type": "Resource UID",
              "type_id": 10
            }]
          }