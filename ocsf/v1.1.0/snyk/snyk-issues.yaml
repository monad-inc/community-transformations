name: "Snyk Issue Findings to OCSF"
description: "Transforms Snyk Issue Findings into OCSF Schema"
author: "Monad"
contributors:
  - "https://github.com/Credgate"
inputs:
  - "snyk-issues"
tags:
  - "v1.1.0"
  - "ocsf"
  - "snyk"
  - "vulnerability"
config:
  operations:
    - operation: "jq"
      arguments:
        key: ""
        query: |
          def to_epoch_ms($ts):
            def _num_ms($n):
              if   $n >= 1e17 then ($n / 1000000 | floor)
              elif $n >= 1e14 then ($n / 1000 | floor)
              elif $n >= 1e11 then ($n | floor)
              else ($n * 1000 | floor) end;
            if $ts == null or $ts == "" then null
            elif ($ts | type) == "number" then _num_ms($ts)
            elif ($ts | type) == "object" then
              (if ($ts.seconds // null) == null then null
               else ($ts.seconds * 1000 + ((($ts.nanos // 0) / 1000000) | floor)) end)
            elif ($ts | type) == "string" then
              if ($ts | test("^-?[0-9]+(\\.[0-9]+)?$")) then _num_ms($ts | tonumber)
              else
                ([$ts | ascii_upcase | capture("^(?<d>[0-9]{4}-[0-9]{2}-[0-9]{2})(?:[T ](?<t>[0-9]{2}:[0-9]{2}(?::[0-9]{2})?)(?:[.,](?<f>[0-9]+))?)? ?(?<z>Z|UTC|[+-][0-9]{2}(?::?[0-9]{2})?)?$")] | first) as $m
                | if $m == null then null
                  else
                    (($m.t // "00:00:00") | if length == 5 then . + ":00" else . end) as $t
                    | (($m.z // "Z") | if . == "Z" or . == "UTC" then 0
                        else (.[1:] | gsub(":"; "")) as $o
                          | ((if (.[0:1]) == "-" then -1 else 1 end)
                             * (($o[0:2] | tonumber) * 3600 + ((if ($o | length) >= 4 then $o[2:4] else "00" end) | tonumber) * 60))
                        end) as $off
                    | ((($m.d + "T" + $t + "Z") | fromdateiso8601) - $off) * 1000
                      + (((($m.f // "") + "000")[0:3]) | tonumber)
                  end
              end
            else null end;

          {
            "class_uid": 2002, # Vulnerability Finding
            "category_uid": 2, # Findings
            "activity_id": 2, # Update
            "type_uid": 200202, # Vulnerability Finding: Update
            "time": (to_epoch_ms(.attributes.created_at) // 0),
            "severity_id": (
              {
                "info": 1,
                "low": 2,
                "medium": 3,
                "high": 4,
                "critical": 5
              }[.attributes.effective_severity_level] // 0
            ),
            "finding_info": {
              "uid": .id,
              "title": .attributes.title,
              "type": .attributes.type,
              "status": .attributes.status,
              "created_time": (to_epoch_ms(.attributes.created_at) // 0),
              "updated_time": (to_epoch_ms(.attributes.updated_at) // 0)
            },
            "raw_data": (. | tostring),
            "metadata": {
              "product": {
                "name": "Snyk",
                "vendor_name": "Snyk"
              },
              "version": "1.1.0"
            },
            "vulnerabilities": [
              {
                "uid": .attributes.problems[0].id,
                "name": .attributes.title,
                "severity": .attributes.effective_severity_level,
                "component": {
                  "name": .attributes.coordinates[0].representations[0].dependency.package_name,
                  "version": .attributes.coordinates[0].representations[0].dependency.package_version
                }
              }
            ]
          }