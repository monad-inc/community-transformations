name: "Microsoft Sentinel compliant schema"
description: "Transforms incoming data's schema to rename Azure Sentinel reserved keywords. This transform is not guaranteed to contain all possible keywords preserved by Azure Sentinel."
author: "Monad"
contributors:
  - "https://github.com/mon-aneesh"
tags:
  - "v1.1.0"
  - "microsoft"
  - "azure"
  - "sentinel"
config:
    operations:
      - operation: "jq"
        arguments:
            key: ""
            query: |
                def to_epoch_ms($ts):
                  def _num_ms($n):
                    if   $n >= 1e17 then ($n / 1000000 | floor)
                    elif $n >= 1e14 then ($n / 1000 | floor)
                    elif $n >= 1e11 then ($n | floor)
                    else ($n * 1000 | floor) end;
                  if $ts == null or $ts == "" then null
                  elif ($ts | type) == "number" then _num_ms($ts)
                  elif ($ts | type) == "object" then
                    (if ($ts.seconds // null) == null then null
                     else ($ts.seconds * 1000 + ((($ts.nanos // 0) / 1000000) | floor)) end)
                  elif ($ts | type) == "string" then
                    if ($ts | test("^-?[0-9]+(\\.[0-9]+)?$")) then _num_ms($ts | tonumber)
                    else
                      ([$ts | ascii_upcase | capture("^(?<d>[0-9]{4}-[0-9]{2}-[0-9]{2})(?:[T ](?<t>[0-9]{2}:[0-9]{2}(?::[0-9]{2})?)(?:[.,](?<f>[0-9]+))?)? ?(?<z>Z|UTC|[+-][0-9]{2}(?::?[0-9]{2})?)?$")] | first) as $m
                      | if $m == null then null
                        else
                          (($m.t // "00:00:00") | if length == 5 then . + ":00" else . end) as $t
                          | (($m.z // "Z") | if . == "Z" or . == "UTC" then 0
                              else (.[1:] | gsub(":"; "")) as $o
                                | ((if (.[0:1]) == "-" then -1 else 1 end)
                                   * (($o[0:2] | tonumber) * 3600 + ((if ($o | length) >= 4 then $o[2:4] else "00" end) | tonumber) * 60))
                              end) as $off
                          | ((($m.d + "T" + $t + "Z") | fromdateiso8601) - $off) * 1000
                            + (((($m.f // "") + "000")[0:3]) | tonumber)
                        end
                    end
                  else null end;

                if has("kind") then
                    .source_kind = .kind | del(.kind)
                end
                | 
                if has("type") then
                    .source_type = .type | del(.type)
                end
                | 
                if has("uuid") then
                    .source_uuid = .uuid | del(.uuid)
                end
                | 
                if has("output") then
                    .source_output = .output | del(.output)
                end
                |
                if has("scan") then
                    .source_scan = .scan | del(.scan)
                end
                |
                if has("id") then
                    .source_id = .id | del(.id)
                end
