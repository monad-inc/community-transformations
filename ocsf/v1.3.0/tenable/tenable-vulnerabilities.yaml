name: "Tenable Vulnerability Findings to OCSF v1.3.0"
description: "Transforms Tenable Vulnerability Findings into the OCSF v1.3.0 Vulnerability Finding class."
author: "Monad"
contributors:
  - "https://github.com/behobu"
inputs:
  - "tenable-vulnerabilities"
  - "tenable-vulnerabilities-cron"
tags:
  - "v1.3.0"
  - "ocsf"
  - "tenable"
  - "vulnerability"
  - "findings"
config:
  operations:
    - operation: "jq"
      arguments:
        key: ""
        query: |
          # ---------------------------------------------------------------
          # OCSF Vulnerability Finding (class_uid=2002) — v1.3.0
          # Input: one Tenable VM vulnerability export record per invocation.
          # ---------------------------------------------------------------
          # OCSF severity_id from a source severity: a label (case-insensitive) or a
          # 0-10 score using the CVSS qualitative ranges (0 None -> 1, <4 Low, <7 Medium,
          # <9 High, else Critical). 0 for null/empty/"unknown"; 99 for an unrecognized
          # label (then keep the source label in `severity`). Map vendor-specific
          # numeric scales (e.g. 1-5) explicitly instead.
          def sev_to_id($s):
            def _score($n):
              if $n < 0 or $n > 10 then 99
              elif $n == 0 then 1 elif $n < 4 then 2 elif $n < 7 then 3 elif $n < 9 then 4
              else 5 end;
            if $s == null then 0
            elif ($s | type) == "number" then _score($s)
            elif ($s | type) != "string" then 99
            else
              ($s | ascii_downcase | sub("^\\s+"; "") | sub("\\s+$"; "")) as $l
              | if $l == "" or $l == "unknown" or $l == "unspecified" or $l == "untriaged" then 0
                elif ($l | test("^[0-9]+(\\.[0-9]+)?$")) then _score($l | tonumber)
                else
                  {"info":1,"informational":1,"information":1,"none":1,"notice":1,"debug":1,"trace":1,
                   "low":2,"minor":2,
                   "medium":3,"moderate":3,"middle":3,"warning":3,"warn":3,
                   "high":4,"major":4,"important":4,"error":4,
                   "critical":5,"crit":5,"severe":5,"alert":5,
                   "fatal":6,"emergency":6,"emerg":6}[$l] // 99
                end
            end;

          # OCSF status caption for a status_id, using the same $kind as status_to_id
          # ("event" also covers the remediation classes' extra values). null outside
          # the enum or for an unknown $kind.
          def status_caption($id; $kind):
            {"event": {"0":"Unknown","1":"Success","2":"Failure","3":"Does Not Exist","4":"Partial",
                       "5":"Unsupported","6":"Error","99":"Other"},
             "finding": {"0":"Unknown","1":"New","2":"In Progress","3":"Suppressed","4":"Resolved",
                         "5":"Archived","6":"Deleted","99":"Other"},
             "incident": {"0":"Unknown","1":"New","2":"In Progress","3":"On Hold","4":"Resolved",
                          "5":"Closed","99":"Other"}}[$kind][$id | tostring];


          # Tenable timestamps carry fractional seconds + Z (e.g.
          # "2026-05-29T20:37:16.102395Z"); strip the fraction before parsing.

          def to_epoch_ms($ts):
            def _n: if . == null then null else tonumber end;
            def _num_ms($n):
              if   $n >= 1e17 then ($n / 1000000 | floor)
              elif $n >= 1e14 then ($n / 1000 | floor)
              elif $n >= 1e11 then ($n | floor)
              else ($n * 1000 + 0.001 | floor) end;
            def _digits_ms($d):
              ($d | ltrimstr("-") | length) as $l
              | if   $l >= 18 then ($d[0:-6] | tonumber)
                elif $l >= 15 then ($d[0:-3] | tonumber)
                elif $l >= 12 then ($d | tonumber)
                else ($d | tonumber) * 1000 end;
            def _frac_ms($f): if $f == null then 0 else (($f + "000")[0:3] | tonumber) end;
            def _mon($m):
              if $m == null then null
              else {"JAN":1,"FEB":2,"MAR":3,"APR":4,"MAY":5,"JUN":6,
                    "JUL":7,"AUG":8,"SEP":9,"OCT":10,"NOV":11,"DEC":12}[$m[0:3]] end;
            def _zone($z):
              if $z == null or $z == "" then 0
              else
                ($z | if test("^(UTC|GMT|UT)[+-]") then sub("^(UTC|GMT|UT)"; "") else . end) as $z
                | if ($z | test("^[+-][0-9]{1,2}(:?[0-9]{2})?$")) then
                    ($z | capture("^(?<sg>[+-])(?<h>[0-9]{1,2}):?(?<m>[0-9]{2})?$")) as $o
                    | (if $o.sg == "-" then -1 else 1 end)
                      * (($o.h | tonumber) * 3600 + (($o.m // "0") | tonumber) * 60)
                  else
                    {"Z":0,"UTC":0,"GMT":0,"UT":0,"EST":-18000,"EDT":-14400,"CST":-21600,
                     "CDT":-18000,"MST":-25200,"MDT":-21600,"PST":-28800,"PDT":-25200}[$z]
                  end
              end;
            def _ms($c):
              ($c.y | tonumber | if . < 100 then (if . < 70 then . + 2000 else . + 1900 end) else . end) as $y
              | ($c.mo | _n) as $mo
              | ($c.d | tonumber) as $d
              | (($c.h // "0") | tonumber) as $h
              | (($c.mi // "0") | tonumber) as $mi
              | (($c.s // "0") | tonumber) as $s
              | _zone($c.z) as $off
              | if $mo == null or $off == null or $mo < 1 or $mo > 12 or $d < 1 or $d > 31
                   or $h > 23 or $mi > 59 or $s > 60 then null
                else
                  ($y - (if $mo <= 2 then 1 else 0 end)) as $yy
                  | ($yy / 400 | floor) as $era
                  | ($yy - $era * 400) as $yoe
                  | (((153 * ($mo + (if $mo > 2 then -3 else 9 end)) + 2) / 5 | floor) + $d - 1) as $doy
                  | ($yoe * 365 + ($yoe / 4 | floor) - ($yoe / 100 | floor) + $doy) as $doe
                  | ($era * 146097 + $doe - 719468) as $days
                  | ($days * 86400 + $h * 3600 + $mi * 60 + $s - $off) * 1000 + _frac_ms($c.f)
                end;
            def _str($raw):
              ($raw | ascii_upcase | sub("\\s*\\([^)]*\\)\\s*$"; "") | sub("^\\s+"; "") | sub("\\s+$"; "")) as $s
              | "(?<z>Z|(?:UTC|GMT|UT)?[+-][0-9]{1,2}(?::?[0-9]{2})?|[A-Z]{1,5})" as $Z
              | "(?<h>[0-9]{1,2}):(?<mi>[0-9]{2})(?::(?<s>[0-9]{2}))?(?:[.,](?<f>[0-9]+))?" as $T
              | if $s == "" then null
                elif ($s | test("^-?[0-9]+$")) then _digits_ms($s)
                elif ($s | test("^[0-9]+\\.[0-9]+$")) then
                  ($s | split(".")) as $p
                  | if ($p[0] | length) <= 11 then _digits_ms($p[0]) + _frac_ms($p[1])
                    else _digits_ms($p[0]) end
                elif ($s | test("^/DATE\\(-?[0-9]+([+-][0-9]{4})?\\)/$")) then
                  ($s | capture("(?<ms>-?[0-9]+)").ms | tonumber)
                else
                  first(
                    ($s | capture("^(?<y>[0-9]{4})[-/](?<mo>[0-9]{1,2})[-/](?<d>[0-9]{1,2})(?:[T ]+" + $T + ")?\\s*" + $Z + "?(?:\\s+[A-Z]{2,5})?$") | _ms(.)),
                    ($s | capture("^(?<y>[0-9]{4})(?<mo>[0-9]{2})(?<d>[0-9]{2})T(?<h>[0-9]{2})(?<mi>[0-9]{2})(?<s>[0-9]{2})(?:[.,](?<f>[0-9]+))?" + $Z + "?$") | _ms(.)),
                    ($s | capture("^(?:[A-Z]+,?\\s+)?(?<d>[0-9]{1,2})[ -](?<mon>[A-Z]{3,9})[ -](?<y>[0-9]{2,4})\\s+" + $T + "\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?:[A-Z]+,?\\s+)?(?<mon>[A-Z]{3,9})\\.?\\s+(?<d>[0-9]{1,2}),?\\s+(?<y>[0-9]{4})(?:,?\\s+" + $T + ")?\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?:[A-Z]+\\s+)?(?<mon>[A-Z]{3,9})\\s+(?<d>[0-9]{1,2})\\s+" + $T + "\\s+(?:" + $Z + "\\s+)?(?<y>[0-9]{4})$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?<d>[0-9]{1,2})/(?<mon>[A-Z]{3})/(?<y>[0-9]{4}):" + $T + "\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.))
                  ) // null
                end;
            if $ts == null then null
            elif ($ts | type) == "number" then _num_ms($ts)
            elif ($ts | type) == "string" then _str($ts)
            elif ($ts | type) == "object" then
              if   $ts["$date"] != null then to_epoch_ms($ts["$date"])
              elif $ts["$numberLong"] != null then to_epoch_ms($ts["$numberLong"])
              elif $ts.seconds != null then
                ($ts.seconds | tostring | tonumber) * 1000
                + ((($ts.nanos // 0) | tostring | tonumber) / 1000000 | floor)
              else null end
            else null end;

          def trim: if . == null then null else (. | gsub("^\\s+|\\s+$"; "")) end;

          # Tenable severity label -> OCSF severity_id. Derived from the
          # human-readable `severity` string; the numeric severity_id Tenable
          # emits is its own scale and is preserved verbatim in raw_data.
          def sev_caption($id):
            {"0":"Unknown","1":"Informational","2":"Low","3":"Medium","4":"High",
             "5":"Critical","6":"Fatal","99":"Other"}[$id | tostring];

          # Tenable finding state -> OCSF status_id (+ caption for the sibling).
          def state_to_status_id:
            (. // "" | ascii_upcase) as $s |
            if   $s == "OPEN"     then 1   # New
            elif $s == "REOPENED" then 2   # In Progress
            elif $s == "FIXED"    then 4   # Resolved
            else 99 end;

          # Build one OCSF CVSS object, omitting the optional vector when absent.
          def mk_cvss($ver; $score; $vec):
            {"version": $ver, "base_score": $score}
            + (if $vec != null then {"vector_string": $vec} else {} end);

          # Shared inputs reused across the vulnerabilities array and observables.
          (.plugin // {}) as $p |
          (.asset // {}) as $a |
          ($p.see_also // []) as $refs |

          # CVEs: union of plugin.cve (already "CVE-..."-prefixed) and any CVE
          # cross-references (which arrive bare, e.g. "2024-0741").
          ((($p.cve // []) + [ ($p.xrefs // [])[] | select(.type == "CVE") | "CVE-" + (.id | ltrimstr("CVE-")) ]) | unique) as $cves |
          # CWEs from cross-references, if any.
          ([ ($p.xrefs // [])[] | select(.type == "CWE") | "CWE-" + (.id | ltrimstr("CWE-")) ] | unique) as $cwes |

          ([ (if $p.cvss3_base_score != null
                then mk_cvss("3.0"; $p.cvss3_base_score; ($p.cvss3_vector.raw)) else empty end),
             (if $p.cvss_base_score != null
                then mk_cvss("2.0"; $p.cvss_base_score; ($p.cvss_vector.raw)) else empty end) ]) as $cvss |

          # The base vulnerability object (shared by every entry in this record).
          ({
            "title": $p.name,
            "desc": ($p.description // $p.synopsis),
            "severity": (.severity | trim),
            "references": $refs,
            "is_exploit_available": ($p.exploit_available // false),
            "is_fix_available": ($p.has_patch // false),
            "first_seen_time": to_epoch_ms(.first_found),
            "last_seen_time": to_epoch_ms(.last_found),
            "remediation": { "desc": ($p.solution // "") }
          }) as $base_vuln |

          # The shared CVE object (uid is filled per-entry below).
          ({
            "references": $refs,
            "created_time": to_epoch_ms($p.vuln_publication_date)
          } + (if ($cvss | length) > 0 then {"cvss": $cvss} else {} end)) as $cve_base |

          sev_to_id(.severity) as $sev_id |
          (.state | state_to_status_id) as $status_id |

          {
            # --- Classification (REQUIRED) ---
            "category_uid": 2,
            "class_uid": 2002,
            "type_uid": 200201,
            "activity_id": 1,

            # --- Severity (REQUIRED); sibling string set to OCSF caption ---
            "severity_id": $sev_id,
            "severity": sev_caption($sev_id),

            # --- Time (REQUIRED) ---
            "time": to_epoch_ms(.scan.started_at),

            # --- Status; raw Tenable state preserved in status_detail ---
            "status_id": $status_id,
            "status": status_caption($status_id; "finding"),
            "status_detail": .state,

            # --- Metadata (REQUIRED) ---
            "metadata": {
              "version": "1.3.0",
              "product": {
                "vendor_name": "Tenable",
                "name": "Tenable Vulnerability Management"
              },
              "uid": .scan.uuid,
              "logged_time": to_epoch_ms(.indexed)
            },

            # --- Finding Info (REQUIRED) ---
            "finding_info": {
              "uid": ($p.id | tostring),
              "title": $p.name,
              "desc": ($p.synopsis // $p.description),
              "first_seen_time": to_epoch_ms(.first_found),
              "last_seen_time": to_epoch_ms(.last_found),
              "created_time": to_epoch_ms($p.publication_date),
              "modified_time": to_epoch_ms($p.modification_date),
              "src_url": ($refs | first),
              "types": ["Vulnerability"]
            },

            # --- Vulnerabilities (REQUIRED) ---
            # The OCSF `vulnerability` object carries an `at_least_one:
            # [cve, cwe]` constraint in v1.3.0. Emit one entry per CVE; if a
            # plugin reports no CVE, fall back to CWE. (The `advisory` object
            # used as a last resort in v1.4.0+ does not exist in this version,
            # so a record with neither a CVE nor a CWE cannot satisfy the
            # constraint — such records are rare in Tenable vulnerability data.)
            "vulnerabilities": (
              if ($cves | length) > 0 then
                [ $cves[] as $id | $base_vuln + { "cve": ($cve_base + { "uid": $id }) } ]
              elif ($cwes | length) > 0 then
                [ $cwes[] as $id | $base_vuln + { "cwe": { "uid": $id } } ]
              else
                [ $base_vuln ]
              end
            ),

            # --- Recommended: generic resource + plural resources ---
            "resource": {
              "type": "host",
              "name": ($a.hostname // $a.fqdn),
              "uid": $a.uuid,
              "labels": ($a.operating_system // [])
            },
            "resources": [{
              "type": "host",
              "name": ($a.hostname // $a.fqdn),
              "uid": $a.uuid,
              "labels": ($a.operating_system // [])
            }],

            # --- Recommended: observables (natural pivots) ---
            "observables": [
              ( $cves[]? | { "name": "vulnerabilities.cve.uid", "type": "CVE Object: uid", "type_id": 18, "value": . } ),
              (if ($a.hostname // $a.fqdn) != null
                then { "name": "device.hostname", "type": "Hostname", "type_id": 1, "value": ($a.hostname // $a.fqdn) } else empty end),
              (if $a.ipv4 != null
                then { "name": "device.ip", "type": "IP Address", "type_id": 2, "value": $a.ipv4 } else empty end),
              (if $a.mac_address != null
                then { "name": "device.mac", "type": "MAC Address", "type_id": 3, "value": $a.mac_address } else empty end)
            ],

            # --- Original record for audit / debugging ---
            "raw_data": (. | tostring)
          }
          # Drop any keys that resolved to null so the event carries only
          # populated attributes (the OCSF validator rejects null-typed values).
          | del(.. | nulls)
