name: "Cloudflare DNS Records to CEF"
description: "Maps Cloudflare DNS Records inventory into the normalized {_cef:{...}} CEF intermediate. Chain the shared CEF Serializer (utility/cef/cef-serializer.yaml) after this to render the CEF:0 string."
author: "Monad"
contributors:
  - "https://github.com/behobu"
inputs:
  - "cloudflare-dns-records"
tags:
  - "v0"
  - "cef"
  - "cloudflare"
  - "dns-records"
config:
  operations:
    - operation: "jq"
      arguments:
        key: ""
        query: |
          # ---------------------------------------------------------------
          # Cloudflare DNS Records -> CEF intermediate (T1).
          # No escaping here — the shared CEF Serializer (T2) owns escaping.
          # Final-form values: severity 0-10, times epoch-MILLISECONDS,
          # cs*/cn* slots always paired with their *Label. One jq pass;
          # shallow null-drop on the extension object.
          # ---------------------------------------------------------------
          def to_epoch_ms($ts):
            def _num_ms($n):
              if   $n >= 1e17 then ($n / 1000000 | floor)
              elif $n >= 1e14 then ($n / 1000 | floor)
              elif $n >= 1e11 then ($n | floor)
              else ($n * 1000 | floor) end;
            if $ts == null or $ts == "" then null
            elif ($ts | type) == "number" then _num_ms($ts)
            elif ($ts | type) == "object" then
              (if ($ts.seconds // null) == null then null
               else ($ts.seconds * 1000 + ((($ts.nanos // 0) / 1000000) | floor)) end)
            elif ($ts | type) == "string" then
              if ($ts | test("^-?[0-9]+(\\.[0-9]+)?$")) then _num_ms($ts | tonumber)
              else
                ([$ts | ascii_upcase | capture("^(?<d>[0-9]{4}-[0-9]{2}-[0-9]{2})(?:[T ](?<t>[0-9]{2}:[0-9]{2}(?::[0-9]{2})?)(?:[.,](?<f>[0-9]+))?)? ?(?<z>Z|UTC|[+-][0-9]{2}(?::?[0-9]{2})?)?$")] | first) as $m
                | if $m == null then null
                  else
                    (($m.t // "00:00:00") | if length == 5 then . + ":00" else . end) as $t
                    | (($m.z // "Z") | if . == "Z" or . == "UTC" then 0
                        else (.[1:] | gsub(":"; "")) as $o
                          | ((if (.[0:1]) == "-" then -1 else 1 end)
                             * (($o[0:2] | tonumber) * 3600 + ((if ($o | length) >= 4 then $o[2:4] else "00" end) | tonumber) * 60))
                        end) as $off
                    | ((($m.d + "T" + $t + "Z") | fromdateiso8601) - $off) * 1000
                      + (((($m.f // "") + "000")[0:3]) | tonumber)
                  end
              end
            else null end;
          def is_ip($s):
            def _v4: test("^((25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\\.){3}(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])$");
            def _v6:
              if test("^[0-9A-Fa-f:.]+$") | not then false
              else
                (if test("\\.")
                 then (split(":") | last) as $t
                   | if ($t | _v4) then .[0:length - ($t | length)] + "0:0" else "x" end
                 else . end) as $h
                | ($h | split("::")) as $p
                | if ($p | length) > 2 then false
                  else ([$p[] | if . == "" then empty else split(":")[] end]) as $g
                    | ($g | all(test("^[0-9A-Fa-f]{1,4}$")))
                      and (if ($p | length) == 2 then ($g | length) <= 7 else ($g | length) == 8 end)
                  end
              end;
            ($s | type) == "string" and ($s | _v4 or _v6);

          . as $r
          | ($r.content // null) as $content
          | { _cef: {
              vendor: "Cloudflare",
              product: "Cloudflare DNS",
              version: "",
              signature_id: ("dns.record." + ($r.type // "UNKNOWN")),
              name: ("Cloudflare DNS " + ($r.type // "") + " record: " + ($r.name // "")),
              severity: 2,
              extension: ( {
                rt:    to_epoch_ms($r.modified_on),
                start: to_epoch_ms($r.created_on),
                dhost: $r.name,
                dst:   (if is_ip($content) then $content else null end),
                externalId: $r.id,
                outcome: "SUCCESS",
                cn1: $r.ttl,
                cn1Label: (if $r.ttl != null then "ttl" else null end),
                cs1: $r.type,
                cs1Label: (if $r.type != null then "recordType" else null end),
                cs2: $r.zone_name,
                cs2Label: (if $r.zone_name != null then "zoneName" else null end),
                cs3: $content,
                cs3Label: (if $content != null then "content" else null end),
                cs4: (if $r.proxied != null then ($r.proxied | tostring) else null end),
                cs4Label: (if $r.proxied != null then "proxied" else null end),
                cs5: $r.zone_id,
                cs5Label: (if $r.zone_id != null then "zoneId" else null end),
                cs6: (if ($r.tags // []) | length > 0 then ($r.tags | join(",")) else null end),
                cs6Label: (if ($r.tags // []) | length > 0 then "tags" else null end)
              } | with_entries(select(.value != null and .value != "")) )
          } }
