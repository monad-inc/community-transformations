name: "Cloudflare Rulesets to CEF"
description: "Maps Cloudflare Rulesets inventory records into the normalized {_cef:{...}} CEF intermediate. Chain the shared CEF Serializer (utility/cef/cef-serializer.yaml) after this to render the CEF:0 string."
author: "Monad"
contributors:
  - "https://github.com/behobu"
inputs:
  - "cloudflare-rulesets"
tags:
  - "v0"
  - "cef"
  - "cloudflare"
  - "rulesets"
config:
  operations:
    - operation: "jq"
      arguments:
        key: ""
        query: |
          # ---------------------------------------------------------------
          # Cloudflare Rulesets -> CEF intermediate (T1). No escaping here;
          # the shared serializer (T2) owns all escaping. Emit FINAL-FORM:
          #   severity int 0-10; times epoch-MS; cs*/cn* paired with *Label.
          # Inventory records are informational -> severity 2.
          # ---------------------------------------------------------------
          def to_epoch_ms($ts):
            def _num_ms($n):
              if   $n >= 1e17 then ($n / 1000000 | floor)
              elif $n >= 1e14 then ($n / 1000 | floor)
              elif $n >= 1e11 then ($n | floor)
              else ($n * 1000 | floor) end;
            if $ts == null or $ts == "" then null
            elif ($ts | type) == "number" then _num_ms($ts)
            elif ($ts | type) == "object" then
              (if ($ts.seconds // null) == null then null
               else ($ts.seconds * 1000 + ((($ts.nanos // 0) / 1000000) | floor)) end)
            elif ($ts | type) == "string" then
              if ($ts | test("^-?[0-9]+(\\.[0-9]+)?$")) then _num_ms($ts | tonumber)
              else
                ([$ts | ascii_upcase | capture("^(?<d>[0-9]{4}-[0-9]{2}-[0-9]{2})(?:[T ](?<t>[0-9]{2}:[0-9]{2}(?::[0-9]{2})?)(?:[.,](?<f>[0-9]+))?)? ?(?<z>Z|UTC|[+-][0-9]{2}(?::?[0-9]{2})?)?$")] | first) as $m
                | if $m == null then null
                  else
                    (($m.t // "00:00:00") | if length == 5 then . + ":00" else . end) as $t
                    | (($m.z // "Z") | if . == "Z" or . == "UTC" then 0
                        else (.[1:] | gsub(":"; "")) as $o
                          | ((if (.[0:1]) == "-" then -1 else 1 end)
                             * (($o[0:2] | tonumber) * 3600 + ((if ($o | length) >= 4 then $o[2:4] else "00" end) | tonumber) * 60))
                        end) as $off
                    | ((($m.d + "T" + $t + "Z") | fromdateiso8601) - $off) * 1000
                      + (((($m.f // "") + "000")[0:3]) | tonumber)
                  end
              end
            else null end;

          . as $r
          | ($r.rules // []) as $rules
          | { _cef: {
              vendor: "Cloudflare",
              product: "Cloudflare Rulesets",
              version: ($r.version // ""),
              signature_id: ($r.phase // "ruleset"),
              name: ("Cloudflare ruleset: " + ($r.name // $r.id // "unknown")),
              severity: 2,
              extension: ( {
                rt:         to_epoch_ms($r.last_updated),
                externalId: $r.id,
                msg:        ($r.description // $r.name),
                cat:        "Asset Inventory",
                cs1Label: "rulesetKind",  cs1: $r.kind,
                cs2Label: "rulesetPhase", cs2: $r.phase,
                cs3Label: "rulesetName",  cs3: $r.name,
                cs4Label: "zoneId",       cs4: $r.zone_id,
                cs5Label: "accountId",    cs5: $r.account_id,
                cn1Label: "ruleCount",    cn1: ($rules | length)
              } | with_entries(select(.value != null and .value != "")) )
          } }
