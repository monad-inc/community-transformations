name: "Cloudflare Zero Trust Access Requests to CEF"
description: "Maps Cloudflare Zero Trust Access authentication (access_requests) logs into the normalized {_cef:{...}} CEF intermediate. Chain the shared CEF Serializer (utility/cef/cef-serializer.yaml) after this to render the CEF:0 string."
author: "Monad"
contributors:
  - "https://github.com/behobu"
inputs:
  - "cloudflare-zerotrust-access-requests"
tags:
  - "v0"
  - "cef"
  - "cloudflare"
  - "access-requests"
config:
  operations:
    - operation: "jq"
      arguments:
        key: ""
        query: |
          # ---------------------------------------------------------------
          # Cloudflare Zero Trust Access access_requests -> CEF intermediate (T1).
          # No escaping here (the shared serializer owns it). Final-form values:
          #   severity int 0-10; times epoch-MS; custom slots paired with *Label.
          # ---------------------------------------------------------------
          def to_epoch_ms($ts):
            def _num_ms($n):
              if   $n >= 1e17 then ($n / 1000000 | floor)
              elif $n >= 1e14 then ($n / 1000 | floor)
              elif $n >= 1e11 then ($n | floor)
              else ($n * 1000 | floor) end;
            if $ts == null or $ts == "" then null
            elif ($ts | type) == "number" then _num_ms($ts)
            elif ($ts | type) == "object" then
              (if ($ts.seconds // null) == null then null
               else ($ts.seconds * 1000 + ((($ts.nanos // 0) / 1000000) | floor)) end)
            elif ($ts | type) == "string" then
              if ($ts | test("^-?[0-9]+(\\.[0-9]+)?$")) then _num_ms($ts | tonumber)
              else
                ([$ts | ascii_upcase | capture("^(?<d>[0-9]{4}-[0-9]{2}-[0-9]{2})(?:[T ](?<t>[0-9]{2}:[0-9]{2}(?::[0-9]{2})?)(?:[.,](?<f>[0-9]+))?)? ?(?<z>Z|UTC|[+-][0-9]{2}(?::?[0-9]{2})?)?$")] | first) as $m
                | if $m == null then null
                  else
                    (($m.t // "00:00:00") | if length == 5 then . + ":00" else . end) as $t
                    | (($m.z // "Z") | if . == "Z" or . == "UTC" then 0
                        else (.[1:] | gsub(":"; "")) as $o
                          | ((if (.[0:1]) == "-" then -1 else 1 end)
                             * (($o[0:2] | tonumber) * 3600 + ((if ($o | length) >= 4 then $o[2:4] else "00" end) | tonumber) * 60))
                        end) as $off
                    | ((($m.d + "T" + $t + "Z") | fromdateiso8601) - $off) * 1000
                      + (((($m.f // "") + "000")[0:3]) | tonumber)
                  end
              end
            else null end;

          . as $r
          | (if $r.allowed == true then "SUCCESS"
             elif $r.allowed == false then "FAILURE"
             else "UNKNOWN" end) as $outcome
          | (if $r.allowed == false then 6 else 2 end) as $sev
          | { _cef: {
              vendor: "Cloudflare",
              product: "Cloudflare Zero Trust Access",
              version: "",
              signature_id: ($r.action // "access_request"),
              name: ("Cloudflare Access " + ($r.action // "request")
                     + " (" + ($outcome | ascii_downcase) + ")"),
              severity: $sev,
              extension: ( {
                rt:      to_epoch_ms($r.created_at),
                suser:   $r.user_email,
                src:     $r.ip_address,
                dhost:   $r.app_domain,
                request: $r.app_domain,
                act:     $r.action,
                outcome: $outcome,
                cs1Label: "idp",     cs1: $r.connection,
                cs2Label: "appUid",  cs2: $r.app_uid,
                cs3Label: "rayId",   cs3: $r.ray_id
              } | with_entries(select(.value != null and .value != "")) )
          } }
