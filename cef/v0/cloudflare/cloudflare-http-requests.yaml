name: "Cloudflare HTTP Requests to CEF"
description: "Maps Cloudflare HTTP Requests (Logpush http_requests) records into the normalized {_cef:{...}} CEF intermediate. Chain the shared CEF Serializer (utility/cef/cef-serializer.yaml) after this to render the CEF:0 string."
author: "Monad"
contributors:
  - "https://github.com/behobu"
inputs:
  - "cloudflare-http-requests"
tags:
  - "v0"
  - "cef"
  - "cloudflare"
  - "http-requests"
config:
  operations:
    - operation: "jq"
      arguments:
        key: ""
        query: |
          # ---------------------------------------------------------------
          # Cloudflare HTTP Requests -> CEF intermediate (T1).
          # No escaping here — the shared CEF Serializer (T2) owns escaping.
          # Final-form values: severity int 0-10; rt epoch-MILLISECONDS;
          # every cs*/cn* slot paired with its *Label. One jq pass; shallow
          # null-drop on the extension object (no recursive walk).
          # ---------------------------------------------------------------
          def to_epoch_ms($ts):
            def _n: if . == null then null else tonumber end;
            def _num_ms($n):
              if   $n >= 1e17 then ($n / 1000000 | floor)
              elif $n >= 1e14 then ($n / 1000 | floor)
              elif $n >= 1e11 then ($n | floor)
              else ($n * 1000 + 0.001 | floor) end;
            def _digits_ms($d):
              ($d | ltrimstr("-") | length) as $l
              | if   $l >= 18 then ($d[0:-6] | tonumber)
                elif $l >= 15 then ($d[0:-3] | tonumber)
                elif $l >= 12 then ($d | tonumber)
                else ($d | tonumber) * 1000 end;
            def _frac_ms($f): if $f == null then 0 else (($f + "000")[0:3] | tonumber) end;
            def _mon($m):
              if $m == null then null
              else {"JAN":1,"FEB":2,"MAR":3,"APR":4,"MAY":5,"JUN":6,
                    "JUL":7,"AUG":8,"SEP":9,"OCT":10,"NOV":11,"DEC":12}[$m[0:3]] end;
            def _zone($z):
              if $z == null or $z == "" then 0
              else
                ($z | if test("^(UTC|GMT|UT)[+-]") then sub("^(UTC|GMT|UT)"; "") else . end) as $z
                | if ($z | test("^[+-][0-9]{1,2}(:?[0-9]{2})?$")) then
                    ($z | capture("^(?<sg>[+-])(?<h>[0-9]{1,2}):?(?<m>[0-9]{2})?$")) as $o
                    | (if $o.sg == "-" then -1 else 1 end)
                      * (($o.h | tonumber) * 3600 + (($o.m // "0") | tonumber) * 60)
                  else
                    {"Z":0,"UTC":0,"GMT":0,"UT":0,"EST":-18000,"EDT":-14400,"CST":-21600,
                     "CDT":-18000,"MST":-25200,"MDT":-21600,"PST":-28800,"PDT":-25200}[$z]
                  end
              end;
            def _ms($c):
              ($c.y | tonumber | if . < 100 then (if . < 70 then . + 2000 else . + 1900 end) else . end) as $y
              | ($c.mo | _n) as $mo
              | ($c.d | tonumber) as $d
              | (($c.h // "0") | tonumber) as $h
              | (($c.mi // "0") | tonumber) as $mi
              | (($c.s // "0") | tonumber) as $s
              | _zone($c.z) as $off
              | if $mo == null or $off == null or $mo < 1 or $mo > 12 or $d < 1 or $d > 31
                   or $h > 23 or $mi > 59 or $s > 60 then null
                else
                  ($y - (if $mo <= 2 then 1 else 0 end)) as $yy
                  | ($yy / 400 | floor) as $era
                  | ($yy - $era * 400) as $yoe
                  | (((153 * ($mo + (if $mo > 2 then -3 else 9 end)) + 2) / 5 | floor) + $d - 1) as $doy
                  | ($yoe * 365 + ($yoe / 4 | floor) - ($yoe / 100 | floor) + $doy) as $doe
                  | ($era * 146097 + $doe - 719468) as $days
                  | ($days * 86400 + $h * 3600 + $mi * 60 + $s - $off) * 1000 + _frac_ms($c.f)
                end;
            def _str($raw):
              ($raw | ascii_upcase | sub("\\s*\\([^)]*\\)\\s*$"; "") | sub("^\\s+"; "") | sub("\\s+$"; "")) as $s
              | "(?<z>Z|(?:UTC|GMT|UT)?[+-][0-9]{1,2}(?::?[0-9]{2})?|[A-Z]{1,5})" as $Z
              | "(?<h>[0-9]{1,2}):(?<mi>[0-9]{2})(?::(?<s>[0-9]{2}))?(?:[.,](?<f>[0-9]+))?" as $T
              | if $s == "" then null
                elif ($s | test("^-?[0-9]+$")) then _digits_ms($s)
                elif ($s | test("^[0-9]+\\.[0-9]+$")) then
                  ($s | split(".")) as $p
                  | if ($p[0] | length) <= 11 then _digits_ms($p[0]) + _frac_ms($p[1])
                    else _digits_ms($p[0]) end
                elif ($s | test("^/DATE\\(-?[0-9]+([+-][0-9]{4})?\\)/$")) then
                  ($s | capture("(?<ms>-?[0-9]+)").ms | tonumber)
                else
                  first(
                    ($s | capture("^(?<y>[0-9]{4})[-/](?<mo>[0-9]{1,2})[-/](?<d>[0-9]{1,2})(?:[T ]+" + $T + ")?\\s*" + $Z + "?(?:\\s+[A-Z]{2,5})?$") | _ms(.)),
                    ($s | capture("^(?<y>[0-9]{4})(?<mo>[0-9]{2})(?<d>[0-9]{2})T(?<h>[0-9]{2})(?<mi>[0-9]{2})(?<s>[0-9]{2})(?:[.,](?<f>[0-9]+))?" + $Z + "?$") | _ms(.)),
                    ($s | capture("^(?:[A-Z]+,?\\s+)?(?<d>[0-9]{1,2})[ -](?<mon>[A-Z]{3,9})[ -](?<y>[0-9]{2,4})\\s+" + $T + "\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?:[A-Z]+,?\\s+)?(?<mon>[A-Z]{3,9})\\.?\\s+(?<d>[0-9]{1,2}),?\\s+(?<y>[0-9]{4})(?:,?\\s+" + $T + ")?\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?:[A-Z]+\\s+)?(?<mon>[A-Z]{3,9})\\s+(?<d>[0-9]{1,2})\\s+" + $T + "\\s+(?:" + $Z + "\\s+)?(?<y>[0-9]{4})$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?<d>[0-9]{1,2})/(?<mon>[A-Z]{3})/(?<y>[0-9]{4}):" + $T + "\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.))
                  ) // null
                end;
            if $ts == null then null
            elif ($ts | type) == "number" then _num_ms($ts)
            elif ($ts | type) == "string" then _str($ts)
            elif ($ts | type) == "object" then
              if   $ts["$date"] != null then to_epoch_ms($ts["$date"])
              elif $ts["$numberLong"] != null then to_epoch_ms($ts["$numberLong"])
              elif $ts.seconds != null then
                ($ts.seconds | tostring | tonumber) * 1000
                + ((($ts.nanos // 0) | tostring | tonumber) / 1000000 | floor)
              else null end
            else null end;

          . as $r
          | ( ($r.EdgeResponseStatus // 0) | if type == "string" then tonumber else . end ) as $status
          | ( ($r.SecurityAction // "") | ascii_downcase ) as $sec_action
          | ( ($sec_action | test("block|challenge|drop|jschallenge|managed_challenge")) ) as $is_security
          | {
              _cef: {
                vendor: "Cloudflare",
                product: "Cloudflare HTTP Requests",
                version: "",
                # Low-cardinality event type: the security action when one fired,
                # otherwise a generic request signature.
                signature_id: ( if $sec_action != "" then $sec_action else "http.request" end ),
                name: ( $r.SecurityRuleDescription
                        // ( [ ($r.ClientRequestMethod // "GET"),
                               ($r.ClientRequestHost // ""),
                               ("(" + ($status | tostring) + ")") ] | join(" ") ) ),
                severity: ( if ($sec_action | test("block|drop")) then 8
                            elif ($sec_action | test("challenge")) then 6
                            elif $status >= 500 then 6
                            elif $status >= 400 then 4
                            else 2 end ),
                extension: ( {
                  rt:      to_epoch_ms($r.EdgeStartTimestamp),
                  end:     to_epoch_ms($r.EdgeEndTimestamp),
                  src:     $r.ClientIP,
                  spt:     $r.ClientSrcPort,
                  dst:     $r.OriginIP,
                  dhost:   $r.ClientRequestHost,
                  app:     $r.ClientRequestScheme,
                  requestMethod: $r.ClientRequestMethod,
                  request: ( if $r.ClientRequestScheme != null and $r.ClientRequestHost != null and $r.ClientRequestURI != null
                             then ($r.ClientRequestScheme + "://" + $r.ClientRequestHost + $r.ClientRequestURI)
                             else $r.ClientRequestURI end ),
                  requestClientApplication: $r.ClientRequestUserAgent,
                  "in":    $r.ClientRequestBytes,
                  "out":   $r.EdgeResponseBytes,
                  act:     $r.SecurityAction,
                  outcome: ( if $is_security or $status >= 400 then "FAILURE"
                             elif $status > 0 then "SUCCESS" else null end ),
                  # Custom slots — each *Label is gated on its value so a
                  # missing value never leaves an orphan label behind.
                  cn1: ( if $status > 0 then $status else null end ),
                  cn1Label: ( if $status > 0 then "httpResponseStatus" else null end ),
                  cn2: $r.WAFAttackScore,
                  cn2Label: ( if $r.WAFAttackScore != null then "wafAttackScore" else null end ),
                  cn3: $r.BotScore,
                  cn3Label: ( if $r.BotScore != null then "botScore" else null end ),
                  cs1: $r.RayID,
                  cs1Label: ( if $r.RayID != null then "rayId" else null end ),
                  cs2: ( $r.ClientCountry | if . == null then null else ascii_upcase end ),
                  cs2Label: ( if $r.ClientCountry != null then "clientCountry" else null end ),
                  cs3: $r.SecurityRuleID,
                  cs3Label: ( if $r.SecurityRuleID != null then "securityRuleId" else null end ),
                  cs4: $r.JA3Hash,
                  cs4Label: ( if $r.JA3Hash != null then "ja3Hash" else null end ),
                  cs5: $r.EdgeColoCode,
                  cs5Label: ( if $r.EdgeColoCode != null then "edgeColo" else null end ),
                  cs6: $r.CacheCacheStatus,
                  cs6Label: ( if $r.CacheCacheStatus != null then "cacheStatus" else null end )
                } | with_entries(select(.value != null and .value != "")) )
              }
            }
