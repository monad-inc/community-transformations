name: "Tenable Assets to CEF"
description: "Maps Tenable Vulnerability Management asset inventory records into the normalized {_cef:{...}} CEF intermediate. Chain the shared CEF Serializer (utility/cef/cef-serializer.yaml) after this to render the CEF:0 string."
author: "Monad"
contributors:
  - "https://github.com/behobu"
inputs:
  - "tenable-assets"
  - "tenable-assets-cron"
tags:
  - "v0"
  - "cef"
  - "tenable"
  - "asset"
  - "inventory"
config:
  operations:
    - operation: "jq"
      arguments:
        key: ""
        query: |
          # Tenable asset inventory -> CEF intermediate (T1). No escaping here —
          # the shared CEF Serializer (T2) owns all escaping. Emit FINAL-FORM
          # values: severity int 0-10; times epoch-MILLISECONDS; custom slots
          # cs* paired with their *Label. One jq pass; shallow null-drop.
          def to_epoch_ms($ts):
            def _num_ms($n):
              if   $n >= 1e17 then ($n / 1000000 | floor)
              elif $n >= 1e14 then ($n / 1000 | floor)
              elif $n >= 1e11 then ($n | floor)
              else ($n * 1000 | floor) end;
            if $ts == null or $ts == "" then null
            elif ($ts | type) == "number" then _num_ms($ts)
            elif ($ts | type) == "object" then
              (if ($ts.seconds // null) == null then null
               else ($ts.seconds * 1000 + ((($ts.nanos // 0) / 1000000) | floor)) end)
            elif ($ts | type) == "string" then
              if ($ts | test("^-?[0-9]+(\\.[0-9]+)?$")) then _num_ms($ts | tonumber)
              else
                ([$ts | ascii_upcase | capture("^(?<d>[0-9]{4}-[0-9]{2}-[0-9]{2})(?:[T ](?<t>[0-9]{2}:[0-9]{2}(?::[0-9]{2})?)(?:[.,](?<f>[0-9]+))?)? ?(?<z>Z|UTC|[+-][0-9]{2}(?::?[0-9]{2})?)?$")] | first) as $m
                | if $m == null then null
                  else
                    (($m.t // "00:00:00") | if length == 5 then . + ":00" else . end) as $t
                    | (($m.z // "Z") | if . == "Z" or . == "UTC" then 0
                        else (.[1:] | gsub(":"; "")) as $o
                          | ((if (.[0:1]) == "-" then -1 else 1 end)
                             * (($o[0:2] | tonumber) * 3600 + ((if ($o | length) >= 4 then $o[2:4] else "00" end) | tonumber) * 60))
                        end) as $off
                    | ((($m.d + "T" + $t + "Z") | fromdateiso8601) - $off) * 1000
                      + (((($m.f // "") + "000")[0:3]) | tonumber)
                  end
              end
            else null end;
          . as $r |
          { _cef: {
              vendor: "Tenable",
              product: "Tenable Vulnerability Management",
              version: "",
              signature_id: "tenable:asset:inventory",
              name: "Tenable Asset Inventory",
              # Asset inventory snapshots are informational (CEF severity 2).
              severity: 2,
              extension: ( {
                rt:               to_epoch_ms($r.updated_at),
                start:            to_epoch_ms($r.first_seen),
                end:              to_epoch_ms($r.last_seen),
                externalId:       $r.id,
                dhost:            (($r.hostnames // [])[0]),
                dst:              (($r.ipv4s // [])[0]),
                dmac:             (($r.mac_addresses // [])[0]),
                act:              "inventory",
                cs1Label:         "operatingSystem",
                cs1:              (($r.operating_systems // [])[0]),
                cs2Label:         "systemType",
                cs2:              (($r.system_types // [])[0]),
                cs3Label:         "cloudRegion",
                cs3:              $r.aws_region,
                cs4Label:         "cloudInstanceId",
                cs4:              $r.aws_ec2_instance_id,
                cs5Label:         "fqdn",
                cs5:              (($r.fqdns // [])[0]),
                cn1Label:         "exposureScore",
                cn1:              $r.exposure_score
              } | with_entries(select(.value != null and .value != "")) )
          } }
