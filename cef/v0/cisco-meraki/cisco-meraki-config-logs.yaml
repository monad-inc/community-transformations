name: "Cisco Meraki Configuration Changes to CEF"
description: "Maps Cisco Meraki Dashboard configuration change (audit) records into the normalized {_cef:{...}} CEF intermediate. Chain the shared CEF Serializer (utility/cef/cef-serializer.yaml) after this to render the CEF:0 string."
author: "Monad"
contributors:
  - "https://github.com/behobu"
inputs:
  - "cisco-meraki-config-logs"
tags:
  - "v0"
  - "cef"
  - "cisco-meraki"
  - "config-logs"
config:
  operations:
    - operation: "jq"
      arguments:
        key: ""
        query: |
          # ---------------------------------------------------------------
          # Cisco Meraki Dashboard configurationChanges -> CEF intermediate (T1).
          # No escaping here (the shared serializer owns it). Times epoch-ms;
          # custom cs*/cn* slots always paired with their *Label. One jq pass;
          # shallow null-drop on the extension object only.
          # ---------------------------------------------------------------
          def to_epoch_ms($ts):
            def _num_ms($n):
              if   $n >= 1e17 then ($n / 1000000 | floor)
              elif $n >= 1e14 then ($n / 1000 | floor)
              elif $n >= 1e11 then ($n | floor)
              else ($n * 1000 | floor) end;
            if $ts == null or $ts == "" then null
            elif ($ts | type) == "number" then _num_ms($ts)
            elif ($ts | type) == "object" then
              (if ($ts.seconds // null) == null then null
               else ($ts.seconds * 1000 + ((($ts.nanos // 0) / 1000000) | floor)) end)
            elif ($ts | type) == "string" then
              if ($ts | test("^-?[0-9]+(\\.[0-9]+)?$")) then _num_ms($ts | tonumber)
              else
                ([$ts | ascii_upcase | capture("^(?<d>[0-9]{4}-[0-9]{2}-[0-9]{2})(?:[T ](?<t>[0-9]{2}:[0-9]{2}(?::[0-9]{2})?)(?:[.,](?<f>[0-9]+))?)? ?(?<z>Z|UTC|[+-][0-9]{2}(?::?[0-9]{2})?)?$")] | first) as $m
                | if $m == null then null
                  else
                    (($m.t // "00:00:00") | if length == 5 then . + ":00" else . end) as $t
                    | (($m.z // "Z") | if . == "Z" or . == "UTC" then 0
                        else (.[1:] | gsub(":"; "")) as $o
                          | ((if (.[0:1]) == "-" then -1 else 1 end)
                             * (($o[0:2] | tonumber) * 3600 + ((if ($o | length) >= 4 then $o[2:4] else "00" end) | tonumber) * 60))
                        end) as $off
                    | ((($m.d + "T" + $t + "Z") | fromdateiso8601) - $off) * 1000
                      + (((($m.f // "") + "000")[0:3]) | tonumber)
                  end
              end
            else null end;

          . as $r
          | { _cef: {
              vendor: "Cisco",
              product: "Meraki Dashboard",
              version: "",
              signature_id: "configuration_change",
              name: ($r.label // $r.page // "Configuration change"),
              severity: 2,
              extension: ( {
                rt:      to_epoch_ms($r.ts),
                suser:   $r.adminName,
                suid:    $r.adminId,
                act:     $r.page,
                outcome: "SUCCESS",
                deviceExternalId: $r.networkId,
                cs1Label: "label",       cs1: $r.label,
                cs2Label: "oldValue",    cs2: $r.oldValue,
                cs3Label: "newValue",    cs3: $r.newValue,
                cs4Label: "networkName", cs4: $r.networkName,
                cs5Label: "ssidName",    cs5: $r.ssidName,
                cs6Label: "adminEmail",  cs6: $r.adminEmail,
                cn1Label: "ssidNumber",  cn1: $r.ssidNumber
              } | with_entries(select(.value != null and .value != "")) )
          } }
