name: "Monad Organization Logs to CEF"
description: "Maps Monad Organization Logs (monad-logs) into the normalized {_cef:{...}} CEF intermediate. Chain the shared CEF Serializer (utility/cef/cef-serializer.yaml) after this to render the CEF:0 string."
author: "Monad"
contributors:
  - "https://github.com/behobu"
inputs:
  - "monad-logs"
tags:
  - "v0"
  - "cef"
  - "monad"
  - "organization"
  - "logs"
config:
  operations:
    - operation: "jq"
      arguments:
        key: ""
        query: |
          # Monad Organization Logs -> CEF intermediate (T1). No escaping here —
          # the shared CEF Serializer (T2) owns all escaping. Emit FINAL-FORM values:
          #   severity: integer 0-10; time fields: epoch-MILLISECONDS;
          #   custom slots cs*/cn* always paired with their *Label.
          . as $r
          | def to_epoch_ms($ts):
              def _num_ms($n):
                if   $n >= 1e17 then ($n / 1000000 | floor)
                elif $n >= 1e14 then ($n / 1000 | floor)
                elif $n >= 1e11 then ($n | floor)
                else ($n * 1000 | floor) end;
              if $ts == null or $ts == "" then null
              elif ($ts | type) == "number" then _num_ms($ts)
              elif ($ts | type) == "object" then
                (if ($ts.seconds // null) == null then null
                 else ($ts.seconds * 1000 + ((($ts.nanos // 0) / 1000000) | floor)) end)
              elif ($ts | type) == "string" then
                if ($ts | test("^-?[0-9]+(\\.[0-9]+)?$")) then _num_ms($ts | tonumber)
                else
                  ([$ts | ascii_upcase | capture("^(?<d>[0-9]{4}-[0-9]{2}-[0-9]{2})(?:[T ](?<t>[0-9]{2}:[0-9]{2}(?::[0-9]{2})?)(?:[.,](?<f>[0-9]+))?)? ?(?<z>Z|UTC|[+-][0-9]{2}(?::?[0-9]{2})?)?$")] | first) as $m
                  | if $m == null then null
                    else
                      (($m.t // "00:00:00") | if length == 5 then . + ":00" else . end) as $t
                      | (($m.z // "Z") | if . == "Z" or . == "UTC" then 0
                          else (.[1:] | gsub(":"; "")) as $o
                            | ((if (.[0:1]) == "-" then -1 else 1 end)
                               * (($o[0:2] | tonumber) * 3600 + ((if ($o | length) >= 4 then $o[2:4] else "00" end) | tonumber) * 60))
                          end) as $off
                      | ((($m.d + "T" + $t + "Z") | fromdateiso8601) - $off) * 1000
                        + (((($m.f // "") + "000")[0:3]) | tonumber)
                    end
                end
              else null end;
            ($r.status | tonumber) as $status
          | {
              _cef: {
                vendor: "Monad",
                product: "Monad Organization Logs",
                version: ($r.log_version // ""),
                signature_id: $r.method,
                name: ("Monad API " + $r.method + " " + $r.resource),
                severity: (
                  if   $status >= 500 then 8
                  elif $status >= 400 then 5
                  else 2
                  end
                ),
                extension: ({
                  rt: to_epoch_ms($r.timestamp),
                  suser: $r.user_email,
                  src: $r.client_ip,
                  requestMethod: $r.method,
                  request: $r.resource,
                  act: $r.method,
                  outcome: (if $status >= 200 and $status < 400 then "SUCCESS" else "FAILURE" end),
                  cn1: $status,
                  cn1Label: "httpStatusCode",
                  cs1: $r.log_version,
                  cs1Label: "logVersion",
                  cs2: $r.additional_info,
                  cs2Label: "additionalInfo",
                  cs3: $r.id,
                  cs3Label: "requestId"
                } | with_entries(select(.value != null and .value != "")))
              }
            }
