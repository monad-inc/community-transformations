name: "Semgrep Projects to CEF"
description: "Maps Semgrep project (scanned-repository) inventory records into the normalized {_cef:{...}} CEF intermediate. Chain the shared CEF Serializer (utility/cef/cef-serializer.yaml) after this to render the CEF:0 string."
author: "Monad"
contributors:
  - "https://github.com/behobu"
inputs:
  - "semgrep-projects"
tags:
  - "v0"
  - "cef"
  - "semgrep"
  - "projects"
config:
  operations:
    - operation: "jq"
      arguments:
        key: ""
        query: |
          # ---------------------------------------------------------------
          # Semgrep project inventory -> CEF intermediate (T1). No escaping —
          # the shared CEF Serializer (T2) owns all escaping. Emit final-form
          # values: severity 0-10, times epoch-MILLISECONDS, custom slots
          # paired with their *Label. One jq pass; shallow null-drop.
          # ---------------------------------------------------------------
          def to_epoch_ms($ts):
            def _num_ms($n):
              if   $n >= 1e17 then ($n / 1000000 | floor)
              elif $n >= 1e14 then ($n / 1000 | floor)
              elif $n >= 1e11 then ($n | floor)
              else ($n * 1000 | floor) end;
            if $ts == null or $ts == "" then null
            elif ($ts | type) == "number" then _num_ms($ts)
            elif ($ts | type) == "object" then
              (if ($ts.seconds // null) == null then null
               else ($ts.seconds * 1000 + ((($ts.nanos // 0) / 1000000) | floor)) end)
            elif ($ts | type) == "string" then
              if ($ts | test("^-?[0-9]+(\\.[0-9]+)?$")) then _num_ms($ts | tonumber)
              else
                ([$ts | ascii_upcase | capture("^(?<d>[0-9]{4}-[0-9]{2}-[0-9]{2})(?:[T ](?<t>[0-9]{2}:[0-9]{2}(?::[0-9]{2})?)(?:[.,](?<f>[0-9]+))?)? ?(?<z>Z|UTC|[+-][0-9]{2}(?::?[0-9]{2})?)?$")] | first) as $m
                | if $m == null then null
                  else
                    (($m.t // "00:00:00") | if length == 5 then . + ":00" else . end) as $t
                    | (($m.z // "Z") | if . == "Z" or . == "UTC" then 0
                        else (.[1:] | gsub(":"; "")) as $o
                          | ((if (.[0:1]) == "-" then -1 else 1 end)
                             * (($o[0:2] | tonumber) * 3600 + ((if ($o | length) >= 4 then $o[2:4] else "00" end) | tonumber) * 60))
                        end) as $off
                    | ((($m.d + "T" + $t + "Z") | fromdateiso8601) - $off) * 1000
                      + (((($m.f // "") + "000")[0:3]) | tonumber)
                  end
              end
            else null end;

          . as $r
          | ($r.tags // []) as $tags
          | { _cef: {
              vendor: "Semgrep",
              product: "Semgrep Cloud Platform",
              version: "",
              signature_id: "semgrep.project.inventory",
              name: ("Semgrep project inventory: " + ($r.name // "unknown")),
              severity: 2,
              extension: ( {
                rt:      to_epoch_ms($r.created_at),
                dvchost: $r.name,
                request: $r.url,
                act:     "collect",
                cn1Label: "projectId",
                cn1:     $r.id,
                cs1Label: "primaryBranch",
                cs1:     $r.primary_branch,
                cs2Label: "defaultBranch",
                cs2:     $r.default_branch,
                cs3Label: "tags",
                cs3:     (if ($tags | length) > 0 then ($tags | join(",")) else null end),
                deviceCustomDate1Label: "latestScanAt",
                deviceCustomDate1: to_epoch_ms($r.latest_scan_at)
              } | with_entries(select(.value != null and .value != "")) )
          } }
