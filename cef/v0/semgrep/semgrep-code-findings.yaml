name: "Semgrep Code Vulnerability Findings to CEF"
description: "Maps Semgrep Code Vulnerability Finding records into the normalized {_cef:{...}} CEF intermediate. Chain the shared CEF Serializer (utility/cef/cef-serializer.yaml) after this to render the CEF:0 string."
author: "Monad"
contributors:
  - "https://github.com/behobu"
inputs:
  - "semgrep-code-findings"
tags:
  - "v0"
  - "cef"
  - "semgrep"
  - "code"
  - "vulnerability"
  - "findings"
config:
  operations:
    - operation: "jq"
      arguments:
        key: ""
        query: |
          def to_epoch_ms($ts):
            def _num_ms($n):
              if   $n >= 1e17 then ($n / 1000000 | floor)
              elif $n >= 1e14 then ($n / 1000 | floor)
              elif $n >= 1e11 then ($n | floor)
              else ($n * 1000 | floor) end;
            if $ts == null or $ts == "" then null
            elif ($ts | type) == "number" then _num_ms($ts)
            elif ($ts | type) == "object" then
              (if ($ts.seconds // null) == null then null
               else ($ts.seconds * 1000 + ((($ts.nanos // 0) / 1000000) | floor)) end)
            elif ($ts | type) == "string" then
              if ($ts | test("^-?[0-9]+(\\.[0-9]+)?$")) then _num_ms($ts | tonumber)
              else
                ([$ts | ascii_upcase | capture("^(?<d>[0-9]{4}-[0-9]{2}-[0-9]{2})(?:[T ](?<t>[0-9]{2}:[0-9]{2}(?::[0-9]{2})?)(?:[.,](?<f>[0-9]+))?)? ?(?<z>Z|UTC|[+-][0-9]{2}(?::?[0-9]{2})?)?$")] | first) as $m
                | if $m == null then null
                  else
                    (($m.t // "00:00:00") | if length == 5 then . + ":00" else . end) as $t
                    | (($m.z // "Z") | if . == "Z" or . == "UTC" then 0
                        else (.[1:] | gsub(":"; "")) as $o
                          | ((if (.[0:1]) == "-" then -1 else 1 end)
                             * (($o[0:2] | tonumber) * 3600 + ((if ($o | length) >= 4 then $o[2:4] else "00" end) | tonumber) * 60))
                        end) as $off
                    | ((($m.d + "T" + $t + "Z") | fromdateiso8601) - $off) * 1000
                      + (((($m.f // "") + "000")[0:3]) | tonumber)
                  end
              end
            else null end;
          . as $r
          | ($r.severity // "" | ascii_downcase) as $sev
          | (($r.rule.cwe_names // []) | map(select(. != null))) as $cwes
          | ($cwes | map(split(":")[0] | ascii_upcase) | map(select(startswith("CWE"))) | first) as $cwe_id
          | ($r.location.file_path // "") as $fp
          | { _cef: {
              vendor: "Semgrep",
              product: "Semgrep Code",
              version: "",
              signature_id: ($r.rule_name // "semgrep.finding"),
              name: ($r.rule_message // $r.rule_name // "Semgrep code finding"),
              severity: ( if $sev == "critical" then 10
                          elif $sev == "high" then 8
                          elif $sev == "medium" then 6
                          elif $sev == "low" then 3
                          elif $sev == "info" then 1
                          else 0 end ),
              extension: ( {
                rt:       to_epoch_ms($r.created_at // $r.state_updated_at),
                msg:      ($r.rule_message // $r.rule_name),
                fname:    (if $fp != "" then ($fp | split("/")[-1]) else null end),
                filePath: (if $fp != "" then $fp else null end),
                request:  $r.line_of_code_url,
                outcome:  ($r.status // $r.state),
                cn1Label: "lineNumber",
                cn1:      $r.location.line,
                cn2Label: "findingId",
                cn2:      $r.id,
                cs1Label: "cwe",
                cs1:      $cwe_id,
                cs2Label: "owasp",
                cs2:      (($r.rule.owasp_names // []) | join(", ") | if . == "" then null else . end),
                cs3Label: "repository",
                cs3:      $r.repository.name,
                cs4Label: "confidence",
                cs4:      $r.confidence
              } | with_entries(select(.value != null and .value != "")) )
          } }
