name: "Anthropic Claude Code (OTLP) to CEF"
description: "Maps one OTLP log record from Claude Code into the normalized {_cef:{...}} CEF intermediate (Vendor Anthropic, Product Claude Code). Chain the shared CEF Serializer (utility/cef/cef-serializer.yaml) after this to render the CEF:0 string. signature_id is the low-cardinality event name; token counts and cost ride custom cn*/cs* slots with labels."
author: "Monad"
contributors:
  - "https://github.com/behobu"
inputs:
  - "anthropic-claude-code"
tags:
  - "v0"
  - "cef"
  - "anthropic"
  - "ai"
config:
  operations:
    - operation: "jq"
      arguments:
        key: ""
        query: |
          # ---------------------------------------------------------------
          # Anthropic Claude Code RAW OTLP logs -> CEF intermediate (T1).
          # One OTLP envelope in -> one _cef object (first logRecord).
          # Do NOT escape anything here — the shared CEF Serializer (T2)
          # owns all escaping. Emit FINAL-FORM values:
          #   - severity: integer 0-10
          #   - rt: epoch-MILLISECONDS
          #   - custom slots cs*/cn* ALWAYS paired with their *Label
          # One jq pass, per-record only; shallow with_entries null-drop.
          # ---------------------------------------------------------------
          def to_epoch_ms($ts):
            def _n: if . == null then null else tonumber end;
            def _num_ms($n):
              if   $n >= 1e17 then ($n / 1000000 | floor)
              elif $n >= 1e14 then ($n / 1000 | floor)
              elif $n >= 1e11 then ($n | floor)
              else ($n * 1000 + 0.001 | floor) end;
            def _digits_ms($d):
              ($d | ltrimstr("-") | length) as $l
              | if   $l >= 18 then ($d[0:-6] | tonumber)
                elif $l >= 15 then ($d[0:-3] | tonumber)
                elif $l >= 12 then ($d | tonumber)
                else ($d | tonumber) * 1000 end;
            def _frac_ms($f): if $f == null then 0 else (($f + "000")[0:3] | tonumber) end;
            def _mon($m):
              if $m == null then null
              else {"JAN":1,"FEB":2,"MAR":3,"APR":4,"MAY":5,"JUN":6,
                    "JUL":7,"AUG":8,"SEP":9,"OCT":10,"NOV":11,"DEC":12}[$m[0:3]] end;
            def _zone($z):
              if $z == null or $z == "" then 0
              else
                ($z | if test("^(UTC|GMT|UT)[+-]") then sub("^(UTC|GMT|UT)"; "") else . end) as $z
                | if ($z | test("^[+-][0-9]{1,2}(:?[0-9]{2})?$")) then
                    ($z | capture("^(?<sg>[+-])(?<h>[0-9]{1,2}):?(?<m>[0-9]{2})?$")) as $o
                    | (if $o.sg == "-" then -1 else 1 end)
                      * (($o.h | tonumber) * 3600 + (($o.m // "0") | tonumber) * 60)
                  else
                    {"Z":0,"UTC":0,"GMT":0,"UT":0,"EST":-18000,"EDT":-14400,"CST":-21600,
                     "CDT":-18000,"MST":-25200,"MDT":-21600,"PST":-28800,"PDT":-25200}[$z]
                  end
              end;
            def _ms($c):
              ($c.y | tonumber | if . < 100 then (if . < 70 then . + 2000 else . + 1900 end) else . end) as $y
              | ($c.mo | _n) as $mo
              | ($c.d | tonumber) as $d
              | (($c.h // "0") | tonumber) as $h
              | (($c.mi // "0") | tonumber) as $mi
              | (($c.s // "0") | tonumber) as $s
              | _zone($c.z) as $off
              | if $mo == null or $off == null or $mo < 1 or $mo > 12 or $d < 1 or $d > 31
                   or $h > 23 or $mi > 59 or $s > 60 then null
                else
                  ($y - (if $mo <= 2 then 1 else 0 end)) as $yy
                  | ($yy / 400 | floor) as $era
                  | ($yy - $era * 400) as $yoe
                  | (((153 * ($mo + (if $mo > 2 then -3 else 9 end)) + 2) / 5 | floor) + $d - 1) as $doy
                  | ($yoe * 365 + ($yoe / 4 | floor) - ($yoe / 100 | floor) + $doy) as $doe
                  | ($era * 146097 + $doe - 719468) as $days
                  | ($days * 86400 + $h * 3600 + $mi * 60 + $s - $off) * 1000 + _frac_ms($c.f)
                end;
            def _str($raw):
              ($raw | ascii_upcase | sub("\\s*\\([^)]*\\)\\s*$"; "") | sub("^\\s+"; "") | sub("\\s+$"; "")) as $s
              | "(?<z>Z|(?:UTC|GMT|UT)?[+-][0-9]{1,2}(?::?[0-9]{2})?|[A-Z]{1,5})" as $Z
              | "(?<h>[0-9]{1,2}):(?<mi>[0-9]{2})(?::(?<s>[0-9]{2}))?(?:[.,](?<f>[0-9]+))?" as $T
              | if $s == "" then null
                elif ($s | test("^-?[0-9]+$")) then _digits_ms($s)
                elif ($s | test("^[0-9]+\\.[0-9]+$")) then
                  ($s | split(".")) as $p
                  | if ($p[0] | length) <= 11 then _digits_ms($p[0]) + _frac_ms($p[1])
                    else _digits_ms($p[0]) end
                elif ($s | test("^/DATE\\(-?[0-9]+([+-][0-9]{4})?\\)/$")) then
                  ($s | capture("(?<ms>-?[0-9]+)").ms | tonumber)
                else
                  first(
                    ($s | capture("^(?<y>[0-9]{4})[-/](?<mo>[0-9]{1,2})[-/](?<d>[0-9]{1,2})(?:[T ]+" + $T + ")?\\s*" + $Z + "?(?:\\s+[A-Z]{2,5})?$") | _ms(.)),
                    ($s | capture("^(?<y>[0-9]{4})(?<mo>[0-9]{2})(?<d>[0-9]{2})T(?<h>[0-9]{2})(?<mi>[0-9]{2})(?<s>[0-9]{2})(?:[.,](?<f>[0-9]+))?" + $Z + "?$") | _ms(.)),
                    ($s | capture("^(?:[A-Z]+,?\\s+)?(?<d>[0-9]{1,2})[ -](?<mon>[A-Z]{3,9})[ -](?<y>[0-9]{2,4})\\s+" + $T + "\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?:[A-Z]+,?\\s+)?(?<mon>[A-Z]{3,9})\\.?\\s+(?<d>[0-9]{1,2}),?\\s+(?<y>[0-9]{4})(?:,?\\s+" + $T + ")?\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?:[A-Z]+\\s+)?(?<mon>[A-Z]{3,9})\\s+(?<d>[0-9]{1,2})\\s+" + $T + "\\s+(?:" + $Z + "\\s+)?(?<y>[0-9]{4})$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?<d>[0-9]{1,2})/(?<mon>[A-Z]{3})/(?<y>[0-9]{4}):" + $T + "\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.))
                  ) // null
                end;
            if $ts == null then null
            elif ($ts | type) == "number" then _num_ms($ts)
            elif ($ts | type) == "string" then _str($ts)
            elif ($ts | type) == "object" then
              if   $ts["$date"] != null then to_epoch_ms($ts["$date"])
              elif $ts["$numberLong"] != null then to_epoch_ms($ts["$numberLong"])
              elif $ts.seconds != null then
                ($ts.seconds | tostring | tonumber) * 1000
                + ((($ts.nanos // 0) | tostring | tonumber) / 1000000 | floor)
              else null end
            else null end;
          def nano2ms($n):
            if $n == null or $n == "" then null else (($n | tonumber) / 1000000 | floor) end;
          def truthy($v):
            ($v == true) or (($v | type) == "string" and ($v | ascii_downcase) == "true");

          def av($v):
            if $v == null then null
            elif $v.stringValue != null then $v.stringValue
            elif $v.intValue != null then ($v.intValue | tonumber)
            elif $v.doubleValue != null then $v.doubleValue
            elif $v.boolValue != null then $v.boolValue
            elif $v.arrayValue != null then ((($v.arrayValue.values) // []) | map(av(.)))
            elif $v.kvlistValue != null then
              (reduce ((($v.kvlistValue.values) // [])[]) as $a ({}; .[$a.key] = av($a.value)))
            else null end;
          def kv($arr): reduce (($arr // [])[]) as $a ({}; .[$a.key] = av($a.value));

          [ (.resourceLogs // [])[] as $rl
            | kv($rl.resource.attributes) as $res
            | ($rl.scopeLogs // [])[] as $sl
            | ($sl.logRecords // [])[] as $lr
            | ($res + kv($lr.attributes)) as $r
            | ( ($lr.body.stringValue) as $b
                | if ($b != null and ($b | startswith("claude_code."))) then $b
                  elif (($r["event.name"]) // "") != "" then ("claude_code." + $r["event.name"])
                  else ($b // "claude_code.unknown") end ) as $en
            | (if (($r["event.timestamp"]) // "") != "" then to_epoch_ms($r["event.timestamp"])
               else nano2ms($lr.timeUnixNano) end) as $rt

            # outcome + severity buckets (0-10)
            | ( if ($en == "claude_code.api_error" or $en == "claude_code.api_refusal"
                    or $en == "claude_code.internal_error") then "FAILURE"
                elif ($r["success"] != null) then (if truthy($r["success"]) then "SUCCESS" else "FAILURE" end)
                elif ($r["status"] == "failed") then "FAILURE"
                else "SUCCESS" end ) as $outcome
            | ( if $en == "claude_code.internal_error" then 7
                elif ($outcome == "FAILURE") then 6
                elif $en == "claude_code.auth" then 4
                else 2 end ) as $sev
            | (($r["input_tokens"] // 0) + ($r["output_tokens"] // 0)
               + ($r["cache_read_tokens"] // 0) + ($r["cache_creation_tokens"] // 0)) as $total_tokens

            | { _cef: {
                  vendor: "Anthropic",
                  product: "Claude Code",
                  version: (($r["app.version"]) // ($r["service.version"]) // ""),
                  signature_id: $en,
                  name: ($en | ltrimstr("claude_code.")),
                  severity: $sev,
                  extension: ( {
                    rt: $rt,
                    suser: $r["user.email"],
                    suid: ($r["user.account_uuid"] // $r["user.id"]),
                    dhost: $r["terminal.type"],
                    act: ($en | ltrimstr("claude_code.")),
                    outcome: $outcome,
                    app: "claude-code",
                    dvchost: $r["terminal.type"],
                    reason: ($r["error"] // $r["error_type"] // $r["error_category"]),
                    externalId: $r["request_id"],
                    # --- custom slots (each paired with its *Label) ---
                    cs1Label: "model",            cs1: $r["model"],
                    cs2Label: "sessionId",        cs2: $r["session.id"],
                    cs3Label: "organizationId",   cs3: $r["organization.id"],
                    cs4Label: "querySource",      cs4: $r["query_source"],
                    cn1Label: "inputTokens",      cn1: $r["input_tokens"],
                    cn2Label: "outputTokens",     cn2: $r["output_tokens"],
                    cn3Label: "totalTokens",      cn3: (if $total_tokens > 0 then $total_tokens else null end),
                    cfp1Label: "costUsd",         cfp1: $r["cost_usd"],
                    flexNumber1Label: "durationMs", flexNumber1: $r["duration_ms"]
                  } | with_entries(select(.value != null and .value != "")) )
              } }
          ][0]
