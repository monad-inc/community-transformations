name: "Snyk Project Metadata to CEF"
description: "Maps Snyk Project Metadata into the normalized {_cef:{...}} CEF intermediate. Chain the shared CEF Serializer (utility/cef/cef-serializer.yaml) after this to render the CEF:0 string."
author: "Monad"
contributors:
  - "https://github.com/behobu"
inputs:
  - "snyk-projects"
tags:
  - "v0"
  - "cef"
  - "snyk"
  - "inventory"
config:
  operations:
    - operation: "jq"
      arguments:
        key: ""
        query: |
          # ---------------------------------------------------------------
          # Snyk /projects -> CEF intermediate (T1). NO escaping here.
          # severity: integer 0-10 ; rt: epoch-MILLISECONDS ;
          # custom slots cs*/cn* always paired with their *Label.
          # ---------------------------------------------------------------
          def to_epoch_ms($ts):
            def _num_ms($n):
              if   $n >= 1e17 then ($n / 1000000 | floor)
              elif $n >= 1e14 then ($n / 1000 | floor)
              elif $n >= 1e11 then ($n | floor)
              else ($n * 1000 | floor) end;
            if $ts == null or $ts == "" then null
            elif ($ts | type) == "number" then _num_ms($ts)
            elif ($ts | type) == "object" then
              (if ($ts.seconds // null) == null then null
               else ($ts.seconds * 1000 + ((($ts.nanos // 0) / 1000000) | floor)) end)
            elif ($ts | type) == "string" then
              if ($ts | test("^-?[0-9]+(\\.[0-9]+)?$")) then _num_ms($ts | tonumber)
              else
                ([$ts | ascii_upcase | capture("^(?<d>[0-9]{4}-[0-9]{2}-[0-9]{2})(?:[T ](?<t>[0-9]{2}:[0-9]{2}(?::[0-9]{2})?)(?:[.,](?<f>[0-9]+))?)? ?(?<z>Z|UTC|[+-][0-9]{2}(?::?[0-9]{2})?)?$")] | first) as $m
                | if $m == null then null
                  else
                    (($m.t // "00:00:00") | if length == 5 then . + ":00" else . end) as $t
                    | (($m.z // "Z") | if . == "Z" or . == "UTC" then 0
                        else (.[1:] | gsub(":"; "")) as $o
                          | ((if (.[0:1]) == "-" then -1 else 1 end)
                             * (($o[0:2] | tonumber) * 3600 + ((if ($o | length) >= 4 then $o[2:4] else "00" end) | tonumber) * 60))
                        end) as $off
                    | ((($m.d + "T" + $t + "Z") | fromdateiso8601) - $off) * 1000
                      + (((($m.f // "") + "000")[0:3]) | tonumber)
                  end
              end
            else null end;

          . as $r
          | ($r.attributes // {}) as $a
          | ( ($a.business_criticality // []) | if type == "array" then .[0] else . end ) as $crit
          | { _cef: {
              vendor: "Snyk",
              product: "Snyk",
              version: "",
              signature_id: "project",
              name: ($a.name // "Snyk Project"),
              severity: (
                { "low": 3, "medium": 5, "high": 8, "critical": 10 }[$crit // ""] // 0
              ),
              extension: ( {
                rt:         to_epoch_ms($a.created),
                externalId: $r.id,
                fname:      $a.target_file,
                msg:        $a.name,
                cs1Label: "projectType",         cs1: $a.type,
                cs2Label: "origin",              cs2: $a.origin,
                cs3Label: "status",              cs3: $a.status,
                cs4Label: "businessCriticality", cs4: $crit,
                cs5Label: "environment",         cs5: (($a.environment // []) | if type == "array" then join(",") else . end),
                cs6Label: "lifecycle",           cs6: (($a.lifecycle // []) | if type == "array" then join(",") else . end)
              } | with_entries(select(.value != null and .value != "")) )
          } }
