name: "Google Workspace Login Activity to CEF"
description: "Maps Google Workspace (Admin SDK Reports API) login activity records into the normalized {_cef:{...}} CEF intermediate. Chain the shared CEF Serializer (utility/cef/cef-serializer.yaml) after this to render the CEF:0 string."
author: "Monad"
contributors:
  - "https://github.com/behobu"
inputs:
  - "google-workspace-login-activity"
tags:
  - "v0"
  - "cef"
  - "google"
  - "login"
config:
  operations:
    - operation: "jq"
      arguments:
        key: ""
        query: |
          # ---------------------------------------------------------------
          # Google Workspace login activity -> CEF intermediate (T1).
          # No escaping here — the shared CEF Serializer (T2) owns it.
          # Emit FINAL-FORM values: severity int 0-10, times epoch-MS,
          # custom slots paired with their *Label.
          # ---------------------------------------------------------------
          def to_epoch_ms($ts):
            def _n: if . == null then null else tonumber end;
            def _num_ms($n):
              if   $n >= 1e17 then ($n / 1000000 | floor)
              elif $n >= 1e14 then ($n / 1000 | floor)
              elif $n >= 1e11 then ($n | floor)
              else ($n * 1000 + 0.001 | floor) end;
            def _digits_ms($d):
              ($d | ltrimstr("-") | length) as $l
              | if   $l >= 18 then ($d[0:-6] | tonumber)
                elif $l >= 15 then ($d[0:-3] | tonumber)
                elif $l >= 12 then ($d | tonumber)
                else ($d | tonumber) * 1000 end;
            def _frac_ms($f): if $f == null then 0 else (($f + "000")[0:3] | tonumber) end;
            def _mon($m):
              if $m == null then null
              else {"JAN":1,"FEB":2,"MAR":3,"APR":4,"MAY":5,"JUN":6,
                    "JUL":7,"AUG":8,"SEP":9,"OCT":10,"NOV":11,"DEC":12}[$m[0:3]] end;
            def _zone($z):
              if $z == null or $z == "" then 0
              else
                ($z | if test("^(UTC|GMT|UT)[+-]") then sub("^(UTC|GMT|UT)"; "") else . end) as $z
                | if ($z | test("^[+-][0-9]{1,2}(:?[0-9]{2})?$")) then
                    ($z | capture("^(?<sg>[+-])(?<h>[0-9]{1,2}):?(?<m>[0-9]{2})?$")) as $o
                    | (if $o.sg == "-" then -1 else 1 end)
                      * (($o.h | tonumber) * 3600 + (($o.m // "0") | tonumber) * 60)
                  else
                    {"Z":0,"UTC":0,"GMT":0,"UT":0,"EST":-18000,"EDT":-14400,"CST":-21600,
                     "CDT":-18000,"MST":-25200,"MDT":-21600,"PST":-28800,"PDT":-25200}[$z]
                  end
              end;
            def _ms($c):
              ($c.y | tonumber | if . < 100 then (if . < 70 then . + 2000 else . + 1900 end) else . end) as $y
              | ($c.mo | _n) as $mo
              | ($c.d | tonumber) as $d
              | (($c.h // "0") | tonumber) as $h
              | (($c.mi // "0") | tonumber) as $mi
              | (($c.s // "0") | tonumber) as $s
              | _zone($c.z) as $off
              | if $mo == null or $off == null or $mo < 1 or $mo > 12 or $d < 1 or $d > 31
                   or $h > 23 or $mi > 59 or $s > 60 then null
                else
                  ($y - (if $mo <= 2 then 1 else 0 end)) as $yy
                  | ($yy / 400 | floor) as $era
                  | ($yy - $era * 400) as $yoe
                  | (((153 * ($mo + (if $mo > 2 then -3 else 9 end)) + 2) / 5 | floor) + $d - 1) as $doy
                  | ($yoe * 365 + ($yoe / 4 | floor) - ($yoe / 100 | floor) + $doy) as $doe
                  | ($era * 146097 + $doe - 719468) as $days
                  | ($days * 86400 + $h * 3600 + $mi * 60 + $s - $off) * 1000 + _frac_ms($c.f)
                end;
            def _str($raw):
              ($raw | ascii_upcase | sub("\\s*\\([^)]*\\)\\s*$"; "") | sub("^\\s+"; "") | sub("\\s+$"; "")) as $s
              | "(?<z>Z|(?:UTC|GMT|UT)?[+-][0-9]{1,2}(?::?[0-9]{2})?|[A-Z]{1,5})" as $Z
              | "(?<h>[0-9]{1,2}):(?<mi>[0-9]{2})(?::(?<s>[0-9]{2}))?(?:[.,](?<f>[0-9]+))?" as $T
              | if $s == "" then null
                elif ($s | test("^-?[0-9]+$")) then _digits_ms($s)
                elif ($s | test("^[0-9]+\\.[0-9]+$")) then
                  ($s | split(".")) as $p
                  | if ($p[0] | length) <= 11 then _digits_ms($p[0]) + _frac_ms($p[1])
                    else _digits_ms($p[0]) end
                elif ($s | test("^/DATE\\(-?[0-9]+([+-][0-9]{4})?\\)/$")) then
                  ($s | capture("(?<ms>-?[0-9]+)").ms | tonumber)
                else
                  first(
                    ($s | capture("^(?<y>[0-9]{4})[-/](?<mo>[0-9]{1,2})[-/](?<d>[0-9]{1,2})(?:[T ]+" + $T + ")?\\s*" + $Z + "?(?:\\s+[A-Z]{2,5})?$") | _ms(.)),
                    ($s | capture("^(?<y>[0-9]{4})(?<mo>[0-9]{2})(?<d>[0-9]{2})T(?<h>[0-9]{2})(?<mi>[0-9]{2})(?<s>[0-9]{2})(?:[.,](?<f>[0-9]+))?" + $Z + "?$") | _ms(.)),
                    ($s | capture("^(?:[A-Z]+,?\\s+)?(?<d>[0-9]{1,2})[ -](?<mon>[A-Z]{3,9})[ -](?<y>[0-9]{2,4})\\s+" + $T + "\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?:[A-Z]+,?\\s+)?(?<mon>[A-Z]{3,9})\\.?\\s+(?<d>[0-9]{1,2}),?\\s+(?<y>[0-9]{4})(?:,?\\s+" + $T + ")?\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?:[A-Z]+\\s+)?(?<mon>[A-Z]{3,9})\\s+(?<d>[0-9]{1,2})\\s+" + $T + "\\s+(?:" + $Z + "\\s+)?(?<y>[0-9]{4})$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?<d>[0-9]{1,2})/(?<mon>[A-Z]{3})/(?<y>[0-9]{4}):" + $T + "\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.))
                  ) // null
                end;
            if $ts == null then null
            elif ($ts | type) == "number" then _num_ms($ts)
            elif ($ts | type) == "string" then _str($ts)
            elif ($ts | type) == "object" then
              if   $ts["$date"] != null then to_epoch_ms($ts["$date"])
              elif $ts["$numberLong"] != null then to_epoch_ms($ts["$numberLong"])
              elif $ts.seconds != null then
                ($ts.seconds | tostring | tonumber) * 1000
                + ((($ts.nanos // 0) | tostring | tonumber) / 1000000 | floor)
              else null end
            else null end;

          . as $r
          | ($r.events[0] // {}) as $ev
          | ($ev.parameters // []) as $params
          | ($ev.name // "") as $ename
          | def param($n): ($params | map(select(.name == $n)) | first);
            def pstr($n): (param($n) | if . == null then null
                           else (.value // ((.multiValue // []) | join(","))) end);
            def pbool($n): (param($n) | if . == null then null else .boolValue end);
            ($r.actor.email) as $email

          # severity bucket 0-10
          | ( if ($ename | startswith("suspicious")) or (pbool("is_suspicious") == true) then 8
              elif ($ename | startswith("login_failure")) then 6
              elif ($ename | startswith("logout")) then 2
              else 3 end ) as $sev

          # outcome
          | ( if $ename == "login_success" then "SUCCESS"
              elif ($ename | startswith("login_failure") or startswith("suspicious")) then "FAILURE"
              else "UNKNOWN" end ) as $outcome

          | { _cef: {
              vendor: "Google",
              product: "Google Workspace Login",
              version: "",
              signature_id: $ename,
              name: ( { "login_success": "User login succeeded",
                        "login_failure": "User login failed",
                        "logout": "User logout",
                        "suspicious_login": "Suspicious login blocked" }[$ename]
                      // $ename ),
              severity: $sev,
              extension: ( {
                rt:      to_epoch_ms($r.id.time),
                suser:   $email,
                suid:    ($r.actor.profileId // null),
                duser:   (pstr("affected_email_address")),
                src:     ($r.ipAddress // null),
                dhost:   "accounts.google.com",
                act:     $ename,
                outcome: $outcome,
                externalId: ($r.id.uniqueQualifier | tostring),
                cs1: (pstr("login_type")),
                cs1Label: (if (pstr("login_type")) != null then "loginType" else null end),
                cs2: (pstr("login_challenge_method")),
                cs2Label: (if (pstr("login_challenge_method")) != null then "challengeMethod" else null end),
                cs3: (pstr("login_challenge_status")),
                cs3Label: (if (pstr("login_challenge_status")) != null then "loginChallengeStatus" else null end),
                cs4: (pstr("login_failure_type")),
                cs4Label: (if (pstr("login_failure_type")) != null then "loginFailureType" else null end),
                cs5: ($r.id.customerId // null),
                cs5Label: (if ($r.id.customerId // null) != null then "customerId" else null end),
                cs6: (pbool("is_second_factor") | if . == null then null else tostring end),
                cs6Label: (if (pbool("is_second_factor")) != null then "isSecondFactor" else null end)
              } | with_entries(select(.value != null and .value != "")) )
          } }
