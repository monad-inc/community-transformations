name: "Google Workspace Gemini Activity to CEF"
description: "Maps Google Workspace Admin SDK Reports 'gemini_in_workspace_apps' activity records into the normalized {_cef:{...}} CEF intermediate. Chain the shared CEF Serializer (utility/cef/cef-serializer.yaml) after this to render the CEF:0 string."
author: "Monad"
contributors:
  - "https://github.com/behobu"
inputs:
  - "google-workspace-gemini-activity"
tags:
  - "v0"
  - "cef"
  - "google"
  - "gemini-activity"
config:
  operations:
    - operation: "jq"
      arguments:
        key: ""
        query: |
          # ---------------------------------------------------------------
          # Google Workspace "gemini_in_workspace_apps" activity -> CEF (T1).
          # No escaping here — the shared CEF Serializer (T2) owns escaping.
          # Final-form values: severity 0-10, times epoch-MS, custom slots
          # paired with their *Label. One jq pass; shallow null-drop.
          # ---------------------------------------------------------------
          def to_epoch_ms($ts):
            def _num_ms($n):
              if   $n >= 1e17 then ($n / 1000000 | floor)
              elif $n >= 1e14 then ($n / 1000 | floor)
              elif $n >= 1e11 then ($n | floor)
              else ($n * 1000 | floor) end;
            if $ts == null or $ts == "" then null
            elif ($ts | type) == "number" then _num_ms($ts)
            elif ($ts | type) == "object" then
              (if ($ts.seconds // null) == null then null
               else ($ts.seconds * 1000 + ((($ts.nanos // 0) / 1000000) | floor)) end)
            elif ($ts | type) == "string" then
              if ($ts | test("^-?[0-9]+(\\.[0-9]+)?$")) then _num_ms($ts | tonumber)
              else
                ([$ts | ascii_upcase | capture("^(?<d>[0-9]{4}-[0-9]{2}-[0-9]{2})(?:[T ](?<t>[0-9]{2}:[0-9]{2}(?::[0-9]{2})?)(?:[.,](?<f>[0-9]+))?)? ?(?<z>Z|UTC|[+-][0-9]{2}(?::?[0-9]{2})?)?$")] | first) as $m
                | if $m == null then null
                  else
                    (($m.t // "00:00:00") | if length == 5 then . + ":00" else . end) as $t
                    | (($m.z // "Z") | if . == "Z" or . == "UTC" then 0
                        else (.[1:] | gsub(":"; "")) as $o
                          | ((if (.[0:1]) == "-" then -1 else 1 end)
                             * (($o[0:2] | tonumber) * 3600 + ((if ($o | length) >= 4 then $o[2:4] else "00" end) | tonumber) * 60))
                        end) as $off
                    | ((($m.d + "T" + $t + "Z") | fromdateiso8601) - $off) * 1000
                      + (((($m.f // "") + "000")[0:3]) | tonumber)
                  end
              end
            else null end;

          . as $r
          | ($r.id // {}) as $id
          | ($r.actor // {}) as $ac
          | ($r.events[0] // {}) as $ev
          | ((($ev.parameters // []) | map({ (.name): (.value // .boolValue // .intValue // .multiValue) }) | add) // {}) as $p

          | { _cef: {
                vendor: "Google",
                product: "Gemini in Workspace Apps",
                version: "",
                signature_id: ($ev.name // "feature_utilization"),
                name: ("Gemini " + ($p.action // "feature") + " in " + ($p.app_name // "workspace")),
                severity: 2,
                extension: ( {
                  rt:       to_epoch_ms($id.time),
                  suser:    ($ac.email // null),
                  suid:     ($ac.profileId // null),
                  src:      ($r.ipAddress // null),
                  act:      ($p.action // null),
                  outcome:  "SUCCESS",
                  cs1Label: "app_name",
                  cs1: ($p.app_name // null),
                  cs2Label: "feature_source",
                  cs2: ($p.feature_source // null),
                  cs3Label: "event_category",
                  cs3: ($p.event_category // null),
                  cs4Label: "ownerDomain",
                  cs4: ($r.ownerDomain // null),
                  cs5Label: "customerId",
                  cs5: ($id.customerId // null)
                } | with_entries(select(.value != null and .value != "")) )
            } }
