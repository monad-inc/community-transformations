name: "BugSnag Org Events to CEF"
description: "Maps BugSnag organization error/crash events into the normalized {_cef:{...}} CEF intermediate. Chain the shared CEF Serializer (utility/cef/cef-serializer.yaml) after this to render the CEF:0 string."
author: "Monad"
contributors:
  - "https://github.com/behobu"
inputs:
  - "bugsnag-org-events"
tags:
  - "v0"
  - "cef"
  - "bugsnag"
  - "org-events"
config:
  operations:
    - operation: "jq"
      arguments:
        key: ""
        query: |
          # ---------------------------------------------------------------
          # BugSnag org error event -> CEF intermediate (T1). No escaping.
          # severity: integer 0-10; times epoch-ms; cs*/cn* paired with labels.
          # ---------------------------------------------------------------
          . as $r
          | ($r.exceptions[0] // {}) as $ex
          | ($r.app // {}) as $app
          | ($r.device // {}) as $dev
          | ($r.user // {}) as $usr
          | ($r.request // {}) as $req

          | def to_epoch_ms($ts):
              def _num_ms($n):
                if   $n >= 1e17 then ($n / 1000000 | floor)
                elif $n >= 1e14 then ($n / 1000 | floor)
                elif $n >= 1e11 then ($n | floor)
                else ($n * 1000 | floor) end;
              if $ts == null or $ts == "" then null
              elif ($ts | type) == "number" then _num_ms($ts)
              elif ($ts | type) == "object" then
                (if ($ts.seconds // null) == null then null
                 else ($ts.seconds * 1000 + ((($ts.nanos // 0) / 1000000) | floor)) end)
              elif ($ts | type) == "string" then
                if ($ts | test("^-?[0-9]+(\\.[0-9]+)?$")) then _num_ms($ts | tonumber)
                else
                  ([$ts | ascii_upcase | capture("^(?<d>[0-9]{4}-[0-9]{2}-[0-9]{2})(?:[T ](?<t>[0-9]{2}:[0-9]{2}(?::[0-9]{2})?)(?:[.,](?<f>[0-9]+))?)? ?(?<z>Z|UTC|[+-][0-9]{2}(?::?[0-9]{2})?)?$")] | first) as $m
                  | if $m == null then null
                    else
                      (($m.t // "00:00:00") | if length == 5 then . + ":00" else . end) as $t
                      | (($m.z // "Z") | if . == "Z" or . == "UTC" then 0
                          else (.[1:] | gsub(":"; "")) as $o
                            | ((if (.[0:1]) == "-" then -1 else 1 end)
                               * (($o[0:2] | tonumber) * 3600 + ((if ($o | length) >= 4 then $o[2:4] else "00" end) | tonumber) * 60))
                          end) as $off
                      | ((($m.d + "T" + $t + "Z") | fromdateiso8601) - $off) * 1000
                        + (((($m.f // "") + "000")[0:3]) | tonumber)
                    end
                end
              else null end;

          { _cef: {
              vendor: "BugSnag",
              product: "BugSnag",
              version: ($app.version // ""),
              signature_id: ($ex.error_class // "UnknownError"),
              name: ($ex.message // $r.context // "Application error"),
              severity: ( { "error": 8, "warning": 5, "info": 3 }[$r.severity] // 0 ),
              extension: ( {
                rt:            to_epoch_ms($r.received_at),
                msg:           ($ex.message // $r.context),
                outcome:       "FAILURE",
                suid:          $usr.id,
                suser:         ($usr.email // $usr.name),
                src:           $req.client_ip,
                request:       $req.url,
                requestMethod: $req.http_method,
                dhost:         $dev.hostname,
                deviceExternalId: $dev.id,
                app:           $app.id,
                # Custom slots (each paired with its *Label).
                cs1Label: "errorClass",   cs1: $ex.error_class,
                cs2Label: "releaseStage",  cs2: $app.release_stage,
                cs3Label: "context",       cs3: $r.context,
                cs4Label: "os",            cs4: (if $dev.os_name != null then ($dev.os_name + " " + ($dev.os_version // "")) else null end),
                cs5Label: "unhandled",     cs5: (if $r.unhandled == null then null else ($r.unhandled | tostring) end),
                cs6Label: "errorId",       cs6: $r.error_id,
                cn1Label: "durationMs",    cn1: $app.duration
              } | with_entries(select(.value != null and .value != "")) )
          } }
