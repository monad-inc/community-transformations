name: "Arize Audit Logs to CEF"
description: "Maps Arize AX audit log records (authenticated GraphQL mutations / login attempts) into the normalized {_cef:{...}} CEF intermediate. Chain the shared CEF Serializer (utility/cef/cef-serializer.yaml) after this to render the CEF:0 string."
author: "Monad"
contributors:
  - "https://github.com/behobu"
inputs:
  - "arize-audit-logs"
tags:
  - "v0"
  - "cef"
  - "arize"
  - "audit-logs"
config:
  operations:
    - operation: "jq"
      arguments:
        key: ""
        query: |
          # ---------------------------------------------------------------
          # Arize AX audit logs -> CEF intermediate (T1). No escaping here;
          # the shared CEF Serializer (T2) owns all escaping/header assembly.
          # Emit final-form values: severity int 0-10, times epoch-MS,
          # custom cs* slots paired with their *Label.
          # ---------------------------------------------------------------
          def to_epoch_ms($ts):
            def _num_ms($n):
              if   $n >= 1e17 then ($n / 1000000 | floor)
              elif $n >= 1e14 then ($n / 1000 | floor)
              elif $n >= 1e11 then ($n | floor)
              else ($n * 1000 | floor) end;
            if $ts == null or $ts == "" then null
            elif ($ts | type) == "number" then _num_ms($ts)
            elif ($ts | type) == "object" then
              (if ($ts.seconds // null) == null then null
               else ($ts.seconds * 1000 + ((($ts.nanos // 0) / 1000000) | floor)) end)
            elif ($ts | type) == "string" then
              if ($ts | test("^-?[0-9]+(\\.[0-9]+)?$")) then _num_ms($ts | tonumber)
              else
                ([$ts | ascii_upcase | capture("^(?<d>[0-9]{4}-[0-9]{2}-[0-9]{2})(?:[T ](?<t>[0-9]{2}:[0-9]{2}(?::[0-9]{2})?)(?:[.,](?<f>[0-9]+))?)? ?(?<z>Z|UTC|[+-][0-9]{2}(?::?[0-9]{2})?)?$")] | first) as $m
                | if $m == null then null
                  else
                    (($m.t // "00:00:00") | if length == 5 then . + ":00" else . end) as $t
                    | (($m.z // "Z") | if . == "Z" or . == "UTC" then 0
                        else (.[1:] | gsub(":"; "")) as $o
                          | ((if (.[0:1]) == "-" then -1 else 1 end)
                             * (($o[0:2] | tonumber) * 3600 + ((if ($o | length) >= 4 then $o[2:4] else "00" end) | tonumber) * 60))
                        end) as $off
                    | ((($m.d + "T" + $t + "Z") | fromdateiso8601) - $off) * 1000
                      + (((($m.f // "") + "000")[0:3]) | tonumber)
                  end
              end
            else null end;

          . as $r
          | ($r.user // {}) as $u
          | (($r.operationName // $r.mutationName) // "") as $op
          | ($r.success) as $ok
          | { _cef: {
              vendor: "Arize",
              product: "Arize AX",
              version: "",
              signature_id: $op,
              name: ("Arize AX operation: " + $op),
              # Successful audit ops are informational (3); failures are
              # elevated (7).
              severity: (if $ok == false then 7 else 3 end),
              extension: ( {
                rt:      to_epoch_ms($r.loggedAt),
                suser:   ($u.email // $u.name),
                suid:    $u.id,
                src:     $r.ip,
                act:     $op,
                outcome: (if $ok == true then "SUCCESS" elif $ok == false then "FAILURE" else null end),
                externalId: $r.id,
                cs1Label: "space",       cs1: $r.spaceName,
                cs2Label: "accountName", cs2: $r.accountName,
                cs3Label: "operationText", cs3: $r.operationText,
                cs4Label: "variables",   cs4: (if $r.variables != null then ($r.variables | tojson) else null end)
              } | with_entries(select(.value != null and .value != "")) )
          } }
