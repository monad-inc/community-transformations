name: "Okta Users to CEF"
description: "Maps Okta Users directory records into the normalized {_cef:{...}} CEF intermediate. Chain the shared CEF Serializer (utility/cef/cef-serializer.yaml) after this to render the CEF:0 string."
author: "Monad"
contributors:
  - "https://github.com/behobu"
inputs:
  - "okta-users"
tags:
  - "v0"
  - "cef"
  - "okta"
  - "users"
config:
  operations:
    - operation: "jq"
      arguments:
        key: ""
        query: |
          # ---------------------------------------------------------------
          # Okta Users (directory) -> CEF intermediate (T1). No escaping here.
          # signature_id = okta.user.inventory (stable, low-cardinality).
          # times epoch-ms; custom cs*/cn* slots paired with *Label.
          # ---------------------------------------------------------------
          def to_epoch_ms($ts):
            def _num_ms($n):
              if   $n >= 1e17 then ($n / 1000000 | floor)
              elif $n >= 1e14 then ($n / 1000 | floor)
              elif $n >= 1e11 then ($n | floor)
              else ($n * 1000 | floor) end;
            if $ts == null or $ts == "" then null
            elif ($ts | type) == "number" then _num_ms($ts)
            elif ($ts | type) == "object" then
              (if ($ts.seconds // null) == null then null
               else ($ts.seconds * 1000 + ((($ts.nanos // 0) / 1000000) | floor)) end)
            elif ($ts | type) == "string" then
              if ($ts | test("^-?[0-9]+(\\.[0-9]+)?$")) then _num_ms($ts | tonumber)
              else
                ([$ts | ascii_upcase | capture("^(?<d>[0-9]{4}-[0-9]{2}-[0-9]{2})(?:[T ](?<t>[0-9]{2}:[0-9]{2}(?::[0-9]{2})?)(?:[.,](?<f>[0-9]+))?)? ?(?<z>Z|UTC|[+-][0-9]{2}(?::?[0-9]{2})?)?$")] | first) as $m
                | if $m == null then null
                  else
                    (($m.t // "00:00:00") | if length == 5 then . + ":00" else . end) as $t
                    | (($m.z // "Z") | if . == "Z" or . == "UTC" then 0
                        else (.[1:] | gsub(":"; "")) as $o
                          | ((if (.[0:1]) == "-" then -1 else 1 end)
                             * (($o[0:2] | tonumber) * 3600 + ((if ($o | length) >= 4 then $o[2:4] else "00" end) | tonumber) * 60))
                        end) as $off
                    | ((($m.d + "T" + $t + "Z") | fromdateiso8601) - $off) * 1000
                      + (((($m.f // "") + "000")[0:3]) | tonumber)
                  end
              end
            else null end;

          . as $r |
          ($r.profile // {}) as $p |
          {
            _cef: {
              vendor: "Okta",
              product: "Okta Users",
              version: "",
              signature_id: "okta.user.inventory",
              name: ("Okta user inventory record: " + ($p.login // $p.email // $r.id)),
              severity: 2,
              extension: ( {
                rt:       to_epoch_ms($r.lastUpdated // $r.created),
                start:    to_epoch_ms($r.created),
                end:      to_epoch_ms($r.lastLogin),
                suser:    ($p.login // $p.email),
                suid:     $r.id,
                duser:    $p.displayName,
                act:      "user-inventory",
                outcome:  $r.status,
                cs1Label: "department",       cs1: $p.department,
                cs2Label: "title",            cs2: $p.title,
                cs3Label: "manager",          cs3: $p.manager,
                cs4Label: "credentialProvider", cs4: ($r.credentials.provider.type // null),
                cs5Label: "employeeNumber",   cs5: $p.employeeNumber,
                cs6Label: "userType",         cs6: $p.userType,
                deviceCustomDate1Label: "passwordChanged",
                deviceCustomDate1: to_epoch_ms($r.passwordChanged)
              } | with_entries(select(.value != null and .value != "")) )
            }
          }
