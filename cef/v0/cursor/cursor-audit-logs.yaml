name: "Cursor Audit Logs to CEF"
description: "Maps Cursor team audit-log events into the normalized {_cef:{...}} CEF intermediate. Chain the shared CEF Serializer (utility/cef/cef-serializer.yaml) after this to render the CEF:0 string."
author: "Monad"
contributors:
  - "https://github.com/behobu"
inputs:
  - "cursor-audit-logs"
tags:
  - "v0"
  - "cef"
  - "cursor"
  - "audit"
config:
  operations:
    - operation: "jq"
      arguments:
        key: ""
        query: |
          # Cursor audit event -> CEF intermediate (T1). No escaping here — the
          # shared serializer owns that. signature_id = the audited action.
          def to_epoch_ms($ts):
            def _num_ms($n):
              if   $n >= 1e17 then ($n / 1000000 | floor)
              elif $n >= 1e14 then ($n / 1000 | floor)
              elif $n >= 1e11 then ($n | floor)
              else ($n * 1000 | floor) end;
            if $ts == null or $ts == "" then null
            elif ($ts | type) == "number" then _num_ms($ts)
            elif ($ts | type) == "object" then
              (if ($ts.seconds // null) == null then null
               else ($ts.seconds * 1000 + ((($ts.nanos // 0) / 1000000) | floor)) end)
            elif ($ts | type) == "string" then
              if ($ts | test("^-?[0-9]+(\\.[0-9]+)?$")) then _num_ms($ts | tonumber)
              else
                ([$ts | ascii_upcase | capture("^(?<d>[0-9]{4}-[0-9]{2}-[0-9]{2})(?:[T ](?<t>[0-9]{2}:[0-9]{2}(?::[0-9]{2})?)(?:[.,](?<f>[0-9]+))?)? ?(?<z>Z|UTC|[+-][0-9]{2}(?::?[0-9]{2})?)?$")] | first) as $m
                | if $m == null then null
                  else
                    (($m.t // "00:00:00") | if length == 5 then . + ":00" else . end) as $t
                    | (($m.z // "Z") | if . == "Z" or . == "UTC" then 0
                        else (.[1:] | gsub(":"; "")) as $o
                          | ((if (.[0:1]) == "-" then -1 else 1 end)
                             * (($o[0:2] | tonumber) * 3600 + ((if ($o | length) >= 4 then $o[2:4] else "00" end) | tonumber) * 60))
                        end) as $off
                    | ((($m.d + "T" + $t + "Z") | fromdateiso8601) - $off) * 1000
                      + (((($m.f // "") + "000")[0:3]) | tonumber)
                  end
              end
            else null end;
          def is_ip($s):
            def _v4: test("^((25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\\.){3}(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])$");
            def _v6:
              if test("^[0-9A-Fa-f:.]+$") | not then false
              else
                (if test("\\.")
                 then (split(":") | last) as $t
                   | if ($t | _v4) then .[0:length - ($t | length)] + "0:0" else "x" end
                 else . end) as $h
                | ($h | split("::")) as $p
                | if ($p | length) > 2 then false
                  else ([$p[] | if . == "" then empty else split(":")[] end]) as $g
                    | ($g | all(test("^[0-9A-Fa-f]{1,4}$")))
                      and (if ($p | length) == 2 then ($g | length) <= 7 else ($g | length) == 8 end)
                  end
              end;
            ($s | type) == "string" and ($s | _v4 or _v6);
          def real($s): if ($s | type) == "string" and $s != "unknown" and $s != "" then $s else null end;
          . as $r
          | ( (.event_type // "") ) as $et
          | { _cef: {
              vendor: "Cursor",
              product: "Cursor Audit Logs",
              version: "",
              signature_id: $r.event_type,
              name: $r.event_type,
              severity: (if ($et | test("(protected_git_scope|service_account|cloud_agent_secret|privacy_mode|api_key)")) then 6 else 3 end),
              extension: ( {
                rt: to_epoch_ms($r.timestamp),
                suser: real($r.user_email),
                suid: real($r.user_id),
                src: (if is_ip($r.ip_address) then $r.ip_address else null end),
                act: $r.event_type,
                cs1Label: "teamId", cs1: $r.team_id,
                cs2Label: "requestId", cs2: $r.request_id,
                cs3Label: "sourceRaw", cs3: ($r.ip_address // null)
              } | with_entries(select(.value != null and .value != "")) )
          } }
