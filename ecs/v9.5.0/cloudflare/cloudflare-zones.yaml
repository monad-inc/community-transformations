name: "Cloudflare Zones to ECS v9.5.0"
description: "Maps Cloudflare Zones inventory records into Elastic Common Schema (ECS) v9.5.0, populating event categorization, cloud.*, organization.*, host.*, related.*, and a cloudflare.* vendor namespace."
author: "Monad"
contributors:
  - "https://github.com/behobu"
inputs:
  - "cloudflare-zones"
tags:
  - "v9.5.0"
  - "ecs"
  - "cloudflare"
  - "zones"
config:
  operations:
    - operation: "jq"
      arguments:
        key: ""
        query: |
          # ---------------------------------------------------------------
          # Cloudflare Zone (GET /zones) -> ECS v9.5.0 (nested).
          # An inventory snapshot of a cloud-managed web asset:
          #   event.kind=asset, category=[configuration], type=[info].
          # One jq construction pass; single end-of-pipeline prune.
          # ---------------------------------------------------------------

          def to_epoch_ms($ts):
            def _n: if . == null then null else tonumber end;
            def _num_ms($n):
              if   $n >= 1e17 then ($n / 1000000 | floor)
              elif $n >= 1e14 then ($n / 1000 | floor)
              elif $n >= 1e11 then ($n | floor)
              else ($n * 1000 + 0.001 | floor) end;
            def _digits_ms($d):
              ($d | ltrimstr("-") | length) as $l
              | if   $l >= 18 then ($d[0:-6] | tonumber)
                elif $l >= 15 then ($d[0:-3] | tonumber)
                elif $l >= 12 then ($d | tonumber)
                else ($d | tonumber) * 1000 end;
            def _frac_ms($f): if $f == null then 0 else (($f + "000")[0:3] | tonumber) end;
            def _mon($m):
              if $m == null then null
              else {"JAN":1,"FEB":2,"MAR":3,"APR":4,"MAY":5,"JUN":6,
                    "JUL":7,"AUG":8,"SEP":9,"OCT":10,"NOV":11,"DEC":12}[$m[0:3]] end;
            def _zone($z):
              if $z == null or $z == "" then 0
              else
                ($z | if test("^(UTC|GMT|UT)[+-]") then sub("^(UTC|GMT|UT)"; "") else . end) as $z
                | if ($z | test("^[+-][0-9]{1,2}(:?[0-9]{2})?$")) then
                    ($z | capture("^(?<sg>[+-])(?<h>[0-9]{1,2}):?(?<m>[0-9]{2})?$")) as $o
                    | (if $o.sg == "-" then -1 else 1 end)
                      * (($o.h | tonumber) * 3600 + (($o.m // "0") | tonumber) * 60)
                  else
                    {"Z":0,"UTC":0,"GMT":0,"UT":0,"EST":-18000,"EDT":-14400,"CST":-21600,
                     "CDT":-18000,"MST":-25200,"MDT":-21600,"PST":-28800,"PDT":-25200}[$z]
                  end
              end;
            def _ms($c):
              ($c.y | tonumber | if . < 100 then (if . < 70 then . + 2000 else . + 1900 end) else . end) as $y
              | ($c.mo | _n) as $mo
              | ($c.d | tonumber) as $d
              | (($c.h // "0") | tonumber) as $h
              | (($c.mi // "0") | tonumber) as $mi
              | (($c.s // "0") | tonumber) as $s
              | _zone($c.z) as $off
              | if $mo == null or $off == null or $mo < 1 or $mo > 12 or $d < 1 or $d > 31
                   or $h > 23 or $mi > 59 or $s > 60 then null
                else
                  ($y - (if $mo <= 2 then 1 else 0 end)) as $yy
                  | ($yy / 400 | floor) as $era
                  | ($yy - $era * 400) as $yoe
                  | (((153 * ($mo + (if $mo > 2 then -3 else 9 end)) + 2) / 5 | floor) + $d - 1) as $doy
                  | ($yoe * 365 + ($yoe / 4 | floor) - ($yoe / 100 | floor) + $doy) as $doe
                  | ($era * 146097 + $doe - 719468) as $days
                  | ($days * 86400 + $h * 3600 + $mi * 60 + $s - $off) * 1000 + _frac_ms($c.f)
                end;
            def _str($raw):
              ($raw | ascii_upcase | sub("\\s*\\([^)]*\\)\\s*$"; "") | sub("^\\s+"; "") | sub("\\s+$"; "")) as $s
              | "(?<z>Z|(?:UTC|GMT|UT)?[+-][0-9]{1,2}(?::?[0-9]{2})?|[A-Z]{1,5})" as $Z
              | "(?<h>[0-9]{1,2}):(?<mi>[0-9]{2})(?::(?<s>[0-9]{2}))?(?:[.,](?<f>[0-9]+))?" as $T
              | if $s == "" then null
                elif ($s | test("^-?[0-9]+$")) then _digits_ms($s)
                elif ($s | test("^[0-9]+\\.[0-9]+$")) then
                  ($s | split(".")) as $p
                  | if ($p[0] | length) <= 11 then _digits_ms($p[0]) + _frac_ms($p[1])
                    else _digits_ms($p[0]) end
                elif ($s | test("^/DATE\\(-?[0-9]+([+-][0-9]{4})?\\)/$")) then
                  ($s | capture("(?<ms>-?[0-9]+)").ms | tonumber)
                else
                  first(
                    ($s | capture("^(?<y>[0-9]{4})[-/](?<mo>[0-9]{1,2})[-/](?<d>[0-9]{1,2})(?:[T ]+" + $T + ")?\\s*" + $Z + "?(?:\\s+[A-Z]{2,5})?$") | _ms(.)),
                    ($s | capture("^(?<y>[0-9]{4})(?<mo>[0-9]{2})(?<d>[0-9]{2})T(?<h>[0-9]{2})(?<mi>[0-9]{2})(?<s>[0-9]{2})(?:[.,](?<f>[0-9]+))?" + $Z + "?$") | _ms(.)),
                    ($s | capture("^(?:[A-Z]+,?\\s+)?(?<d>[0-9]{1,2})[ -](?<mon>[A-Z]{3,9})[ -](?<y>[0-9]{2,4})\\s+" + $T + "\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?:[A-Z]+,?\\s+)?(?<mon>[A-Z]{3,9})\\.?\\s+(?<d>[0-9]{1,2}),?\\s+(?<y>[0-9]{4})(?:,?\\s+" + $T + ")?\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?:[A-Z]+\\s+)?(?<mon>[A-Z]{3,9})\\s+(?<d>[0-9]{1,2})\\s+" + $T + "\\s+(?:" + $Z + "\\s+)?(?<y>[0-9]{4})$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?<d>[0-9]{1,2})/(?<mon>[A-Z]{3})/(?<y>[0-9]{4}):" + $T + "\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.))
                  ) // null
                end;
            if $ts == null then null
            elif ($ts | type) == "number" then _num_ms($ts)
            elif ($ts | type) == "string" then _str($ts)
            elif ($ts | type) == "object" then
              if   $ts["$date"] != null then to_epoch_ms($ts["$date"])
              elif $ts["$numberLong"] != null then to_epoch_ms($ts["$numberLong"])
              elif $ts.seconds != null then
                ($ts.seconds | tostring | tonumber) * 1000
                + ((($ts.nanos // 0) | tostring | tonumber) / 1000000 | floor)
              else null end
            else null end;
          def to_iso($ts):
            to_epoch_ms($ts) as $ms
            | if $ms == null then null
              else
                ($ms / 1000 | floor) as $s
                | ($s | todate)[0:19] + "." + ("00" + (($ms - $s * 1000) | tostring))[-3:] + "Z"
              end;

          . as $r
          | ($r.account // {}) as $acct
          | ($r.owner // {}) as $owner
          | ($r.plan // {}) as $plan
          | ($r.meta // {}) as $meta
          | ((($r.name_servers // []) + [$r.name]) | map(select(. != null)) | unique) as $hosts
          | {
              "@timestamp": (to_iso($r.modified_on // $r.created_on)),
              "ecs": { "version": "9.5.0" },

              "event": {
                "kind": "asset",
                "category": ["configuration"],
                "type": ["info"],
                "outcome": (if $r.status == "active" then "success" else "unknown" end),
                "id": $r.id,
                "action": "zone-inventory",
                "provider": "cloudflare",
                "module": "cloudflare",
                "dataset": "cloudflare.zones",
                "created": (to_iso($r.created_on))
              },

              "cloud": {
                "provider": "cloudflare",
                "account": (
                  { "id": $acct.id, "name": $acct.name }
                  | with_entries(select(.value != null))
                )
              },

              "organization": (
                { "id": ($owner.id // $acct.id), "name": ($owner.name // $acct.name) }
                | with_entries(select(.value != null))
              ),

              "host": (
                { "name": $r.name, "id": $r.id, "type": "cloudflare_zone" }
                | with_entries(select(.value != null))
              ),

              "service": (
                { "name": ($plan.name), "type": "cloudflare" }
                | with_entries(select(.value != null))
              ),

              "related": {
                "hosts": $hosts
              },

              "labels": (
                { "zone_status": $r.status,
                  "zone_type": $r.type,
                  "paused": (if ($r.paused != null) then ($r.paused | tostring) else null end),
                  "phishing_detected": (if ($meta.phishing_detected != null) then ($meta.phishing_detected | tostring) else null end) }
                | with_entries(select(.value != null))
              ),

              # Vendor namespace — fields with no ECS home.
              "cloudflare": {
                "zone": (
                  { "id": $r.id,
                    "name": $r.name,
                    "status": $r.status,
                    "paused": $r.paused,
                    "type": $r.type,
                    "development_mode": $r.development_mode,
                    "name_servers": $r.name_servers,
                    "original_name_servers": $r.original_name_servers,
                    "original_registrar": $r.original_registrar,
                    "original_dnshost": $r.original_dnshost,
                    "activated_on": (to_iso($r.activated_on)),
                    "permissions": $r.permissions,
                    "plan": (
                      { "id": $plan.id,
                        "name": $plan.name,
                        "legacy_id": $plan.legacy_id,
                        "price": $plan.price,
                        "currency": $plan.currency,
                        "frequency": $plan.frequency,
                        "is_subscribed": $plan.is_subscribed }
                      | with_entries(select(.value != null))
                    ),
                    "meta": (
                      { "cdn_only": $meta.cdn_only,
                        "dns_only": $meta.dns_only,
                        "foundation_dns": $meta.foundation_dns,
                        "phishing_detected": $meta.phishing_detected,
                        "custom_certificate_quota": $meta.custom_certificate_quota,
                        "page_rule_quota": $meta.page_rule_quota,
                        "step": $meta.step }
                      | with_entries(select(.value != null))
                    ) }
                  | with_entries(select(.value != null))
                )
              }
            }
          | walk(
              if type == "object" then
                with_entries(select(
                  .value != null and .value != "" and .value != {} and .value != []
                ))
              else . end
            )
