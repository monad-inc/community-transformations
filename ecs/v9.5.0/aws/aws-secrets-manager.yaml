name: "AWS Secrets Manager Secret Inventory to ECS v9.5.0"
description: "Normalizes AWS Secrets Manager secret inventory records (ListSecrets/DescribeSecret metadata) into Elastic Common Schema (ECS) v9.5.0, emitting event/cloud/labels categorization plus the aws.secretsmanager.* vendor namespace for secret ARN, KMS key, rotation configuration, and version staging."
author: "Monad"
contributors:
  - "https://github.com/behobu"
inputs:
  - "aws-secrets-manager"
tags:
  - "v9.5.0"
  - "ecs"
  - "aws"
  - "secrets-manager"
  - "inventory"
config:
  operations:
    - operation: "jq"
      arguments:
        key: ""
        query: |
          # =================================================================
          # AWS Secrets Manager secret inventory  ->  ECS v9.5.0
          #
          # Input: ONE Secrets Manager secret-metadata record per invocation,
          # as emitted by the Monad `aws-secrets-manager` input connector (a
          # ListSecrets entry enriched with DescribeSecret). This is an asset
          # inventory snapshot, so:
          #   event.kind     = asset
          #   event.category = ["configuration"]
          #   event.type     = ["info"]     (allowed pairing for configuration)
          #   event.outcome  = success      (the metadata collection succeeded)
          #
          # ECS has no native "secret" field set, so secret-specific detail
          # lives under the aws.secretsmanager.* vendor namespace (allowed by
          # ECS for custom data); native cloud.*, event.*, and labels carry the
          # categorizable/queryable fields.
          #
          # Field mappings:
          #   .LastChangedDate  -> @timestamp
          #   .ARN              -> event.id, cloud.* / aws.secretsmanager.arn
          #   .PrimaryRegion    -> cloud.region
          #   <arn account>     -> cloud.account.id
          #   .Tags[]           -> labels.<Key> = <Value>
          # =================================================================

          # Secrets Manager timestamps are epoch SECONDS (sometimes fractional).
          # ECS date fields want ISO-8601; convert via floor|todate. Guard
          # non-numbers so a malformed value can't abort the transform.
          # Epoch MILLISECONDS from any common timestamp form; null if empty or unparseable.
          def to_epoch_ms($ts):
            def _n: if . == null then null else tonumber end;
            def _num_ms($n):
              if   $n >= 1e17 then ($n / 1000000 | floor)
              elif $n >= 1e14 then ($n / 1000 | floor)
              elif $n >= 1e11 then ($n | floor)
              else ($n * 1000 + 0.001 | floor) end;
            def _digits_ms($d):
              ($d | ltrimstr("-") | length) as $l
              | if   $l >= 18 then ($d[0:-6] | tonumber)
                elif $l >= 15 then ($d[0:-3] | tonumber)
                elif $l >= 12 then ($d | tonumber)
                else ($d | tonumber) * 1000 end;
            def _frac_ms($f): if $f == null then 0 else (($f + "000")[0:3] | tonumber) end;
            def _mon($m):
              if $m == null then null
              else {"JAN":1,"FEB":2,"MAR":3,"APR":4,"MAY":5,"JUN":6,
                    "JUL":7,"AUG":8,"SEP":9,"OCT":10,"NOV":11,"DEC":12}[$m[0:3]] end;
            def _zone($z):
              if $z == null or $z == "" then 0
              else
                ($z | if test("^(UTC|GMT|UT)[+-]") then sub("^(UTC|GMT|UT)"; "") else . end) as $z
                | if ($z | test("^[+-][0-9]{1,2}(:?[0-9]{2})?$")) then
                    ($z | capture("^(?<sg>[+-])(?<h>[0-9]{1,2}):?(?<m>[0-9]{2})?$")) as $o
                    | (if $o.sg == "-" then -1 else 1 end)
                      * (($o.h | tonumber) * 3600 + (($o.m // "0") | tonumber) * 60)
                  else
                    {"Z":0,"UTC":0,"GMT":0,"UT":0,"EST":-18000,"EDT":-14400,"CST":-21600,
                     "CDT":-18000,"MST":-25200,"MDT":-21600,"PST":-28800,"PDT":-25200}[$z]
                  end
              end;
            def _ms($c):
              ($c.y | tonumber | if . < 100 then (if . < 70 then . + 2000 else . + 1900 end) else . end) as $y
              | ($c.mo | _n) as $mo
              | ($c.d | tonumber) as $d
              | (($c.h // "0") | tonumber) as $h
              | (($c.mi // "0") | tonumber) as $mi
              | (($c.s // "0") | tonumber) as $s
              | _zone($c.z) as $off
              | if $mo == null or $off == null or $mo < 1 or $mo > 12 or $d < 1 or $d > 31
                   or $h > 23 or $mi > 59 or $s > 60 then null
                else
                  ($y - (if $mo <= 2 then 1 else 0 end)) as $yy
                  | ($yy / 400 | floor) as $era
                  | ($yy - $era * 400) as $yoe
                  | (((153 * ($mo + (if $mo > 2 then -3 else 9 end)) + 2) / 5 | floor) + $d - 1) as $doy
                  | ($yoe * 365 + ($yoe / 4 | floor) - ($yoe / 100 | floor) + $doy) as $doe
                  | ($era * 146097 + $doe - 719468) as $days
                  | ($days * 86400 + $h * 3600 + $mi * 60 + $s - $off) * 1000 + _frac_ms($c.f)
                end;
            def _str($raw):
              ($raw | ascii_upcase | sub("\\s*\\([^)]*\\)\\s*$"; "") | sub("^\\s+"; "") | sub("\\s+$"; "")) as $s
              | "(?<z>Z|(?:UTC|GMT|UT)?[+-][0-9]{1,2}(?::?[0-9]{2})?|[A-Z]{1,5})" as $Z
              | "(?<h>[0-9]{1,2}):(?<mi>[0-9]{2})(?::(?<s>[0-9]{2}))?(?:[.,](?<f>[0-9]+))?" as $T
              | if $s == "" then null
                elif ($s | test("^-?[0-9]+$")) then _digits_ms($s)
                elif ($s | test("^[0-9]+\\.[0-9]+$")) then
                  ($s | split(".")) as $p
                  | if ($p[0] | length) <= 11 then _digits_ms($p[0]) + _frac_ms($p[1])
                    else _digits_ms($p[0]) end
                elif ($s | test("^/DATE\\(-?[0-9]+([+-][0-9]{4})?\\)/$")) then
                  ($s | capture("(?<ms>-?[0-9]+)").ms | tonumber)
                else
                  first(
                    ($s | capture("^(?<y>[0-9]{4})[-/](?<mo>[0-9]{1,2})[-/](?<d>[0-9]{1,2})(?:[T ]+" + $T + ")?\\s*" + $Z + "?(?:\\s+[A-Z]{2,5})?$") | _ms(.)),
                    ($s | capture("^(?<y>[0-9]{4})(?<mo>[0-9]{2})(?<d>[0-9]{2})T(?<h>[0-9]{2})(?<mi>[0-9]{2})(?<s>[0-9]{2})(?:[.,](?<f>[0-9]+))?" + $Z + "?$") | _ms(.)),
                    ($s | capture("^(?:[A-Z]+,?\\s+)?(?<d>[0-9]{1,2})[ -](?<mon>[A-Z]{3,9})[ -](?<y>[0-9]{2,4})\\s+" + $T + "\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?:[A-Z]+,?\\s+)?(?<mon>[A-Z]{3,9})\\.?\\s+(?<d>[0-9]{1,2}),?\\s+(?<y>[0-9]{4})(?:,?\\s+" + $T + ")?\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?:[A-Z]+\\s+)?(?<mon>[A-Z]{3,9})\\s+(?<d>[0-9]{1,2})\\s+" + $T + "\\s+(?:" + $Z + "\\s+)?(?<y>[0-9]{4})$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?<d>[0-9]{1,2})/(?<mon>[A-Z]{3})/(?<y>[0-9]{4}):" + $T + "\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.))
                  ) // null
                end;
            if $ts == null then null
            elif ($ts | type) == "number" then _num_ms($ts)
            elif ($ts | type) == "string" then _str($ts)
            elif ($ts | type) == "object" then
              if   $ts["$date"] != null then to_epoch_ms($ts["$date"])
              elif $ts["$numberLong"] != null then to_epoch_ms($ts["$numberLong"])
              elif $ts.seconds != null then
                ($ts.seconds | tostring | tonumber) * 1000
                + ((($ts.nanos // 0) | tostring | tonumber) / 1000000 | floor)
              else null end
            else null end;

          # requires: to_epoch_ms
          # UTC ISO 8601 with milliseconds ("2026-10-20T13:04:05.123Z") from any form
          # to_epoch_ms accepts; null if empty or unparseable.
          def to_iso($ts):
            to_epoch_ms($ts) as $ms
            | if $ms == null then null
              else
                ($ms / 1000 | floor) as $s
                | ($s | todate)[0:19] + "." + ("00" + (($ms - $s * 1000) | tostring))[-3:] + "Z"
              end;

          # ES rejects a whole document when an object-typed field is handed a
          # non-object, so guard RotationRules before reading it.
          def obj($o): if ($o | type) == "object" then $o else null end;

          def prune:
            walk(if type == "object" then with_entries(select(.value != null and .value != {} and .value != []))
                 elif type == "array" then map(select(. != null and . != {} and . != []))
                 else . end);

          . as $r
          | ( ($r.ARN // "") | split(":") ) as $arn_parts
          | ( if ($arn_parts | length) > 4 then $arn_parts[4] else null end ) as $account_id
          | ( obj($r.RotationRules) ) as $rr

          | {
              "@timestamp": ( to_iso($r.LastChangedDate) // to_iso($r.CreatedDate) ),
              "ecs": { "version": "9.5.0" },

              "event": {
                "kind": "asset",
                "category": ["configuration"],
                "type": ["info"],
                "outcome": "success",
                "id": $r.ARN,
                "action": "secret-inventory",
                "provider": "secretsmanager",
                "module": "aws",
                "dataset": "aws.secretsmanager",
                "created": to_iso($r.LastAccessedDate)
              },

              "cloud": {
                "provider": "aws",
                "region": $r.PrimaryRegion,
                "service": { "name": "secretsmanager" },
                "account": ( if $account_id != null
                             then { "id": $account_id } else null end )
              },

              # Tags -> ECS labels object (native ECS field, key/value).
              "labels": ( ($r.Tags // [])
                          | map({ (.Key): .Value }) | add ),

              "message": $r.Description,

              # --- aws.secretsmanager.* vendor namespace (custom, allowed) ---
              "aws": {
                "secretsmanager": {
                  "arn": $r.ARN,
                  "name": $r.Name,
                  "description": $r.Description,
                  "kms_key_id": $r.KmsKeyId,
                  "owning_service": $r.OwningService,
                  "primary_region": $r.PrimaryRegion,
                  "rotation_enabled": $r.RotationEnabled,
                  "rotation_lambda_arn": $r.RotationLambdaARN,
                  "rotation_automatically_after_days": ( if $rr != null then $rr.AutomaticallyAfterDays else null end ),
                  "rotation_schedule_expression": ( if $rr != null then $rr.ScheduleExpression else null end ),
                  "rotation_duration": ( if $rr != null then $rr.Duration else null end ),
                  "created_date": to_iso($r.CreatedDate),
                  "last_changed_date": to_iso($r.LastChangedDate),
                  "last_accessed_date": to_iso($r.LastAccessedDate),
                  "last_rotated_date": to_iso($r.LastRotatedDate),
                  "next_rotation_date": to_iso($r.NextRotationDate),
                  "deleted_date": to_iso($r.DeletedDate),
                  "version_stages": ( ($r.SecretVersionsToStages // {})
                                      | [ .[] ] | add // [] | unique )
                }
              }
            }
          | prune
