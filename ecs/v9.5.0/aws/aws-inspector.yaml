name: "AWS Inspector Findings to ECS v9.5.0"
description: "Normalizes AWS Inspector (Inspector2) finding records into the Elastic Common Schema (ECS) v9.5.0 field sets (event, vulnerability, package, cloud, host, related), modeling each finding as an alert carrying its CVE, CVSS score, affected package, and impacted AWS resource."
author: "Monad"
contributors:
  - "https://github.com/behobu"
inputs:
  - "aws-inspector"
tags:
  - "v9.5.0"
  - "ecs"
  - "aws"
  - "inspector"
  - "vulnerability"
config:
  operations:
    - operation: "jq"
      arguments:
        key: ""
        query: |
          # =================================================================
          # AWS Inspector (Inspector2)  ->  ECS v9.5.0
          # Input: ONE Inspector Finding record per invocation.
          #
          #   .findingArn                 -> event.id
          #   .type                       -> event.category is always
          #                                  ["vulnerability"] (type ["info"])
          #   .severity                   -> vulnerability.severity / event.severity
          #   .packageVulnerabilityDetails.vulnerabilityId -> vulnerability.id
          #   .inspectorScore / cvss      -> vulnerability.score.base/.version
          #   .resources[0]               -> cloud.* / host.* / related.ip
          # =================================================================

          def is_ip($s):
            def _v4: test("^((25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\\.){3}(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])$");
            def _v6:
              if test("^[0-9A-Fa-f:.]+$") | not then false
              else
                (if test("\\.")
                 then (split(":") | last) as $t
                   | if ($t | _v4) then .[0:length - ($t | length)] + "0:0" else "x" end
                 else . end) as $h
                | ($h | split("::")) as $p
                | if ($p | length) > 2 then false
                  else ([$p[] | if . == "" then empty else split(":")[] end]) as $g
                    | ($g | all(test("^[0-9A-Fa-f]{1,4}$")))
                      and (if ($p | length) == 2 then ($g | length) <= 7 else ($g | length) == 8 end)
                  end
              end;
            ($s | type) == "string" and ($s | _v4 or _v6);

          def to_epoch_ms($ts):
            def _num_ms($n):
              if   $n >= 1e17 then ($n / 1000000 | floor)
              elif $n >= 1e14 then ($n / 1000 | floor)
              elif $n >= 1e11 then ($n | floor)
              else ($n * 1000 | floor) end;
            if $ts == null or $ts == "" then null
            elif ($ts | type) == "number" then _num_ms($ts)
            elif ($ts | type) == "object" then
              (if ($ts.seconds // null) == null then null
               else ($ts.seconds * 1000 + ((($ts.nanos // 0) / 1000000) | floor)) end)
            elif ($ts | type) == "string" then
              if ($ts | test("^-?[0-9]+(\\.[0-9]+)?$")) then _num_ms($ts | tonumber)
              else
                ([$ts | ascii_upcase | capture("^(?<d>[0-9]{4}-[0-9]{2}-[0-9]{2})(?:[T ](?<t>[0-9]{2}:[0-9]{2}(?::[0-9]{2})?)(?:[.,](?<f>[0-9]+))?)? ?(?<z>Z|UTC|[+-][0-9]{2}(?::?[0-9]{2})?)?$")] | first) as $m
                | if $m == null then null
                  else
                    (($m.t // "00:00:00") | if length == 5 then . + ":00" else . end) as $t
                    | (($m.z // "Z") | if . == "Z" or . == "UTC" then 0
                        else (.[1:] | gsub(":"; "")) as $o
                          | ((if (.[0:1]) == "-" then -1 else 1 end)
                             * (($o[0:2] | tonumber) * 3600 + ((if ($o | length) >= 4 then $o[2:4] else "00" end) | tonumber) * 60))
                        end) as $off
                    | ((($m.d + "T" + $t + "Z") | fromdateiso8601) - $off) * 1000
                      + (((($m.f // "") + "000")[0:3]) | tonumber)
                  end
              end
            else null end;
          def to_iso($ts):
            to_epoch_ms($ts) as $ms
            | if $ms == null then null
              else ($ms / 1000 | floor) as $s
                | ($s | todate | rtrimstr("Z")) + "."
                  + ((1000 + (($ms - $s * 1000) | floor)) | tostring | .[1:]) + "Z"
              end;

          def prune: walk(if type == "object" then with_entries(select(.value != null and .value != {} and .value != [])) elif type == "array" then map(select(. != null)) else . end);

          . as $r
          | ( $r.packageVulnerabilityDetails // {} ) as $pvd
          | ( $r.resources // [] ) as $res
          | ( $res[0] // {} ) as $r0
          | ( $r0.details.awsEc2Instance // {} ) as $ec2
          | ( ($pvd.cvss // []) | (.[0] // {}) ) as $cvss0

          # Inspector severity -> ECS numeric event.severity (mirrors OCSF order)
          | ( { "INFORMATIONAL": 1, "LOW": 2, "MEDIUM": 3,
                "HIGH": 4, "CRITICAL": 5, "UNTRIAGED": 0 }[$r.severity] // 0 ) as $sevnum

          # Collect every IP the resource exposes for related.ip
          | ( ( ($ec2.ipV4Addresses // []) + ($ec2.ipV6Addresses // []) )
              | map(select(is_ip(.))) | unique ) as $ips

          | {
              "@timestamp": to_iso($r.updatedAt // $r.lastObservedAt // $r.firstObservedAt),
              ecs: { version: "9.5.0" },

              event: {
                kind: "alert",
                module: "aws",
                dataset: "aws.inspector",
                provider: "inspector",
                id: $r.findingArn,
                category: ["vulnerability"],
                type: ["info"],
                outcome: "unknown",
                severity: $sevnum,
                created: to_iso($r.firstObservedAt),
                start: to_iso($r.firstObservedAt),
                end: to_iso($r.lastObservedAt),
                reason: $r.title,
                url: ($pvd.sourceUrl // null)
              },

              message: $r.description,

              vulnerability: {
                id: $pvd.vulnerabilityId,
                description: ($r.description // $r.title),
                severity: $r.severity,
                reference: ($pvd.sourceUrl // ($pvd.referenceUrls // [])[0]),
                enumeration: ( if ($pvd.vulnerabilityId // "") | startswith("CVE")
                               then "CVE" else null end ),
                scanner: { vendor: "Amazon Inspector" },
                score: {
                  base: ($cvss0.baseScore // $r.inspectorScore),
                  version: $cvss0.version
                }
              },

              package: ( ($pvd.vulnerablePackages // []) | (.[0] // {})
                | { name: .name,
                    version: .version,
                    architecture: .arch,
                    type: .packageManager,
                    path: .filePath }
                | with_entries(select(.value != null)) ),

              cloud: {
                provider: "aws",
                region: $r0.region,
                account: { id: $r.awsAccountId },
                instance: { id: ( if ($r0.type // "") == "AWS_EC2_INSTANCE"
                                  then $r0.id else null end ) },
                machine: { type: $ec2.type }
              },

              host: {
                id: ( if ($r0.type // "") == "AWS_EC2_INSTANCE" then $r0.id else null end ),
                type: $ec2.type,
                ip: $ips,
                os: { platform: $ec2.platform }
              },

              related: {
                ip: $ips,
                hosts: ( [ $r0.id ] | map(select(. != null)) )
              }
            }
          | prune
