name: "AWS GuardDuty Findings to ECS v9.5.0"
description: "Normalizes Amazon GuardDuty finding records into Elastic Common Schema (ECS) v9.5.0 fields (event, cloud, host, source, destination, network, threat, rule, related), plus the aws.guardduty.* vendor namespace for finding detail."
author: "Monad"
contributors:
  - "https://github.com/behobu"
inputs:
  - "aws-guardduty"
tags:
  - "v9.5.0"
  - "ecs"
  - "aws"
  - "guardduty"
  - "intrusion_detection"
config:
  operations:
    - operation: "jq"
      arguments:
        key: ""
        query: |
          # =================================================================
          # AWS GuardDuty finding  ->  ECS v9.5.0
          # Input: ONE GuardDuty finding record per invocation.
          #
          #   event.kind      = alert          (a detection notification)
          #   event.category  = intrusion_detection
          #   event.type      = denied (if blocked) else info
          #   .updatedAt      -> @timestamp
          #   .type           -> event.action / rule.name / threat.*
          #   .id             -> event.id
          #   .severity       -> event.severity (numeric)
          #   remoteIpDetails -> source.{ip,port,geo,as}
          #   localIpDetails / instance NIC -> destination / host
          # =================================================================

          def is_ip($s):
            def _v4: test("^((25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])[.]){3}(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])$");
            def _v6:
              if (contains(":") and test("^[0-9A-Fa-f:.]+$")) | not then false
              else
                split("::") as $p
                | if ($p | length) > 2 then false
                  else
                    [$p[] | select(. != "") | split(":")[]] as $g
                    | (($g | length) > 0 and ($g[-1] | contains("."))) as $tail4
                    | (if $tail4 then $g[0:-1] else $g end) as $hex
                    | (($hex | length) + (if $tail4 then 2 else 0 end)) as $n
                    | (if $tail4 then ($g[-1] | _v4) else true end)
                      and all($hex[]; test("^[0-9A-Fa-f]{1,4}$"))
                      and (if ($p | length) == 2 then $n <= 7 else $n == 8 end)
                  end
              end;
            ($s | type) == "string" and ($s | _v4 or _v6);

          def to_epoch_ms($ts):
            def _n: if . == null then null else tonumber end;
            def _num_ms($n):
              if   $n >= 1e17 then ($n / 1000000 | floor)
              elif $n >= 1e14 then ($n / 1000 | floor)
              elif $n >= 1e11 then ($n | floor)
              else ($n * 1000 + 0.001 | floor) end;
            def _digits_ms($d):
              ($d | ltrimstr("-") | length) as $l
              | if   $l >= 18 then ($d[0:-6] | tonumber)
                elif $l >= 15 then ($d[0:-3] | tonumber)
                elif $l >= 12 then ($d | tonumber)
                else ($d | tonumber) * 1000 end;
            def _frac_ms($f): if $f == null then 0 else (($f + "000")[0:3] | tonumber) end;
            def _mon($m):
              if $m == null then null
              else {"JAN":1,"FEB":2,"MAR":3,"APR":4,"MAY":5,"JUN":6,
                    "JUL":7,"AUG":8,"SEP":9,"OCT":10,"NOV":11,"DEC":12}[$m[0:3]] end;
            def _zone($z):
              if $z == null or $z == "" then 0
              else
                ($z | if test("^(UTC|GMT|UT)[+-]") then sub("^(UTC|GMT|UT)"; "") else . end) as $z
                | if ($z | test("^[+-][0-9]{1,2}(:?[0-9]{2})?$")) then
                    ($z | capture("^(?<sg>[+-])(?<h>[0-9]{1,2}):?(?<m>[0-9]{2})?$")) as $o
                    | (if $o.sg == "-" then -1 else 1 end)
                      * (($o.h | tonumber) * 3600 + (($o.m // "0") | tonumber) * 60)
                  else
                    {"Z":0,"UTC":0,"GMT":0,"UT":0,"EST":-18000,"EDT":-14400,"CST":-21600,
                     "CDT":-18000,"MST":-25200,"MDT":-21600,"PST":-28800,"PDT":-25200}[$z]
                  end
              end;
            def _ms($c):
              ($c.y | tonumber | if . < 100 then (if . < 70 then . + 2000 else . + 1900 end) else . end) as $y
              | ($c.mo | _n) as $mo
              | ($c.d | tonumber) as $d
              | (($c.h // "0") | tonumber) as $h
              | (($c.mi // "0") | tonumber) as $mi
              | (($c.s // "0") | tonumber) as $s
              | _zone($c.z) as $off
              | if $mo == null or $off == null or $mo < 1 or $mo > 12 or $d < 1 or $d > 31
                   or $h > 23 or $mi > 59 or $s > 60 then null
                else
                  ($y - (if $mo <= 2 then 1 else 0 end)) as $yy
                  | ($yy / 400 | floor) as $era
                  | ($yy - $era * 400) as $yoe
                  | (((153 * ($mo + (if $mo > 2 then -3 else 9 end)) + 2) / 5 | floor) + $d - 1) as $doy
                  | ($yoe * 365 + ($yoe / 4 | floor) - ($yoe / 100 | floor) + $doy) as $doe
                  | ($era * 146097 + $doe - 719468) as $days
                  | ($days * 86400 + $h * 3600 + $mi * 60 + $s - $off) * 1000 + _frac_ms($c.f)
                end;
            def _str($raw):
              ($raw | ascii_upcase | sub("\\s*\\([^)]*\\)\\s*$"; "") | sub("^\\s+"; "") | sub("\\s+$"; "")) as $s
              | "(?<z>Z|(?:UTC|GMT|UT)?[+-][0-9]{1,2}(?::?[0-9]{2})?|[A-Z]{1,5})" as $Z
              | "(?<h>[0-9]{1,2}):(?<mi>[0-9]{2})(?::(?<s>[0-9]{2}))?(?:[.,](?<f>[0-9]+))?" as $T
              | if $s == "" then null
                elif ($s | test("^-?[0-9]+$")) then _digits_ms($s)
                elif ($s | test("^[0-9]+\\.[0-9]+$")) then
                  ($s | split(".")) as $p
                  | if ($p[0] | length) <= 11 then _digits_ms($p[0]) + _frac_ms($p[1])
                    else _digits_ms($p[0]) end
                elif ($s | test("^/DATE\\(-?[0-9]+([+-][0-9]{4})?\\)/$")) then
                  ($s | capture("(?<ms>-?[0-9]+)").ms | tonumber)
                else
                  first(
                    ($s | capture("^(?<y>[0-9]{4})[-/](?<mo>[0-9]{1,2})[-/](?<d>[0-9]{1,2})(?:[T ]+" + $T + ")?\\s*" + $Z + "?(?:\\s+[A-Z]{2,5})?$") | _ms(.)),
                    ($s | capture("^(?<y>[0-9]{4})(?<mo>[0-9]{2})(?<d>[0-9]{2})T(?<h>[0-9]{2})(?<mi>[0-9]{2})(?<s>[0-9]{2})(?:[.,](?<f>[0-9]+))?" + $Z + "?$") | _ms(.)),
                    ($s | capture("^(?:[A-Z]+,?\\s+)?(?<d>[0-9]{1,2})[ -](?<mon>[A-Z]{3,9})[ -](?<y>[0-9]{2,4})\\s+" + $T + "\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?:[A-Z]+,?\\s+)?(?<mon>[A-Z]{3,9})\\.?\\s+(?<d>[0-9]{1,2}),?\\s+(?<y>[0-9]{4})(?:,?\\s+" + $T + ")?\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?:[A-Z]+\\s+)?(?<mon>[A-Z]{3,9})\\s+(?<d>[0-9]{1,2})\\s+" + $T + "\\s+(?:" + $Z + "\\s+)?(?<y>[0-9]{4})$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?<d>[0-9]{1,2})/(?<mon>[A-Z]{3})/(?<y>[0-9]{4}):" + $T + "\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.))
                  ) // null
                end;
            if $ts == null then null
            elif ($ts | type) == "number" then _num_ms($ts)
            elif ($ts | type) == "string" then _str($ts)
            elif ($ts | type) == "object" then
              if   $ts["$date"] != null then to_epoch_ms($ts["$date"])
              elif $ts["$numberLong"] != null then to_epoch_ms($ts["$numberLong"])
              elif $ts.seconds != null then
                ($ts.seconds | tostring | tonumber) * 1000
                + ((($ts.nanos // 0) | tostring | tonumber) / 1000000 | floor)
              else null end
            else null end;
          def to_iso($ts):
            to_epoch_ms($ts) as $ms
            | if $ms == null then null
              else
                ($ms / 1000 | floor) as $s
                | ($s | todate)[0:19] + "." + ("00" + (($ms - $s * 1000) | tostring))[-3:] + "Z"
              end;

          . as $r
          | ($r.service // {}) as $svc
          | ($svc.action // {}) as $act
          | ($act.networkConnectionAction // {}) as $nca
          | ($nca.remoteIpDetails // {}) as $remote
          | ($remote.organization // {}) as $org
          | ($remote.geoLocation // {}) as $geo
          | ($r.resource // {}) as $res
          | (($res.instanceDetails // {}).networkInterfaces[0] // {}) as $nic
          | ($nca.localIpDetails // {}) as $local
          | ($nca.blocked == true) as $blocked
          | {
              "@timestamp": (to_iso($r.updatedAt // $r.createdAt)),
              "ecs": { "version": "9.5.0" },

              "message": $r.title,

              "event": {
                "kind": "alert",
                "category": [ "intrusion_detection" ],
                "type": [ (if $blocked then "denied" else "info" end) ],
                "outcome": "unknown",
                "action": $r.type,
                "id": $r.id,
                "severity": $r.severity,
                "provider": ($svc.serviceName // "guardduty"),
                "module": "guardduty",
                "dataset": "aws.guardduty",
                "reason": $r.description,
                "created": (to_iso($r.createdAt)),
                "start": (to_iso($svc.eventFirstSeen)),
                "end": (to_iso($svc.eventLastSeen)),
                "url": ("https://console.aws.amazon.com/guardduty/home?region=" + ($r.region // "") + "#/findings?fId=" + ($r.id // ""))
              },

              "rule": {
                "name": $r.type,
                "description": $r.title,
                "ruleset": "Amazon GuardDuty"
              },

              "cloud": {
                "provider": "aws",
                "region": $r.region,
                "account": { "id": $r.accountId },
                "availability_zone": (($res.instanceDetails // {}).availabilityZone),
                "instance": { "id": (($res.instanceDetails // {}).instanceId) },
                "machine": { "type": (($res.instanceDetails // {}).instanceType) }
              },

              "host": {
                "id": (($res.instanceDetails // {}).instanceId),
                "type": (($res.instanceDetails // {}).instanceType),
                "ip": ( [ (if is_ip($nic.privateIpAddress) then $nic.privateIpAddress else empty end),
                          (if is_ip($nic.publicIp) then $nic.publicIp else empty end) ] ),
                "hostname": ($nic.privateDnsName)
              },

              "source": {
                "ip": (if is_ip($remote.ipAddressV4) then $remote.ipAddressV4 else null end),
                "address": ($remote.ipAddressV4),
                "port": (($nca.remotePortDetails // {}).port),
                "geo": {
                  "country_name": (($remote.country // {}).countryName),
                  "city_name": (($remote.city // {}).cityName),
                  "location": ( if ($geo.lat != null and $geo.lon != null)
                                then (($geo.lat | tostring) + "," + ($geo.lon | tostring)) else null end )
                },
                "as": {
                  "number": (if $org.asn then ($org.asn | tonumber? // null) else null end),
                  "organization": { "name": $org.asnOrg }
                }
              },

              "destination": {
                "ip": (if is_ip($local.ipAddressV4) then $local.ipAddressV4 else null end),
                "address": ($local.ipAddressV4),
                "port": (($nca.localPortDetails // {}).port)
              },

              "network": {
                "transport": (if $nca.protocol then ($nca.protocol | ascii_downcase) else null end),
                "direction": (if $nca.connectionDirection then ($nca.connectionDirection | ascii_downcase) else null end)
              },

              "threat": {
                "framework": "MITRE ATT&CK",
                "indicator": {
                  "ip": (if is_ip($remote.ipAddressV4) then $remote.ipAddressV4 else null end),
                  "type": (if is_ip($remote.ipAddressV4) then "ipv4-addr" else null end)
                }
              },

              "related": {
                "ip": ( [ (if is_ip($remote.ipAddressV4) then $remote.ipAddressV4 else empty end),
                          (if is_ip($local.ipAddressV4) then $local.ipAddressV4 else empty end),
                          (if is_ip($nic.privateIpAddress) then $nic.privateIpAddress else empty end),
                          (if is_ip($nic.publicIp) then $nic.publicIp else empty end) ] | unique ),
                "hosts": ( [ (($res.instanceDetails // {}).instanceId) ] | map(select(. != null)) | unique )
              },

              "aws": {
                "guardduty": {
                  "finding_id": $r.id,
                  "finding_type": $r.type,
                  "schema_version": $r.schemaVersion,
                  "partition": $r.partition,
                  "detector_id": $svc.detectorId,
                  "resource_type": ($res.resourceType),
                  "resource_role": $svc.resourceRole,
                  "action_type": $act.actionType,
                  "count": $svc.count,
                  "archived": $svc.archived,
                  "blocked": $nca.blocked
                }
              }
            }
          | walk(if type == "object" then with_entries(select(.value != null and .value != "" and .value != {} and .value != [])) else . end)
