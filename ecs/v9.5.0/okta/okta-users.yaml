name: "Okta Users to ECS v9.5.0"
description: "Maps Okta Users directory records into Elastic Common Schema (ECS) v9.5.0 nested documents, covering event.*, user.*, related.*, and organization.* field sets."
author: "Monad"
contributors:
  - "https://github.com/behobu"
inputs:
  - "okta-users"
tags:
  - "v9.5.0"
  - "ecs"
  - "okta"
  - "users"
config:
  operations:
    - operation: "jq"
      arguments:
        key: ""
        query: |
          # ---------------------------------------------------------------
          # Okta Users (directory) -> ECS v9.5.0 (nested).
          # User inventory snapshot: event.kind=state, category=[iam],
          # type=[user,info], outcome=success.
          # ---------------------------------------------------------------
          def to_epoch_ms($ts):
            def _num_ms($n):
              if   $n >= 1e17 then ($n / 1000000 | floor)
              elif $n >= 1e14 then ($n / 1000 | floor)
              elif $n >= 1e11 then ($n | floor)
              else ($n * 1000 | floor) end;
            if $ts == null or $ts == "" then null
            elif ($ts | type) == "number" then _num_ms($ts)
            elif ($ts | type) == "object" then
              (if ($ts.seconds // null) == null then null
               else ($ts.seconds * 1000 + ((($ts.nanos // 0) / 1000000) | floor)) end)
            elif ($ts | type) == "string" then
              if ($ts | test("^-?[0-9]+(\\.[0-9]+)?$")) then _num_ms($ts | tonumber)
              else
                ([$ts | ascii_upcase | capture("^(?<d>[0-9]{4}-[0-9]{2}-[0-9]{2})(?:[T ](?<t>[0-9]{2}:[0-9]{2}(?::[0-9]{2})?)(?:[.,](?<f>[0-9]+))?)? ?(?<z>Z|UTC|[+-][0-9]{2}(?::?[0-9]{2})?)?$")] | first) as $m
                | if $m == null then null
                  else
                    (($m.t // "00:00:00") | if length == 5 then . + ":00" else . end) as $t
                    | (($m.z // "Z") | if . == "Z" or . == "UTC" then 0
                        else (.[1:] | gsub(":"; "")) as $o
                          | ((if (.[0:1]) == "-" then -1 else 1 end)
                             * (($o[0:2] | tonumber) * 3600 + ((if ($o | length) >= 4 then $o[2:4] else "00" end) | tonumber) * 60))
                        end) as $off
                    | ((($m.d + "T" + $t + "Z") | fromdateiso8601) - $off) * 1000
                      + (((($m.f // "") + "000")[0:3]) | tonumber)
                  end
              end
            else null end;
          def to_iso($ts):
            to_epoch_ms($ts) as $ms
            | if $ms == null then null
              else ($ms / 1000 | floor) as $s
                | ($s | todate | rtrimstr("Z")) + "."
                  + ((1000 + (($ms - $s * 1000) | floor)) | tostring | .[1:]) + "Z"
              end;

          . as $r |
          ($r.profile // {}) as $p |
          {
            "@timestamp": (to_iso($r.lastUpdated // $r.created)),
            "ecs": { "version": "9.5.0" },

            "event": {
              "kind": "state",
              "category": ["iam"],
              "type": ["user", "info"],
              "outcome": "success",
              "action": "user-inventory",
              "provider": "okta",
              "module": "okta",
              "dataset": "okta.users",
              "id": $r.id,
              "created": (to_iso($r.created))
            },

            "user": {
              "id":        $r.id,
              "name":      ($p.login // $p.email),
              "email":     $p.email,
              "full_name": ($p.displayName // (($p.firstName // "") + " " + ($p.lastName // "") | ltrimstr(" ") | rtrimstr(" "))),
              "domain":    (($p.email // $p.login // "") | (split("@") | if length > 1 then .[1] else null end))
            },

            "organization": {
              "name": $p.organization
            },

            "source": {
              "user": {
                "id":    $r.id,
                "name":  ($p.login // $p.email),
                "email": $p.email
              }
            },

            "okta": {
              "user": {
                "status":           $r.status,
                "title":            $p.title,
                "department":       $p.department,
                "employee_number":  $p.employeeNumber,
                "manager":          $p.manager,
                "user_type":        $p.userType,
                "last_login":       (to_iso($r.lastLogin)),
                "status_changed":   (to_iso($r.statusChanged)),
                "password_changed": (to_iso($r.passwordChanged)),
                "activated":        (to_iso($r.activated)),
                "credential_provider": ($r.credentials.provider.type // null)
              }
            },

            "related": {
              "user": ([$p.login, $p.email, $r.id, $p.displayName] | map(select(. != null and . != "")) | unique)
            }
          }
          | walk(if type == "object" then with_entries(select(.value != null and .value != "" and .value != {} and .value != [])) else . end)
