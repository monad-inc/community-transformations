name: "Google Workspace Gemini Activity to ECS v9.5.0"
description: "Maps Google Workspace Admin SDK Reports 'gemini_in_workspace_apps' activity records into a nested Elastic Common Schema (ECS) v9.5.0 document (event categorization, user, source, cloud, and related.* field groups)."
author: "Monad"
contributors:
  - "https://github.com/behobu"
inputs:
  - "google-workspace-gemini-activity"
tags:
  - "v9.5.0"
  - "ecs"
  - "google"
  - "google-workspace"
  - "gemini"
config:
  operations:
    - operation: "jq"
      arguments:
        key: ""
        query: |
          # ---------------------------------------------------------------
          # Google Workspace "gemini_in_workspace_apps" activity -> ECS v9.5.0
          # event.category "api" (a Gemini feature-utilization is an
          # application/API interaction). One nested doc; one prune pass.
          # ---------------------------------------------------------------
          def is_ip($s):
            def _v4: test("^((25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\\.){3}(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])$");
            def _v6:
              if test("^[0-9A-Fa-f:.]+$") | not then false
              else
                (if test("\\.")
                 then (split(":") | last) as $t
                   | if ($t | _v4) then .[0:length - ($t | length)] + "0:0" else "x" end
                 else . end) as $h
                | ($h | split("::")) as $p
                | if ($p | length) > 2 then false
                  else ([$p[] | if . == "" then empty else split(":")[] end]) as $g
                    | ($g | all(test("^[0-9A-Fa-f]{1,4}$")))
                      and (if ($p | length) == 2 then ($g | length) <= 7 else ($g | length) == 8 end)
                  end
              end;
            ($s | type) == "string" and ($s | _v4 or _v6);

          def to_epoch_ms($ts):
            def _num_ms($n):
              if   $n >= 1e17 then ($n / 1000000 | floor)
              elif $n >= 1e14 then ($n / 1000 | floor)
              elif $n >= 1e11 then ($n | floor)
              else ($n * 1000 | floor) end;
            if $ts == null or $ts == "" then null
            elif ($ts | type) == "number" then _num_ms($ts)
            elif ($ts | type) == "object" then
              (if ($ts.seconds // null) == null then null
               else ($ts.seconds * 1000 + ((($ts.nanos // 0) / 1000000) | floor)) end)
            elif ($ts | type) == "string" then
              if ($ts | test("^-?[0-9]+(\\.[0-9]+)?$")) then _num_ms($ts | tonumber)
              else
                ([$ts | ascii_upcase | capture("^(?<d>[0-9]{4}-[0-9]{2}-[0-9]{2})(?:[T ](?<t>[0-9]{2}:[0-9]{2}(?::[0-9]{2})?)(?:[.,](?<f>[0-9]+))?)? ?(?<z>Z|UTC|[+-][0-9]{2}(?::?[0-9]{2})?)?$")] | first) as $m
                | if $m == null then null
                  else
                    (($m.t // "00:00:00") | if length == 5 then . + ":00" else . end) as $t
                    | (($m.z // "Z") | if . == "Z" or . == "UTC" then 0
                        else (.[1:] | gsub(":"; "")) as $o
                          | ((if (.[0:1]) == "-" then -1 else 1 end)
                             * (($o[0:2] | tonumber) * 3600 + ((if ($o | length) >= 4 then $o[2:4] else "00" end) | tonumber) * 60))
                        end) as $off
                    | ((($m.d + "T" + $t + "Z") | fromdateiso8601) - $off) * 1000
                      + (((($m.f // "") + "000")[0:3]) | tonumber)
                  end
              end
            else null end;
          def to_iso($ts):
            to_epoch_ms($ts) as $ms
            | if $ms == null then null
              else ($ms / 1000 | floor) as $s
                | ($s | todate | rtrimstr("Z")) + "."
                  + ((1000 + (($ms - $s * 1000) | floor)) | tostring | .[1:]) + "Z"
              end;

          . as $r
          | ($r.id // {}) as $id
          | ($r.actor // {}) as $ac
          | ($r.events[0] // {}) as $ev
          | ((($ev.parameters // []) | map({ (.name): (.value // .boolValue // .intValue // .multiValue) }) | add) // {}) as $p
          | ($r.ipAddress // null) as $ip

          | {
              "@timestamp": to_iso($id.time),
              "ecs": { "version": "9.5.0" },

              "event": {
                "kind": "event",
                "category": ["api"],
                "type": ["access", "info"],
                "outcome": "success",
                "action": ($p.action // $ev.name // null),
                "provider": ($id.applicationName // "gemini_in_workspace_apps"),
                "id": ($id.uniqueQualifier // null),
                "module": "google_workspace",
                "dataset": "google_workspace.gemini"
              },

              "user": {
                "email": ($ac.email // null),
                "name": ($ac.email | if . == null then null else split("@")[0] end),
                "id": ($ac.profileId // null),
                "domain": ($r.ownerDomain // null)
              },

              "source": {
                "ip": (if is_ip($ip) then $ip else null end),
                "address": $ip
              },

              "cloud": {
                "provider": "google_workspace",
                "account": { "id": ($id.customerId // null) }
              },

              "organization": {
                "name": ($r.ownerDomain // null)
              },

              "related": {
                "user": ([$ac.email, $ac.profileId] | map(select(. != null)) | unique),
                "ip": ([ (if is_ip($ip) then $ip else null end) ] | map(select(. != null)) | unique)
              },

              "google_workspace": {
                "gemini": {
                  "app_name": ($p.app_name // null),
                  "action": ($p.action // null),
                  "event_category": ($p.event_category // null),
                  "feature_source": ($p.feature_source // null)
                },
                "event": {
                  "type": ($ev.type // null),
                  "name": ($ev.name // null)
                }
              }
            }
          | walk(
              if type == "object"
              then with_entries(select(.value != null and .value != {} and .value != []))
              elif type == "array" then map(select(. != null))
              else . end
            )
