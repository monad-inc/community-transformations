name: "Google Cloud Audit Logs to ECS v9.5.0"
description: "Transforms Google Cloud Logs records (Cloud Audit Logs, App Engine request logs, and plain log entries) into Elastic Common Schema (ECS) v9.5.0, populating the event, cloud, user, source, user_agent, http, url, error, log, and related field sets."
author: "Monad"
contributors:
  - "https://github.com/behobu"
inputs:
  - "google-cloud-logs"
tags:
  - "v9.5.0"
  - "ecs"
  - "google"
  - "gcp"
  - "audit"
config:
  operations:
    - operation: "jq"
      arguments:
        key: ""
        query: |
          # ---------------------------------------------------------------
          # Google Cloud Logs -> ECS v9.5.0 (nested). One record/call.
          # Input is the connector's Go JSON encoding of a Cloud Logging
          # LogEntry (not the REST camelCase shape):
          #   insert_id, log_name, resource{type,labels}
          #   timestamp / receive_timestamp = {seconds, nanos}
          #   severity = LogSeverity number (0 DEFAULT … 800 EMERGENCY)
          #   Payload.ProtoPayload{type_url, value}  (decoded AuditLog /
          #     RequestLog with snake_case keys when proto parsing is on; a
          #     base64 string when it is off)
          #   Payload.TextPayload / Payload.JsonPayload for other entries
          # RFC 3339 string timestamps and string severities (synthetic data)
          # are accepted too.
          # ---------------------------------------------------------------
          def is_ip($s):
            def _v4: test("^((25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])[.]){3}(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])$");
            def _v6:
              if (contains(":") and test("^[0-9A-Fa-f:.]+$")) | not then false
              else
                split("::") as $p
                | if ($p | length) > 2 then false
                  else
                    [$p[] | select(. != "") | split(":")[]] as $g
                    | (($g | length) > 0 and ($g[-1] | contains("."))) as $tail4
                    | (if $tail4 then $g[0:-1] else $g end) as $hex
                    | (($hex | length) + (if $tail4 then 2 else 0 end)) as $n
                    | (if $tail4 then ($g[-1] | _v4) else true end)
                      and all($hex[]; test("^[0-9A-Fa-f]{1,4}$"))
                      and (if ($p | length) == 2 then $n <= 7 else $n == 8 end)
                  end
              end;
            ($s | type) == "string" and ($s | _v4 or _v6);

          # Epoch MILLISECONDS from any common timestamp form; null if empty or unparseable.
          def to_epoch_ms($ts):
            def _n: if . == null then null else tonumber end;
            def _num_ms($n):
              if   $n >= 1e17 then ($n / 1000000 | floor)
              elif $n >= 1e14 then ($n / 1000 | floor)
              elif $n >= 1e11 then ($n | floor)
              else ($n * 1000 + 0.001 | floor) end;
            def _digits_ms($d):
              ($d | ltrimstr("-") | length) as $l
              | if   $l >= 18 then ($d[0:-6] | tonumber)
                elif $l >= 15 then ($d[0:-3] | tonumber)
                elif $l >= 12 then ($d | tonumber)
                else ($d | tonumber) * 1000 end;
            def _frac_ms($f): if $f == null then 0 else (($f + "000")[0:3] | tonumber) end;
            def _mon($m):
              if $m == null then null
              else {"JAN":1,"FEB":2,"MAR":3,"APR":4,"MAY":5,"JUN":6,
                    "JUL":7,"AUG":8,"SEP":9,"OCT":10,"NOV":11,"DEC":12}[$m[0:3]] end;
            def _zone($z):
              if $z == null or $z == "" then 0
              else
                ($z | if test("^(UTC|GMT|UT)[+-]") then sub("^(UTC|GMT|UT)"; "") else . end) as $z
                | if ($z | test("^[+-][0-9]{1,2}(:?[0-9]{2})?$")) then
                    ($z | capture("^(?<sg>[+-])(?<h>[0-9]{1,2}):?(?<m>[0-9]{2})?$")) as $o
                    | (if $o.sg == "-" then -1 else 1 end)
                      * (($o.h | tonumber) * 3600 + (($o.m // "0") | tonumber) * 60)
                  else
                    {"Z":0,"UTC":0,"GMT":0,"UT":0,"EST":-18000,"EDT":-14400,"CST":-21600,
                     "CDT":-18000,"MST":-25200,"MDT":-21600,"PST":-28800,"PDT":-25200}[$z]
                  end
              end;
            def _ms($c):
              ($c.y | tonumber | if . < 100 then (if . < 70 then . + 2000 else . + 1900 end) else . end) as $y
              | ($c.mo | _n) as $mo
              | ($c.d | tonumber) as $d
              | (($c.h // "0") | tonumber) as $h
              | (($c.mi // "0") | tonumber) as $mi
              | (($c.s // "0") | tonumber) as $s
              | _zone($c.z) as $off
              | if $mo == null or $off == null or $mo < 1 or $mo > 12 or $d < 1 or $d > 31
                   or $h > 23 or $mi > 59 or $s > 60 then null
                else
                  ($y - (if $mo <= 2 then 1 else 0 end)) as $yy
                  | ($yy / 400 | floor) as $era
                  | ($yy - $era * 400) as $yoe
                  | (((153 * ($mo + (if $mo > 2 then -3 else 9 end)) + 2) / 5 | floor) + $d - 1) as $doy
                  | ($yoe * 365 + ($yoe / 4 | floor) - ($yoe / 100 | floor) + $doy) as $doe
                  | ($era * 146097 + $doe - 719468) as $days
                  | ($days * 86400 + $h * 3600 + $mi * 60 + $s - $off) * 1000 + _frac_ms($c.f)
                end;
            def _str($raw):
              ($raw | ascii_upcase | sub("\\s*\\([^)]*\\)\\s*$"; "") | sub("^\\s+"; "") | sub("\\s+$"; "")) as $s
              | "(?<z>Z|(?:UTC|GMT|UT)?[+-][0-9]{1,2}(?::?[0-9]{2})?|[A-Z]{1,5})" as $Z
              | "(?<h>[0-9]{1,2}):(?<mi>[0-9]{2})(?::(?<s>[0-9]{2}))?(?:[.,](?<f>[0-9]+))?" as $T
              | if $s == "" then null
                elif ($s | test("^-?[0-9]+$")) then _digits_ms($s)
                elif ($s | test("^[0-9]+\\.[0-9]+$")) then
                  ($s | split(".")) as $p
                  | if ($p[0] | length) <= 11 then _digits_ms($p[0]) + _frac_ms($p[1])
                    else _digits_ms($p[0]) end
                elif ($s | test("^/DATE\\(-?[0-9]+([+-][0-9]{4})?\\)/$")) then
                  ($s | capture("(?<ms>-?[0-9]+)").ms | tonumber)
                else
                  first(
                    ($s | capture("^(?<y>[0-9]{4})[-/](?<mo>[0-9]{1,2})[-/](?<d>[0-9]{1,2})(?:[T ]+" + $T + ")?\\s*" + $Z + "?(?:\\s+[A-Z]{2,5})?$") | _ms(.)),
                    ($s | capture("^(?<y>[0-9]{4})(?<mo>[0-9]{2})(?<d>[0-9]{2})T(?<h>[0-9]{2})(?<mi>[0-9]{2})(?<s>[0-9]{2})(?:[.,](?<f>[0-9]+))?" + $Z + "?$") | _ms(.)),
                    ($s | capture("^(?:[A-Z]+,?\\s+)?(?<d>[0-9]{1,2})[ -](?<mon>[A-Z]{3,9})[ -](?<y>[0-9]{2,4})\\s+" + $T + "\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?:[A-Z]+,?\\s+)?(?<mon>[A-Z]{3,9})\\.?\\s+(?<d>[0-9]{1,2}),?\\s+(?<y>[0-9]{4})(?:,?\\s+" + $T + ")?\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?:[A-Z]+\\s+)?(?<mon>[A-Z]{3,9})\\s+(?<d>[0-9]{1,2})\\s+" + $T + "\\s+(?:" + $Z + "\\s+)?(?<y>[0-9]{4})$") | .mo = _mon(.mon) | _ms(.)),
                    ($s | capture("^(?<d>[0-9]{1,2})/(?<mon>[A-Z]{3})/(?<y>[0-9]{4}):" + $T + "\\s*" + $Z + "?$") | .mo = _mon(.mon) | _ms(.))
                  ) // null
                end;
            if $ts == null then null
            elif ($ts | type) == "number" then _num_ms($ts)
            elif ($ts | type) == "string" then _str($ts)
            elif ($ts | type) == "object" then
              if   $ts["$date"] != null then to_epoch_ms($ts["$date"])
              elif $ts["$numberLong"] != null then to_epoch_ms($ts["$numberLong"])
              elif $ts.seconds != null then
                ($ts.seconds | tostring | tonumber) * 1000
                + ((($ts.nanos // 0) | tostring | tonumber) / 1000000 | floor)
              else null end
            else null end;

          # requires: to_epoch_ms
          # UTC ISO 8601 with milliseconds ("2026-10-20T13:04:05.123Z") from any form
          # to_epoch_ms accepts; null if empty or unparseable.
          def to_iso($ts):
            to_epoch_ms($ts) as $ms
            | if $ms == null then null
              else
                ($ms / 1000 | floor) as $s
                | ($s | todate)[0:19] + "." + ("00" + (($ms - $s * 1000) | tostring))[-3:] + "Z"
              end;

          def sev_name($s):
            if ($s | type) == "string" then ($s | ascii_downcase)
            elif ($s | type) == "number" then
              ({"0":"default","100":"debug","200":"info","300":"notice","400":"warning",
                "500":"error","600":"critical","700":"alert","800":"emergency"}[$s | tostring])
            else null end;

          . as $r
          | (($r.resource // {}).labels // {}) as $lbl
          | ($r.Payload // {}) as $pl
          | ($pl.ProtoPayload // {}) as $pp
          | ($pp.type_url // "") as $turl
          | (if ($pp.value | type) == "object" then $pp.value else {} end) as $v
          | ($v != {} and ($turl | endswith("google.cloud.audit.AuditLog"))) as $is_audit
          | ($v != {} and ($turl | endswith("google.appengine.logging.v1.RequestLog"))) as $is_reqlog
          | ($v.request_metadata // {}) as $rm
          | ($v.authentication_info // {}) as $ai
          | (($r.log_name // "") | split("/logs/")) as $ln
          | ($lbl.project_id // ($ln[0] | ltrimstr("projects/") | select(. != "")) // null) as $project

          | (if $is_audit then $v.method_name
             elif $is_reqlog then ([$v.method, $v.resource] | map(select(. != null)) | join(" "))
             else null end) as $action
          | (if $is_audit then $v.service_name elif $is_reqlog then ($v.host // $v.app_id) else null end) as $service
          | (if $is_audit then $rm.caller_ip elif $is_reqlog then $v.ip else null end) as $caller
          | (if $is_audit then $rm.caller_supplied_user_agent elif $is_reqlog then $v.user_agent else null end) as $ua
          | (if $is_audit then $v.resource_name elif $is_reqlog then $v.resource else null end) as $target
          | (if $is_audit then (($v.status // {}).code // 0)
             elif $is_reqlog then ($v.status // null)
             else null end) as $code

          | (if $code == null then "unknown"
             elif $is_reqlog then (if $code < 400 then "success" else "failure" end)
             elif $code == 0 then "success" else "failure" end) as $outcome

          | (if $is_audit then
               ((($v.method_name // "") | split(".") | last) // "" | ascii_downcase) as $verb
               | [ (if   ($verb | test("^(insert|create|add|import|generate)")) then "creation"
                    elif ($verb | test("^(get|list|read|search|aggregatedlist|batchget|lookup|query|testiampermissions|export)")) then "access"
                    elif ($verb | test("^(update|patch|set|write|replace|modify|enable|disable|move|rename|start|stop|reset|resize|attach|detach)")) then "change"
                    elif ($verb | test("^(delete|remove|destroy|purge|undelete)")) then "deletion"
                    else "info" end),
                   (if $code == 7 then "denied" else empty end) ]
             elif $is_reqlog then [ (if ($code // 0) >= 500 then "error" else "access" end) ]
             else null end) as $etype

          | {
              "@timestamp": to_iso($r.timestamp),
              "ecs": { "version": "9.5.0" },

              "event": {
                "kind": "event",
                "category": (if $is_audit then ["api"] elif $is_reqlog then ["web"] else null end),
                "type": $etype,
                "outcome": $outcome,
                "action": $action,
                "id": $r.insert_id,
                "provider": $service,
                "code": (if $code == null then null else ($code | tostring) end),
                "created": to_iso($r.receive_timestamp)
              },

              "cloud": {
                "provider": "gcp",
                "project": { "id": $project },
                "region": ($lbl.region // $lbl.location),
                "availability_zone": $lbl.zone,
                "service": { "name": $service },
                "instance": { "id": $lbl.instance_id }
              },

              "user": (if $ai.principal_email then {
                "name": $ai.principal_email,
                "email": $ai.principal_email,
                "id": $ai.principal_subject
              } else null end),

              "source": {
                "ip": (if is_ip($caller) then $caller else null end),
                "address": $caller
              },

              "user_agent": { "original": $ua },

              "http": (if $is_reqlog then {
                "request": { "method": $v.method },
                "response": { "status_code": $code }
              } else null end),

              "url": (if $is_reqlog then { "domain": $v.host, "path": $v.resource } else null end),

              "error": (if $is_audit and $outcome == "failure" then {
                "code": ($code | tostring),
                "message": ($v.status // {}).message
              } else null end),

              "log": {
                "level": sev_name($r.severity),
                "logger": $r.log_name
              },

              "message": (
                if $is_audit then ($action // "") + (if $target then " on " + $target else "" end)
                elif $is_reqlog then $action + (if $code != null then " -> \($code)" else "" end)
                elif $pl.TextPayload then $pl.TextPayload
                elif $pl.JsonPayload then ($pl.JsonPayload.message // ($pl.JsonPayload | tostring))
                else null end
              ),

              "related": {
                "ip": [ (if is_ip($caller) then $caller else empty end) ],
                "user": [ $ai.principal_email | select(. != null) ]
              }
            }
          | walk(
              if type == "object" then with_entries(select(.value != null and .value != "" and .value != [] and .value != {}))
              elif type == "array" then map(select(. != null and . != {}))
              else . end)
