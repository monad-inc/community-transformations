name: "Atlassian Confluence Audit Logs to ECS v9.5.0"
description: "Normalizes Atlassian Confluence audit log records into Elastic Common Schema (ECS) v9.5.0 fields (event, user, source, related, and the confluence.* namespace), categorizing each record as a configuration change/creation/deletion on the affected Confluence object."
author: "Monad"
contributors:
  - "https://github.com/behobu"
inputs:
  - "atlassian-confluence-audit-logs"
tags:
  - "v9.5.0"
  - "ecs"
  - "atlassian"
  - "confluence"
  - "audit"
config:
  operations:
    - operation: "jq"
      arguments:
        key: ""
        query: |
          # =================================================================
          # Atlassian Confluence Audit Logs  ->  ECS v9.5.0
          # Input: ONE Confluence audit record per invocation.
          #   .creationDate (epoch-ms)  -> @timestamp
          #   .summary                  -> event.action
          #   .category                 -> event.type derivation + confluence.category
          #   .author.*                 -> user.*
          #   .remoteAddress            -> source.ip / source.address
          #   .affectedObject.*         -> confluence.affected_object.*
          # =================================================================

          def is_ip($s):
            def _v4: test("^((25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\\.){3}(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])$");
            def _v6:
              if test("^[0-9A-Fa-f:.]+$") | not then false
              else
                (if test("\\.")
                 then (split(":") | last) as $t
                   | if ($t | _v4) then .[0:length - ($t | length)] + "0:0" else "x" end
                 else . end) as $h
                | ($h | split("::")) as $p
                | if ($p | length) > 2 then false
                  else ([$p[] | if . == "" then empty else split(":")[] end]) as $g
                    | ($g | all(test("^[0-9A-Fa-f]{1,4}$")))
                      and (if ($p | length) == 2 then ($g | length) <= 7 else ($g | length) == 8 end)
                  end
              end;
            ($s | type) == "string" and ($s | _v4 or _v6);

          def to_epoch_ms($ts):
            def _num_ms($n):
              if   $n >= 1e17 then ($n / 1000000 | floor)
              elif $n >= 1e14 then ($n / 1000 | floor)
              elif $n >= 1e11 then ($n | floor)
              else ($n * 1000 | floor) end;
            if $ts == null or $ts == "" then null
            elif ($ts | type) == "number" then _num_ms($ts)
            elif ($ts | type) == "object" then
              (if ($ts.seconds // null) == null then null
               else ($ts.seconds * 1000 + ((($ts.nanos // 0) / 1000000) | floor)) end)
            elif ($ts | type) == "string" then
              if ($ts | test("^-?[0-9]+(\\.[0-9]+)?$")) then _num_ms($ts | tonumber)
              else
                ([$ts | ascii_upcase | capture("^(?<d>[0-9]{4}-[0-9]{2}-[0-9]{2})(?:[T ](?<t>[0-9]{2}:[0-9]{2}(?::[0-9]{2})?)(?:[.,](?<f>[0-9]+))?)? ?(?<z>Z|UTC|[+-][0-9]{2}(?::?[0-9]{2})?)?$")] | first) as $m
                | if $m == null then null
                  else
                    (($m.t // "00:00:00") | if length == 5 then . + ":00" else . end) as $t
                    | (($m.z // "Z") | if . == "Z" or . == "UTC" then 0
                        else (.[1:] | gsub(":"; "")) as $o
                          | ((if (.[0:1]) == "-" then -1 else 1 end)
                             * (($o[0:2] | tonumber) * 3600 + ((if ($o | length) >= 4 then $o[2:4] else "00" end) | tonumber) * 60))
                        end) as $off
                    | ((($m.d + "T" + $t + "Z") | fromdateiso8601) - $off) * 1000
                      + (((($m.f // "") + "000")[0:3]) | tonumber)
                  end
              end
            else null end;
          def to_iso($ts):
            to_epoch_ms($ts) as $ms
            | if $ms == null then null
              else ($ms / 1000 | floor) as $s
                | ($s | todate | rtrimstr("Z")) + "."
                  + ((1000 + (($ms - $s * 1000) | floor)) | tostring | .[1:]) + "Z"
              end;

          def lc($s): ($s // "") | ascii_downcase;

          def prune: walk(if type == "object" then with_entries(select(.value != null and .value != {} and .value != [])) elif type == "array" then map(select(. != null)) else . end);

          . as $r
          | ($r.author // {}) as $au
          | (lc($r.summary) + " " + lc($r.description) + " " + lc($r.category)) as $txt
          | ( if   ($txt | test("creat|add|grant|enabl")) then "creation"
              elif ($txt | test("delet|remov|revok|disabl")) then "deletion"
              elif ($txt | test("view|read|access|export|download")) then "access"
              elif ($txt | test("updat|chang|modif|edit|renam|move|permission")) then "change"
              else "info" end ) as $etype

          | {
              "@timestamp": to_iso($r.creationDate),
              ecs: { version: "9.5.0" },

              event: {
                kind: "event",
                category: ["configuration"],
                type: [$etype],
                outcome: "success",
                action: $r.summary,
                provider: "confluence",
                module: "confluence",
                original: ($r | tojson)
              },

              user: {
                name: ($au.displayName // $au.publicName),
                id: $au.accountId
              },

              source: (if is_ip($r.remoteAddress)
                       then { ip: $r.remoteAddress, address: $r.remoteAddress }
                       else null end),

              message: ($r.description // $r.summary),

              related: {
                user: ([$au.displayName, $au.publicName] | map(select(. != null)) | unique),
                ip: ([ (if is_ip($r.remoteAddress) then $r.remoteAddress else null end) ] | map(select(. != null)) | unique)
              },

              confluence: {
                category: $r.category,
                sys_admin: $r.sysAdmin,
                super_admin: $r.superAdmin,
                affected_object: {
                  name: $r.affectedObject.name,
                  type: $r.affectedObject.objectType
                },
                changed_values: ($r.changedValues | if . == null then null else tojson end),
                associated_objects: ($r.associatedObjects | if . == null then null else tojson end)
              }
            }
          | prune
