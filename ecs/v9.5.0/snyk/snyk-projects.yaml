name: "Snyk Project Metadata to ECS v9.5.0"
description: "Transforms Snyk Project Metadata into Elastic Common Schema (ECS) v9.5.0 documents, populating event categorization (asset/package), the package.* field set, labels, and the snyk.* custom namespace."
author: "Monad"
contributors:
  - "https://github.com/behobu"
inputs:
  - "snyk-projects"
tags:
  - "v9.5.0"
  - "ecs"
  - "snyk"
  - "inventory"
config:
  operations:
    - operation: "jq"
      arguments:
        key: ""
        query: |
          # ---------------------------------------------------------------
          # Snyk /projects record -> ECS v9.5.0 (nested). One record per call.
          # event.kind: asset ; event.category: [package] ; type: [info]
          # A Snyk project is an inventoried software asset (a scanned
          # manifest), so it maps to an asset/package inventory document.
          # ---------------------------------------------------------------
          def to_epoch_ms($ts):
            def _num_ms($n):
              if   $n >= 1e17 then ($n / 1000000 | floor)
              elif $n >= 1e14 then ($n / 1000 | floor)
              elif $n >= 1e11 then ($n | floor)
              else ($n * 1000 | floor) end;
            if $ts == null or $ts == "" then null
            elif ($ts | type) == "number" then _num_ms($ts)
            elif ($ts | type) == "object" then
              (if ($ts.seconds // null) == null then null
               else ($ts.seconds * 1000 + ((($ts.nanos // 0) / 1000000) | floor)) end)
            elif ($ts | type) == "string" then
              if ($ts | test("^-?[0-9]+(\\.[0-9]+)?$")) then _num_ms($ts | tonumber)
              else
                ([$ts | ascii_upcase | capture("^(?<d>[0-9]{4}-[0-9]{2}-[0-9]{2})(?:[T ](?<t>[0-9]{2}:[0-9]{2}(?::[0-9]{2})?)(?:[.,](?<f>[0-9]+))?)? ?(?<z>Z|UTC|[+-][0-9]{2}(?::?[0-9]{2})?)?$")] | first) as $m
                | if $m == null then null
                  else
                    (($m.t // "00:00:00") | if length == 5 then . + ":00" else . end) as $t
                    | (($m.z // "Z") | if . == "Z" or . == "UTC" then 0
                        else (.[1:] | gsub(":"; "")) as $o
                          | ((if (.[0:1]) == "-" then -1 else 1 end)
                             * (($o[0:2] | tonumber) * 3600 + ((if ($o | length) >= 4 then $o[2:4] else "00" end) | tonumber) * 60))
                        end) as $off
                    | ((($m.d + "T" + $t + "Z") | fromdateiso8601) - $off) * 1000
                      + (((($m.f // "") + "000")[0:3]) | tonumber)
                  end
              end
            else null end;
          def to_iso($ts):
            to_epoch_ms($ts) as $ms
            | if $ms == null then null
              else ($ms / 1000 | floor) as $s
                | ($s | todate | rtrimstr("Z")) + "."
                  + ((1000 + (($ms - $s * 1000) | floor)) | tostring | .[1:]) + "Z"
              end;

          . as $r
          | ($r.attributes // {}) as $a
          | {
              "@timestamp": (to_iso($a.created) // (now | todateiso8601)),
              "ecs": { "version": "9.5.0" },
              "event": {
                "kind": "asset",
                "category": [ "package" ],
                "type": [ "info" ],
                "id": $r.id,
                "created": to_iso($a.created),
                "provider": "snyk",
                "module": "snyk",
                "dataset": "snyk.projects"
              },
              "package": {
                "name": $a.name,
                "type": $a.type,
                "reference": $a.target_file
              },
              "message": $a.name,
              "labels": (
                ( [ $a.tags[]? | select(.key != null) | { key: .key, value: (.value // "") } ]
                  | from_entries )
                // null
              ),
              "snyk": {
                "project": {
                  "origin": $a.origin,
                  "status": $a.status,
                  "target_file": $a.target_file,
                  "target_reference": $a.target_reference,
                  "business_criticality": $a.business_criticality,
                  "environment": $a.environment,
                  "lifecycle": $a.lifecycle,
                  "read_only": $a.read_only
                }
              }
            }
            | walk( if type == "object" then with_entries(select(.value != null and .value != [] and .value != {} and .value != "")) else . end )
