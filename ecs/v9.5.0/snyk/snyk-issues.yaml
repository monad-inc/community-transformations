name: "Snyk Issue Findings to ECS v9.5.0"
description: "Transforms Snyk Issue Findings into Elastic Common Schema (ECS) v9.5.0 documents, populating event categorization, the vulnerability.* and package.* field sets, and related.* aggregation."
author: "Monad"
contributors:
  - "https://github.com/behobu"
inputs:
  - "snyk-issues"
tags:
  - "v9.5.0"
  - "ecs"
  - "snyk"
  - "vulnerability"
config:
  operations:
    - operation: "jq"
      arguments:
        key: ""
        query: |
          # ---------------------------------------------------------------
          # Snyk /issues record -> ECS v9.5.0 (nested). One record per call.
          # event.kind: alert ; event.category: [vulnerability] ; type: [info]
          # ---------------------------------------------------------------
          def to_epoch_ms($ts):
            def _num_ms($n):
              if   $n >= 1e17 then ($n / 1000000 | floor)
              elif $n >= 1e14 then ($n / 1000 | floor)
              elif $n >= 1e11 then ($n | floor)
              else ($n * 1000 | floor) end;
            if $ts == null or $ts == "" then null
            elif ($ts | type) == "number" then _num_ms($ts)
            elif ($ts | type) == "object" then
              (if ($ts.seconds // null) == null then null
               else ($ts.seconds * 1000 + ((($ts.nanos // 0) / 1000000) | floor)) end)
            elif ($ts | type) == "string" then
              if ($ts | test("^-?[0-9]+(\\.[0-9]+)?$")) then _num_ms($ts | tonumber)
              else
                ([$ts | ascii_upcase | capture("^(?<d>[0-9]{4}-[0-9]{2}-[0-9]{2})(?:[T ](?<t>[0-9]{2}:[0-9]{2}(?::[0-9]{2})?)(?:[.,](?<f>[0-9]+))?)? ?(?<z>Z|UTC|[+-][0-9]{2}(?::?[0-9]{2})?)?$")] | first) as $m
                | if $m == null then null
                  else
                    (($m.t // "00:00:00") | if length == 5 then . + ":00" else . end) as $t
                    | (($m.z // "Z") | if . == "Z" or . == "UTC" then 0
                        else (.[1:] | gsub(":"; "")) as $o
                          | ((if (.[0:1]) == "-" then -1 else 1 end)
                             * (($o[0:2] | tonumber) * 3600 + ((if ($o | length) >= 4 then $o[2:4] else "00" end) | tonumber) * 60))
                        end) as $off
                    | ((($m.d + "T" + $t + "Z") | fromdateiso8601) - $off) * 1000
                      + (((($m.f // "") + "000")[0:3]) | tonumber)
                  end
              end
            else null end;
          def to_iso($ts):
            to_epoch_ms($ts) as $ms
            | if $ms == null then null
              else ($ms / 1000 | floor) as $s
                | ($s | todate | rtrimstr("Z")) + "."
                  + ((1000 + (($ms - $s * 1000) | floor)) | tostring | .[1:]) + "Z"
              end;

          . as $r
          | ($r.attributes // {}) as $a
          | ($a.coordinates[0].representations[0].dependency // {}) as $dep
          | ( [ $a.problems[]? | select(.source == "NVD") | .id ] | first ) as $cve
          | ( [ $a.classes[]?  | select(.source == "CWE") | .id ] | first ) as $cwe
          | ( [ $a.severities[]? | select(.score != null) | .score ] | first ) as $cvss
          | {
              "@timestamp": (to_iso($a.updated_at) // to_iso($a.created_at)),
              "ecs": { "version": "9.5.0" },
              "event": {
                "kind": "alert",
                "category": [ "vulnerability" ],
                "type": [ "info" ],
                "outcome": "unknown",
                "id": $r.id,
                "created": to_iso($a.created_at),
                "provider": "snyk",
                "module": "snyk",
                "dataset": "snyk.issues",
                "severity": (
                  { "info": 1, "low": 2, "medium": 3, "high": 4, "critical": 5 }[$a.effective_severity_level] // 0
                ),
                "url": ($a.problems[0].url // null),
                "reference": ($a.problems[0].url // null)
              },
              "vulnerability": {
                "id": ($cve // $a.key),
                "enumeration": (if $cve != null then "CVE" else null end),
                "classification": (if $cwe != null then "CWE" else null end),
                "reference": ($a.problems[0].url // null),
                "report_id": $a.key,
                "description": $a.description,
                "category": [ $a.type ],
                "severity": $a.effective_severity_level,
                "status": $a.status,
                "scanner": { "vendor": "Snyk" },
                "score": (
                  if $cvss != null then { "base": $cvss, "version": "3.1" } else null end
                )
              },
              "package": {
                "name": $dep.package_name,
                "version": $dep.package_version
              },
              "message": $a.title,
              "tags": [ $a.type ],
              "related": {
                "hosts": ( [ $dep.package_name ] | map(select(. != null)) | unique )
              }
            }
            | walk( if type == "object" then with_entries(select(.value != null and .value != [] and .value != {} and .value != "")) else . end )
