name: "Wiz Cloud Configuration Findings to ECS v9.5.0"
description: "Maps Wiz Cloud Configuration Findings records into Elastic Common Schema (ECS) v9.5.0, populating event categorization, rule.*, cloud.*, host.*, and related.* field groups."
author: "Monad"
contributors:
  - "https://github.com/behobu"
inputs:
  - "wiz-cloud-configuration-findings"
tags:
  - "v9.5.0"
  - "ecs"
  - "wiz"
  - "cloud-configuration-findings"
config:
  operations:
    - operation: "jq"
      arguments:
        key: ""
        query: |
          # ---------------------------------------------------------------
          # Wiz Cloud Configuration Findings -> ECS v9.5.0 (nested)
          # event.kind=alert, event.category=[configuration], event.type=[info]
          # One jq pass; single end-of-pipeline prune.
          # ---------------------------------------------------------------
          def to_epoch_ms($ts):
            def _num_ms($n):
              if   $n >= 1e17 then ($n / 1000000 | floor)
              elif $n >= 1e14 then ($n / 1000 | floor)
              elif $n >= 1e11 then ($n | floor)
              else ($n * 1000 | floor) end;
            if $ts == null or $ts == "" then null
            elif ($ts | type) == "number" then _num_ms($ts)
            elif ($ts | type) == "object" then
              (if ($ts.seconds // null) == null then null
               else ($ts.seconds * 1000 + ((($ts.nanos // 0) / 1000000) | floor)) end)
            elif ($ts | type) == "string" then
              if ($ts | test("^-?[0-9]+(\\.[0-9]+)?$")) then _num_ms($ts | tonumber)
              else
                ([$ts | ascii_upcase | capture("^(?<d>[0-9]{4}-[0-9]{2}-[0-9]{2})(?:[T ](?<t>[0-9]{2}:[0-9]{2}(?::[0-9]{2})?)(?:[.,](?<f>[0-9]+))?)? ?(?<z>Z|UTC|[+-][0-9]{2}(?::?[0-9]{2})?)?$")] | first) as $m
                | if $m == null then null
                  else
                    (($m.t // "00:00:00") | if length == 5 then . + ":00" else . end) as $t
                    | (($m.z // "Z") | if . == "Z" or . == "UTC" then 0
                        else (.[1:] | gsub(":"; "")) as $o
                          | ((if (.[0:1]) == "-" then -1 else 1 end)
                             * (($o[0:2] | tonumber) * 3600 + ((if ($o | length) >= 4 then $o[2:4] else "00" end) | tonumber) * 60))
                        end) as $off
                    | ((($m.d + "T" + $t + "Z") | fromdateiso8601) - $off) * 1000
                      + (((($m.f // "") + "000")[0:3]) | tonumber)
                  end
              end
            else null end;
          def to_iso($ts):
            to_epoch_ms($ts) as $ms
            | if $ms == null then null
              else ($ms / 1000 | floor) as $s
                | ($s | todate | rtrimstr("Z")) + "."
                  + ((1000 + (($ms - $s * 1000) | floor)) | tostring | .[1:]) + "Z"
              end;

          . as $r
          | ($r.resource // {}) as $res
          | ($r.rule // {}) as $rule
          | (($r.securitySubCategories // [])[0]) as $ssc
          | {
              "@timestamp": (to_iso($r.firstSeenAt // $r.analyzedAt)),
              "ecs": { "version": "9.5.0" },

              "event": {
                "kind": "alert",
                "category": [ "configuration" ],
                "type": [ "info" ],
                "outcome": (
                  { "PASS": "success", "FAIL": "failure" }[($r.result // "") | ascii_upcase] // "unknown"
                ),
                "id": ($r.id // null),
                "provider": "wiz-cloud-configuration-findings",
                "module": "wiz",
                "dataset": "wiz.cloud_configuration_findings",
                "severity": (
                  { "INFORMATIONAL": 1, "LOW": 21, "MEDIUM": 47, "HIGH": 73, "CRITICAL": 99 }[($r.severity // "") | ascii_upcase] // 0
                ),
                "created": (to_iso($r.firstSeenAt)),
                "reason": ($rule.name // null),
                "action": ($r.status // null)
              },

              "message": ($rule.name // null),

              "rule": {
                "id": ($rule.id // null),
                "name": ($rule.name // null),
                "description": ($rule.description // null),
                "reference": ($rule.shortId // null),
                "ruleset": ($ssc.category.framework.name // null),
                "category": ($ssc.category.name // null),
                "author": [ "Wiz" ]
              },

              "cloud": {
                "provider": (($res.cloudPlatform // null) | if . == null then null else ascii_downcase end),
                "region": ($res.region // null),
                "account": {
                  "id": ($res.subscription.externalId // null),
                  "name": ($res.subscription.name // null)
                }
              },

              "host": {
                "id": ($res.id // null),
                "name": ($res.name // null),
                "type": ($res.nativeType // $res.type // null)
              },

              "observer": {
                "vendor": "Wiz",
                "product": "Wiz",
                "type": "cspm"
              },

              "tags": (
                [ ($r.severity // empty), ($r.status // empty) ]
                | map(select(. != null)) | if length == 0 then null else . end
              ),

              "related": {
                "hosts": (
                  [ ($res.name // empty) ] | map(select(. != null)) | unique
                  | if length == 0 then null else . end
                )
              }
            }
          | walk(
              if type == "object" then
                with_entries(select(.value != null and .value != {} and .value != []))
              else . end
            )
