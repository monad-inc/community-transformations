name: "OpenAI Enterprise Audit Logs to Tarsal"
description: "Transforms OpenAI Enterprise Audit Logs into Tarsal Schema"
author: "Monad"
contributors:
  - "https://github.com/saikapuluru99"
  - "https://github.com/behobu"
inputs:
  - "openai-enterprise-audit-logs"
tags:
  - "v1.0.0"
  - "openai"
  - "tarsal"
config:
  operations:
    - operation: "jq"
      arguments:
        key: ""
        query: |
          # effective_at is Unix seconds. Session actors carry the user and IP
          # under actor.session; API-key actors carry the user (no IP) under
          # actor.api_key.
          {
            "data": . + {
                "t_parse_time": now | strftime("%Y-%m-%dT%H:%M:%S.%fZ"),
                "t_event_time": (.effective_at? // empty | strftime("%Y-%m-%dT%H:%M:%S.%fZ")) // null,
                "t_ip_address": .actor?.session?.ip_address // null,
                "t_email_address": .actor?.session?.user?.email // .actor?.api_key?.user?.email // null
            }
          }
