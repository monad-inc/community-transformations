name: "Vercel User Events to Tarsal"
description: "Transforms Vercel User Events into Tarsal Schema"
author: "Monad"
contributors:
  - "https://github.com/saikapuluru99"
  - "https://github.com/behobu"
inputs:
  - "vercel-user-events"
tags:
  - "v1.0.0"
  - "vercel"
  - "tarsal"
config:
  operations:
    - operation: "jq"
      arguments:
        key: ""
        query: |
          # Vercel user events (GET /v3/events) carry no IP address field.
          # The actor's email is on user (when the principal is a user) or
          # principal.
          {
            "data": . + {
                "t_parse_time": now | strftime("%Y-%m-%dT%H:%M:%S.%fZ"),
                "t_event_time": (.createdAt / 1000) | strftime("%Y-%m-%dT%H:%M:%S.%fZ"),
                "t_ip_address": null,
                "t_email_address": .user?.email // .principal?.email // null
            }
          }
