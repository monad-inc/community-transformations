name: "GitHub Audit Logs to Tarsal"
description: "Transforms GitHub Enterprise audit logs into Tarsal Schema"
author: "Monad"
contributors:
  - "https://github.com/saikapuluru99"
  - "https://github.com/behobu"
inputs:
  - "github-audit-logs"
tags:
  - "v1.0.0"
  - "github"
  - "tarsal"
config:
  operations:
    - operation: "jq"
      arguments:
        key: ""
        query: |
          # The input marshals each entry with go-github, which writes
          # @timestamp and created_at as RFC 3339 strings; its synthetic
          # records carry them as Unix milliseconds. Accept both. Prefer
          # @timestamp, as the input does: git events have no created_at.
          # Milliseconds are formatted with integer math so they render
          # exactly (dividing by 1000 turns .153 into .152999).
          def tarsal_time:
            if type == "string" then .
            elif type == "number" then
              (. / 1000 | floor | strftime("%Y-%m-%dT%H:%M:%S"))
              + "." + ("00" + (. % 1000 | floor | tostring) | .[-3:]) + "Z"
            else null
            end;
          {
            "data": (. + {
                "t_parse_time": now | strftime("%Y-%m-%dT%H:%M:%S.%fZ"),
                "t_event_time": ((.["@timestamp"] // .created_at) | tarsal_time),
                "t_ip_address": .actor_ip,
                "t_email_address": .data?.email
            })
          }
